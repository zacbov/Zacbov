# =============================================================
#  Inky Bird Frame — configuration (côté Raspberry Pi)
# =============================================================
#  Ce fichier NE DOIT PAS être partagé / versionné (voir .gitignore).
#  C'est ici, et nulle part dans le code, que vivent les chemins
#  et les clés d'API.
# -------------------------------------------------------------

[birdnet]
# Chemin de la base SQLite de BirdNET-Go.
# Au premier lancement sur le Pi, vérifie le vrai chemin avec :
#   find ~/birdnet-go-app -name '*.db'
# et corrige ci-dessous si besoin.
db_path   = /home/pi/birdnet-go-app/data/birdnet.db

# Dossier où BirdNET-Go range les extraits audio des détections.
clips_dir = /home/pi/birdnet-go-app/data/clips

# --- Surcharges du schéma (optionnel) ---
# Laisse VIDE pour laisser le module deviner tout seul le nom de la
# table et des colonnes. Ne remplis ceci que si l'auto-détection se
# trompe (le script inspect_db.py t'affichera les vrais noms).
table          =
col_common     =
col_scientific =
col_confidence =
col_date       =
col_time       =
col_clip       =

[display]
width  = 800
height = 480
# Passe à true si l'image sort en négatif sur l'écran.
invert = false
# 0 ou 180 selon le sens de montage du cadre.
rotate = 0
# Durée max d'audio analysée pour le sonagramme (secondes).
max_spectrogram_seconds = 5.0
# Fréquence haute affichée sur le sonagramme (Hz). Les chants
# d'oiseaux tiennent quasiment tous sous 12 kHz.
freq_max_hz = 12000

[server]
host = 0.0.0.0
# NB : BirdNET-Go occupe déjà le port 8080. On prend 8090.
port = 8090
# On ne re-génère l'image que si une nouvelle détection est arrivée
# OU si le cache a dépassé ce nombre de secondes.
cache_seconds = 30

[xenocanto]
# Clé API v3 (requise pour télécharger depuis oct. 2025).
# Colle-la ici ; ce fichier reste hors du dépôt (voir .gitignore).
api_key =

# Quand utiliser le chant de RÉFÉRENCE (xeno-canto) plutôt que le
# sonagramme de ta propre détection :
#   fallback -> référence seulement si pas de clip local (recommandé)
#   always   -> toujours la référence (chant "type" de l'espèce)
#   never    -> jamais (désactive xeno-canto)
use_reference = fallback

# Type d'enregistrement recherché (song = chant ; call = cri).
type = song

# Dossier de cache des références (audio + sonagrammes + crédits).
# Laisse vide pour utiliser ./refs
cache_dir =
