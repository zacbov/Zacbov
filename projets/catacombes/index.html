let hpGhost=1;
function hud(){
  const P=G.p;
  document.getElementById('strata').textContent=G.st.name+' · '+roman(G.depth);
  document.getElementById('statline').textContent='ATQ '+Math.round(playerDmg())+' · DÉF '+Math.round(playerDef());
  document.getElementById('goldline').textContent=G.gold+' or';
  document.getElementById('hptxt').textContent=Math.max(0,Math.round(P.hp))+'/'+Math.round(P.mhp);
  const r=clamp(P.hp/P.mhp,0,1);
  document.getElementById('hpf').style.width=(r*100)+'%';
  hpGhost=Math.max(r,hpGhost-0.006);
  document.getElementById('hpg').style.width=(hpGhost*100)+'%';
  document.getElementById('tqf').style.width=(P.torch/P.torchMax*100)+'%';
  document.getElementById('rankl').textContent='rang '+P.level;
  document.getElementById('xpf').style.width=clamp(P.xp/P.next,0,1)*100+'%';
  document.getElementById('xptxt').textContent=Math.round(P.xp)+'/'+P.next;
  const s=Math.floor(G.time);
  document.getElementById('clock').textContent=((s/60)|0)+':'+String(s%60).padStart(2,'0');
  /* pastilles d'état */
  const pips=document.getElementById('pips');
  let h='';
  for(const k in P.st){ const S=STATUS[k];
    h+='<span class="pip" style="color:'+S.col+';border-color:'+S.col+'55">'+S.n+' '+Math.ceil(P.st[k])+'</span>'; }
  if(P.torch<=0) h+='<span class="pip" style="color:#6a5f70;border-color:#6a5f7055">OBSCURITÉ</span>';
  if(pips._h!==h){ pips._h=h; pips.innerHTML=h; }
  /* capacités */
  for(let i=0;i<G.spells.length;i++){
    const el=document.getElementById('ab'+i); if(!el) continue;
    const k=G.cool[i]/(SPELLS[G.spells[i]].cd*(G.p.base.cdr||1));
    el.querySelector('.cd').style.height=Math.max(0,k*100)+'%';
    el.classList.toggle('rdy',G.cool[i]<=0);
  }
  /* bouton descendre */
  const onStair=tileAt(P.x,P.y)===STAIR;
  document.getElementById('bDown').classList.toggle('hide',!onStair);
  const b=document.getElementById('badge');
  b.style.display=G.bag.length?'block':'none'; b.textContent=G.bag.length;
}

/* ==========================================================================
   OBJETS — malédictions et bénédictions
   ========================================================================== */
function blessTag(it){
  if(!it.known) return '<span class="tg n">NON IDENTIFIÉ</span>';
  if(it.bless>0) return '<span class="tg b">BÉNI</span>';
  if(it.bless<0) return '<span class="tg c">MAUDIT</span>';
  return '';
}
function label(it){
  if(it.t==='potion') return G.known[it.k]?it.n:('potion '+G.pcol[it.k]);
  if(it.t==='scroll') return G.known[it.k]?it.n:('parchemin « '+G.sname[it.k]+' »');
  if(it.t==='gold') return it.n+' ('+it.amt+' or)';
  return it.n;
}
function takeItem(it){
  if(it.t==='gold'){ G.gold+=it.amt; say('+'+it.amt+' pièces.','mine','hi'); return true; }
  if(G.bag.length>=16){ if(!G._fullSaid){G._fullSaid=1;setTimeout(()=>G._fullSaid=0,3000);
    say('La besace déborde.','self','bad');} return false; }
  G.bag.push(it); say('Ramassé : '+label(it)+'.','mine');
  return true;
}
const SLOT={weapon:'weapon',armor:'armor',ring:'ring',amulet:'amulet'};
function equip(it){
  const slot=SLOT[it.t]||'weapon';
  const old=G[slot];
  if(old&&old.bless<0&&old.known){ say('Impossible : '+old.n+' est maudit et colle à vous.','self','bad'); return false; }
  G[slot]=it;
  if(!it.known){
    it.known=true;
    if(it.bless<0){ say(it.n+' se referme sur vous. C\'est une malédiction.','self','bad');
      addStatus(G.p,'maudit',9999); G.flash=.4; }
    else if(it.bless>0) say(it.n+' vous accepte. Elle est bénie.','self','good');
  }
  if(old){ old.known=true; G.bag.push(old); }
  rebuildLoadout();
  return true;
}
function dropBag(i){
  const it=G.bag[i]; if(!it) return;
  G.bag.splice(i,1);
  const a=Math.atan2(G.p.fy,G.p.fx)+rf(-.7,.7);
  dropItem(it, G.p.x+Math.cos(a)*0.85, G.p.y+Math.sin(a)*0.85);
  G.items[G.items.length-1].cool=1.4;   // le temps de s'écarter
  say('Vous laissez '+label(it)+' au sol.','mine');
  renderInv();
}
function unequip(slot){
  const it=G[slot]; if(!it) return;
  if(it.bless<0 && it.known){ say(it.n+' est maudit et ne se retire pas.','self','bad'); return; }
  if(slot==='weapon'&&!G.bag.length&&false) return;
  if(G.bag.length>=16){ say('Votre besace est pleine.','self','bad'); return; }
  G[slot]=null; it.known=true; G.bag.push(it);
  say('Vous retirez '+it.n+'.','mine');
  rebuildLoadout(); renderInv();
}
function useItem(i){
  const it=G.bag[i]; if(!it) return;
  if(SLOT[it.t]){
    G.bag.splice(i,1);
    if(!equip(it)) G.bag.splice(i,0,it);
    else say('Vous portez '+it.n+'.','mine','good');
    renderInv(); return;
  }
  if(it.t==='torch'){ G.bag.splice(i,1); G.p.torch=Math.min(G.p.torchMax,G.p.torch+55);
    say('La flamme repart, haute et jaune.','self','good'); renderInv(); return; }
  if(it.t==='potion'){ G.bag.splice(i,1); G.known[it.k]=1; quaff(it); renderInv(); return; }
  if(it.t==='scroll'){ G.bag.splice(i,1); G.known[it.k]=1; readScroll(it); renderInv(); return; }
}
function quaff(it){
  const P=G.p;
  switch(it.k){
    case 'heal': P.hp=Math.min(P.mhp,P.hp+45); say('Chaleur brutale. Les plaies se referment.','self','good'); break;
    case 'greater': P.hp=P.mhp; say('Tout votre corps se recompose.','self','good'); break;
    case 'might': addStatus(P,'force',20); break;
    case 'haste': addStatus(P,'hate',18); break;
    case 'vita': P.mhp+=12; P.hp+=12; say('Vous respirez plus large.','self','good'); break;
    case 'sight': addStatus(P,'vision',30); G.seen.fill(1); say('Le niveau s\'imprime derrière vos yeux.','self','good'); break;
    case 'venom': addStatus(P,'poison',14); say('Amer. Trop tard.','self','bad'); break;
    case 'blind': P.torch=Math.max(0,P.torch-45); say('Une fumée noire étouffe la flamme.','self','bad'); break;
    case 'cure': P.st={}; say('Votre sang redevient le vôtre.','self','good'); break;
  }
}
function readScroll(it){
  const P=G.p;
  switch(it.k){
    case 'ident': Object.keys(G.pcol).forEach(k=>G.known[k]=1); Object.keys(G.sname).forEach(k=>G.known[k]=1);
      if(G.weapon)G.weapon.known=true; if(G.armor)G.armor.known=true;
      G.bag.forEach(o=>o.known=true);
      say('Toutes les étiquettes deviennent lisibles.','self','good'); break;
    case 'uncurse': {
      let n=0;
      [G.weapon,G.armor,...G.bag].forEach(o=>{ if(o&&o.bless<0){o.bless=0;n++;} });
      delete P.st.maudit;
      say(n?'Les liens se rompent ('+n+' objets délivrés).':'Rien ne vous retenait.','self','good'); break; }
    case 'tele': {
      for(let t=0;t<600;t++){ const x=rf(1,MW-2), y=rf(1,MH-2);
        if(!solidAt(x,y)){ P.x=x; P.y=y; break; } }
      computeFOV(); say('Le sol se dérobe et vous êtes ailleurs.','self','good'); break; }
    case 'map': G.seen.fill(1); say('Les murs se dessinent d\'eux-mêmes.','self','good'); break;
    case 'fire': {
      ring(P.x,P.y,'#ffcf7a',5); let n=0;
      for(const m of G.mobs){ const d=Math.hypot(m.x-P.x,m.y-P.y);
        if(d<5){ hurtMob(m,60+G.depth*10); addStatus(m,'brulure',6); popNum(m.x,m.y,'FEU','#ffcf7a',1.1); n++; } }
      G.flash=1; G.shake=.8;
      say(n?'Tout s\'embrase — '+n+' pris dans la nappe.':'La flamme ne trouve personne.','self','hi'); break; }
    case 'terror': {
      let n=0; for(const m of G.mobs){ if(Math.hypot(m.x-P.x,m.y-P.y)<8){ m.fear=6; n++; } }
      say(n?'Un cri sans bouche. Ils refluent.':'Personne pour vous entendre.','self','good'); break; }
    case 'wrath': {
      let n=0;
      for(const m of G.mobs){ if(m.hp<m.mhp*0.5 && Math.hypot(m.x-P.x,m.y-P.y)<9){
        hurtMob(m,m.mhp*0.75); ring(m.x,m.y,'#bfe0ff',1.4); n++; } }
      G.flash=1; say(n?'La foudre choisit les blessés ('+n+').':'Aucun blessé à foudroyer.','self','hi'); break; }
  }
}

/* ---------- panneau besace ---------- */
function openInv(){ if(!G||G.dead) return; G.paused=true;
  document.getElementById('inv').classList.add('on'); renderInv(); }
function tryBoon(){ if(G&&G.boonQ&&!G.paused&&!G.dead) offerBoon(); }
function closeInv(){ if(!G) return; G.paused=false; LAST=performance.now();
  document.getElementById('inv').classList.remove('on'); }
function renderInv(){
  const L=document.getElementById('invlist');
  let h='<div class="sub">porté</div>';
  h+=slotRow(G.weapon,'weapon')+slotRow(G.armor,'armor')+slotRow(G.ring,'ring')+slotRow(G.amulet,'amulet');
  h+='<div class="sub" style="margin-top:10px">besace ('+G.bag.length+'/16) — touchez pour utiliser, JETER pour vider</div>';
  if(!G.bag.length) h+='<div class="empty">Rien. Le sac est plat.</div>';
  G.bag.forEach((it,i)=>{
    const idd='ic'+i;
    const known=(it.t==='potion'||it.t==='scroll')?G.known[it.k]:true;
    let d = known&&it.e ? it.e : (it.desc||'');
    if(it.t==='potion'&&!known) d='effet inconnu — à vos risques';
    if(it.t==='scroll'&&!known) d='texte illisible — à vos risques';
    h+='<div class="it"><canvas id="'+idd+'" width="52" height="52" onclick="useItem('+i+')"></canvas>'+
       '<div style="flex:1" onclick="useItem('+i+')"><div class="nm">'+rarName(it)+(SLOT[it.t]?blessTag(it):'')+'</div>'+
       '<div class="ds">'+d+grantLines(it)+'</div></div>'+
       '<div class="drop" onclick="dropBag('+i+')">JETER</div></div>';
  });
  L.innerHTML=h;
  if(G.weapon) paintIcon('icW',G.weapon);
  if(G.armor) paintIcon('icA',G.armor);
  if(G.ring) paintIcon('icR',G.ring);
  if(G.amulet) paintIcon('icM',G.amulet);
  G.bag.forEach((it,i)=>paintIcon('ic'+i,it));
}
const SLOTIC={weapon:'W',armor:'A',ring:'R',amulet:'M'};
const SLOTLB={weapon:'arme',armor:'armure',ring:'anneau',amulet:'amulette'};
function rarName(it){
  const r=it.rar;
  if(r===undefined) return it.n ? cap(label(it)) : label(it);
  return '<span style="color:'+RAR[r].c+'">'+cap(it.n)+'</span>'+
         '<span class="tg" style="color:'+RAR[r].c+';border-color:'+RAR[r].c+'66">'+RAR[r].n.toUpperCase()+'</span>';
}
function grantLines(it){
  let h='';
  if(it.spells&&it.spells.length){
    h+='<br>'+it.spells.map(id=>'<span style="color:var(--amber)">'+SPELLS[id].ic+' '+SPELLS[id].n+'</span>').join(' · ');
  }
  if(it.pass&&it.pass.length){
    h+='<br>'+it.pass.map(id=>'<span style="color:#8fd4c0">'+PASS[id].ic+' '+PASS[id].n+'</span>').join(' · ');
  }
  return h;
}
function slotRow(it,kind){
  if(!it) return '';
  const geo = kind==='weapon'
    ? 'portée '+it.rng.toFixed(2)+' · cadence '+it.cd.toFixed(2)+'s · '+(it.arc>1.5?'arc très large':it.arc>0.9?'arc large':'arc étroit')
    : kind==='armor'   ? 'défense '+it.def
    : kind==='ring'    ? 'vitalité +'+(it.hp||0)
    :                    'défense +'+(it.def||0);
  return '<div class="it"><canvas id="ic'+SLOTIC[kind]+'" width="52" height="52"></canvas><div style="flex:1">'+
    '<div class="nm">'+rarName(it)+blessTag(it)+'</div>'+
    '<div class="ds"><span style="color:#6a5f70">'+SLOTLB[kind]+'</span> — '+(it.desc||'')+
    '<br><span style="color:#8f8577">'+geo+'</span>'+grantLines(it)+'</div></div>'+
    (kind==='weapon'?'':'<div class="drop unequip" onclick="unequip(\''+kind+'\')">RETIRER</div>')+
    '</div>';
}
function paintIcon(id,it){
  const c=document.getElementById(id); if(!c) return;
  const g=c.getContext('2d');
  cx=g;                                   // les fonctions de dessin écrivent sur cx
  g.clearRect(0,0,52,52);
  g.save(); g.scale(52,52); (ISPR[it.t]||ISPR.gold)(icol(it)); g.restore();
  cx=MAINCX;
}

/* ==========================================================================
   DESCENTE — la profondeur doit se voir
   ========================================================================== */
function descend(){
  if(!G||G.dead||G.paused) return;
  if(tileAt(G.p.x,G.p.y)!==STAIR) return;
  const boss=G.mobs.find(m=>m.boss);
  if(boss){ say('Quelque chose barre le passage. Il faut l\'abattre.','self','bad'); return; }
  if(G.depth>=MAXDEPTH) return;
  G.depth++;
  G.paused=true;
  const st=strataOf(G.depth), fresh=(st!==G.st);
  const d=document.getElementById('dive');
  const num=document.getElementById('dnum'), nm=document.getElementById('dname'), ln=document.getElementById('dline');
  d.classList.add('on');
  d.style.transition='opacity .55s'; d.style.opacity=1;
  num.style.transition='none'; nm.style.transition='none'; ln.style.transition='none';
  num.style.opacity=0; nm.style.opacity=0; ln.style.width='0';
  setTimeout(()=>{
    buildLevel();
    num.textContent=roman(G.depth); nm.textContent=st.name;
    num.style.transition='opacity 1s'; nm.style.transition='opacity 1.1s .25s';
    ln.style.transition='width 1.2s .1s';
    num.style.opacity=1; nm.style.opacity=1; ln.style.width='150px';
    say('— '+st.name+' · NIVEAU '+roman(G.depth)+' —','self','hi');
    if(fresh) say(strataLine(st),'amb');
    if(BOSS[G.depth]) say(BOSS[G.depth].txt,'amb','bad');
  },600);
  setTimeout(()=>{
    num.style.transition='opacity .6s'; nm.style.transition='opacity .6s';
    num.style.opacity=0; nm.style.opacity=0;
    d.style.transition='opacity .8s'; d.style.opacity=0;
  },2500);
  setTimeout(()=>{
    d.classList.remove('on'); G.paused=false; LAST=performance.now();
  },3300);
}
function strataLine(st){
  return {
   'LA CRYPTE':'La pierre est encore taillée. On voit où les hommes se sont arrêtés.',
   'L\'OSSUAIRE':'Le sol cesse d\'être du sol. Ce sont des os, jusqu\'en bas.',
   'LES FORGES NOIRES':'L\'air est chaud. Quelque chose, en dessous, travaille encore.',
   'LE SANCTUM':'Plus rien ne bouge. Tout attend.',
  }[st.name]||'';
}

/* ==========================================================================
   FIN DE PARTIE
   ========================================================================== */
function die(cause){
  G.dead=true; RUNNING=false;
  document.getElementById('ocause').textContent='tué par '+cause+' — '+G.st.name+' · '+roman(G.depth);
  epitaph(); document.getElementById('over').style.display='flex';
}
function win(){
  G.dead=true; G.won=true; RUNNING=false;
  document.getElementById('omark').textContent='✧';
  document.getElementById('otitle').textContent='LA PORTE EST ROUVERTE';
  document.getElementById('ocause').textContent='vous remontez, et personne ne vous croira';
  epitaph(); document.getElementById('over').style.display='flex';
}
function epitaph(){
  const s=Math.floor(G.time);
  document.getElementById('oepi').innerHTML=
    'rang <b>'+G.p.level+'</b> · <b>'+G.kills+'</b> mises à mort<br>'+
    '<b>'+G.gold+'</b> pièces · <b>'+((s/60)|0)+' min '+(s%60)+' s</b><br>'+
    'arme : <b>'+(G.weapon?G.weapon.n:'aucune')+'</b>';
  document.getElementById('oseed').textContent='graine : '+G.seedStr;
}

/* ==========================================================================
   ÉCRAN-TITRE : l'escalier qui descend
   ========================================================================== */
const tcv=document.getElementById('tcv'), tcx=tcv.getContext('2d');
const dust=[];
for(let i=0;i<70;i++) dust.push({x:Math.random(),y:Math.random(),s:Math.random()*.6+.2,v:Math.random()*.02+.004});
function drawTitle(ts){
  const w=tcv.width/DPR, h=tcv.height/DPR;
  tcx.setTransform(DPR,0,0,DPR,0,0);
  const g=tcx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#120d18'); g.addColorStop(.55,'#0a070e'); g.addColorStop(1,'#05040a');
  tcx.fillStyle=g; tcx.fillRect(0,0,w,h);
  const cx0=w/2, top=h*0.22, step=h*0.052, wide=w*0.62;
  const fl=0.82+Math.sin(ts/150)*0.10+Math.sin(ts/61)*0.07;
  for(let i=10;i>=0;i--){
    const y=top+i*step, k=1-i/11;
    const ww=wide*(0.34+k*0.66);
    const b=Math.pow(k,2.1)*fl;
    tcx.fillStyle='rgb('+(255*b*0.88|0)+','+(190*b*0.78|0)+','+(120*b*0.6|0)+')';
    tcx.fillRect(cx0-ww/2,y,ww,step*0.62);
    tcx.fillStyle='rgba(10,6,14,'+(0.6-b*0.4)+')';
    tcx.fillRect(cx0-ww/2,y+step*0.62,ww,step*0.38);
  }
  const rg=tcx.createRadialGradient(cx0,top+11*step,10,cx0,top+11*step,w*0.75);
  rg.addColorStop(0,'rgba(255,170,80,'+(0.16*fl)+')'); rg.addColorStop(1,'rgba(255,150,70,0)');
  tcx.fillStyle=rg; tcx.fillRect(0,0,w,h);
  tcx.fillStyle='rgba(0,0,0,.55)';
  tcx.fillRect(0,0,w,top*0.9);
  for(const d of dust){
    d.y+=d.v*0.006; if(d.y>1){d.y=0;d.x=Math.random();}
    tcx.fillStyle='rgba(232,220,192,'+(0.05+d.s*0.10)+')';
    tcx.fillRect(d.x*w,d.y*h,d.s*1.8,d.s*1.8);
  }
  const vg=tcx.createRadialGradient(cx0,h*0.5,h*0.2,cx0,h*0.5,h*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.85)');
  tcx.fillStyle=vg; tcx.fillRect(0,0,w,h);
}
