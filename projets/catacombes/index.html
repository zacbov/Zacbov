<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0810">
<title>CATACOMBES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Spectral:ital,wght@0,300;0,400;0,600;1,300&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --parch:#e8dcc0; --amber:#e0a44c; --blood:#a33d2c; --verd:#5e9a86;
  --violet:#7b6191; --dim:#6a5f70; --line:rgba(232,220,192,.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;background:#05040a;overflow:hidden;font-family:'Spectral',Georgia,serif;
  color:var(--parch);user-select:none;-webkit-user-select:none;touch-action:none;}
#frame{position:fixed;inset:0;display:flex;flex-direction:column;background:#05040a;}

/* ---------------- BANDEAU ---------------- */
#top{flex:0 0 auto;padding:calc(env(safe-area-inset-top) + 5px) 10px 5px;
  background:linear-gradient(180deg,rgba(8,6,12,.94),rgba(8,6,12,.55));z-index:5;}
.row{display:flex;align-items:center;gap:7px;}
.mono{font-family:'Share Tech Mono',monospace;font-size:10.5px;color:var(--dim);}
#strata{font-family:'IM Fell English SC',serif;font-size:13px;color:var(--amber);letter-spacing:1.5px;}
.sp{flex:1;}
.gauge{position:relative;height:9px;border:1px solid var(--line);background:#0a0810;overflow:hidden;flex:1;}
.gauge i{position:absolute;left:0;top:0;bottom:0;transition:width .12s linear;}
.gauge u{position:absolute;left:0;top:0;bottom:0;background:rgba(224,164,76,.35);text-decoration:none;
  transition:width .5s ease .12s;}
#hpf{background:linear-gradient(90deg,#6e2418,#c8503a);z-index:2;}
#hpg{z-index:1;}
#tqf{background:linear-gradient(90deg,#7a5320,var(--amber));}
#xpf{background:linear-gradient(90deg,#3d5f56,var(--verd));}
#rankl.up{color:var(--amber);}
#pips{display:flex;gap:4px;min-height:15px;margin-top:3px;flex-wrap:wrap;}
.pip{font-family:'Share Tech Mono',monospace;font-size:9px;padding:1px 5px;border:1px solid;
  border-radius:1px;letter-spacing:.5px;}

/* ---------------- SCÈNE ---------------- */
#stage{flex:1 1 auto;position:relative;min-height:0;overflow:hidden;}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
#vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(92% 62% at 50% 48%,rgba(0,0,0,0) 38%,rgba(0,0,0,.82) 100%);}
#hurt{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(80% 60% at 50% 50%,rgba(163,61,44,0) 45%,rgba(163,61,44,.75) 100%);}
#roomname{position:absolute;top:10px;left:0;right:0;text-align:center;pointer-events:none;
  font-family:'IM Fell English SC',serif;font-size:15px;color:var(--parch);letter-spacing:2px;
  opacity:0;transition:opacity .5s;text-shadow:0 2px 12px #000;}

/* ---------------- JOURNAL ---------------- */
#log{flex:0 0 auto;height:62px;overflow:hidden;padding:5px 12px 4px;
  background:linear-gradient(0deg,rgba(6,5,10,.94),rgba(6,5,10,.5));z-index:5;}
#log p{line-height:1.32;margin:0;letter-spacing:.1px;}
#log .L0{font-size:14px;color:var(--parch);}
#log .L1{font-size:12.5px;color:#b9ae98;}
#log .L2{font-size:11.5px;color:var(--dim);opacity:.7;}
#log .L3{font-size:11px;color:var(--dim);opacity:.4;}
.self{padding-left:0;}                                    /* ce qui te touche : au fer */
.mine{padding-left:14px;opacity:.86;}                     /* ce que tu infliges : en retrait */
.amb{padding-left:8px;font-style:italic;opacity:.72;}     /* l'ambiant : en italique */
.n-good{color:var(--verd);} .n-bad{color:#d4664e;} .n-hi{color:var(--amber);}

/* ---------------- COMMANDES ---------------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:6;}
#stick{position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;}
.ab{position:absolute;width:62px;height:62px;border-radius:50%;pointer-events:auto;
  border:1px solid rgba(232,220,192,.22);background:rgba(12,9,16,.55);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  backdrop-filter:blur(3px);overflow:hidden;}
.ab .ic{font-family:'Share Tech Mono',monospace;font-size:20px;color:var(--parch);line-height:1;}
.ab{width:58px;height:58px;}
.ab .lb{font-family:'Share Tech Mono',monospace;font-size:7px;color:var(--dim);
  letter-spacing:.5px;margin-top:2px;}
.ab .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(5,4,10,.72);
  transition:height .08s linear;}
.ab.rdy{border-color:rgba(224,164,76,.6);}
.ab.rdy .ic{color:var(--amber);}
.ab:active{background:rgba(224,164,76,.25);}
#pstrip{position:absolute;left:12px;bottom:118px;display:flex;flex-wrap:wrap;
  max-width:96px;gap:4px;pointer-events:none;}
#pstrip i{font-family:'Share Tech Mono',monospace;font-style:normal;font-size:12px;
  width:21px;height:21px;display:flex;align-items:center;justify-content:center;
  color:#8fd4c0;border:1px solid rgba(143,212,192,.30);background:rgba(10,20,18,.5);
  border-radius:50%;}
#btns{position:absolute;left:12px;bottom:14px;display:flex;flex-direction:column;gap:7px;pointer-events:auto;}
.sq{width:46px;height:46px;border:1px solid var(--line);background:rgba(12,9,16,.55);
  border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  backdrop-filter:blur(3px);}
.sq .ic{font-family:'Share Tech Mono',monospace;font-size:16px;}
.sq .lb{font-family:'Share Tech Mono',monospace;font-size:7px;color:var(--dim);}
.sq:active{background:rgba(224,164,76,.22);}
.sq.hot{border-color:var(--amber);animation:hot 1.1s infinite;}
@keyframes hot{50%{box-shadow:0 0 14px rgba(224,164,76,.5)}}
.sq.hide{display:none;}
#badge{position:absolute;top:-4px;right:-4px;background:var(--blood);color:#fff;
  font-family:'Share Tech Mono',monospace;font-size:8px;padding:0 3px;border-radius:2px;}

/* ---------------- PANNEAUX ---------------- */
.sheet{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;
  background:rgba(6,5,10,.97);padding:calc(env(safe-area-inset-top) + 14px) 15px 15px;}
.sheet.on{display:flex;}
.sheet h2{font-family:'IM Fell English SC',serif;font-weight:400;font-size:19px;
  color:var(--amber);letter-spacing:1.5px;}
.sheet .sub{font-family:'Share Tech Mono',monospace;font-size:9.5px;color:var(--dim);margin-bottom:10px;}
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.it{display:flex;gap:9px;align-items:flex-start;padding:8px 9px;margin-bottom:4px;
  border:1px solid var(--line);background:rgba(232,220,192,.03);border-radius:2px;}
.it:active{background:rgba(224,164,76,.15);}
.it canvas{flex:0 0 auto;width:26px;height:26px;}
.it .nm{font-size:13.5px;}
.it .ds{font-size:11px;color:var(--dim);line-height:1.3;}
.tg{font-family:'Share Tech Mono',monospace;font-size:8.5px;padding:1px 4px;margin-left:5px;
  border:1px solid;}
.tg.b{color:#8fd4c0;border-color:#3d6f61;} .tg.c{color:#d4664e;border-color:#6e2418;}
.tg.n{color:var(--amber);border-color:rgba(224,164,76,.4);}
.drop{flex:0 0 auto;align-self:center;font-family:'Share Tech Mono',monospace;font-size:8.5px;
  color:#8d6a62;border:1px solid rgba(163,61,44,.42);border-radius:2px;padding:6px 7px;
  letter-spacing:.5px;background:rgba(60,20,16,.25);}
.drop:active{background:rgba(163,61,44,.4);color:var(--parch);}
.unequip{color:#8f8577;border-color:var(--line);background:rgba(232,220,192,.04);}
.empty{color:var(--dim);font-style:italic;font-size:12.5px;padding:18px 0;text-align:center;}
.close{border:1px solid var(--line);text-align:center;padding:11px;margin-top:9px;
  font-family:'IM Fell English SC',serif;font-size:14px;letter-spacing:1px;}

#modal{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(4,3,8,.92);padding:18px;}
#modal.on{display:flex;}
.card{width:100%;max-width:370px;border:1px solid rgba(224,164,76,.4);
  background:linear-gradient(180deg,#161020,#0b0812);padding:18px 16px;
  box-shadow:0 0 70px rgba(224,164,76,.10);max-height:86%;overflow-y:auto;}
.card h3{font-family:'IM Fell English SC',serif;font-weight:400;font-size:18px;
  color:var(--amber);letter-spacing:1px;text-align:center;}
.card .cs{font-family:'Share Tech Mono',monospace;font-size:9.5px;color:var(--dim);
  text-align:center;margin-bottom:14px;}
.card p{font-size:13px;line-height:1.5;margin-bottom:12px;}
.card p.quote{font-style:italic;color:#b9ae98;border-left:2px solid rgba(224,164,76,.35);padding-left:10px;}

/* ---------------- TRANSITION DE NIVEAU ---------------- */
#dive{position:absolute;inset:0;z-index:70;background:#05040a;display:flex;
  flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;}
#dive.on{pointer-events:auto;}
#dnum{font-family:'IM Fell English SC',serif;font-size:64px;letter-spacing:8px;color:var(--parch);
  opacity:0;text-shadow:0 0 50px rgba(224,164,76,.5);}
#dname{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:5px;
  color:var(--dim);margin-top:10px;opacity:0;}
#dline{width:0;height:1px;background:var(--amber);margin-top:18px;opacity:.6;}

/* ---------------- TITRE / FIN ---------------- */
#title,#over{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;padding:0 22px calc(env(safe-area-inset-bottom) + 34px);
  text-align:center;}
#tcv{position:absolute;inset:0;width:100%;height:100%;}
#tui{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;}
#over{display:none;background:radial-gradient(70% 50% at 50% 40%,#180f16 0%,#05040a 78%);
  justify-content:center;}
h1{font-family:'IM Fell English SC',serif;font-weight:400;font-size:36px;letter-spacing:6px;
  color:var(--parch);text-shadow:0 0 30px rgba(0,0,0,.9);}
.tag{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--dim);
  letter-spacing:4px;margin:4px 0 22px;}
.big{border:1px solid var(--amber);color:var(--amber);background:rgba(224,164,76,.08);
  font-family:'IM Fell English SC',serif;font-size:16px;letter-spacing:2.5px;padding:12px 36px;
  margin-bottom:9px;backdrop-filter:blur(2px);}
.big:active{background:rgba(224,164,76,.24);}
.mini{font-family:'Share Tech Mono',monospace;font-size:9.5px;color:var(--dim);
  border:1px solid var(--line);padding:7px 15px;}
#seedin{background:rgba(11,9,16,.7);border:1px solid var(--line);color:var(--parch);
  font-family:'Share Tech Mono',monospace;font-size:10.5px;padding:7px 10px;width:165px;
  text-align:center;margin-bottom:14px;}
.epi{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--dim);
  line-height:1.95;margin-bottom:20px;}
.epi b{color:var(--parch);font-weight:400;}
.mark{font-family:'Share Tech Mono',monospace;font-size:40px;color:var(--amber);
  text-shadow:0 0 34px rgba(224,164,76,.5);}
</style>
</head>
<body>
<div id="frame">

  <div id="top">
    <div class="row">
      <span id="strata">LA CRYPTE · I</span>
      <span class="sp"></span>
      <span class="mono" id="statline">ATQ 6 · DÉF 2</span>
      <span class="mono" id="goldline">0 or</span>
    </div>
    <div class="row" style="margin-top:4px;">
      <span class="mono" id="hptxt" style="width:52px">60/60</span>
      <span class="gauge"><i id="hpg" style="width:100%"></i><i id="hpf" style="width:100%"></i></span>
    </div>
    <div class="row" style="margin-top:3px;">
      <span class="mono" id="rankl" style="width:52px">rang 1</span>
      <span class="gauge"><i id="xpf" style="width:0%"></i></span>
      <span class="mono" id="xptxt">0/26</span>
    </div>
    <div class="row" style="margin-top:3px;">
      <span class="mono" style="width:52px">torche</span>
      <span class="gauge"><i id="tqf" style="width:100%"></i></span>
      <span class="mono" id="clock">0:00</span>
    </div>
    <div id="pips"></div>
  </div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="vig"></div>
    <div id="hurt"></div>
    <div id="roomname"></div>

    <div id="hud">
      <div id="btns">
        <div class="sq" id="bInv"><div class="ic">◫</div><div class="lb">SAC</div><div id="badge" style="display:none">0</div></div>
        <div class="sq hide hot" id="bDown"><div class="ic">▼</div><div class="lb">BAS</div></div>
      </div>
      <div id="pstrip"></div>
    </div>

    <div class="sheet" id="inv">
      <h2>Besace</h2>
      <div class="sub" id="invsub">le temps est suspendu — touchez un objet pour l'utiliser</div>
      <div class="list" id="invlist"></div>
      <div class="close" onclick="closeInv()">Reprendre</div>
    </div>
  </div>

  <div id="log"></div>
  <div id="modal"><div class="card" id="mcard"></div></div>

  <div id="dive"><div id="dnum">I</div><div id="dname">LA CRYPTE</div><div id="dline"></div></div>

  <div id="title">
    <canvas id="tcv"></canvas>
    <div id="tui">
      <h1>CATACOMBES</h1>
      <div class="tag">DIX NIVEAUX · UNE SEULE VIE</div>
      <input id="seedin" placeholder="graine (facultatif)">
      <div class="big" id="bStart">DESCENDRE</div>
      <div class="mini" id="bHelp">comment jouer</div>
    </div>
  </div>

  <div id="over">
    <div class="mark" id="omark">☠</div>
    <h1 id="otitle" style="font-size:25px;letter-spacing:3px;margin-top:8px;">VOUS ÊTES MORT</h1>
    <div class="tag" id="ocause"></div>
    <div class="epi" id="oepi"></div>
    <div class="big" onclick="location.reload()">RECOMMENCER</div>
    <div class="mini" id="oseed"></div>
  </div>

</div>
<script>
"use strict";
/* ==========================================================================
   CATACOMBES  —  action-roguelike temps réel, fichier unique.
   Boucle : requestAnimationFrame à pas fixe (60 Hz logique).
   Tout est vectoriel ; aucune ressource externe.
   ========================================================================== */

/* ---------------- ALÉA DÉTERMINISTE ---------------- */
let RNG=mulberry32(1);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=n=>Math.floor(RNG()*n);
const rr=(a,b)=>a+Math.floor(RNG()*(b-a+1));
const rf=(a,b)=>a+RNG()*(b-a);
const pick=a=>a[rnd(a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function hashSeed(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const roman=n=>['','I','II','III','IV','V','VI','VII','VIII','IX','X'][n]||''+n;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* ---------------- CARTE ---------------- */
const MW=52, MH=52;
const WALL=0, FLOOR=1, RUBBLE=2, WATER=3, SPORE=4, BONES=5, ALTAR=6, STAIR=7, SHELF=8, BRAZIER=9;
const SOLID={0:1, 8:1};                    // bloque le déplacement
const OPAQUE={0:1, 8:1};                   // bloque la vue
const MAXDEPTH=10;

/* ---------------- STRATES : la couleur dit la profondeur ---------------- */
const STRATA=[
 {from:1,to:3, name:'LA CRYPTE',        wall:'#4a4060', top:'#6a5a86', floor:'#0d0a16', slab:'#1a1428',
  warm:'#ffbe6e', cold:'#3d3a72', mem:'#2a3352', amb:0.16, fog:'#0a0812'},
 {from:4,to:6, name:'L\'OSSUAIRE',      wall:'#5c5b48', top:'#7d7a5e', floor:'#0e100c', slab:'#1e2118',
  warm:'#ffd08a', cold:'#2a5147', mem:'#274a42', amb:0.13, fog:'#080e0c'},
 {from:7,to:9, name:'LES FORGES NOIRES',wall:'#5e3a38', top:'#84504a', floor:'#100809', slab:'#241615',
  warm:'#ff8f4a', cold:'#5e2630', mem:'#4a2430', amb:0.15, fog:'#100608'},
 {from:10,to:10,name:'LE SANCTUM',      wall:'#544527', top:'#786237', floor:'#0d0a04', slab:'#1e1809',
  warm:'#ffe08a', cold:'#4a3a6e', mem:'#3d3450', amb:0.13, fog:'#0a0704'},
];
const strataOf=d=>STRATA.find(s=>d>=s.from&&d<=s.to)||STRATA[0];

/* ==========================================================================
   ARMES — chacune définit une GÉOMÉTRIE d'attaque, pas un simple bonus.
   rng = portée (cases) · arc = demi-angle (rad) · cd = récupération (s)
   ========================================================================== */
const WEAPONS=[
 {id:'dague', n:'dague de fossoyeur', dmg:7,  rng:0.95, arc:0.75, cd:0.26, kb:0.6, d:1,
  crit:.28, back:3.0, desc:'Rapide et courte. Triple les dégâts par-derrière.'},
 {id:'epee',  n:'épée courte',        dmg:13, rng:1.25, arc:1.05, cd:0.44, kb:1.5, d:1,
  riposte:0.35, desc:'Équilibrée. Riposte automatique quand on vous touche de près.'},
 {id:'lance', n:'lance de garde',     dmg:16, rng:2.30, arc:0.34, cd:0.58, kb:2.0, d:2,
  pierce:true, desc:'Frappe loin et traverse tous les corps alignés. Étroite.'},
 {id:'hache', n:'hache de bourreau',  dmg:19, rng:1.45, arc:1.75, cd:0.66, kb:2.2, d:3,
  desc:'Un arc très large : fauche tout ce qui vous entoure de face.'},
 {id:'masse', n:'masse d\'armes',     dmg:17, rng:1.20, arc:0.95, cd:0.62, kb:5.0, d:3,
  stun:0.85, desc:'Repousse violemment et étourdit. Sert à créer de l\'espace.'},
 {id:'fleau', n:'fléau d\'ossuaire',  dmg:31, rng:1.55, arc:1.45, cd:0.82, kb:3.0, d:5,
  wild:.16, desc:'Dévastateur, mais vous vous blessez une fois sur six.'},
 {id:'faux',  n:'faux du moissonneur',dmg:22, rng:1.70, arc:2.40, cd:0.70, kb:1.6, d:6,
  leech:.20, desc:'Presque un tour complet. Vous rend un cinquième des dégâts.'},
 {id:'espadon',n:'espadon du Gardien',dmg:40, rng:1.95, arc:1.30, cd:0.88, kb:3.4, d:8,
  desc:'Lourd, lent, définitif.'},
 {id:'rapiere',n:'rapière d\'argent', dmg:15, rng:1.60, arc:0.50, cd:0.30, kb:0.8, d:7,
  crit:.34, desc:'Piqûres en rafale. Terrible sur ce qui n\'est pas mort deux fois.'},
];
const ARMORS=[
 {id:'haillon',n:'haillons cuirassés', def:2,  d:1, desc:'À peine mieux que rien.'},
 {id:'cuir',   n:'cuir bouilli',       def:5,  d:1, spd:0.1, desc:'Léger, un peu de vitesse.'},
 {id:'mailles',n:'cotte de mailles',   def:9,  d:3, spd:-0.15, desc:'Solide, mais elle pèse.'},
 {id:'ecailles',n:'écailles d\'ossuaire',def:13,d:5, spd:-0.2, thorns:5, desc:'Rend 5 dégâts à qui vous touche.'},
 {id:'harnois',n:'harnois de fer noir',def:18, d:7, spd:-0.35, desc:'Une forteresse ambulante.'},
 {id:'benies', n:'plates bénies',      def:15, d:8, regen:0.8, desc:'Referme lentement les plaies.'},
];


/* ==========================================================================
   RARETÉ — elle ne donne pas des chiffres, elle donne des VERBES.
   L'arme accorde 1 sort actif par palier (commun 1 … légendaire 5).
   Armure, anneau et amulette accordent le même nombre de passifs.
   ========================================================================== */
const RAR=[
 {n:'commun',      c:'#8d8798', m:1.00},
 {n:'peu commun',  c:'#5e9a86', m:1.14},
 {n:'rare',        c:'#5a86c4', m:1.30},
 {n:'épique',      c:'#9a6ec4', m:1.52},
 {n:'légendaire',  c:'#e0a44c', m:1.80},
];
function rarRoll(d){
  const b=d*1.7, r=RNG()*100;
  if(r<1.2+b*0.45) return 4;
  if(r<6+b*0.9)    return 3;
  if(r<19+b)       return 2;
  if(r<46+b)       return 1;
  return 0;
}

/* ---------------- ÉTATS TEMPORAIRES DU JOUEUR ---------------- */
function addBuff(k,v,t,n){
  const e=G.p.bf.find(b=>b.k===k);
  if(e){ e.v=Math.max(e.v,v); e.t=Math.max(e.t,t); e.n=n||e.n; }
  else G.p.bf.push({k,v,t,n:n||k});
}
function bf(k,dflt){ const e=G.p.bf.find(b=>b.k===k); return e?e.v:(dflt===undefined?0:dflt); }
function stepBuffs(dt){
  for(let i=G.p.bf.length-1;i>=0;i--){
    const b=G.p.bf[i]; b.t-=dt;
    if(b.t<=0){ if(b.k==='shield') say('Votre égide se brise.','self'); G.p.bf.splice(i,1); }
  }
}

/* ---------------- ZONES PERSISTANTES ---------------- */
function addZone(x,y,r,dur,dps,c,st){ G.zones.push({x,y,r,dur,max:dur,dps,c,st,tick:0}); }
function stepZones(dt){
  for(let i=G.zones.length-1;i>=0;i--){
    const z=G.zones[i]; z.dur-=dt; z.tick-=dt;
    if(RNG()<dt*22){ const a=RNG()*6.28, rr2=Math.sqrt(RNG())*z.r;
      G.parts.push({x:z.x+Math.cos(a)*rr2,y:z.y+Math.sin(a)*rr2,vx:rf(-.3,.3),vy:rf(-1.4,-.4),
        life:.6,max:.6,c:z.c,s:.10}); }
    if(z.tick<=0){
      z.tick=0.45;
      for(const m of G.mobs){
        if(Math.hypot(m.x-z.x,m.y-z.y)>z.r+m.r) continue;
        const d=Math.round(z.dps*0.45);
        hurtMob(m,d); popNum(m.x,m.y,d,z.c,.85);
        if(z.st) addStatus(m,z.st,2.2);
      }
    }
    if(z.dur<=0) G.zones.splice(i,1);
  }
}

/* ---------------- PROJECTILE DU JOUEUR ---------------- */
function pShot(a,speed,dmg,c,opt){
  opt=opt||{};
  G.shots.push({own:'p', x:G.p.x+Math.cos(a)*.5, y:G.p.y+Math.sin(a)*.5,
    vx:Math.cos(a)*speed, vy:Math.sin(a)*speed, dmg, c,
    life:opt.life||1.5, pierce:!!opt.pierce, r:opt.r||0.22, sh:opt.sh||'blade',
    st:opt.st, kb:opt.kb||1.2, hit:new Set()});
}

/* ---------------- PRIMITIVES DE SORT ---------------- */
function sNova(r,mul,c,kb,st,stunT){
  const P=G.p; let n=0;
  ring(P.x,P.y,c,r);
  for(const m of G.mobs){
    const d=Math.hypot(m.x-P.x,m.y-P.y);
    if(d>r+m.r) continue; n++;
    const dmg=Math.round(playerDmg()*mul);
    hurtMob(m,dmg); popNum(m.x,m.y,dmg,c,1.05);
    const a=Math.atan2(m.y-P.y,m.x-P.x);
    m.kbx+=Math.cos(a)*kb; m.kby+=Math.sin(a)*kb;
    if(st) addStatus(m,st,3.2);
    if(stunT) addStatus(m,'etourdi',stunT);
    blood(m.x,m.y,m.c,7,a);
  }
  for(let k=0;k<26;k++){ const a=k/26*6.28;
    G.parts.push({x:P.x+Math.cos(a)*r*.55,y:P.y+Math.sin(a)*r*.55,
      vx:Math.cos(a)*r*2.1,vy:Math.sin(a)*r*2.1,life:.34,max:.34,c,s:.10}); }
  G.shake=Math.max(G.shake,.28+r*.07);
  return n;
}
function sCone(r,half,mul,c,kb,stunT){
  const P=G.p, fa=Math.atan2(P.fy,P.fx); let n=0;
  for(const m of G.mobs){
    const d=Math.hypot(m.x-P.x,m.y-P.y);
    if(d>r+m.r) continue;
    let da=Math.atan2(m.y-P.y,m.x-P.x)-fa;
    while(da>Math.PI)da-=6.2832; while(da<-Math.PI)da+=6.2832;
    if(Math.abs(da)>half) continue; n++;
    const dmg=Math.round(playerDmg()*mul);
    hurtMob(m,dmg); popNum(m.x,m.y,dmg,c,1.1);
    m.kbx+=Math.cos(fa)*kb; m.kby+=Math.sin(fa)*kb;
    if(stunT) addStatus(m,'etourdi',stunT);
    blood(m.x,m.y,m.c,8,fa);
  }
  for(let k=0;k<20;k++){ const a=fa+rf(-half,half), s=rf(2,6);
    G.parts.push({x:P.x,y:P.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.32,max:.32,c,s:.11}); }
  G.shake=Math.max(G.shake,.3);
  return n;
}
function sDash(dist,mul,c,pierce){
  const P=G.p;
  P.dashT=0.20; P._dashHit=new Set(); P._dashMul=mul; P._dashPierce=pierce;
  const a=Math.atan2(P.fy,P.fx);
  P.dvx=Math.cos(a)*dist/0.20; P.dvy=Math.sin(a)*dist/0.20;
  P.invT=Math.max(P.invT,0.26);
  for(let k=0;k<14;k++) G.parts.push({x:P.x,y:P.y,vx:-Math.cos(a)*rf(1,4)+rf(-1,1),
    vy:-Math.sin(a)*rf(1,4)+rf(-1,1),life:.35,max:.35,c,s:.09});
}
function sBlink(dist,c){
  const P=G.p, a=Math.atan2(P.fy,P.fx);
  let bx=P.x, by=P.y;
  for(let s=0.25;s<=dist;s+=0.25){
    const nx=P.x+Math.cos(a)*s, ny=P.y+Math.sin(a)*s;
    if(solidAt(nx,ny)) break;
    bx=nx; by=ny;
  }
  for(let k=0;k<18;k++) G.parts.push({x:P.x+rf(-.3,.3),y:P.y+rf(-.3,.3),
    vx:rf(-2,2),vy:rf(-2,2),life:.4,max:.4,c,s:.09});
  P.x=bx; P.y=by; P.invT=Math.max(P.invT,0.3);
  for(let k=0;k<18;k++) G.parts.push({x:bx+rf(-.3,.3),y:by+rf(-.3,.3),
    vx:rf(-2,2),vy:rf(-2,2),life:.4,max:.4,c,s:.09});
  computeFOV();
}
/* frappe une cible choisie : la plus faible (exécution) ou la plus proche */
function sStrike(range,mul,c,mode,stunT){
  const P=G.p; let best=null, bv=1e9;
  for(const m of G.mobs){
    const d=Math.hypot(m.x-P.x,m.y-P.y);
    if(d>range) continue;
    const v = mode==='weak' ? m.hp : d;
    if(v<bv){ bv=v; best=m; }
  }
  if(!best){ return 0; }
  const a=Math.atan2(best.y-P.y,best.x-P.x);
  const tx=best.x-Math.cos(a)*0.7, ty=best.y-Math.sin(a)*0.7;
  if(!solidAt(tx,ty)){ P.x=tx; P.y=ty; P.fx=Math.cos(a); P.fy=Math.sin(a); computeFOV(); }
  const dmg=Math.round(playerDmg()*mul);
  hurtMob(best,dmg); popNum(best.x,best.y,dmg,c,1.5);
  if(stunT) addStatus(best,'etourdi',stunT);
  blood(best.x,best.y,best.c,20,a);
  ring(best.x,best.y,c,1.5);
  G.shake=Math.max(G.shake,.7); G.flash=Math.max(G.flash,.45);
  hitstop(0.055);
  return 1;
}

    def:Math.round(1+r*2), bless:blessRoll(d), known:false,
    pass:shuffle(POOL.amulet.slice()).slice(0,r+1)};
}
function decorate(it){
  /* applique la rareté : chiffres montés, verbes accordés */
  const r=it.rar||0, m=RAR[r].m;
  if(it.t==='weapon'){
    it.dmg=Math.round(it.dmg*m);
    it.spells=FAM[WFAM[it.id]||'lame'].slice(0,r+1);
  }
  if(it.t==='armor'){
    it.def=Math.round(it.def*m);
    it.pass=shuffle(POOL.armor.slice()).slice(0,r+1);
  }
  return it;
}

/* ---------------- recalcul de la panoplie ---------------- */
function rebuildLoadout(){
  const w=G.weapon;
  G.spells=(w&&w.spells)?w.spells.slice():[];
  G.cool=G.spells.map(()=>0);
  G.pass=[];
  for(const it of [G.armor,G.ring,G.amulet]){
    if(!it||!it.pass) continue;
    for(const id of it.pass){
      if(it.bless<0 && RNG()<0.5) continue;          // un objet maudit ne tient pas ses promesses
      if(G.pass.some(q=>q.id===id)) continue;        // pas de doublon entre emplacements
      G.pass.push({id, t:(PASS[id].cd||0)*RNG()});
    }
  }
  const rh=ringHP(), prev=G.p._rhp||0;
  if(rh!==prev){ G.p.mhp+=rh-prev; G.p.hp=Math.min(G.p.mhp,G.p.hp+Math.max(0,rh-prev)); G.p._rhp=rh; }
  G.orbit = G.pass.some(p=>p.id==='orbe');
  buildSpellBar();
  refreshPassStrip();
}
function passStat(k){
  let v=0;
  for(const p of G.pass){ const P=PASS[p.id]; if(P.s&&P.s[k]!==undefined) v+= (k==='haste'||k==='torch')?0:P.s[k]; }
  return v;
}
function passMul(k,base){
  let v=base;
  for(const p of G.pass){ const P=PASS[p.id]; if(P.s&&P.s[k]!==undefined) v*=P.s[k]; }
  return v;
}
function hasPass(id){ return G.pass.some(p=>p.id===id); }

/* La galerie se repeuple : rien ne reste vide longtemps.
   Les nouveaux arrivent toujours hors du champ de vision. */
function stepPressure(dt){
  G.presT=(G.presT||0)-dt;
  if(G.presT>0) return;
  G.presT=rf(7,12);
  const cap=34+G.depth*5;
  if(G.mobs.length>=cap) return;
  const d=G.depth;
  const pool=BEAST.filter(b=>b.d<=d+1&&b.d>=d-4);
  if(!pool.length||!G.rooms.length) return;
  for(let att=0;att<26;att++){
    const R=pick(G.rooms);
    const x=R.x+rnd(R.w)+.5, y=R.y+rnd(R.h)+.5;
    if(SOLID[G.map[(y|0)*MW+(x|0)]]) continue;
    if(G.vis[(y|0)*MW+(x|0)]) continue;                 // jamais sous les yeux du joueur
    if(Math.hypot(x-G.p.x,y-G.p.y)<11) continue;
    const proto=pick(pool);
    const n=(proto.beh==='swarm')?rr(3,4):rr(1,2);
    for(let k=0;k<n;k++){
      const ox=x+rf(-1.2,1.2), oy=y+rf(-1.2,1.2);
      if(SOLID[G.map[(oy|0)*MW+(ox|0)]]) continue;
      spawnMob(proto,ox,oy);
    }
    return;
  }
}
function stepPassives(dt){
  for(const p of G.pass){
    const P=PASS[p.id];
    if(P.k!=='tick') continue;
    p.t-=dt;
    if(p.t<=0){ const r=P.f(); p.t=(r===false)?1.0:P.cd; }
  }
  if(G.orbit){
    G.orbT=(G.orbT||0)+dt*2.6;
    const ox=G.p.x+Math.cos(G.orbT)*1.5, oy=G.p.y+Math.sin(G.orbT)*1.5;
    G.orbP={x:ox,y:oy};
    for(const m of G.mobs){
      if(Math.hypot(m.x-ox,m.y-oy)>0.5+m.r) continue;
      if(m._orbCd>0) continue;
      m._orbCd=0.6;
      const d=Math.round(9+G.p.level*1.4);
      hurtMob(m,d); popNum(m.x,m.y,d,'#9d7fc4',.85);
    }
  }
  for(const m of G.mobs) if(m._orbCd>0) m._orbCd-=dt;
}
function passHook(kind,a,b){
  for(const p of G.pass){ const P=PASS[p.id]; if(P.k===kind && P.f) P.f(a,b); }
}
function healP(n){
  const P=G.p; if(P.hp>=P.mhp) return;
  P.hp=Math.min(P.mhp,P.hp+n);
  if(n>=1) popNum(P.x,P.y,'+'+Math.round(n),'#8fd4c0',.85);
}

/* ---------------- lancement d'un sort ---------------- */
function castSpell(i){
  if(!G||G.dead||G.paused) return;
  const id=G.spells[i]; if(!id) return;
  if(G.cool[i]>0) return;
  const S=SPELLS[id];
  G.cool[i]=S.cd*(G.p.base.cdr||1);
  S.f();
}

/* ---------------- barre de sorts ---------------- */
const ABPOS=[[14,16],[88,34],[34,94],[108,110],[16,176]];
function buildSpellBar(){
  const hud=document.getElementById('hud');
  [...hud.querySelectorAll('.ab')].forEach(e=>e.remove());
  G.spells.forEach((id,i)=>{
    const S=SPELLS[id];
    const el=document.createElement('div');
    el.className='ab rdy'; el.id='ab'+i;
    el.style.right=ABPOS[i][0]+'px'; el.style.bottom=ABPOS[i][1]+'px';
    el.innerHTML='<div class="ic">'+S.ic+'</div><div class="lb">'+S.n.toUpperCase()+'</div>'+
                 '<div class="cd" style="height:0"></div>';
    el.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();castSpell(i);});
    hud.appendChild(el);
  });
}
function refreshPassStrip(){
  const el=document.getElementById('pstrip');
  if(!el) return;
  el.innerHTML=G.pass.map(p=>'<i title="'+PASS[p.id].n+'">'+PASS[p.id].ic+'</i>').join('');
}

const mkPotion=k=>({t:'potion',...POTIONS.find(p=>p.k===k)});
const mkScroll=k=>({t:'scroll',...SCROLLS.find(s=>s.k===k)});

/* ==========================================================================
   GÉNÉRATION — BSP puis attribution de RÔLES aux salles
   ========================================================================== */
function buildLevel(){
  const d=G.depth; G.st=strataOf(d);
  const m=new Uint8Array(MW*MH);
  const leaves=[];
  (function split(n,dep){
    const min=8;
    if(dep>4||(n.w<min*2&&n.h<min*2)){leaves.push(n);return;}
    const horiz=n.w<n.h?true:(n.h<n.w?false:RNG()<.5);
    if(horiz){ if(n.h<min*2){leaves.push(n);return;} const c=rr(min,n.h-min);
      split({x:n.x,y:n.y,w:n.w,h:c},dep+1); split({x:n.x,y:n.y+c,w:n.w,h:n.h-c},dep+1); }
    else{ if(n.w<min*2){leaves.push(n);return;} const c=rr(min,n.w-min);
      split({x:n.x,y:n.y,w:c,h:n.h},dep+1); split({x:n.x+c,y:n.y,w:n.w-c,h:n.h},dep+1); }
  })({x:2,y:2,w:MW-4,h:MH-4},0);

  const rooms=[];
  for(const L of leaves){
    const w=rr(5,Math.max(5,L.w-2)), h=rr(5,Math.max(5,L.h-2));
    const x=L.x+rr(1,Math.max(1,L.w-w-1)), y=L.y+rr(1,Math.max(1,L.h-h-1));
    const R={x,y,w,h,cx:x+(w>>1),cy:y+(h>>1),role:'commune'};
    rooms.push(R);
    for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++) m[j*MW+i]=FLOOR;
  }
  for(let i=1;i<rooms.length;i++){
    const a=rooms[i-1], b=rooms[i];
    if(RNG()<.5){ hall(m,a.cx,b.cx,a.cy,1); hall(m,a.cy,b.cy,b.cx,0); }
    else       { hall(m,a.cy,b.cy,a.cx,0); hall(m,a.cx,b.cx,b.cy,1); }
  }
  for(let k=0;k<3&&rooms.length>3;k++){
    const a=pick(rooms), b=pick(rooms);
    hall(m,a.cx,b.cx,a.cy,1); hall(m,a.cy,b.cy,b.cx,0);
  }

  G.map=m; G.seen=new Uint8Array(MW*MH); G.vis=new Uint8Array(MW*MH);
  G.tint=new Uint8Array(MW*MH);
  G.mobs=[]; G.items=[]; G.shots=[]; G.parts=[]; G.marks=[]; G.lights=[]; G.rooms=rooms;

  /* --- entrée et escalier aux deux extrémités --- */
  const start=rooms[0], last=rooms[rooms.length-1];
  G.p.x=start.cx+.5; G.p.y=start.cy+.5;
  G.stair={x:last.cx,y:last.cy}; m[last.cy*MW+last.cx]=STAIR;
  G.lights.push({x:last.cx+.5,y:last.cy+.5,r:6.5,i:.75,fire:1,stair:1});

  /* --- attribution des rôles --- */
  const bag=[];
  for(const k in ROOMS){ if(k==='commune') continue;
    const R=ROOMS[k]; if((R.minD||1)>d) continue;
    for(let i=0;i<Math.max(1,Math.round(R.w/3));i++) bag.push(k); }
  shuffle(bag);
  const nThemed=clamp(2+Math.floor(d/2.5),2,Math.max(2,rooms.length-2));
  const idx=shuffle(rooms.map((_,i)=>i).filter(i=>i!==0&&i!==rooms.length-1)).slice(0,nThemed);
  const used={};
  for(const i of idx){
    let role=bag.pop()||'nid'; let guard=0;
    while(used[role]&&guard++<8) role=bag.pop()||'nid';
    used[role]=1; rooms[i].role=role;
  }
  if(BOSS[d]) last.role='gardien';

  for(const R of rooms) dressRoom(R,m,d);
  ensureReachable(m,start,last);

  /* --- décor de fond --- */
  for(const R of rooms){ if(R.role!=='commune') continue;
    if(RNG()<.4) for(let k=rr(1,5);k>0;k--){
      const x=R.x+rnd(R.w), y=R.y+rnd(R.h);
      if(m[y*MW+x]===FLOOR) m[y*MW+x]=RUBBLE; }
    if(RNG()<.10){ const x=R.x+rnd(R.w),y=R.y+rnd(R.h);
      if(m[y*MW+x]===FLOOR){ m[y*MW+x]=BRAZIER; G.lights.push({x:x+.5,y:y+.5,r:5.5,i:.9,fire:1}); } }
  }
  /* --- errants --- */
  const pool=BEAST.filter(b=>b.d<=d+1&&b.d>=d-4);
  const wander=rr(16,22)+Math.floor(d*3.2);
  for(let i=0;i<wander;i++){
    const R=rooms[rr(1,rooms.length-1)];
    const x=R.x+rnd(R.w)+.5, y=R.y+rnd(R.h)+.5;
    if(SOLID[m[(y|0)*MW+(x|0)]]) continue;
    if(Math.hypot(x-G.p.x,y-G.p.y)<8) continue;
    const proto=pick(pool.length?pool:BEAST.slice(0,3));
    const packN = (proto.beh==='swarm'||proto.beh==='pack') ? rr(3,5) : (RNG()<.45?rr(2,3):1);
    for(let k=0;k<packN;k++){
      const ox=x+rf(-1.4,1.4), oy=y+rf(-1.4,1.4);
      if(SOLID[m[(oy|0)*MW+(ox|0)]]) continue;
      spawnMob(proto,ox,oy);
    }
  }
  /* --- butin errant --- */
  for(let i=0;i<rr(3,5)+Math.floor(d/3);i++){
    const R=pick(rooms); const x=R.x+rnd(R.w)+.5, y=R.y+rnd(R.h)+.5;
    if(SOLID[m[(y|0)*MW+(x|0)]]) continue;
    dropItem(rollItem(d),x,y);
  }
  /* --- inscriptions --- */
  for(let i=0;i<rr(2,3);i++){
    const R=pick(rooms); const x=R.x+rnd(R.w), y=R.y+rnd(R.h);
    if(m[y*MW+x]!==FLOOR) continue;
    G.marks.push({x:x+.5,y:y+.5,txt:pick(INSCRIPT),shown:false});
  }
  /* --- gardien --- */
  if(BOSS[d]){
    const B=BOSS[d];
    spawnMob(B,last.cx+.5,last.cy-2.2,true);
  }
  computeFOV();
}

/* garantit que l'escalier reste atteignable après l'ameublement des salles */
function ensureReachable(m,start,last){
  const reach=()=>{
    const seen=new Uint8Array(MW*MH);
    const q=[start.cy*MW+start.cx]; seen[q[0]]=1;
    while(q.length){ const c=q.pop(), x=c%MW, y=(c/MW)|0;
      for(let k=0;k<4;k++){
        const nx=x+(k===0?1:k===1?-1:0), ny=y+(k===2?1:k===3?-1:0);
        if(nx<1||ny<1||nx>=MW-1||ny>=MH-1) continue;
        const id=ny*MW+nx; if(seen[id]||SOLID[m[id]]) continue;
        seen[id]=1; q.push(id); } }
    return seen[last.cy*MW+last.cx]===1;
  };
  if(reach()) return;
  for(let i=0;i<m.length;i++) if(m[i]===SHELF) m[i]=FLOOR;   // les rayonnages sont les premiers coupables
  if(reach()) return;
  hall(m,start.cx,last.cx,start.cy,1); hall(m,start.cy,last.cy,last.cx,0);
}
function hall(m,a,b,fix,horiz){
  const s=Math.min(a,b), e=Math.max(a,b);
  for(let i=s;i<=e;i++){
    const x=horiz?i:fix, y=horiz?fix:i;
    if(x>1&&y>1&&x<MW-2&&y<MH-2&&m[y*MW+x]===WALL) m[y*MW+x]=FLOOR;
  }
}

/* --- meuble une salle selon son rôle --- */
function dressRoom(R,m,d){
  const T=ROOMS[R.role]; if(!T) return;
  const cells=[];
  for(let j=R.y;j<R.y+R.h;j++)for(let i=R.x;i<R.x+R.w;i++)
    if(m[j*MW+i]===FLOOR) cells.push([i,j]);
  if(!cells.length) return;

  if(T.fill!=null){
    for(const [i,j] of cells){
      const edge=(i===R.x||j===R.y||i===R.x+R.w-1||j===R.y+R.h-1);
      if(RNG()< (edge?.45:.72)) m[j*MW+i]=T.fill;
    }
  }
  if(T.shelf){ for(const [i,j] of cells){
    if((i-R.x)%3===1 && j>R.y && j<R.y+R.h-1 && RNG()<.7) m[j*MW+i]=SHELF; } }
  if(T.altar){ m[R.cy*MW+R.cx]=ALTAR; G.lights.push({x:R.cx+.5,y:R.cy+.5,r:4.5,i:.7,col:'#c8503a'}); }
  if(T.brazier){ for(let k=0;k<2;k++){ const [i,j]=pick(cells);
    if(m[j*MW+i]===FLOOR){ m[j*MW+i]=BRAZIER; G.lights.push({x:i+.5,y:j+.5,r:6,i:1,fire:1}); } } }

  if(T.mobs){
    const n=rr(T.nmob[0],T.nmob[1]);
    for(let k=0;k<n;k++){
      const [i,j]=pick(cells);
      if(SOLID[m[j*MW+i]]) continue;
      const ok=T.mobs.map(k2=>BEAST.find(b=>b.k===k2)).filter(b=>b&&b.d<=G.depth+1);
      const fb=BEAST.filter(b=>b.d<=G.depth+1&&b.d>=G.depth-3);
      const proto=ok.length?pick(ok):(fb.length?pick(fb):BEAST[0]);
      spawnMob(proto,i+.5,j+.5);
    }
  }
  const put=(it)=>{ const [i,j]=pick(cells); if(!SOLID[m[j*MW+i]]) dropItem(it,i+.5,j+.5); };
  for(let k=0;k<(T.loot||0);k++) put(rollItem(d+1));
  for(let k=0;k<(T.scroll||0);k++) put({...mkScroll(pick(SCROLLS).k)});
  if(T.weapon) put(rollWeapon(d+2));
  if(T.gold) put({t:'gold',n:'coffre éventré',amt:rr(60,140)+d*22});
  if(T.corpse){
    const [i,j]=pick(cells); const e=pick(EPITAPH);
    G.marks.push({x:i+.5,y:j+.5,txt:e.t,name:e.n,corpse:true,shown:false});
    dropItem(rollItem(d+2),i+.5,j+.5);
    dropItem(RNG()<.5?rollWeapon(d+1):rollArmor(d+1),i+.9,j+.4);
  }
  if(T.line) R.line=T.line;
  R.label=T.name;
}

/* ---------------- butin ---------------- */
function blessRoll(d){
  const r=RNG();
  if(r<.14) return -1;                    // maudit
  if(r<.14+.10+d*.004) return 1;          // béni
  return 0;
}
function rollWeapon(d){
  const c=WEAPONS.filter(w=>w.d<=d+1&&w.d>=d-4);
  return decorate({t:'weapon',...pick(c.length?c:WEAPONS.slice(0,3)),rar:rarRoll(d),bless:blessRoll(d),known:false});
}
function rollArmor(d){
  const c=ARMORS.filter(w=>w.d<=d+1&&w.d>=d-4);
  return decorate({t:'armor',...pick(c.length?c:ARMORS.slice(0,2)),rar:rarRoll(d),bless:blessRoll(d),known:false});
}
function rollItem(d){
  const r=RNG();
  if(r<.28){ const w=[POTIONS[0],POTIONS[0],POTIONS[0],POTIONS[1],POTIONS[2],POTIONS[3],
    POTIONS[4],POTIONS[5],POTIONS[6],POTIONS[7],POTIONS[8]]; return {t:'potion',...pick(w)}; }
  if(r<.48) return {t:'scroll',...pick(SCROLLS)};
  if(r<.58) return {t:'torch',n:'torche de suif',e:'ravive la flamme'};
  if(r<.70) return rollWeapon(d);
  if(r<.82) return rollArmor(d);
  if(r<.89) return rollRing(d);
  if(r<.95) return rollAmulet(d);
  return {t:'gold',n:'bourse',amt:rr(14,38)+d*7};
}
function dropItem(it,x,y){ G.items.push({...it,x,y,bob:RNG()*6}); }

/* ---------------- créatures ---------------- */
function spawnMob(proto,x,y,boss){
  const d=G.depth, tier=proto.d||1;
  const k=boss?1:(1+Math.max(0,d-tier)*0.20);
  const m={...proto, x, y, vx:0, vy:0, boss:!!boss,
    hp:Math.round(proto.hp*k), mhp:Math.round(proto.hp*k),
    dmg:Math.round(proto.dmg*(boss?1:(1+Math.max(0,d-tier)*0.13))),
    state:'idle', t:0, wt:0, cd:0, aggroed:false, ph:RNG()*7, flash:0,
    st:{}, kbx:0, kby:0, fear:0, hitset:null, gen:0};
  G.mobs.push(m); return m;
}

/* ==========================================================================
   CHAMP DE VISION
   ========================================================================== */
function computeFOV(){
  const R=Math.max(2.2, lightRadius());
  G.vis.fill(0);
  const px=G.p.x, py=G.p.y, cx0=px|0, cy0=py|0;
  G.vis[cy0*MW+cx0]=1; G.seen[cy0*MW+cx0]=1;
  const N=200;
  for(let a=0;a<N;a++){
    const ang=a/N*6.2832, dx=Math.cos(ang)*0.42, dy=Math.sin(ang)*0.42;
    let x=px, y=py;
    for(let i=0;i<R*2.4;i++){
      x+=dx; y+=dy;
      const ix=x|0, iy=y|0;
      if(ix<0||iy<0||ix>=MW||iy>=MH) break;
      G.vis[iy*MW+ix]=1; G.seen[iy*MW+ix]=1;
      if(OPAQUE[G.map[iy*MW+ix]]) break;
    }
  }
  // sources fixes : on voit ce qu'elles éclairent si on les voit
  for(const L of G.lights){
    if(!G.vis[(L.y|0)*MW+(L.x|0)]) continue;
    for(let a=0;a<60;a++){
      const ang=a/60*6.2832, dx=Math.cos(ang)*.5, dy=Math.sin(ang)*.5;
      let x=L.x,y=L.y;
      for(let i=0;i<L.r*2;i++){ x+=dx;y+=dy; const ix=x|0,iy=y|0;
        if(ix<0||iy<0||ix>=MW||iy>=MH)break;
        G.vis[iy*MW+ix]=1; G.seen[iy*MW+ix]=1;
        if(OPAQUE[G.map[iy*MW+ix]])break; }
    }
  }
  if(G.p.st.vision) G.seen.fill(1);
}
function lightRadius(){
  const t=G.p.torch/G.p.torchMax;
  return 2.3 + t*5.6 + (G.p.base.light||0);
}

/* ==========================================================================
   COLLISION
   ========================================================================== */
const solidAt=(x,y)=>{
  const ix=x|0, iy=y|0;
  if(ix<0||iy<0||ix>=MW||iy>=MH) return true;
  return !!SOLID[G.map[iy*MW+ix]];
};
function moveEnt(e,dx,dy,r,ghost){
  if(ghost){
    e.x=clamp(e.x+dx,1,MW-2); e.y=clamp(e.y+dy,1,MH-2); return;
  }
  /* on ne teste que le bord AVANT : un corps déjà encastré peut toujours ressortir */
  if(dx){
    const s=Math.sign(dx), nx=e.x+dx, lead=nx+s*r;
    if(!solidAt(lead,e.y)&&!solidAt(lead,e.y-r*.72)&&!solidAt(lead,e.y+r*.72)) e.x=nx;
  }
  if(dy){
    const s=Math.sign(dy), ny=e.y+dy, lead=ny+s*r;
    if(!solidAt(e.x,lead)&&!solidAt(e.x-r*.72,lead)&&!solidAt(e.x+r*.72,lead)) e.y=ny;
  }
  e.x=clamp(e.x,1,MW-2); e.y=clamp(e.y,1,MH-2);
  /* filet de sécurité : jamais encastré dans un bloc */
  if(solidAt(e.x,e.y)) unstick(e);
}
function unstick(e){
  let best=null,bd=1e9;
  const cx0=e.x|0, cy0=e.y|0;
  for(let j=-2;j<=2;j++)for(let i=-2;i<=2;i++){
    const x=cx0+i+.5, y=cy0+j+.5;
    if(solidAt(x,y)) continue;
    const d=(x-e.x)*(x-e.x)+(y-e.y)*(y-e.y);
    if(d<bd){bd=d;best=[x,y];}
  }
  if(best){ e.x=best[0]; e.y=best[1]; }
}
const tileAt=(x,y)=>G.map[(y|0)*MW+(x|0)];

/* ==========================================================================
   ÉTATS (statuts)
   ========================================================================== */
function addStatus(ent,key,dur){
  const cur=ent.st[key]||0;
  ent.st[key]=Math.max(cur,dur);
  if(ent===G.p && !cur) say(STATUS[key].n.toLowerCase()+' — '+STATUS[key].desc,'self','bad');
}
function tickStatus(ent,dt){
  for(const k in ent.st){
    ent.st[k]-=dt;
    if(ent.st[k]<=0){ delete ent.st[k]; continue; }
    const S=STATUS[k];
    if(S.dps){
      if(ent===G.p) hurtPlayer(S.dps*dt, k, true);
      else hurtMob(ent, S.dps*dt, true);
    }
  }
}
function statSum(ent,field){
  let v=0; for(const k in ent.st){ const S=STATUS[k]; if(S[field]) v+=S[field]; } return v;
}
const frozen=ent=>!!ent.st.etourdi;

/* ==========================================================================
   STATISTIQUES DÉRIVÉES
   ========================================================================== */
function bmul(it){ return it.bless>0?1.25:it.bless<0?0.6:1; }
function ringHP(){ return G.ring?Math.round(G.ring.hp*bmul(G.ring)):0; }
function playerDmg(){
  const w=G.weapon;
  let d=(w?w.dmg*bmul(w):5) + G.p.level*1.6;
  d*= (G.p.st.force?STATUS.force.dmul:1);
  d*= bf('dmg',1); d*= (G.p.base.atkMul||1);
  if(hasPass('sang')) d*= 1 + (1-G.p.hp/G.p.mhp)*0.55;
  return d;
}
function playerDef(){
  let d=G.p.base.def + (G.armor?G.armor.def*bmul(G.armor):0) + G.p.level*0.7;
  d+=statSum(G.p,'def'); d+=passStat('def');
  if(G.amulet) d+=G.amulet.def*bmul(G.amulet);
  return Math.max(0,d);
}
function playerSpd(){
  let s=G.p.base.spd + (G.armor&&G.armor.spd?G.armor.spd*(G.armor.bless<0?2:1):0);
  s+=statSum(G.p,'spd'); s+=passStat('spd'); s*=bf('spd',1);
  if(tileAt(G.p.x,G.p.y)===WATER) s*=0.62;
  return Math.max(1.2,s);
}
function attackCd(){ const w=G.weapon;
  return (w?w.cd:.5)*(w&&w.bless<0?1.35:1)*passMul('haste',1)*bf('hastecd',1)*(G.p.base.haste||1); }

/* ==========================================================================
   BOUCLE
   ========================================================================== */
function frame(ts){
  requestAnimationFrame(frame);
  if(!G) { drawTitle(ts); return; }
  const raw=Math.min(0.05,(ts-LAST)/1000||0); LAST=ts;
  if(RUNNING && !G.paused && !G.dead){
    ACC+=raw;
    let guard=0;
    while(ACC>=DT && guard++<4){ step(DT); ACC-=DT; }
  } else ACC=0;
  render(ts);
}
function step(dt){
  const P=G.p;
  G.time+=dt;
  tickStatus(P,dt);

  /* --- torche --- */
  P.torch=Math.max(0,P.torch - dt*(0.62 + G.depth*0.035)*passMul('torch',1)*(G.p.base.torch||1));
  if(P.torch<=0 && !P._dark){ P._dark=true; say('La torche meurt. Il ne reste que deux pas de clarté.','self','bad'); }
  if(P.torch>0) P._dark=false;

  /* --- entrée --- */
  let mx=INPUT.mx, my=INPUT.my;
  const mag=Math.hypot(mx,my);
  if(mag>1){ mx/=mag; my/=mag; }
  P.lastHit+=dt; P.atkT-=dt; P.hurtT-=dt; P.invT-=dt;
  for(let i=0;i<G.cool.length;i++) G.cool[i]=Math.max(0,G.cool[i]-dt);
  stepBuffs(dt); stepPassives(dt); stepZones(dt); stepPressure(dt);
  if(G.p.base.regen) healP(G.p.base.regen*dt);

  if(P.dashT>0){
    P.dashT-=dt;
    moveEnt(P,P.dvx*dt,P.dvy*dt,0.32,false);
    dashDamage(dt);
  } else if(!frozen(P)){
    const s=playerSpd();
    if(mag>0.12){ P.fx=mx; P.fy=my; }
    moveEnt(P,mx*s*dt,my*s*dt,0.32,false);
  }

  /* --- régénération hors combat --- */
  if(P.lastHit>5 && P.hp<P.mhp) P.hp=Math.min(P.mhp,P.hp+dt*2.2*(G.armor&&G.armor.regen?1+G.armor.regen:1));

  /* --- sol actif --- */
  const t=tileAt(P.x,P.y);
  if(t===SPORE && RNG()<dt*0.9) addStatus(P,'poison',4);
  if(t===STAIR){ if(!G._onStair){ G._onStair=true; } } else G._onStair=false;

  /* --- attaque automatique --- */
  if(P.atkT<=0) autoAttack();

  /* --- objets au sol --- */
  for(let i=G.items.length-1;i>=0;i--){
    const it=G.items[i];
    if(it.cool>0){ it.cool-=dt; continue; }
    if(Math.hypot(it.x-P.x,it.y-P.y)<0.62 && takeItem(it)) G.items.splice(i,1);
  }
  /* --- inscriptions --- */
  for(const mk of G.marks){
    if(mk.shown) continue;
    if(Math.hypot(mk.x-P.x,mk.y-P.y)<1.5){
      mk.shown=true;
      if(mk.corpse) say('Corps de '+mk.name+'. '+mk.txt,'amb','hi');
      else say('Gravé dans la dalle : « '+mk.txt+' »','amb');
    }
  }
  /* --- salle courante --- */
  const R=roomAt(P.x,P.y);
  if(R!==G._room){ G._room=R;
    if(R&&R.label){ showRoom(R.label); if(R.line&&!R._said){R._said=1; say(R.line,'amb');} } }

  /* --- entités --- */
  for(const m of G.mobs) stepMob(m,dt);
  G.mobs=G.mobs.filter(m=>{ if(m.hp>0) return true; if(!m._d){m._d=1;onDeath(m);} return false; });
  stepShots(dt);
  stepParts(dt);

  computeFOV();

  G.shake=Math.max(0,G.shake-dt*4.5);
  G.flash=Math.max(0,G.flash-dt*6);
  G.hurtFlash=Math.max(0,G.hurtFlash-dt*2.2);
  if(P.hp<=0&&!G.dead) die(P.killer||'les ténèbres');
  hud();
}
function roomAt(x,y){
  for(const R of G.rooms) if(x>=R.x&&y>=R.y&&x<R.x+R.w&&y<R.y+R.h) return R;
  return null;
}

/* ==========================================================================
   ATTAQUE DU JOUEUR — la GÉOMÉTRIE vient de l'arme
   ========================================================================== */
function autoAttack(){
  const P=G.p, w=G.weapon; if(!w||frozen(P)) return;
  let best=null,bd=1e9;
  for(const m of G.mobs){
    const dx=m.x-P.x, dy=m.y-P.y, d=Math.hypot(dx,dy);
    if(d>w.rng+m.r) continue;
    const ang=Math.abs(angDiff(Math.atan2(dy,dx),Math.atan2(P.fy,P.fx)));
    if(ang>w.arc) continue;
    if(d<bd){bd=d;best=m;}
  }
  if(!best) return;
  swing();
}
function angDiff(a,b){ let d=a-b; while(d>Math.PI)d-=6.2832; while(d<-Math.PI)d+=6.2832; return d; }

function swing(){
  const P=G.p, w=G.weapon;
  P.atkT=attackCd();
  P.swingT=0.16; P.swingDir=Math.atan2(P.fy,P.fx);
  const list=[];
  for(const m of G.mobs){
    const dx=m.x-P.x, dy=m.y-P.y, d=Math.hypot(dx,dy);
    if(d>w.rng+m.r) continue;
    if(Math.abs(angDiff(Math.atan2(dy,dx),P.swingDir))>w.arc) continue;
    list.push(m);
    if(!w.pierce && w.arc<0.8) break;
  }
  if(!list.length) return;
  for(const m of list) hitMob(m,w);
  if(w.wild && RNG()<w.wild){
    hurtPlayer(playerDmg()*0.3,'votre propre fléau');
    say('Le fléau vous revient dessus.','self','bad');
  }
}
function hitMob(m,w){
  const P=G.p;
  let dmg=playerDmg();
  let crit=false;
  const fromBehind = w.back && (m.fx!==undefined) &&
    (angDiff(Math.atan2(P.y-m.y,P.x-m.x), Math.atan2(m.fy||0,m.fx||1))|0, backAngle(m,P));
  if(w.back && backAngle(m,P)) { dmg*=w.back; crit=true; }
  else if(w.crit && RNG()<w.crit){ dmg*=2.1; crit=true; }
  if(m.guard && facingPlayer(m)) dmg*=(1-m.guard);
  dmg=Math.round(dmg);
  hurtMob(m,dmg);
  popNum(m.x,m.y,dmg,crit?'#ffe08a':'#f0f0f0',crit?1.35:1);
  if(crit){ G.flash=.5; G.shake=Math.max(G.shake,.28); }
  /* recul */
  const a=Math.atan2(m.y-P.y,m.x-P.x);
  m.kbx+=Math.cos(a)*(w.kb||1); m.kby+=Math.sin(a)*(w.kb||1);
  if(w.stun) addStatus(m,'etourdi',w.stun);
  if(w.leech) healP(dmg*w.leech);
  if(bf('leech')) healP(dmg*bf('leech'));
  passHook('onhit',m,dmg);
  blood(m.x,m.y,m.c,crit?14:7,a);
}
function backAngle(m,P){
  if(m.fx===undefined) return false;
  const a=Math.atan2(P.y-m.y,P.x-m.x);
  return Math.abs(angDiff(a,Math.atan2(m.fy,m.fx)))>2.0;
}
function facingPlayer(m){
  if(m.fx===undefined) return false;
  return Math.abs(angDiff(Math.atan2(G.p.y-m.y,G.p.x-m.x),Math.atan2(m.fy,m.fx)))<1.1;
}
function hurtMob(m,dmg,silent){
  m.hp-=dmg;
  if(!silent){ m.flash=0.14; m.aggroed=true; if(m.fear<=0&&m.beh!=='turret') m.state='chase'; }
  if(m.hp<=0&&!m._d) { m.hp=0; }
}

/* ==========================================================================
   DÉGÂTS AU JOUEUR
   ========================================================================== */
function hurtPlayer(raw,src,silent){
  const P=G.p;
  if(P.invT>0&&!silent) return;
  let dmg=raw;
  if(!silent) dmg=Math.max(1, raw*(1 - playerDef()/(playerDef()+42)));
  const dr=statSum(P,'dr'); if(dr) dmg*=(1-dr);
  if(bf('dr')) dmg*=(1-bf('dr'));
  const sh=G.p.bf.find(b=>b.k==='shield');
  if(sh){ const a=Math.min(sh.v,dmg); sh.v-=a; dmg-=a;
    popNum(P.x,P.y,Math.round(a),'#bff0ff',.8);
    if(sh.v<=0) G.p.bf.splice(G.p.bf.indexOf(sh),1);
    if(dmg<=0.5){ P.lastHit=0; return; } }
  P.hp-=dmg; P.killer=src; P.lastHit=0;
  if(!silent) P.invT=Math.max(P.invT,0.32);   // brèves i-frames : sans elles une meute fond sur vous
  if(!silent){
    G.shake=Math.max(G.shake,Math.min(.9,dmg/28));
    G.hurtFlash=Math.min(1,G.hurtFlash+dmg/45);
    popNum(P.x,P.y,Math.round(dmg),'#e05a3a',1);
    say(cap(src)+' vous inflige '+Math.round(dmg)+'.','self','bad');
    blood(P.x,P.y,'#a33d2c',6,RNG()*6.28);
    /* riposte */
    const w=G.weapon;
    if(w&&w.riposte&&RNG()<w.riposte){
      for(const m of G.mobs) if(Math.hypot(m.x-P.x,m.y-P.y)<w.rng+m.r+.2){ hitMob(m,w); break; }
    }
    passHook('onhurt',G.mobs.find(m=>Math.hypot(m.x-P.x,m.y-P.y)<1.5));
    if(w&&w.riposte===undefined&&bf('rip')){
      for(const m of G.mobs) if(Math.hypot(m.x-P.x,m.y-P.y)<(w?w.rng:1.2)+m.r+.2){ hitMob(m,w); break; }
    }
    if(G.armor&&G.armor.thorns){
      for(const m of G.mobs) if(Math.hypot(m.x-P.x,m.y-P.y)<1.3){ hurtMob(m,G.armor.thorns); break; }
    }
  }
}

/* ==========================================================================
   IA — un comportement par famille
   ========================================================================== */
function stepMob(m,dt){
  const P=G.p;
  m.t+=dt; m.flash=Math.max(0,m.flash-dt*5);
  tickStatus(m,dt);
  if(m.fear>0) m.fear-=dt;
  const dx=P.x-m.x, dy=P.y-m.y, dist=Math.hypot(dx,dy)||.001;
  const ux=dx/dist, uy=dy/dist;
  const canSee=G.vis[(m.y|0)*MW+(m.x|0)]===1;

  /* recul physique */
  if(Math.abs(m.kbx)+Math.abs(m.kby)>0.01){
    moveEnt(m,m.kbx*dt*7,m.kby*dt*7,m.r,m.beh==='phase');
    m.kbx*=0.82; m.kby*=0.82;
  }
  if(!m.aggroed){
    if(canSee && dist<m.aggro){ m.aggroed=true; m.state='chase';
      if(m.boss){ say(m.n+' vous a vu.','self','hi'); G.shake=.6; } }
    else { if(m.beh!=='turret'&&RNG()<dt*.6){ m.wx=rf(-1,1); m.wy=rf(-1,1); }
      if(m.wx!==undefined&&!frozen(m)) moveEnt(m,m.wx*m.spd*.28*dt,m.wy*m.spd*.28*dt,m.r,m.beh==='phase');
      return; }
  }
  if(frozen(m)) return;
  m.fx=ux; m.fy=uy;

  if(m.fear>0){ moveEnt(m,-ux*m.spd*1.25*dt,-uy*m.spd*1.25*dt,m.r,m.beh==='phase'); return; }
  m.cd-=dt;

  const sep=separation(m);
  const adv=(sx,sy,mul)=>{
    const ghost=(m.beh==='phase');
    let vx=sx*(mul||1)*m.spd+sep.x, vy=sy*(mul||1)*m.spd+sep.y;
    const before=m.x+','+m.y;
    moveEnt(m,vx*dt,vy*dt,m.r,ghost);
    if(!ghost && before===m.x+','+m.y){          // coincé : glisse
      moveEnt(m,vy*dt*0.9,-vx*dt*0.9,m.r,false);
    }
  };

  switch(m.beh){
    case 'ranged': case 'caster': {
      const keep=m.keep||4;
      if(dist>m.rng) adv(ux,uy);
      else if(dist<keep*0.7) adv(-ux,-uy,0.8);
      else adv(-uy*0.5,ux*0.5,0.6);
      if(m.cd<=0 && dist<m.rng && lineClear(m.x,m.y,P.x,P.y)){
        m.state='wind'; m.wt=m.wind; m.cd=m.wind+ (m.beh==='caster'?2.0:1.35); }
      break; }
    case 'summon': {
      if(dist<5) adv(-ux,-uy,0.9); else if(dist>9) adv(ux,uy,0.7);
      if(m.cd<=0){ m.state='wind'; m.wt=m.wind; m.cd=m.wind+5.5; }
      break; }
    case 'turret': {
      if(dist<m.rng+0.6 && m.cd<=0){ m.state='wind'; m.wt=m.wind; m.cd=m.wind+1.6; }
      break; }
    case 'charge': {
      if(m.dashT>0){ m.dashT-=dt; adv(m.ddx,m.ddy,3.1);
        if(dist<m.r+0.7){ mobStrike(m); m.dashT=0; } break; }
      if(dist>3 && dist<(m.dash||9) && m.cd<=0){ m.state='wind'; m.wt=m.wind; m.cd=m.wind+2.6; }
      else adv(ux,uy);
      break; }
    case 'bomber': {
      if(dist<m.rng && m.cd<=0){ m.state='wind'; m.wt=m.wind; m.cd=99; }
      else adv(ux,uy,1.05);
      break; }
    case 'thief': {
      if(m.stolen){ const ex=m.x-P.x, ey=m.y-P.y, L=Math.hypot(ex,ey)||1;
        adv(ex/L,ey/L,1.3); if(L>18) m.hp=0; break; }
      if(dist<m.rng+m.r && m.cd<=0){ m.state='wind'; m.wt=m.wind; m.cd=m.wind+1; }
      else adv(ux,uy,1.1);
      break; }
    case 'erratic': {
      const w=Math.sin(m.t*5+m.ph)*0.9;
      adv(ux*0.8-uy*w, uy*0.8+ux*w, 1);
      if(dist<m.rng+m.r && m.cd<=0){ m.state='wind'; m.wt=m.wind; m.cd=m.wind+.7; }
      break; }
    case 'swarm': case 'pack': {
      adv(ux,uy, m.beh==='pack'?1.15:1);
      if(dist<m.rng+m.r && m.cd<=0){ m.state='wind'; m.wt=m.wind; m.cd=m.wind+.85; }
      break; }
    case 'boss10': {
      if(dist>2.6) adv(ux,uy,1);
      if(m.cd<=0){ m.state='wind'; m.wt=m.wind; m.cd=m.wind+ (RNG()<.4?2.2:3.4); m.variant=RNG()<.45?'summon':'slam'; }
      break; }
    default: {
      adv(ux,uy);
      if(dist<m.rng+m.r && m.cd<=0){ m.state='wind'; m.wt=m.wind; m.cd=m.wind+1.05; }
    }
  }

  /* résolution de l'armement (télégraphie -> impact) */
  if(m.state==='wind'){
    m.wt-=dt;
    if(m.wt<=0){
      m.state='chase';
      switch(m.beh){
        case 'ranged': shoot(m,'arrow'); break;
        case 'caster': shoot(m,'bolt'); break;
        case 'summon': summonAround(m,rr(2,3)); break;
        case 'charge': { m.ddx=ux; m.ddy=uy; m.dashT=0.55; break; }
        case 'bomber': burst(m); break;
        case 'thief':  stealFrom(m); break;
        case 'boss10': if(m.variant==='summon') summonAround(m,3); else { mobStrike(m,2.4); shockwave(m); } break;
        default: mobStrike(m);
      }
      if(m.summons && m.beh==='caster' && RNG()<.35) summonAround(m,2);
    }
  }
}
function separation(m){
  let sx=0,sy=0;
  for(const o of G.mobs){ if(o===m||o.hp<=0) continue;
    const dx=m.x-o.x, dy=m.y-o.y, d2=dx*dx+dy*dy;
    const rr2=(m.r+o.r)*(m.r+o.r)*1.6;
    if(d2<rr2 && d2>0.0001){ const d=Math.sqrt(d2); sx+=dx/d*(1-d/Math.sqrt(rr2))*2.2; sy+=dy/d*(1-d/Math.sqrt(rr2))*2.2; } }
  return {x:sx,y:sy};
}
function lineClear(x0,y0,x1,y1){
  const d=Math.hypot(x1-x0,y1-y0), n=Math.ceil(d*3);
  for(let i=1;i<n;i++){ const t=i/n;
    if(OPAQUE[tileAt(x0+(x1-x0)*t, y0+(y1-y0)*t)]) return false; }
  return true;
}
function mobStrike(m,mul){
  const d=Math.hypot(G.p.x-m.x,G.p.y-m.y);
  if(d>m.rng+m.r+0.45) { say(m.n+' frappe dans le vide.','mine'); return; }
  hurtPlayer(m.dmg*(mul||1), m.n);
  if(m.applies) addStatus(G.p,m.applies,6);
  if(m.drain){ G.p.torch=Math.max(0,G.p.torch-9); }
  if(m.kb){ const a=Math.atan2(G.p.y-m.y,G.p.x-m.x);
    moveEnt(G.p,Math.cos(a)*m.kb*.18,Math.sin(a)*m.kb*.18,0.32,false); }
}
function shockwave(m){
  G.shake=1; ring(m.x,m.y,'#e0a44c',3.2);
  for(let i=0;i<26;i++) G.parts.push({x:m.x,y:m.y,vx:Math.cos(i/26*6.28)*4,vy:Math.sin(i/26*6.28)*4,
    life:.6,max:.6,c:'#e0a44c',s:.16});
}
function summonAround(m,n){
  const pool=BEAST.filter(b=>b.d<=Math.max(2,G.depth-1));
  for(let i=0;i<n;i++){
    const a=RNG()*6.28, R=1.4+RNG();
    const x=m.x+Math.cos(a)*R, y=m.y+Math.sin(a)*R;
    if(solidAt(x,y)) continue;
    const s=spawnMob(pick(pool.length?pool:[BEAST[0]]),x,y);
    s.aggroed=true; s.gen=(m.gen||0)+1;
    ring(x,y,'#8f6fb0',1.2);
  }
  say(m.n+' appelle les os du sol.','self','bad');
}
function stealFrom(m){
  if(G.gold>0){ const a=Math.min(G.gold,rr(20,60)); G.gold-=a; m.stolen=a;
    say(m.n+' vous arrache '+a+' pièces et détale.','self','bad'); }
  else { mobStrike(m); }
}
function burst(m){
  const kind=m.burst||'feu';
  ring(m.x,m.y,kind==='feu'?'#e07a3a':'#8fbc5a',m.brad);
  const d=Math.hypot(G.p.x-m.x,G.p.y-m.y);
  if(d<m.brad){
    if(kind==='feu'){ hurtPlayer(m.bdmg*(1-d/m.brad),m.n); addStatus(G.p,'brulure',5); }
    else { hurtPlayer(m.bdmg*0.4,m.n); addStatus(G.p,'poison',9); }
  }
  for(const o of G.mobs){ if(o===m) continue;
    const dd=Math.hypot(o.x-m.x,o.y-m.y);
    if(dd<m.brad) hurtMob(o,m.bdmg*0.5*(1-dd/m.brad)); }
  for(let i=0;i<34;i++){ const a=RNG()*6.28,s=rf(1,5);
    G.parts.push({x:m.x,y:m.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.7,max:.7,
      c:kind==='feu'?pick(['#e07a3a','#ffcf7a','#a33d2c']):'#8fbc5a',s:.14}); }
  G.shake=Math.max(G.shake,.7);
  m.hp=0;
}
function shoot(m,kind){
  const a=Math.atan2(G.p.y-m.y,G.p.x-m.x);
  G.shots.push({x:m.x,y:m.y,vx:Math.cos(a)*(kind==='arrow'?13:9),vy:Math.sin(a)*(kind==='arrow'?13:9),
    kind, dmg:m.dmg, src:m.n, life:2.2, c:kind==='arrow'?'#d8cba8':'#e07a3a'});
}
function stepShots(dt){
  for(let i=G.shots.length-1;i>=0;i--){
    const s=G.shots[i]; s.life-=dt;
    s.x+=s.vx*dt; s.y+=s.vy*dt;
    if(s.life<=0||solidAt(s.x,s.y)){ G.shots.splice(i,1); continue; }
    if(s.own==='p'){
      for(const m of G.mobs){
        if(s.hit.has(m)) continue;
        if(Math.hypot(m.x-s.x,m.y-s.y)>s.r+m.r) continue;
        s.hit.add(m);
        hurtMob(m,s.dmg); popNum(m.x,m.y,s.dmg,s.c,1);
        const a=Math.atan2(s.vy,s.vx);
        m.kbx+=Math.cos(a)*s.kb; m.kby+=Math.sin(a)*s.kb;
        if(s.st) addStatus(m,s.st,3);
        blood(m.x,m.y,m.c,7,a);
        passHook('onhit',m,s.dmg);
        if(!s.pierce){ G.shots.splice(i,1); break; }
      }
      continue;
    }
    if(Math.hypot(s.x-G.p.x,s.y-G.p.y)<0.45){
      hurtPlayer(s.dmg,s.src);
      if(s.kind==='bolt') addStatus(G.p,'brulure',4);
      G.shots.splice(i,1);
    }
  }
}

function onDeath(m){
  G.kills++;
  passHook('onkill',m);
  if(G.p.base.harvest) healP(G.p.base.harvest);
  blood(m.x,m.y,m.c,22,RNG()*6.28);
  if(m.stolen) G.gold+=m.stolen;
  if(m.beh==='split' && (m.gen||0)<2 && m.mhp>10){
    for(let i=0;i<2;i++){
      const c=spawnMob(BEAST.find(b=>b.k==='slime'), m.x+rf(-.6,.6), m.y+rf(-.6,.6));
      c.hp=c.mhp=Math.round(m.mhp*0.45); c.r=m.r*0.72; c.dmg=Math.round(m.dmg*0.7);
      c.gen=(m.gen||0)+1; c.aggroed=true;
    }
    say('La vase se scinde.','self','bad');
  }
  gainXP(m.xp);
  say(cap(m.n)+' s\'effondre.','mine','good',m.c);
  if(m.boss){
    say('— '+m.n+' EST TOMBÉ —','self','hi');
    G.flash=1; G.shake=1;
    if(m.final){ win(); return; }
    for(let i=0;i<3;i++) dropItem(rollItem(G.depth+3),m.x+rf(-1,1),m.y+rf(-1,1));
    dropItem({t:'gold',n:'butin du gardien',amt:rr(120,260)},m.x,m.y);
  } else if(RNG()<.30) dropItem(rollItem(G.depth),m.x,m.y);
}
function gainXP(n){
  const P=G.p; P.xp+=n;
  while(P.xp>=P.next){
    P.xp-=P.next; P.level++; P.next=Math.round(P.next*1.42)+8;
    P.mhp+=12; P.hp=P.mhp;
    say('Rang '+P.level+'. Vous vous relevez, plus dur.','self','hi');
    G.flash=.6; G.shake=Math.max(G.shake,.35);
    ring(P.x,P.y,'#ffe08a',2.4);
    for(let k=0;k<34;k++){ const a=RNG()*6.28, sp=rf(1,5);
      G.parts.push({x:P.x,y:P.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
        life:.8,max:.8,c:pick(['#ffe08a','#e0a44c','#fff6e0']),s:.11}); }
    G.boonQ=(G.boonQ||0)+1;
  }
  if(G.boonQ&&!G.paused) offerBoon();
}

function useAbility(i){ return castSpell(i); }
function _legacyAbility(i){
  if(!G||G.dead||G.paused||G.cool[i]>0) return;
  const P=G.p;
  if(i===0){                                     /* ÉLAN */
    const a=Math.atan2(P.fy,P.fx);
    P.dvx=Math.cos(a)*15; P.dvy=Math.sin(a)*15; P.dashT=0.17; P.invT=0.28;
    P._dashHit=new Set();
    G.cool[0]=G.coolMax[0];
    for(let k=0;k<12;k++) G.parts.push({x:P.x,y:P.y,vx:-Math.cos(a)*rf(1,3),vy:-Math.sin(a)*rf(1,3),
      life:.35,max:.35,c:'#cfc6ae',s:.1});
  }
  if(i===1){                                     /* MOULINET */
    G.cool[1]=G.coolMax[1];
    const w=G.weapon||{dmg:10,kb:2};
    let n=0;
    for(const m of G.mobs){
      const d=Math.hypot(m.x-P.x,m.y-P.y);
      if(d>2.1+m.r) continue; n++;
      const dmg=Math.round(playerDmg()*1.25);
      hurtMob(m,dmg); popNum(m.x,m.y,dmg,'#ffe08a',1.15);
      const a=Math.atan2(m.y-P.y,m.x-P.x);
      m.kbx+=Math.cos(a)*4.2; m.kby+=Math.sin(a)*4.2;
      addStatus(m,'etourdi',.35);
      blood(m.x,m.y,m.c,9,a);
    }
    P.swirlT=0.35; G.shake=Math.max(G.shake,.35);
    for(let k=0;k<22;k++){ const a=k/22*6.28;
      G.parts.push({x:P.x+Math.cos(a)*1.7,y:P.y+Math.sin(a)*1.7,vx:Math.cos(a)*2,vy:Math.sin(a)*2,
        life:.3,max:.3,c:'#e8dcc0',s:.09}); }
    say(n?'Moulinet — '+n+' touchés.':'Moulinet dans le vide.','mine');
  }

}
function dashDamage(dt){
  const P=G.p;
  for(const m of G.mobs){
    if(P._dashHit&&P._dashHit.has(m)) continue;
    if(P._dashPierce===false&&P._dashHit&&P._dashHit.size) continue;
    if(Math.hypot(m.x-P.x,m.y-P.y)<0.75+m.r){
      P._dashHit&&P._dashHit.add(m);
      const dmg=Math.round(playerDmg()*(G.p._dashMul||0.7));
      hurtMob(m,dmg); popNum(m.x,m.y,dmg,'#cfe0f0',1);
      const a=Math.atan2(m.y-P.y,m.x-P.x); m.kbx+=Math.cos(a)*3; m.kby+=Math.sin(a)*3;
    }
  }
}

function blood(x,y,c,n,a){
  for(let i=0;i<n;i++){ const ang=a+rf(-1,1), s=rf(1.5,5.5);

}
function ring(x,y,c,r){ G.parts.push({ring:1,x,y,c,r,life:.4,max:.4}); }
function popNum(x,y,v,c,sc){ G.parts.push({num:1,x,y,v,c,sc:sc||1,life:.8,max:.8}); }
function stepParts(dt){
  for(let i=G.parts.length-1;i>=0;i--){
    const p=G.parts[i]; p.life-=dt;
    if(p.life<=0){ G.parts.splice(i,1); continue; }
    if(p.ring||p.num) continue;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.90; p.vy*=0.90;

}

 /* --- héros --- */

const icol=it=>(it.rar!==undefined&&it.rar>0)?RAR[it.rar].c:
  ({potion:'#b9679a',scroll:'#d8cba8',torch:'#e0a44c',weapon:'#9fb4c4',
    armor:'#8fa08a',ring:'#c9a45a',amulet:'#7fb8c4',gold:'#d8b24a'})[it.t]||'#fff';

/* ==========================================================================
   RENDU — la lumière est le sujet, pas un filtre.
   Deux sources s'opposent : l'ambre de la torche et le froid de la pierre.
   ========================================================================== */
let TS=30, VW=15, VH=19, DPR=1, CW=0, CH=0;
function resize(){
  const st=document.getElementById('stage');
  DPR=Math.min(2,window.devicePixelRatio||1);
  CW=st.clientWidth; CH=st.clientHeight;
  cv.width=CW*DPR; cv.height=CH*DPR; cx.setTransform(DPR,0,0,DPR,0,0);
  TS=Math.max(18,Math.floor(Math.min(CW/12.5, CH/16.5)));
  VW=Math.ceil(CW/TS)+2; VH=Math.ceil(CH/TS)+2;
  const t=document.getElementById('tcv');
  t.width=t.clientWidth*DPR; t.height=t.clientHeight*DPR;
}
window.addEventListener('resize',()=>{resize();});

function drawIn(px,py,s,fn){ cx.save(); cx.translate(px,py); cx.scale(s,s); fn(); cx.restore(); }

/* teinte finale d'une case : base -> froid -> chaud */
function lit(baseHex,lum,warm,mem){
  const b=hx(baseHex);
  if(mem){
    const m=hx(G.st.mem);
    // souvenir : désaturé et bleuté, jamais noir
    const g=(b[0]+b[1]+b[2])/3;
    const r=rgbmix([g,g,g],m,.62);
    return 'rgb('+(r[0]*.52|0)+','+(r[1]*.56|0)+','+(r[2]*.74|0)+')';
  }
  const cold=hx(G.st.cold), warmc=hx(G.st.warm);
  let c=rgbmix(b,cold,0.58*(1-warm*0.92));
  c=rgbmix(c,warmc,warm*0.36);
  const k=G.st.amb+lum*1.02;
  return 'rgb('+(clamp(c[0]*k,0,255)|0)+','+(clamp(c[1]*k,0,255)|0)+','+(clamp(c[2]*k,0,255)|0)+')';
}

let FLICK=1;
function lumAt(x,y,tflick){
  const R=lightRadius()*tflick;
  const d=Math.hypot(x-G.p.x,y-G.p.y);
  let L=G.p.torch>0 ? Math.pow(clamp(1-d/(R+1.0),0,1),1.75) : 0;
  if(G.p.torch<=0) L=Math.max(L,Math.pow(clamp(1-d/2.6,0,1),1.3)*.55);
  let W=L;
  for(const S of G.lights){
    const dd=Math.hypot(x-S.x,y-S.y);
    if(dd>S.r) continue;
    const a=Math.pow(1-dd/S.r,1.4)*S.i*(S.fire?(0.82+Math.sin(G.time*9+S.x)*0.18):1);
    L=Math.min(1.35,L+a); W=Math.min(1,W+a*0.9);
  }
  for(const p of G.parts){ if(!p.ring) continue;
    const dd=Math.hypot(x-p.x,y-p.y);
    if(dd<p.r*1.4){ const a=(p.life/p.max)*(1-dd/(p.r*1.4))*1.1; L=Math.min(1.8,L+a); W=Math.min(1,W+a); } }
  return [L,W];
}

function render(ts){
  if(!G){ return; }
  const T=ts||0;
  cx.fillStyle=G.st.fog; cx.fillRect(0,0,CW,CH);
  FLICK=1+Math.sin(T/140)*0.035+Math.sin(T/57)*0.02;

  const sh=G.shake;
  const shx=sh?(RNG()-.5)*sh*13:0, shy=sh?(RNG()-.5)*sh*13:0;
  const camx=G.p.x*TS - CW/2 + shx, camy=G.p.y*TS - CH/2 + shy;
  const X=v=>v*TS-camx, Y=v=>v*TS-camy;

  const i0=clamp(((camx/TS)|0)-1,0,MW-1), j0=clamp(((camy/TS)|0)-1,0,MH-1);
  const i1=clamp(i0+VW,0,MW), j1=clamp(j0+VH,0,MH);
  const P=G.st;

  /* ---------- terrain ---------- */
  for(let j=j0;j<j1;j++)for(let i=i0;i<i1;i++){
    const id=j*MW+i; if(!G.seen[id]) continue;
    const vis=G.vis[id]===1;
    const [L,W]=vis?lumAt(i+.5,j+.5,FLICK):[0,0];
    const mem=!vis;
    const x=X(i), y=Y(j), t=G.map[id];

    if(t===WALL||t===SHELF){
      cx.fillStyle=lit(t===SHELF?'#2e2418':P.wall,L*.95,W*.7,mem); cx.fillRect(x,y,TS+1,TS+1);
      cx.fillStyle=lit(P.top,L*1.25,W*.8,mem); cx.fillRect(x,y,TS+1,TS*.26);
      /* arête vive en haut, ombre portée en bas : le mur prend du volume */
      cx.fillStyle='rgba(255,240,210,'+(mem?0.05:0.10+L*0.16)+')'; cx.fillRect(x,y,TS+1,1.5);
      cx.fillStyle='rgba(0,0,0,.55)'; cx.fillRect(x,y+TS*.90,TS+1,TS*.12);
      if(!mem&&L>.12){
        cx.fillStyle='rgba(0,0,0,.22)';
        const off=(j%2)?TS*.5:0;
        cx.fillRect(x,y+TS*.5,TS+1,1);
        cx.fillRect(x+off,y+TS*.5,1,TS*.5);
        cx.fillRect(x+((off+TS*.5)%TS),y,1,TS*.5);
      }
      if(t===SHELF&&!mem){ cx.fillStyle=lit('#8a7448',L,W,mem);
        cx.fillRect(x+TS*.12,y+TS*.30,TS*.76,TS*.10);
        cx.fillRect(x+TS*.12,y+TS*.58,TS*.76,TS*.10); }
      continue;
    }
    cx.fillStyle=lit(P.floor,L*.75,W,mem); cx.fillRect(x,y,TS+1,TS+1);
    cx.fillStyle=lit(P.slab,L*1.0,W,mem); cx.fillRect(x+TS*.06,y+TS*.06,TS*.88,TS*.88);
    /* ombre projetée par le mur du dessus : sépare franchement les deux */
    if(SOLID[G.map[(j-1)*MW+i]]){ cx.fillStyle='rgba(0,0,0,'+(mem?.30:.42)+')';
      cx.fillRect(x,y,TS+1,TS*.22); }

    if(mem) continue;
    switch(t){
      case RUBBLE: cx.fillStyle=lit('#57506a',L,W,0);
        drawIn(x,y,TS,()=>{ell(.36,.66,.13,.09);ell(.62,.72,.10,.07);ell(.52,.54,.08,.06);}); break;
      case BONES: cx.fillStyle=lit('#b8b090',L,W,0);
        drawIn(x,y,TS,()=>{ell(.34,.70,.14,.05);ell(.62,.60,.12,.045);
          cx.beginPath();cx.ellipse(.66,.78,.07,.06,0,0,6.28);cx.fill();}); break;
      case WATER: {
        const wv=Math.sin(T/420+i*.7+j*.5)*.5+.5;
        cx.fillStyle=lit('#1b3a44',L*(0.85+wv*.35),W*.6,0); cx.fillRect(x,y,TS+1,TS+1);
        cx.fillStyle='rgba(180,230,240,'+(0.05+L*0.12*wv)+')';
        cx.fillRect(x+TS*.15,y+TS*(.3+wv*.25),TS*.5,1.4); break; }
      case SPORE: {
        cx.fillStyle=lit('#2c3a1c',L,W*.7,0); cx.fillRect(x,y,TS+1,TS+1);
        cx.fillStyle=lit('#7fae52',L*1.1,W,0);
        drawIn(x,y,TS,()=>{ell(.32,.62,.07,.09);ell(.58,.70,.055,.075);ell(.72,.44,.05,.065);}); break; }
      case ALTAR:
        cx.fillStyle=lit('#4a3038',L,W,0);
        drawIn(x,y,TS,()=>{cx.fillRect(.18,.42,.64,.42);});
        cx.fillStyle=lit('#c8503a',Math.min(1.4,L*1.5),1,0);
        drawIn(x,y,TS,()=>{cx.fillRect(.24,.36,.52,.09);}); break;
      case BRAZIER: {
        const f=.5+Math.sin(T/95+i)*.5;
        cx.fillStyle=lit('#3a3038',L,W,0);
        drawIn(x,y,TS,()=>{poly([[.30,.88],[.36,.56],[.64,.56],[.70,.88]]);});
        drawIn(x,y,TS,()=>{
          cx.fillStyle='#a33d2c';ell(.5,.46,.14+f*.02,.20+f*.04);
          cx.fillStyle='#e0a44c';ell(.5,.45,.10+f*.02,.15+f*.03);
          cx.fillStyle='#ffe7a8';ell(.5,.44,.05,.08);}); break; }
      case STAIR: {
        const pu=.72+Math.sin(T/380)*.28;
        cx.save(); cx.shadowColor='#e0a44c'; cx.shadowBlur=TS*1.1*pu;
        cx.fillStyle='rgba(224,164,76,'+(0.10+0.10*pu)+')'; cx.fillRect(x,y,TS+1,TS+1);
        drawIn(x,y,TS,()=>{ for(let k=0;k<4;k++){
          cx.fillStyle=lit('#e0a44c',Math.max(.55,L)*(1-k*.11),1,0);
          cx.fillRect(.12+k*.09,.20+k*.17,.76-k*.09,.14);} });
        cx.restore();
        cx.strokeStyle='rgba(224,164,76,'+(0.35+0.3*pu)+')'; cx.lineWidth=1.5;
        cx.strokeRect(x+1,y+1,TS-1,TS-1);
        break; }
    }
  }

  /* ---------- boussole vers l'escalier ---------- */
  if(G.stair){
    const sx=X(G.stair.x+.5), sy=Y(G.stair.y+.5);
    const onScreen = sx>TS && sx<CW-TS && sy>TS && sy<CH-TS;
    if(!onScreen){
      const cxs=CW/2, cys=CH/2;
      let a=Math.atan2(sy-cys,sx-cxs);
      const mrg=Math.min(CW,CH)*0.36;
      const px=cxs+Math.cos(a)*mrg, py=cys+Math.sin(a)*mrg;
      const pu=.6+Math.sin(T/300)*.4;
      const dist=Math.hypot(G.stair.x-G.p.x,G.stair.y-G.p.y);
      cx.save(); cx.translate(px,py); cx.rotate(a);
      cx.globalAlpha=0.30+0.30*pu;
      cx.fillStyle='#e0a44c';
      cx.beginPath(); cx.moveTo(TS*.42,0); cx.lineTo(-TS*.16,-TS*.26);
      cx.lineTo(-TS*.02,0); cx.lineTo(-TS*.16,TS*.26); cx.closePath(); cx.fill();
      cx.restore();
      cx.save(); cx.globalAlpha=0.42;
      cx.fillStyle='#e0a44c'; cx.textAlign='center'; cx.textBaseline='middle';
      cx.font='9px "Share Tech Mono",monospace';
      cx.fillText(Math.round(dist)+'m', px+Math.cos(a)*TS*.85, py+Math.sin(a)*TS*.85);
      cx.restore();
    }
  }

  /* ---------- inscriptions ---------- */
  for(const mk of G.marks){
    if(!G.vis[(mk.y|0)*MW+(mk.x|0)]) continue;
    const [L,W]=lumAt(mk.x,mk.y,FLICK);
    if(L<.10) continue;
    const x=X(mk.x-.5), y=Y(mk.y-.5);
    if(mk.corpse){
      drawIn(x,y,TS,()=>{
        cx.fillStyle=lit('#8a8270',L,W,0);
        ell(.50,.66,.24,.11); ell(.30,.58,.09,.08);
        cx.fillStyle='#05040a'; ell(.27,.57,.025,.03); ell(.34,.57,.025,.03);
        cx.fillStyle=lit('#6a6250',L,W,0);
        seg(.60,.62,.82,.72,.05,lit('#6a6250',L,W,0));
      });
    } else {
      cx.save(); cx.globalAlpha=clamp(L*.9,0,.85);
      cx.fillStyle='#c9a45a'; cx.textAlign='center'; cx.textBaseline='middle';
      cx.font=Math.floor(TS*.22)+'px "Share Tech Mono",monospace';
      cx.fillText('✦',x+TS/2,y+TS/2);
      cx.restore();
    }
  }

  /* ---------- objets ---------- */
  for(const it of G.items){
    if(!G.vis[(it.y|0)*MW+(it.x|0)]) continue;
    const [L,W]=lumAt(it.x,it.y,FLICK);
    const bob=Math.sin(T/620+it.bob)*TS*.055;
    const x=X(it.x-.5), y=Y(it.y-.5)+bob;
    cx.save();
    cx.globalAlpha=clamp(.30+L,0,1);
    cx.shadowColor=icol(it); cx.shadowBlur=TS*(.22+L*.3);
    drawIn(x,y,TS*.78,()=>{ (ISPR[it.t]||ISPR.gold)(icol(it)); });
    cx.restore();
  }

  /* ---------- créatures ---------- */
  const drawn=[...G.mobs].sort((a,b)=>a.y-b.y);
  for(const m of drawn){
    if(!G.vis[(m.y|0)*MW+(m.x|0)]) continue;
    const [L,W]=lumAt(m.x,m.y,FLICK);
    if(L<.05 && !m.boss) continue;
    const sc=(m.r/0.33)*(m.boss?1.25:1);
    const S=TS*1.02*sc;
    const x=X(m.x)-S/2, y=Y(m.y)-S*0.62;
    /* ombre */
    cx.globalAlpha=clamp(L*.55,0,.5); cx.fillStyle='#04030a';
    cx.beginPath(); cx.ellipse(X(m.x),Y(m.y)+S*.30,S*.28,S*.09,0,0,6.2832); cx.fill();
    cx.globalAlpha=1;
    /* télégraphie de l'attaque */
    if(m.state==='wind'){
      const k=1-m.wt/Math.max(.01,m.wind);
      cx.strokeStyle='rgba(255,90,60,'+(0.25+k*0.6)+')'; cx.lineWidth=2;
      cx.beginPath(); cx.arc(X(m.x),Y(m.y),S*(.42+ (1-k)*.35),0,6.2832); cx.stroke();
      if(m.beh!=='ranged'&&m.beh!=='caster'&&m.beh!=='summon'){
        cx.fillStyle='rgba(200,60,40,'+(0.10+k*0.18)+')';
        cx.beginPath(); cx.arc(X(m.x),Y(m.y),(m.rng+m.r)*TS,0,6.2832); cx.fill();
      }
    }
    let col=mix(m.c,'#0a0810',clamp(1-L*1.15,0,.78));
    if(m.flash>0) col=mix(col,'#ffffff',clamp(m.flash*5,0,.9));
    cx.save();
    if(m.boss){ cx.shadowColor=m.c; cx.shadowBlur=TS*.5; }
    if(m.st.brulure){ cx.shadowColor='#e07a3a'; cx.shadowBlur=TS*.45; }
    cx.translate(X(m.x),Y(m.y));
    cx.scale((m.fx<0?-1:1),1);
    cx.translate(-S/2,-S*.62);
    cx.save(); cx.scale(S,S);
    (SPR[m.k]||SPR.gob)(col, T+m.ph*1000);
    cx.restore(); cx.restore();
    /* jauge */
    if(m.hp<m.mhp){
      const bw=S*.62;
      cx.fillStyle='rgba(0,0,0,.62)'; cx.fillRect(X(m.x)-bw/2, y-4, bw, 3.2);
      cx.fillStyle=m.boss?'#e0a44c':'#c8503a';
      cx.fillRect(X(m.x)-bw/2, y-4, bw*clamp(m.hp/m.mhp,0,1), 3.2);
    }
  }

  /* ---------- zones persistantes ---------- */
  for(const z of G.zones){
    if(!G.vis[(z.y|0)*MW+(z.x|0)]) continue;
    const k=Math.min(1,z.dur/0.7), pulse=0.5+Math.sin(T/160)*0.14;
    cx.save(); cx.globalAlpha=0.20*k*pulse;
    cx.fillStyle=z.c;
    cx.beginPath(); cx.arc(X(z.x),Y(z.y),TS*z.r,0,6.2832); cx.fill();
    cx.globalAlpha=0.55*k; cx.strokeStyle=z.c; cx.lineWidth=1.5;
    cx.beginPath(); cx.arc(X(z.x),Y(z.y),TS*z.r,0,6.2832); cx.stroke();
    cx.restore();
  }
  /* ---------- orbe orbital ---------- */
  if(G.orbit&&G.orbP){
    cx.save(); cx.shadowColor='#9d7fc4'; cx.shadowBlur=TS*.6;
    cx.fillStyle='#c8a8e8';
    cx.beginPath(); cx.arc(X(G.orbP.x),Y(G.orbP.y),TS*.16,0,6.2832); cx.fill();
    cx.restore();
  }

  /* ---------- projectiles ---------- */
  for(const s of G.shots){
    if(!G.vis[(s.y|0)*MW+(s.x|0)]) continue;
    const a=Math.atan2(s.vy,s.vx);
    cx.save(); cx.translate(X(s.x),Y(s.y)); cx.rotate(a);
    if(s.own==='p'){
      cx.shadowColor=s.c; cx.shadowBlur=TS*.55; cx.fillStyle=s.c;
      if(s.sh==='axe'){ cx.rotate(G.time*22);
        cx.fillRect(-TS*.05,-TS*.22,TS*.10,TS*.44);
        cx.beginPath(); cx.moveTo(0,-TS*.22); cx.lineTo(TS*.20,-TS*.30);
        cx.lineTo(TS*.20,-TS*.06); cx.fill(); }
      else if(s.sh==='spear'){ cx.fillRect(-TS*.34,-1.5,TS*.66,3);
        cx.beginPath(); cx.moveTo(TS*.36,0); cx.lineTo(TS*.16,-TS*.09);
        cx.lineTo(TS*.16,TS*.09); cx.fill(); }
      else { cx.beginPath(); cx.moveTo(TS*.26,0); cx.quadraticCurveTo(0,-TS*.20,-TS*.22,0);
        cx.quadraticCurveTo(0,TS*.20,TS*.26,0); cx.fill(); }
      cx.restore(); continue;
    }
    if(s.kind==='arrow'){
      cx.fillStyle=s.c; cx.fillRect(-TS*.28,-1,TS*.5,2);
      cx.fillStyle='#e8dcc0'; cx.beginPath();
      cx.moveTo(TS*.24,0); cx.lineTo(TS*.10,-TS*.07); cx.lineTo(TS*.10,TS*.07); cx.fill();
    } else {
      cx.shadowColor='#e07a3a'; cx.shadowBlur=TS*.5;
      cx.fillStyle='#ffcf7a'; cx.beginPath(); cx.arc(0,0,TS*.13,0,6.2832); cx.fill();
      cx.fillStyle='rgba(224,122,58,.55)'; cx.beginPath(); cx.arc(-TS*.16,0,TS*.10,0,6.2832); cx.fill();
    }
    cx.restore();
  }

  /* ---------- héros ---------- */
  const hs=TS*1.05;
  const hx0=X(G.p.x)-hs/2, hy0=Y(G.p.y)-hs*.62;
  cx.globalAlpha=.5; cx.fillStyle='#04030a';
  cx.beginPath(); cx.ellipse(X(G.p.x),Y(G.p.y)+hs*.30,hs*.28,hs*.09,0,0,6.2832); cx.fill();
  cx.globalAlpha=1;
  /* arc d'attaque */
  if(G.p.swingT>0){
    G.p.swingT-=1/60;
    const w=G.weapon, k=clamp(G.p.swingT/0.16,0,1);
    cx.save(); cx.translate(X(G.p.x),Y(G.p.y));
    cx.strokeStyle='rgba(255,240,210,'+(k*0.55)+')'; cx.lineWidth=TS*.16*k+1;
    cx.beginPath();
    cx.arc(0,0,(w.rng*0.85)*TS, G.p.swingDir-w.arc, G.p.swingDir+w.arc);
    cx.stroke(); cx.restore();
  }
  if(G.p.swirlT>0){
    G.p.swirlT-=1/60;
    const k=clamp(G.p.swirlT/0.35,0,1);
    cx.strokeStyle='rgba(255,225,170,'+(k*.6)+')'; cx.lineWidth=TS*.14;
    cx.beginPath(); cx.arc(X(G.p.x),Y(G.p.y),TS*2.1*(1.15-k*.25),0,6.2832); cx.stroke();
  }
  if(G.p.torch>0){
    const g=cx.createRadialGradient(X(G.p.x),Y(G.p.y),TS*.2,X(G.p.x),Y(G.p.y),TS*lightRadius()*FLICK);
    g.addColorStop(0,'rgba(255,190,110,.20)');
    g.addColorStop(.45,'rgba(255,160,80,.07)');
    g.addColorStop(1,'rgba(255,150,70,0)');
    cx.fillStyle=g;
    cx.fillRect(X(G.p.x)-TS*12,Y(G.p.y)-TS*12,TS*24,TS*24);
  }
  cx.save();
  if(G.p.invT>0){ cx.globalAlpha=.55; }
  cx.translate(X(G.p.x),Y(G.p.y));
  cx.scale(G.p.fx<0?-1:1,1);
  cx.translate(-hs/2,-hs*.62);
  cx.save(); cx.scale(hs,hs); SPR.hero('#9fa2b4',T,G.p.torch,0); cx.restore();
  cx.restore(); cx.restore();

  /* ---------- particules ---------- */
  for(const p of G.parts){
    const k=p.life/p.max;
    if(p.ring){
      cx.strokeStyle=p.c; cx.globalAlpha=k*.75; cx.lineWidth=TS*.10*k+1;
      cx.beginPath(); cx.arc(X(p.x),Y(p.y),p.r*TS*(1.25-k*.35),0,6.2832); cx.stroke();
      cx.globalAlpha=1; continue;
    }
    if(p.num){
      cx.globalAlpha=clamp(k*1.4,0,1);
      const s=Math.floor(TS*.44*p.sc);
      cx.font='600 '+s+'px "Share Tech Mono",monospace';
      cx.textAlign='center'; cx.textBaseline='middle';
      const yy=Y(p.y)-TS*.7-(1-k)*TS*1.1;
      cx.fillStyle='#05040a'; cx.fillText(p.v,X(p.x)+1.2,yy+1.2);
      cx.fillStyle=p.c; cx.fillText(p.v,X(p.x),yy);
      cx.globalAlpha=1; continue;
    }
    cx.globalAlpha=k; cx.fillStyle=p.c;
    const s=TS*p.s*k;
    cx.fillRect(X(p.x)-s/2,Y(p.y)-s/2,s,s);
    cx.globalAlpha=1;
  }

  /* ---------- éclair global ---------- */
  if(G.flash>0){ cx.fillStyle='rgba(255,235,200,'+(G.flash*.30)+')'; cx.fillRect(0,0,CW,CH); }
  document.getElementById('hurt').style.opacity=G.hurtFlash.toFixed(2);
}

 'border:1px solid rgba(232,220,192,.16);background:radial-gradient(circle,rgba(232,220,192,.06),rgba(232,220,192,0) 70%);}'+

const stage=document.getElementById('stage');
stage.addEventListener('pointerdown',e=>{
  if(!G||G.dead||G.paused) return;
  if(e.target.closest('.ab')||e.target.closest('.sq')||e.target.closest('.sheet')) return;
  INPUT.id=e.pointerId; INPUT.ox=e.clientX; INPUT.oy=e.clientY;
  const r=stage.getBoundingClientRect();
  stickEl.style.left=(e.clientX-r.left)+'px'; stickEl.style.top=(e.clientY-r.top)+'px';
  stickEl.style.opacity=1; knob.style.left='0px'; knob.style.top='0px';
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{
  if(INPUT.id!==e.pointerId) return;
  const dx=e.clientX-INPUT.ox, dy=e.clientY-INPUT.oy;
  const d=Math.hypot(dx,dy), M=46;
  const k=d>M?M/d:1;
  knob.style.left=(dx*k)+'px'; knob.style.top=(dy*k)+'px';
  const n=Math.min(1,d/38);
  if(d>4){ INPUT.mx=dx/d*n; INPUT.my=dy/d*n; } else { INPUT.mx=0; INPUT.my=0; }
});
function releaseStick(e){
  if(INPUT.id!==e.pointerId) return;
  INPUT.id=null; INPUT.mx=0; INPUT.my=0; stickEl.style.opacity=0;
}
stage.addEventListener('pointerup',releaseStick);
stage.addEventListener('pointercancel',releaseStick);

document.getElementById('bDown').addEventListener('pointerdown',e=>{e.stopPropagation();descend();});

addEventListener('keydown',e=>{
  KEY[e.key.toLowerCase()]=1; keyVec();

  if(e.key.toLowerCase()==='i'){ G&&(G.paused?closeInv():openInv()); }

});
addEventListener('keyup',e=>{ KEY[e.key.toLowerCase()]=0; keyVec(); });
function keyVec(){
  if(INPUT.id!==null) return;
  let x=0,y=0;
  if(KEY['arrowleft']||KEY['q']||KEY['a'])x--; if(KEY['arrowright']||KEY['d'])x++;
  if(KEY['arrowup']||KEY['z']||KEY['w'])y--;  if(KEY['arrowdown']||KEY['s'])y++;
  const m=Math.hypot(x,y)||1; INPUT.mx=x/m; INPUT.my=y/m;
}
