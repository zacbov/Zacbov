let LOAD=null;
function prepRaid(){
  LOAD={arme:null,armure:null,rel:[],obj:[]};
  drawPrep();
}
function drawPrep(){
  const ov=$('#ovHold');
  const idx={};META.cache.forEach((id,i)=>{idx[i]=id});
  const taken=new Set([LOAD.arme,LOAD.armure,...LOAD.rel,...LOAD.obj].filter(x=>x!==null));
  const list=(type,slot,max)=>{
    const items=META.cache.map((id,i)=>[id,i]).filter(([id,i])=>ITEMS[id].t===type&&!taken.has(i));
    if(!items.length)return '<div class="empty">Rien de ce type en réserve</div>';
    return items.map(([id,i])=>`<div class="it" onclick="pickLoad('${slot}',${i},${max})">
      <div class="gl">${ITEMS[id].g}</div><div class="nm"><b class="${RAR[ITEMS[id].r]}">${ITEMS[id].n}${type==='arme'&&META.upg&&META.upg[id]?' +'+META.upg[id]:''}</b>
      <small>${ITEMS[id].d}</small><small class="${RAR[ITEMS[id].r]}">${RARN[ITEMS[id].r]}</small></div><div class="vl">▸</div></div>`).join('');
  };
  const chosen=(slot,arr)=>arr.length?arr.map(i=>`<div class="it eq" onclick="dropLoad('${slot}',${i})">
      <div class="gl">${ITEMS[META.cache[i]].g}</div><div class="nm"><b class="${RAR[ITEMS[META.cache[i]].r]}">${ITEMS[META.cache[i]].n}</b>
      <small style="color:var(--verdegris)">▸ Retirer</small></div></div>`).join('')
    :'<div class="empty">Aucun</div>';
  const maxD=Math.min(4,(META.deepest||1));
  let h=`<div class="ovh"><h3>Descente</h3><button class="close" onclick="closeOv()">Annuler</button></div><div class="ovc">
   <p class="desc">Ce que tu emportes descend avec toi. Ce que tu emportes se perd avec toi. Le reste attend ici, en sécurité — les matériaux ne descendent jamais.</p>
   <div class="sect">Chargement</div>
   ${chosen('arme',LOAD.arme!==null?[LOAD.arme]:[])}
   ${chosen('armure',LOAD.armure!==null?[LOAD.armure]:[])}
   ${chosen('rel',LOAD.rel)}
   ${chosen('obj',LOAD.obj)}
   <div class="sect">Armes</div>${list('arme','arme',1)}
   <div class="sect">Armures</div>${list('armure','armure',1)}
   <div class="sect">Reliques — ${LOAD.rel.length}/3</div>${list('relique','rel',3)}
   <div class="sect">Objets — ${LOAD.obj.length}/6</div>${list('conso','obj',6)}
   ${META.cache.some(id=>ITEMS[id].t==='cle')?'<div class="sect">Clés</div>'+list('cle','obj',6):''}
   <div class="sect">Profondeur de départ</div>
   <p class="desc" style="font-size:11.5px">Tu ne peux redescendre directement qu'aux profondeurs déjà atteintes.</p>`;
  for(let d=1;d<=4;d++){
    const lock=d>maxD;
    h+=`<div class="it" ${lock?'style="opacity:.32"':`onclick="launch(${d})"`}>
      <div class="gl">${lock?'🔒':'▼'}</div><div class="nm"><b>${d}. ${DEPTHS[d-1].nom}</b>
      <small>${lock?'Non atteinte':DEPTHS[d-1].intro.slice(0,72)+'…'}</small></div></div>`;
  }
  h+='</div>';ov.innerHTML=h;ov.classList.add('on');
}
function pickLoad(slot,i,max){
  if(slot==='arme'||slot==='armure'){LOAD[slot]=i}
  else{if(LOAD[slot].length>=max){toast('Emplacements pleins');return}LOAD[slot].push(i)}
  drawPrep();
}
function dropLoad(slot,i){
  if(slot==='arme'||slot==='armure')LOAD[slot]=null;
  else LOAD[slot]=LOAD[slot].filter(x=>x!==i);
  drawPrep();
}
function launch(d){
  mkChar(PORTER().cls);
  const used=[LOAD.arme,LOAD.armure,...LOAD.rel,...LOAD.obj].filter(x=>x!==null).sort((a,b)=>b-a);
  if(LOAD.arme!==null)P.arme=META.cache[LOAD.arme];
  if(LOAD.armure!==null)P.armure=META.cache[LOAD.armure];
  P.rel=LOAD.rel.map(i=>META.cache[i]);
  P.sac=LOAD.obj.map(i=>META.cache[i]);
  used.forEach(i=>META.cache.splice(i,1));
  applyMods();P.hp=maxPV();P.end=endMax();P.foc=focMax();
  closeOv();save();
  startRaid(d);
}

/* ============================================================
   ÉCRAN-TITRE & CRÉATION
   ============================================================ */
const tbg=$('#tbg'),tctx=tbg.getContext('2d');
function titleBG(){
  const d=Math.min(devicePixelRatio||1,2);
  const w=tbg.clientWidth||innerWidth,h=tbg.clientHeight||innerHeight;
  tbg.width=w*d;tbg.height=h*d;tctx.setTransform(d,0,0,d,0,0);
  const t=Date.now();
  tctx.clearRect(0,0,w,h);
  const g=tctx.createRadialGradient(w/2,h*.62,10,w/2,h*.62,h*.8);
  g.addColorStop(0,'rgba(224,100,26,.30)');g.addColorStop(.35,'rgba(140,28,34,.14)');g.addColorStop(1,'transparent');
  tctx.fillStyle=g;tctx.fillRect(0,0,w,h);
  // arche
  tctx.strokeStyle='rgba(201,162,39,.16)';tctx.lineWidth=1.4;
  for(let i=0;i<5;i++){
    const r=h*(.18+i*.09)+Math.sin(t*.0004+i)*4;
    tctx.beginPath();tctx.arc(w/2,h*.72,r,Math.PI,0);tctx.stroke();
  }
  requestAnimationFrame(titleBG);
}
function titleScreen(){
  const has=META.roster&&META.roster.length>0;
  const acts=[];
  if(has){const v=META.roster.filter(p=>p.alive).length;
    acts.push({t:'Rejoindre le Sanctuaire',cls:'gold',s:`${META.cendres} ◈ · ${META.cache.length} objets · ${v} porteur${v>1?'s':''} vivant${v>1?'s':''}`,
      f:()=>{$('#title').style.display='none';sanctuary()}})}
  acts.push({t:has?'Recommencer une lignée':'Commencer',cls:has?'sub':'gold',s:has?'efface tout':'choisir un porteur',f:()=>{if(has&&!confirm('Effacer la cachette et recommencer une nouvelle lignée ?'))return;chooseClass()}});
  const c=document.createElement('div');
  $('#tacts').innerHTML='';
  acts.forEach(a=>$('#tacts').appendChild(mkAct(a)));
}
function chooseClass(){
  $('#title').style.display='none';
  P=null;
  setScene('sanct',R(1,9999));
  $('#hud').innerHTML='';
  const choices=CLASSES.map(c=>({t:`${c.g}  ${c.n}`,s:`FOR ${c.s.FOR} · DEX ${c.s.DEX} · FOI ${c.s.FOI} · CHA ${c.s.CHA}`,
    f:()=>confirmClass(c)}));
  render({loc:'AVANT LA PREMIÈRE DESCENTE',title:'Qui descend ?',
    text:['Il n\'y a jamais eu de héros dans les Fosses de Vhalmar. Il y a des gens qui avaient une raison, et des gens qui n\'avaient plus rien.',
      'Les deux ressortent aussi rarement.'],
    choices});
  // descriptions sous chaque bouton
  setTimeout(()=>{$$('#acts .act').forEach((b,i)=>{
    if(CLASSES[i])b.innerHTML+=`<small style="color:var(--brume);text-transform:none;letter-spacing:0;font-family:var(--disp);font-size:12px;margin-top:6px">${CLASSES[i].d}</small>`})},0);
}
async function confirmClass(c){
  META=NEWMETA();
  const po=newPorter(c.id);META.roster.push(po);META.active=po.id;
  mkChar(c.id);
  c.kit.forEach(id=>META.cache.push(id));
  ['fer_noir','cuir_tanne','corde_tressee'].forEach(id=>META.cache.push(id));
  await save();
  setScene('sanct',R(1,9999));
  render({loc:'LE SANCTUAIRE',title:po.nom,
    text:[`${c.n}. ${c.d}`,
      'On t\'a indiqué une cave sous une chapelle brûlée, à cent pas de la trappe. Il y a un coffre. Il est vide, mais il ferme.',
      '>« Tout ce que tu remontes est à toi. Tout ce que tu portes en bas ne l\'est pas encore. »'],
    sys:['+ Équipement de départ et premiers matériaux déposés dans la Cachette',`* ${META.cendres} cendres`,
      `* Poche du Pacte : ${pactMax()} emplacements — leur contenu survit à ta mort`],
    choices:[{t:'Entrer dans le Sanctuaire',cls:'gold',f:()=>sanctuary()}]});
}

/* ============================================================
   BOOT
   ============================================================ */
(async function boot(){
  sizeEmbers();loopEmb();
  sizeFX();setScene('braise',R(1,9999));loopFX();
  titleBG();
  await load();
  if(PORTER())mkChar(PORTER().cls);
  titleScreen();
})();
document.addEventListener('gesturestart',e=>e.preventDefault());
</script>
