<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0908">
<title>CENDRELAME — Les Fosses de Vhalmar</title>
<style>
:root{
  --noir:#050505; --fosse:#0b0a09; --suie:#121010; --pierre:#1c1917;
  --os:#ddd2c0; --cendre:#93887c; --brume:#645a51;
  --or:#c9a227; --or-mat:#7d6718; --sang:#8c1c22; --sang-vif:#c62f2a;
  --braise:#e0641a; --verdegris:#5c8073; --spectre:#7d8fb0;
  --bord:rgba(224,120,50,.16); --lueur:rgba(224,100,26,.10);
  --disp:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --ui:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:#000;overscroll-behavior:none}
body{font-family:var(--disp);color:var(--os);display:flex;align-items:center;justify-content:center}
#app{position:relative;width:100vw;height:100dvh;max-width:min(100vw,calc(100dvh*0.5625));
  background:
    radial-gradient(120% 60% at 50% 108%,rgba(224,100,26,.13),transparent 62%),
    radial-gradient(90% 45% at 50% -8%,rgba(125,143,176,.07),transparent 60%),
    linear-gradient(#0b0a09,#070606 55%,#0c0a09);
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 0 90px #000 inset}
#grain,#embers{position:absolute;inset:0;pointer-events:none;z-index:60}
#grain{opacity:.055;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}
#vig{position:absolute;inset:0;pointer-events:none;z-index:59;
  background:radial-gradient(120% 78% at 50% 42%,transparent 34%,rgba(0,0,0,.72) 100%)}

/* ---------- HUD ---------- */
#hud{position:relative;z-index:20;padding:8px 12px;
  background:linear-gradient(rgba(8,7,6,.92),rgba(11,10,9,.72));
  border-bottom:1px solid var(--bord);
  box-shadow:0 8px 26px -18px rgba(224,100,26,.5)}
.hudtop{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--ui);
  font-size:9.5px;letter-spacing:.18em;color:var(--brume);text-transform:uppercase}
.hudtop b{color:var(--or);font-weight:400}
.zones{display:flex;gap:6px;margin-top:7px}
.zone{flex:1;position:relative;height:22px;background:#050404;border:1px solid #2a2320;overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,.6) inset}
.zone::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(rgba(255,255,255,.055),transparent 45%,rgba(0,0,0,.35))}
.zone i{position:absolute;inset:0;transform-origin:left;transition:transform .45s cubic-bezier(.2,.9,.3,1);
  background:linear-gradient(90deg,#4a0f13,#96222a 70%,#c0392f);box-shadow:0 0 14px rgba(198,47,42,.35)}
.zone.hurt i{background:linear-gradient(90deg,#6b3a10,#c4671a)}
.zone.crit i{background:linear-gradient(90deg,#7a1015,#e03b2c);animation:pulse .9s infinite}
@keyframes pulse{50%{opacity:.55}}
.zone span{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 5px;font-family:var(--ui);font-size:8.5px;letter-spacing:.12em;color:#e8ddcb;
  text-shadow:0 1px 2px #000;text-transform:uppercase}
.bars{display:flex;gap:6px;margin-top:6px}
.bar{flex:1;height:6px;background:#000;border:1px solid #241f1c;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .3s}
#bEnd i{background:linear-gradient(90deg,#4c6b3a,#8fbb52)}
#bFoc i{background:linear-gradient(90deg,#2f4a63,#6e93bd)}
.hudbot{display:flex;justify-content:space-between;margin-top:7px;font-family:var(--ui);
  font-size:10px;letter-spacing:.1em;color:var(--cendre)}
.hudbot b{color:var(--or)}
.status{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;min-height:0}
.st{font-family:var(--ui);font-size:8px;letter-spacing:.1em;padding:2px 5px;border:1px solid;
  text-transform:uppercase}
.st.saign{color:#e2585c;border-color:#5d1a1e;background:#1a0b0c}
.st.poison{color:#8fbb52;border-color:#31461f;background:#0e1408}
.st.buff{color:var(--or);border-color:var(--or-mat);background:#1a1408}
.st.malus{color:#9c8fb0;border-color:#3b3350;background:#100d16}

/* ---------- SCENE ---------- */
#scene{position:relative;flex:0 0 auto;height:31%;min-height:150px;overflow:hidden;background:#000;
  border-bottom:1px solid var(--bord)}
.kbw{position:absolute;inset:0;will-change:transform;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.16) translate(-2%,-2.5%)}}
#art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:contrast(1.1) saturate(.72) brightness(.82)}
#fx{position:absolute;inset:0;width:100%;height:100%}
#sceneShade{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(transparent 42%,rgba(14,12,10,.55) 78%,var(--fosse) 100%)}
#loc{position:absolute;left:0;right:0;bottom:8px;z-index:4;text-align:center;
  font-family:var(--ui);font-size:9px;letter-spacing:.34em;color:var(--or);text-transform:uppercase;
  text-shadow:0 2px 8px #000}
#depth{position:absolute;top:8px;left:10px;z-index:4;font-family:var(--ui);font-size:9px;
  letter-spacing:.2em;color:var(--brume);text-shadow:0 1px 4px #000}

/* ---------- TEXTE ---------- */
#body{flex:1;overflow-y:auto;padding:16px 16px 6px;-webkit-overflow-scrolling:touch;position:relative;z-index:10}
#body::before{content:"";position:fixed;left:0;right:0;height:1px;pointer-events:none}
#body::-webkit-scrollbar{width:3px}#body::-webkit-scrollbar-thumb{background:#332b25}
h2.title{font-size:19px;font-weight:400;letter-spacing:.04em;margin:0 0 10px;color:var(--os);
  line-height:1.25}
h2.title::after{content:"";display:block;width:52px;height:1px;margin-top:9px;
  background:linear-gradient(90deg,var(--braise),transparent);box-shadow:0 0 8px rgba(224,100,26,.5)}
p.txt{font-size:14.5px;line-height:1.7;color:#bcb0a0;margin:0 0 13px;text-align:justify;
  hyphens:auto}
p.txt:first-letter{}
p.txt.lead:first-letter{float:left;font-size:44px;line-height:.82;padding:4px 8px 0 0;color:var(--or);
  font-weight:400}
.whisper{font-style:italic;color:var(--brume);font-size:13px;border-left:1px solid var(--or-mat);
  padding-left:11px;margin:0 0 12px;line-height:1.6}
.sysline{font-family:var(--ui);font-size:10.5px;letter-spacing:.06em;color:var(--cendre);
  margin:0 0 6px;padding-left:12px;position:relative}
.sysline::before{content:"▸";position:absolute;left:0;color:var(--or-mat)}
.sysline.good{color:#9fc46a}.sysline.bad{color:#e2585c}.sysline.gold{color:var(--or)}

/* ---------- CHOIX ---------- */
#acts{position:relative;z-index:20;padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);
  background:linear-gradient(transparent,rgba(7,6,6,.94) 26%);display:flex;flex-direction:column;gap:7px;
  max-height:46%;overflow-y:auto;border-top:1px solid rgba(224,120,50,.08)}
#acts::-webkit-scrollbar{width:0}
.act{position:relative;display:block;width:100%;text-align:left;padding:12px 13px 12px 34px;
  background:linear-gradient(rgba(30,25,21,.9),rgba(12,11,10,.94));border:1px solid #2a2420;color:var(--os);
  box-shadow:inset 0 1px 0 rgba(255,225,190,.05), 0 6px 18px -14px rgba(224,100,26,.6);
  font-family:var(--disp);font-size:14px;line-height:1.3;cursor:pointer;transition:.16s;
  clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px))}
.act::before{content:"◆";position:absolute;left:13px;top:50%;transform:translateY(-50%);
  color:var(--or-mat);font-size:8px;transition:.16s}
.act:active{background:linear-gradient(#2b2117,#191410);border-color:rgba(224,100,26,.55);transform:translateX(2px);
  box-shadow:inset 0 0 22px rgba(224,100,26,.16)}
.act:active::before{color:var(--or)}
.act small{display:block;font-family:var(--ui);font-size:9px;letter-spacing:.1em;color:var(--brume);
  margin-top:3px;text-transform:uppercase}
.act.danger{border-color:#4a1d1f}.act.danger::before{color:var(--sang)}
.act.danger small{color:#9c5a5c}
.act.gold{border-color:var(--or-mat)}.act.gold::before{color:var(--or)}
.act.exit{border-color:#3d5546}.act.exit::before{content:"⌂";color:var(--verdegris)}
.act.exit small{color:var(--verdegris)}
.act[disabled]{opacity:.34;pointer-events:none}
.actrow{display:flex;gap:7px}.actrow .act{flex:1}

/* ---------- DÉ ---------- */
#dice{position:absolute;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
  flex-direction:column;background:rgba(4,3,3,.9);backdrop-filter:blur(3px)}
#dice.on{display:flex}
#dcv,#dcv3{width:min(66vw,230px);height:min(66vw,230px)}
#dcv3{display:none}
#dice.d3 #dcv{display:none}
#dice.d3 #dcv3{display:block}
#dLbl{font-family:var(--ui);font-size:10px;letter-spacing:.3em;color:var(--brume);
  text-transform:uppercase;margin-bottom:6px;text-align:center;padding:0 20px}
#dRes{font-family:var(--ui);font-size:12px;letter-spacing:.14em;margin-top:10px;height:20px;
  color:var(--os);text-align:center}
#dRes.hit{color:#9fc46a}#dRes.miss{color:#e2585c}#dRes.crit{color:var(--or);font-size:14px}

/* ---------- OVERLAY / PANELS ---------- */
.ov{position:absolute;inset:0;z-index:74;display:none;flex-direction:column;
  background:radial-gradient(110% 55% at 50% 104%,rgba(224,100,26,.10),transparent 60%),linear-gradient(#0a0908,#070606)}
.ov.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.ovh{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;border-bottom:1px solid var(--bord)}
.ovh h3{margin:0;font-size:15px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--or)}
.ovc{flex:1;overflow-y:auto;padding:12px 14px calc(env(safe-area-inset-bottom) + 14px)}
.close{background:none;border:1px solid #2c2622;color:var(--cendre);font-family:var(--ui);
  font-size:11px;padding:6px 11px;cursor:pointer;letter-spacing:.1em}
.tabs{display:flex;gap:0;border-bottom:1px solid #241f1c}
.tab{flex:1;padding:10px 4px;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--brume);font-family:var(--ui);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.tab.on{color:var(--or);border-bottom-color:var(--or)}
.sect{font-family:var(--ui);font-size:9px;letter-spacing:.24em;color:var(--brume);
  text-transform:uppercase;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sect::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(224,120,50,.28),transparent)}
.sect:first-child{margin-top:4px}

/* items */
.it{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid #221e1b;
  background:linear-gradient(100deg,rgba(26,22,19,.9),rgba(12,11,10,.9));margin-bottom:6px;cursor:pointer;
  box-shadow:inset 1px 0 0 rgba(224,100,26,.10)}
.it:active{background:#1e1813;border-color:rgba(224,100,26,.45)}
.it .gl{width:32px;height:32px;flex:0 0 32px;display:flex;align-items:center;justify-content:center;
  font-size:17px;background:radial-gradient(circle at 50% 40%,#1a1512,#070606);border:1px solid #241f1c}
.it .nm{flex:1;min-width:0}
.it .nm b{display:block;font-weight:400;font-size:13.5px;color:var(--os)}
.it .nm small{display:block;font-family:var(--ui);font-size:9px;color:var(--brume);letter-spacing:.06em;margin-top:2px;line-height:1.45}
.it .vl{font-family:var(--ui);font-size:10px;color:var(--or);text-align:right;flex:0 0 auto;padding-top:2px}
.it.eq{border-color:rgba(201,162,39,.5);background:linear-gradient(100deg,#1d1609,#0e0c07);
  box-shadow:inset 1px 0 0 var(--or)}
.it.eq .vl{color:var(--verdegris)}
.rar1{color:#9a8f83!important}.rar2{color:#7d94ad!important}.rar3{color:#c9a227!important}
.rar4{color:#a8434a!important}.rar5{color:#d9762c!important}.rar6{color:#eadfc8!important;text-shadow:0 0 10px rgba(224,150,60,.55)}
.empty{font-family:var(--ui);font-size:10px;color:#3f3833;letter-spacing:.1em;text-align:center;padding:24px 0}
.pact{border:1px dashed #4a3f5e;background:#0e0b14}
.pact .gl{border-color:#4a3f5e;color:#9c8fb0}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.slot{aspect-ratio:1;background:#0a0908;border:1px dashed #2c2622;display:flex;align-items:center;
  justify-content:center;font-size:19px;cursor:pointer;position:relative}
.slot.full{border-style:solid;border-color:#3a322c;background:#100e0c}
.slot.pactslot{border-color:#4a3f5e}
.btn{width:100%;padding:12px;background:linear-gradient(rgba(30,25,21,.9),rgba(12,11,10,.94));border:1px solid var(--or-mat);
  color:var(--or);font-family:var(--ui);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  cursor:pointer;margin-top:8px}
.btn:active{background:#241d16}
.btn.sub{border-color:#2c2622;color:var(--cendre)}
.btn[disabled]{opacity:.3;pointer-events:none}
.stat{display:flex;justify-content:space-between;font-family:var(--ui);font-size:11px;
  padding:7px 0;border-bottom:1px solid #1b1715;color:var(--cendre);letter-spacing:.08em}
.stat b{color:var(--os);font-weight:400}
.desc{font-size:12.5px;line-height:1.6;color:#a2988c;margin:0 0 10px}

/* ---------- CARTE ---------- */
#mapwrap{padding:6px 0}
.mrow{display:flex;align-items:center;gap:9px;padding:7px 4px;position:relative}
.mrow::before{content:"";position:absolute;left:19px;top:0;bottom:0;width:1px;background:#241f1c}
.mrow:first-child::before{top:50%}.mrow:last-child::before{bottom:50%}
.mnode{width:30px;height:30px;flex:0 0 30px;border:1px solid #2c2622;background:#0a0908;
  display:flex;align-items:center;justify-content:center;font-size:14px;position:relative;z-index:2;
  border-radius:50%}
.mrow.done .mnode{border-color:#3a4a3a;color:#4d5c4d;background:#0d1109}
.mrow.now .mnode{border-color:var(--or);color:var(--or);box-shadow:0 0 12px rgba(201,162,39,.35);
  animation:pulse 1.8s infinite}
.mrow.fut .mnode{opacity:.42}
.mtxt{font-family:var(--ui);font-size:10px;letter-spacing:.12em;color:var(--brume);text-transform:uppercase}
.mrow.now .mtxt{color:var(--os)}
.mrow.done .mtxt{color:#3f4a3f;text-decoration:line-through}

/* ---------- TITRE ---------- */
#mapscr{position:absolute;inset:0;z-index:66;display:none;flex-direction:column}
#mapscr.on{display:flex;animation:fade .22s}
#mtop,#mbot{flex:0 0 auto}
#mscroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  background:#070606}
#mscroll::-webkit-scrollbar{width:0}
#mcv{display:block;width:100%;touch-action:pan-y}
#mtop{position:relative;z-index:2;padding:calc(env(safe-area-inset-top) + 14px) 16px 0;text-align:center;pointer-events:none}
#mtitle{font-size:17px;letter-spacing:.16em;text-transform:uppercase;color:var(--os);text-shadow:0 2px 12px #000}
#msub{font-family:var(--ui);font-size:9px;letter-spacing:.24em;color:var(--brume);margin-top:6px;text-shadow:0 1px 6px #000}
#mbot{position:relative;z-index:2;margin-top:auto;padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);
  background:linear-gradient(transparent,rgba(6,5,5,.92) 34%);display:flex;flex-direction:column;gap:7px}
#mbot .hint{font-family:var(--ui);font-size:9.5px;letter-spacing:.14em;color:var(--brume);text-align:center;
  text-transform:uppercase;margin-bottom:2px}
#title{position:absolute;inset:0;z-index:90;background:radial-gradient(100% 60% at 50% 78%,#140a06,#000 70%);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:26px;text-align:center}
#tbg{position:absolute;inset:0;width:100%;height:100%;opacity:.42}
#title .in{position:relative;z-index:2}
#title h1{font-size:clamp(30px,10vw,46px);font-weight:400;letter-spacing:.16em;margin:0;
  color:var(--os);text-shadow:0 0 34px rgba(224,100,26,.32)}
#title .sub{font-family:var(--ui);font-size:9.5px;letter-spacing:.42em;color:var(--or-mat);
  margin-top:12px;text-transform:uppercase}
#title .ep{font-style:italic;color:var(--brume);font-size:13px;margin:24px auto 30px;max-width:290px;line-height:1.7}
#toast{position:absolute;left:50%;top:38%;transform:translateX(-50%);z-index:95;pointer-events:none;
  font-family:var(--ui);font-size:11px;letter-spacing:.14em;color:var(--or);text-align:center;
  text-shadow:0 2px 10px #000;opacity:0;transition:.3s;padding:0 20px}
#toast.on{opacity:1;top:34%}
#flash{position:absolute;inset:0;z-index:58;pointer-events:none;background:#c62f2a;opacity:0;
  transition:opacity .35s}
</style>
</head>
<body>
<div id="app">
  <div id="scene"><div class="kbw"><canvas id="fx"></canvas></div>
    <div id="sceneShade"></div><div id="depth"></div><div id="loc"></div></div>
  <div id="hud"></div>
  <div id="body"></div>
  <div id="acts"></div>
  <div id="vig"></div><div id="grain"></div><canvas id="embers"></canvas>
  <div id="flash"></div><div id="toast"></div>
  <div id="dice"><div id="dLbl"></div><canvas id="dcv"></canvas><canvas id="dcv3"></canvas><div id="dRes"></div></div>
  <div id="mapscr">
    <div id="mscroll"><canvas id="mcv"></canvas></div>
    <div id="mtop"><div id="mtitle"></div><div id="msub"></div></div>
    <div id="mbot"></div>
  </div>
  <div class="ov" id="ovInv"></div>
  <div class="ov" id="ovHold"></div>
  <div id="title"><canvas id="tbg"></canvas><div class="in">
    <h1>CENDRELAME</h1>
    <div class="sub">Les Fosses de Vhalmar</div>
    <p class="ep">« Le feu ne meurt pas. Il change de propriétaire. »</p>
    <div id="tacts"></div>
  </div></div>
</div>
<script>
/* ============================================================
   CENDRELAME — moteur roguelike d'extraction / dark fantasy
   Fichier unique, aucune dépendance externe.
   ============================================================ */
'use strict';
const $=(s)=>document.querySelector(s), $$=(s)=>[...document.querySelectorAll(s)];
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------------- OBJETS ---------------- */
const ITEMS={
/* ================= ARMES ================= */
poing_de_fer:{n:"Poings de fer",t:"arme",g:"🥊",r:1,v:60,dmg:[3,7],end:1,sc:"FOR",tr:["preste"],d:"Deux gantelets de mineur. Bon marché, jamais désarmé."},
lame_ebrechee:{n:"Lame ébréchée",t:"arme",g:"🗡",r:1,v:40,dmg:[4,9],end:2,sc:"FOR",d:"Une épée de garnison, rongée par le sel. Elle a tué, mais sans conviction."},
dague_os:{n:"Dague en os",t:"arme",g:"🔪",r:1,v:55,dmg:[3,8],end:1,sc:"DEX",tr:["preste","saigne"],d:"Taillée dans un fémur. Elle se plante bien, elle ressort mal."},
serpe_fossoyeur:{n:"Serpe de fossoyeur",t:"arme",g:"🪝",r:1,v:75,dmg:[4,10],end:2,sc:"DEX",tr:["saigne"],d:"Pour couper les racines. Les racines, ici, ont des visages."},

const MEM={};
const STORE={
  async get(k){
    try{ if(window.storage){const r=await window.storage.get(k);return r?r.value:null} }catch(e){}
    try{ const v=localStorage.getItem(k); if(v!==null)return v }catch(e){}
    return MEM[k]!==undefined?MEM[k]:null;
  },
  async set(k,v){
    MEM[k]=v;
    try{ if(window.storage){await window.storage.set(k,v);return} }catch(e){}
    try{ localStorage.setItem(k,v) }catch(e){}
  }
};

function rnd(s){SCENE.seed=(SCENE.seed*16807)%2147483647;return SCENE.seed/2147483647}
function sizeFX(){const r=fx.getBoundingClientRect();const d=Math.min(devicePixelRatio||1,2);
  fx.width=r.width*d;fx.height=r.height*d;fctx.setTransform(d,0,0,d,0,0);SCENE.w=r.width;SCENE.h=r.height}
function setScene(pal,seed,kind,mob){

  sizeFX();buildScene();

function buildScene(){
  const w=SCENE.w,h=SCENE.h,p=PAL[SCENE.pal];SCENE.geo=[];
  // colonnes / arches
  const cols=R(3,6);
  for(let i=0;i<cols;i++){
    const x=rnd()*w, cw=8+rnd()*26, top=h*(0.05+rnd()*0.3);
    SCENE.geo.push({t:'col',x,w:cw,top,d:0.3+rnd()*0.7});
  }
  // silhouettes de fond (ruines dentelées)
  SCENE.ridge=[];let x=-20;
  while(x<w+20){const y=h*(0.30+rnd()*0.34);SCENE.ridge.push([x,y]);x+=8+rnd()*26}
  // particules
  SCENE.parts=[];const n=SCENE.pal==='braise'?46:30;
  for(let i=0;i<n;i++)SCENE.parts.push({x:Math.random()*w,y:Math.random()*h,
    vy:-(0.12+Math.random()*0.5),vx:(Math.random()-0.5)*0.28,r:0.5+Math.random()*1.7,a:0.2+Math.random()*0.7,ph:Math.random()*6.3});

/* --- silhouettes : tout est dessiné en noir avec un liseré de lumière --- */
function silh(path,rim){
  fctx.save();
  fctx.fillStyle='#050404';fctx.globalAlpha=.93;path();fctx.fill();
  fctx.globalAlpha=1;fctx.lineWidth=1.1;fctx.strokeStyle=rim;path();fctx.stroke();
  fctx.restore();
}
function drawPlayer(x,y,h,rim,cls){
  const t=SCENE.t*.001, bob=Math.sin(t*1.2)*h*.012;
  y+=bob;
  const S={deserteur:0.38,braconnier:0.30,penitent:0.44,fossoyeur_pj:0.40}[cls]||0.34;
  const w=h*S;
  const M=(a,b)=>fctx.moveTo(x+w*a,y-h*b), L=(a,b)=>fctx.lineTo(x+w*a,y-h*b);
  const Q=(a,b,c,d)=>fctx.quadraticCurveTo(x+w*a,y-h*b,x+w*c,y-h*d);

  if(cls==='braconnier'){
    /* maigre, dos voûté, capuche pointue tirée en arrière */
    silh(()=>{fctx.beginPath();
      M(-.46,0); Q(-.60,.34,-.34,.62); Q(-.44,.86,-.10,.94);
      L(.18,1.04); Q(.34,.94,.26,.80);            // pointe de capuche
      Q(.40,.60,.30,.40); Q(.52,.20,.42,0);
      fctx.closePath()},rim);
    // dague courte, tenue en prise inversée
    fctx.save();fctx.strokeStyle=rim;fctx.globalAlpha=.8;fctx.lineWidth=1.5;
    fctx.beginPath();M(.36,.46);L(.20,.10);fctx.stroke();
    // carquois dans le dos
    fctx.globalAlpha=.55;fctx.lineWidth=1.2;
    fctx.beginPath();M(-.42,.42);L(-.30,.78);fctx.stroke();
    fctx.restore();fctx.globalAlpha=1;
    fctx.fillStyle=rim;fctx.globalAlpha=.5+.35*Math.sin(t*2.4);
    fctx.fillRect(x+w*.02,y-h*.80,w*.16,1.3);
  }
  else if(cls==='penitent'){
    /* robe large évasée, tête basse, chaîne pendante */
    silh(()=>{fctx.beginPath();
      M(-.62,0); Q(-.52,.42,-.30,.66); Q(-.34,.90,0,.96);
      Q(.34,.90,.30,.66); Q(.52,.42,.62,0);
      fctx.closePath()},rim);
    // capuche affaissée vers l'avant
    silh(()=>{fctx.beginPath();
      M(-.28,.70); Q(-.24,.98,.06,.98); Q(.30,.94,.24,.72);
      fctx.closePath()},rim);
    // masse posée au sol
    fctx.save();fctx.strokeStyle=rim;fctx.globalAlpha=.75;fctx.lineWidth=1.8;
    fctx.beginPath();M(.44,.52);L(.60,.04);fctx.stroke();
    fctx.beginPath();fctx.arc(x+w*.62,y-h*.02,w*.11,0,6.3);fctx.stroke();
    // chaîne qui pend de la ceinture
    fctx.globalAlpha=.45;fctx.lineWidth=1;
    fctx.beginPath();M(-.20,.44);Q(-.30,.22,-.16,.08);fctx.stroke();
    fctx.restore();fctx.globalAlpha=1;
    // pas d'œil : la capuche est trop basse
    fctx.fillStyle=rim;fctx.globalAlpha=.25+.2*Math.sin(t*1.4);
    fctx.fillRect(x-w*.06,y-h*.84,w*.12,1.1);
  }
  else if(cls==='fossoyeur_pj'){
    /* trapu, chapeau à large bord, pioche sur l'épaule */
    silh(()=>{fctx.beginPath();
      M(-.52,0); L(-.46,.52); Q(-.50,.72,-.24,.78);
      L(-.20,.86); L(.20,.86); L(.24,.78);
      Q(.50,.72,.46,.52); L(.52,0);
      fctx.closePath()},rim);
    silh(()=>{fctx.beginPath();          // chapeau
      M(-.62,.86); L(.62,.86); L(.46,.92); L(.26,.92);
      L(.22,1.06); L(-.22,1.06); L(-.26,.92); L(-.46,.92);
      fctx.closePath()},rim);
    fctx.save();fctx.strokeStyle=rim;fctx.globalAlpha=.8;fctx.lineWidth=1.8;
    fctx.beginPath();M(-.30,.30);L(.54,.96);fctx.stroke();     // manche
    fctx.lineWidth=1.4;
    fctx.beginPath();M(.40,1.00);L(.66,.92);fctx.stroke();     // fer de pioche
    fctx.restore();fctx.globalAlpha=1;
    fctx.fillStyle=rim;fctx.globalAlpha=.4+.3*Math.sin(t*1.8);
    fctx.fillRect(x-w*.14,y-h*.80,w*.28,1.2);
  }
  else {
    /* déserteur : soldat, épaules carrées, cape courte, épée pointe au sol */
    silh(()=>{fctx.beginPath();
      M(-.50,0); L(-.44,.46);
      L(-.56,.68); L(-.30,.76);                  // épaulière gauche
      Q(-.26,.94,0,.96); Q(.26,.94,.30,.76);     // casque
      L(.56,.68); L(.44,.46); L(.50,0);
      fctx.closePath()},rim);
    // cape déchirée derrière
    fctx.save();fctx.globalAlpha=.5;fctx.fillStyle='#050404';
    fctx.beginPath();M(-.52,.70);Q(-.86,.40,-.62,.06);L(-.44,.10);L(-.40,.66);fctx.closePath();fctx.fill();
    fctx.globalAlpha=.4;fctx.strokeStyle=rim;fctx.lineWidth=1;fctx.stroke();fctx.restore();
    fctx.save();fctx.strokeStyle=rim;fctx.globalAlpha=.8;fctx.lineWidth=1.7;
    fctx.beginPath();M(.42,.52);L(1.02,.02);fctx.stroke();     // lame
    fctx.lineWidth=1.3;
    fctx.beginPath();M(.30,.60);L(.54,.44);fctx.stroke();      // garde
    fctx.restore();fctx.globalAlpha=1;
    // fente du casque
    fctx.fillStyle=rim;fctx.globalAlpha=.6+.3*Math.sin(t*2);
    fctx.fillRect(x-w*.16,y-h*.82,w*.32,1.5);
  }
  fctx.globalAlpha=1;
}
function drawEnemy(x,y,h,rim,boss){
  const t=SCENE.t*.001, sway=Math.sin(t*.9)*h*.02;
  const w=h*(boss?.62:.40);
  silh(()=>{
    fctx.beginPath();
    fctx.moveTo(x-w*.5+sway,y);
    fctx.lineTo(x-w*.44+sway,y-h*.55);
    fctx.quadraticCurveTo(x-w*.5+sway,y-h*.80,x-w*.20+sway,y-h*.86);
    fctx.lineTo(x-w*.16+sway,y-h*.98);                       // épaule/corne
    fctx.lineTo(x+sway,y-h*.90);
    fctx.lineTo(x+w*.16+sway,y-h*.98);
    fctx.quadraticCurveTo(x+w*.5+sway,y-h*.80,x+w*.44+sway,y-h*.55);
    fctx.lineTo(x+w*.5+sway,y);
    fctx.closePath();
  },rim);
  if(boss){ // couronne
    fctx.strokeStyle=rim;fctx.lineWidth=1.4;fctx.beginPath();
    for(let i=-2;i<=2;i++){fctx.moveTo(x+i*w*.13+sway,y-h*.90);fctx.lineTo(x+i*w*.13+sway,y-h*1.02)}
    fctx.stroke();
  }
  // yeux
  const blink=Math.sin(t*3)>-.9?1:0;
  fctx.fillStyle=rim;fctx.globalAlpha=.9*blink;
  fctx.fillRect(x-w*.17+sway,y-h*.80,w*.11,1.8);
  fctx.fillRect(x+w*.06+sway,y-h*.80,w*.11,1.8);
  fctx.globalAlpha=1;
}
function drawProp(kind,x,y,h,rim){
  const t=SCENE.t*.001;
  if(kind==='tresor'){
    const w=h*.9;
    silh(()=>{fctx.beginPath();fctx.rect(x-w/2,y-h*.55,w,h*.55);
      fctx.moveTo(x-w/2,y-h*.55);fctx.quadraticCurveTo(x,y-h*.95,x+w/2,y-h*.55);fctx.closePath()},rim);
    fctx.fillStyle=rim;fctx.globalAlpha=.8;fctx.fillRect(x-w*.06,y-h*.60,w*.12,h*.16);fctx.globalAlpha=1;
  }
  if(kind==='repos'){
    const w=h*.7;
    silh(()=>{fctx.beginPath();fctx.moveTo(x-w*.5,y-h*.42);fctx.lineTo(x+w*.5,y-h*.42);
      fctx.lineTo(x+w*.28,y);fctx.lineTo(x-w*.28,y);fctx.closePath();
      fctx.rect(x-w*.10,y-h*.42,w*.20,-h*.04)},rim);
    for(let i=0;i<5;i++){const f=Math.sin(t*3+i)*.5+.5;
      fctx.globalAlpha=.25+f*.5;fctx.fillStyle=rim;
      fctx.beginPath();fctx.ellipse(x+(i-2)*w*.14,y-h*.52-f*h*.22,w*.07,h*.13*(0.6+f*.6),0,0,6.3);fctx.fill()}
    fctx.globalAlpha=1;
  }
  if(kind==='autel'){
    const w=h*.44;
    silh(()=>{fctx.beginPath();fctx.rect(x-w*.5,y-h*.95,w,h*.95);
      fctx.moveTo(x-w*.72,y-h*.95);fctx.lineTo(x+w*.72,y-h*.95);fctx.lineTo(x+w*.5,y-h*.86);fctx.lineTo(x-w*.5,y-h*.86);fctx.closePath()},rim);
    // main tendue
    fctx.strokeStyle=rim;fctx.lineWidth=1.3;fctx.globalAlpha=.85;
    fctx.beginPath();fctx.moveTo(x+w*.5,y-h*.60);fctx.lineTo(x+w*1.0,y-h*.55);fctx.stroke();
    for(let i=0;i<4;i++){fctx.beginPath();fctx.moveTo(x+w*1.0,y-h*.55);
      fctx.lineTo(x+w*(1.16+i*.04),y-h*(.60+i*.025));fctx.stroke()}
    fctx.globalAlpha=1;
  }
  if(kind==='porte'){
    const w=h*1.0;
    fctx.save();
    const g=fctx.createLinearGradient(0,y-h,0,y);
    g.addColorStop(0,rim+'00');g.addColorStop(1,rim+'44');
    fctx.fillStyle=g;fctx.beginPath();
    fctx.moveTo(x-w*.4,y);fctx.lineTo(x-w*.4,y-h*.55);
    fctx.quadraticCurveTo(x,y-h*1.0,x+w*.4,y-h*.55);fctx.lineTo(x+w*.4,y);fctx.closePath();fctx.fill();
    fctx.strokeStyle=rim;fctx.lineWidth=1.4;fctx.globalAlpha=.7;fctx.stroke();fctx.restore();
    fctx.globalAlpha=1;
  }
  if(kind==='event'){
    for(let i=0;i<3;i++){
      const lx=x+(i-1)*h*.55, ly=y-h*(.9+Math.sin(t*.8+i)*.04);
      fctx.strokeStyle=rim;fctx.globalAlpha=.35;fctx.lineWidth=1;
      fctx.beginPath();fctx.moveTo(lx,y-h*1.5);fctx.lineTo(lx,ly);fctx.stroke();
      silh(()=>{fctx.beginPath();fctx.rect(lx-h*.09,ly,h*.18,h*.22)},rim);
      fctx.globalAlpha=.4+.4*Math.sin(t*2+i);fctx.fillStyle=rim;
      fctx.beginPath();fctx.arc(lx,ly+h*.11,h*.05,0,6.3);fctx.fill();fctx.globalAlpha=1;
    }
  }
}
function drawActors(){
  const w=SCENE.w,h=SCENE.h,p=PAL[SCENE.pal],rim=p.ember;
  const ground=h*.94;
  // sol
  const gg=fctx.createLinearGradient(0,ground-h*.12,0,h);
  gg.addColorStop(0,'rgba(0,0,0,0)');gg.addColorStop(1,'rgba(0,0,0,.75)');
  fctx.fillStyle=gg;fctx.fillRect(0,ground-h*.12,w,h*.14);
  const k=SCENE.kind;
  if(k==='combat'||k==='boss'){
    const m=SCENE.mob&&MOBS[SCENE.mob];
    const boss=!!(m&&m.boss);
    drawEnemy(w*.70,ground,h*(boss?.82:m&&m.el?.62:.52),rim,boss);
  } else if(k&&k!=='salle'&&k!=='sanct'){
    drawProp(k,w*.70,ground,h*.42,rim);
  }
  if(SCENE.pal!=='mort')drawPlayer(w*.24,ground,h*.50,rim,P&&P.cls);
  // ombres portées
  fctx.globalAlpha=.4;fctx.fillStyle='#000';
  fctx.beginPath();fctx.ellipse(w*.24,ground+1,h*.10,h*.018,0,0,6.3);fctx.fill();
  if(k==='combat'||k==='boss'){fctx.beginPath();fctx.ellipse(w*.70,ground+1,h*.13,h*.022,0,0,6.3);fctx.fill()}
  fctx.globalAlpha=1;
}
function drawScene(){
  const w=SCENE.w,h=SCENE.h,p=PAL[SCENE.pal],t=SCENE.t;
  if(!w)return;
  const g=fctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,p.sky[0]);g.addColorStop(.55,p.sky[1]);g.addColorStop(1,p.sky[2]);
  fctx.fillStyle=g;fctx.fillRect(0,0,w,h);
  // halo central
  const rg=fctx.createRadialGradient(w*.5,h*.62,4,w*.5,h*.62,w*.7);
  rg.addColorStop(0,p.glow+'55');rg.addColorStop(.4,p.glow+'18');rg.addColorStop(1,'transparent');
  fctx.fillStyle=rg;fctx.fillRect(0,0,w,h);
  // crête de ruines
  fctx.beginPath();fctx.moveTo(-20,h);
  SCENE.ridge.forEach(pt=>fctx.lineTo(pt[0],pt[1]));
  fctx.lineTo(w+20,h);fctx.closePath();
  fctx.fillStyle=p.stone;fctx.globalAlpha=.72;fctx.fill();fctx.globalAlpha=1;
  // colonnes
  SCENE.geo.forEach(c=>{
    fctx.globalAlpha=.5+c.d*.4;
    fctx.fillStyle=p.stone;
    fctx.fillRect(c.x,c.top,c.w,h-c.top);
    fctx.fillStyle='rgba(0,0,0,.5)';fctx.fillRect(c.x,c.top,c.w*.34,h-c.top);
    // chapiteau
    fctx.fillRect(c.x-c.w*.16,c.top,c.w*1.32,4);
  });
  fctx.globalAlpha=1;
  // brume en bandes
  for(let i=0;i<3;i++){
    const y=h*(.55+i*.15)+Math.sin(t*.0006+i)*6;
    const fg=fctx.createLinearGradient(0,y-26,0,y+30);
    fg.addColorStop(0,p.fog+'0)');fg.addColorStop(.5,p.fog+(0.10-i*.02)+')');fg.addColorStop(1,p.fog+'0)');
    fctx.fillStyle=fg;fctx.fillRect(0,y-26,w,58);
  }
  drawActors();
  // particules
  SCENE.parts.forEach(pt=>{
    pt.y+=pt.vy;pt.x+=pt.vx+Math.sin(t*.001+pt.ph)*.22;
    if(pt.y<-4){pt.y=h+4;pt.x=Math.random()*w}
    if(pt.x<-4)pt.x=w+4;if(pt.x>w+4)pt.x=-4;
    const a=pt.a*(.55+.45*Math.sin(t*.003+pt.ph));
    fctx.globalAlpha=a;fctx.fillStyle=p.ember;
    fctx.beginPath();fctx.arc(pt.x,pt.y,pt.r,0,6.3);fctx.fill();
  });
  fctx.globalAlpha=1;
  // scanline de gravure
  fctx.globalAlpha=.06;fctx.fillStyle='#000';
  for(let y=0;y<h;y+=3)fctx.fillRect(0,y,w,1);
  fctx.globalAlpha=1;
  SCENE.t+=16;
}

const dcv=$('#dcv'),dctx=dcv.getContext('2d');
function sizeDie(){const d=Math.min(devicePixelRatio||1,2);const s=dcv.clientWidth||220;
  dcv.width=s*d;dcv.height=s*d;dctx.setTransform(d,0,0,d,0,0);dcv._s=s}
function drawDie(val,spin,heat,faces){
  const s=dcv._s||220,c=s/2,rr=s*0.36;
  dctx.clearRect(0,0,s,s);
  // halo
  const g=dctx.createRadialGradient(c,c,rr*.3,c,c,rr*1.9);
  g.addColorStop(0,`rgba(224,100,26,${0.30*heat})`);g.addColorStop(1,'transparent');
  dctx.fillStyle=g;dctx.fillRect(0,0,s,s);
  dctx.save();dctx.translate(c,c);dctx.rotate(spin);
  const N=faces===6?4:5;
  const pts=[];for(let i=0;i<N;i++){const a=-Math.PI/2+i*2*Math.PI/N;pts.push([Math.cos(a)*rr,Math.sin(a)*rr])}
  // corps
  dctx.beginPath();pts.forEach((p,i)=>i?dctx.lineTo(p[0],p[1]):dctx.moveTo(p[0],p[1]));dctx.closePath();
  const bg=dctx.createLinearGradient(0,-rr,0,rr);
  bg.addColorStop(0,'#2b241d');bg.addColorStop(1,'#0d0b09');
  dctx.fillStyle=bg;dctx.fill();
  dctx.lineWidth=1.6;dctx.strokeStyle=`rgba(224,100,26,${0.25+0.6*heat})`;dctx.stroke();
  // facettes internes
  dctx.lineWidth=1;dctx.strokeStyle=`rgba(201,162,39,${0.16+0.3*heat})`;
  const inner=[];for(let i=0;i<N;i++){const a=-Math.PI/2+(i+0.5)*2*Math.PI/N;inner.push([Math.cos(a)*rr*0.46,Math.sin(a)*rr*0.46])}
  dctx.beginPath();inner.forEach((p,i)=>i?dctx.lineTo(p[0],p[1]):dctx.moveTo(p[0],p[1]));dctx.closePath();dctx.stroke();
  for(let i=0;i<N;i++){dctx.beginPath();dctx.moveTo(pts[i][0],pts[i][1]);dctx.lineTo(inner[i][0],inner[i][1]);dctx.stroke()}
  dctx.restore();
  // valeur
  dctx.fillStyle=heat>.6?'#f0c04a':'#d9cdba';
  dctx.font=`${s*0.22}px ui-monospace,monospace`;
  dctx.textAlign='center';dctx.textBaseline='middle';
  dctx.shadowColor='rgba(224,100,26,.8)';dctx.shadowBlur=14*heat;
  dctx.fillText(String(val),c,c+1);dctx.shadowBlur=0;
}
/* ============ DÉ 3D (Three.js r128, chargé à la demande) ============ */
let D3=null,D3fail=false;
function loadThree(){
  return new Promise((res,rej)=>{
    if(window.THREE)return res();
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
    sc.onload=()=>res();sc.onerror=()=>rej(new Error('cdn'));
    document.head.appendChild(sc);
  });
}
function faceAtlas(){
  const CW=256,CH=256,cv=document.createElement('canvas');
  cv.width=CW*5;cv.height=CH*4;
  const c=cv.getContext('2d');
  c.fillStyle='#070605';c.fillRect(0,0,cv.width,cv.height);
  // même triangle UV que la géométrie : sommet en haut, base en bas
  const TRI=[[.5,.88],[.08,.12],[.92,.12]];
  for(let i=0;i<20;i++){
    const cx=(i%5)*CW, cy=Math.floor(i/5)*CH;
    const px=k=>cx+TRI[k][0]*CW, py=k=>cy+(1-TRI[k][1])*CH;
    c.save();
    c.beginPath();c.moveTo(px(0),py(0));c.lineTo(px(1),py(1));c.lineTo(px(2),py(2));c.closePath();
    c.clip();
    const g=c.createLinearGradient(cx,cy,cx,cy+CH);
    g.addColorStop(0,'#3a2f25');g.addColorStop(.55,'#221b16');g.addColorStop(1,'#0e0b09');
    c.fillStyle=g;c.fillRect(cx,cy,CW,CH);
    // liseré de braise sur les arêtes
    c.lineWidth=9;c.strokeStyle='rgba(224,100,26,.55)';c.stroke();
    c.lineWidth=3;c.strokeStyle='rgba(240,190,110,.35)';c.stroke();
    // chiffre au barycentre visuel du triangle
    const bx=(px(0)+px(1)+px(2))/3;
    const by=(py(0)+py(1)+py(2))/3+CH*0.045;
    const n=String(i+1);
    c.translate(bx,by);
    if(n.length>1)c.scale(.80,1);           // condensé pour 10-20
    c.font='600 78px ui-monospace,"SFMono-Regular",Menlo,monospace';
    c.textAlign='center';c.textBaseline='middle';
    c.fillStyle='rgba(0,0,0,.65)';c.fillText(n,0,4);
    c.fillStyle='#efe3ca';c.fillText(n,0,0);
    // souligne le 6 et le 9
    if(n==='6'||n==='9'){c.strokeStyle='#efe3ca';c.lineWidth=5;
      c.beginPath();c.moveTo(-24,44);c.lineTo(24,44);c.stroke()}
    c.restore();
  }
  const t=new THREE.CanvasTexture(cv);t.anisotropy=8;return t;
}
async function init3D(){
  if(D3)return D3;
  await loadThree();
  const cv=document.getElementById('dcv3');
  const rd=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
  const S=cv.clientWidth||230;
  rd.setPixelRatio(Math.min(devicePixelRatio||1,2));rd.setSize(S,S,false);
  const sc=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(38,1,.1,60);cam.position.set(0,0,7.2);
  const geo=new THREE.IcosahedronGeometry(2,0);
  const pos=geo.attributes.position, nf=pos.count/3;
  const uv=new Float32Array(pos.count*2), normals=[];
  for(let f=0;f<nf;f++){
    const col=f%5,row=Math.floor(f/5);
    const u0=col/5,v0=1-(row+1)/4,uw=1/5,vh=1/4;
    const tri=[[.5,.88],[.08,.12],[.92,.12]];
    for(let k=0;k<3;k++){uv[(f*3+k)*2]=u0+tri[k][0]*uw;uv[(f*3+k)*2+1]=v0+tri[k][1]*vh}
    const v=[0,1,2].map(k=>new THREE.Vector3().fromBufferAttribute(pos,f*3+k));
    normals.push(v[0].clone().add(v[1]).add(v[2]).normalize());
  }
  geo.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  const mat=new THREE.MeshPhongMaterial({map:faceAtlas(),shininess:24,specular:0x554433,
    emissive:0x2a1004,emissiveIntensity:.9,flatShading:true});
  const die=new THREE.Mesh(geo,mat);sc.add(die);
  sc.add(new THREE.AmbientLight(0x50423a,1.1));
  const l1=new THREE.PointLight(0xe0641a,1.5,40);l1.position.set(4,3,6);sc.add(l1);
  const l2=new THREE.PointLight(0x7d8fb0,.7,40);l2.position.set(-5,-2,4);sc.add(l2);
  D3={rd,sc,cam,die,normals,l1};
  return D3;
}
async function roll3D(faces,label,val){
  let d;
  try{ d=await init3D() }catch(e){ D3fail=true; return null }
  $('#dLbl').textContent=label||'';$('#dRes').textContent='';$('#dRes').className='';
  $('#dice').classList.add('on','d3');
  const S=document.getElementById('dcv3').clientWidth||230;
  d.rd.setSize(S,S,false);d.cam.aspect=1;d.cam.updateProjectionMatrix();
  const target=new THREE.Quaternion().setFromUnitVectors(d.normals[(val-1)%d.normals.length],new THREE.Vector3(0,0,1));
  const start=new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.random()*6.3,Math.random()*6.3,Math.random()*6.3));
  const spinAxis=new THREE.Vector3(Math.random()-.5,1,Math.random()-.5).normalize();
  const t0=Date.now(),dur=1150;
  await new Promise(res=>{
    (function anim(){
      const e=Math.min(1,(Date.now()-t0)/dur);
      const ease=1-Math.pow(1-e,4);
      const spin=new THREE.Quaternion().setFromAxisAngle(spinAxis,(1-ease)*22);
      d.die.quaternion.copy(start).slerp(target,ease).multiply(spin);
      d.die.position.y=Math.sin(e*Math.PI)*.9;
      d.l1.intensity=1.5+Math.sin(e*12)*.5*(1-e);
      d.rd.render(d.sc,d.cam);
      if(e<1)requestAnimationFrame(anim);else res();
    })();
  });
  return true;
}

function rollDie2D(faces,label,v){
  return new Promise(res=>{
    $('#dLbl').textContent=label||'';$('#dRes').textContent='';$('#dRes').className='';
    $('#dice').classList.add('on');sizeDie();
    const t0=Date.now(),dur=880;
    (function anim(){
      const e=(Date.now()-t0)/dur;
      if(e<1){
        const ease=1-Math.pow(1-e,3);
        drawDie(e<.82?R(1,faces):v,ease*Math.PI*7,Math.min(1,e*1.6));
        requestAnimationFrame(anim);
      } else { drawDie(v,Math.PI*7,1); res(v) }
    })();
  });
}
async function rollDie(faces,label){

function startFight(mobId,after,ctx){

function drawFight(){

  $('#body').innerHTML=eBar()+(winded()?'<div class="sysline bad">Tu es à bout de souffle — Garde −3, dégâts −25 %. Il faut souffler.</div>':'')+l;

   {row:[

   ]},

async function act(a){
  if(BUSY)return;BUSY=true;
  C.log=[];P.dodge=0;P.parry=0;
  try{
    if(a==='rest'){P.end=Math.min(endMax(),P.end+8);P.dodge=1;clog('Tu recules d\'un pas, arme haute, et reprends ton souffle. <b>+8 END</b>, garde reformée.','good')}
    if(a==='dodge'){if(P.end<2){clog('Plus assez de souffle pour esquiver.','bad')}else{P.end-=2;P.dodge=1;clog('Tu te places de biais, poids sur la jambe arrière. <b>+5 Garde</b>','good')}}
    if(a==='parry'){if(P.end<2){clog('Tes bras tremblent trop pour parer.','bad')}else{P.end-=2;P.parry=1;clog('Lame haute, coude bas. Tu guettes le fer.','good')}}
    if(a==='flee'){await tryFlee();if(!C)return}
    if(a==='atk'){await playerAttack();if(eDead()){await victory();return}}
    if(!C)return;
    await enemyTurn();
    if(!C)return;
    tickSt(t=>clog(t,'bad'));
    if(dead()){await death();return}
    C.turn++;P.end=Math.min(endMax(),P.end+2);
    drawFight();
  } finally { BUSY=false }
}

async function playerAttack(){
  const w=P.arme?ITEMS[P.arme]:{n:'Mains nues',dmg:[2,5],end:1,sc:'FOR',tr:[]};
  const tr=w.tr||[];
  if(P.end<w.end){
    clog('Tu frappes à bout de souffle — le coup part mou.','bad');
    var weak=true;P.end=0;
  } else { P.end-=w.end }
  const b=bonus(w.sc)+(tr.includes('preste')?2:0)+(tr.includes('lourde')?-1:0)+(tr.includes('allonge')?1:0);
  const v=await rollDie(20,`ATTAQUE — ${w.sc} · Garde ${C.m.garde}`);
  const tot=v+b;
  const crit=v===20, hit=crit||(v!==1&&tot>=C.m.garde);
  dieResult(`${v} ${b>=0?'+':''}${b} = ${tot} · ${crit?'COUP FATAL':hit?'TOUCHÉ':'MANQUÉ'}`,crit?'crit':hit?'hit':'miss');
  await sleep(820);hideDie();
  if(!hit){clog(`${v===1?'Ta lame ripe sur la pierre. Tu perds l\'équilibre.':'Il se dérobe. Ton coup fend l\'air.'}`,'bad');
    if(v===1){P.end=Math.max(0,P.end-3);clog('- Déséquilibre : −3 END')}return}
  // dégâts
  let d=R(w.dmg[0],w.dmg[1])+Math.floor(P.s[w.sc]/2)+P.mod.dmg+P.sharp+(P.rage?5:0)+(P.oil?4:0)+((META.upg&&P.arme&&META.upg[P.arme])||0)*2;
  if(weak)d=Math.floor(d*0.5); else if(winded())d=Math.round(d*0.75);
  let arm=C.m.arm||0;
  if(tr.includes('brise'))arm=Math.floor(arm/2);
  if(tr.includes('perce'))arm=Math.max(0,arm-3);
  d=Math.max(1,d-arm);
  const ouv=!crit&&tot>=C.m.garde+6;
  if(crit)d=Math.round(d*2.1);else if(ouv)d=Math.round(d*1.5);
  C.hp-=d;
  flash('#c9a227',crit?.3:.16);shake(crit?7:4);
  clog(crit?`Il s'ouvre entièrement. Tu frappes à fond — <b>${d}</b> dégâts.`:ouv?`Une ouverture. Tu t'y engouffres — <b>${d}</b> dégâts.`:`Tu ouvres la chair — <b>${d}</b> dégâts.`,'good');
  if(tr.includes('saigne')&&R(1,100)<=45){C.st.push({n:'SAIGNE',c:'saign',t:3});clog('* La plaie ne se referme pas.','gold')}
  if(tr.includes('braise')||P.oil){C.hp-=5;clog('* La braise mord la chair. −5 supplémentaires.','gold')}
  if(tr.includes('vorace')){hurt(2);clog('- Cendrelame prélève son péage : −2 PV.','bad')}
  if(C.st.some(s=>s.n==='SAIGNE')){C.hp-=5;clog('- Il saigne. −5.','')}
}

async function enemyTurn(){
  if(eDead())return;
  const m=C.m,tr=m.tr||[];
  C.st=C.st.filter(s=>{s.t--;return s.t>0});
  if(C.stunned>0){C.stunned--;clog(`${m.n} chancelle et perd son tour.`,'good');return}
  const swings=(tr.includes('horde')&&R(1,100)<=35)?2:1;
  if(swings===2)clog(`${m.n} enchaîne deux attaques.`,'bad');
  for(let i=0;i<swings;i++){
    if(dead())return;
    const g=gardeVal()+(P.dodge?5:0);
    const v=await rollDie(20,`${m.n.toUpperCase()} ATTAQUE — ta Garde ${g}`);
    const tot=v+Math.floor(m.init/2)+2;
    const crit=v===20,hit=crit||(v!==1&&tot>=g);
    dieResult(`${v} + ${Math.floor(m.init/2)+2} = ${tot} · ${hit?(crit?'COUP FATAL':'TOUCHÉ'):'ESQUIVÉ'}`,hit?(crit?'miss':'miss'):'hit');
    await sleep(760);hideDie();
    let parried=false, punish=false;
    if(P.parry){
      P.parry=0;
      const pv=await rollDie(20,`PARADE — DEX · son jet : ${tot}`);
      const pb=bonus('DEX')+(P.mod.par||0)+(winded()?-2:0);
      const ptot=pv+pb;
      const win=pv===20||(pv!==1&&ptot>=tot);
      dieResult(`${pv} ${pb>=0?'+':''}${pb} = ${ptot} contre ${tot} · ${win?'PARADE':'DÉBORDÉ'}`,win?'crit':'miss');
      await sleep(820);hideDie();
      if(win){
        const w2=P.arme?ITEMS[P.arme]:{dmg:[2,5],sc:'FOR'};
        const parfait=pv===20||ptot>=tot+5;
        const rd=Math.round((R(w2.dmg[0],w2.dmg[1])+Math.floor(P.s[w2.sc]/2)+P.mod.dmg+P.sharp)*(parfait?1.6:1.1));
        C.hp-=rd;if(parfait)C.stunned=1;
        flash('#c9a227',parfait?.32:.18);shake(parfait?7:4);
        clog(parfait?`Tu prends sa lame sur la tienne et la fais glisser. <b>Riposte parfaite : ${rd} dégâts</b> — il est déséquilibré.`
                    :`Tu dévies le coup et places la pointe. <b>Riposte : ${rd} dégâts.</b>`,'good');
        if(eDead())return;
        continue;
      } else { punish=true; clog('Ta parade part trop tôt. Il passe au travers.','bad') }
    }
    if(!hit&&!punish){clog('Le coup passe à côté.','good');continue}
    let d=R(m.dmg[0],m.dmg[1]);
    if(punish)d=Math.round(d*1.45);
    if(crit)d=Math.round(d*1.8);else if(tot>=g+6)d=Math.round(d*1.35);
    let arm=armorVal();
    if(tr.includes('brise'))arm=Math.floor(arm/2);
    d=Math.max(1,d-arm);
    hurt(d);
    flash('#c62f2a',.3);shake(7);
    clog(`${m.n} ${crit?'te cueille en pleine ouverture':'te frappe'} — <b>−${d} PV</b>.`,'bad');
    if(tr.includes('saigne')&&R(1,100)<=40){addSt('SAIGNEMENT','saign',3);clog('- Tu saignes.','bad')}
    if(tr.includes('poison')&&R(1,100)<=40){addSt('VENIN','poison',3);clog('- Le venin entre.','bad')}
    if(tr.includes('braise')&&R(1,100)<=35){addSt('BRAISE','buff',2);clog('- Tes vêtements prennent feu.','bad')}
    if(tr.includes('malediction')&&R(1,100)<=25){P.endM=Math.max(6,P.endM-1);addSt('MALÉDICTION','malus',5);clog('- Ton souffle se raccourcit. END max −1.','bad')}
  }
}

async function tryFlee(){
  const m=C.m;
  if(m.boss){clog('Il n\'y a pas de porte derrière toi. Il n\'y en a jamais eu.','bad');return}
  const r=await check('DEX',13,'FUITE');
  if(r.ok){
    clog('Tu décroches et disparais dans le noir.','good');
    const perte=Math.min(RUN.cendres,Math.floor(RUN.cendres*0.15));
    RUN.cendres-=perte;
    await sleep(400);
    const after=C.after;C=null;
    render({loc:'REPLI',title:'Tu as reculé',
      text:['Le couloir se referme derrière toi. Tu entends encore ses pas, plus lents, qui renoncent.',

  META.prog.kills[C.id]=(META.prog.kills[C.id]||0)+1;

    text:[pick([
      'Le corps s\'affaisse comme un sac de sable. Quelque chose d\'invisible te traverse la poitrine et s\'installe : chaud, sale, agréable.',
      'Ça met un temps ridiculement long à mourir. Puis plus rien, et le silence revient si vite qu\'on croirait qu\'il n\'a jamais bougé.',
      'Tu essuies ta lame sur ce qui lui reste de manteau. C\'est un geste d\'artisan. Tu ne te souviens pas de l\'avoir appris.'])],
    sys:[`* ${cen} cendres absorbées`].concat(drops.map(id=>`+ ${ITEMS[id].n} récupéré`)),
    choices:[{t:'Continuer',f:()=>{after?after():afterNode()}},
             {t:'Ouvrir la besace',s:`${RUN.sac.length} objets`,f:()=>openInv(false)}]});
  await save();
}

/* ============================================================
   LE RAID — génération, nœuds, extraction
   ============================================================ */
const NODE_ICONS={combat:'⚔',elite:'☠',tresor:'📦',event:'❔',autel:'🕯',repos:'🔥',porte:'🚪',boss:'👑'};
const NODE_NAMES={combat:'Rencontre',elite:'Présence',tresor:'Trouvaille',event:'Passage',
  autel:'Autel éteint',repos:'Braisier',porte:'Seuil',boss:'Le Cœur'};

/* ---- génération du graphe de la profondeur ---- */
function genGraph(d){
  const L=5+d;                       // nombre de couches intermédiaires
  const layers=[[{t:'entree',seed:R(1,99999)}]];
  const bag=[];
  for(let i=0;i<L;i++){const r=R(1,100);
    bag.push(r<=38?'combat':r<=56?'event':r<=70?'tresor':r<=83?'repos':r<=93?'elite':'autel')}
  if(!bag.includes('repos'))bag[R(0,bag.length-1)]='repos';
  if(!bag.includes('tresor'))bag[R(0,bag.length-1)]='tresor';
  let k=0;
  for(let l=0;l<L;l++){
    // largeur : 1 au départ, 2-3 au milieu, resserre à la fin
    let wl = l===0?2 : l>=L-1?2 : R(2,3);
    if(l===L-1)wl=2;
    const row=[];
    for(let n=0;n<wl;n++){
      const t = (k<bag.length)?bag[k++]:pick(['combat','event','tresor','repos']);
      row.push({t,seed:R(1,99999)});
    }
    // garantit qu'une même couche n'est pas deux fois le même type
    if(row.length>1&&row.every(n=>n.t===row[0].t))row[0].t=row[0].t==='combat'?'tresor':'combat';
    layers.push(row);
  }
  layers.push([{t:DEPTHS[d-1].boss?'boss':'porte',seed:R(1,99999)}]);
  // arêtes : chaque nœud pointe vers 1-2 nœuds de la couche suivante, sans croisement absurde
  for(let l=0;l<layers.length-1;l++){
    const A=layers[l],B=layers[l+1];
    A.forEach((n,ai)=>{
      const centre=Math.round(ai*(B.length-1)/Math.max(1,A.length-1)||0);
      const set=new Set([clamp(centre,0,B.length-1)]);
      if(B.length>1&&R(1,100)<=62)set.add(clamp(centre+pick([-1,1]),0,B.length-1));
      n.next=[...set].sort();
    });
    // toute destination doit avoir au moins un parent
    B.forEach((_,bi)=>{
      if(!A.some(n=>n.next.includes(bi))){
        const src=A[clamp(Math.round(bi*(A.length-1)/Math.max(1,B.length-1)),0,A.length-1)];
        src.next=[...new Set(src.next.concat(bi))].sort();
      }
    });
  }
  return layers;
}
function curNode(){return RUN.graph[RUN.pos.l][RUN.pos.i]}
function nodeCount(){return RUN.graph.length-1}
function canExtract(){return RUN.pos.l>=3}

/* ---- LE CARREFOUR : la carte s'ouvre entre deux salles ---- */
const NODE_HINT={combat:'Quelque chose bouge',elite:'Une présence lourde',tresor:'Du métal, du tissu',
 event:'On n\'entend rien',repos:'Une lueur basse',autel:'De la pierre taillée',
 porte:'Un courant d\'air froid',boss:'La chaleur monte'};
/* ============================================================
   LA CARTE — écran plein, dessinée au canvas comme les salles
   ============================================================ */
const mcv=$('#mcv'), mctx=mcv.getContext('2d');
let MAP={on:false,nodes:[],raf:0,t:0,parts:[],ridge:[],seed:1};
function mrnd(){MAP.seed=(MAP.seed*16807)%2147483647;return MAP.seed/2147483647}
function layoutMap(){
  const box=$('#mscroll').getBoundingClientRect();
  const G=RUN.graph, L=G.length;
  const GAP=68, top=96, bot=96;
  const need=top+bot+(L-1)*GAP;
  const W=box.width||360, H=Math.max(box.height||640,need);
  const d=Math.min(devicePixelRatio||1,2);
  mcv.style.height=H+'px';
  mcv.width=W*d;mcv.height=H*d;mctx.setTransform(d,0,0,d,0,0);
  MAP.w=W;MAP.h=H;MAP.gap=GAP;
  MAP.seed=(RUN.graph[0][0].seed||7)+1;
  MAP.nodes=[];
  const cur=curNode();
  const span0=(H-top-bot)/(L-1);
  for(let l=0;l<L;l++){
    const y=top+span0*l;
    const n=G[l].length;
    const span=Math.min(MAP.w*0.70,n*98);
    G[l].forEach((nd,i)=>{
      const x=MAP.w/2+(n===1?0:(i-(n-1)/2)*(span/(n-1||1)));
      const jx=(mrnd()-.5)*10, jy=(mrnd()-.5)*8;
      const visited=RUN.trail&&RUN.trail.includes(l+'.'+i);
      const here=l===RUN.pos.l&&i===RUN.pos.i;
      const open=l===RUN.pos.l+1&&(cur.next||[]).includes(i);
      const known=here||open||visited||RUN.revealed||l===L-1||l===0;
      MAP.nodes.push({l,i,nd,x:x+jx,y:y+jy,here,open,visited,known});
    });
  }
  // cadre la vue : le joueur en haut, les destinations juste en dessous
  const me=MAP.nodes.find(n=>n.here);
  if(me)requestAnimationFrame(()=>{
    const sc2=$('#mscroll');
    sc2.scrollTop=clamp(me.y-(box.height||640)*0.30,0,Math.max(0,H-(box.height||640)));
  });
  // décor
  MAP.ridge=[];let x=-20;
  while(x<MAP.w+20){MAP.ridge.push([x,26+mrnd()*44]);x+=10+mrnd()*30}
  MAP.parts=[];
  for(let k=0;k<40;k++)MAP.parts.push({x:Math.random()*MAP.w,y:Math.random()*MAP.h,
    vy:-(0.10+Math.random()*0.45),r:0.5+Math.random()*1.6,a:0.15+Math.random()*0.6,ph:Math.random()*6.3});
}
function nodeAt(l,i){return MAP.nodes.find(n=>n.l===l&&n.i===i)}
function drawMap(){
  const w=MAP.w,h=MAP.h,p=PAL[DEPTHS[RUN.depth-1].pal],t=MAP.t;
  if(!w)return;
  const g=mctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,p.sky[0]);g.addColorStop(.5,p.sky[1]);g.addColorStop(1,p.sky[2]);
  mctx.fillStyle=g;mctx.fillRect(0,0,w,h);
  // puits de lumière au niveau du joueur
  const me=nodeAt(RUN.pos.l,RUN.pos.i);
  if(me){const rg=mctx.createRadialGradient(me.x,me.y,4,me.x,me.y,420);
    rg.addColorStop(0,p.glow+'44');rg.addColorStop(.45,p.glow+'12');rg.addColorStop(1,'transparent');
    mctx.fillStyle=rg;mctx.fillRect(0,0,w,h)}
  // voûte
  mctx.beginPath();mctx.moveTo(-20,0);
  MAP.ridge.forEach(pt=>mctx.lineTo(pt[0],pt[1]));
  mctx.lineTo(w+20,0);mctx.closePath();
  mctx.fillStyle=p.stone;mctx.globalAlpha=.8;mctx.fill();mctx.globalAlpha=1;
  // brume
  for(let k=0;k<3;k++){
    const y=h*(.30+k*.24)+Math.sin(t*.0005+k)*8;
    const fg=mctx.createLinearGradient(0,y-40,0,y+44);
    fg.addColorStop(0,p.fog+'0)');fg.addColorStop(.5,p.fog+(0.09-k*.02)+')');fg.addColorStop(1,p.fog+'0)');
    mctx.fillStyle=fg;mctx.fillRect(0,y-40,w,84);
  }
  // galeries
  MAP.nodes.forEach(n=>{
    (n.nd.next||[]).forEach(bi=>{
      const b=nodeAt(n.l+1,bi);if(!b)return;
      const live=n.here;
      const done=n.visited&&b.visited;
      mctx.save();
      mctx.strokeStyle=live?p.ember:done?'#4a5a44':'#2a2320';
      mctx.globalAlpha=live?.95:done?.55:.42;
      mctx.lineWidth=live?2:1.1;
      if(!live&&!done)mctx.setLineDash([3,5]);
      // tracé gravé : légère courbure
      const mx=(n.x+b.x)/2+Math.sin((n.x+b.y)*.05)*7, my=(n.y+b.y)/2;
      mctx.beginPath();mctx.moveTo(n.x,n.y+16);
      mctx.quadraticCurveTo(mx,my,b.x,b.y-16);mctx.stroke();
      if(live){mctx.globalAlpha=.35;mctx.lineWidth=5;mctx.stroke();
        // flèche de progression
        const ph=(t*.0012)%1;
        const px=(1-ph)*(1-ph)*n.x+2*(1-ph)*ph*mx+ph*ph*b.x;
        const py=(1-ph)*(1-ph)*(n.y+16)+2*(1-ph)*ph*my+ph*ph*(b.y-16);
        mctx.globalAlpha=.9;mctx.fillStyle=p.ember;
        mctx.beginPath();mctx.arc(px,py,2.2,0,6.3);mctx.fill()}
      mctx.restore();
    });
  });
  // nœuds
  MAP.nodes.forEach(n=>{
    const R0=n.here?21:n.open?20:16;
    const pulse=n.open?Math.sin(t*.004+n.i)*1.6:0;
    const rr=R0+pulse;
    mctx.save();
    if(n.here||n.open){
      const hg=mctx.createRadialGradient(n.x,n.y,2,n.x,n.y,rr*2.4);
      hg.addColorStop(0,(n.here?'rgba(224,100,26,.42)':'rgba(201,162,39,.30)'));
      hg.addColorStop(1,'transparent');
      mctx.fillStyle=hg;mctx.beginPath();mctx.arc(n.x,n.y,rr*2.4,0,6.3);mctx.fill();
    }
    mctx.beginPath();mctx.arc(n.x,n.y,rr,0,6.3);
    mctx.fillStyle=n.visited&&!n.here?'#0b0f0a':'#080706';
    mctx.globalAlpha=n.known?1:.72;mctx.fill();
    mctx.lineWidth=n.here?2:n.open?1.8:1;
    mctx.strokeStyle=n.here?p.ember:n.open?'#c9a227':n.visited?'#3d4a38':'#312a25';
    mctx.globalAlpha=n.known?1:.5;mctx.stroke();
    // couronne de rivets pour les nœuds ouverts
    if(n.open){mctx.globalAlpha=.55;mctx.strokeStyle='#c9a227';mctx.lineWidth=1;
      for(let a=0;a<8;a++){const an=a*Math.PI/4+t*.0006;
        mctx.beginPath();mctx.moveTo(n.x+Math.cos(an)*(rr+4),n.y+Math.sin(an)*(rr+4));
        mctx.lineTo(n.x+Math.cos(an)*(rr+7),n.y+Math.sin(an)*(rr+7));mctx.stroke()}}
    mctx.globalAlpha=n.known?(n.visited&&!n.here?.45:1):.35;
    mctx.font=(n.here?17:14)+'px serif';mctx.textAlign='center';mctx.textBaseline='middle';
    mctx.fillText(n.known?(NODE_ICONS[n.nd.t]||'·'):'?',n.x,n.y+1);
    mctx.restore();
    // étiquette des destinations
    if(n.open){
      mctx.save();mctx.globalAlpha=.92;mctx.fillStyle='#ddd2c0';
      mctx.font='9px ui-monospace,monospace';mctx.textAlign='center';
      mctx.shadowColor='#000';mctx.shadowBlur=6;
      mctx.fillText((NODE_NAMES[n.nd.t]||'').toUpperCase(),n.x,n.y+rr+15);
      mctx.globalAlpha=.6;mctx.fillStyle='#93887c';
      mctx.fillText(n.l===RUN.graph.length-1?'':((NODE_HINT[n.nd.t]||'')),n.x,n.y+rr+26);
      mctx.restore();
    }
    if(n.here){mctx.save();mctx.globalAlpha=.8;mctx.fillStyle=p.ember;
      mctx.font='9px ui-monospace,monospace';mctx.textAlign='center';mctx.shadowColor='#000';mctx.shadowBlur=6;
      mctx.fillText('TU ES ICI',n.x,n.y-rr-11);mctx.restore()}
  });
  // braises
  MAP.parts.forEach(pt=>{
    pt.y+=pt.vy;pt.x+=Math.sin(t*.001+pt.ph)*.2;
    if(pt.y<-4){pt.y=h+4;pt.x=Math.random()*w}
    mctx.globalAlpha=pt.a*(.5+.5*Math.sin(t*.003+pt.ph));mctx.fillStyle=p.ember;
    mctx.beginPath();mctx.arc(pt.x,pt.y,pt.r,0,6.3);mctx.fill();
  });
  mctx.globalAlpha=1;
  // gravure + vignette
  mctx.globalAlpha=.05;mctx.fillStyle='#000';
  for(let y=0;y<h;y+=3)mctx.fillRect(0,y,w,1);
  mctx.globalAlpha=1;
  const vgw=mctx.createLinearGradient(0,0,w,0);
  vgw.addColorStop(0,'rgba(0,0,0,.55)');vgw.addColorStop(.22,'transparent');
  vgw.addColorStop(.78,'transparent');vgw.addColorStop(1,'rgba(0,0,0,.55)');
  mctx.fillStyle=vgw;mctx.fillRect(0,0,w,h);
  MAP.t+=16;
}
function mapLoop(){if(!MAP.on)return;drawMap();MAP.raf=requestAnimationFrame(mapLoop)}
function closeMap(){MAP.on=false;cancelAnimationFrame(MAP.raf);$('#mapscr').classList.remove('on')}
mcv.addEventListener('pointerdown',ev=>{
  if(!MAP.on||BUSY)return;
  const r=mcv.getBoundingClientRect();
  const px=ev.clientX-r.left, py=ev.clientY-r.top;
  const hit=MAP.nodes.find(n=>n.open&&Math.hypot(n.x-px,n.y-py)<32);
  if(hit){flash('#c9a227',.12);closeMap();goNode(hit.l,hit.i)}
});
addEventListener('resize',()=>{if(MAP.on)layoutMap()});

function carrefour(){
  if(RUN.pos.l>=RUN.graph.length-1)return;
  RUN.trail=RUN.trail||[];
  const tag=RUN.pos.l+'.'+RUN.pos.i;
  if(!RUN.trail.includes(tag))RUN.trail.push(tag);
  const D=DEPTHS[RUN.depth-1];
  MAP.on=true;
  $('#mapscr').classList.add('on');
  layoutMap();mapLoop();
  $('#mtitle').textContent=D.nom;
  const val=RUN.sac.reduce((a,id)=>a+ITEMS[id].v,0)+RUN.cendres;
  $('#msub').textContent=`PROFONDEUR ${RUN.depth} · COUCHE ${RUN.pos.l}/${nodeCount()} · ${RUN.sac.length} OBJETS · ${RUN.cendres} ◈`;
  const bot=$('#mbot');bot.innerHTML='';
  const hint=document.createElement('div');hint.className='hint';
  hint.textContent='Touche une galerie éclairée pour t\'y engager';
  bot.appendChild(hint);
  const acts=[];
  if(canExtract()&&RUN.pos.l+1<RUN.graph.length-1)
    acts.push({t:'Chercher une sortie',cls:'exit',s:`sécuriser ${RUN.sac.length} objets · ${val} ◈ estimés`,
      f:()=>{closeMap();extract()}});
  acts.push({row:[
    {t:'Besace',cls:'sub',s:`Pacte ${META.pact.length}/${pactMax()}`,f:()=>openInv(false)},
    {t:'État',cls:'sub',s:`${Math.ceil(P.hp)}/${maxPV()} PV`,f:()=>openChron()}
  ]});
  acts.forEach(a=>{
    if(a.row){const d=document.createElement('div');d.className='actrow';
      a.row.forEach(x=>d.appendChild(mkAct(x)));bot.appendChild(d)}
    else bot.appendChild(mkAct(a));
  });
}
function goNode(l,i){
  closeMap();
  RUN.pos={l,i};
  RUN.trail=RUN.trail||[];
  if(!RUN.trail.includes(l+'.'+i))RUN.trail.push(l+'.'+i);
  const nd=RUN.graph[l][i];
  const D=DEPTHS[RUN.depth-1];
  setScene(D.pal,nd.seed,nd.t==='elite'?'combat':nd.t);
  switch(nd.t){
    case 'combat': return nodeCombat(false);
    case 'elite':  return nodeCombat(true);
    case 'tresor': return nodeTresor();
    case 'event':  return nodeEvent();
    case 'repos':  return nodeRepos();
    case 'autel':  return nodeAutel();
    case 'boss':   return nodeBoss();
    default:       return doorNode();
  }
}
function startRaid(d){
  RUN={depth:d,graph:genGraph(d),pos:{l:0,i:0},cendres:0,sac:[]};
  META.raids++;META.deepest=Math.max(META.deepest||1,d);save();
  const D=DEPTHS[d-1];
  setScene(D.pal,R(1,9999),'porte');
  render({loc:'DESCENTE',depth:`PROFONDEUR ${d}`,title:D.nom,
    text:[D.intro,
      d===1?'Derrière toi, la trappe se referme. Ce n\'est pas un bruit de porte : c\'est un bruit de couvercle.':

    choices:[{t:'Avancer',cls:'gold',f:()=>carrefour()},

}
function hdr(){const D=DEPTHS[RUN.depth-1];return `PROFONDEUR ${RUN.depth} · ${D.nom.toUpperCase()} · ${RUN.pos.l}/${nodeCount()}`}

    text:txt.concat([pick(['Tout ce qui traîne ici a appartenu à quelqu\'un de plus prudent que toi.',

/* ---- SEUIL ---- */
function doorNode(){
  const nxt=RUN.depth<4;
  setScene(DEPTHS[RUN.depth-1].pal,R(1,9999),'porte');
  render({loc:'SEUIL',depth:hdr(),title:'La Porte de Cendres',
    text:['Une arche basse, marquée d\'une empreinte de main noire. Derrière, un escalier qui remonte. Au sol, à côté, une bouche plus étroite qui descend.',
      nxt?'Descendre, c\'est doubler la mise avec le butin déjà en poche. Personne ne t\'oblige à jouer.':
          'Il n\'y a plus rien en dessous. Enfin — plus rien qui ait un nom.'],
    choices:[
      {t:'Franchir le Seuil',cls:'exit',s:'extraire le butin',f:()=>extract()},
      nxt?{t:`Descendre à la profondeur ${RUN.depth+1}`,cls:'danger',s:DEPTHS[RUN.depth].nom,f:()=>{
        const keep={cendres:RUN.cendres,sac:RUN.sac};
        startRaid(RUN.depth+1);RUN.cendres=keep.cendres;RUN.sac=keep.sac;
      }}:null,
      {t:'Besace',s:`${RUN.sac.length} objets`,f:()=>openInv(false)}
    ].filter(Boolean)});
}
async function extract(){
  BUSY=true;closeMap();
  render({loc:'SEUIL',depth:hdr(),title:'Remonter',
    text:['Tu poses la main dans l\'empreinte. La pierre est tiède.','Il reste toujours quelque chose entre toi et la sortie.'],
    choices:[]});
  await sleep(700);
  const r=await check('CHA',9,'PASSAGE DU SEUIL');
  BUSY=false;
  if(!r.ok){
    render({loc:'SEUIL',depth:hdr(),title:'Un gardien du Seuil',
      text:['Quelque chose s\'est assis devant la porte pendant que tu descendais. Ça attendait de savoir si tu reviendrais chargé.'],
      choices:[{t:'Se frayer un chemin',cls:'danger',f:()=>startFight(pick(DEPTHS[RUN.depth-1].elite.concat(DEPTHS[RUN.depth-1].pool)),()=>finishExtract())}]});
    return;
  }
  finishExtract();
}
function finishExtract(){
  const val=RUN.sac.reduce((a,id)=>a+ITEMS[id].v,0);
  RUN.sac.forEach(id=>META.cache.push(id));
  if(P&&P.sac)P.sac.forEach(id=>META.cache.push(id));
  if(P){if(P.arme)META.cache.push(P.arme);if(P.armure)META.cache.push(P.armure);P.rel.forEach(id=>META.cache.push(id));P.arme=null;P.armure=null;P.rel=[];P.sac=[]}
  META.cendres+=RUN.cendres;
  if(val+RUN.cendres>META.best)META.best=val+RUN.cendres;
  META.prog.extracts[RUN.depth]=(META.prog.extracts[RUN.depth]||0)+1;
  const po=PORTER();if(po){po.raids++;po.deepest=Math.max(po.deepest,RUN.depth)}
  const n=RUN.sac.length,cen=RUN.cendres,d=RUN.depth;
  RUN=null;save();
  setScene('sanct',R(1,9999));
  render({loc:'SURFACE',title:'Le Seuil est derrière toi',
    text:['L\'air du dessus a un goût de métal froid. Tu t\'assieds sur la première marche et tu comptes, parce que c\'est la seule chose qui rend la descente supportable.',
      'Ce que tu as ramené est à toi. Définitivement. C\'est tout ce que ce monde accorde encore comme certitude.'],
    sys:[`* Profondeur atteinte : ${d}`,`+ ${n} objets déposés dans la Cachette`,`* ${cen} cendres`,
      `* Valeur du butin : ${val} ◈`],
    choices:[{t:'Rejoindre le Sanctuaire',cls:'gold',f:()=>sanctuary()}]});
}

/* ---- MORT ---- */
async function death(){
  BUSY=true;C=null;closeMap();
  flash('#8c1c22',.55);shake(10);
  setScene('mort',R(1,9999));
  await sleep(500);
  const perdu=RUN?RUN.sac.length:0, cen=RUN?RUN.cendres:0;
  const sauve=META.pact.slice();
  META.pact.forEach(id=>META.cache.push(id));
  META.pact=[];
  META.morts++;
  const d=RUN?RUN.depth:1;
  const po=PORTER();
  const restes=(RUN?RUN.sac.slice():[]).concat(P.sac||[],P.rel||[],[P.arme,P.armure].filter(Boolean));
  if(restes.length||cen>0)META.corpses.push({nom:P.name,depth:d,items:restes.slice(0,10),cendres:cen});
  if(META.corpses.length>5)META.corpses.shift();
  if(po){po.alive=false;po.mort=d}
  META.active=null;
  P.arme=null;P.armure=null;P.rel=[];P.sac=[];
  RUN=null;await save();
  BUSY=false;
  render({loc:'FIN',title:'Tu ne te relèves pas',
    text:[pick(['Ça ne fait pas mal longtemps. C\'est la seule bonne nouvelle des Fosses.',
      'Tu vois le plafond. Il est plus haut que tu ne croyais. Puis il descend.',
      'Le dernier bruit est celui de ta besace qui s\'ouvre.']),
      'Quelque part au-dessus, dans une cave sèche, une poche scellée s\'ouvre toute seule et rend ce qu\'on lui avait confié.',
      'Ton corps, lui, reste où il est tombé. Avec ce qu\'il portait. Quelqu\'un finira par passer par là.',
      '>Le feu ne meurt pas. Toi, si. Aussi souvent qu\'il faudra.'],
    sys:[`- Profondeur ${d} · besace perdue (${perdu} objets, ${cen} cendres)`]
      .concat(sauve.length?sauve.map(id=>`+ ${ITEMS[id].n} sauvé par la Poche du Pacte`):['- La Poche du Pacte était vide.']),
    choices:[{t:'Engager un nouveau porteur',cls:'gold',f:()=>{P=null;openPorteurs(true)}}]});
}

/* ---- CARTE : intégrée au carrefour, plus d'onglet ---- */
function closeOv(){$$('.ov').forEach(o=>o.classList.remove('on'))}

/* ============================================================
   BESACE (en raid) — sac perdu à la mort, Poche du Pacte conservée
   ============================================================ */
function itemRow(id,extra,cls){
  const it=ITEMS[id];
  return `<div class="it ${cls||''}" ${extra||''}>
    <div class="gl">${it.g}</div>
    <div class="nm"><b class="${RAR[it.r]}">${it.n}</b><small>${it.d}</small>
      <small class="${RAR[it.r]}" style="letter-spacing:.16em">${RARN[it.r]}</small></div>
    <div class="vl">${it.v?it.v+' ◈':''}</div></div>`;
}
let INV_CB=null;
function openInv(inCombat){
  const ov=$('#ovInv');
  const eq=[];
  if(P.arme)eq.push(['arme',P.arme]);
  if(P.armure)eq.push(['armure',P.armure]);
  P.rel.forEach(r=>eq.push(['relique',r]));
  const pw=pactMax();
  let h=`<div class="ovh"><h3>Besace</h3><button class="close" onclick="closeOv()">Fermer</button></div><div class="ovc">`;
  h+=`<div class="sect">Équipé</div>`;
  h+= eq.length?eq.map(([k,id])=>itemRow(id,'','eq')).join(''):'<div class="empty">Rien d\'équipé</div>';
  h+=`<div class="sect">Poche du Pacte — ${META.pact.length}/${pw}</div>`;
  h+=`<div class="desc" style="font-size:11.5px">Scellée à la cire. Son contenu revient au Sanctuaire même si tu meurs. Ce que tu y mets, tu ne peux plus l'utiliser pendant le raid.</div>`;
  h+= META.pact.length?META.pact.map((id,i)=>itemRow(id,`onclick="pactOut(${i})"`,'pact')).join(''):'<div class="empty">Vide — tu paries tout</div>';
  h+=`<div class="sect">Sac — ${P.sac.length+(RUN?RUN.sac.length:0)} objets</div>`;
  const all=(RUN?RUN.sac:[]).map((id,i)=>['run',i,id]).concat(P.sac.map((id,i)=>['p',i,id]));
  h+= all.length?all.map(([src,i,id])=>{
    const it=ITEMS[id];
    const act=it.t==='conso'?`useItem('${src}',${i})`:
              (it.t==='arme'||it.t==='armure'||it.t==='relique')?`equipItem('${src}',${i})`:
              `pactIn('${src}',${i})`;
    return `<div class="it" onclick="${act}"><div class="gl">${it.g}</div>
      <div class="nm"><b class="${RAR[it.r]}">${it.n}</b><small>${it.d}</small>
      <small class="${RAR[it.r]}" style="letter-spacing:.16em">${RARN[it.r]}</small>
      <small style="color:var(--or)">${it.t==='conso'?'▸ Utiliser':(it.t==='arme'||it.t==='armure'||it.t==='relique')?'▸ Équiper':'▸ Mettre au Pacte'}${META.pact.length<pw?'  ·  <span onclick="event.stopPropagation();pactIn(\''+src+'\','+i+')">▸ Pacte</span>':''}</small></div>
      <div class="vl">${it.v} ◈</div></div>`}).join('')
    :'<div class="empty">Sac vide</div>';
  h+=`</div>`;
  ov.innerHTML=h;ov.classList.add('on');
  INV_CB=inCombat;
}
function grab(src,i){return src==='run'?RUN.sac[i]:P.sac[i]}
function rm(src,i){return src==='run'?RUN.sac.splice(i,1)[0]:P.sac.splice(i,1)[0]}
function pactIn(src,i){
  if(META.pact.length>=pactMax()){toast('Poche du Pacte pleine');return}
  const id=rm(src,i);META.pact.push(id);save();
  toast(ITEMS[id].n+' scellé');openInv(INV_CB);drawHUD();
}
function pactOut(i){
  const id=META.pact.splice(i,1)[0];
  (RUN?RUN.sac:P.sac).push(id);save();
  toast(ITEMS[id].n+' repris');openInv(INV_CB);
}
function equipItem(src,i){
  const id=grab(src,i),it=ITEMS[id];
  if(it.t==='relique'&&P.rel.length>=3){toast('3 reliques maximum');return}
  rm(src,i);
  if(it.t==='arme'){if(P.arme)(RUN?RUN.sac:P.sac).push(P.arme);P.arme=id}
  else if(it.t==='armure'){if(P.armure)(RUN?RUN.sac:P.sac).push(P.armure);P.armure=id}
  else P.rel.push(id);
  applyMods();P.end=Math.min(P.end,endMax());
  toast(it.n+' équipé');openInv(INV_CB);drawHUD();
}
function useItem(src,i){
  const id=grab(src,i),it=ITEMS[id];
  let msg='';
  if(it.use==='heal'){heal(it.amt);msg=`+${it.amt} PV`}
  if(it.use==='cure'){P.st=P.st.filter(s=>s.n!=='SAIGNEMENT'&&s.n!=='VENIN'&&s.n!=='BRAISE');msg='Blessures nettoyées'}
  if(it.use==='sharp'){P.sharp+=3;msg='+3 dégâts pour le raid'}
  if(it.use==='stam'){P.end=endMax();P.foc=Math.min(focMax(),P.foc+2);msg='Souffle retrouvé'}
  if(it.use==='ward'){P.ward=4;addSt('SEL NOIR','buff',3);msg='+4 Garde'}
  if(it.use==='rage'){P.rage=1;addSt('IVRESSE','malus',4);msg='+5 dégâts, −3 Garde'}
  if(it.use==='stam2'){P.end=Math.min(endMax(),P.end+8);msg='+8 END'}
  if(it.use==='oil'){P.oil=1;msg='Arme huilée : +4 dégâts et braise'}
  if(it.use==='guard'){P.mod.arm+=2;msg='+2 Armure pour le raid'}
  if(it.use==='focus'){P.foc=focMax()+2;msg='Focus débordant'}
  if(it.use==='second'){P.second=1;addSt('VIN NOIR','buff',99);msg='Tu ne tomberas pas la première fois'}
  rm(src,i);toast(msg);
  if(INV_CB&&C){closeOv();C.log.push({t:`Tu utilises <b>${it.n}</b>. ${msg}.`,c:'good'});drawFight();
    // l'objet consomme le tour
    (async()=>{BUSY=true;await enemyTurn();if(C){tickSt(t=>clog(t,'bad'));
      if(dead()){BUSY=false;return death()}C.turn++;P.end=Math.min(endMax(),P.end+2);drawFight()}BUSY=false})();
    return}
  openInv(INV_CB);drawHUD();
}

function sanctuary(){
  C=null;RUN=null;closeMap();
  const po=PORTER();
  if(!po){
    P=null;setScene('sanct',R(1,9999));
    render({loc:'LE SANCTUAIRE',title:'Personne ne descend',
      text:['Le coffre est là. La lampe est là. Il manque quelqu\'un pour la porter.',
        'Il y a toujours quelqu\'un, en haut, qui n\'a plus rien à perdre. C\'est la seule ressource que les Fosses n\'épuisent pas.'],
      sys:[`* ${META.cendres} cendres`,`* ${META.cache.length} objets en réserve`],
      choices:[{t:'Engager un porteur',cls:'gold',f:()=>openPorteurs(true)},
               {t:'Cachette',s:'inspecter la réserve',f:()=>openCache()}]});
    return;
  }
  if(!P||P.cls!==po.cls||P.name!==po.nom)mkChar(po.cls);
  applyMods();P.hp=maxPV();P.end=endMax();P.foc=focMax();P.st=[];P.sharp=0;P.ward=0;P.rage=0;P.oil=0;P.second=0;
  setScene('sanct',R(1,9999));
  const v=META.cache.reduce((a,id)=>a+ITEMS[id].v,0);
  const nm=META.cache.filter(id=>ITEMS[id].t==='mat').length;
  const qd=QUESTS.filter(q=>!META.quests[q.id]&&questDone(q)).length;
  render({loc:'LE SANCTUAIRE',title:'Une cave sous une chapelle brûlée',
    text:['Quatre murs secs, une table, un coffre, un autel sans dieu et une forge qui tire mal. C\'est peu. C\'est à toi.',
      'Le Sanctuaire ne meurt pas. Les porteurs, si. Ils se succèdent ici, ouvrent le même coffre, et repartent.'],
    sys:[`* ${META.cendres} cendres · ${nm} matériaux`,`* ${META.cache.length} objets en réserve (${v} ◈)`,
      `${po.nom} — ${CLASSES.find(c=>c.id===po.cls).n} · ${po.raids} descente${po.raids>1?'s':''}`,
      `Poche du Pacte : ${pactMax()} emplacement${pactMax()>1?'s':''}`],
    choices:[
      {t:'Préparer une descente',cls:'gold',s:'équipement et profondeur',f:()=>prepRaid()},
      {row:[{t:'Cachette',s:`${META.cache.length} objets`,f:()=>openCache()},
            {t:'Contrats',s:qd?`${qd} à réclamer`:'commanditaires',cls:qd?'gold':'',f:()=>openQuests()}]},
      {row:[{t:'Autel',s:'améliorer',f:()=>openAutel()},
            {t:'Forge',s:'fondre / affûter',f:()=>openForge()}]},
      {row:[{t:'Porteurs',s:`${META.roster.filter(p=>p.alive).length} vivant(s)`,f:()=>openPorteurs()},
            {t:'Chroniques',s:'stats',f:()=>openChron()}]},
      {t:'Options',s:`Dés : ${META.dice3d?'3D':'gravure 2D'}`,cls:'sub',f:()=>openOpts()}
    ]});
  save();
}

/* ============ PORTEURS ============ */
function recruitCost(){const n=META.roster.length;return 150+n*120}
function openPorteurs(forced){
  const ov=$('#ovHold');
  const cost=recruitCost();
  let h=`<div class="ovh"><h3>Porteurs</h3>${forced?'':'<button class="close" onclick="closeOv()">Fermer</button>'}</div><div class="ovc">
   <p class="desc">Tous les porteurs partagent la Cachette, les cendres et la Poche du Pacte. Ils ne partagent ni leur chair ni leur expérience. Quand l'un meurt, il ne revient pas.</p>`;
  const vivants=META.roster.filter(p=>p.alive);
  if(vivants.length){h+='<div class="sect">Disponibles</div>';
    h+=vivants.map(p=>{const c=CLASSES.find(x=>x.id===p.cls);
      return `<div class="it ${p.id===META.active?'eq':''}" onclick="setPorter('${p.id}')">
      <div class="gl">${c.g}</div><div class="nm"><b>${p.nom}</b>
      <small>${c.n} · FOR ${c.s.FOR+p.base.FOR} · DEX ${c.s.DEX+p.base.DEX} · FOI ${c.s.FOI+p.base.FOI} · CHA ${c.s.CHA+p.base.CHA}</small>
      <small>${p.raids} descente${p.raids>1?'s':''} · ${p.kills} mise${p.kills>1?'s':''} à mort · profondeur ${p.deepest}</small></div>
      <div class="vl">${p.id===META.active?'ACTIF':'▸'}</div></div>`}).join('')}
  else h+='<div class="empty">Aucun porteur vivant. Il faut engager quelqu\'un.</div>';
  h+=`<div class="sect">Engager — ${cost} ◈</div>`;
  h+=CLASSES.map(c=>`<div class="it" onclick="recruit('${c.id}',${cost})"><div class="gl">${c.g}</div>
    <div class="nm"><b>${c.n}</b><small>${c.d}</small>
    <small style="color:${META.cendres>=cost?'var(--or)':'#5c534b'}">▸ Engager pour ${cost} ◈</small></div></div>`).join('');
  const morts=META.roster.filter(p=>!p.alive);
  if(morts.length){h+='<div class="sect">Épitaphes</div>';
    h+=morts.slice(-8).reverse().map(p=>`<div class="it" style="opacity:.5"><div class="gl">🪦</div>
      <div class="nm"><b>${p.nom}</b><small>${CLASSES.find(x=>x.id===p.cls).n} · ${p.raids} descente(s) · tombé à la profondeur ${p.mort||p.deepest}</small></div></div>`).join('')}
  h+='</div>';ov.innerHTML=h;ov.classList.add('on');

function questProg(q){
  if(q.type==='kill')return META.prog.kills[q.mob]||0;
  if(q.type==='extract')return META.prog.extracts[q.depth]||0;
  return countMat(q.item);
}
const questDone=q=>questProg(q)>=q.need;
function openQuests(){
  const ov=$('#ovHold');
  let h=`<div class="ovh"><h3>Contrats</h3><button class="close" onclick="closeOv()">Fermer</button></div><div class="ovc">

  const open=QUESTS.filter(q=>!META.quests[q.id]);
  const done=QUESTS.filter(q=>META.quests[q.id]);
  h+='<div class="sect">En cours</div>';
  h+= open.length?open.map(q=>{const p=questProg(q),ok=p>=q.need;

    :'<div class="empty">Tous les contrats sont honorés.</div>';

function claimQuest(id){
  const q=QUESTS.find(x=>x.id===id);
  if(!questDone(q))return;
  if(q.type==='deliver'){const r={};r[q.item]=q.need;payMats(r)}
