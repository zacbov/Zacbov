<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Three.js Studio — Convertir, decimer, peindre</title>
<style>
:root{--bg:#07090c;--bg2:#0d1018;--bg3:#141720;--bg4:#1c2030;--border:rgba(255,255,255,.08);--text:#e2ded8;--text2:#8a887f;--text3:#4a4845;--acc:#7ecfa8;--warn:#d4b870}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
#topbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap;flex-shrink:0}
#topbar h1{font-size:14px;font-weight:700;margin-right:6px}
#topbar h1 em{color:var(--acc);font-style:normal}
.btn{background:var(--bg4);color:var(--text);border:1px solid var(--border);padding:6px 12px;border-radius:6px;font-size:11.5px;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);color:#04120b;border:none;font-weight:700}
.btn.active{background:var(--acc);color:#04120b;border-color:var(--acc)}
#toolGroup{display:flex;gap:4px;background:var(--bg3);padding:3px;border-radius:8px}
.sep{width:1px;height:22px;background:var(--border);margin:0 4px}
#colorInput{width:34px;height:30px;border:1px solid var(--border);border-radius:6px;background:none;cursor:pointer;padding:0}
.palette{display:flex;gap:4px}
.swatch{width:20px;height:20px;border-radius:5px;border:1px solid rgba(255,255,255,.25);cursor:pointer}
#brushSizeWrap{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)}
#brushSize{width:90px;accent-color:var(--acc)}
#status{margin-left:auto;font-size:10.5px;color:var(--text3);max-width:320px;text-align:right}
#workspace{flex:1;position:relative;min-height:0;min-width:0}
#codepane{width:0;flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid var(--border);background:#0a0d13;overflow:hidden;transition:width .15s}
#codepane.show{width:42%}
#codehd{padding:8px 12px;border-bottom:1px solid var(--border);background:var(--bg2);font-size:10.5px;color:var(--text3);flex-shrink:0}
#codeOutput{flex:1;overflow:auto;margin:0;padding:12px;font-family:Consolas,"Courier New",monospace;font-size:11px;line-height:1.5;color:#c9d6cf;white-space:pre}
#viewer-canvas{width:100%;height:100%;display:block;background:#0c0f18}
#empty-hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text3);font-size:12px;text-align:center;gap:10px;pointer-events:none}
#empty-hint svg{opacity:.4}
#fileinput{display:none}
#brushCursor{position:absolute;border:2px solid var(--acc);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);opacity:0;display:none}
#treepanel{position:absolute;top:8px;right:8px;background:rgba(13,16,24,.9);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:10.5px;color:var(--text2);max-width:220px;max-height:40vh;overflow:auto}
#treepanel .item{padding:2px 0;cursor:pointer;border-radius:4px;padding-left:4px}
#treepanel .item:hover{background:var(--bg4)}
#treepanel .item.sel{color:var(--acc);font-weight:700}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--bg4);border:1px solid var(--border);padding:6px 16px;border-radius:20px;font-size:11px;color:var(--acc);opacity:0;transition:.25s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
#hexPickerBtn{width:30px;height:30px;border-radius:6px;border:1px solid var(--border);cursor:pointer;background:var(--bg4);font-size:13px;color:var(--text2)}
#hexPopover{position:absolute;top:46px;z-index:30;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#hexPopover.show{display:block}
#svCanvas{border-radius:6px;cursor:crosshair;display:block}
#hueCanvas{border-radius:6px;cursor:crosshair;display:block;margin-top:8px}
#hexRow{display:flex;align-items:center;gap:6px;margin-top:8px}
#hexRow label{font-size:10px;color:var(--text3)}
#hexTextInput{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:12px;padding:4px 6px;font-family:Consolas,monospace}
#hexSwatchPreview{width:22px;height:22px;border-radius:5px;border:1px solid var(--border)}
#transformPanel{position:absolute;bottom:8px;left:8px;background:rgba(13,16,24,.95);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:11px;color:var(--text2);display:none;width:230px}
#transformPanel.show{display:block}
#transformPanel h3{font-size:11.5px;color:var(--text);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
#transformPanel h3 button{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px}
.tf-row{display:flex;align-items:center;gap:5px;margin-bottom:5px}
.tf-row label{width:14px;color:var(--text3);font-size:10px}
.tf-row input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:11px;padding:3px 5px}
.tf-group-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin:6px 0 3px}
#deleteMeshBtn{width:100%;margin-top:8px;background:rgba(200,64,64,.15);border:1px solid rgba(200,64,64,.4);color:#e08080}
#deleteMeshBtn:hover{background:rgba(200,64,64,.3)}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>Three.js <em>Studio</em></h1>
    <button class="btn primary" id="loadBtn">Charger un/des modele(s)</button>
    <input type="file" id="fileinput" accept=".js,.glb,.gltf,.obj,.mtl" multiple>
    <button class="btn" id="clearSceneBtn" title="Retire tous les fichiers charges">Vider la scene</button>
    <div class="sep"></div>
    <div id="toolGroup">
      <button class="btn active" id="toolBucket" title="Pot de peinture — remplit tout un materiau">🪣 Pot</button>
      <button class="btn" id="toolBrush" title="Pinceau — peint des couleurs de vertex localement">🖌️ Pinceau</button>
      <button class="btn" id="toolEyedrop" title="Pipette — recupere une couleur du modele">💧 Pipette</button>
      <button class="btn" id="toolSelect" title="Selection — deplacer, redimensionner, supprimer un maillage">🖱️ Selection</button>
    </div>
    <input type="color" id="colorInput" value="#e06060">
    <div style="position:relative">
      <button id="hexPickerBtn" title="Palette hexadecimale">#</button>
      <div id="hexPopover">
        <canvas id="svCanvas" width="160" height="120"></canvas>
        <canvas id="hueCanvas" width="160" height="14"></canvas>
        <div id="hexRow">
          <div id="hexSwatchPreview"></div>
          <label>#</label>
          <input type="text" id="hexTextInput" maxlength="6" value="E06060">
        </div>
      </div>
    </div>
    <div class="palette" id="palette"></div>
    <div id="brushSizeWrap" style="display:none">
      <span>Taille</span>
      <input type="range" id="brushSize" min="2" max="60" value="16">
    </div>
    <div class="sep"></div>
    <div id="decimWrap" style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)" title="Decime le(s) maillage(s) coche(s) dans l'arborescence, ou le maillage selectionne">
      <span>Decimation</span>
      <input type="range" id="decimSlider" min="0" max="90" value="0" step="5" style="width:80px;accent-color:var(--acc)">
      <span id="decimVal" style="color:var(--acc);width:30px">0%</span>
      <button class="btn" id="applyDecimBtn" style="padding:5px 8px;font-size:10.5px">Appliquer</button>
    </div>
    <div class="sep"></div>
    <button class="btn" id="resetBtn" title="Retire toute couleur ajoutee">Reinitialiser couleurs</button>
    <button class="btn" id="undoBtn" title="Annuler la derniere action">Annuler</button>
    <div class="sep"></div>
    <button class="btn" id="toggleCodeBtn">Voir le code</button>
    <button class="btn" id="copyBtn">Copier le code</button>
    <button class="btn primary" id="downloadBtn">Telecharger .js</button>
    <span id="status"></span>
  </div>
  <div id="mainArea" style="flex:1;display:flex;min-height:0">
  <div id="workspace">
    <canvas id="viewer-canvas"></canvas>
    <div id="empty-hint">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1"><circle cx="20" cy="20" r="16"/><path d="M12 22c2 6 6 8 10 6s6-8 2-12-10-2-12 6z"/></svg>
      <div>Charge un ou plusieurs fichiers <code>.glb</code>, <code>.obj</code>(+<code>.mtl</code>) ou <code>_threejs.js</code><br>(selection multiple = assembles dans la meme scene)<br>puis choisis un outil</div>
    </div>
    <div id="treepanel" style="display:none"></div>
    <div id="transformPanel">
      <h3><span>Maillage selectionne</span><button id="closeTransform">✕</button></h3>
      <input type="text" id="tf-name" style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:4px;color:var(--acc);font-size:11px;padding:4px 6px;margin-bottom:6px">
      <div class="tf-group-label">Position</div>
      <div class="tf-row"><label>X</label><input type="number" step="0.01" id="tfPosX"></div>
      <div class="tf-row"><label>Y</label><input type="number" step="0.01" id="tfPosY"></div>
      <div class="tf-row"><label>Z</label><input type="number" step="0.01" id="tfPosZ"></div>
      <div class="tf-group-label">Echelle</div>
      <div class="tf-row"><label>X</label><input type="number" step="0.01" id="tfScaleX"></div>
      <div class="tf-row"><label>Y</label><input type="number" step="0.01" id="tfScaleY"></div>
      <div class="tf-row"><label>Z</label><input type="number" step="0.01" id="tfScaleZ"></div>
      <div class="tf-group-label">Rotation (deg)</div>
      <div class="tf-row"><label>X</label><input type="number" step="1" id="tfRotX"></div>
      <div class="tf-row"><label>Y</label><input type="number" step="1" id="tfRotY"></div>
      <div class="tf-row"><label>Z</label><input type="number" step="1" id="tfRotZ"></div>
      <button class="btn" id="duplicateMeshBtn" style="width:100%;margin-top:8px">⎘ Dupliquer ce maillage</button>
      <button class="btn" id="deleteMeshBtn">🗑 Supprimer ce maillage</button>
    </div>
  </div>
  <div id="codepane" style="display:none">
    <div id="codehd">
      <span id="codeStats"></span>
    </div>
    <pre id="codeOutput">// Clique sur "Voir le code" apres avoir charge/modifie un modele.</pre>
  </div>
  </div>
</div>
<div id="brushCursor"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/modifiers/SimplifyModifier.js"></script>
<script>
'use strict';

// Shared Draco decoder — GLB files compressed with KHR_draco_mesh_compression
// (e.g. via a compress-glb.sh / gltf-transform draco pipeline) need this to
// decode mesh geometry. Decoder files are fetched lazily from Google's CDN
// only when an actual Draco-compressed file is loaded.
var _dracoLoader = null;
function getDracoLoader(){
  if(!_dracoLoader && typeof THREE.DRACOLoader === 'function'){
    _dracoLoader = new THREE.DRACOLoader();
    _dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
    _dracoLoader.setDecoderConfig({ type: 'js' });
  }
  return _dracoLoader;
}
function createGLTFLoader(){
  var loader = new THREE.GLTFLoader();
  var draco = getDracoLoader();
  if(draco) loader.setDRACOLoader(draco);
  return loader;
}
// Global safety net: an uncaught error anywhere in this file would otherwise
// silently stop ALL subsequent top-level script execution (lighting setup,
// tool wiring, export buttons...), which is very hard to diagnose from the
// outside. Surface it visibly instead of failing silently.
window.addEventListener('error', function(e){
  console.error('Erreur non interceptee:', e.error || e.message);
  try{
    var el = document.getElementById('status') || document.getElementById('stats');
    if(el) el.textContent = 'Erreur JS : ' + (e.message || 'voir la console (F12)');
  }catch(_){}
});
window.addEventListener('unhandledrejection', function(e){
  console.error('Promesse rejetee non interceptee:', e.reason);
});

/* ---------------- Scene setup ---------------- */
var canvas = document.getElementById('viewer-canvas');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0f18);
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
var hemi = new THREE.HemisphereLight(0xddeeff, 0x332922, 0.7); scene.add(hemi);
var d1 = new THREE.DirectionalLight(0xffeedd, 1.15); d1.position.set(2,3,3); scene.add(d1);
var d2 = new THREE.DirectionalLight(0x8899cc, 0.6); d2.position.set(-3,-1,-2); scene.add(d2);
var d3 = new THREE.DirectionalLight(0xffffff, 0.4); d3.position.set(0,-2,3); scene.add(d3);

var camera = new THREE.PerspectiveCamera(40, 1, 0.001, 5000);
camera.position.set(0,0,3);
var controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;

// NOTE: we deliberately do NOT use a PMREMGenerator-based environment map
// here. It kept leaving the renderer in a bad state (rendering to the wrong
// target) on some GPU/driver combinations, making the whole canvas look
// unlit regardless of file. Plain lights are less "physically perfect" for
// fully metallic materials but are 100% reliable — that trade-off wins.

function resize(){
  var W = canvas.clientWidth, H = canvas.clientHeight;
  if(!W || !H) return;
  renderer.setSize(W, H, false);
  camera.aspect = W/H; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

(function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();

/* ---------------- Model loading ---------------- */
// sceneRoot persists for the whole session: every loaded file is added as a
// named sub-group under it instead of replacing what's already there, so
// multiple files can be assembled together in the same scene.
var sceneRoot = new THREE.Group();
sceneRoot.name = 'Scene';
scene.add(sceneRoot);
var currentModel = sceneRoot; // export/tree/select always operate on sceneRoot
var currentFilename = 'scene_assemblee';
var loadedSourceCount = 0;
var meshList = []; // { mesh, name }

function fitCameraToModel(model){
  var box = new THREE.Box3().setFromObject(model);
  var size = box.getSize(new THREE.Vector3());
  var center = box.getCenter(new THREE.Vector3());
  var maxDim = Math.max(size.x, size.y, size.z) || 1;
  var fov = camera.fov * (Math.PI/180);
  var dist = (maxDim/2) / Math.tan(fov/2) * 1.7;
  camera.position.set(center.x, center.y, center.z + dist);
  controls.target.copy(center);
  controls.update();
}

function buildModelFromCode(code){
  var factory = new Function('THREE', code + '\n;return createModel();');
  return factory(THREE);
}

function collectMeshes(model){
  meshList = [];
  model.traverse(function(o){ if(o.isMesh) meshList.push({ mesh:o, name:o.name||'mesh' }); });
}

var treeFilterText = '';
var checkedMeshIdxSet = new Set(); // persists across re-renders (unlike raw DOM checkbox state)

function renderTreePanel(){
  var panel = document.getElementById('treepanel');
  if(meshList.length === 0){ panel.style.display='none'; return; }
  panel.style.display='block';

  var filter = treeFilterText.trim().toLowerCase();
  var visibleIndices = meshList.map(function(m,i){ return i; })
    .filter(function(i){ return !filter || meshList[i].name.toLowerCase().indexOf(filter) !== -1; });

  panel.innerHTML =
    '<div style="color:var(--text3);margin-bottom:4px;">'+meshList.length+' mesh(es) — clic = surligner, case = multi-selection</div>' +
    '<input type="text" id="treeFilter" placeholder="Filtrer par nom..." value="'+escapeHtml(treeFilterText)+'" style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:10.5px;padding:4px 6px;margin-bottom:6px">' +
    '<div style="display:flex;gap:4px;margin-bottom:6px">' +
      '<button class="btn" id="selAllBtn" style="flex:1;padding:3px 4px;font-size:9.5px">Tout ('+visibleIndices.length+')</button>' +
      '<button class="btn" id="selNoneBtn" style="flex:1;padding:3px 4px;font-size:9.5px">Aucun</button>' +
      '<button class="btn" id="selInvBtn" style="flex:1;padding:3px 4px;font-size:9.5px">Inverser</button>' +
    '</div>' +
    visibleIndices.map(function(i){
      var checked = checkedMeshIdxSet.has(i) ? ' checked' : '';
      return '<div class="item"><input type="checkbox" class="item-check" data-i="'+i+'"'+checked+' style="margin-right:4px;vertical-align:middle"><span class="item-label" data-i="'+i+'">'+escapeHtml(meshList[i].name)+'</span></div>';
    }).join('') +
    (visibleIndices.length === 0 ? '<div style="color:var(--text3);padding:6px 0">Aucun resultat</div>' : '') +
    '<div style="display:flex;gap:4px;margin-top:8px">' +
      '<button class="btn" id="groupSelBtn" style="flex:1;padding:4px 6px;font-size:10px">Grouper</button>' +
      '<button class="btn" id="dupSelBtn" style="flex:1;padding:4px 6px;font-size:10px">Dupliquer</button>' +
    '</div>' +
    '<button class="btn" id="paintSelBtn" style="width:100%;margin-top:4px;padding:4px 6px;font-size:10px">🪣 Peindre la selection (couleur active)</button>' +
    '<button class="btn" id="deleteSelBtn" style="width:100%;margin-top:4px;padding:4px 6px;font-size:10px;color:#e08080">🗑 Supprimer la selection</button>';

  Array.prototype.forEach.call(panel.querySelectorAll('.item-label'), function(el){
    el.addEventListener('click', function(){
      var i = parseInt(el.getAttribute('data-i'),10);
      flashMesh(meshList[i].mesh);
      selectMesh(meshList[i].mesh);
    });
  });
  Array.prototype.forEach.call(panel.querySelectorAll('.item-check'), function(cb){
    cb.addEventListener('change', function(){
      var i = parseInt(cb.getAttribute('data-i'),10);
      if(cb.checked) checkedMeshIdxSet.add(i); else checkedMeshIdxSet.delete(i);
    });
  });
  document.getElementById('treeFilter').addEventListener('input', function(e){
    treeFilterText = e.target.value;
    renderTreePanel();
    // Re-focus + restore cursor position since innerHTML rebuild resets the input.
    var f = document.getElementById('treeFilter');
    f.focus(); f.selectionStart = f.selectionEnd = f.value.length;
  });
  document.getElementById('selAllBtn').addEventListener('click', function(){
    visibleIndices.forEach(function(i){ checkedMeshIdxSet.add(i); });
    renderTreePanel();
  });
  document.getElementById('selNoneBtn').addEventListener('click', function(){
    visibleIndices.forEach(function(i){ checkedMeshIdxSet.delete(i); });
    renderTreePanel();
  });
  document.getElementById('selInvBtn').addEventListener('click', function(){
    visibleIndices.forEach(function(i){
      if(checkedMeshIdxSet.has(i)) checkedMeshIdxSet.delete(i); else checkedMeshIdxSet.add(i);
    });
    renderTreePanel();
  });
  document.getElementById('groupSelBtn').addEventListener('click', groupCheckedMeshes);
  document.getElementById('dupSelBtn').addEventListener('click', duplicateCheckedMeshes);
  document.getElementById('paintSelBtn').addEventListener('click', paintCheckedMeshes);
  document.getElementById('deleteSelBtn').addEventListener('click', deleteCheckedMeshes);
}
function checkedMeshIndices(){
  return Array.from(checkedMeshIdxSet).filter(function(i){ return meshList[i]; });
}
function escapeHtml(s){ return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

function paintCheckedMeshes(){
  var idxs = checkedMeshIndices();
  if(idxs.length === 0){ showToast('Coche au moins un maillage'); return; }
  idxs.forEach(function(i){
    var mat = meshList[i].mesh.material;
    mat.color.copy(currentColor);
    if(mat.vertexColors) mat.vertexColors = false;
  });
  showToast(idxs.length + ' maillage(s) peint(s)');
}

function deleteCheckedMeshes(){
  var idxs = checkedMeshIndices();
  if(idxs.length === 0){ showToast('Coche au moins un maillage'); return; }
  if(!confirm('Supprimer definitivement ' + idxs.length + ' maillage(s) ?')) return;
  var removed = idxs.map(function(i){
    var mesh = meshList[i].mesh;
    return { mesh: mesh, parent: mesh.parent };
  });
  removed.forEach(function(r){ r.parent.remove(r.mesh); });
  pushHistory(function(){
    removed.forEach(function(r){ r.parent.add(r.mesh); });
    collectMeshes(currentModel); renderTreePanel();
  });
  checkedMeshIdxSet.clear();
  deselectMesh();
  collectMeshes(currentModel);
  renderTreePanel();
  showToast(removed.length + ' maillage(s) supprime(s)');
}


function flashMesh(mesh){
  var orig = mesh.material.emissive ? mesh.material.emissive.getHex() : null;
  if(mesh.material.emissive){
    mesh.material.emissive.setHex(0x336633);
    setTimeout(function(){ mesh.material.emissive.setHex(orig); }, 500);
  }
}

function loadFromJsCode(code, filename){
  var model;
  try{
    model = buildModelFromCode(code);
  }catch(e){
    showToast('Erreur a l\'execution du code : ' + e.message);
    console.error(e);
    return;
  }
  addModelToScene(model, filename);
}

// Wraps an incoming model in a named container and adds it under sceneRoot,
// keeping whatever was already loaded intact (multi-file assembly).
function addModelToScene(model, filename){
  model.name = model.name || filename.replace(/\.[^.]+$/, '');
  // Snapshot each mesh's original geometry so the decimation slider can
  // always re-derive from the untouched source instead of compounding error.
  model.traverse(function(o){
    if(o.isMesh && o.geometry) o.userData.pristineGeometry = o.geometry.clone();
  });
  sceneRoot.add(model);
  loadedSourceCount++;
  fitCameraToModel(sceneRoot);
  collectMeshes(sceneRoot);
  renderTreePanel();
  document.getElementById('empty-hint').style.display = 'none';
  showToast('Ajoute a la scene : ' + filename + ' (' + loadedSourceCount + ' fichier(s) au total)');
}

function clearScene(){
  while(sceneRoot.children.length) sceneRoot.remove(sceneRoot.children[0]);
  loadedSourceCount = 0;
  meshList = [];
  actionHistory = [];
  checkedMeshIdxSet.clear();
  treeFilterText = '';
  deselectMesh();
  renderTreePanel();
  document.getElementById('empty-hint').style.display = 'flex';
  showToast('Scene videe');
}

  clearScene();
});

function readAsArrayBuffer(file){
  return new Promise(function(resolve, reject){
    var r = new FileReader(); r.onload = function(ev){ resolve(ev.target.result); }; r.onerror = reject; r.readAsArrayBuffer(file);
  });
}
function readAsText(file){
  return new Promise(function(resolve, reject){
    var r = new FileReader(); r.onload = function(ev){ resolve(ev.target.result); }; r.onerror = reject; r.readAsText(file);
  });
}

function loadGlb(file){
  return readAsArrayBuffer(file).then(function(buf){
    return new Promise(function(resolve){
      var loader = createGLTFLoader();
      loader.parse(buf, '', function(gltf){
        addModelToScene(gltf.scene, file.name);
        resolve();
      }, function(err){ showToast('Erreur de parsing GLB : ' + file.name); console.error(err); resolve(); });
    });
  });
}
function loadJsFile(file){
  return readAsText(file).then(function(text){ loadFromJsCode(text, file.name); });
}
function loadObjWithOptionalMtl(objFile, mtlFile){
  function parseObj(materials){
    return readAsText(objFile).then(function(objText){
      var loader = new THREE.OBJLoader();
      if(materials) loader.setMaterials(materials);
      var group;
      try{ group = loader.parse(objText); }
      catch(err){ showToast('Erreur de parsing OBJ : ' + objFile.name); console.error(err); return; }
      group.traverse(function(o){
        if(o.isMesh && o.material && !o.material.name && !materials){
          o.material.color = o.material.color || new THREE.Color(0xaaaaaa);
        }
      });
      addModelToScene(group, objFile.name);
    });
  }
  if(mtlFile){
    return readAsText(mtlFile).then(function(mtlText){
      var mtlLoader = new THREE.MTLLoader();
      var materials = mtlLoader.parse(mtlText, '');
      materials.preload();
      return parseObj(materials);
    });
  }
  return parseObj(null);
}

document.getElementById('fileinput').addEventListener('change', function(e){
  var files = Array.prototype.slice.call(e.target.files);
  if(!files.length) return;

  // Pull out .obj/.mtl pairs first (matched by identical basename), then
  // queue everything else (glb/gltf/js) as independent loads. Loading
  // sequentially means each addModelToScene() sees the state left by the
  // previous file (matters for camera framing / status text).
  var mtlFiles = files.filter(function(f){ return /\.mtl$/i.test(f.name); });
  var objFiles = files.filter(function(f){ return /\.obj$/i.test(f.name); });
  var otherFiles = files.filter(function(f){ return !/\.(mtl|obj)$/i.test(f.name); });

  function baseName(n){ return n.replace(/\.[^.]+$/, '').toLowerCase(); }
  var queue = [];
  objFiles.forEach(function(obj){
    var mtl = mtlFiles.find(function(m){ return baseName(m.name) === baseName(obj.name); }) || mtlFiles[0];
    queue.push({ type:'obj', obj:obj, mtl:mtl });
  });
  otherFiles.forEach(function(f){
    queue.push({ type: /\.(glb|gltf)$/i.test(f.name) ? 'glb' : 'js', file:f });
  });

  (function next(i){
    if(i >= queue.length){ e.target.value = ''; return; }
    var item = queue[i];
    var p = item.type === 'obj' ? loadObjWithOptionalMtl(item.obj, item.mtl)
          : item.type === 'glb' ? loadGlb(item.file)
          : loadJsFile(item.file);
    Promise.resolve(p).then(function(){ next(i+1); });
  })(0);
});

/* ---------------- Raycasting helpers ---------------- */
var raycaster = new THREE.Raycaster();
var mouseNdc = new THREE.Vector2();
function ndcFromEvent(e){
  var rect = canvas.getBoundingClientRect();
  mouseNdc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouseNdc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
}
function intersectModel(e){
  if(!currentModel) return null;
  ndcFromEvent(e);
  raycaster.setFromCamera(mouseNdc, camera);
  var hits = raycaster.intersectObject(currentModel, true);
  return hits.length ? hits[0] : null;
}

/* ---------------- Bucket tool: fills a whole material's color ---------------- */
function applyBucket(hit){
  var mesh = hit.object;
  if(!mesh.isMesh) return;
  var mat = mesh.material;
  var prevColor = mat.color.clone();
  var prevVC = mat.vertexColors;
  mat.color.copy(currentColor);
  // If this mesh currently relies on vertex colors, disable them so the
  // flat fill actually shows (otherwise vertex color would multiply it away).
  if(mat.vertexColors) mat.vertexColors = false;
  pushHistory(function(){ mat.color.copy(prevColor); mat.vertexColors = prevVC; });
  setStatus('Pot applique sur "' + (mesh.name||'mesh') + '"');
}

/* ---------------- Eyedropper ---------------- */
function applyEyedrop(hit){
  var mesh = hit.object;
  if(!mesh.isMesh) return;
  var hex = '#' + mesh.material.color.getHexString();
  currentColor.set(hex);
  var ci = document.getElementById('colorInput');
  ci.value = hex;
  ci.dispatchEvent(new Event('input'));
  setStatus('Couleur recuperee sur "' + (mesh.name||'mesh') + '"');
}

/* ---------------- Brush tool: paints vertex colors near the hit point ---------------- */
function ensureVertexColors(mesh){
  var geom = mesh.geometry;
  if(!geom.attributes.color){
    var count = geom.attributes.position.count;
    var arr = new Float32Array(count * 3).fill(1); // start white so painting shows true hue
    geom.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  }
  if(!mesh.material.vertexColors){
    mesh.material.vertexColors = THREE.VertexColors;
    mesh.material.needsUpdate = true;
    // A flat white base color multiplies cleanly with vertex colors.
    mesh.material.color.set(0xffffff);
  }
}

function applyBrush(hit){
  var mesh = hit.object;
  if(!mesh.isMesh) return;
  ensureVertexColors(mesh);
  var geom = mesh.geometry;
  var posAttr = geom.attributes.position;
  var colorAttr = geom.attributes.color;

  // Convert brush radius from screen pixels to world units at the hit distance.
  var dist = camera.position.distanceTo(hit.point);
  var vFov = camera.fov * Math.PI/180;
  var worldPerPixel = (2 * Math.tan(vFov/2) * dist) / canvas.clientHeight;
  var radiusWorld = brushRadiusPx * worldPerPixel;

  var localPoint = mesh.worldToLocal(hit.point.clone());
  var v = new THREE.Vector3();
  var touched = [];
  for(var i=0;i<posAttr.count;i++){
    v.fromBufferAttribute(posAttr, i);
    var d = v.distanceTo(localPoint);
    if(d <= radiusWorld){
      var falloff = 1 - (d / radiusWorld); // soft edge
      var idx = i*3;
      var prev = [colorAttr.array[idx], colorAttr.array[idx+1], colorAttr.array[idx+2]];
      touched.push({ idx: idx, prev: prev });
      colorAttr.array[idx]   += (currentColor.r - colorAttr.array[idx])   * falloff;
      colorAttr.array[idx+1] += (currentColor.g - colorAttr.array[idx+1]) * falloff;
      colorAttr.array[idx+2] += (currentColor.b - colorAttr.array[idx+2]) * falloff;
    }
  }
  colorAttr.needsUpdate = true;
  if(touched.length){
    pushHistory(function(){
      touched.forEach(function(t){
        colorAttr.array[t.idx] = t.prev[0];
        colorAttr.array[t.idx+1] = t.prev[1];
        colorAttr.array[t.idx+2] = t.prev[2];
      });
      colorAttr.needsUpdate = true;
    });
  }
  setStatus('Pinceau: ' + touched.length + ' vertices peints sur "' + (mesh.name||'mesh') + '"');
}

// Clones a mesh (independent geometry + material so painting one doesn't
// affect the other) as a sibling, offset slightly so it's visible, and
// records an undo step that removes it again.
function duplicateMesh(mesh){
  var dup = mesh.clone();
  dup.geometry = mesh.geometry.clone();
  dup.material = mesh.material.clone();
  dup.name = (mesh.name || 'mesh') + '_copie';
  dup.position.x += (new THREE.Box3().setFromObject(mesh).getSize(new THREE.Vector3()).x || 0.1) * 0.15;
  mesh.parent.add(dup);
  pushHistory(function(){
    dup.parent && dup.parent.remove(dup);
    collectMeshes(currentModel); renderTreePanel();
  });
  return dup;
}

// Groups the checked meshes under a new THREE.Group using .attach() so each
// mesh keeps its current world position/rotation/scale (only its parent
// changes). Undo re-attaches each mesh back to its original parent.
function groupCheckedMeshes(){
  var idxs = checkedMeshIndices();
  if(idxs.length < 2){ showToast('Coche au moins 2 maillages a grouper'); return; }
  var groupName = prompt('Nom du groupe :', 'Groupe') || 'Groupe';
  var group = new THREE.Group();
  group.name = groupName;
  var meshesToGroup = idxs.map(function(i){ return meshList[i].mesh; });
  var originalParents = meshesToGroup.map(function(m){ return m.parent; });

  sceneRoot.add(group);
  meshesToGroup.forEach(function(m){ group.attach(m); });

  pushHistory(function(){
    meshesToGroup.forEach(function(m, k){ originalParents[k].attach(m); });
    sceneRoot.remove(group);
    collectMeshes(currentModel); renderTreePanel();
  });

  checkedMeshIdxSet.clear();
  collectMeshes(currentModel);
  renderTreePanel();
  showToast(meshesToGroup.length + ' maillages groupes dans "' + groupName + '"');
}


/* ---------------- Decimation (uses each mesh's stored pristine geometry) ---------------- */
var simplifier = null;
var decimRunToken = 0;
function getSimplifier(){ if(!simplifier) simplifier = new THREE.SimplifyModifier(); return simplifier; }

document.getElementById('decimSlider').addEventListener('input', function(e){
  document.getElementById('decimVal').textContent = e.target.value + '%';
});

document.getElementById('applyDecimBtn').addEventListener('click', function(){
  var percent = parseInt(document.getElementById('decimSlider').value, 10);
  var idxs = checkedMeshIndices();
  var targets;
  if(idxs.length > 0) targets = idxs.map(function(i){ return meshList[i].mesh; });
  else if(selectedMesh) targets = [selectedMesh];
  else targets = meshList.map(function(m){ return m.mesh; });

  if(targets.length === 0){ showToast('Aucun maillage a decimer'); return; }

  var myToken = ++decimRunToken;
  var idx = 0, changed = 0, failed = 0;
  setStatus('Decimation 0/' + targets.length + '...');

  function processNext(){
    if(myToken !== decimRunToken) return; // superseded by a newer click
    if(idx >= targets.length){
      setStatus('Decimation terminee (' + changed + ' mesh(es) modifie(s)' + (failed ? ', ' + failed + ' echec(s)' : '') + ')');
      if(codePaneOpen) refreshCodePane();
      return;
    }
    var mesh = targets[idx];
    var pristine = mesh.userData.pristineGeometry;
    if(pristine && pristine.attributes.position){
      if(percent <= 0){
        mesh.geometry.dispose();
        mesh.geometry = pristine.clone();
        changed++;
      } else {
        var vertCount = pristine.attributes.position.count;
        var removeCount = Math.min(Math.floor(vertCount*(percent/100)), Math.max(vertCount-4, 0));
        if(removeCount > 0){
          try{
            var simplified = getSimplifier().modify(pristine.clone(), removeCount);
            mesh.geometry.dispose();
            mesh.geometry = simplified;
            changed++;
          }catch(err){
            failed++;
            console.warn('Simplification impossible pour un mesh:', err.message);
          }
        }
      }
    }
    idx++;
    setStatus('Decimation ' + idx + '/' + targets.length + '...');
    setTimeout(processNext, 0); // yield to the UI thread between meshes
  }
  processNext();
});


(function setupHexPicker(){
  var btn = document.getElementById('hexPickerBtn');
  var pop = document.getElementById('hexPopover');
  var svCanvas = document.getElementById('svCanvas');
  var hueCanvas = document.getElementById('hueCanvas');
  var svCtx = svCanvas.getContext('2d');
  var hueCtx = hueCanvas.getContext('2d');
  var hexInput = document.getElementById('hexTextInput');
  var preview = document.getElementById('hexSwatchPreview');
  var hue = 0; // 0-360

  function drawHue(){
    var grad = hueCtx.createLinearGradient(0,0,hueCanvas.width,0);
    for(var i=0;i<=6;i++) grad.addColorStop(i/6, 'hsl('+(i*60)+',100%,50%)');
    hueCtx.fillStyle = grad;
    hueCtx.fillRect(0,0,hueCanvas.width,hueCanvas.height);
  }
  function drawSV(){
    svCtx.fillStyle = 'hsl('+hue+',100%,50%)';
    svCtx.fillRect(0,0,svCanvas.width,svCanvas.height);
    var whiteGrad = svCtx.createLinearGradient(0,0,svCanvas.width,0);
    whiteGrad.addColorStop(0,'rgba(255,255,255,1)');
    whiteGrad.addColorStop(1,'rgba(255,255,255,0)');
    svCtx.fillStyle = whiteGrad;
    svCtx.fillRect(0,0,svCanvas.width,svCanvas.height);
    var blackGrad = svCtx.createLinearGradient(0,0,0,svCanvas.height);
    blackGrad.addColorStop(0,'rgba(0,0,0,0)');
    blackGrad.addColorStop(1,'rgba(0,0,0,1)');
    svCtx.fillStyle = blackGrad;
    svCtx.fillRect(0,0,svCanvas.width,svCanvas.height);
  }
  drawHue(); drawSV();

  function updateFromHex(hex, skipInput){
    currentColor.set('#'+hex);
    document.getElementById('colorInput').value = '#'+hex;
    preview.style.background = '#'+hex;
    if(!skipInput) hexInput.value = hex.toUpperCase();
  }

  function pickSV(e){
    var rect = svCanvas.getBoundingClientRect();
    var x = Math.max(0, Math.min(svCanvas.width, e.clientX - rect.left));
    var y = Math.max(0, Math.min(svCanvas.height, e.clientY - rect.top));
    var s = x / svCanvas.width;
    var v = 1 - (y / svCanvas.height);
    var c = new THREE.Color().setHSL(hue/360, s, v * (1 - s/2)); // approx HSV->HSL blend for a natural feel
    // More accurate HSV -> RGB:
    var rgb = hsvToRgb(hue/360, s, v);
    var hex = rgbToHex(rgb.r, rgb.g, rgb.b);
    updateFromHex(hex);
  }
  function pickHue(e){
    var rect = hueCanvas.getBoundingClientRect();
    var x = Math.max(0, Math.min(hueCanvas.width, e.clientX - rect.left));
    hue = (x / hueCanvas.width) * 360;
    drawSV();
  }
  function hsvToRgb(h,s,v){
    var i = Math.floor(h*6), f = h*6-i, p = v*(1-s), q = v*(1-f*s), t = v*(1-(1-f)*s);
    var r,g,b;
    switch(i%6){
      case 0: r=v;g=t;b=p;break; case 1: r=q;g=v;b=p;break; case 2: r=p;g=v;b=t;break;
      case 3: r=p;g=q;b=v;break; case 4: r=t;g=p;b=v;break; default: r=v;g=p;b=q;
    }
    return { r: Math.round(r*255), g: Math.round(g*255), b: Math.round(b*255) };
  }
  function rgbToHex(r,g,b){
    return ((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1).toUpperCase();
  }

  var draggingSV = false, draggingHue = false;
  svCanvas.addEventListener('pointerdown', function(e){ draggingSV = true; pickSV(e); });
  window.addEventListener('pointermove', function(e){ if(draggingSV) pickSV(e); if(draggingHue) pickHue(e); });
  window.addEventListener('pointerup', function(){ draggingSV = false; draggingHue = false; });
  hueCanvas.addEventListener('pointerdown', function(e){ draggingHue = true; pickHue(e); });

  hexInput.addEventListener('input', function(){
    var v = hexInput.value.replace(/[^0-9a-fA-F]/g,'').slice(0,6);
    if(v.length === 6) updateFromHex(v, true);
  });

  btn.addEventListener('click', function(e){
    e.stopPropagation();
    pop.classList.toggle('show');
  });
  document.addEventListener('click', function(e){
    if(!pop.contains(e.target) && e.target !== btn) pop.classList.remove('show');
  });

  // Keep native color input + hex field in sync when the color changes from elsewhere (palette, eyedropper).
  document.getElementById('colorInput').addEventListener('input', function(e){
    hexInput.value = e.target.value.replace('#','').toUpperCase();
    preview.style.background = e.target.value;
  });
})();


/* ---------------- Code generation (ported from the GLB/OBJ converter) ---------------- */
function typedArrayToBase64(typedArray){
  var bytes = new Uint8Array(typedArray.buffer, typedArray.byteOffset, typedArray.byteLength);
  var binary = '';
  var chunk = 0x8000;
  for(var i=0;i<bytes.length;i+=chunk) binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  return btoa(binary);
}
function decodeFnForArray(arr){
  if(arr instanceof Float32Array) return 'b64ToFloat32';
  if(arr instanceof Uint8Array) return 'b64ToUint8';
  if(arr instanceof Int8Array) return 'b64ToInt8';
  if(arr instanceof Uint16Array) return 'b64ToUint16';
  if(arr instanceof Int16Array) return 'b64ToInt16';
  if(arr instanceof Uint32Array) return 'b64ToUint32';
  if(arr instanceof Int32Array) return 'b64ToInt32';
  return 'b64ToFloat32';
}
function fmtNum(n){ if(n===undefined||n===null||isNaN(n)) return '0'; return String(Math.round(n*1e5)/1e5); }
function sanitizeVarName(name, fallback){
  // Null-safe: works even if both name and fallback are empty/undefined
  // (unnamed materials/meshes are common, especially from OBJ or AI-generated GLBs).
  var n = String(name || fallback || 'obj');
  n = n.replace(/[^a-zA-Z0-9_]/g,'_');
  if(!/^[a-zA-Z_]/.test(n)) n = '_'+n;
  return n;
}
function fmtBytesUI(n){
  if(n < 1024) return n + ' o';
  if(n < 1024*1024) return (n/1024).toFixed(1) + ' Ko';
  return (n/1024/1024).toFixed(2) + ' Mo';
}

function computeUvBounds(geom){
  var uv = geom && geom.attributes && geom.attributes.uv;
  if(!uv) return null;
  var uMin=Infinity, uMax=-Infinity, vMin=Infinity, vMax=-Infinity;
  for(var i=0;i<uv.count;i++){
    var u=uv.getX(i), v=uv.getY(i);
    if(u<uMin) uMin=u; if(u>uMax) uMax=u;
    if(v<vMin) vMin=v; if(v>vMax) vMax=v;
  }
  if(!isFinite(uMin)||!isFinite(uMax)) return null;
  return { uMin:uMin, uMax:uMax, vMin:vMin, vMax:vMax };
}

// Restricts sampling to the UV rectangle a mesh actually uses in a shared
// texture atlas (rather than averaging the whole image, which washes every
// material toward the same tone when several materials share one atlas).
function sampleAverageTextureColor(image, uvBounds){
  try{
    if(!image || !(image.width > 0)) return null;
    var iw=image.width, ih=image.height, sx=0, sy=0, sw=iw, sh=ih;
    if(uvBounds && isFinite(uvBounds.uMin) && isFinite(uvBounds.uMax)){
      var uMin=Math.max(0,Math.min(1,uvBounds.uMin)), uMax=Math.max(0,Math.min(1,uvBounds.uMax));
      var vMin=Math.max(0,Math.min(1,uvBounds.vMin)), vMax=Math.max(0,Math.min(1,uvBounds.vMax));
      if(uMax>uMin && vMax>vMin){
        sx=Math.floor(uMin*iw); sw=Math.max(1,Math.ceil((uMax-uMin)*iw));
        sy=Math.floor((1-vMax)*ih); sh=Math.max(1,Math.ceil((vMax-vMin)*ih));
      }
    }
    var c=document.createElement('canvas'); c.width=8; c.height=8;
    var ctx=c.getContext('2d');
    ctx.drawImage(image, sx, sy, sw, sh, 0, 0, 8, 8);
    var data=ctx.getImageData(0,0,8,8).data;
    var r=0,g=0,b=0,n=0;
    for(var i=0;i<data.length;i+=4){ if(data[i+3]<8) continue; r+=data[i]; g+=data[i+1]; b+=data[i+2]; n++; }
    if(n===0) return null;
    return { r:r/n, g:g/n, b:b/n };
  }catch(e){ return null; }
}

var TEXTURE_EMBED_BUDGET = 260000; // ~260KB of base64 per texture slot
function encodeTextureDataURL(image, allowAlpha){
  if(!image || !(image.width > 0)) return null;
  var sizes = [1024,512,256,128,64];
  var c = document.createElement('canvas');
  var ctx = c.getContext('2d');
  function attempt(maxDim, mime, quality){
    var scale = Math.min(1, maxDim / Math.max(image.width, image.height));
    c.width = Math.max(1, Math.round(image.width*scale));
    c.height = Math.max(1, Math.round(image.height*scale));
    ctx.clearRect(0,0,c.width,c.height);
    ctx.drawImage(image, 0, 0, c.width, c.height);
    return quality!==undefined ? c.toDataURL(mime, quality) : c.toDataURL(mime);
  }
  try{
    for(var i=0;i<sizes.length;i++){
      var url = attempt(sizes[i], 'image/png');
      if(url.length <= TEXTURE_EMBED_BUDGET) return url;
    }
    if(!allowAlpha){
      for(var j=0;j<sizes.length;j++){
        var url2 = attempt(sizes[j], 'image/jpeg', 0.82);
        if(url2.length <= TEXTURE_EMBED_BUDGET) return url2;
      }
    }
    return null;
  }catch(e){ return null; }
}
function textureVarCode(name, tex, isColorData){
  var url = encodeTextureDataURL(tex.image, isColorData);
  if(!url) return null;
  var lines = [];
  lines.push('var '+name+' = _texLoader.load("'+url+'");');
  if(tex.wrapS !== THREE.ClampToEdgeWrapping) lines.push(name+'.wrapS = '+wrapName(tex.wrapS)+';');
  if(tex.wrapT !== THREE.ClampToEdgeWrapping) lines.push(name+'.wrapT = '+wrapName(tex.wrapT)+';');
  if(tex.repeat && (tex.repeat.x!==1 || tex.repeat.y!==1)) lines.push(name+'.repeat.set('+fmtNum(tex.repeat.x)+', '+fmtNum(tex.repeat.y)+');');
  if(tex.offset && (tex.offset.x!==0 || tex.offset.y!==0)) lines.push(name+'.offset.set('+fmtNum(tex.offset.x)+', '+fmtNum(tex.offset.y)+');');
  if(tex.flipY === false) lines.push(name+'.flipY = false;');
  if(isColorData) lines.push(name+'.encoding = THREE.sRGBEncoding;');
  return lines.join('\n');
}
function wrapName(w){
  if(w === THREE.RepeatWrapping) return 'THREE.RepeatWrapping';
  if(w === THREE.MirroredRepeatWrapping) return 'THREE.MirroredRepeatWrapping';
  return 'THREE.ClampToEdgeWrapping';
}

// Some GLB exporters (common with AI-generated models like Tripo/Meshy)
// pack position/normal/uv into a single INTERLEAVED buffer for compactness.
// attribute.array in that case is the whole shared buffer, not just this
// attribute's data — reading it directly produces garbage geometry/normals
// (often rendering solid black). getComponent() works correctly for both
// interleaved and plain attributes, so we always rebuild a clean, tightly
// packed typed array through it instead of ever touching .array directly.
function extractAttributeArray(attr){
  // NOTE: BufferAttribute.getComponent() does not exist in three r128 (added
  // in later revisions) — use the getX/getY/getZ/getW accessors instead,
  // which are available on both plain and interleaved attributes there.
  var itemSize = attr.itemSize;
  var count = attr.count;
  var srcArray = (attr.data && attr.data.array) ? attr.data.array : attr.array;
  var Ctor = srcArray.constructor;
  var out = new Ctor(count * itemSize);
  var getters = [attr.getX, attr.getY, attr.getZ, attr.getW];
  for(var i=0;i<count;i++){
    for(var k=0;k<itemSize;k++){
      out[i*itemSize+k] = getters[k].call(attr, i);
    }
  }
  return out;
}

function geometryToCode(geom, varName){
  var lines = [];
  lines.push('var '+varName+' = new THREE.BufferGeometry();');
  var attrs = geom.attributes;
  ['position','normal','uv','color'].forEach(function(key){
    if(attrs[key]){
      var a = attrs[key];
      var plainArray = extractAttributeArray(a);
      var b64 = typedArrayToBase64(plainArray);
      var decodeFn = decodeFnForArray(plainArray);
      lines.push(varName+'.setAttribute("'+key+'", new THREE.BufferAttribute('+decodeFn+'("'+b64+'"), '+a.itemSize+', '+(a.normalized?'true':'false')+'));');
    }
  });
  if(geom.index){
    var isU32 = geom.index.array instanceof Uint32Array;
    lines.push(varName+'.setIndex(new THREE.BufferAttribute('+(isU32?'b64ToUint32':'b64ToUint16')+'("'+typedArrayToBase64(geom.index.array)+'"), 1));');
  }
  if(!attrs.normal) lines.push(varName+'.computeVertexNormals();');
  return lines.join('\n');
}

function materialToCode(mat, varName, uvBounds){
  var lines = [];
  var type = 'THREE.MeshStandardMaterial';
  if(mat.type === 'MeshBasicMaterial') type = 'THREE.MeshBasicMaterial';
  else if(mat.type === 'MeshPhysicalMaterial') type = 'THREE.MeshPhysicalMaterial';

  var props = [], notes = [], texDecls = [];
  var embeddedCount = 0, skippedCount = 0;

  var colorHex = mat.color ? mat.color.getHexString() : 'ffffff';
  if(mat.map && mat.map.image){
    var mapVar = varName + '_map';
    var mapCode = textureVarCode(mapVar, mat.map, true);
    if(mapCode){
      texDecls.push(mapCode);
      props.push('  map: '+mapVar+',');
      embeddedCount++;
    } else {
      var sampled = sampleAverageTextureColor(mat.map.image, uvBounds);
      if(sampled){
        var baseColor = mat.color || new THREE.Color(1,1,1);
        var blended = new THREE.Color(sampled.r/255, sampled.g/255, sampled.b/255).multiply(baseColor);
        colorHex = blended.getHexString();
        notes.push('  // texture trop volumineuse pour etre embarquee — couleur approximee a partir de la region UV utilisee');
      }
      skippedCount++;
    }
  }
  props.push('  color: 0x'+colorHex+',');

  if(mat.metalness !== undefined) props.push('  metalness: '+fmtNum(mat.metalness)+',');
  if(mat.roughness !== undefined) props.push('  roughness: '+fmtNum(mat.roughness)+',');

  var extraMaps = [
    { key:'normalMap', prop:'normalMap', colorData:false },
    { key:'roughnessMap', prop:'roughnessMap', colorData:false },
    { key:'metalnessMap', prop:'metalnessMap', colorData:false },
    { key:'aoMap', prop:'aoMap', colorData:false },
    { key:'alphaMap', prop:'alphaMap', colorData:false },
    { key:'emissiveMap', prop:'emissiveMap', colorData:true }
  ];
  extraMaps.forEach(function(slot){
    var tex = mat[slot.key];
    if(!tex || !tex.image) return;
    var v = varName + '_' + slot.key;
    var code = textureVarCode(v, tex, slot.colorData);
    if(code){ texDecls.push(code); props.push('  '+slot.prop+': '+v+',' ); embeddedCount++; }
    else { notes.push('  // '+slot.key+' original non incluse (trop volumineuse)'); skippedCount++; }
  });
  if(mat.normalScale) props.push('  normalScale: new THREE.Vector2('+fmtNum(mat.normalScale.x)+', '+fmtNum(mat.normalScale.y)+'),');
  if(mat.aoMapIntensity !== undefined && mat.aoMapIntensity !== 1 && mat.aoMap) props.push('  aoMapIntensity: '+fmtNum(mat.aoMapIntensity)+',');

  if(type === 'THREE.MeshPhysicalMaterial'){
    if(mat.clearcoat) props.push('  clearcoat: '+fmtNum(mat.clearcoat)+',');
    if(mat.clearcoatRoughness) props.push('  clearcoatRoughness: '+fmtNum(mat.clearcoatRoughness)+',');
    if(mat.ior !== undefined && mat.ior !== 1.5) props.push('  ior: '+fmtNum(mat.ior)+',');
    if(mat.thickness) props.push('  thickness: '+fmtNum(mat.thickness)+',');
    if(mat.sheen) props.push('  sheen: '+fmtNum(mat.sheen)+',');
  }

  var isTransparentIntent = mat.transparent || (mat.opacity !== undefined && mat.opacity < 1) ||
    (mat.transmission !== undefined && mat.transmission > 0);
  if(isTransparentIntent){
    var op = (mat.opacity !== undefined) ? mat.opacity : 1;
    if(op < 0.08){ notes.push('  // opacite originale quasi nulle — relevee pour rester visible'); op = 0.18; }
    if(mat.transmission !== undefined && mat.transmission > 0){
      op = Math.max(op, 1 - mat.transmission * 0.85);
      if(type === 'THREE.MeshPhysicalMaterial') props.push('  transmission: '+fmtNum(mat.transmission)+',');
    }
    props.push('  opacity: '+fmtNum(op)+',');
    props.push('  transparent: true,');
    props.push('  depthWrite: false,');
  }

  if(mat.emissive && mat.emissive.getHex() !== 0) props.push('  emissive: 0x'+mat.emissive.getHexString()+',');
  if(mat.emissiveIntensity !== undefined && mat.emissiveIntensity !== 1) props.push('  emissiveIntensity: '+fmtNum(mat.emissiveIntensity)+',');
  if(mat.side === THREE.DoubleSide) props.push('  side: THREE.DoubleSide,');
  if(mat.vertexColors) props.push('  vertexColors: THREE.VertexColors,');
  if(mat.wireframe) props.push('  wireframe: true,');

  lines = lines.concat(texDecls);
  lines.push('var '+varName+' = new '+type+'({');
  lines.push(props.join('\n'));
  lines.push('});');
  if(notes.length) lines.push(notes.join('\n'));
  return { code: lines.join('\n'), embedded: embeddedCount, skipped: skippedCount };
}

var geomVarCounter, matVarCounter, meshVarCounter, groupVarCounter;
function generateThreeJSCode(root, filename){
  geomVarCounter=0; matVarCounter=0; meshVarCounter=0; groupVarCounter=0;
  var defBlocks=[], buildLines=[];
  var hasHighMetalness=false, texturesEmbedded=0, texturesSkipped=0;

  function walk(obj, parentVar){
    var varName;
    if(obj.isMesh){
      var geomVar='geom_'+(geomVarCounter++)+'_'+sanitizeVarName(obj.geometry.name||obj.name||'');
      var matVar='mat_'+(matVarCounter++)+'_'+sanitizeVarName(obj.material.name||'');
      var meshVar='mesh_'+(meshVarCounter++)+'_'+sanitizeVarName(obj.name||'mesh');
      defBlocks.push(geometryToCode(obj.geometry, geomVar));
      var matResult = materialToCode(obj.material, matVar, computeUvBounds(obj.geometry));
      defBlocks.push(matResult.code);
      texturesEmbedded += matResult.embedded; texturesSkipped += matResult.skipped;
      if(obj.material.metalness !== undefined && obj.material.metalness >= 0.85) hasHighMetalness = true;
      buildLines.push('var '+meshVar+' = new THREE.Mesh('+geomVar+', '+matVar+');');
      buildLines.push(meshVar+'.name = '+JSON.stringify(obj.name||'')+';');
      var p=obj.position, r=obj.rotation, s=obj.scale;
      if(p.x||p.y||p.z) buildLines.push(meshVar+'.position.set('+fmtNum(p.x)+', '+fmtNum(p.y)+', '+fmtNum(p.z)+');');
      if(r.x||r.y||r.z) buildLines.push(meshVar+'.rotation.set('+fmtNum(r.x)+', '+fmtNum(r.y)+', '+fmtNum(r.z)+');');
      if(s.x!==1||s.y!==1||s.z!==1) buildLines.push(meshVar+'.scale.set('+fmtNum(s.x)+', '+fmtNum(s.y)+', '+fmtNum(s.z)+');');
      buildLines.push(parentVar+'.add('+meshVar+');');
      varName = meshVar;
    } else {
      var groupVar='group_'+(groupVarCounter++)+'_'+sanitizeVarName(obj.name||'group');
      buildLines.push('var '+groupVar+' = new THREE.Group();');
      buildLines.push(groupVar+'.name = '+JSON.stringify(obj.name||'')+';');
      var p2=obj.position, r2=obj.rotation, s2=obj.scale;
      if(p2.x||p2.y||p2.z) buildLines.push(groupVar+'.position.set('+fmtNum(p2.x)+', '+fmtNum(p2.y)+', '+fmtNum(p2.z)+');');
      if(r2.x||r2.y||r2.z) buildLines.push(groupVar+'.rotation.set('+fmtNum(r2.x)+', '+fmtNum(r2.y)+', '+fmtNum(r2.z)+');');
      if(s2.x!==1||s2.y!==1||s2.z!==1) buildLines.push(groupVar+'.scale.set('+fmtNum(s2.x)+', '+fmtNum(s2.y)+', '+fmtNum(s2.z)+');');
      buildLines.push(parentVar+'.add('+groupVar+');');
      varName = groupVar;
    }
    obj.children.forEach(function(c){ walk(c, varName); });
    return varName;
  }
  walk(root, 'root');

  var header = [
    '// ===================================================================',
    '// Code Three.js genere par Three.js Studio depuis : ' + filename,
    '// ===================================================================',
    '',
    'function b64ToBytes(b64){ var bin=atob(b64); var bytes=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return bytes; }',
    'function b64ToFloat32(b64){ var b=b64ToBytes(b64); return new Float32Array(b.buffer); }',
    'function b64ToUint8(b64){ return b64ToBytes(b64); }',
    'function b64ToInt8(b64){ var b=b64ToBytes(b64); return new Int8Array(b.buffer); }',
    'function b64ToUint16(b64){ var b=b64ToBytes(b64); return new Uint16Array(b.buffer); }',
    'function b64ToInt16(b64){ var b=b64ToBytes(b64); return new Int16Array(b.buffer); }',
    'function b64ToUint32(b64){ var b=b64ToBytes(b64); return new Uint32Array(b.buffer); }',
    'function b64ToInt32(b64){ var b=b64ToBytes(b64); return new Int32Array(b.buffer); }',
    (texturesEmbedded>0 ? '_texLoader_placeholder' : ''),
    '',
    'function createModel() {',
    '  var root = new THREE.Group();',
    ''
  ].filter(function(l){ return l !== '_texLoader_placeholder' || texturesEmbedded>0; });
  if(texturesEmbedded>0){
    var idx = header.indexOf('_texLoader_placeholder');
    header[idx] = 'var _texLoader = new THREE.TextureLoader();';
  }

  var footer = ['', '  return root;', '}', '', '// Utilisation :', '// var model = createModel();', '// scene.add(model);'];

  var textureNote = texturesSkipped>0 ? [
    '', '// NOTE : ' + texturesSkipped + ' texture(s) trop volumineuses ont ete remplacees',
    '// par une couleur moyenne. ' + texturesEmbedded + ' texture(s) embarquee(s) directement.'
  ] : (texturesEmbedded>0 ? ['', '// ' + texturesEmbedded + ' texture(s) embarquee(s) directement dans ce fichier (base64).'] : []);

  var metalnessNote = hasHighMetalness ? [
    '', '// NOTE : materiaux tres/totalement metalliques presents — sans carte',
    '// d\'environnement (scene.environment), ils apparaitront gris/blanc.'
  ] : [];

  var indent = function(block){ return block.split('\n').map(function(l){return '  '+l;}).join('\n'); };
  var finalCode = header.join('\n') + '\n' + indent(defBlocks.join('\n\n')) + '\n\n' + indent(buildLines.join('\n')) + '\n' +
    footer.join('\n') + textureNote.join('\n') + metalnessNote.join('\n');

  var byteLen = new Blob([finalCode]).size;
  document.getElementById('codeStats').textContent =
    meshVarCounter+' mesh(s), '+geomVarCounter+' geometrie(s), '+matVarCounter+' materiau(x)' +
    (texturesEmbedded?', '+texturesEmbedded+' texture(s) embarquee(s)':'') +
    (texturesSkipped?', '+texturesSkipped+' non embarquee(s)':'') +
    ' — ' + fmtBytesUI(byteLen);

  return finalCode;
}

function getExportCode(){
  if(!currentModel || meshList.length === 0){ showToast('Aucun modele charge'); return null; }
  return generateThreeJSCode(currentModel, currentFilename);
}

var codePaneOpen = false;
function refreshCodePane(){
  if(!codePaneOpen) return;
  var code = getExportCode();
  document.getElementById('codeOutput').textContent = code || '// Aucun modele charge';
}
document.getElementById('toggleCodeBtn').addEventListener('click', function(){
  codePaneOpen = !codePaneOpen;
  document.getElementById('codepane').classList.toggle('show', codePaneOpen);
  document.getElementById('toggleCodeBtn').textContent = codePaneOpen ? 'Masquer le code' : 'Voir le code';
  if(codePaneOpen) refreshCodePane();
});

document.getElementById('copyBtn').addEventListener('click', function(){
  var code = getExportCode();
  if(!code) return;
  navigator.clipboard.writeText(code).then(function(){ showToast('Code copie'); });
  if(codePaneOpen) document.getElementById('codeOutput').textContent = code;
});
document.getElementById('downloadBtn').addEventListener('click', function(){
  var code = getExportCode();
  if(!code) return;
  var base = currentFilename.replace(/\.[^.]+$/, '') || 'scene';
  var blob = new Blob([code], { type: 'text/javascript' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = base + '_studio.js';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Fichier telecharge');
});
</script>
