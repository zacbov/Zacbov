"62":{t:"La maison du vieux Sylla se dresse, seule, au bord de la falaise — une bâtisse de planches grises battues par le vent du large, sans autre lumière qu'une lueur vacillante à l'une des fenêtres du rez-de-chaussée. En vous approchant, vous croyez entendre, à travers les murs, un curieux cliquetis rythmé, comme des pendules de bois s'entrechoquant, ponctué de murmures qui ne semblent pas tous appartenir à la même voix — ni, songez-vous avec un frisson, à la même langue. Voulez-vous frapper à sa porte (Rendez-vous au 64), observer par la fenêtre entrouverte (Rendez-vous au 66), ou vous glisser plutôt dans la remise à outils attenante, à l'écart de la maison elle-même (Rendez-vous au 165) ?", g:[64,66,165]},

"165":{t:"Vous vous glissez dans la remise attenante à la maison, sombre et sentant l'huile de lin et le goudron marin. Parmi des filets en désordre et des casiers vides, vous trouvez, accroché à un clou rouillé, un vieux sextant de laiton corrodé par le sel — sans doute la seule relique honnête d'une vie de marin par ailleurs bien mystérieuse. Vous quittez les lieux sans que le vieux Sylla ne remarque votre passage. Rendez-vous au 8.", g:[8], addItem:"Sextant de Laiton"},

"64":{t:"Vous frappez. Un long silence suit, puis la porte s'entrebâille sur un vieillard décharné, à la barbe blanche et aux yeux d'un bleu presque électrique malgré son grand âge. Il vous dévisage longuement sans un mot, puis un sourire édenté fend son visage tanné par le sel. « Un jeune curieux, comme les autres avant vous », dit-il d'une voix de fausset. « Ceux qui viennent chercher mon or repartent rarement. Ceux qui viennent chercher autre chose... » Il désigne du menton l'obscurité derrière lui, où le cliquetis reprend, plus insistant. « ...devraient réfléchir à deux fois avant d'apprendre ce que les jarres ont à raconter. Portneuve garde plus d'un secret sous ses eaux, jeune homme. Le mien n'est pas le pire. » Sur ces mots sibyllins, il referme doucement la porte. Vous redescendez vers le village, la mise en garde du Vieux Marin gravée dans votre mémoire. Rendez-vous au 8.", g:[8], addItem:"CODEX:old-man-terrible"},

"66":{t:"Par l'interstice des volets mal joints, vous apercevez l'intérieur : une pièce nue, hormis une longue étagère où sont alignées une douzaine de jarres de verre épais. À l'intérieur de chacune, une forme sombre et allongée se balance doucement, comme mue par un vent que vous ne sentez pas, et un murmure indistinct, presque une psalmodie, s'en échappe. TESTEZ VOTRE LUCIDITÉ face à ce spectacle. Si vous êtes Chanceux, Rendez-vous au 68. Si vous êtes Malchanceux, Rendez-vous au 69.", g:[68,69], luckTest:true},

"68":{t:"Vous détournez le regard avant que votre esprit n'insiste trop longuement sur ce que vous venez de voir, et redescendez vers le village d'un pas rapide, le souvenir des jarres du Vieux Marin gravé dans votre mémoire. Rendez-vous au 8.", g:[8], addItem:"CODEX:old-man-terrible"},

"69":{t:"L'une des formes, dans sa jarre, semble se tourner vers la fenêtre — vers vous — bien qu'elle ne possède, autant que vous en puissiez juger, ni yeux ni visage. Vous perdez 2 points de LUCIDITÉ et dévalez la falaise sans vous retourner, le souvenir des jarres du Vieux Marin gravé dans votre mémoire malgré vous. Rendez-vous au 8.", g:[8], luckLoss:2, addItem:"CODEX:old-man-terrible"},

"10":{t:"Vous vous habillez à la hâte et rejoignez la foule de villageois massés sur la plage autour d'un corps allongé sur le sable mouillé. C'est bien Ezra Marsh — le visage boursouflé, la peau étrangement distendue par endroits, comme si elle avait commencé à changer de nature. Les villageois présents détournent le regard sans grande surprise, presque résignés. Personne ne semble vouloir prévenir les autorités du comté. Vous décidez de vous rendre à sa maison pour comprendre ce qui a pu se passer. Rendez-vous au 5.", g:[5]},

"6":{t:"À la mention du nom de Marsh, l'aubergiste pâlit visiblement. « Il fouinait du côté du Récif du Diable, ce vieux fou. Posait des questions sur... des choses qu'on ne nomme pas ici. » Il se penche vers vous, sa voix tombant en un murmure : « Si vous tenez à la vie, ne descendez pas sur la plage après le coucher du soleil. Les Profonds remontent avec la marée montante. » Il refuse d'en dire plus et retourne à ses verres. Vous gagnez cette information précieuse. Voulez-vous monter dans votre chambre pour la nuit (Rendez-vous au 8), ou sortir immédiatement vers la maison de Marsh malgré l'heure tardive (Rendez-vous au 5) ?", g:[8,5]},

"8":{t:"Votre chambre est exiguë et sent le sel et le moisi. Par la fenêtre, vous apercevez la baie où des formes sombres semblent parfois briser la surface de l'eau — des poissons, sans doute. Vous vous endormez d'un sommeil agité, peuplé de rêves où des voix chantent sous l'océan des noms que votre esprit refuse de retenir. Au matin, vous êtes réveillé par des coups frénétiques à votre porte. C'est l'aubergiste, livide : « Le corps d'Ezra Marsh vient d'être retrouvé sur la plage ! » Rendez-vous au 10.", g:[10]},

"5":{t:"La maison d'Ezra Marsh est une bâtisse délabrée aux volets clos, à quelques mètres seulement de la ligne de marée haute. La porte d'entrée est entrebâillée. À l'intérieur règne un désordre total : papiers éparpillés, meubles renversés. Sur le bureau, vous trouvez un carnet de notes couvert de croquis d'inspiration marine et d'une écriture fébrile. Voulez-vous lire le carnet (Rendez-vous au 11), ou fouiller le reste de la maison en premier (Rendez-vous au 13) ?", g:[11,13]},

"11":{t:"Le carnet d'Ezra Marsh décrit, en une écriture de plus en plus tremblée, des créatures humanoïdes amphibies aperçues la nuit près du Récif du Diable — des êtres à la peau squameuse et aux yeux globuleux, remontant du fond de l'océan pour se mêler, dit-il, \"aux familles les plus anciennes du village\". La dernière page, à peine lisible, porte ces mots : \"Ils savent que je sais. Le Signe des Anciens, gravé sur la pierre du récif, est ma seule protection. Si je disparais, cherchez-le.\" Vous rangez le carnet dans votre sacoche. AJOUTEZ le Carnet d'Ezra à votre inventaire. Voulez-vous à présent fouiller le reste de la maison (Rendez-vous au 13), ou sortir immédiatement pour vous rendre au Récif du Diable, malgré l'heure (Rendez-vous au 14) ?", g:[13,14], addItem:"Carnet d'Ezra Marsh"},

"13":{t:"Dans la cuisine, vous découvrez un petit sac de toile contenant plusieurs fioles de Sels Essentiels — des cristaux blanchâtres utilisés en pharmacie pour ranimer les blessés — ainsi que quelques provisions séchées dans le garde-manger. Dans un tiroir fermé à clé que vous forcez, vous trouvez également une petite Clé de Fer rouillée. La nuit tombe rapidement. Voulez-vous vous rendre au Récif du Diable malgré l'obscurité grandissante (Rendez-vous au 14), ou préférez-vous rentrer à l'auberge pour attendre le matin (Rendez-vous au 9) ?", g:[14,9], addItem:"POTION:Sels Essentiels;RATION:2;Clé de Fer"},

"9":{t:"Vous regagnez votre chambre à l'auberge et vous endormez d'un sommeil agité, peuplé de rêves où des voix chantent sous l'océan des noms que votre esprit refuse de retenir. Au matin, des coups frénétiques à votre porte vous réveillent en sursaut. C'est l'aubergiste, livide : « Le corps d'Ezra Marsh vient d'être retrouvé sur la plage ! » La nouvelle ne vous surprend qu'à moitié : vous avez déjà fouillé sa maison de fond en comble et savez, par ce que vous y avez trouvé, où chercher la suite. Plutôt que de perdre du temps auprès de la foule massée sur le sable, vous décidez de descendre directement vers le Récif du Diable. Rendez-vous au 14.", g:[14]},

"14":{t:"Vous descendez vers la plage sous un ciel qui s'assombrit rapidement. Le sable est froid sous vos pieds, et le bruit des vagues résonne étrangement, comme ponctué de clapotis qui ne semblent pas naturels. Au loin, sur le Récif du Diable, une pierre dressée se découpe contre le ciel violet du crépuscule. Alors que vous approchez, deux silhouettes voûtées émergent de l'eau à une trentaine de mètres. Voulez-vous vous cacher derrière les rochers pour les observer (Rendez-vous au 16), continuer votre chemin en espérant ne pas être vu (Rendez-vous au 18), ou emprunter plutôt le sentier détourné qui longe le vieux cimetière du village, à l'écart de la plage (Rendez-vous au 45) ?", g:[16,18,45]},

"45":{t:"Le sentier du cimetière semble plus sûr, à l'écart de l'eau — jusqu'à ce qu'un murmure psalmodié en cadence vous fasse ralentir le pas. Dissimulés derrière les pierres tombales, trois silhouettes en robe sombre, le visage caché sous des capuches, tracent à la craie des symboles interdits sur le sol : des CULTISTES D'ARKHAM, reconnaissables à leurs couteaux rituels à la lame noircie. Voulez-vous les attaquer par surprise pendant qu'ils sont absorbés par leur rituel (Rendez-vous au 47), ou rebrousser chemin vers la plage pour éviter toute confrontation (Rendez-vous au 18) ?", g:[47,18]},

"47":{t:"Vous bondissez de votre cachette avant qu'ils n'aient pu réagir.\n\nSi vous êtes vainqueur, Rendez-vous au 26.", c:[["Cultiste (1)",6,6],["Cultiste (2)",6,5],["Cultiste (3)",5,6]], g:[26], firstStrike:true},

"16":{t:"Accroupi derrière un rocher couvert d'algues, vous observez les deux silhouettes qui pataugent vers la rive. À la faible lueur du crépuscule, vous distinguez avec horreur leur peau squameuse et grisâtre, leurs grands yeux globuleux sans paupières, leurs mains palmées. Ce sont des PROFONDS — exactement ce que décrivait le carnet d'Ezra Marsh. Ils portent entre eux ce qui ressemble à un filet contenant... une forme humaine, immobile. Voulez-vous les attaquer par surprise pour tenter de libérer le prisonnier (Rendez-vous au 20), ou attendre qu'ils s'éloignent avant de continuer vers le récif (Rendez-vous au 22) ?", g:[20,22]},

"20":{t:"Vous bondissez de votre cachette, épée à la main — votre attaque surprise vous donne l'avantage sur le premier assaut.\n\nSi vous êtes vainqueur, Rendez-vous au 24.", c:[["Premier Profond",6,5],["Deuxième Profond",6,6]], g:[24], firstStrike:true, noLoot:true},

"18":{t:"Vous pressez le pas, espérant passer inaperçu, mais le sable crisse sous vos bottes. Les deux créatures se retournent d'un même mouvement, leurs yeux globuleux reflétant la dernière lueur du jour. Un grondement guttural sort de leurs gorges distendues, et elles s'avancent vers vous, menaçantes.\n\nSi vous êtes vainqueur, Rendez-vous au 24.", c:[["Premier Profond",6,6],["Deuxième Profond",6,7]], g:[24], noLoot:true},

"22":{t:"Vous restez immobile, retenant votre souffle, tandis que les Profonds regagnent lentement l'océan avec leur fardeau. Leur silhouette disparaît sous les vagues noires. Vous n'aurez plus l'occasion de savoir qui — ou ce qui — se trouvait dans ce filet. Le cœur lourd, vous continuez votre chemin vers la pierre dressée du récif. Rendez-vous au 26.", g:[26]},

"24":{t:"Les deux créatures s'effondrent sur le sable humide, leur sang noirâtre se mêlant à l'écume. Dans le filet, vous découvrez un jeune pêcheur, inconscient mais vivant, un bandeau de tissu maculé de sang autour de la tête. Il reprend connaissance en toussant et vous regarde avec une terreur animale avant de s'enfuir en boitant vers le village sans un mot de remerciement. Sur le corps de l'un des Profonds, vous trouvez un étrange Collier d'Écailles serti d'une perle noire. AJOUTEZ le Collier d'Écailles à votre inventaire. Vous reprenez votre chemin vers la pierre dressée du récif. Rendez-vous au 26.", g:[26], addItem:"Collier d'Écailles"},

"26":{t:"La pierre dressée du Récif du Diable est couverte de lichen, mais en grattant la surface avec votre couteau, vous découvrez un symbole gravé profondément dans la roche : une étoile à cinq branches surmontée d'un œil flamboyant. C'est le SIGNE DES ANCIENS dont parlait le carnet d'Ezra Marsh. Voulez-vous copier soigneusement le symbole sur un morceau de papier pour l'étudier plus tard (Rendez-vous au 28), ou presser votre paume directement sur la pierre gravée (Rendez-vous au 30) ?", g:[28,30]},

"28":{t:"Vous recopiez avec soin le symbole à la lueur de votre lampe de poche. AJOUTEZ le Croquis du Signe des Anciens à votre inventaire (utile plus tard : ce croquis pourra être gravé sur un objet pour vous protéger). Un bruit de pas mouillés vous fait sursauter — quelque chose approche depuis l'eau. Voulez-vous vous cacher (Rendez-vous au 32), ou faire face bravement (Rendez-vous au 34) ?", g:[32,34], addItem:"Croquis du Signe des Anciens"},

"30":{t:"Au contact de la pierre froide, un frisson glacial remonte le long de votre bras jusqu'à votre esprit. Des images fragmentaires envahissent votre conscience : des cités englouties, des processions dans l'obscurité sous-marine, un nom que votre bouche ne parvient pas à former. TESTEZ VOTRE LUCIDITÉ. Si vous êtes Chanceux, Rendez-vous au 33. Si vous êtes Malchanceux, Rendez-vous au 35.", g:[33,35], luckTest:true},

"33":{t:"Vous parvenez à détacher votre main de la pierre avant que la vision ne vous submerge complètement. Le contact vous a néanmoins laissé une certitude glaçante : le village de Portneuve entretient un pacte très ancien avec les créatures des profondeurs. Un bruit de pas mouillés vous fait sursauter. Voulez-vous vous cacher (Rendez-vous au 32), ou faire face (Rendez-vous au 34) ?", g:[32,34]},

"35":{t:"La vision vous submerge entièrement. Vous voyez, ou croyez voir, votre propre reflet se distordre en une forme squameuse et palmée. Vous perdez 2 points de LUCIDITÉ. Lorsque vous reprenez vos esprits, un bruit de pas mouillés retentit tout près. Voulez-vous vous cacher (Rendez-vous au 32), ou faire face, encore hébété (Rendez-vous au 34) ?", g:[32,34], luckLoss:2},

"32":{t:"Vous vous glissez derrière la pierre dressée juste à temps. Un vieillard au dos voûté et à la démarche étrangement sautillante s'approche du récif, portant une lanterne. C'est le sacristain du village, que vous aviez aperçu à l'auberge. Il murmure des paroles rituelles dans une langue inconnue face à la pierre gravée, dépose un panier d'offrandes de poisson à son pied, puis rebrousse chemin vers le village. Vous attendez qu'il soit hors de vue avant de sortir de votre cachette. Rendez-vous au 36.", g:[36]},

"36":{t:"Le sacristain disparu dans la nuit sur le chemin du village, vous sortez de votre cachette. À la base du récif, la marée descendante découvre l'entrée d'une petite grotte marine à demi immergée. Rendez-vous au 42.", g:[42]},

"34":{t:"Vous vous retournez, votre lampe braquée devant vous, et découvrez le sacristain du village — un vieillard au dos voûté et à la démarche étrangement sautillante — qui s'arrête net en vous voyant. Ses yeux globuleux vous fixent avec une hostilité non dissimulée. « Vous n'avez rien à faire ici, étranger », siffle-t-il d'une voix rauque. Voulez-vous l'interroger sur le sort d'Ezra Marsh (Rendez-vous au 38), ou tirer votre épée pour l'intimider (Rendez-vous au 40) ?", g:[38,40]},

"38":{t:"Le sacristain vous jauge longuement, puis, à votre grande surprise, un sourire fendu déforme son visage. « Marsh a payé le prix de sa curiosité, comme tous ceux qui fouillent où il ne faut pas. Le Grand Prêtre l'a jugé lui-même, dans le Temple sous les flots. » Il désigne du doigt une petite grotte à l'entrée du récif, à demi immergée à marée basse. « Si vous tenez tant à connaître la vérité, la grotte y mène. Mais peu de ceux qui y entrent en ressortent avec leur raison intacte. » Sur ces mots, il s'éloigne en boitant vers le village. Rendez-vous au 42.", g:[42]},

"40":{t:"Le sacristain recule d'un pas, puis pousse un cri aigu et perçant qui résonne étrangement, presque comme un chant. Immédiatement, deux formes jaillissent de l'eau derrière lui.\n\nSi vous êtes vainqueur, Rendez-vous au 44.", c:[["Le Sacristain",7,6],["Profond Gardien",7,7]], g:[44], noLoot:true},

"44":{t:"Le sacristain gît sur le sable, son masque de vieillard humain à demi arraché révélant une peau grisâtre et squameuse en dessous — il n'était humain qu'en apparence. Vous fouillez son corps et trouvez une petite Clé d'Argent finement ouvragée, froide au toucher malgré la chaleur de la nuit. AJOUTEZ la Clé d'Argent à votre inventaire. Une petite grotte, à demi immergée à marée basse, s'ouvre à l'entrée du récif. Rendez-vous au 42.", g:[42], addItem:"Clé d'Argent"},

"42":{t:"La marée descend rapidement, découvrant l'entrée sombre d'une grotte marine. De l'intérieur monte un chant grave et rythmé, comme des centaines de voix psalmodiant à l'unisson sous l'eau. Voulez-vous pénétrer dans la grotte pour découvrir le sort d'Ezra Marsh et la vérité sur Portneuve (Rendez-vous au 46), ou estimez-vous en avoir appris assez et retournez-vous au village pour prévenir les autorités (Rendez-vous au 48) ?", g:[46,48]},

"48":{t:"Vous rebroussez chemin vers le village, bien décidé à alerter le shérif du comté au matin. Mais alors que vous remontez la plage, vous réalisez avec un frisson que les rues de Portneuve sont désertes, et que toutes les fenêtres, sans exception, sont éteintes — comme si le village entier retenait son souffle. Une lumière verdâtre et malsaine palpite un instant à l'horizon, du côté des collines, bien au-delà du village. Ce n'est pas le signe des Profonds, mais celui de quelque chose de plus ancien encore. Rendez-vous au 100.", g:[100]},

"46":{t:"Vous vous glissez dans la grotte, l'eau salée vous arrivant aux genoux. Le tunnel de roche noire s'enfonce profondément sous le récif, et le chant se fait de plus en plus distinct — une psalmodie en une langue gutturale, ponctuée d'un nom que votre esprit se refuse presque à entendre : « Cthulhu fhtagn... » TESTEZ VOTRE LUCIDITÉ avant de continuer. Si vous êtes Chanceux, Rendez-vous au 50. Si vous êtes Malchanceux, Rendez-vous au 52.", g:[50,52], luckTest:true},

"50":{t:"Vous serrez les mâchoires et parvenez à garder votre sang-froid malgré l'horreur croissante du chant. Vous avancez encore et découvrez une vaste caverne éclairée d'une lumière phosphorescente verdâtre, où des dizaines de silhouettes squameuses dansent autour d'un autel de pierre noire. Ligoté sur cet autel, immobile, se trouve le corps d'Ezra Marsh — mort depuis plusieurs jours déjà, le visage figé dans une expression de terreur pure. Sur son corps, glissée dans sa poche, vous trouvez une lettre inachevée qui mentionne un fermier nommé Nahum Gardner et \"une lueur tombée du ciel, sur sa terre à l'ouest d'Arkham\". Vous quittez la grotte, glacé jusqu'aux os. Rendez-vous au 100.", g:[100]},

"52":{t:"L'horreur du chant s'insinue dans votre esprit comme une lame froide. Vous perdez 3 points de LUCIDITÉ. Des images de cités cyclopéennes englouties, de dieux endormis attendant leur réveil, envahissent votre conscience malgré vous. Dans un sursaut de volonté, vous rebroussez chemin en courant, trébuchant dans l'eau froide, et émergez de la grotte haletant, le cœur battant à tout rompre. Vous fuyez Portneuve dès le lever du jour, l'esprit ébranlé. Dans le train du retour, un journal local traîné sur la banquette relate une étrange affaire à l'ouest d'Arkham : un fermier du nom de Nahum Gardner, terres frappées par un objet tombé du ciel. Rendez-vous au 100.", g:[100], luckLoss:3},

"100":{t:"Quelques jours plus tard, à la bibliothèque de l'Université Miskatonic, vous consultez les archives locales et confirmez la rumeur : à l'ouest d'Arkham, sur la ferme de Nahum Gardner, un objet serait tombé du ciel une nuit de juin, et la région serait devenue le théâtre de phénomènes que même les fermiers les plus taciturnes refusent de décrire en détail. Vous décidez de vous y rendre. Une route poussiéreuse vous mène à travers une campagne de plus en plus déserte, jusqu'à un carrefour où un vieil homme assis sur une souche vous héle. Voulez-vous vous arrêter pour lui parler (Rendez-vous au 102), ou continuer directement vers la ferme Gardner (Rendez-vous au 104) ?", g:[102,104]},

"102":{t:"Le vieil homme, un certain Ammi Pierce, voisin le plus proche des Gardner, vous observe avec méfiance avant de se détendre légèrement. « Vous allez là-bas ? Ne buvez pas l'eau du puits, et ne restez pas après la tombée du jour. » Il vous raconte, d'une voix hachée, comment la nuit de la chute du météore, toute la campagne avait tremblé, comment la roche tombée s'était mise à rétrécir jusqu'à disparaître, et comment, depuis, tout ce qui pousse sur les terres de Gardner a pris une couleur qu'aucun mot ne saurait décrire — \"pas une vraie couleur du tout\", insiste-t-il. Avant de vous laisser partir, il vous glisse dans les mains un peu de pain et de viande séchée : « Ne mangez surtout rien qui vienne de là-bas. » Rendez-vous au 104.", g:[104], addItem:"RATION:2"},

"104":{t:"La ferme Gardner apparaît au détour du chemin, et un malaise sourd vous saisit avant même d'en franchir la clôture. Les arbres qui l'entourent ont des formes tordues, anormales, et leur feuillage, d'un gris cendreux, ne bruisse pas dans le vent comme il le devrait — il reste étrangement immobile, comme figé. Le puits, au centre de la cour, exhale une odeur âcre. Voulez-vous examiner le puits de plus près (Rendez-vous au 106), ou vous diriger directement vers la maison silencieuse (Rendez-vous au 108) ?", g:[106,108]},

"106":{t:"Vous vous penchez au-dessus de la margelle du puits. L'eau, tout au fond, luit d'une teinte indéfinissable — ni verte, ni grise, ni d'aucune couleur que l'œil humain ait jamais dû contempler. Voulez-vous en puiser un peu pour l'examiner (Rendez-vous au 110), ou reculer, mal à l'aise, et vous diriger vers la maison (Rendez-vous au 108) ?", g:[110,108]},

"110":{t:"À peine le seau touche-t-il la surface de l'eau que celle-ci semble se rétracter, comme vivante, et une vapeur âcre s'en échappe. TESTEZ VOTRE LUCIDITÉ. Si vous êtes Chanceux, Rendez-vous au 112. Si vous êtes Malchanceux, Rendez-vous au 114.", g:[112,114], luckTest:true},

"112":{t:"Vous reculez juste à temps, laissant tomber le seau, qui se désagrège littéralement en touchant le sol — le bois est devenu cassant comme de la cendre. Profondément troublé mais sain d'esprit, vous vous dirigez vers la maison. Rendez-vous au 108.", g:[108]},

"114":{t:"La vapeur âcre vous enveloppe le visage avant que vous ayez pu reculer. Vous perdez 2 points de LUCIDITÉ : pendant un instant qui vous semble une éternité, vous \"voyez\" des couleurs qui n'existent dans aucun spectre connu, et votre esprit refuse cette perception avec une violence physique. Le seau tombe et se désagrège en cendres à vos pieds. Chancelant, vous vous dirigez vers la maison. Rendez-vous au 108.", g:[108], luckLoss:2},

"108":{t:"La porte de la ferme est entrouverte. À l'intérieur règne un silence de tombeau. Dans la cuisine, vous trouvez Nahum Gardner assis dans un fauteuil, immobile, le regard vide fixé sur la fenêtre. Sa peau a une teinte grisâtre malsaine, et lorsqu'il tourne enfin la tête vers vous, sa voix sort comme un murmure grinçant : « Elle est dans le puits... elle grandit... elle prend tout... » Voulez-vous l'interroger davantage (Rendez-vous au 116), chercher le reste de la famille dans la maison (Rendez-vous au 118), ou fouiller discrètement la cuisine et les placards pendant qu'il marmonne (Rendez-vous au 172) ?", g:[116,118,172]},

"172":{t:"Pendant que Nahum continue de marmonner sans vous voir vraiment, vous fouillez rapidement les placards de la cuisine. La plupart des provisions ont pris cette teinte grise et cassante qui semble avoir frappé toute la ferme, mais tout au fond d'un bocal resté hermétiquement fermé, vous trouvez encore quelques provisions séchées intactes. Vous les glissez dans votre sac avant de poursuivre votre exploration de la maison. Rendez-vous au 118.", g:[118], addItem:"RATION:1"},

"116":{t:"Nahum Gardner, d'une voix de plus en plus hachée, vous raconte comment le météore tombé dans son verger avait d'abord semblé n'être qu'une roche étrange, tiède au toucher et parcourue de crevasses colorées. Les scientifiques venus de Miskatonic l'avaient prélevée pour analyse, mais elle avait fondu et disparu avant qu'ils ne puissent l'étudier, ne laissant derrière elle qu'un puits contaminé et des récoltes qui poussaient, gigantesques et luisantes, avant de se réduire en une poussière grise et cassante. « Ma femme... mes fils... » Sa voix se brise. « Le grenier. Ils sont montés au grenier et je... je n'ai plus pu monter les voir. » Vous gagnez cette information terrible. Voulez-vous monter au grenier (Rendez-vous au 120), ou sortir examiner le verger avant la tombée de la nuit (Rendez-vous au 122) ?", g:[120,122]},

"118":{t:"Nahum ne répond plus à vos questions, murmurant seulement des fragments de phrases sans suite. Vous décidez d'explorer vous-même la maison. À l'étage, une porte de grenier fermée par un simple loquet attire votre attention. Voulez-vous monter au grenier (Rendez-vous au 120), ou ressortir examiner le verger avant la nuit (Rendez-vous au 122) ?", g:[120,122]},

"120":{t:"Vous montez l'escalier étroit qui mène au grenier, le loquet cédant sous vos doigts avec un grincement sinistre. L'odeur qui vous assaille est indescriptible — un mélange de moisi et de quelque chose de chimique, d'électrique presque. Dans la pénombre, vous distinguez deux formes recroquevillées dans un coin, immobiles, leur peau prenant la même teinte grisâtre malsaine que celle de Nahum. TESTEZ VOTRE LUCIDITÉ avant de vous approcher. Si vous êtes Chanceux, Rendez-vous au 124. Si vous êtes Malchanceux, Rendez-vous au 126.", g:[124,126], luckTest:true},

"124":{t:"Vous vous forcez à garder votre calme et à observer scientifiquement la scène, comme vous l'a enseigné l'Université. Les deux corps — la femme et l'un des fils de Nahum Gardner — semblent s'être désagrégés lentement de l'intérieur, comme du bois pourri, sans aucune trace de violence extérieure. Une poussière grise et cristalline recouvre le plancher tout autour d'eux. Vous redescendez, glacé mais lucide, pour sortir examiner le verger. Rendez-vous au 122.", g:[122]},

"126":{t:"La vision est trop pour votre esprit. Vous perdez 3 points de LUCIDITÉ en réalisant que les deux corps ne sont plus tout à fait des corps — ils semblent se désagréger sous votre regard même, comme si le simple fait d'être observés accélérait leur décomposition en une poussière cristalline grisâtre. Vous redescendez en trébuchant, l'estomac retourné, et sortez prendre l'air. Rendez-vous au 122.", g:[122], luckLoss:3},

"128":{t:"Vous foncez à toutes jambes vers le portail de la ferme, sans vous retourner, la lueur grandissant derrière vous et projetant votre ombre démesurée sur le chemin. Vous entendez, ou croyez entendre, un grondement sourd et un souffle qui n'appartient à aucun phénomène naturel connu. Rendez-vous au 132.", g:[132]},

"130":{t:"Vous vous précipitez vers la remise pour y chercher Nahum Gardner et le mettre à l'abri, mais lorsque vous entrez, vous ne trouvez que son fauteuil vide, et sur le plancher, une tache grisâtre et cristalline qui a la forme approximative d'un corps assis. TESTEZ VOTRE LUCIDITÉ. Si vous êtes Chanceux, Rendez-vous au 128. Si vous êtes Malchanceux, Rendez-vous au 134.", g:[128,134], luckTest:true},

"134":{t:"Vous perdez 3 points de LUCIDITÉ en comprenant ce qui est arrivé à Nahum Gardner. Pris de panique, vous vous ruez hors de la ferme vers le portail. Rendez-vous au 132.", g:[132], luckLoss:3},

"122":{t:"Dehors, le crépuscule tombe rapidement, et le verger de Nahum Gardner présente un spectacle hallucinant : les arbres, bien que d'apparence morte et cendreuse, commencent à luire faiblement d'une couleur indescriptible à mesure que la nuit s'installe — comme si l'obscurité seule leur permettait de révéler leur vraie nature. Le puits, au centre de la cour, se met soudain à irradier violemment de cette même lueur. Voulez-vous fuir immédiatement vers le portail de la ferme (Rendez-vous au 128), ou tenter d'abord de mettre Nahum Gardner à l'abri (Rendez-vous au 130) ?", g:[128,130]},

"132":{t:"Vous atteignez le chemin principal, hors d'haleine, et vous retournez une dernière fois. Toute la ferme Gardner baigne à présent dans une lueur d'un vert-gris malsain, comme si le ciel lui-même s'était mis à saigner une couleur impossible. Puis, dans un silence absolu, la lueur se rassemble en une colonne verticale et s'élève dans le ciel nocturne, de plus en plus haut, jusqu'à disparaître parmi les étoiles — retournant, songez-vous avec un frisson glacé, vers l'endroit d'où elle était tombée. Derrière vous, la ferme entière s'effondre lentement en un tas de cendres grises, comme si des années de décomposition venaient de se produire en quelques secondes. Rendez-vous au 140.", g:[140]},

"140":{t:"Le lendemain matin, l'administration du comté décide de noyer la zone sous les eaux d'un nouveau barrage plutôt que d'expliquer l'inexplicable — la \"Lande Foudroyée\", comme la surnomment déjà les fermiers voisins, sera bientôt engloutie et oubliée. De retour à l'Université Miskatonic, vous rédigez un rapport que le doyen refuse catégoriquement de publier. \"Ce genre de récit\", vous dit-il froidement, \"nuit à la réputation de nos recherches sérieuses.\" Il vous suggère cependant, presque à contrecœur, de consulter un vieux professeur retraité du département d'archéologie, un certain Henry Armitage, réputé pour son intérêt discret envers \"les affaires non conventionnelles\". Voulez-vous chercher à rencontrer le professeur Armitage sans tarder (Rendez-vous au 150), ou d'abord vous reposer quelques jours pour recouvrer vos esprits (Rendez-vous au 152) ?", g:[150,152]},

"152":{t:"Vous vous accordez quelques jours de repos dans votre chambre d'étudiant, mais le sommeil vous apporte peu de réconfort : vous rêvez sans cesse de cette couleur impossible, et de voix psalmodiant sous l'océan. Au bout du troisième jour, inquiet de votre propre état mental, vous décidez d'aller trouver le professeur Armitage. Rendez-vous au 150.", g:[150]},

"150":{t:"Le professeur Henry Armitage vous reçoit dans son bureau encombré de livres anciens, certains reliés de cuir craquelé et frappés de symboles que vous reconnaissez, avec un frisson, pour les avoir vus gravés sur la pierre du Récif du Diable. Vous lui racontez votre histoire — Portneuve, les Profonds, la ferme Gardner. Il vous écoute sans un mot, le visage de plus en plus grave. « Vous n'avez encore rien vu, jeune homme », dit-il enfin. « Ce que vous décrivez ne sont que des serviteurs, des phénomènes annonciateurs. Il existe, dans les réserves de notre bibliothèque, un exemplaire du Necronomicon d'Abdul Alhazred. Si vous voulez comprendre ce à quoi vous vous frottez, et espérer y survivre, c'est par là qu'il faut commencer. » Il se lève pour aller chercher son trousseau de clés dans la pièce voisine. Voulez-vous le suivre directement vers la Réserve (Rendez-vous au 200), ou profiter de son absence pour jeter un œil à son bureau encombré (Rendez-vous au 190) ?", g:[200,190]},

"190":{t:"Vous risquez un œil sur les papiers éparpillés du bureau d'Armitage. Parmi des notes de cours et des factures de librairie, une lettre inachevée attire votre attention, adressée à un certain « Randolph C. » et évoquant, en termes prudents, des voyages dans les Contrées du Rêve et un avertissement au sujet de Kadath. Vous glissez discrètement la lettre dans votre poche juste avant qu'Armitage ne revienne, son trousseau de clés à la main. Rendez-vous au 200.", g:[200], addItem:"Lettre inachevée d'Armitage"},

"200":{t:"Le professeur Armitage vous conduit dans la Réserve, une salle voûtée et glaciale où trône, enchaîné à un pupitre de fer, un exemplaire du Necronomicon d'Abdul Alhazred, traduit du grec par Olaus Wormius. « Certains passages coûtent cher à la raison de qui les lit », vous prévient-il. « Choisissez avec prudence ce que vous voulez apprendre. » Voulez-vous lire le chapitre consacré aux Contrées du Rêve et à la Cité du Couchant, Kadath l'Inconnue (Rendez-vous au 202), celui consacré aux Grands Anciens et à leurs serviteurs (Rendez-vous au 204), ou plutôt le fragment relatant le séjour d'Alhazred lui-même dans une cité sans nom ensevelie sous les sables d'Arabie (Rendez-vous au 262) ?", g:[202,204,262]},

"262":{t:"Le fragment décrit une cité de pierre plus vieille que Memphis ou Babylone, à demi engloutie par les dunes d'un désert que nul caravanier n'ose plus traverser. Alhazred y serait entré seul et en serait ressorti des mois plus tard, hagard, marmonnant des vers sur une race reptilienne antérieure à l'humanité qui aurait bâti la cité pour ses propres dieux, avant de s'enfoncer sous terre pour l'éternité. C'est là, prétend le texte, qu'il aurait composé pour la première fois le distique qui ouvre le Necronomicon tout entier — que ce qui n'est pas mort peut à jamais durer, et qu'au terme d'étranges éternités, même la mort peut périr. TESTEZ VOTRE LUCIDITÉ. Si vous êtes Chanceux, Rendez-vous au 264. Si vous êtes Malchanceux, Rendez-vous au 266.", g:[264,266], luckTest:true},

"264":{t:"Vous refermez le passage, troublé mais lucide, un frisson persistant à l'idée que la civilisation humaine ne serait peut-être qu'un locataire tardif et provisoire de cette planète. Armitage referme soigneusement le grimoire. Rendez-vous au 206.", g:[206], addItem:"CODEX:nameless-city"},

"266":{t:"Vous perdez 2 points de LUCIDITÉ : l'idée que des yeux reptiliens ont contemplé les étoiles bien avant les premiers hommes, et les contempleront peut-être bien après leur disparition, s'insinue en vous et ne vous quittera plus tout à fait. Armitage referme soigneusement le grimoire, le visage grave. Rendez-vous au 206.", g:[206], luckLoss:2, addItem:"CODEX:nameless-city"},

"202":{t:"Les pages, d'un vélin jauni et cassant, décrivent un monde parallèle accessible par le rêve profond — les Contrées du Rêve — gouverné depuis les Contrées Boréales par des Dieux de la Terre capricieux, et menacé par un Chaos Rampant nommé Nyarlathotep qui se dissimule au sommet d'un pic de Kadath, l'Inconnue. Le texte mentionne une Clé d'Argent capable d'ouvrir le passage entre les mondes, ainsi qu'une formule de sommeil profond à réciter pour franchir le seuil sans se perdre à jamais dans le Rêve. TESTEZ VOTRE LUCIDITÉ. Si vous êtes Chanceux, Rendez-vous au 205. Si vous êtes Malchanceux, Rendez-vous au 207.", g:[205,207], luckTest:true},

"205":{t:"Vous parvenez à mémoriser la formule sans que votre esprit n'en soit trop affecté. AJOUTEZ la Formule du Sommeil Profond à votre inventaire. Armitage referme le livre avec soulagement. « Souhaitez-vous également lire le passage sur les Grands Anciens ? » Voulez-vous le faire (Rendez-vous au 204), ou estimez-vous en savoir assez pour l'instant (Rendez-vous au 206) ?", g:[204,206], addItem:"Formule du Sommeil Profond"},

"207":{t:"Vous perdez 2 points de LUCIDITÉ : les mots semblent se réorganiser d'eux-mêmes sous vos yeux, formant des géométries qui n'ont pas de sens dans notre espace. Vous parvenez malgré tout à retenir l'essentiel de la formule. AJOUTEZ la Formule du Sommeil Profond à votre inventaire. Armitage vous regarde avec inquiétude. Voulez-vous lire également le passage sur les Grands Anciens (Rendez-vous au 204), ou en rester là pour aujourd'hui (Rendez-vous au 206) ?", g:[204,206], luckLoss:2, addItem:"Formule du Sommeil Profond"},

"204":{t:"Le chapitre sur les Grands Anciens est bien pire. Vous y lisez des passages sur Cthulhu qui rêve dans la cité engloutie de R'lyeh, sur Nyarlathotep qui \"prend mille formes, dont la plus terrible est celle du Pharaon Noir\", et sur un culte répandu par les mers et les continents, attendant l'heure où \"les étoiles seront de nouveau propices\". TESTEZ VOTRE LUCIDITÉ. Si vous êtes Chanceux, Rendez-vous au 208. Si vous êtes Malchanceux, Rendez-vous au 209.", g:[208,209], luckTest:true},

"208":{t:"Vous refermez le livre, la tête bourdonnante, mais votre esprit tient bon. AJOUTEZ la Page Arrachée du Necronomicon à votre inventaire (Armitage vous l'a discrètement laissée, estimant que vous en aurez besoin). Rendez-vous au 206.", g:[206], addItem:"Page Arrachée du Necronomicon"},

"209":{t:"Vous perdez 3 points de LUCIDITÉ. Un nom en particulier — que vous ne parvenez plus à oublier — tourne désormais en boucle dans votre esprit, jour et nuit. AJOUTEZ la Page Arrachée du Necronomicon à votre inventaire. Rendez-vous au 206.", g:[206], luckLoss:3, addItem:"Page Arrachée du Necronomicon"},

"206":{t:"Armitage referme soigneusement le grimoire. « Si vous voulez remonter à la source de tout ceci, il vous faudra franchir le seuil des Contrées du Rêve et gravir Kadath l'Inconnue elle-même — c'est là, dit-on, que réside le Chaos Rampant. Pour cela, il vous faut une Clé d'Argent et la Formule que vous venez d'apprendre. » Possédez-vous une Clé d'Argent (trouvée sur le sacristain de Portneuve) ? Si oui, Rendez-vous au 210. Si vous ne l'avez pas, Rendez-vous au 211.", g:[210,211], choiceLabels:["Oui, j'ai la Clé d'Argent","Non, je ne l'ai pas"]},

"211":{t:"« Sans clé, le passage sera plus périlleux, mais pas impossible pour un esprit suffisamment déterminé — ou suffisamment inconscient du danger », soupire Armitage. Il vous tend un petit brasero de cuivre et un sachet d'encens séché, extrait lui aussi des réserves de la bibliothèque. « Brûlez ceci en récitant la Formule ; cela devrait suffire à entrouvrir le seuil, au prix d'un peu plus... d'incertitude. » AJOUTEZ l'Encens des Seuils à votre inventaire. Rendez-vous au 210.", g:[210], addItem:"Encens des Seuils"},

"210":{t:"Cette nuit-là, dans votre chambre, vous récitez la Formule du Sommeil Profond en tenant votre Clé d'Argent (ou en faisant brûler l'Encens des Seuils) devant vous. Le monde matériel se dissout lentement, comme un rideau de gaze qu'on écarte, et vous vous retrouvez debout sur un chemin pavé d'onyx, sous un ciel où deux lunes jumelles brillent d'une clarté improbable. Vous êtes entré dans les Contrées du Rêve. Au loin se dresse une cité aux tours élancées et scintillantes. Voulez-vous vous y rendre directement (Rendez-vous au 212), ou explorer d'abord les environs immédiats (Rendez-vous au 214) ?", g:[212,214]},

"214":{t:"Vous vous écartez du chemin et découvrez, tapie dans un bosquet d'arbres aux feuilles violettes, une petite créature à fourrure brune munie de tentacules à la place du nez — un Zoog des Contrées du Rêve. Elle vous observe avec curiosité plus que crainte. Voulez-vous essayer de lui parler (Rendez-vous au 216), ou la laisser tranquille et rejoindre la cité (Rendez-vous au 212) ?", g:[216,212]},

"216":{t:"Le Zoog, après une hésitation méfiante, accepte d'échanger quelques mots dans un dialecte de rêve que, curieusement, vous comprenez sans effort. Il vous met en garde contre \"les Choses Sans Visage qui volent la nuit\" et vous indique un raccourci à travers la forêt qui évite la grand-route, plus surveillée. AJOUTEZ Itinéraire du Zoog à votre inventaire. Vous rejoignez ensuite la cité. Rendez-vous au 212.", g:[212], addItem:"Itinéraire du Zoog"},

"212":{t:"La cité de rêve grouille d'un peuple étrange aux visages tantôt magnifiques, tantôt à peine humains. Dans une taverne aux lanternes de verre coloré, vous remarquez un homme au visage étroit et intelligent qui vous fixe avec un intérêt particulier avant de s'approcher. « Vous n'êtes pas d'ici », dit-il simplement. « Peu de rêveurs errent encore d'un pas si assuré. Je m'appelle Pickman — je peux vous être utile, si vous cherchez le chemin de Kadath. » Voulez-vous accepter son aide (Rendez-vous au 218), ou vous méfier de cet inconnu et poursuivre seul (Rendez-vous au 220) ?", g:[218,220]},

"218":{t:"Pickman sourit, dévoilant des dents étrangement pointues. « Sage décision. Le chemin de Kadath traverse les terres des Goules, et il vaut mieux y être accompagné d'un ami. » Il vous conduit vers un escalier dissimulé qui s'enfonce sous la cité, dans un lacis de tunnels où l'air se fait plus lourd, plus animal. C'est alors que vous comprenez : Pickman lui-même n'est plus tout à fait humain, ses mouvements devenus étrangement canins et bondissants. Il est devenu une GOULE. Malgré votre malaise, il vous guide sans encombre à travers plusieurs kilomètres de galeries souterraines. Rendez-vous au 222.", g:[222]},

"220":{t:"Vous déclinez poliment l'offre et sortez seul dans les rues tortueuses de la cité. Après plusieurs heures de marche, vous atteignez ses portes orientales, qui donnent sur une plaine crépusculaire semée d'ossements blanchis. Une odeur de charnier vous parvient depuis un cimetière voisin, d'où émergent des formes canines et voûtées qui creusent frénétiquement la terre. Voulez-vous les affronter pour passer (Rendez-vous au 224), ou contourner le cimetière par le nord, au risque de vous exposer à ciel ouvert (Rendez-vous au 226) ?", g:[224,226]},

"224":{t:"Deux Goules affamées se dressent devant vous, leurs mâchoires canines dégoulinantes, leurs mains griffues tendues.\n\nSi vous êtes vainqueur, Rendez-vous au 222.", c:[["Première Goule",6,6],["Deuxième Goule",7,6]], g:[222]},

"226":{t:"Vous contournez prudemment le cimetière par le nord, restant à découvert sous les deux lunes jumelles. Vous atteignez la plaine sans encombre, mais un frisson vous parcourt : dans un ciel autrement dépourvu de nuages, une ombre silencieuse et ailée a semblé, un instant, obscurcir l'une des deux lunes. Rendez-vous au 228.", g:[228]},

"222":{t:"Au sortir des galeries de Goules (ou du cimetière), vous vous retrouvez dans une vaste plaine crépusculaire qui s'étend à perte de vue vers des montagnes lointaines et déchiquetées. C'est là, vous a assuré votre guide ou votre instinct, que se dresse Kadath l'Inconnue. Rendez-vous au 228.", g:[228]},

"228":{t:"Vous marchez depuis des heures dans cette plaine sans relief lorsqu'un bruissement d'ailes membraneuses, immense, s'élève au-dessus de vous. Une créature noire, sans visage, à la peau caoutchouteuse et luisante, plonge du ciel et vous saisit sous les bras avec une force irrésistible avant que vous ayez pu esquisser le moindre geste de défense. C'est un MAIGRE DE LA NUIT. Il ne cherche pas à vous blesser, mais à vous emporter, chatouillant silencieusement vos flancs de ses griffes tandis que vous vous débattez en vain. Voulez-vous tenter de vous libérer en luttant (Rendez-vous au 230), ou vous laisser porter, impuissant, pour économiser vos forces (Rendez-vous au 232) ?", g:[230,232]},

"230":{t:"Vous vous débattez de toutes vos forces, mais le Maigre de la Nuit vous tient fermement, insensible à vos coups. TESTEZ VOTRE LUCIDITÉ face à cette impuissance terrifiante. Si vous êtes Chanceux, Rendez-vous au 234. Si vous êtes Malchanceux, Rendez-vous au 236.", g:[234,236], luckTest:true},

"236":{t:"L'horreur silencieuse de la créature, son absence totale de visage, sa poigne inexorable — tout cela finit par avoir raison de votre calme. Vous perdez 2 points de LUCIDITÉ à hurler dans le vide, sans qu'aucun son ne semble porter dans cette atmosphère de rêve. Une terreur froide et durable s'installe en vous, une méfiance viscérale envers tout ce qui vole sur des ailes silencieuses. Après un vol interminable, le Maigre vous lâche brutalement sur un plateau rocheux et désolé. Rendez-vous au 238.", g:[238], luckLoss:2, setFlag:"phobiaAiles"},

"234":{t:"Vous parvenez, par un effort de volonté, à conserver votre calme malgré l'épouvante de la situation, vous concentrant sur votre respiration plutôt que sur les griffes caoutchouteuses qui vous encerclent. Après un vol interminable au-dessus de terres inconnues, le Maigre vous lâche sur un plateau rocheux et désolé, puis disparaît en silence dans l'obscurité. Rendez-vous au 238.", g:[238]},

"232":{t:"Vous cessez de lutter, économisant vos forces tandis que le Maigre de la Nuit vous emporte à travers un ciel constellé d'étoiles inconnues. Le vol dure ce qui vous semble des heures avant que la créature ne vous dépose, sans un bruit, sur un plateau rocheux et désolé, puis ne s'envole et disparaisse. Rendez-vous au 238.", g:[238]},

"238":{t:"Vous vous relevez, courbaturé, sur ce qui ressemble à un haut plateau montagneux battu par des vents glacés — le Plateau de Leng, si les récits d'Armitage disaient vrai. Des formes basses, cornues et vêtues de robes s'approchent bientôt de vous en file silencieuse, portant des lances et des dagues à la lueur d'un feu de camp lointain. Voulez-vous tenter de vous cacher (Rendez-vous au 240), ou vous avancer ouvertement vers leur feu de camp dans l'espoir d'un accueil pacifique (Rendez-vous au 242) ?", g:[240,242]},

"240":{t:"Vous vous dissimulez derrière un rocher, mais l'un des Hommes de Leng, à la démarche curieusement sautillante de sabots dissimulés sous sa robe, repère vos traces dans la poussière volcanique. Un cri guttural donne l'alerte, et bientôt trois silhouettes cornues convergent vers votre cachette, lances au poing.\n\nSi vous êtes vainqueur, Rendez-vous au 244.", c:[["Homme de Leng (1)",6,6],["Homme de Leng (2)",6,5],["Homme de Leng (3)",5,6]], g:[244]},

"242":{t:"Vous vous avancez ouvertement, les mains visibles, vers leur feu de camp. Les Hommes de Leng — des humanoïdes trapus, de petites cornes dépassant de sous leurs turbans, leurs pieds fourchus cachés sous de longues robes — vous encerclent sans un mot, leurs visages figés dans une expression indéchiffrable. Un cri guttural, plus autoritaire, retentit depuis l'obscurité, et la file s'écarte pour laisser passer une masse gélatineuse blanchâtre hérissée de tentacules roses vibrants : un CRAPAUD LUNAIRE, maître de cette bande. Rendez-vous au 244.", g:[244]},

"244":{t:"Le Crapaud Lunaire vous observe de ses orifices sensoriels innombrables, dépourvu d'yeux à proprement parler, tandis que les Hommes de Leng attendent son verdict en silence respectueux. Vous comprenez que ces créatures gélatineuses réduisent habituellement les Hommes de Leng en esclavage, et qu'un simple voyageur humain n'a guère plus de valeur à leurs yeux qu'une bête de somme supplémentaire. Possédez-vous le Croquis du Signe des Anciens ? Si oui, Rendez-vous au 246. Si non, Rendez-vous au 248.", g:[246,248], choiceLabels:["Oui, j'ai le Croquis du Signe des Anciens","Non, je ne l'ai pas"]},

"246":{t:"Vous brandissez votre croquis du Signe des Anciens face au Crapaud Lunaire. Un frémissement d'horreur — ou de respect craintif — parcourt visiblement sa masse gélatineuse, et ses tentacules roses se rétractent brusquement. Il émet un gargouillis sifflant, et les Hommes de Leng s'écartent aussitôt de votre chemin, tête basse. Vous êtes libre de poursuivre votre route vers les montagnes que l'on vous désigne au loin. Rendez-vous au 250.", g:[250]},

"248":{t:"Sans protection, vous êtes saisi par plusieurs Hommes de Leng qui vous ligotent solidement. Le Crapaud Lunaire s'approche, ses tentacules roses vibrant d'anticipation. Voulez-vous tenter de vous libérer par la force avant qu'ils ne resserrent vos liens (Rendez-vous au 252), ou attendre une occasion plus favorable de vous échapper (Rendez-vous au 254) ?", g:[252,254]},

"252":{t:"Dans un sursaut désespéré, vous rompez vos liens encore lâches et bousculez l'Homme de Leng le plus proche.\n\nSi vous êtes vainqueur, Rendez-vous au 250.", c:[["Homme de Leng Gardien",7,7]], g:[250]},

"254":{t:"Vous vous laissez faire, cherchant patiemment une meilleure occasion. Vous êtes traîné jusqu'à un enclos rudimentaire où d'autres captifs, hagards, attendent en silence. Cette nuit-là, profitant du sommeil d'un garde négligent, vous parvenez à trancher vos liens avec un éclat de silex trouvé au sol. Vous perdez 1 point de LUCIDITÉ à l'idée de tout ce que vous venez d'entrevoir chez vos codétenus — des rêveurs d'autres mondes, certains à peine encore humains. Vous vous enfuyez dans l'obscurité vers les montagnes. Rendez-vous au 250.", g:[250], luckLoss:1},

"250":{t:"Au-delà du Plateau de Leng, les montagnes se font plus hautes, plus noires, jusqu'à ce qu'un pic unique se détache des autres, coiffé d'un château fait d'onyx que nulle main humaine n'a jamais taillé — Kadath l'Inconnue elle-même. Un froid qui n'a rien de météorologique s'insinue en vous à mesure que vous approchez. Rendez-vous au 256.", g:[256]},

"256":{t:"Alors que vous gravissez les derniers contreforts avant le pic d'onyx, un battement d'ailes immense assombrit le ciel. Un SHANTAK — créature volante à tête chevaline et aux ailes écailleuses, monture des puissances divines — se pose lourdement sur un éperon rocheux, vous barrant la route de son regard vide. On raconte que ces bêtes ne supportent pas l'odeur des Goules. Possédez-vous un fragment d'os pris à une Goule (Os Taillé) ? Si oui, Rendez-vous au 257. Si non, Rendez-vous au 258.", g:[257,258]},

"257":{t:"Vous brandissez l'os taillé et le frottez contre la roche, imitant maladroitement le raclement et l'odeur propres aux Goules. Le Shantak pousse un cri strident et perçant, recule d'un bond, puis s'envole précipitamment vers les cimes, vous laissant le passage libre. Rendez-vous au 260.", g:[260]},

"258":{t:"Sans repoussoir à portée de main, vous devez agir vite. Voulez-vous tenter de vous faufiler discrètement le long de la paroi rocheuse pendant que la créature lisse ses ailes immenses (Rendez-vous au 259), ou l'affronter directement, épée au clair (Rendez-vous au 261) ?", g:[259,261]},

"259":{t:"Vous rasez la paroi à pas comptés, retenant votre souffle. TESTEZ VOTRE LUCIDITÉ. Si vous êtes Chanceux, Rendez-vous au 260. Si vous êtes Malchanceux, Rendez-vous au 261.", g:[260,261], luckTest:true},

"261":{t:"Le Shantak rejette la tête en arrière avec un hennissement métallique et fond sur vous, ses serres tendues.\n\nSi vous êtes vainqueur, Rendez-vous au 260.", c:[["Shantak",9,14]], g:[260]},

"260":{t:"Aux portes du château d'onyx, gardées par nul soldat visible, une présence immatérielle vous accueille — une voix douce et flûtée qui semble sourdre des murs eux-mêmes plutôt que d'une bouche. « Ainsi, un rêveur mortel a trouvé le chemin jusqu'ici. Peu y parviennent. Moins encore en repartent tels qu'ils étaient venus. » C'est Nyarlathotep, le Chaos Rampant, qui prend ici la forme d'un pharaon svelte au visage d'une beauté troublante. Rendez-vous au 300.", g:[300]},

"300":{t:"Nyarlathotep s'avance vers vous d'une démarche féline, un sourire aux lèvres qui n'atteint jamais ses yeux — deux puits noirs où semblent tourbillonner des galaxies entières. « Vous êtes venu de si loin, à travers Portneuve et ses Profonds, à travers la Lande où Gardner a péri, à travers Leng et ses esclavagistes gélatineux... pour quoi, au juste ? Pour me poser des questions que votre espèce n'est pas faite pour comprendre ? » Il incline la tête. « Que ferez-vous, petit rêveur ? » Voulez-vous vous prosterner devant lui, reconnaissant sa suprématie (Rendez-vous au 302), tirer votre épée pour l'affronter (Rendez-vous au 304), ou invoquer contre lui la protection du Signe des Anciens et le savoir arraché au Necronomicon (Rendez-vous au 306) ?", g:[302,304,306]},

"302":{t:"Vous mettez un genou à terre devant le Chaos Rampant. Il éclate d'un rire léger, presque affectueux, et pose une main glacée sur votre front. « Voilà qui est sage — ou lâche, mais la différence, entre mortels, importe rarement. » Vous sentez votre volonté se dissoudre comme du sucre dans l'eau, votre identité se dissoudre à son tour. Vous ne vous réveillerez jamais tout à fait de ce rêve : votre corps reprendra le train pour Arkham, ira à ses cours, sourira à ses amis, mais quelque chose d'autre habitera désormais derrière vos yeux — un messager discret et souriant du Chaos Rampant, répandant sans le savoir la folie et le doute partout où il passera. Vous ne saurez jamais que vous avez perdu.", finale:true, finaleTitle:"SERVITEUR DU CHAOS"},

"304":{t:"Vous tirez votre épée et vous jetez sur Nyarlathotep avec un courage que votre raison réprouve déjà. Sa forme humaine vacille un instant, révélant en dessous quelque chose d'immense et d'informe, avant de se reformer, plus terrible encore.\n\nSi, par un miracle, vous parvenez à le vaincre, Rendez-vous au 314.", c:[["Nyarlathotep, le Chaos Rampant",13,18]], g:[314], noLoot:true},

"306":{t:"Vous brandissez le Signe des Anciens et invoquez, d'une voix que vous peinez à garder ferme, les fragments de savoir arrachés au Necronomicon. Possédez-vous la Page Arrachée du Necronomicon ? Si oui, Rendez-vous au 308. Si non, Rendez-vous au 310.", g:[308,310], choiceLabels:["Oui, j'ai la Page Arrachée du Necronomicon","Non, je ne l'ai pas"]},

"308":{t:"Pour la première fois, un éclair d'intérêt — presque de respect — traverse le regard insondable de Nyarlathotep. « Tiens, tiens. On vous a bien renseigné, petit rêveur. Alhazred avait ses défauts, mais il ne mentait pas sur l'essentiel. » Il vous tourne autour lentement. « Je vous propose un marché, comme il m'arrive d'en proposer aux plus intéressants d'entre vous : repartez maintenant, avec un présent de ma part et un avertissement à porter aux vôtres. Ou bien, si votre curiosité l'emporte sur votre instinct de survie, posez-moi une dernière question — mais sachez que je ne réponds jamais gratuitement. » Voulez-vous accepter le présent et repartir sans poser de question (Rendez-vous au 316), ou risquer une dernière question (Rendez-vous au 312) ?", g:[316,312]},

"310":{t:"Sans les mots exacts du grimoire pour appuyer votre geste, le Signe des Anciens que vous esquissez de mémoire tremble et vacille, à peine plus qu'un geste superstitieux. Nyarlathotep hausse un sourcil, amusé plutôt qu'impressionné. « Un souvenir de protection, sans la substance qui le rend efficace. Touchant. » Il s'approche, et son simple regard semble peser sur votre esprit comme une main de pierre. TESTEZ VOTRE LUCIDITÉ, une dernière fois. Si vous êtes Chanceux, Rendez-vous au 318. Si vous êtes Malchanceux, Rendez-vous au 320.", g:[318,320], luckTest:true},

"312":{t:"Vous rassemblez votre courage et posez la question qui vous hante depuis Portneuve : « Que deviendrons-nous, nous autres humains, lorsque les étoiles seront enfin propices ? » Nyarlathotep sourit largement, et pour la première fois, un froid véritablement cosmique — au-delà de toute peur ordinaire — s'empare de vous. « Vous voulez vraiment savoir ? » TESTEZ VOTRE LUCIDITÉ, une ultime fois : c'est elle, et elle seule, qui déterminera si votre esprit peut contenir la réponse. Si vous êtes Chanceux, Rendez-vous au 322. Si vous êtes Malchanceux, Rendez-vous au 324.", g:[322,324], luckTest:true},

"316":{t:"« Sage décision », murmure Nyarlathotep, presque déçu. D'un geste, il fait apparaître dans votre main un petit galet noir, lisse et tiède, gravé d'un symbole que vous ne reconnaissez pas. « Portez ceci, et les miens vous laisseront en paix, vous et les vôtres, pour une génération encore. Ce n'est pas de la pitié : c'est simplement que vous m'avez distrait, et je paie mes distractions. » Le monde du rêve se dissout autour de vous, et vous vous réveillez en sursaut dans votre lit d'étudiant, le galet noir serré dans votre poing fermé. Vous rédigerez plus tard, sous pseudonyme, un rapport partiel de votre aventure, que le professeur Armitage classera avec les autres \"dossiers non conventionnels\" de l'Université. Portneuve, la Lande Foudroyée et le Plateau de Leng resteront des mystères non résolus pour le monde — mais vous, vous savez. Et une génération de tranquillité, dans un univers aussi indifférent que celui-ci, n'est déjà pas un si mince cadeau.", finale:true, finaleTitle:"UNE VICTOIRE AMÈRE"},

"314":{t:"Contre toute attente, votre lame trouve une faille dans la forme instable de Nyarlathotep — non pas une blessure au sens ordinaire, mais une brève rupture dans la cohérence même de son incarnation. Il recule, sifflant de surprise plus que de douleur, sa silhouette parfaite se craquelant un instant comme un masque de porcelaine. « Voilà qui ne s'était pas produit depuis... » Il ne termine pas sa phrase. « Vous avez gagné un répit, petit rêveur. Pas une victoire — on ne triomphe pas du Chaos, on ne fait que le retarder. Mais un répit. Partez, maintenant, avant que je ne reconsidère ma clémence. » Le château d'onyx s'efface autour de vous, et vous vous réveillez dans votre lit, épuisé mais vivant, votre épée de rêve — étrangement — toujours serrée dans votre main lorsque vous ouvrez les yeux. Vous avez fait ce qu'aucun rêveur mortel n'avait fait depuis des siècles, dit-on dans les cercles très fermés qui savent de telles choses. Cela ne durera pas éternellement. Mais cela a duré.", finale:true, finaleTitle:"LE RÊVEUR QUI DÉFIA LE CHAOS"},

"318":{t:"Par un ultime sursaut de volonté, vous parvenez à détourner votre esprit de l'abîme que le regard de Nyarlathotep ouvrait devant vous. Il vous observe se reprendre avec une moue presque déçue. « Résistant, pour un être d'une espèce si fragile. Très bien. Partez donc — mais vous porterez toujours la marque de cette rencontre. » Vous vous réveillez dans votre lit, tremblant, et découvrez au matin, dans le miroir, une mèche de vos cheveux devenue entièrement blanche à l'endroit où sa main glacée avait touché votre front. Vous avez survécu à Kadath, à Leng, à la Lande Foudroyée et à Portneuve. Mais vous savez, désormais, avec une certitude que rien n'effacera plus, que l'indifférence cosmique n'attend que son heure — et que cette heure n'est, par chance, pas encore venue.", finale:true, finaleTitle:"UN RETOUR MARQUÉ"},

"320":{t:"Le regard de Nyarlathotep s'enfonce dans le vôtre comme une lame de glace dans de la chair tendre, et cette fois, il n'y a plus de résistance possible. Vous sentez votre esprit se déchirer silencieusement, page après page, comme un livre qu'on effeuille dans le vent. Vous ne vous réveillerez jamais complètement : votre corps sera retrouvé errant sans but dans les rues d'Arkham, murmurant sans cesse des noms que personne ne devrait connaître. On vous internera au Sanatorium du comté, où vous passerez le reste de vos jours à dessiner, sur les murs de votre cellule, des cartes toujours plus précises d'un plateau montagneux que nul cartographe éveillé n'a jamais foulé.", finale:true, finaleTitle:"LE RIRE DANS LE NOIR"},

"322":{t:"Contre toute attente, votre esprit tient bon face à la réponse — non pas parce que la vérité soit supportable, mais parce que vous trouvez, au fond de l'horreur, une forme étrange de calme : celui de savoir enfin, plutôt que de craindre dans l'ignorance. Nyarlathotep vous regarde avec quelque chose qui ressemble, l'espace d'un instant, à de la considération véritable. « Peu de rêveurs entendent la réponse entière et gardent encore leur nom, leur visage, et l'usage de leur langue au réveil. Allez, alors. Portez ce savoir comme un fardeau, si vous le devez — ou comme une arme, si vous l'osez. » Vous vous réveillez à l'aube, épuisé mais lucide, et vous passerez le reste de votre vie à veiller discrètement, comme le fait Armitage avant vous, sur les seuils fragiles entre le monde des hommes et ce qui rêve au-delà. Ce n'est pas une victoire, au sens où l'entendent les histoires ordinaires. Mais c'est, peut-être, la seule qui soit vraiment offerte à quiconque ose regarder l'univers en face.", finale:true, finaleTitle:"LE GARDIEN DU SEUIL"},

"324":{t:"La réponse de Nyarlathotep n'est pas faite de mots, mais d'une compréhension directe, totale, insupportable, versée dans votre esprit comme un liquide bouillant. Votre dernière pensée cohérente est un vague étonnement devant la beauté terrible et totalement indifférente de ce que vous venez d'entrevoir. Votre corps continuera d'exister, quelque part entre Kadath et Arkham, dans un état que la médecine ne saura jamais nommer correctement — ni tout à fait éveillé, ni tout à fait endormi, à jamais suspendu dans la contemplation muette d'une vérité que nulle raison mortelle n'était faite pour contenir.", finale:true, finaleTitle:"L'ULTIME RÊVE"}

};

/* ---------- Combat state helpers ---------- */
function curEnemies(){ return COMBAT ? COMBAT.enemies.filter(e=>e.end>0) : []; }

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showIntro(){
  $('introtext').textContent = INTRO;
  initIntroReveal();
}
function initIntroReveal(){
  const scene = $('introscreen');
  if(!scene) return;
  let pendingX = null, pendingY = null, ticking = false;
  const b = () => scene.getBoundingClientRect();
  function applyPos(){
    ticking = false;
    if(pendingX === null) return;
    const rect = b();
    const x = ((pendingX - rect.left) / rect.width) * 100;
    const y = ((pendingY - rect.top) / rect.height) * 100;
    scene.style.setProperty('--mx', Math.min(100, Math.max(0, x)) + '%');
    scene.style.setProperty('--my', Math.min(100, Math.max(0, y)) + '%');
  }
  function setPos(clientX, clientY){
    pendingX = clientX; pendingY = clientY;
    if(!ticking){ ticking = true; requestAnimationFrame(applyPos); }
  }
  scene.addEventListener('pointermove', e => {
    setPos(e.clientX, e.clientY);
    if(e.pointerType === 'mouse') scene.classList.add('is-revealed');
  }, { passive:true });
  scene.addEventListener('pointerleave', e => {
    if(e.pointerType === 'mouse') scene.classList.remove('is-revealed');
  });
  scene.addEventListener('pointerdown', e => {
    if(e.pointerType !== 'mouse'){
      setPos(e.clientX, e.clientY);
      scene.classList.toggle('is-revealed');
    }
  });
}
function $(id){ return document.getElementById(id); }
function show(id,disp){ $(id).style.display = disp||'block'; }
function hide(id){ $(id).style.display = 'none'; }

function showSetup(){
  hide('introscreen');
  $('setup').style.display='flex';
  rollAll();
}
function animateNumber(el, finalVal, ms, minV, maxV){
  const start = Date.now();
  const iv = setInterval(()=>{
    const elapsed = Date.now()-start;
    if(elapsed>=ms){ clearInterval(iv); el.textContent = finalVal; el.classList.remove('rolling'); return; }
    el.textContent = minV + Math.floor(Math.random()*(maxV-minV+1));
    el.classList.add('rolling');
  }, 60);
}

async function rollAll(){
  const skillDie = d(); G.maxSkill = skillDie+6; G.skill = G.maxSkill;
  const endDice = [d(),d()]; G.maxEnd = endDice[0]+endDice[1]+12; G.end = G.maxEnd;
  const luckDie = d(); G.maxLuck = luckDie+6; G.luck = G.maxLuck;
  $('setupbtn').disabled = true;
  await rollDiceVisual([
    { label:'Habileté (+6)', values:[skillDie] },
    { label:'Endurance (+12)', values:endDice },
    { label:'Lucidité (+6)', values:[luckDie] }
  ], 750);
  $('setSkill').textContent = G.maxSkill;
  $('setEnd').textContent = G.maxEnd;
  $('setLuck').textContent = G.maxLuck;
  $('setupbtn').disabled = false;
}

function startGame(){
  $('setup').style.display='none';
  $('header').style.display='flex';
  updateStats();
  goTo(1);
}

function updateStats(){
  $('sk').textContent = G.skill;
  $('en').textContent = Math.max(G.end,0);
  $('lu').textContent = G.luck;
  $('engauge').style.width = Math.max(0,Math.min(100, (G.end/G.maxEnd)*100)) + '%';
  $('lugauge').style.width = Math.max(0,Math.min(100, (G.luck/G.maxLuck)*100)) + '%';
}

function toggleInv(){
  const inv = $('inv');
  if(inv.style.display==='block'){ hide('inv'); return; }
  const list = $('invlist');
  let html = `<div class="sheet-stats">
    <div class="dice-stat"><span class="slabel">Habileté</span><span class="sval">${G.skill}</span></div>
    <div class="dice-stat"><span class="slabel">Endurance</span><span class="sval red">${Math.max(G.end,0)}/${G.maxEnd}</span></div>
    <div class="dice-stat"><span class="slabel">Lucidité</span><span class="sval violet">${G.luck}/${G.maxLuck}</span></div>
  </div>`;
  const activePhobias = Object.keys(PHOBIAS).filter(k=>G.flags[k]);
  if(activePhobias.length){
    html += '<div class="sheet-section-title">État mental</div>';
    html += activePhobias.map(k=>{
      const p = PHOBIAS[k];
      return `<div class="codex-entry"><div class="cname">${esc(p.name)}</div><div class="clore">${esc(p.desc)}</div></div>`;
    }).join('');
  }
  html += '<div class="sheet-section-title">Consommables</div>';
  if(G.potion){
    html += `<div class="consumable"><span>✦ ${esc(G.potion)}</span><button onclick="drinkPotion()">Boire</button></div>`;
  }
  html += `<div class="consumable"><span>✦ Provisions séchées (${G.provisions})</span>${G.provisions>0 ? '<button onclick="eatProvision()">Manger</button>' : ''}</div>`;
  html += '<div class="sheet-section-title">Objets & indices</div>';
  html += G.inv.length ? G.inv.map(i=>`<div class="item">${esc(i)}</div>`).join('') : '<div class="item">Rien d\'autre pour l\'instant.</div>';
  html += '<div class="sheet-section-title">Codex des entités rencontrées</div>';
  if(G.codex.size===0){
    html += '<div class="item">Vous n\'avez encore croisé aucune entité notable.</div>';
  } else {
    html += [...G.codex].map(k=>{
      const c = CODEX_DB.find(x=>x.key===k);
      return `<div class="codex-entry"><div class="cname">${c.name}</div><div class="clore">${c.lore}</div></div>`;
    }).join('');
  }
  html += '<div class="sheet-section-title">Journal de bord</div>';
  html += G.journal.slice().reverse().slice(0,12).map(j=>
    `<div class="journal-entry"><span class="jnum">§${j.n}</span><span class="jtext">${esc(j.text)}</span></div>`
  ).join('');
  list.innerHTML = html;
  inv.style.display='block';
}

function drinkPotion(){
  if(!G.potion) return;
  G.end = G.maxEnd;
  const msg = `Vous respirez les ${G.potion}. Vos forces reviennent d'un coup : ENDURANCE entièrement restaurée.`;
  G.potion = null;
  updateStats();
  updatePotionBtn();
  toggleInv(); toggleInv();
  flashMsg(msg);
}
function eatProvision(){
  if(G.provisions<=0 || COMBAT) return;
  G.provisions--;
  G.end = Math.min(G.maxEnd, G.end+4);
  updateStats();
  toggleInv(); toggleInv();
  flashMsg('Vous avalez quelques provisions séchées. +4 ENDURANCE.');
}
function flashMsg(text){
  const box = $('msgbox');
  box.innerHTML = text;
  show('msgbox','block');
}

function showItemToast(label, name, icon){
  const stack = $('itemtoast-stack');
  if(!stack) return;
  const el = document.createElement('div');
  el.className = 'itemtoast';
  el.innerHTML = `<div class="toast-icon">${icon}</div><div class="toast-text"><div class="toast-label">${esc(label)}</div><div class="toast-name">${esc(name)}</div></div>`;
  stack.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=> el.remove(), 400);
  }, 3400);
}
function addItem(str){
  str.split(';').forEach(it=>{
    if(!it) return;
    if(it.startsWith('RATION:')){
      const n = parseInt(it.split(':')[1],10)||1;
      G.provisions += n;
      showItemToast('Provisions trouvées', `+${n} ration${n>1?'s':''} séchée${n>1?'s':''}`, '🍞');
      return;
    }
    if(it.startsWith('POTION:')){
      const name = it.split(':')[1];
      G.potion = name;
      showItemToast('Potion trouvée', name, '⚗');
      return;
    }
    if(it.startsWith('CODEX:')){
      const key = it.split(':')[1];
      G.codex.add(key);
      const c = CODEX_DB.find(x=>x.key===key);
      showItemToast('Codex complété', c ? c.name : key, '📖');
      return;
    }
    G.inv.push(it);
    showItemToast('Objet trouvé', it, '✦');
  });
}

function cleanChoiceLabel(raw){
  let s = raw.trim();
  s = s.replace(/^[»«"'\-–—\s]+/,'');
  s = s.replace(/^[,;:]\s*/,'');
  s = s.replace(/^(ou\s+)?(bien\s+)?(préférez-vous|voulez-vous|souhaitez-vous|décidez-vous de|estimez-vous)\s+/i,'');
  s = s.replace(/^ou\s+/i,'');
  s = s.trim();
  if(!s) return null;
  s = s.charAt(0).toUpperCase()+s.slice(1);
  if(s.length>115) s = s.slice(0,112).trim()+'…';
  return s;
}
function extractChoiceLabels(sec){
  if(sec.choiceLabels) return sec.choiceLabels;
  const re = /([^.!?]*?)\(Rendez-vous au (\d+)\)/g;
  const found = {};
  let m;
  while((m = re.exec(sec.t))){
    const label = cleanChoiceLabel(m[1]);
    const num = parseInt(m[2],10);
    if(label) found[num] = label;
  }
  const fallback = sec.g.length === 1 ? 'Continuer…' : 'Poursuivre';
  return sec.g.map(t => found[t] || fallback);
}

function renderChoices(sec){
  const box = $('choicesec');
  box.innerHTML='';
  const labels = extractChoiceLabels(sec);
  sec.g.forEach((t,i)=>{
    const btn = document.createElement('button');
    btn.className='choice-btn';
    btn.textContent = labels[i];
    btn.onclick = ()=>goTo(t);
    box.appendChild(btn);
  });
  show('choicesec','flex');
}

function goTo(n){
  n = parseInt(n,10);
  const sec = SECTIONS[n];
  if(!sec){ console.warn('Section manquante', n); return; }
  G.section = n; G.history.push(n);
  hide('choicesec'); hide('msgbox'); hide('combatbox');
  $('gscroll').scrollTop = 0;
  $('secnum').textContent = '§ ' + n;
  show('secnum','block');
  maybeShowActBanner(n);
  trySceneImage(n);

  $('story').innerHTML = highlightStory(stripChoiceSentences(sec.t));
  G.journal.push({ n, text: journalLine(sec.t) });

  if(sec.addItem){ addItem(sec.addItem); }
  if(sec.luckLoss){ G.luck = Math.max(0, G.luck - sec.luckLoss); }
  if(sec.setFlag && !G.flags[sec.setFlag]){
    G.flags[sec.setFlag] = true;
    const p = PHOBIAS[sec.setFlag];
    if(p) showItemToast('Phobie développée', p.name, '😨');
  }
  updateStats();

  if(G.end<=0){ death("Votre corps ne peut plus supporter les horreurs de Portneuve. Vous vous effondrez sur le sable froid, et la marée montante se referme sur vous."); return; }
  if(G.luck<=0){ death("Votre esprit se brise sous le poids de vérités que nul être humain ne devrait connaître. Vous errez désormais dans les rues de Portneuve, marmonnant des noms que vous ne comprenez plus vous-même."); return; }

  if(sec.finale){ showFinale(sec); return; }
  if(sec.ending){ victory(sec.t); return; }

  if(sec.c && sec.c.length){ startCombat(sec); return; }

  if(sec.luckTest){ renderLuckChoiceOrAuto(sec); return; }

  const targets = sec.g||[];
  if(targets.length===0){ death(sec.t); return; }
  renderChoices(sec);
}

function renderLuckChoiceOrAuto(sec){
  const box = $('msgbox');
  box.innerHTML = 'Le destin hésite... <button class="choice-btn" style="margin-top:10px;" onclick="resolveLuck()">Tenter votre Lucidité (2d6 ≤ '+G.luck+')</button>';
  show('msgbox','block');
}
async function resolveLuck(){
  hide('msgbox');
  const dice = [d(), d()];
  const roll = dice[0]+dice[1];
  const ok = roll <= G.luck;
  await rollDiceVisual([{ label:'Lucidité', values:dice }], 700);
  const box = $('msgbox');
  const sec = SECTIONS[G.section];
  const target = ok ? sec.g[0] : sec.g[1];
  box.innerHTML = 'Vous lancez les dés... <b>'+roll+'</b> — '+(ok?'Chanceux.':'Malchanceux.')+
    ' <button class="choice-btn" style="margin-top:10px;" onclick="goTo('+target+')">Continuer</button>';
  show('msgbox','block');
}

/* ---------- Combat ---------- */
function startCombat(sec){
  COMBAT = { enemies: sec.c.map(e=>({name:e[0], skill:e[1], end:e[2], maxEnd:e[2]})), targets: sec.g, firstStrike: !!sec.firstStrike, idx:0 };
  COMBAT.lootKey = sec.noLoot ? null : lootKeyFor(COMBAT.enemies);
  COMBAT.enemies.forEach(e=>{ const c = codexLookup(e.name); if(c) G.codex.add(c.key); });
  renderCombat();
  show('combatbox','block');
  $('fleebtn').style.display = 'inline-block';
  setStanceButtons(true);
  updatePotionBtn();
}
function setStanceButtons(enabled){
  document.querySelectorAll('.stancebtn').forEach(b=> b.disabled = !enabled);
  const pb = $('usepotionbtn');
  if(pb) pb.disabled = !enabled;
}
function updatePotionBtn(){
  const btn = $('usepotionbtn');
  if(!btn) return;
  if(G.potion){
    btn.style.display = 'block';
    btn.textContent = 'Boire : ' + G.potion;
  } else {
    btn.style.display = 'none';
  }
}
function usePotionInCombat(){
  if(!G.potion || !COMBAT) return;
  const used = G.potion;
  G.end = G.maxEnd;
  G.potion = null;
  updateStats();
  updatePotionBtn();
  $('clog').innerHTML = `Vous buvez précipitamment vos ${esc(used)} en plein combat. Votre endurance est entièrement restaurée !`;
}
function enemyIcon(name){
  const n = name.toLowerCase();
  if(n.includes('profond')) return '🌊';
  if(n.includes('goule')) return '💀';
  if(n.includes('leng')) return '🗡';
  if(n.includes('crapaud') || n.includes('lunaire')) return '🫧';
  if(n.includes('nyarlathotep')) return '👁';
  if(n.includes('sacristain')) return '🕯';
  if(n.includes('cultiste')) return '🔪';
  if(n.includes('shantak')) return '🦇';
  return '❖';
}
function renderCombat(){
  const list = $('enemylist');
  list.innerHTML = COMBAT.enemies.map(e=>{
    const pct = Math.max(0, Math.min(100, (e.end/e.maxEnd)*100));
    return `<div class="enemy-row ${e.end<=0?'dead':''}">
      <div class="erow-top"><span><span class="enemy-icon">${enemyIcon(e.name)}</span>${esc(e.name)} (HAB ${e.skill})</span><span>${Math.max(e.end,0)}/${e.maxEnd} END</span></div>
      <div class="ebar"><i style="width:${pct}%"></i></div>
    </div>`;
  }).join('');
}
function activeEnemy(){
  return COMBAT.enemies.find(e=>e.end>0);
}
const STANCES = {
  normal: { atkMod:0, dmgMod:1, label:'' },
  risky:  { atkMod:2, dmgMod:1.6, label:' (attaque risquée)' },
  defend: { atkMod:-2, dmgMod:0.5, label:' (posture défensive)' }
};
async function combatRound(stance){
  stance = stance || 'normal';
  const st = STANCES[stance] || STANCES.normal;
  const enemy = activeEnemy();
  if(!enemy) return;
  setStanceButtons(false);
  const clog = $('clog');
  const pDice = [d(), d()];
  const rows = [{ label: COMBAT.firstStrike ? 'Vous (surprise)' : 'Vous', values:pDice }];
  let eDice = null;
  if(!COMBAT.firstStrike){ eDice = [d(), d()]; rows.push({ label:enemy.name, values:eDice }); }
  await rollDiceVisual(rows, 650);
  let playerRoll = pDice[0]+pDice[1]+G.skill+st.atkMod;
  let enemyRoll = COMBAT.firstStrike ? -1 : eDice[0]+eDice[1]+enemy.skill;
  if(COMBAT.firstStrike){ COMBAT.firstStrike=false; }
  if(playerRoll > enemyRoll){
    const margin = playerRoll - enemyRoll;
    let dmg = Math.max(1, Math.round((margin>=6 ? 4 : 2) * st.dmgMod));
    let dmgNote = '';
    if(G.inv.includes("Dague Rituelle de K'n-yan") && enemy.name.toLowerCase().includes('nyarlathotep')){
      dmg += 2; dmgNote = ' La lame de bronze verdi de K\'n-yan mord la chair qui ne devrait pas en avoir.';
    }
    if(G.flags.phobiaAiles && enemy.name.toLowerCase().includes('shantak')){
      dmg = Math.max(1, Math.round(dmg/2)); dmgNote = ' Votre terreur des ailes silencieuses affaiblit votre bras.';
    }
    enemy.end -= dmg;
    clog.innerHTML = `Force d'Attaque${st.label} : Vous ${playerRoll} vs ${enemy.name} ${Math.max(enemyRoll,0)} — vous touchez !` + (margin>=6 ? ` <span class="crit">Coup critique !</span> (${enemy.name} perd ${dmg} END)` : ` (${enemy.name} perd ${dmg} END)`) + dmgNote;
  } else if(playerRoll < enemyRoll){
    const margin = enemyRoll - playerRoll;
    const dmg = Math.max(1, Math.round((margin>=6 ? 4 : 2) * st.dmgMod));
    G.end -= dmg;
    clog.innerHTML = `Force d'Attaque${st.label} : Vous ${playerRoll} vs ${enemy.name} ${enemyRoll} — vous êtes touché !` + (margin>=6 ? ` <span class="crit">Coup terrible !</span> (vous perdez ${dmg} END)` : ` (vous perdez ${dmg} END)`);
    $('frame').classList.add('shaking');
    setTimeout(()=>$('frame').classList.remove('shaking'), 350);
  } else {
    clog.textContent = `Force d'Attaque égale (${playerRoll}) — les coups se neutralisent.`;
  }
  renderCombat();
  updateStats();
  if(G.end<=0){ setTimeout(()=>{ hide('combatbox'); death("Vos blessures ont raison de vous. Le froid de Portneuve vous enveloppe pour toujours."); },600); return; }
  if(curEnemies().length===0){
    clog.textContent += ' Tous vos adversaires sont vaincus !';
    document.querySelectorAll('.stancebtn').forEach(b=> b.style.display='none');
    $('usepotionbtn').style.display='none';
    $('fleebtn').style.display='none';
    const target = COMBAT.targets[0];
    const lootKey = COMBAT.lootKey;
    setTimeout(()=>{
      hide('combatbox');
      document.querySelectorAll('.stancebtn').forEach(b=> b.style.display='');
      if(lootKey){ offerLoot(lootKey, target); } else { goTo(target); }
      COMBAT=null;
    }, 900);
  } else {
    setStanceButtons(true);
  }
}
function offerLoot(lootKey, target){
  const box = $('msgbox');
  box.innerHTML = 'Les corps gisent immobiles à vos pieds. <button class="choice-btn" style="margin-top:10px;" onclick="doLoot(\''+lootKey+'\','+target+')">Fouiller les corps</button><button class="choice-btn" style="margin-top:10px;" onclick="goTo('+target+')">Ne rien prendre, continuer</button>';
  show('msgbox','block');
}
async function doLoot(lootKey, target){
  hide('msgbox');
  const table = LOOT_TABLES[lootKey];
  const roll = d();
  await rollDiceVisual([{ label:'Fouille', values:[roll] }], 600);
  const entry = table[roll-1] || table[0];
  if(entry.item) addItem(entry.item);
  const box = $('msgbox');
  box.innerHTML = entry.text + ' <button class="choice-btn" style="margin-top:10px;" onclick="goTo('+target+')">Continuer</button>';
  show('msgbox','block');
}
function fleeCombat(){
  hide('combatbox');
  document.querySelectorAll('.stancebtn').forEach(b=> b.style.display='');
  setStanceButtons(true);
  if(COMBAT.targets[1]){ goTo(COMBAT.targets[1]); } else { goTo(COMBAT.targets[0]); }
  COMBAT=null;
}

/* ---------- Death / Victory ---------- */
function death(text){
  $('deathtext').textContent = text;
  $('deathscreen').style.display='flex';
}
function showFinale(sec){
  document.querySelector('#victoryscreen h2').textContent = sec.finaleTitle || 'FIN DE L\'HISTOIRE';
  $('victorytext').textContent = sec.t;
  $('victoryscreen').style.display='flex';
}
function victory(text){
  $('victorytext').textContent = "L'Acte III s'achève ici. L'Acte IV — la confrontation avec Nyarlathotep et les fins multiples de l'aventure — sera ajouté dans une prochaine version de ce document.";
  $('victoryscreen').style.display='flex';
}
function restart(){
  location.reload();
}

function fitViewport(){
  const frame = $('frame');
  if(!frame) return;
  const ratio = 9/16; // largeur/hauteur
  const vw = window.innerWidth, vh = window.innerHeight;
  let w, h;
  if(vw/vh > ratio){ h = vh; w = h*ratio; }
  else { w = vw; h = w/ratio; }
  frame.style.width = w+'px';
  frame.style.height = h+'px';
}
window.addEventListener('resize', fitViewport);
window.addEventListener('orientationchange', fitViewport);
fitViewport();

showIntro();
initFog();

function initFog(){
  const canvas = $('fx');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  const blobs = Array.from({length:5}, (_,i)=>({
    x: Math.random()*1, y: 0.55+Math.random()*0.45,
    r: 180+Math.random()*220, speed: 0.00006+Math.random()*0.00008,
    phase: Math.random()*Math.PI*2, drift: (Math.random()<0.5?-1:1)
  }));
  function loop(t){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    blobs.forEach(b=>{
      const x = ((Math.sin(t*b.speed + b.phase)*0.5+0.5)*0.7+0.15) * canvas.width;
      const y = b.y * canvas.height + Math.sin(t*b.speed*1.3+b.phase)*30;
      const grad = ctx.createRadialGradient(x,y,0,x,y,b.r);
      grad.addColorStop(0, 'rgba(94,143,121,0.10)');
      grad.addColorStop(1, 'rgba(94,143,121,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x,y,b.r,0,Math.PI*2); ctx.fill();
    });
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

</script>
