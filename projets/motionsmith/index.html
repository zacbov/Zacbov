  { id: "llama-3.1-8b-instant",           provider: "groq",       label: "Groq · Llama 3.1 8B (rapide)" },
  { id: "llama3.1-8b",                    provider: "cerebras",   label: "Cerebras · Llama 3.1 8B" },
  { id: "llama-3.3-70b",                  provider: "cerebras",   label: "Cerebras · Llama 3.3 70B" },
  { id: "gemini-2.0-flash",               provider: "gemini",     label: "Gemini 2.0 Flash" },
  { id: "mistral-large-latest",           provider: "mistral",    label: "Mistral Large" },
  { id: "gpt-4o-mini",                    provider: "chatgpt",    label: "OpenAI · GPT-4o mini" },
  { id: "meta/llama-3.1-70b-instruct",    provider: "nvidia",     label: "NVIDIA · Llama 3.1 70B" },
  { id: "openai/gpt-4o-mini",             provider: "openrouter", label: "OpenRouter · GPT-4o mini" },
  { id: "glm-4-flash",                    provider: "zai",        label: "Z.ai · GLM-4 Flash" }
];

const aiCfg = {
  base: localStorage.getItem("ms_ai_base") || AI_DEFAULT_BASE,
  route: localStorage.getItem("ms_ai_route") || "",
  model: localStorage.getItem("ms_ai_model") || AI_MODELS[0].id,
  provider: localStorage.getItem("ms_ai_provider") || AI_MODELS[0].provider
};
function aiSave(){
  localStorage.setItem("ms_ai_base", aiCfg.base);
  localStorage.setItem("ms_ai_route", aiCfg.route);
  localStorage.setItem("ms_ai_model", aiCfg.model);
  localStorage.setItem("ms_ai_provider", aiCfg.provider);
}

/* Formes de route candidates, dans l'ordre où on les essaie. */
function aiCandidates(base, provider){
  const b = base.replace(/\/+$/, "");
  return [
    b + "/v1/chat/completions",
    b + "/" + provider + "/v1/chat/completions",
    b + "/" + provider + "/chat/completions",
    b + "/chat/completions",
    b + "/api/chat",
    b + "/chat",
    b + "/" + provider,
    b + "/"
  ];
}

function aiBody(messages, model, provider, json){
  const body = { model, messages, temperature: 0.7, max_tokens: 1600, provider };
  if (json) body.response_format = { type: "json_object" };
  return body;
}

/* Les proxys renvoient soit du style OpenAI, soit du Gemini, soit du texte
   brut. On accepte les trois plutôt que de supposer un seul format. */
function aiExtractText(data){
  if (typeof data === "string") return data;
  if (!data || typeof data !== "object") return "";
  if (data.choices && data.choices[0]){
    const c = data.choices[0];
    if (c.message && typeof c.message.content === "string") return c.message.content;
    if (typeof c.text === "string") return c.text;
  }
  if (data.candidates && data.candidates[0]){
    const parts = (data.candidates[0].content || {}).parts || [];
    return parts.map(p => p.text || "").join("");
  }
  if (typeof data.content === "string") return data.content;
  if (typeof data.output === "string") return data.output;
  if (typeof data.response === "string") return data.response;
  if (typeof data.result === "string") return data.result;
  return "";
}

async function aiTry(url, body, log){
  const t0 = performance.now();
  try {
    const r = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const raw = await r.text();
    const ms = Math.round(performance.now() - t0);
    if (!r.ok){
      log("✕ " + r.status + " " + url.replace(aiCfg.base, "") + " (" + ms + " ms) — "
          + raw.slice(0, 120), "err");
      return null;
    }
    let data;
    try { data = JSON.parse(raw); } catch(e){ data = raw; }
    const text = aiExtractText(data);
    if (!text){
      log("✕ réponse sans texte exploitable sur " + url.replace(aiCfg.base, "")
          + " — " + raw.slice(0, 120), "err");
      return null;
    }
    log("✓ " + url.replace(aiCfg.base, "") + " (" + ms + " ms)", "ok");
    return text;
  } catch(e){
    log("✕ " + url.replace(aiCfg.base, "") + " — " + e.message, "err");
    return null;
  }
}

async function aiChat(messages, log, json){
  const body = aiBody(messages, aiCfg.model, aiCfg.provider, json);
  if (aiCfg.route){
    const t = await aiTry(aiCfg.route, body, log);
    if (t) return t;
    log("La route mémorisée ne répond plus, nouvelle découverte…");
    aiCfg.route = "";
  }
  for (const url of aiCandidates(aiCfg.base, aiCfg.provider)){
    const t = await aiTry(url, body, log);
    if (t){ aiCfg.route = url; aiSave(); log("Route retenue : " + url, "ok"); return t; }
  }
  throw new Error("aucune route n'a répondu — vérifie l'adresse du proxy");
}

/* --------- génération de scène ---------
   Le modèle ne construit jamais le document directement : il rend une
   description simple, qu'on valide et qu'on traduit en calques réels. Une
   sortie malformée ne peut donc pas corrompre le projet. */
const SCENE_SCHEMA = `Réponds UNIQUEMENT par un objet JSON, sans texte autour, sans balises de code.
Schéma exact :
{
  "palette": "<un nom parmi: PALETTE_NAMES>",
  "pair": "<un nom parmi: PAIR_NAMES>",
  "background": "gradient" | "solid",
  "fx": { "glow": 0..1, "chroma": 0..1, "vignette": 0..1, "grain": 0..0.2 },
  "layers": [
    {
      "type": "text" | "shape" | "button",
      "text": "<contenu si type=text ou button>",
      "role": "title" | "subtitle" | "caption",
      "shape": "rect" | "ellipse" | "triangle" | "line" | "star" | "polygon",
      "xPct": 0..100, "yPct": 0..100,
      "sizePct": 1..30,
      "widthPct": 1..100, "heightPct": 1..100,
      "preset": "<un nom parmi: PRESET_NAMES>",
      "look": "<un nom parmi: LOOK_NAMES>",
      "delay": 0..4, "stagger": 0..0.2
    }
  ]
}
Contraintes : 2 à 5 calques, textes courts et en français, xPct/yPct positionnent
le CENTRE du calque, pas de chevauchement entre les blocs de texte.`;

function scenePrompt(userPrompt){
  return SCENE_SCHEMA
    .replace("PALETTE_NAMES", PALETTES.map(p => p.name).join(", "))
    .replace("PAIR_NAMES", FONT_PAIRS.slice(0, 20).map(p => p.name).join(", "))
    .replace("PRESET_NAMES", Object.keys(PRESETS).join(", "))
    .replace("LOOK_NAMES", Object.keys(LOOKS).join(", "))
    + "\n\nDemande : " + userPrompt;
}

function parseSceneJSON(text){
  let t = text.trim()
    .replace(/^```(?:json)?/i, "")
    .replace(/```$/, "")
    .trim();
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a >= 0 && b > a) t = t.slice(a, b + 1);
  return JSON.parse(t);
}

function applyScene(spec, log){
  pushUndo("Générer une scène");
  const pal  = PALETTES.find(p => p.name === spec.palette) || PALETTES[1];
  const pair = FONT_PAIRS.find(p => p.name === spec.pair)  || FONT_PAIRS[0];
  const pct  = (v, total, def) =>
    (typeof v === "number" && isFinite(v)) ? clamp(v, 0, 100) / 100 * total : def;

  doc.bg = pal.bg;
  doc.bg2 = pal.c[2];
  doc.bgGrad = spec.background === "gradient";
  const f = spec.fx || {};
  doc.fx = Object.assign({}, FX_DEFAULT, {
    glow: clamp(+f.glow || 0, 0, 2), chroma: clamp(+f.chroma || 0, 0, 3),
    vignette: clamp(+f.vignette || 0.18, 0, 1), grain: clamp(+f.grain || 0.04, 0, 0.4) });

  const src = Array.isArray(spec.layers) ? spec.layers.slice(0, 8) : [];
  if (!src.length) throw new Error("aucun calque dans la réponse");

  const out = [];
  let ti = 0;
  for (const sp of src){
    const type = ["text","shape","button"].includes(sp.type) ? sp.type : "text";
    let l;
    if (type === "shape"){
      l = makeShapeLayer();
      l.shape = ["rect","ellipse","triangle","line","star","polygon"].includes(sp.shape)
                ? sp.shape : "rect";
      l.w = P(Math.round(pct(sp.widthPct,  doc.width,  doc.width * 0.3)));
      l.h = P(Math.round(pct(sp.heightPct, doc.height, doc.height * 0.02)));
      l.fill = P(pal.a);
      l.name = "Forme " + (out.length + 1);
    } else if (type === "button"){
      l = makeButtonLayer();
      l.label = String(sp.text || "EN SAVOIR PLUS").slice(0, 40);
      l.ink = P(pal.a); l.surf = P(pal.bg); l.primary = P(pal.c[1]);
      l.hover = P(0, [{t:1.4,v:0,e:"cubicOut"},{t:2.2,v:100,e:"cubicOut"},
                      {t:3.4,v:100,e:"cubicOut"},{t:4.0,v:0,e:"cubicInOut"}]);
      l.name = "Bouton";
    } else {
      l = makeTextLayer();
      l.text = String(sp.text || "Texte").slice(0, 220);
      const defSize = sp.role === "title" ? 12 : sp.role === "subtitle" ? 4 : 2.6;
      l.size = P(Math.round(doc.height * clamp(+sp.sizePct || defSize, 1, 30) / 100));
      l.color = P(pal.c[Math.min(ti, pal.c.length - 1)]);
      l.name = sp.role === "title" ? "Titre" : sp.role === "subtitle" ? "Accroche"
             : "Texte " + (ti + 1);
      ti++;
    }
    l.x = P(Math.round(pct(sp.xPct, doc.width,  doc.width / 2)));
    l.y = P(Math.round(pct(sp.yPct, doc.height, doc.height / 2)));
    l.outPoint = doc.duration;
    if (PRESETS[sp.preset]) l.anim.preset = sp.preset;
    if (LOOKS[sp.look] && sp.look !== "none"){
      l.look.type = sp.look;
      l.look.c2 = pal.a; l.look.c3 = pal.c[1];
    }
    l.anim.delay   = clamp(+sp.delay   || 0, 0, doc.duration - 0.2);
    l.anim.stagger = clamp(+sp.stagger || 0.03, 0, 0.3);
    out.push(l);
  }

  for (const k of Object.keys(ASSETS)) delete ASSETS[k];
  doc.layers = out;
  sel = out[0].id;
  time = 0;
  applyPair(pair);
  log("Scène construite : " + out.length + " calque(s), palette « " + pal.name + " ».", "ok");
  syncTopbar();
  renderLayers(); renderInspector(); renderTimeline(); draw();
}

/* ---------- modale Ambiance : palettes et accords typographiques ---------- */

function applyPalette(pal){
  pushUndo("Appliquer une palette");
  doc.bg = pal.bg;
  doc.bg2 = pal.c[2];
  let ti = 0;
  for (const l of doc.layers){
    if (l.type === "text"){
      const c = pal.c[Math.min(ti, pal.c.length - 1)];
      setOrKey(l.color, c);
      l.style.grad2 = pal.a;
      l.style.neonColor = pal.a;
      l.look.c2 = pal.a; l.look.c3 = pal.c[1];
      if (l.strokeColor) setOrKey(l.strokeColor, pal.a);
      ti++;
    } else if (l.type === "button"){
      setOrKey(l.ink, pal.a);
      setOrKey(l.surf, pal.bg);
      setOrKey(l.primary, pal.c[1]);
      l.look.c2 = pal.a; l.look.c3 = pal.c[1];
    } else {
      setOrKey(l.fill, pal.a);
      l.style.grad2 = pal.c[1];
      l.style.neonColor = pal.a;
      if (l.strokeColor) setOrKey(l.strokeColor, pal.c[0]);
    }
  }
  renderInspector(); renderTimeline(); draw();
  toast("Palette « " + pal.name + " » appliquée.");
}
/* Si la propriété est animée on écrit une clé, sinon on change la valeur fixe :
   appliquer une palette ne doit jamais effacer une animation existante. */
function setOrKey(p, v){
  if (p.keys && p.keys.length) setKey(p, time, v, "cubicOut");
  else p.v = v;
}

function applyPair(pair){
  pushUndo("Appliquer un accord typographique");
  const texts = doc.layers.filter(l => l.type === "text" || l.type === "button");
  if (!texts.length) return toast("Aucun calque texte à habiller.");
  texts.forEach((l, i) => {
    const spec = i === 0 ? pair.t : pair.s;
    l.font = spec[0];
    l.weight = spec[1];
    const size = evalProp(l.size, time);
    setOrKey(l.letterSpacing, Math.round(size * spec[2] / 1000 * 100) / 100);
  });
  ensureFonts().then(() => { renderInspector(); draw(); });
  toast("Accord « " + pair.name + " » appliqué.");
}

/* Les polices Google arrivent en asynchrone. Sans cette attente, la première
   image après un changement de police se dessine avec le repli — et à l'export
   c'est toute la vidéo qui part avec la mauvaise fonte, sans aucune erreur. */
async function ensureFonts(){
  if (!document.fonts || !document.fonts.load) return;
  const want = new Set();
  for (const l of doc.layers){
    if (l.type !== "text" && l.type !== "button") continue;
    want.add((l.weight || 400) + " 64px " + JSON.stringify(l.font));
  }
  const jobs = [...want].map(spec =>
    document.fonts.load(spec).catch(e => console.warn("Police indisponible :", spec, e)));
  await Promise.all(jobs);
  try { await document.fonts.ready; } catch(e){}
}

/* =========================================================================
   MODÈLES DE COMPOSITION
   Un modèle est une fonction qui rend un document complet, dimensionné à
   partir de la résolution courante. Rien n'est figé en pixels absolus : la
   même recette donne un résultat juste en 1080p comme en 4K vertical.
   ========================================================================= */
function T(doc_, pal, pair){
  // raccourcis proportionnels
  return { W: doc_.width, H: doc_.height,
           u: v => Math.round(doc_.height * v),
           pal, pair };
}

      disc.blend = "multiply";
      disc.anim = { preset:"scaleUp", unit:"char", dur:0.7, stagger:0, delay:0.15,
                    ease:"backOut", amount:100, outPreset:"none", outDur:0.6, outEase:"cubicInOut" };
      return [core, ring, disc];
    }
  },
  {
    name: "Page vierge",
    desc: "Composition vide, fond seul. Pour repartir de zéro.",
    ratio: "any",
    build(){ return []; }
  }
];

function applyTemplate(tpl, palIdx, pairIdx){
  pushUndo("Appliquer un modèle");
  const pal  = PALETTES[palIdx] || PALETTES[0];
  const pair = FONT_PAIRS[pairIdx] || FONT_PAIRS[0];

  doc.bg = pal.bg;
  doc.bg2 = pal.c[2];
  doc.fx = Object.assign({}, FX_DEFAULT, tpl.fx || {});

  for (const k of Object.keys(ASSETS)) delete ASSETS[k];
  doc.layers = tpl.build(doc, pal, pair) || [];
  doc.layers.forEach(l => { l.outPoint = doc.duration; });
  sel = doc.layers.length ? doc.layers[0].id : null;
  time = 0;

  applyPair(pair);
  syncTopbar();
  renderLayers(); renderInspector(); renderTimeline(); draw();
  toast("Modèle « " + tpl.name + " » appliqué.");
}

  $("#modalCard").innerHTML = `

    <p class="sub">Chaque image est rendue puis encodée hors temps réel : la durée
       et la cadence du fichier sont exactes, quelle que soit la charge machine.</p>
    <div class="body">
      <div class="field wide"><label>Conteneur</label>
        <select id="expFmt">
          <option value="mp4">MP4 · H.264 — lecture universelle</option>
          <option value="webm">WebM · VP9 — fichier plus léger</option>
        </select></div>
      <div class="field wide" style="margin-top:8px"><label>Qualité</label>
        <select id="expQ">
          <option value="0.55">Brouillon — encodage rapide</option>
          <option value="1" selected>Standard</option>

        </select></div>
      <p class="hint">${doc.width} × ${doc.height} · ${doc.fps} ips ·
         ${doc.duration}s · ${Math.round(doc.duration*doc.fps)} images</p>
      ${hasWC ? "" : `<div class="warn">Ce navigateur n'expose pas WebCodecs.
         L'export basculera en enregistrement temps réel : sortie WebM uniquement,
         et des images peuvent être perdues. Chrome ou Edge donnent un résultat exact.</div>`}
      <div class="prog" id="expBar"><i></i></div>
      <p class="hint" id="expStat">Prêt.</p>
      <div id="log"></div>
    </div>
    <div class="foot">
      <button class="btn" id="expClose">Fermer</button>

/* =========================================================================
   ÉVÉNEMENTS
   ========================================================================= */

function bindGlobal(){
  $$("[data-add]").forEach(b => b.addEventListener("click", () => {
    pushUndo("Ajouter un calque");
    const kind = b.dataset.add;
    const l = kind === "text" ? makeTextLayer()
            : kind === "button" ? makeButtonLayer() : makeShapeLayer();
    l.name = ({ text:"Texte ", shape:"Forme ", button:"Bouton " }[kind]) + (doc.layers.length + 1);
    doc.layers.unshift(l);
    sel = l.id;
    renderLayers(); renderInspector(); renderTimeline(); draw();
  }));

  $("#layerList").addEventListener("click", e => {
    const eye = e.target.closest("[data-eye]");
    if (eye){
      const l = getLayer(eye.dataset.eye);
      l.visible = !l.visible;
      renderLayers(); draw();
      return;
    }
    const row = e.target.closest(".lrow");
    if (row){
      sel = row.dataset.id;
      renderLayers(); renderInspector(); renderTimeline();
    }
  });

  /* L'index 0 est le premier plan : monter dans la liste, c'est se rapprocher
     du spectateur. Le rendu parcourt le tableau à l'envers, donc l'ordre visuel
     suit l'ordre affiché sans conversion. */
  function moveLayer(delta){
    const i = doc.layers.findIndex(l => l.id === sel);
    if (i < 0) return toast("Sélectionne d'abord un calque.");
    pushUndo("Réordonner les calques");
    let j;
    if (delta === "top") j = 0;
    else if (delta === "bottom") j = doc.layers.length - 1;
    else j = clamp(i + delta, 0, doc.layers.length - 1);
    if (j === i) return;
    const [l] = doc.layers.splice(i, 1);
    doc.layers.splice(j, 0, l);
    renderLayers(); renderTimeline(); draw();
  }
  $("#btnUp").onclick   = () => moveLayer(-1);
  $("#btnDown").onclick = () => moveLayer(1);
  $("#btnTop").onclick  = () => moveLayer("top");
  $("#btnBot").onclick  = () => moveLayer("bottom");

  /* Réordonnancement par glisser-déposer. L'indicateur se pose au-dessus ou
     en dessous de la ligne survolée selon la moitié où se trouve le curseur. */
  let dragId = null;
  const list = $("#layerList");
  list.addEventListener("dragstart", e => {
    const row = e.target.closest(".lrow");
    if (!row) return;
    dragId = row.dataset.id;
    row.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", dragId); } catch(err){}
  });
  list.addEventListener("dragend", () => {
    dragId = null;
    $$(".lrow").forEach(r => r.classList.remove("dragging","over-top","over-bot"));
  });
  list.addEventListener("dragover", e => {
    if (!dragId) return;
    e.preventDefault();
    const row = e.target.closest(".lrow");
    $$(".lrow").forEach(r => r.classList.remove("over-top","over-bot"));
    if (!row || row.dataset.id === dragId) return;
    const r = row.getBoundingClientRect();
    row.classList.add(e.clientY < r.top + r.height / 2 ? "over-top" : "over-bot");
  });
  list.addEventListener("drop", e => {
    if (!dragId) return;
    e.preventDefault();
    const row = e.target.closest(".lrow");
    $$(".lrow").forEach(r => r.classList.remove("over-top","over-bot"));
    if (!row || row.dataset.id === dragId) return;
    const r = row.getBoundingClientRect();
    const before = e.clientY < r.top + r.height / 2;
    const from = doc.layers.findIndex(l => l.id === dragId);
    const [moved] = doc.layers.splice(from, 1);
    let to = doc.layers.findIndex(l => l.id === row.dataset.id);
    if (!before) to += 1;
    pushUndo("Réordonner les calques");
    doc.layers.splice(to, 0, moved);
    dragId = null;
    renderLayers(); renderTimeline(); draw();
  });

  $("#btnDel").onclick = () => {
    if (!sel) return toast("Sélectionne d'abord un calque.");
    pushUndo("Supprimer le calque");
    doc.layers = doc.layers.filter(l => l.id !== sel);
    sel = doc.layers.length ? doc.layers[0].id : null;
    renderLayers(); renderInspector(); renderTimeline(); draw();
  };
  $("#btnDup").onclick = () => {
    const l = selLayer();
    if (!l) return toast("Sélectionne d'abord un calque.");
    pushUndo("Dupliquer le calque");
    const c = JSON.parse(JSON.stringify(l));
    c.id = uid();
    if (l.type === "image" && l.src) SRC_STORE[c.id] = l.src; c.name = l.name + " copie";
    doc.layers.unshift(c); sel = c.id;
    renderLayers(); renderInspector(); renderTimeline(); draw();
  };

  $$(".itab").forEach(b => b.addEventListener("click", () => {
    inspTab = b.dataset.itab;
    renderInspector();
  }));

  $("#btnImg").onclick = () => $("#imgIn").click();
  $("#imgIn").addEventListener("change", async e => {
    await importImages([...e.target.files]);
    e.target.value = "";
  });
  const vp = $("#viewport");
  vp.addEventListener("dragover", e => { e.preventDefault(); vp.style.outline = "1px solid var(--amber)"; });
  vp.addEventListener("dragleave", () => { vp.style.outline = "none"; });
  vp.addEventListener("drop", async e => {
    e.preventDefault(); vp.style.outline = "none";
    await importImages([...e.dataTransfer.files]);
  });

  $("#btnUndo").onclick = undo;
  $("#btnRedo").onclick = redoAction;

  $("#zIn").onclick  = () => setZoom(clamp(currentScale() * 1.25, 0.05, 8));
  $("#zOut").onclick = () => setZoom(clamp(currentScale() / 1.25, 0.05, 8));
  $("#zFit").onclick = () => setZoom(null);
  // Ctrl + molette : zoom, comme partout ailleurs.
  $("#viewport").addEventListener("wheel", e => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    setZoom(clamp(currentScale() * (e.deltaY < 0 ? 1.12 : 1/1.12), 0.05, 8));
  }, { passive: false });

  $("#btnPlay").onclick = () => togglePlay();
  $("#btnStart").onclick = () => { togglePlay(false); setTime(0, true); };
  $("#btnExport").onclick = openExport;
  $("#btnMood").onclick = openMood;
  $("#btnTpl").onclick = openTemplates;
  $("#btnHtml").onclick = openHtmlExport;
  $("#btnAI").onclick = openAI;

  /* scrub sur la règle et sur les pistes */
  let scrubbing = false;
  function scrubFrom(clientX){
    const inner = $("#tlinner");
    const r = inner.getBoundingClientRect();
    const x = clientX - r.left - 158;
    setTime((x / tlWidth()) * doc.duration);
  }
  $("#tlscroll").addEventListener("mousedown", e => {
    if (e.target.closest(".kfd")) return;
    if (!e.target.closest(".tltrack") && !e.target.closest("#ruler")) return;
    togglePlay(false);
    scrubbing = true; scrubFrom(e.clientX);
    e.preventDefault();
  });
  window.addEventListener("mousemove", e => { if (scrubbing) scrubFrom(e.clientX); });
  window.addEventListener("mouseup", () => {
    if (scrubbing){ scrubbing = false; renderInspector(); }
  });

  $("#tlIn").onclick  = () => { tlZoom = clamp(tlZoom * 1.5, 0.25, 12); renderTimeline(); };
  $("#tlOut").onclick = () => { tlZoom = clamp(tlZoom / 1.5, 0.25, 12); renderTimeline(); };
  $("#tlExpand").onclick = () => {
    const anyOpen = doc.layers.some(l => tlOpen[l.id]);
    doc.layers.forEach(l => { tlOpen[l.id] = !anyOpen; });
    renderTimeline();
  };
  $("#tlscroll").addEventListener("click", e => {
    const tw = e.target.closest("[data-twirl]");
    if (!tw || tw.classList.contains("empty")) return;
    e.stopPropagation();
    const id = tw.dataset.twirl;
    tlOpen[id] = !tlOpen[id];
    renderTimeline();
  }, true);

  /* clic sur une clé → s'y placer ; alt-clic → la supprimer */
  $("#tlscroll").addEventListener("click", e => {
    const d = e.target.closest("[data-kfd]");
    if (!d) return;
    const [lid, key, t] = d.dataset.kfd.split("|");
    if (e.altKey){
      pushUndo("Supprimer une clé");
      removeKey(getLayer(lid)[key], parseFloat(t));
      renderTimeline(); renderInspector(); draw();
      toast("Clé supprimée.");
    } else {
      sel = lid;
      setTime(parseFloat(t), true);
      renderLayers(); renderTimeline();
    }
  });

  /* raccourcis */
  window.addEventListener("keydown", e => {
    // L'annulation doit fonctionner même depuis un champ de saisie.
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z"){
      e.preventDefault();
      e.shiftKey ? redoAction() : undo();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y"){
      e.preventDefault(); redoAction(); return;
    }
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (typing) return;
    if (e.code === "Space"){ e.preventDefault(); togglePlay(); }
    else if (e.key === "ArrowRight"){ e.preventDefault(); setTime(time + 1/doc.fps, true); }
    else if (e.key === "ArrowLeft"){ e.preventDefault(); setTime(time - 1/doc.fps, true); }
    else if ((e.key === "ArrowUp" || e.key === "ArrowDown") && sel){
      e.preventDefault();
      const i = doc.layers.findIndex(l => l.id === sel);
      const j = clamp(i + (e.key === "ArrowUp" ? -1 : 1), 0, doc.layers.length - 1);
      if (j !== i){
        const [l] = doc.layers.splice(i, 1);
        doc.layers.splice(j, 0, l);
        renderLayers(); renderTimeline(); draw();
      }
    }
    else if (e.key === "Home"){ setTime(0, true); }
    else if (e.key === "End"){ setTime(doc.duration, true); }
  });

  /* enregistrer / ouvrir */
  $("#btnSave").onclick = () => {
    download(new Blob([JSON.stringify(doc, null, 1)], { type: "application/json" }),
             "motionsmith-projet.json");
    toast("Projet enregistré.");
  };
  $("#btnLoad").onclick = () => $("#fileIn").click();
  $("#fileIn").addEventListener("change", async e => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!d.layers) throw new Error("format inattendu");
      doc = d; sel = doc.layers.length ? doc.layers[0].id : null; time = 0;
      migrate(doc);
      for (const k of Object.keys(ASSETS)) delete ASSETS[k];
      await ensureAssets();
      syncTopbar(); resizeCanvases();
      renderLayers(); renderInspector(); renderTimeline(); draw();
      toast("Projet ouvert.");
    } catch(err){
      toast("Fichier illisible : " + err.message, 3200);
    }
    e.target.value = "";
  });

  window.addEventListener("resize", () => { resizeCanvases(); draw(); });
  window.addEventListener("unhandledrejection", ev => {
    console.error("Promesse rejetée :", ev.reason);
    logLine("Promesse rejetée : " + (ev.reason && ev.reason.message || ev.reason), "err");
  });
}

/* Les projets enregistrés en v1 n'ont pas de champ style : on le complète
   plutôt que de laisser le rendu échouer sur une propriété absente. */
function migrate(d){
  const def = { mode:"solid", grad2:"#f0a830", gradAngle:90,
                neon:0, neonColor:"#5B8DEF", glass:0, glassBlur:14, glassTint:0.07,
                glassBorder:1, glassRadius:18, glassPad:0.22, rgbSplit:0, dash:0 };
  d.fx = Object.assign({}, FX_DEFAULT, d.fx || {});
  if (d.bg2 === undefined) d.bg2 = d.bg;
  if (d.bgGrad === undefined) d.bgGrad = false;
  if (d.bgAngle === undefined) d.bgAngle = 120;
  if (d.link === undefined) d.link = "";
  if (d.reflow === undefined) d.reflow = true;
  for (const l of d.layers || []){
    l.style = Object.assign({}, def, l.style || {});
    l.look  = Object.assign({}, LOOK_DEFAULT, l.look || {});
    if (!l.blend) l.blend = "source-over";
    if (l.type === "text")
      l.path = Object.assign({ type:"none", radius:260, amp:30, freq:1, flip:false }, l.path || {});
    l.repeat = Object.assign({ count:1, dx:0, dy:0, rot:0, scale:1, fade:1, delay:0 },
                             l.repeat || {});
    if (!l.type) l.type = "shape";
    if (!l.anim) l.anim = { preset:"none", unit:"char", dur:0.6, stagger:0, delay:0,
                            ease:"cubicOut", amount:100, outPreset:"none",
                            outDur:0.6, outEase:"cubicInOut" };
  }
}

function syncTopbar(){
  $("#tcTot").textContent = timecode(doc.duration);
}

/* ---------- scène de départ ---------- */
function seedScene(){
  const bar = makeShapeLayer();
  bar.name = "Filet"; bar.shape = "rect";
  bar.w = P(Math.round(doc.width * 0.30)); bar.h = P(6);
  bar.corner = P(3);
  bar.x = P(doc.width/2); bar.y = P(doc.height/2 + doc.height*0.115);
  bar.fill = P("#f0a830");
  bar.anim = { preset:"flipY", unit:"char", dur:0.7, stagger:0, delay:0.55,
               ease:"expoOut", amount:100, outPreset:"none", outDur:0.6, outEase:"cubicInOut" };

  const sub = makeTextLayer();
  sub.name = "Accroche"; sub.text = "studio de motion design";
  sub.font = "Helvetica Neue"; sub.weight = 500;
  sub.size = P(Math.round(doc.height * 0.036));
  sub.letterSpacing = P(Math.round(doc.height * 0.011));
  sub.y = P(doc.height/2 + doc.height*0.185);
  sub.color = P("#8A94A6");
  sub.anim = { preset:"fade", unit:"char", dur:0.5, stagger:0.018, delay:0.85,
               ease:"cubicOut", amount:100, outPreset:"none", outDur:0.6, outEase:"cubicInOut" };

  const title = makeTextLayer();
  title.name = "Titre"; title.text = "MOTIONSMITH";
  title.font = "Impact";
  title.size = P(Math.round(doc.height * 0.135));
  title.letterSpacing = P(Math.round(doc.height * 0.004));
  title.y = P(doc.height/2 - doc.height*0.01);
  title.anim = { preset:"maskUp", unit:"char", dur:0.75, stagger:0.045, delay:0,
                 ease:"expoOut", amount:100, outPreset:"none", outDur:0.6, outEase:"cubicInOut" };
  title.style.mode = "gradient";
  title.style.grad2 = "#FF9F5A";
  title.style.gradAngle = 105;
  doc.bg = "#12070A";
  bar.fill = P("#FFC978");
  sub.color = P("#FF9F5A");

  const cta = makeButtonLayer();
  cta.name = "Bouton";
  cta.label = "VOIR LA SUITE";
  cta.btnFx = "fillUp";
  cta.ink = P("#FFC978"); cta.surf = P("#12070A"); cta.primary = P("#FF9F5A");
  cta.y = P(doc.height/2 + doc.height*0.30);
  cta.hover = P(0, [{ t: 1.6, v: 0, e: "cubicOut" },
                    { t: 2.4, v: 100, e: "cubicOut" },
                    { t: 3.6, v: 100, e: "cubicOut" },
                    { t: 4.2, v: 0, e: "cubicInOut" }]);
  cta.anim.delay = 1.2;

  title.look.type = "chrome";
  title.look.speed = 0.9;

  doc.layers = [title, sub, bar, cta];
  doc.bgGrad = true;
  doc.bg2 = "#2A0F14";
  sel = title.id;
}

/* ---------- démarrage ---------- */
async function boot(){
  doc = newDoc(1920, 1080);
  seedScene();
  syncTopbar();
  initGL();
  resizeCanvases();
  bindGlobal();
  bindHandles();
  // Sans cette attente, la première image se dessine avec la police de repli.
  await ensureFonts();
  renderLayers(); renderInspector(); renderTimeline();
  refreshUndoButtons();
  setTime(0);
}
boot();
