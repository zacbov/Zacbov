/* =========================================================================
   IMAGES — le fichier est stocké en base64 dans le projet, pour que celui-ci
   reste autonome. Le décodage est asynchrone : rien ne doit être encodé avant
   que toutes les images soient prêtes, sinon la vidéo part sans elles et sans
   la moindre erreur.
   ========================================================================= */
const ASSETS = {};                       // id de calque -> HTMLImageElement prête

function loadAsset(l){
  return new Promise(resolve => {
    if (!l.src){ delete ASSETS[l.id]; return resolve(null); }
    const img = new Image();
    img.onload = () => {
      ASSETS[l.id] = img;
      // Un SVG sans dimensions intrinsèques rapporte 0 : on lui impose une base.
      l.natW = img.naturalWidth  || 512;
      l.natH = img.naturalHeight || 512;
      resolve(img);
    };
    img.onerror = e => {
      console.warn("Image illisible pour le calque", l.name, e);
      delete ASSETS[l.id];
      resolve(null);
    };
    img.src = l.src;
  });
}
async function ensureAssets(){
  const jobs = doc.layers
    .filter(l => l.type === "image" && l.src && !ASSETS[l.id])
    .map(loadAsset);
  await Promise.all(jobs);
  // decode() garantit que le premier drawImage ne dessinera pas du vide.
  await Promise.all(Object.values(ASSETS).map(img =>
    img.decode ? img.decode().catch(() => {}) : Promise.resolve()));
}

function makeImageLayer(src, natW, natH, name){
  const ratio = (natH || 1) / (natW || 1);
  const w = Math.round(doc.width * 0.42);
  return {
    id: uid(), type: "image", name: name || "Image", visible: true,
    inPoint: 0, outPoint: doc.duration,
    src: src, natW: natW || 512, natH: natH || 512,
    fit: "contain",
    x: P(doc.width / 2), y: P(doc.height / 2),
    w: P(w), h: P(Math.round(w * ratio)),
    scale: P(100), rotation: P(0), opacity: P(100),
    radius: P(0), tint: P("#ffffff"), tintAmount: P(0),
    style: { mode:"solid", grad2:"#f0a830", gradAngle:90, neon:0, neonColor:"#5B8DEF",
             glass:0, glassBlur:14, glassTint:0.07, glassBorder:1, glassRadius:18,
             glassPad:0.22, rgbSplit:0, dash:0 },
    look: Object.assign({}, LOOK_DEFAULT),
    blend: "source-over",
    repeat: { count:1, dx:0, dy:0, rot:0, scale:1, fade:1, delay:0 },
    anim: { preset:"scaleUp", unit:"char", dur:0.7, stagger:0, delay:0,
            ease:"cubicOut", amount:100, outPreset:"none", outDur:0.6, outEase:"cubicInOut" }
  };
}

function drawImageLayer(ctx, l, t){
  const img = ASSETS[l.id];
  const opacity = evalProp(l.opacity, t) / 100;
  if (opacity <= 0.001) return;
  const w   = evalProp(l.w, t);
  const h   = evalProp(l.h, t);
  const cx  = evalProp(l.x, t);
  const cy  = evalProp(l.y, t);
  const rot = evalProp(l.rotation, t) * Math.PI / 180;
  const sc  = evalProp(l.scale, t) / 100;
  const rad = evalProp(l.radius, t);
  const tintA = evalProp(l.tintAmount, t) / 100;

  const tLocal   = t - l.inPoint;
  const layerDur = Math.max(0.001, l.outPoint - l.inPoint);
  const d = unitDelta(l.anim, 0, 1, tLocal, layerDur);
  if (d.a <= 0.001) return;

  const L = l.look || (l.look = Object.assign({}, LOOK_DEFAULT));
  const K = LOOKS[L.type] || LOOKS.none;
  const blk = (K.block ? K.block(L, t) : null) || {};

  ctx.save();
  ctx.globalAlpha = opacity * clamp(d.a, 0, 1);
  ctx.translate(cx + d.dx + (blk.dx || 0), cy + d.dy + (blk.dy || 0));
  ctx.rotate(rot + (d.r + (blk.rot || 0)) * Math.PI/180);
  if (d.sk || blk.skew) ctx.transform(1, 0, (d.sk || 0) + (blk.skew || 0), 1, 0, 0);
  ctx.scale(Math.max(1e-4, sc * d.s * d.sx), Math.max(1e-4, sc * d.s * d.sy));
  if (d.b > 0.02) ctx.filter = "blur(" + d.b.toFixed(2) + "px)";

  const c = Math.min(d.clip, d.clipY);
  if (c < 0.999){
    ctx.beginPath();
    ctx.rect(-w, h/2 - h * c, w*2, h * c);
    ctx.clip();
  }
  if (rad > 0){
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(-w/2, -h/2, w, h, Math.min(rad, w/2, h/2));
    else ctx.rect(-w/2, -h/2, w, h);
    ctx.clip();
  }

  if (!img){
    // Cadre de substitution : mieux qu'un calque invisible sans explication.
    ctx.strokeStyle = "rgba(240,168,48,0.55)";
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 6]);
    ctx.strokeRect(-w/2, -h/2, w, h);
    ctx.setLineDash([]);
    ctx.restore();
    return;
  }

  if (l.fit === "cover"){
    const kr = Math.max(w / l.natW, h / l.natH);
    const dw = l.natW * kr, dh = l.natH * kr;
    ctx.save();
    ctx.beginPath(); ctx.rect(-w/2, -h/2, w, h); ctx.clip();
    ctx.drawImage(img, -dw/2, -dh/2, dw, dh);
    ctx.restore();
  } else if (l.fit === "stretch"){
    ctx.drawImage(img, -w/2, -h/2, w, h);
  } else {
    const kr = Math.min(w / l.natW, h / l.natH);
    const dw = l.natW * kr, dh = l.natH * kr;
    ctx.drawImage(img, -dw/2, -dh/2, dw, dh);
  }

  if (tintA > 0.001){
    ctx.save();
    ctx.globalCompositeOperation = "source-atop";
    ctx.globalAlpha *= tintA;
    ctx.fillStyle = evalProp(l.tint, t);
    ctx.fillRect(-w/2, -h/2, w, h);
    ctx.restore();
  }
  if (K.post) K.post(ctx, L, t, { x: -w/2, y: -h/2, w, h });
  ctx.restore();
}

/* Modes de fusion, empruntés à la logique des calques d'un logiciel de dessin.
   Canvas 2D les gère nativement via globalCompositeOperation. */
const BLEND_MODES = [
  ["source-over","Normal"], ["multiply","Produit"], ["screen","Écran"],
  ["overlay","Incrustation"], ["darken","Obscurcir"], ["lighten","Éclaircir"],
  ["color-dodge","Densité −"], ["color-burn","Densité +"],
  ["hard-light","Lumière crue"], ["soft-light","Lumière tamisée"],
  ["difference","Différence"], ["exclusion","Exclusion"],
  ["hue","Teinte"], ["saturation","Saturation"],
  ["color","Couleur"], ["luminosity","Luminosité"], ["lighter","Addition"]
];

function drawOne(ctx, l, t){
  if (l.type === "text")        drawTextLayer(ctx, l, t);
  else if (l.type === "button") drawButtonLayer(ctx, l, t);
  else if (l.type === "image")  drawImageLayer(ctx, l, t);
  else                          drawShapeLayer(ctx, l, t);
}

/* Répétition : l'équivalent du « transformer à nouveau » d'Illustrator, mais
   avec un décalage temporel par copie — chaque exemplaire rejoue l'animation
   un peu plus tard, ce qui produit une cascade. */
function drawWithRepeat(ctx, l, t){
  const R = l.repeat;
  const count = R ? Math.max(1, Math.min(60, Math.round(R.count || 1))) : 1;
  if (count <= 1){ drawOne(ctx, l, t); return; }

  const cx = evalProp(l.x, t), cy = evalProp(l.y, t);
  for (let i = 0; i < count; i++){
    const ti = t - i * (R.delay || 0);
    ctx.save();
    // rotation et échelle autour du centre du calque, pas de l'origine
    ctx.translate(cx + (R.dx || 0) * i, cy + (R.dy || 0) * i);
    if (R.rot) ctx.rotate((R.rot * i) * Math.PI / 180);
    if (R.scale && R.scale !== 1) ctx.scale(Math.pow(R.scale, i), Math.pow(R.scale, i));
    ctx.translate(-cx, -cy);
    ctx.globalAlpha = Math.pow(clamp(R.fade === undefined ? 1 : R.fade, 0, 1), i);
    drawOne(ctx, l, ti);
    ctx.restore();
  }
}

/* La fonction centrale. Reconstruit l'image complète à l'instant t. */
function render2D(t){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.filter = "none";
  ctx.globalAlpha = 1;
  if (doc.bgGrad){
    const a = (doc.bgAngle || 0) * Math.PI / 180;
    const dx = Math.cos(a) * doc.width / 2, dy = Math.sin(a) * doc.height / 2;
    const g = ctx.createLinearGradient(doc.width/2 - dx, doc.height/2 - dy,
                                       doc.width/2 + dx, doc.height/2 + dy);
    g.addColorStop(0, doc.bg);
    g.addColorStop(1, doc.bg2 || doc.bg);
    ctx.fillStyle = g;
  } else {
    ctx.fillStyle = doc.bg;
  }
  ctx.fillRect(0, 0, doc.width, doc.height);
  // index 0 = premier plan → on dessine de la fin vers le début
  for (let i = doc.layers.length - 1; i >= 0; i--){
    const l = doc.layers[i];
    if (!l.visible) continue;
    if (t < l.inPoint - 1e-6 || t > l.outPoint + 1e-6) continue;
    ctx.save();
    ctx.globalCompositeOperation = l.blend || "source-over";
    drawWithRepeat(ctx, l, t);
    ctx.globalCompositeOperation = "source-over";
    ctx.restore();
  }
}

/* ---------- étage 2 : WebGL ---------- */

const VERT = `attribute vec2 p; varying vec2 uv;
void main(){ uv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;

const F_THRESH = `precision mediump float; varying vec2 uv;
uniform sampler2D src; uniform float thr;
void main(){
  vec3 c = texture2D(src, uv).rgb;
  float l = dot(c, vec3(0.299, 0.587, 0.114));
  float k = smoothstep(thr, thr + 0.28, l);
  gl_FragColor = vec4(c * k, 1.0);
}`;

const F_BLUR = `precision mediump float; varying vec2 uv;
uniform sampler2D src; uniform vec2 dir;
void main(){
  vec3 s = texture2D(src, uv).rgb * 0.227027;
  s += (texture2D(src, uv + dir * 1.3846).rgb + texture2D(src, uv - dir * 1.3846).rgb) * 0.316216;
  s += (texture2D(src, uv + dir * 3.2307).rgb + texture2D(src, uv - dir * 3.2307).rgb) * 0.070270;
  gl_FragColor = vec4(s, 1.0);
}`;

const F_COMP = `#extension GL_OES_standard_derivatives : enable
precision mediump float; varying vec2 uv;
uniform sampler2D src, bloom;
uniform vec2  uRes;
uniform float uGlow, uChroma, uVig, uGrain, uTime;
uniform float uPixel;                       // taille de bloc en pixels
uniform float uPost;                        // nombre de niveaux, 0 = inactif
uniform float uThresh;                      // seuil, 0 = inactif
uniform float uDuo;   uniform vec3 uDuoA, uDuoB;
uniform float uDither; uniform float uDitherLv;
uniform float uHalf;  uniform float uHalfScale, uHalfAngle, uHalfMode;
uniform vec3  uPaper, uInk;

float lum(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }
float rnd(vec2 c){ return fract(sin(dot(c, vec2(12.9898, 78.233))) * 43758.5453); }

/* Bayer 8×8 sans tableau : GLSL ES 1.0 n'autorise pas l'indexation dynamique,
   on passe donc par la forme récursive compacte. */
float bayer2(vec2 a){ a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }
float bayer4(vec2 a){ return bayer2(0.5 * a) * 0.25 + bayer2(a); }
float bayer8(vec2 a){ return bayer4(0.5 * a) * 0.25 + bayer2(a); }

/* Un écran de trame : grille tournée, point dont le rayon suit la densité.
   C'est le principe de la similigravure — plus il y a d'encre, plus le point
   grossit, et l'angle propre à chaque encre évite le moiré. */
float screenDot(vec2 px, float v, float angle, float scale){
  float s = sin(angle), c = cos(angle);
  vec2 r = vec2(px.x * c - px.y * s, px.x * s + px.y * c) / max(1.0, scale);
  vec2 g = fract(r) - 0.5;
  float d = length(g) * 2.0;
  float radius = sqrt(clamp(v, 0.0, 1.0));
  float aa = fwidth(d) + 0.06;
  return smoothstep(radius + aa, radius - aa, d);
}

void main(){
  vec2 st = uv;
  if (uPixel > 1.0){
    vec2 cells = uRes / uPixel;
    st = (floor(st * cells) + 0.5) / cells;
  }

  vec2 d = st - 0.5;
  float r2 = dot(d, d);
  vec3 c;
  if (uChroma > 0.001){
    vec2 off = d * uChroma * 0.012 * (0.35 + r2);
    c = vec3(texture2D(src, st + off).r,
             texture2D(src, st).g,
             texture2D(src, st - off).b);
  } else {
    c = texture2D(src, st).rgb;
  }
  if (uGlow > 0.001) c += texture2D(bloom, st).rgb * uGlow;

  vec2 px = st * uRes;

  if (uPost > 1.5){
    float lv = uPost;
    c = floor(c * lv + 0.5) / lv;
  }
  if (uThresh > 0.001){
    float l = lum(c);
    // le tramage ordonné adoucit le seuil au lieu de le rendre binaire et dur
    float bias = uDither > 0.001 ? (bayer8(px) - 0.5) * 0.35 * uDither : 0.0;
    c = vec3(step(uThresh, l + bias));
  }
  if (uDuo > 0.001){
    float l = lum(c);
    c = mix(c, mix(uDuoA, uDuoB, l), uDuo);
  }

  if (uDither > 0.001 && uThresh <= 0.001){
    float lv = max(2.0, uDitherLv);
    float b = bayer8(px) - 0.5;
    vec3 q = floor(c * lv + b * uDither + 0.5) / lv;
    c = mix(c, q, uDither);
  }

  if (uHalf > 0.001){
    vec3 h;
    if (uHalfMode < 0.5){
      // monochrome : encre unique sur papier
      float v = 1.0 - lum(c);
      float dot1 = screenDot(px, v, uHalfAngle, uHalfScale);
      h = mix(uPaper, uInk, dot1);
    } else {
      // quadrichromie : quatre écrans aux angles classiques de l'imprimerie
      float k = 1.0 - max(max(c.r, c.g), c.b);
      float ik = 1.0 - k;
      vec3 cmy = ik < 0.001 ? vec3(0.0) : (vec3(ik) - (c - k)) / ik;
      float A = uHalfAngle;
      float dc = screenDot(px, cmy.r, A + 0.2618, uHalfScale);   // cyan 15°
      float dm = screenDot(px, cmy.g, A + 1.3090, uHalfScale);   // magenta 75°
      float dy = screenDot(px, cmy.b, A,          uHalfScale);   // jaune 0°
      float dk = screenDot(px, k,     A + 0.7854, uHalfScale);   // noir 45°
      h = uPaper;
      h *= mix(vec3(1.0), vec3(0.0, 1.0, 1.0), dc);
      h *= mix(vec3(1.0), vec3(1.0, 0.0, 1.0), dm);
      h *= mix(vec3(1.0), vec3(1.0, 1.0, 0.0), dy);
      h *= mix(vec3(1.0), vec3(0.0), dk);
    }
    c = mix(c, h, uHalf);
  }

  if (uVig > 0.001)  c *= 1.0 - uVig * smoothstep(0.12, 0.78, r2);
  if (uGrain > 0.001){
    float g = rnd(uv * 640.0 + fract(uTime) * 97.0) - 0.5;
    c += g * uGrain;
  }
  gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
}`;

function compile(gl, type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error("Shader: " + gl.getShaderInfoLog(s));
  return s;
}
function program(gl, fs){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS))
    throw new Error("Programme: " + gl.getProgramInfoLog(p));
  return p;
}
function makeFBO(gl, w, h){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fb, w, h };
}

function initGL(){
  // preserveDrawingBuffer : sinon VideoFrame lit un buffer vidé → frames noires
  gl = glc.getContext("webgl", {
    alpha: false, antialias: false, preserveDrawingBuffer: true, premultipliedAlpha: false
  });
  if (!gl){ toast("WebGL indisponible — la passe d'effets est désactivée."); return false; }

  // fwidth() sert à antialiaser les points de trame ; sans l'extension on
  // retombe sur un seuil fixe plutôt que d'échouer à compiler.
  gl.getExtension("OES_standard_derivatives");
  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

  const srcTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, srcTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);   // le canvas 2D a l'origine en haut

  GLR = {
    quad, srcTex,
    pThresh: program(gl, F_THRESH),
    pBlur:   program(gl, F_BLUR),
    pComp:   program(gl, F_COMP),
    fboA: null, fboB: null, bw: 0, bh: 0
  };
  return true;
}

function bindQuad(prog){
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, GLR.quad);
  const loc = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
}
function pass(prog, target, setup){
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
  gl.viewport(0, 0, target ? target.w : glc.width, target ? target.h : glc.height);
  bindQuad(prog);
  setup(prog);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function renderGL(t){
  if (!gl){                                   // repli : copie directe
    const c2 = glc.getContext("2d");
    if (c2) c2.drawImage(buf, 0, 0);
    return;
  }
  const fx = doc.fx;

  gl.bindTexture(gl.TEXTURE_2D, GLR.srcTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, buf);

  if (fx.glow > 0.001){
    const bw = Math.max(2, Math.floor(doc.width / 4));
    const bh = Math.max(2, Math.floor(doc.height / 4));
    if (!GLR.fboA || GLR.bw !== bw || GLR.bh !== bh){
      GLR.fboA = makeFBO(gl, bw, bh);
      GLR.fboB = makeFBO(gl, bw, bh);
      GLR.bw = bw; GLR.bh = bh;
    }
    pass(GLR.pThresh, GLR.fboA, p => {
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, GLR.srcTex);
      gl.uniform1i(gl.getUniformLocation(p, "src"), 0);
      gl.uniform1f(gl.getUniformLocation(p, "thr"), 0.55);
    });
    for (let i = 0; i < 2; i++){
      pass(GLR.pBlur, GLR.fboB, p => {
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, GLR.fboA.tex);
        gl.uniform1i(gl.getUniformLocation(p, "src"), 0);
        gl.uniform2f(gl.getUniformLocation(p, "dir"), 1 / bw, 0);
      });
      pass(GLR.pBlur, GLR.fboA, p => {
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, GLR.fboB.tex);
        gl.uniform1i(gl.getUniformLocation(p, "src"), 0);
        gl.uniform2f(gl.getUniformLocation(p, "dir"), 0, 1 / bh);
      });
    }
  }

  pass(GLR.pComp, null, p => {
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, GLR.srcTex);
    gl.uniform1i(gl.getUniformLocation(p, "src"), 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, (GLR.fboA && fx.glow > 0.001) ? GLR.fboA.tex : GLR.srcTex);
    gl.uniform1i(gl.getUniformLocation(p, "bloom"), 1);
    gl.uniform1f(gl.getUniformLocation(p, "uGlow"),   fx.glow);
    gl.uniform1f(gl.getUniformLocation(p, "uChroma"), fx.chroma);
    gl.uniform1f(gl.getUniformLocation(p, "uVig"),    fx.vignette);
    gl.uniform1f(gl.getUniformLocation(p, "uGrain"),  fx.grain);
    gl.uniform1f(gl.getUniformLocation(p, "uTime"),   t);
    gl.uniform2f(gl.getUniformLocation(p, "uRes"), doc.width, doc.height);
    gl.uniform1f(gl.getUniformLocation(p, "uPixel"),     fx.pixel || 0);
    gl.uniform1f(gl.getUniformLocation(p, "uPost"),      fx.posterize || 0);
    gl.uniform1f(gl.getUniformLocation(p, "uThresh"),    fx.threshold || 0);
    gl.uniform1f(gl.getUniformLocation(p, "uDuo"),       fx.duotone || 0);
    gl.uniform1f(gl.getUniformLocation(p, "uDither"),    fx.dither || 0);
    gl.uniform1f(gl.getUniformLocation(p, "uDitherLv"),  fx.ditherLevels || 4);
    gl.uniform1f(gl.getUniformLocation(p, "uHalf"),      fx.halftone || 0);
    gl.uniform1f(gl.getUniformLocation(p, "uHalfScale"), fx.halftoneScale || 6);
    gl.uniform1f(gl.getUniformLocation(p, "uHalfAngle"), (fx.halftoneAngle || 0) * Math.PI / 180);
    gl.uniform1f(gl.getUniformLocation(p, "uHalfMode"),  fx.halftoneMode === "cmyk" ? 1 : 0);
    const c3 = h => hexToRgb(h).map(v => v / 255);
    const pa = c3(fx.paper || "#f5f2ea"), ik = c3(fx.ink || "#101014");
    const da = c3(fx.duoA  || "#101828"), db = c3(fx.duoB || "#f0a830");
    gl.uniform3f(gl.getUniformLocation(p, "uPaper"), pa[0], pa[1], pa[2]);
    gl.uniform3f(gl.getUniformLocation(p, "uInk"),   ik[0], ik[1], ik[2]);
    gl.uniform3f(gl.getUniformLocation(p, "uDuoA"),  da[0], da[1], da[2]);
    gl.uniform3f(gl.getUniformLocation(p, "uDuoB"),  db[0], db[1], db[2]);
  });
}

/* Point d'entrée unique : preview, scrub et export passent tous par ici. */
function renderFrame(t){
  render2D(t);
  renderGL(t);
}
</script>
<script>
"use strict";
/* =========================================================================
   INTERFACE
   ========================================================================= */

const getLayer = id => doc.layers.find(l => l.id === id) || null;
const selLayer = () => getLayer(sel);

/* viewZoom : null = ajusté à la fenêtre, sinon facteur explicite. */
let viewZoom = null;

function fitScale(){
  const vp = $("#viewport");
  const pad = 36;
  return Math.min((vp.clientWidth - pad) / doc.width,
                  (vp.clientHeight - pad) / doc.height, 1);
}
function setZoom(z){
  viewZoom = z;
  resizeCanvases();
  draw();
}
function currentScale(){
  return viewZoom === null ? fitScale() : viewZoom;
}

function resizeCanvases(){
  buf.width = doc.width; buf.height = doc.height;
  glc.width = doc.width; glc.height = doc.height;
  const k = currentScale();
  $("#zFit").textContent = viewZoom === null ? "Ajuster" : Math.round(k * 100) + " %";
  $("#zFit").classList.toggle("on", viewZoom === null);
  glc.style.width  = Math.round(doc.width * k) + "px";
  glc.style.height = Math.round(doc.height * k) + "px";
  const ov = $("#overlay");
  if (ov){
    // L'overlay est rendu à la résolution d'affichage : inutile de dessiner des
    // poignées en 4K pour les réduire ensuite.
    ov.width  = Math.round(doc.width * k);
    ov.height = Math.round(doc.height * k);
  }
  $("#dims").textContent = doc.width + " × " + doc.height;
}


/* =========================================================================
   MANIPULATION DIRECTE
   La boîte est calculée dans le même repère que le rendu, sinon les poignées
   se décalent dès qu'un calque est tourné ou mis à l'échelle.
   ========================================================================= */
function layerBounds(l, t){
  const cx = evalProp(l.x, t), cy = evalProp(l.y, t);
  const sc = evalProp(l.scale, t) / 100;
  const rot = evalProp(l.rotation, t) * Math.PI / 180;
  let w = 0, h = 0;

  if (l.type === "text"){
    const size = evalProp(l.size, t);
    const TL = layoutText(ctx, l, size, evalProp(l.letterSpacing, t), evalProp(l.lineHeight, t));
    w = Math.max(...TL.lines.map(x => x.width), 1);
    h = TL.totalH + size * 1.05;
    // Sur un cercle, le texte occupe une couronne bien plus large que sa
    // longueur développée : la poignée doit l'englober, sinon on ne peut plus
    // l'attraper.
    if (l.path && l.path.type === "circle"){
      const R = Math.max(1, l.path.radius);
      w = Math.max(w, R * 2 + size);
      h = Math.max(h, R * 2 + size);
    } else if (l.path && l.path.type === "wave"){
      h += (l.path.amp || 0) * 2;
    }
  } else if (l.type === "button"){
    const size = evalProp(l.size, t);
    ctx.save();
    ctx.font = fontString(l, size);
    const ls = evalProp(l.letterSpacing, t);
    const label = String(l.label == null ? "" : l.label);
    w = ctx.measureText(label).width + ls * label.length + evalProp(l.padX, t) * 2;
    ctx.restore();
    h = size * 1.35 + evalProp(l.padY, t) * 2;
  } else {
    w = evalProp(l.w, t); h = evalProp(l.h, t);
  }
  return { cx, cy, w: w * sc, h: h * sc, rot, sc };
}

/* Passage écran -> composition, puis composition -> repère local du calque. */
function toComp(e){
  const r = $("#overlay").getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width  * doc.width,
           y: (e.clientY - r.top)  / r.height * doc.height };
}
function toLocal(pt, b){
  const dx = pt.x - b.cx, dy = pt.y - b.cy;
  const c = Math.cos(-b.rot), s2 = Math.sin(-b.rot);
  return { x: dx * c - dy * s2, y: dx * s2 + dy * c };
}

const HANDLE_R = 6;          // rayon en pixels de composition, mis à l'échelle
function handlePositions(b){
  const hw = b.w / 2, hh = b.h / 2;
  return {
    nw: { x: -hw, y: -hh }, ne: { x: hw, y: -hh },
    sw: { x: -hw, y:  hh }, se: { x: hw, y:  hh },
    rot:{ x: 0,   y: -hh - Math.max(28, b.h * 0.18) }
  };
}

function hitTest(pt){
  for (const l of doc.layers){
    if (!l.visible) continue;
    if (time < l.inPoint - 1e-6 || time > l.outPoint + 1e-6) continue;
    const b = layerBounds(l, time);
    const p = toLocal(pt, b);
    const m = Math.max(6, Math.min(b.w, b.h) * 0.04);
    if (Math.abs(p.x) <= b.w/2 + m && Math.abs(p.y) <= b.h/2 + m) return l;
  }
  return null;
}

/* Magnétisme : centres et tiers de la composition, plus les bords. */
const SNAP_TOL = () => Math.max(4, doc.width * 0.006);
function snapValue(v, targets){
  const tol = SNAP_TOL();
  let best = null, bestD = tol;
  for (const tv of targets){
    const d = Math.abs(v - tv);
    if (d < bestD){ bestD = d; best = tv; }
  }
  return best;
}
const SNAP_X = () => [0, doc.width/3, doc.width/2, doc.width*2/3, doc.width];
const SNAP_Y = () => [0, doc.height/3, doc.height/2, doc.height*2/3, doc.height];

let guides = [];             // repères affichés pendant un glissement
let drag = null;             // état du geste en cours

function setProp(l, key, v){
  const p = l[key];
  if (!p) return;
  if (p.keys && p.keys.length) setKey(p, time, v, "cubicOut");
  else p.v = v;
}

function drawOverlay(){
  const ov = $("#overlay");
  const g = ov.getContext("2d");
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0, 0, ov.width, ov.height);
  if (!showHandles) return;

  const k = ov.width / doc.width;
  g.save();
  g.scale(k, k);

  for (const gu of guides){
    g.strokeStyle = "rgba(79,209,197,0.9)";
    g.lineWidth = 1 / k;
    g.setLineDash([6 / k, 5 / k]);
    g.beginPath();
    if (gu.axis === "x"){ g.moveTo(gu.v, 0); g.lineTo(gu.v, doc.height); }
    else { g.moveTo(0, gu.v); g.lineTo(doc.width, gu.v); }
    g.stroke();
    g.setLineDash([]);
  }

  const l = selLayer();
  if (l && l.visible && time >= l.inPoint - 1e-6 && time <= l.outPoint + 1e-6){
    const b = layerBounds(l, time);
    g.save();
    g.translate(b.cx, b.cy);
    g.rotate(b.rot);
    const px = 1 / k;
    g.strokeStyle = "#F0A830";
    g.lineWidth = 1.4 * px;
    g.strokeRect(-b.w/2, -b.h/2, b.w, b.h);

    const H = handlePositions(b);
    const r = HANDLE_R * px;
    g.beginPath();
    g.moveTo(0, -b.h/2); g.lineTo(H.rot.x, H.rot.y);
    g.stroke();
    for (const key of ["nw","ne","sw","se","rot"]){
      const h = H[key];
      g.beginPath();
      if (key === "rot") g.arc(h.x, h.y, r, 0, Math.PI*2);
      else g.rect(h.x - r, h.y - r, r*2, r*2);
      g.fillStyle = "#F0A830";
      g.fill();
      g.strokeStyle = "#1A1206";
      g.lineWidth = 1.2 * px;
      g.stroke();
    }
    g.restore();
  }
  g.restore();
}

let showHandles = true, snapping = true;

function bindHandles(){
  const ov = $("#overlay");

  ov.addEventListener("pointerdown", e => {
    if (!showHandles) return;
    const pt = toComp(e);
    const l = selLayer();

    // 1. une poignée du calque sélectionné a-t-elle été saisie ?
    if (l){
      const b = layerBounds(l, time);
      const p = toLocal(pt, b);
      const H = handlePositions(b);
      const r = HANDLE_R * (doc.width / ov.getBoundingClientRect().width) * 2.4;
      for (const key of ["rot","nw","ne","sw","se"]){
        const h = H[key];
        if (Math.hypot(p.x - h.x, p.y - h.y) <= Math.max(r, 10)){
          pushUndo(key === "rot" ? "Rotation" : "Mise à l'échelle");
          drag = { mode: key === "rot" ? "rotate" : "scale", l, b, start: pt,
                   startScale: evalProp(l.scale, time),
                   startRot: evalProp(l.rotation, time),
                   startAngle: Math.atan2(pt.y - b.cy, pt.x - b.cx),
                   startDist: Math.hypot(pt.x - b.cx, pt.y - b.cy) };
          ov.setPointerCapture(e.pointerId);
          togglePlay(false);
          e.preventDefault();
          return;
        }
      }
    }

    // 2. sinon, sélection puis déplacement
    const hit = hitTest(pt);
    if (!hit){ guides = []; drawOverlay(); return; }
    if (hit.id !== sel){
      sel = hit.id;
      inspTab = "layer";
      renderLayers(); renderInspector(); renderTimeline();
    }
    const b = layerBounds(hit, time);
    pushUndo("Déplacer le calque");
    drag = { mode: "move", l: hit, b, start: pt,
             startX: evalProp(hit.x, time), startY: evalProp(hit.y, time) };
    ov.setPointerCapture(e.pointerId);
    togglePlay(false);
    e.preventDefault();
  });

  ov.addEventListener("pointermove", e => {
    if (!showHandles) return;
    const pt = toComp(e);

    if (!drag){
      // curseur indicatif
      const l = selLayer();
      let cur = hitTest(pt) ? "move" : "default";
      if (l){
        const b = layerBounds(l, time);
        const p = toLocal(pt, b);
        const H = handlePositions(b);
        const r = HANDLE_R * (doc.width / $("#overlay").getBoundingClientRect().width) * 2.4;
        for (const key of ["rot","nw","ne","sw","se"]){
          if (Math.hypot(p.x - H[key].x, p.y - H[key].y) <= Math.max(r, 10)){
            cur = key === "rot" ? "grab" : (key === "nw" || key === "se" ? "nwse-resize" : "nesw-resize");
          }
        }
      }
      $("#overlay").style.cursor = cur;
      return;
    }

    const l = drag.l;
    guides = [];

    if (drag.mode === "move"){
      let nx = drag.startX + (pt.x - drag.start.x);
      let ny = drag.startY + (pt.y - drag.start.y);
      if (snapping && !e.shiftKey){
        const sx = snapValue(nx, SNAP_X());
        const sy = snapValue(ny, SNAP_Y());
        if (sx !== null){ nx = sx; guides.push({ axis:"x", v:sx }); }
        if (sy !== null){ ny = sy; guides.push({ axis:"y", v:sy }); }
      }
      setProp(l, "x", Math.round(nx * 10) / 10);
      setProp(l, "y", Math.round(ny * 10) / 10);
    }
    else if (drag.mode === "scale"){
      const d = Math.hypot(pt.x - drag.b.cx, pt.y - drag.b.cy);
      const k = drag.startDist > 1 ? d / drag.startDist : 1;
      let v = clamp(drag.startScale * k, 1, 2000);
      if (snapping && !e.shiftKey){
        const sv = snapValue(v, [25, 50, 75, 100, 125, 150, 200, 300]);
        if (sv !== null) v = sv;
      }
      setProp(l, "scale", Math.round(v * 10) / 10);
    }
    else if (drag.mode === "rotate"){
      const a = Math.atan2(pt.y - drag.b.cy, pt.x - drag.b.cx);
      let deg = drag.startRot + (a - drag.startAngle) * 180 / Math.PI;
      if (snapping && !e.shiftKey){
        const sv = snapValue(((deg % 360) + 360) % 360,
                             [0,15,30,45,60,90,120,135,150,180,210,225,240,270,300,315,330,360]);
        if (sv !== null) deg = sv;
      }
      setProp(l, "rotation", Math.round(deg * 10) / 10);
    }
    draw();
  });

  const endDrag = e => {
    if (!drag) return;
    drag = null;
    guides = [];
    renderInspector();
    renderTimeline();
    drawOverlay();
    try { $("#overlay").releasePointerCapture(e.pointerId); } catch(err){}
  };
  ov.addEventListener("pointerup", endDrag);
  ov.addEventListener("pointercancel", endDrag);

  ov.addEventListener("dblclick", () => {

/* =========================================================================
   HISTORIQUE
   Le document étant entièrement sérialisable, un instantané JSON suffit.
   Deux précautions :
   - les images en base64 sont retirées de l'instantané et gardées à part,
     sinon quelques images de quelques Mo saturent la pile en dix actions ;
   - les gestes continus (curseur qu'on fait glisser) sont regroupés, sinon
     une seule manipulation produirait cinquante entrées.
   ========================================================================= */
const SRC_STORE = {};                 // id de calque -> dataURL
let undoStack = [], redoStack = [];
let lastUndoTag = "", lastUndoAt = 0;
const UNDO_LIMIT = 60;
const COALESCE_MS = 700;

function snapshot(){
  for (const l of doc.layers) if (l.type === "image" && l.src) SRC_STORE[l.id] = l.src;
  return JSON.stringify(doc, (k, v) => k === "src" ? "@stored" : v);
}
function restore(json){
  const d = JSON.parse(json);
  for (const l of d.layers){
    if (l.type === "image" && l.src === "@stored") l.src = SRC_STORE[l.id] || "";
  }
  doc = d;
  migrate(doc);
  if (!doc.layers.some(l => l.id === sel)) sel = doc.layers.length ? doc.layers[0].id : null;
  time = clamp(time, 0, doc.duration);
  ensureAssets().then(() => {
    syncTopbar(); resizeCanvases();
    renderLayers(); renderInspector(); renderTimeline(); draw();
  });
}

/* tag : identifiant du geste. Deux appels de même tag rapprochés fusionnent. */
function pushUndo(label, tag){
  const now = performance.now();
  if (tag && tag === lastUndoTag && now - lastUndoAt < COALESCE_MS){
    lastUndoAt = now;
    return;                            // même geste, on garde l'état initial
  }
  undoStack.push({ json: snapshot(), label: label || "Modification" });
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  redoStack.length = 0;
  lastUndoTag = tag || "";
  lastUndoAt = now;
  refreshUndoButtons();
}
function undo(){
  if (!undoStack.length) return toast("Rien à annuler.");
  const entry = undoStack.pop();
  redoStack.push({ json: snapshot(), label: entry.label });
  lastUndoTag = "";
  restore(entry.json);
  refreshUndoButtons();
  toast("Annulé : " + entry.label);
}
function redoAction(){
  if (!redoStack.length) return toast("Rien à rétablir.");
  const entry = redoStack.pop();
  undoStack.push({ json: snapshot(), label: entry.label });
  lastUndoTag = "";
  restore(entry.json);
  refreshUndoButtons();
  toast("Rétabli : " + entry.label);
}
function refreshUndoButtons(){
  const u = $("#btnUndo"), r = $("#btnRedo");
  if (!u || !r) return;
  u.disabled = !undoStack.length;
  r.disabled = !redoStack.length;
  u.title = undoStack.length
    ? "Annuler : " + undoStack[undoStack.length-1].label + " (Ctrl+Z)" : "Rien à annuler";
  r.title = redoStack.length
    ? "Rétablir : " + redoStack[redoStack.length-1].label + " (Ctrl+Maj+Z)" : "Rien à rétablir";
}

/* ---------- liste des calques ---------- */
function renderLayers(){
  const box = $("#layerList");
  if (!doc.layers.length){
    box.innerHTML = '<div class="empty">Aucun calque.<br>Commence par ajouter un texte.</div>';
    return;
  }
  box.innerHTML = doc.layers.map(l => `
    <div class="lrow ${l.id === sel ? "sel" : ""}" data-id="${l.id}" draggable="true">
      <span class="grip" title="Glisser pour réordonner">⋮⋮</span>
      <button class="eye ${l.visible ? "" : "off"}" data-eye="${l.id}" title="Afficher / masquer">●</button>
      <span class="nm">${escapeHtml(l.name)}</span>
      <span class="tag">${({ text:"Txt", shape:"Frm", button:"Btn", image:"Img" })[l.type] || "?"}</span>
    </div>`).join("");
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

/* ---------- inspecteur ---------- */
/* Chaque champ numérique animable porte un losange : il pose ou retire une clé
   à l'instant courant. Les presets sont, eux, des générateurs de mouvement
   séparés — les deux systèmes cohabitent sans se marcher dessus. */

function numField(l, key, label, opts = {}){
  const p = l[key];
  const animated = p.keys && p.keys.length > 0;
  const here = keyAt(p, time);
  const val = evalProp(p, time);
  const step = opts.step != null ? opts.step : 1;
  return `<div class="field">
    <label title="${label}">${label}</label>
    <input type="number" data-num="${key}" value="${round(val)}" step="${step}"
           ${opts.min != null ? 'min="'+opts.min+'"' : ""} ${opts.max != null ? 'max="'+opts.max+'"' : ""}>
    <button class="kf ${animated ? "on" : ""} ${here ? "at" : ""}" data-kf="${key}"
            title="Poser une clé à ${timecode(time)}">◆</button>
  </div>`;
}
function colorField(l, key, label){
  const p = l[key];
  const animated = p.keys && p.keys.length > 0;
  const here = keyAt(p, time);
  return `<div class="field">
    <label>${label}</label>
    <input type="color" data-col="${key}" value="${evalProp(p, time)}">
    <button class="kf ${animated ? "on" : ""} ${here ? "at" : ""}" data-kf="${key}">◆</button>
  </div>`;
}
const round = v => typeof v === "number" ? Math.round(v * 100) / 100 : v;

let inspTab = "layer";

/* Une section = un titre repliable + un corps. La pastille signale qu'il s'y
   passe quelque chose (effet actif, propriété animée) : on sait quoi déplier
   sans tout ouvrir. */
const SEC_STATE = (() => {
  try { return JSON.parse(localStorage.getItem("ms_sections") || "{}"); }
  catch(e){ return {}; }
})();
function secOpen(id, def){
  return SEC_STATE[id] === undefined ? (def !== false) : !!SEC_STATE[id];
}
function section(id, title, body, opts){
  opts = opts || {};
  const open = secOpen(id, opts.open);
  return `<div class="sec ${open ? "open" : ""}" data-sec="${id}">
    <button class="sechead" data-sectoggle="${id}">
      <span class="tw">▼</span><h3>${title}</h3>
      <span class="dot ${opts.active ? "on" : ""}" title="Contient des réglages actifs"></span>
    </button>
    <div class="secbody">${body}</div>
  </div>`;
}
function bindSections(){
  $$("[data-sectoggle]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.sectoggle;
    const el = b.closest(".sec");
    const open = !el.classList.contains("open");
    el.classList.toggle("open", open);
    SEC_STATE[id] = open;
    try { localStorage.setItem("ms_sections", JSON.stringify(SEC_STATE)); } catch(e){}
  }));
}

function bindComp(){
  const on = (id, ev, fn) => { const e = $(id); if (e) e.addEventListener(ev, fn); };
  on("#cReflow","change", e => { doc.reflow = e.target.checked; });
  on("#cDistrib","click", distributeVertically);
  on("#cRefit","click", () => {
    const nb = refitLayers();
    renderInspector(); draw();
    toast(nb ? nb + " texte(s) réduit(s)." : "Tous les textes tenaient déjà dans le cadre.");
  });
  on("#cRes","change", e => {
    const [w,h] = e.target.value.split("x").map(Number);
    setResolution(w, h, doc.reflow !== false);
  });
  on("#cW","change", e => setResolution(Math.max(16,+e.target.value||doc.width), doc.height, doc.reflow !== false));
  on("#cH","change", e => setResolution(doc.width, Math.max(16,+e.target.value||doc.height), doc.reflow !== false));
  on("#cDur","input", e => {
    doc.duration = clamp(parseFloat(e.target.value) || 5, 0.5, 120);
    doc.layers.forEach(l => { if (l.outPoint > doc.duration) l.outPoint = doc.duration; });
    $("#tcTot").textContent = timecode(doc.duration);
    time = Math.min(time, doc.duration);
    $("#inspSub").textContent = doc.width + " × " + doc.height + " · " + doc.fps
      + " ips · " + doc.duration + " s";
    renderTimeline(); draw();
  });
  on("#cFps","change", e => { doc.fps = +e.target.value; renderInspector(); });
  on("#cBg","input", e => { doc.bg = e.target.value; draw(); });
  on("#cBg2","input", e => { doc.bg2 = e.target.value; draw(); });
  on("#cBgGrad","change", e => { doc.bgGrad = e.target.checked; renderInspector(); draw(); });
  on("#cBgAngle","input", e => { doc.bgAngle = +e.target.value; $("#cBgAngleN").value = e.target.value; draw(); });
  on("#cBgAngleN","input", e => { doc.bgAngle = +e.target.value; $("#cBgAngle").value = e.target.value; draw(); });
  on("#cLink","input", e => { doc.link = e.target.value.trim(); });
}

function setResolution(w, h, reflow){
  const oldW = doc.width, oldH = doc.height;
  if (w === oldW && h === oldH) return;
  pushUndo("Changer le format");
  const kx = w / oldW, ky = h / oldH;
  doc.width = w; doc.height = h;

  if (reflow === false){
    // Étirement brut : positions proportionnelles, tailles inchangées.
    for (const l of doc.layers){ scalePropBy(l.x, kx); scalePropBy(l.y, ky); }
    resizeCanvases(); renderInspector(); draw();
    return;
  }

  /* Facteur unique pour tout ce qui a une taille.
     C'est le point clé : en passant de 1920×1080 à 1080×1920, le facteur
     vertical vaut 1,78 alors que la largeur disponible tombe à 0,56. Appliquer
     ky aux corps de texte les faisait grossir pendant que le cadre rétrécissait
     — d'où un débordement systématique. On prend donc min(kx, ky), ce qui
     préserve les proportions et garantit que rien ne sort du cadre. */
  const k = Math.min(kx, ky);

  for (const l of doc.layers){
    scalePropBy(l.x, kx); scalePropBy(l.y, ky);
    ["size","letterSpacing","padX","padY","radius","corner","strokeW",
     "borderW","shadow","w","h"].forEach(key => { if (l[key]) scalePropBy(l[key], k); });
    if (l.style){
      l.style.glassRadius = (l.style.glassRadius || 0) * k;
      l.style.glassBlur   = (l.style.glassBlur   || 0) * k;
      l.style.rgbSplit    = (l.style.rgbSplit    || 0) * k;
      l.style.dash        = (l.style.dash        || 0) * k;
    }
    if (l.anim && typeof l.anim.amount === "number") l.anim.amount *= k;
  }

  refitLayers();
  resizeCanvases(); renderInspector(); renderTimeline(); draw();
}

/* Après réadaptation, un texte peut encore dépasser : une police condensée et
   une police large ne réagissent pas pareil au même facteur. On réduit alors
   le corps jusqu'à ce que le bloc rentre dans la zone sûre. */
function refitLayers(){
  const safeW = doc.width * 0.90;
  let shrunk = 0;
  for (const l of doc.layers){
    if (l.type !== "text" && l.type !== "button") continue;
    for (let pass = 0; pass < 12; pass++){
      const b = layerBounds(l, 0);
      if (b.w <= safeW || b.w <= 1) break;
      const r = Math.max(0.55, safeW / b.w);
      scalePropBy(l.size, r);
      if (l.letterSpacing) scalePropBy(l.letterSpacing, r);
      if (l.padX) scalePropBy(l.padX, r);
      if (l.padY) scalePropBy(l.padY, r);
      if (pass === 0) shrunk++;
    }
    // On ramène aussi le centre dans le cadre s'il en est sorti.
    const b = layerBounds(l, 0);
    const cx = clamp(evalProp(l.x, 0), b.w/2 * 0.2, doc.width  - b.w/2 * 0.2);
    const cy = clamp(evalProp(l.y, 0), b.h/2 * 0.2, doc.height - b.h/2 * 0.2);
    if (l.x.keys.length === 0) l.x.v = Math.round(cx);
    if (l.y.keys.length === 0) l.y.v = Math.round(cy);
  }
  return shrunk;
}

/* Répartition verticale : indispensable après un passage paysage → portrait,
   où la hauteur libérée laisse les calques tassés au milieu. On conserve
   l'ordre vertical existant et on répartit dans la zone sûre. */
function distributeVertically(){
  pushUndo("Répartir verticalement");
  const movable = doc.layers.filter(l =>
    l.visible && l.y && l.y.keys.length === 0);
  if (movable.length < 2) return toast("Il faut au moins deux calques non animés en Y.");

  const rows = movable
    .map(l => ({ l, y: evalProp(l.y, 0), h: layerBounds(l, 0).h }))
    .sort((a, b) => a.y - b.y);

  const top = doc.height * 0.12, bottom = doc.height * 0.88;
  const totalH = rows.reduce((a, r) => a + r.h, 0);
  const gap = Math.max(doc.height * 0.02, (bottom - top - totalH) / (rows.length - 1));

  let cursor = top;
  const span = totalH + gap * (rows.length - 1);
  cursor = (doc.height - span) / 2;                 // recentré verticalement
  for (const r of rows){
    r.l.y.v = Math.round(cursor + r.h / 2);
    cursor += r.h + gap;
  }
  renderInspector(); draw();
  toast(rows.length + " calques répartis.");
}

function scalePropBy(p, k){
  if (!p || typeof p !== "object") return;
  if (typeof p.v === "number") p.v *= k;
  if (p.keys) p.keys.forEach(key => { if (typeof key.v === "number") key.v *= k; });
}

/* Certains réglages font apparaître ou disparaître des sous-champs. On ne
   redessine le panneau qu'au franchissement de zéro, sinon le curseur perdrait
   le focus en plein glissement. */
const FX_TOGGLES = ["halftone","dither","duotone"];

function bindFx(){
  const commit = (key, v) => {
    const was = doc.fx[key] > 0;
    pushUndo("Régler les effets d'image", "fx:" + key);
    doc.fx[key] = v;
    if (FX_TOGGLES.includes(key) && was !== (v > 0)) renderInspector();
    else draw();
  };
  $$("[data-fx]").forEach(el => el.addEventListener("input", () => {
    const key = el.dataset.fx, v = parseFloat(el.value) || 0;
    const twin = $(`[data-fxn="${key}"]`);
    if (twin) twin.value = el.value;
    commit(key, v);
  }));
  $$("[data-fxn]").forEach(el => el.addEventListener("input", () => {
    const key = el.dataset.fxn, v = parseFloat(el.value) || 0;
    const twin = $(`[data-fx="${key}"]`);
    if (twin) twin.value = el.value;
    commit(key, v);
  }));
  $$("[data-fxc]").forEach(el => el.addEventListener("input", () => {
    pushUndo("Changer une couleur d'effet", "fxc:" + el.dataset.fxc);
    doc.fx[el.dataset.fxc] = el.value;
    draw();
  }));
  $$("[data-fxs]").forEach(el => el.addEventListener("change", () => {
    pushUndo("Changer le type d'écran");
    doc.fx[el.dataset.fxs] = el.value;
    renderInspector(); draw();
  }));
  const pre = $("#fxPreset");
  if (pre) pre.addEventListener("change", e => {
    const L = FX_LOOKS[e.target.value];
    if (!L) return;
    pushUndo("Appliquer un rendu prédéfini");
    doc.fx = Object.assign({}, FX_DEFAULT, L.fx);
    renderInspector(); draw();
    if (e.target.value !== "none") toast("Rendu « " + L.label + " » appliqué.");
  });
  const rst = $("#fxReset");
  if (rst) rst.addEventListener("click", () => {
    pushUndo("Réinitialiser les effets");
    doc.fx = Object.assign({}, FX_DEFAULT);
    renderInspector(); draw();
  });
}

function bindInspector(l){
  const on = (id, ev, fn) => { const e = $(id); if (e) e.addEventListener(ev, fn); };

  on("#fName","input", e => { l.name = e.target.value; renderLayers(); renderTimeline();
                              $("#inspName").textContent = l.name; });
  on("#fText","input", e => {
    pushUndo("Modifier le texte", "text:" + l.id);
    l.text = e.target.value; draw();
  });
  on("#fFont","change", e => { l.font = e.target.value; draw(); });
  on("#fWeight","change", e => { l.weight = +e.target.value; draw(); });
  on("#fAlign","change", e => { l.align = e.target.value; draw(); });
  on("#fShape","change", e => { l.shape = e.target.value; draw(); });
  on("#fPoints","input", e => { l.points = clamp(+e.target.value||5,3,20); draw(); });
  on("#fFillOn","change", e => { l.fillOn = e.target.checked; draw(); });
  on("#fIn","input", e => { l.inPoint = Math.max(0,+e.target.value||0); renderTimeline(); draw(); });
  on("#fOut","input", e => { l.outPoint = Math.max(l.inPoint+0.1,+e.target.value||1); renderTimeline(); draw(); });

  [["aPreset","preset"],["aEase","ease"],["aUnit","unit"],
   ["aOutPreset","outPreset"],["aOutEase","outEase"]].forEach(([id,key]) =>
    on("#"+id,"change", e => {
      pushUndo("Changer l'animation");
      l.anim[key] = e.target.value; draw();
    }));
  [["aDur","dur"],["aStagger","stagger"],["aDelay","delay"],["aOutDur","outDur"]].forEach(([id,key]) =>
    on("#"+id,"input", e => { l.anim[key] = parseFloat(e.target.value)||0; draw(); }));

  on("#aAmount","input", e => { l.anim.amount = +e.target.value; $("#aAmountN").value = e.target.value; draw(); });
  on("#aAmountN","input", e => { l.anim.amount = +e.target.value; $("#aAmount").value = e.target.value; draw(); });

  on("#pType","change", e => {
    pushUndo("Changer le chemin du texte");
    l.path.type = e.target.value; renderInspector(); draw();
  });
  [["pRadius","radius"],["pAmp","amp"],["pFreq","freq"]].forEach(([id,key]) =>
    on("#"+id,"input", e => {
      pushUndo("Régler le chemin", "path:" + l.id + ":" + key);
      l.path[key] = parseFloat(e.target.value) || 0; draw();
    }));
  on("#pFlip","change", e => { pushUndo("Inverser le chemin"); l.path.flip = e.target.checked; draw(); });

  on("#fBlend","change", e => {
    pushUndo("Changer le mode de fusion");
    l.blend = e.target.value; draw();
  });
  on("#rCount","input", e => {
    const was = l.repeat.count > 1;
    pushUndo("Régler la répétition", "rep:" + l.id + ":count");
    l.repeat.count = clamp(Math.round(+e.target.value) || 1, 1, 60);
    if (was !== (l.repeat.count > 1)) renderInspector(); else draw();
  });
  [["rDx","dx"],["rDy","dy"],["rRot","rot"],["rScale","scale"],
   ["rFade","fade"],["rDelay","delay"]].forEach(([id,key]) =>
    on("#"+id,"input", e => {
      pushUndo("Régler la répétition", "rep:" + l.id + ":" + key);
      l.repeat[key] = parseFloat(e.target.value) || 0; draw();
    }));

  on("#iFit","change", e => { l.fit = e.target.value; draw(); });
  on("#iRatio","click", () => {
    const w = evalProp(l.w, time);
    setOrKey(l.h, Math.round(w * l.natH / l.natW));
    renderInspector(); draw();
  });
  on("#iReplace","click", () => {
    const inp = document.createElement("input");
    inp.type = "file";
    inp.accept = "image/png,image/jpeg,image/webp,image/gif,image/svg+xml,image/avif,image/bmp";
    inp.onchange = async () => {
      const f = inp.files[0];
      if (!f) return;
      l.src = await fileToDataURL(f);
      const dims = await probeImage(l.src);
      l.natW = dims.w; l.natH = dims.h;
      delete ASSETS[l.id];
      await loadAsset(l);
      renderInspector(); draw();
    };
    inp.click();
  });

  on("#bLabel","input", e => { l.label = e.target.value; draw(); });
  on("#bFx","change", e => { l.btnFx = e.target.value; draw(); });

  const LK = l.look;
  on("#kType","change", e => { pushUndo("Changer l'effet en boucle"); LK.type = e.target.value; renderInspector(); draw(); });
  [["kSpeed","speed"],["kSpeedN","speed"],["kAmount","amount"],["kAmountN","amount"],
   ["kPhase","phase"],["kCell","cell"]].forEach(([id,key]) =>
    on("#"+id,"input", e => {
      LK[key] = parseFloat(e.target.value) || 0;
      const twin = $("#"+id+"N") || (id.endsWith("N") ? $("#"+id.slice(0,-1)) : null);
      if (twin) twin.value = e.target.value;
      draw();
    }));
  on("#kC2","input", e => { LK.c2 = e.target.value; draw(); });
  on("#kC3","input", e => { LK.c3 = e.target.value; draw(); });

  const st = l.style;
  const bindS = (id, key, num, rerender) => on("#"+id, id.endsWith("Color")||id==="sGrad2" ? "input" : "input", e => {
    st[key] = num ? (parseFloat(e.target.value) || 0) : e.target.value;
    const twin = $("#"+id+"N") || (id.endsWith("N") ? $("#"+id.slice(0,-1)) : null);
    if (twin) twin.value = e.target.value;
    if (rerender) renderInspector(); else draw();
  });
  on("#sMode","change", e => { st.mode = e.target.value; renderInspector(); draw(); });
  bindS("sGrad2","grad2",false);
  bindS("sGradAngle","gradAngle",true);  bindS("sGradAngleN","gradAngle",true);
  bindS("sNeonColor","neonColor",false);
  bindS("sGlassBlur","glassBlur",true);  bindS("sGlassBlurN","glassBlur",true);
  bindS("sGlassRadius","glassRadius",true);
  bindS("sGlassBorder","glassBorder",true);
  bindS("sGlassPad","glassPad",true);
  bindS("sRgb","rgbSplit",true);         bindS("sRgbN","rgbSplit",true);
  bindS("sDash","dash",true);
  // Néon et verre replient/déplient des sous-champs : on redessine l'inspecteur
  // seulement au franchissement de zéro, sinon le curseur perdrait le focus.
  const zeroCross = (id, key) => on("#"+id,"input", e => {
    const was = st[key] > 0, v = parseFloat(e.target.value) || 0;
    st[key] = v;
    const twin = $("#"+id+"N"); if (twin) twin.value = v;
    if (was !== (v > 0)) renderInspector(); else draw();
  });
  zeroCross("sNeon","neon");  zeroCross("sGlass","glass");
  on("#sNeonN","input", e => { st.neon = parseFloat(e.target.value)||0; renderInspector(); draw(); });
  on("#sGlassN","input", e => { st.glass = parseFloat(e.target.value)||0; renderInspector(); draw(); });

  $$("#inspBody [data-al]").forEach(el => el.addEventListener("click", () => {
    const b = layerBounds(l, time);
    const m = doc.height * 0.06;                 // marge de sécurité
    const map = {
      left:   ["x", b.w/2 + m],
      cx:     ["x", doc.width / 2],
      right:  ["x", doc.width - b.w/2 - m],
      top:    ["y", b.h/2 + m],
      cy:     ["y", doc.height / 2],
      bottom: ["y", doc.height - b.h/2 - m],
      third1: ["y", doc.height / 3],
      third2: ["y", doc.height * 2 / 3]
    };
    pushUndo("Aligner le calque");
    const [key, v] = map[el.dataset.al];
    setProp(l, key, Math.round(v));
    renderInspector(); renderTimeline(); draw();
  }));

  $$("#inspBody [data-num]").forEach(el => el.addEventListener("input", () => {
    const key = el.dataset.num, v = parseFloat(el.value);
    if (Number.isNaN(v)) return;
    pushUndo("Modifier " + (PROP_LABEL[key] || key), "num:" + l.id + ":" + key);
    const p = l[key];
    if (p.keys.length) setKey(p, time, v, "cubicOut");
    else p.v = v;
    renderTimeline(); draw();
  }));
  $$("#inspBody [data-col]").forEach(el => el.addEventListener("input", () => {
    const key = el.dataset.col, p = l[key];
    pushUndo("Modifier une couleur", "col:" + l.id + ":" + key);
    if (p.keys.length) setKey(p, time, el.value, "cubicOut");
    else p.v = el.value;
    renderTimeline(); draw();
  }));
  $$("#inspBody [data-kf]").forEach(el => el.addEventListener("click", () => {
    const which = el.dataset.kf;
    pushUndo("Poser ou retirer une clé");
    const keys = which === "xy" ? ["x","y"] : which === "wh" ? ["w","h"] : [which];
    const already = keys.every(k => keyAt(l[k], time));
    keys.forEach(k => {
      const p = l[k];
      if (already) removeKey(p, time);
      else setKey(p, time, evalProp(p, time), "cubicOut");
    });
    renderInspector(); renderTimeline(); draw();
  }));
}

/* ---------- timeline ---------- */
const PX_PER_SEC = 88;
let tlZoom = 1;                       // facteur d'étalement horizontal
const tlOpen = {};                    // id de calque -> sous-pistes dépliées
const tlWidth = () => Math.max(600, doc.duration * PX_PER_SEC * tlZoom);

function renderTimeline(){
  const W = tlWidth();
  let h = `<div class="tlrow head">
      <div class="tlname">Temps</div>
      <div class="tltrack"><div id="ruler" style="width:${W}px"></div></div>
    </div>`;

  for (const l of doc.layers){
    const bandX = (l.inPoint / doc.duration) * W;
    const bandW = Math.max(4, ((l.outPoint - l.inPoint) / doc.duration) * W);
    // Sous-pistes repliées par défaut : sinon un projet un peu fourni
    // transforme le montage en mur de lignes.
    const animKeys = Object.keys(l).filter(k => {
      const p = l[k];
      return p && typeof p === "object" && p.keys && p.keys.length;
    });
    const open = !!tlOpen[l.id];
    h += `<div class="tlrow ${l.id===sel?"sel":""}" data-row="${l.id}">
        <div class="tlname">
          <span class="twirl ${open?"open":""} ${animKeys.length?"":"empty"}"
                data-twirl="${l.id}">▼</span>
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis">${escapeHtml(l.name)}</span>
          ${animKeys.length ? `<span class="tlcount">${animKeys.length}</span>` : ""}
        </div>
        <div class="tltrack" data-track="${l.id}" style="width:${W}px">
          <div class="tlband" style="left:${bandX}px;width:${bandW}px"></div>
        </div>
      </div>`;
    for (const key of (open ? animKeys : [])){
      const p = l[key];
      h += `<div class="tlrow sub ${l.id===sel?"sel":""}">
          <div class="tlname">${PROP_LABEL[key] || key}</div>
          <div class="tltrack" style="width:${W}px">
            ${p.keys.map(k => `<div class="kfd" data-kfd="${l.id}|${key}|${k.t}"
              style="left:${(k.t/doc.duration)*W}px" title="${timecode(k.t)}"></div>`).join("")}
          </div>
        </div>`;
    }
  }
  h += `<div id="playhead" style="left:${158 + (time/doc.duration)*W}px"></div>`;
  $("#tlinner").innerHTML = h;
  $("#tlinner").style.width = (158 + W) + "px";

  const zl = $("#tlZoom");
  if (zl) zl.textContent = Math.round(tlZoom * 100) + " %";
  const ex = $("#tlExpand");
  if (ex) ex.textContent = doc.layers.some(l => tlOpen[l.id]) ? "Replier tout" : "Déplier tout";

  const ruler = $("#ruler");
  if (ruler){
    let r = "";
    // Le pas suit le zoom : à 400 % on veut des repères plus fins.
    const px = PX_PER_SEC * tlZoom;
    const stepSec = px > 220 ? 0.25 : px > 130 ? 0.5 : px > 60 ? 1 : px > 26 ? 2 : 5;
    for (let s = 0; s <= doc.duration + 1e-6; s += stepSec)
      r += `<div class="tick" style="left:${(s/doc.duration)*W}px"><span>${
        s.toFixed(stepSec < 1 ? (stepSec < 0.5 ? 2 : 1) : 0)}s</span></div>`;
    ruler.innerHTML = r;
  }
}
const PROP_LABEL = {
  x:"Position X", y:"Position Y", scale:"Échelle", rotation:"Rotation", opacity:"Opacité",
  size:"Corps", letterSpacing:"Interlettre", lineHeight:"Interligne", color:"Couleur",
  strokeW:"Contour", strokeColor:"Coul. contour", shadow:"Ombre", shadowColor:"Coul. ombre",
  w:"Largeur", h:"Hauteur", corner:"Arrondi", fill:"Remplissage"
};

function updatePlayhead(){
  const ph = $("#playhead");
  if (ph) ph.style.left = (158 + (time / doc.duration) * tlWidth()) + "px";
  $("#tcCur").textContent = timecode(time);
}

/* ---------- lecture ---------- */
let rafId = null, playStart = 0, playFrom = 0;

function draw(){
  renderFrame(time);
  updatePlayhead();
  drawOverlay();
}
function setTime(t, redrawInsp){
  time = clamp(t, 0, doc.duration);
  draw();
  if (redrawInsp) renderInspector();
}
function tick(){
  if (!playing) return;
  const el = (performance.now() - playStart) / 1000;
  let t = playFrom + el;
  if (t >= doc.duration){ t = 0; playFrom = 0; playStart = performance.now(); }
  time = t;
  draw();
  rafId = requestAnimationFrame(tick);
}
function togglePlay(force){
  playing = force !== undefined ? force : !playing;
  $("#btnPlay").textContent = playing ? "Pause" : "Lire";
  $("#btnPlay").classList.toggle("on", playing);
  if (playing){ playFrom = time >= doc.duration - 0.01 ? 0 : time;
                playStart = performance.now(); rafId = requestAnimationFrame(tick); }
  else if (rafId){ cancelAnimationFrame(rafId); rafId = null; renderInspector(); }
}

function logLine(msg, cls){
  const el = $("#log");
  if (!el) return;
  el.innerHTML += `<span class="${cls||""}">${escapeHtml(msg)}</span>\n`;
  el.scrollTop = el.scrollHeight;
}

const MP4_CODECS = ["avc1.640034","avc1.640033","avc1.4d0034","avc1.42E034","avc1.42001E"];

async function pickConfig(container, w, h, fps, bitrate){
  const list = container === "mp4" ? MP4_CODECS : ["vp09.00.10.08","vp8"];
  for (const codec of list){
    const cfg = { codec, width: w, height: h, framerate: fps, bitrate,
                  avc: container === "mp4" ? { format: "avc" } : undefined };
    try {
      const r = await VideoEncoder.isConfigSupported(cfg);
      if (r && r.supported){ logLine("Codec retenu : " + codec, "ok"); return r.config || cfg; }
      logLine("Codec refusé : " + codec);
    } catch(e){ logLine("Codec illisible : " + codec); }
  }
  return null;
}

async function runExport(container, quality){
  const w = doc.width, h = doc.height, fps = doc.fps;
  const total = Math.max(1, Math.round(doc.duration * fps));
  const bitrate = Math.round(w * h * fps * quality * 0.00011);
  const megapix = (w * h) / 1e6;
  const QUEUE_MAX = megapix > 6 ? 2 : megapix > 3 ? 4 : 8;
  const QUEUE_MIN = Math.max(1, QUEUE_MAX - 2);
  const bar = $("#expBar > i");
  const setP = k => { if (bar) bar.style.width = (k*100).toFixed(1) + "%"; };

  logLine("Vérification des polices…");
  await ensureFonts();
  logLine("Polices prêtes.", "ok");
  const imgCount = doc.layers.filter(l => l.type === "image" && l.src).length;
  if (imgCount){
    logLine("Décodage de " + imgCount + " image(s)…");
    await ensureAssets();
    const ready = doc.layers.filter(l => l.type === "image" && ASSETS[l.id]).length;
    logLine(ready + "/" + imgCount + " image(s) prêtes.", ready === imgCount ? "ok" : "err");
  }
  renderFrame(0);
  logLine(`Composition ${w}×${h} · ${fps} ips · ${total} images`);
  logLine("Débit visé : " + Math.round(bitrate/1000) + " kbit/s");
  logLine("File d'encodage limitée à " + QUEUE_MAX + " image(s).");
  const estMB = (bitrate / 8 * doc.duration) / 1e6;
  logLine("Taille estimée : ~" + estMB.toFixed(1) + " Mo");
  if (estMB > 400)
    logLine("Le fichier est assemblé en mémoire avant écriture : au-delà de "
          + "quelques centaines de Mo, l'onglet peut manquer de mémoire.", "err");
  if (megapix > 6 && container === "mp4")
    logLine("En 4K, l'encodage H.264 dépend de l'accélération matérielle. "
          + "En cas de refus, essaie le WebM.");

  if (typeof VideoEncoder === "undefined"){
    logLine("WebCodecs absent — bascule sur l'enregistrement temps réel.", "err");
    return recordFallback();
  }

  logLine("Chargement du multiplexeur…");
  let Muxer, Target;
  try {
    const mod = container === "mp4"
      ? await import("https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/+esm")
      : await import("https://cdn.jsdelivr.net/npm/webm-muxer@5.0.3/+esm");
    Muxer = mod.Muxer; Target = mod.ArrayBufferTarget;
    if (!Muxer) throw new Error("module incomplet");
    logLine("Multiplexeur chargé.", "ok");
  } catch(e){
    logLine("Échec du chargement (connexion requise) : " + e.message, "err");
    logLine("Bascule sur l'enregistrement temps réel.");
    return recordFallback();
  }

  const config = await pickConfig(container, w, h, fps, bitrate);
  if (!config){
    logLine("Aucun codec compatible dans ce navigateur.", "err");
    return recordFallback();
  }

  const target = new Target();
  const muxer = new Muxer({
    target,
    video: { codec: container === "mp4" ? "avc" : (config.codec.startsWith("vp09") ? "V_VP9" : "V_VP8"),
             width: w, height: h, frameRate: fps },
    fastStart: container === "mp4" ? "in-memory" : undefined,
    firstTimestampBehavior: "offset"
  });

  let encoded = 0, failed = null;
  const encoder = new VideoEncoder({
    output: (chunk, meta) => { muxer.addVideoChunk(chunk, meta); encoded++; },
    error:  e => { failed = e; logLine("Erreur d'encodage : " + e.message, "err"); }
  });
  encoder.configure(config);
  logLine("Encodeur configuré.", "ok");

  // Rendu image par image, hors temps réel. Ordre strict : dessiner puis
  // capturer dans le même tour de boucle, sinon le buffer GL est déjà vidé.
  const usPerFrame = 1e6 / fps;
  for (let i = 0; i < total; i++){
    if (failed) throw failed;
    const t = i / fps;
    renderFrame(t);
    const frame = new VideoFrame(glc, { timestamp: Math.round(i * usPerFrame),
                                        duration: Math.round(usPerFrame) });
    encoder.encode(frame, { keyFrame: i % (fps * 2) === 0 });
    frame.close();

    // Backpressure. Le seuil dépend de la résolution : une image 4K en RGBA
    // pèse 33 Mo, huit en attente feraient 260 Mo de tampon.
    if (encoder.encodeQueueSize > QUEUE_MAX){
      while (encoder.encodeQueueSize > QUEUE_MIN) await new Promise(r => setTimeout(r, 1));
    } else if (i % 6 === 0){
      await new Promise(r => setTimeout(r, 0));
    }
    setP((i + 1) / total * 0.92);
    if (i % 15 === 0 || i === total - 1)
      $("#expStat").textContent = `Image ${i+1} / ${total}`;
  }

  $("#expStat").textContent = "Finalisation…";
  await encoder.flush();
  encoder.close();
  muxer.finalize();
  logLine(`${encoded} images encodées.`, "ok");

  const blob = new Blob([target.buffer],
    { type: container === "mp4" ? "video/mp4" : "video/webm" });
  setP(1);
  download(blob, "motionsmith." + container);
  logLine("Fichier prêt : " + (blob.size/1048576).toFixed(2) + " Mo", "ok");
  $("#expStat").textContent = "Terminé — " + (blob.size/1048576).toFixed(2) + " Mo";
}

/* Repli temps réel : moins fiable (images perdues possibles), WebM seulement. */
function recordFallback(){
  return new Promise((resolve, reject) => {
    const stream = glc.captureStream(doc.fps);
    let mime = "video/webm;codecs=vp9";
    if (!MediaRecorder.isTypeSupported(mime)) mime = "video/webm";
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12e6 });
    const parts = [];
    rec.ondataavailable = e => e.data.size && parts.push(e.data);
    rec.onstop = () => {
      const blob = new Blob(parts, { type: "video/webm" });
      download(blob, "motionsmith.webm");
      logLine("Fichier prêt : " + (blob.size/1048576).toFixed(2) + " Mo", "ok");
      $("#expStat").textContent = "Terminé (mode temps réel)";
      resolve();
    };
    rec.onerror = reject;
    rec.start();
    const t0 = performance.now();
    const bar = $("#expBar > i");
    (function loop(){
      const t = (performance.now() - t0) / 1000;
      if (t >= doc.duration){ renderFrame(doc.duration); setTimeout(() => rec.stop(), 120); return; }
      renderFrame(t);
      if (bar) bar.style.width = (t/doc.duration*100).toFixed(1) + "%";
      $("#expStat").textContent = timecode(t) + " / " + timecode(doc.duration);
      requestAnimationFrame(loop);
    })();
  });
}

function download(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ---------- import d'images ---------- */
const IMG_TYPES = /^image\/(png|jpeg|jpg|webp|gif|svg\+xml|avif|bmp)$/i;

async function importImages(files){
  const imgs = files.filter(f => IMG_TYPES.test(f.type) || /\.svg$/i.test(f.name));
  const rejected = files.length - imgs.length;
  if (!imgs.length){
    toast(rejected ? "Format non pris en charge." : "Aucun fichier image.");
    return;
  }
  pushUndo("Importer des images");
  for (const f of imgs){
    try {
      const src = await fileToDataURL(f);
      const dims = await probeImage(src);
      const l = makeImageLayer(src, dims.w, dims.h, f.name.replace(/\.[^.]+$/, ""));
      // On cadre l'image dans la composition sans déformer ses proportions.
      const kr = Math.min(doc.width * 0.6 / dims.w, doc.height * 0.6 / dims.h);
      l.w = P(Math.round(dims.w * kr));
      l.h = P(Math.round(dims.h * kr));
      doc.layers.unshift(l);
      sel = l.id;
      await loadAsset(l);
    } catch(err){
      toast("Échec de l'import de " + f.name + " : " + err.message, 3400);
      console.error(err);
    }
  }
  if (rejected) toast(imgs.length + " image(s) importée(s), " + rejected + " fichier(s) ignoré(s).");
  renderLayers(); renderInspector(); renderTimeline(); draw();
}
function fileToDataURL(f){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error("lecture impossible"));
    r.readAsDataURL(f);
  });
}
/* Un SVG sans width/height explicites se décode à 0×0 : on lui donne une taille
   de repli plutôt que de laisser un calque invisible sans explication. */
function probeImage(src){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res({ w: img.naturalWidth || 512, h: img.naturalHeight || 512 });
    img.onerror = () => rej(new Error("image illisible"));
    img.src = src;
  });
}


/* =========================================================================
   EXPORT HTML AUTONOME
   Le lecteur réutilise littéralement les deux blocs de moteur de cet outil,
   lus depuis le DOM. Aucune réécriture, donc aucun risque que l'export diverge
   du rendu de la preview.
   ========================================================================= */
function engineSource(){
  // scripts 0 et 1 = modèle + rendu ; le script 2 est l'interface, inutile ici.
  const all = [...document.querySelectorAll("script")].filter(sc => !sc.src);
  if (all.length < 2) throw new Error("blocs moteur introuvables");
  return { model: all[0].textContent, render: all[1].textContent };
}
function fontLinks(){
  return [...document.querySelectorAll('link[rel="stylesheet"]')]
    .map(l => '<link rel="stylesheet" href="' + l.getAttribute("href") + '">')
    .join("\n");
}

function buildStandaloneHTML(opts){
  const { model, render } = engineSource();
  const payload = JSON.stringify(doc);
  const link = (doc.link || "").trim();
  const safeLink = /^https?:\/\//i.test(link) ? link : "";
  if (link && !safeLink)
    logLine("Lien ignoré : seuls http:// et https:// sont acceptés.", "err");

  const openTag  = safeLink
    ? '<a id="wrap" href="' + safeLink.replace(/"/g, "&quot;") +
      '" target="_blank" rel="noopener noreferrer">'
    : '<div id="wrap">';
  const closeTag = safeLink ? "</a>" : "</div>";

  const boot = `
const DOCUMENT_DATA = ${payload};
const OPTS = ${JSON.stringify(opts)};

(async function(){
  doc = DOCUMENT_DATA;
  const cv = document.getElementById("glcanvas");
  buf.width = doc.width; buf.height = doc.height;
  cv.width = doc.width;  cv.height = doc.height;
  initGL();

  // Mêmes garde-fous qu'à l'export vidéo : rien ne s'affiche avant que les
  // polices et les images soient réellement prêtes.
  try {
    if (document.fonts && document.fonts.load){
      const want = new Set();
      for (const l of doc.layers)
        if (l.type === "text" || l.type === "button")
          want.add((l.weight || 400) + " 64px " + JSON.stringify(l.font));
      await Promise.all([...want].map(f => document.fonts.load(f).catch(()=>{})));
      await document.fonts.ready;
    }
  } catch(e){ console.warn("polices", e); }

  await Promise.all(doc.layers.filter(l => l.type === "image" && l.src).map(l =>
    new Promise(res => {
      const im = new Image();
      im.onload  = () => { ASSETS[l.id] = im; res(); };
      im.onerror = () => { console.warn("image absente", l.name); res(); };
      im.src = l.src;
    })));

  document.getElementById("loading").style.display = "none";

  let t0 = null, raf = null, running = OPTS.autoplay;
  function frame(now){
    if (t0 === null) t0 = now;
    let t = (now - t0) / 1000;
    if (t >= doc.duration){
      if (OPTS.loop){ t0 = now; t = 0; }
      else { renderFrame(doc.duration); running = false; return; }
    }
    renderFrame(t);
    if (running) raf = requestAnimationFrame(frame);
  }
  renderFrame(0);
  if (OPTS.autoplay) raf = requestAnimationFrame(frame);

  if (OPTS.replayOnClick && !${safeLink ? "true" : "false"}){
    cv.style.cursor = "pointer";
    cv.addEventListener("click", () => {
      t0 = null; running = true;
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(frame);
    });
  }
  // Relance quand l'élément entre dans l'écran, utile en intégration de page.
  if (OPTS.playOnView && "IntersectionObserver" in window){
    new IntersectionObserver(es => {
      for (const e of es) if (e.isIntersecting){
        t0 = null; running = true;
        if (raf) cancelAnimationFrame(raf);
        raf = requestAnimationFrame(frame);
      }
    }, { threshold: 0.35 }).observe(cv);
  }
})();`;

  return `<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${escapeHtml(opts.title || "Animation")}</title>
${fontLinks()}
<style>
  html,body{margin:0;height:100%;background:${doc.bg};}
  #wrap{display:block;width:100%;height:100%;text-decoration:none;
        display:flex;align-items:center;justify-content:center;}
  #glcanvas{max-width:100%;max-height:100%;display:block;}
  #loading{position:fixed;inset:0;display:grid;place-items:center;
           font:12px system-ui,sans-serif;color:#8A94A6;background:${doc.bg};}
</style>
</head>
<body>
${openTag}<canvas id="glcanvas"></canvas>${closeTag}
<div id="loading">chargement…</div>
<script>${model}<\/script>
<script>${render}<\/script>
<script>${boot}<\/script>
</body>
</html>`;
}

/* =========================================================================
   CONNECTEUR IA
   Le proxy garde les clés côté serveur : rien de secret ne transite par cette
   page. En revanche sa convention de route est inconnue d'ici, donc on la
   découvre au premier usage en essayant les formes les plus répandues, puis on
   mémorise celle qui a répondu.
   ========================================================================= */
const AI_DEFAULT_BASE = "https://routeur-ia-proxy.zacharybov.workers.dev";

/* Modèles gratuits et rapides, du plus fiable au plus anecdotique pour ce
   usage précis : produire un JSON court et bien formé. */
const AI_MODELS = [
