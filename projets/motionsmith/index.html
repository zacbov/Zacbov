<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motionsmith — studio de motion design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontshare" rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@400,600,700&f[]=satoshi@400,500,700,900&f[]=switzer@400,500,700&f[]=general-sans@400,500,600&f[]=supreme@400,500,700&f[]=zodiak@400,700,900&f[]=sentient@400,500,700&f[]=cabinet-grotesk@400,700,800&display=swap">
<link id="gfonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Archivo+Black&family=Alfa+Slab+One&family=Bungee&family=Monoton&family=Righteous&family=Abril+Fatface&family=Oswald:wght@300;500;700&family=Teko:wght@400;600;700&family=Orbitron:wght@500;700;900&family=Audiowide&family=Syne:wght@600;800&family=Unbounded:wght@400;700;900&family=Space+Grotesk:wght@400;500;700&family=Chakra+Petch:wght@400;600;700&family=Rajdhani:wght@400;600;700&family=Barlow+Condensed:wght@400;600;800&family=Playfair+Display:wght@400;700;900&family=DM+Serif+Display&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700;6..96,900&family=Cormorant+Garamond:wght@300;500;700&family=Fraunces:wght@400;700;900&family=Major+Mono+Display&family=JetBrains+Mono:wght@400;700&family=Space+Mono:wght@400;700&family=IBM+Plex+Mono:wght@300;500;700&family=Inter:wght@300;400;500;700;900&family=Manrope:wght@400;600;800&family=Outfit:wght@300;500;700;900&family=Sora:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;600;800&family=Poppins:wght@300;500;700;900&family=Montserrat:wght@400;600;800;900&family=Archivo:wght@400;600;900&family=Lexend:wght@300;500;800&family=Michroma&family=Zen+Dots&family=Bungee+Shade&family=Lato:wght@300;400;700;900&family=Merriweather:wght@300;400;700;900&family=Roboto:wght@300;400;500;700;900&family=Source+Sans+3:wght@300;400;600;700&family=Raleway:wght@300;400;600;800&family=Crimson+Text:wght@400;600;700&family=Libre+Baskerville:wght@400;700&family=Nunito:wght@300;400;600;800&family=PT+Serif:wght@400;700&family=Work+Sans:wght@300;400;600;800&family=Open+Sans:wght@300;400;600;800&family=Karla:wght@300;400;600;800&family=Spectral:wght@300;400;600;800&family=Rubik:wght@300;400;600;800&family=IBM+Plex+Sans:wght@300;400;600;700&family=Newsreader:wght@300;400;600;800&family=Public+Sans:wght@300;400;600;800&display=swap">
<style>
:root{
  --bg:#0B0E13;
  --panel:#11151C;
  --surface:#171C25;
  --surface-2:#1E2530;
  --line:#252D3A;
  --line-soft:#1B2129;
  --text:#DDE3EC;
  --text-dim:#8A94A6;
  --text-faint:#5A6474;
  --amber:#F0A830;
  --amber-dim:#7A5518;
  --cyan:#4FD1C5;
  --red:#E5484D;
  --radius:5px;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--ui);
  font-size:12px;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2A323F;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#3A4453}

/* ---------- shell ---------- */
#app{display:grid;height:100vh;
  grid-template-columns:212px 1fr 268px;
  grid-template-rows:42px 1fr 232px;
  grid-template-areas:"top top top" "layers stage insp" "tl tl tl";
}
.pane{background:var(--panel);border:1px solid var(--line-soft);overflow:hidden;display:flex;flex-direction:column}

/* ---------- topbar ---------- */
#topbar{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 14px;
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:7px;padding-right:12px;border-right:1px solid var(--line)}
.brand b{font-size:13px;font-weight:650;letter-spacing:-.2px}
.brand span{font-size:9px;color:var(--text-faint);letter-spacing:1.6px;text-transform:uppercase}
/* Zones fonctionnelles : composer à gauche, agir sur le projet à droite. */
.tzone{display:flex;align-items:center;gap:5px;padding-left:12px;
  border-left:1px solid var(--line)}
.tzone:first-of-type{border-left:none;padding-left:0}
.zlab{font-size:8.5px;color:var(--text-faint);letter-spacing:1.2px;
  text-transform:uppercase;margin-right:2px}
.tgroup{display:flex;align-items:center;gap:6px}
.tgroup label{color:var(--text-faint);font-size:10px;text-transform:uppercase;letter-spacing:.7px}
.spacer{flex:1}

/* ---------- controls ---------- */
.btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:5px 10px;color:var(--text-dim);transition:.12s;white-space:nowrap}
.btn:hover{background:var(--surface-2);color:var(--text);border-color:#33404F}
.btn.on{background:var(--amber);border-color:var(--amber);color:#1A1206;font-weight:600}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#1A1206;font-weight:600}
.btn.pri:hover{background:#FFBB47;color:#1A1206}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{padding:3px 7px;font-size:11px}
select,input[type=text],input[type=number]{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:4px 7px;outline:none;width:100%}
select:focus,input:focus{border-color:var(--amber-dim)}
input[type=color]{width:100%;height:24px;padding:1px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);cursor:pointer}
input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--line);
  border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;
  border-radius:50%;background:var(--amber);cursor:pointer}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:none;border-radius:50%;
  background:var(--amber);cursor:pointer}

/* ---------- panel headers ---------- */
.phead{display:flex;align-items:center;justify-content:space-between;
  padding:8px 10px;border-bottom:1px solid var(--line);flex:none}
.phead h2{font-size:9.5px;font-weight:650;letter-spacing:1.3px;text-transform:uppercase;color:var(--text-faint)}
.pbody{flex:1;overflow-y:auto;overflow-x:hidden}

/* ---------- layers ---------- */
#layers{grid-area:layers}
/* Quatre boutons ne tiennent pas sur une ligne dans un panneau de 212 px :
   le dernier sortait du cadre. Grille 2×2. */
.addrow{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:8px;
  border-bottom:1px solid var(--line-soft)}
.addrow .btn{text-align:center;font-size:11px;padding:5px 4px;min-width:0}
.lorder{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;
  padding:7px 8px;border-top:1px solid var(--line-soft)}
.lorder .btn{text-align:center;padding:4px 2px;font-size:12px;line-height:1.1}
.lrow{display:flex;align-items:center;gap:7px;padding:7px 10px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.lrow:hover{background:var(--surface)}
.lrow.sel{background:var(--surface-2);box-shadow:inset 2px 0 0 var(--amber)}
.lrow.dragging{opacity:.4}
.lrow.over-top{box-shadow:inset 0 2px 0 var(--cyan)}
.lrow.over-bot{box-shadow:inset 0 -2px 0 var(--cyan)}
.lrow .grip{color:var(--text-faint);opacity:.45;cursor:grab;flex:none;
  font-size:10px;letter-spacing:-1px}
.lrow:hover .grip{opacity:.9}
.lrow .eye{width:14px;text-align:center;color:var(--text-faint);flex:none;font-size:11px}
.lrow .eye.off{opacity:.3}
.lrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .tag{font-size:8.5px;color:var(--text-faint);letter-spacing:.8px;text-transform:uppercase;flex:none}
.empty{padding:22px 14px;text-align:center;color:var(--text-faint);line-height:1.6}

/* ---------- stage ---------- */
#stage{grid-area:stage;background:#07090D;display:flex;flex-direction:column;
  border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}
#viewport{flex:1;display:flex;align-items:center;justify-content:center;padding:18px;
  overflow:auto;position:relative}
#stack{position:relative;line-height:0}
#overlay{position:absolute;inset:0;width:100%;height:100%;cursor:default;touch-action:none}
#glcanvas{max-width:100%;max-height:100%;box-shadow:0 0 0 1px var(--line),0 14px 44px rgba(0,0,0,.6);
  background:#000;display:block}
#stagebar{flex:none;display:flex;align-items:center;gap:12px;padding:7px 12px;
  border-top:1px solid var(--line-soft);background:var(--panel)}
.szone{display:flex;align-items:center;gap:5px}
.tc{font-family:var(--mono);font-size:11px;color:var(--text-dim);letter-spacing:.4px}
.tc b{color:var(--amber);font-weight:600}

/* ---------- inspector ---------- */
#insp{grid-area:insp}
.itab{flex:1;padding:9px 6px;font-size:9.5px;font-weight:650;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--text-faint);border-bottom:1px solid var(--line);
  transition:.12s}
.itab:hover{color:var(--text-dim)}
.itab.on{color:var(--amber);border-bottom-color:var(--amber);background:var(--surface)}
#inspSub{flex:none;padding:6px 11px;border-bottom:1px solid var(--line-soft);
  font-size:10px;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp{border-bottom:1px solid var(--line-soft)}
.grp>h3{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-faint);
  padding:9px 11px 5px;font-weight:650}
/* Sections repliables : l'état est mémorisé, on retrouve son panneau tel quel. */
.sec{border-bottom:1px solid var(--line-soft)}
.sechead{display:flex;align-items:center;gap:7px;width:100%;padding:9px 11px;
  cursor:pointer;transition:.12s;text-align:left}
.sechead:hover{background:var(--surface)}
.sechead .tw{width:8px;flex:none;color:var(--text-faint);font-size:8px;
  transition:transform .14s;transform:rotate(-90deg)}
.sec.open .sechead .tw{transform:rotate(0deg)}
.sechead h3{flex:1;font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--text-dim);font-weight:650}
.sec.open .sechead h3{color:var(--text)}
.sechead .dot{width:5px;height:5px;border-radius:50%;background:var(--amber);flex:none;
  opacity:0;transition:.12s}
.sechead .dot.on{opacity:1}
.secbody{display:none;padding-bottom:6px}
.sec.open .secbody{display:block}
.subhead{font-size:8.5px;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--text-faint);padding:8px 11px 3px;font-weight:650;
  border-top:1px solid var(--line-soft);margin-top:4px}
.subhead:first-child{border-top:none;margin-top:0}
.btnrow{display:grid;gap:4px;padding:2px 11px 6px}
.field{display:grid;grid-template-columns:64px 1fr 20px;gap:7px;align-items:center;padding:3px 11px 5px}
.field>label{color:var(--text-dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field.wide{grid-template-columns:1fr}
.field.wide>label{margin-bottom:3px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.kf{width:16px;height:16px;padding:0;display:grid;place-items:center;border-radius:3px;
  color:var(--text-faint);font-size:9px;line-height:1}
.kf:hover{background:var(--surface-2);color:var(--text-dim)}
.kf.on{color:var(--amber)}
.kf.on.at{color:#1A1206;background:var(--amber)}
.rangewrap{display:grid;grid-template-columns:1fr 44px;gap:6px;align-items:center}
.rangewrap input[type=number]{padding:3px 5px;font-family:var(--mono);font-size:10.5px}

/* ---------- timeline ---------- */
#tl{grid-area:tl;display:flex;flex-direction:column;border-top:1px solid var(--line)}
#tlbar{flex:none;display:flex;align-items:center;gap:8px;padding:6px 11px;
  border-bottom:1px solid var(--line-soft);background:var(--panel)}
#tlscroll{flex:1;overflow:auto;position:relative;background:var(--panel)}
#tlinner{position:relative;min-width:100%}
.tlrow{display:grid;grid-template-columns:158px 1fr;height:26px;border-bottom:1px solid var(--line-soft)}
.tlrow.head{height:24px;position:sticky;top:0;z-index:6;background:var(--panel);border-bottom:1px solid var(--line)}
.tlname{display:flex;align-items:center;gap:6px;padding:0 10px;border-right:1px solid var(--line);
  background:var(--panel);position:sticky;left:0;z-index:4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--text-dim)}
.tlrow.sel .tlname{color:var(--text);box-shadow:inset 2px 0 0 var(--amber)}
.tlrow.sub .tlname{padding-left:26px;font-size:10.5px;color:var(--text-faint)}
.twirl{width:12px;flex:none;color:var(--text-faint);font-size:8px;cursor:pointer;
  transition:transform .14s;transform:rotate(-90deg);display:inline-block;text-align:center}
.twirl.open{transform:rotate(0deg)}
.twirl.empty{opacity:.18;cursor:default}
.tlcount{font-size:8.5px;color:var(--text-faint);background:var(--surface-2);
  border-radius:7px;padding:1px 5px;flex:none}
.tltrack{position:relative;cursor:pointer}
.tlrow.sel .tltrack{background:rgba(240,168,48,.045)}
.tlband{position:absolute;top:5px;height:16px;border-radius:3px;
  background:linear-gradient(180deg,#2C3644,#232B37);border:1px solid #36414F}
.tlrow.sel .tlband{border-color:var(--amber-dim)}
#ruler{position:relative;height:100%;cursor:ew-resize;user-select:none}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line-soft)}
.tick span{position:absolute;top:5px;left:4px;font-family:var(--mono);font-size:9px;color:var(--text-faint)}
#playhead{position:absolute;top:0;bottom:0;width:1px;background:var(--cyan);z-index:8;pointer-events:none}
#playhead::before{content:"";position:absolute;top:0;left:-5px;width:11px;height:9px;
  background:var(--cyan);clip-path:polygon(0 0,100% 0,50% 100%)}
.kfd{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;
  background:var(--amber);transform:rotate(45deg);border-radius:1px;cursor:pointer}
.kfd:hover{background:#FFC969;transform:rotate(45deg) scale(1.25)}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(5,7,10,.82);display:none;
  align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(3px)}
#modal.show{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  width:392px;max-height:86vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.65)}
.card h3{padding:15px 18px 0;font-size:14px;font-weight:620}
.card .sub{padding:5px 18px 0;color:var(--text-dim);line-height:1.55}
.card .body{padding:14px 18px}
.card .foot{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end;
  border-top:1px solid var(--line-soft);margin-top:6px}
.prog{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-top:12px}
.prog>i{display:block;height:100%;width:0;background:var(--amber);transition:width .1s}
#log{font-family:var(--mono);font-size:10px;line-height:1.65;color:var(--text-faint);
  max-height:158px;overflow:auto;margin-top:12px;white-space:pre-wrap}
#log .ok{color:var(--cyan)}
#log .err{color:var(--red)}
.warn{background:rgba(229,72,77,.1);border:1px solid rgba(229,72,77,.3);
  border-radius:var(--radius);padding:9px 11px;color:#F3A0A3;line-height:1.55;margin-top:10px}
.hint{color:var(--text-faint);line-height:1.5;margin-top:6px;font-size:10.5px}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw{border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;
  background:var(--surface);transition:.12s;text-align:left}
.sw:hover{border-color:var(--amber);transform:translateY(-2px)}
.sw .strip{display:flex;height:34px}
.sw .strip i{flex:1}
.sw b{display:block;padding:5px 7px;font-size:10px;font-weight:500;color:var(--text-dim)}
.pairs{display:grid;gap:7px;max-height:44vh;overflow-y:auto;padding-right:4px}
.swatches{max-height:44vh;overflow-y:auto;padding-right:4px}
#pairFilter{margin-bottom:9px}
.pr{border:1px solid var(--line);border-radius:6px;padding:9px 11px;cursor:pointer;
  background:var(--surface);transition:.12s;text-align:left;display:block;width:100%}
.pr:hover{border-color:var(--amber)}
.pr .t{font-size:19px;line-height:1.1;color:var(--text)}
.pr .s{font-size:10px;color:var(--text-dim);margin-top:3px}
.pr .n{font-size:8.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--text-faint);margin-bottom:4px}
.tabs{display:flex;gap:4px;padding:0 18px}
.tab{padding:6px 11px;border-radius:5px 5px 0 0;color:var(--text-faint);border:1px solid transparent}
.tab.on{background:var(--surface);border-color:var(--line);border-bottom-color:transparent;color:var(--text)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(70px);
  background:var(--surface-2);border:1px solid var(--line);border-radius:6px;
  padding:9px 16px;z-index:200;transition:transform .22s;box-shadow:0 8px 26px rgba(0,0,0,.5)}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div class="brand"><b>Motionsmith</b><span>v1</span></div>

    <div class="tzone">
      <span class="zlab">Composer</span>
      <button class="btn" id="btnTpl">Modèles</button>
      <button class="btn" id="btnAI">IA</button>
      <button class="btn" id="btnMood">Ambiance</button>
    </div>

    <div class="spacer"></div>

    <div class="tzone">
      <button class="btn" id="btnUndo" title="Annuler (Ctrl+Z)" disabled>↶</button>
      <button class="btn" id="btnRedo" title="Rétablir (Ctrl+Maj+Z)" disabled>↷</button>
    </div>

    <div class="tzone">
      <span class="zlab">Projet</span>
      <button class="btn" id="btnSave" title="Enregistrer le projet (.json)">Enregistrer</button>
      <button class="btn" id="btnLoad">Ouvrir</button>
    </div>

    <div class="tzone">
      <span class="zlab">Exporter</span>
      <button class="btn" id="btnHtml">HTML</button>
      <button class="btn pri" id="btnExport">Vidéo</button>
    </div>
  </div>

  <div class="pane" id="layers">
    <div class="phead"><h2>Calques</h2></div>
    <div class="addrow">
      <button class="btn sm" data-add="text">+ Texte</button>
      <button class="btn sm" data-add="shape">+ Forme</button>
      <button class="btn sm" data-add="button">+ Bouton</button>
      <button class="btn sm" id="btnImg">+ Image</button>
    </div>
    <div class="pbody" id="layerList"></div>
    <div class="lorder">
      <button class="btn sm" id="btnTop"  title="Premier plan">⤒</button>
      <button class="btn sm" id="btnUp"   title="Monter d'un rang">↑</button>
      <button class="btn sm" id="btnDown" title="Descendre d'un rang">↓</button>
      <button class="btn sm" id="btnBot"  title="Arrière-plan">⤓</button>
    </div>
    <div style="flex:none;padding:0 8px 8px;display:flex;gap:5px">
      <button class="btn sm" id="btnDup" style="flex:1">Dupliquer</button>
      <button class="btn sm" id="btnDel" style="flex:1">Supprimer</button>
    </div>
  </div>

  <div id="stage">
    <div id="viewport">
      <div id="stack"><canvas id="glcanvas"></canvas><canvas id="overlay"></canvas></div>
    </div>
    <div id="stagebar">
      <div class="szone">
        <button class="btn sm on" id="btnHandles" title="Poignées de manipulation">Poignées</button>
        <button class="btn sm on" id="btnSnap" title="Magnétisme sur bords, tiers et centre">Magnétisme</button>
      </div>
      <div class="szone">
        <button class="btn sm" id="zOut" title="Dézoomer">−</button>
        <button class="btn sm" id="zFit" style="min-width:52px" title="Ajuster à la fenêtre">Ajuster</button>
        <button class="btn sm" id="zIn" title="Zoomer">+</button>
      </div>
      <span class="spacer"></span>
      <div class="szone">
        <button class="btn sm" id="btnStart" title="Retour au début (Début)">⏮</button>
        <button class="btn sm" id="btnPlay" style="width:62px">Lire</button>
        <span class="tc"><b id="tcCur">0:00.00</b> / <span id="tcTot">0:05.00</span></span>
      </div>
      <span class="spacer"></span>
      <span class="tc" id="dims">1920 × 1080</span>
    </div>
  </div>

<script>
"use strict";
/* =========================================================================
   MOTIONSMITH — moteur
   Règle d'or : render(t) est pure. Aucun état accumulé, aucun Math.random.
   La preview, le scrub et l'export appellent tous exactement la même fonction.
   ========================================================================= */

/* ---------- utilitaires ---------- */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,k) => a + (b - a) * k;
let _uid = 0;
const uid = () => "l" + (++_uid) + "_" + Date.now().toString(36).slice(-4);

function toast(msg, ms = 2100){
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), ms);
}
function timecode(t){
  t = Math.max(0, t);
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  const c = Math.floor((t % 1) * 100);
  return m + ":" + String(s).padStart(2,"0") + "." + String(c).padStart(2,"0");
}
function hexToRgb(h){
  h = (h || "#000000").replace("#","");
  if (h.length === 3) h = h.split("").map(c => c + c).join("");
  const n = parseInt(h, 16);
  return [ (n >> 16) & 255, (n >> 8) & 255, n & 255 ];
}
function rgbToHex(r,g,b){
  const f = v => clamp(Math.round(v),0,255).toString(16).padStart(2,"0");
  return "#" + f(r) + f(g) + f(b);
}
/* PRNG déterministe — remplace Math.random dans le moteur */
function hash11(n){
  n = Math.sin(n * 127.1) * 43758.5453;
  return n - Math.floor(n);
}

/* ---------- easing ---------- */
const EASINGS = {
  linear:      t => t,
  easeIn:      t => t * t,
  easeOut:     t => 1 - (1 - t) * (1 - t),
  easeInOut:   t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2,
  cubicOut:    t => 1 - Math.pow(1 - t, 3),
  cubicInOut:  t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2,
  quintOut:    t => 1 - Math.pow(1 - t, 5),
  expoOut:     t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  backOut:     t => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); },
  backInOut:   t => { const c=1.70158*1.525;
                      return t < .5 ? (Math.pow(2*t,2)*((c+1)*2*t - c))/2
                                    : (Math.pow(2*t-2,2)*((c+1)*(2*t-2) + c) + 2)/2; },
  elasticOut:  t => { if(t===0||t===1) return t; const p=(2*Math.PI)/3;
                      return Math.pow(2,-10*t)*Math.sin((t*10-.75)*p) + 1; },
  bounceOut:   t => { const n=7.5625, d=2.75;
                      if(t < 1/d) return n*t*t;
                      if(t < 2/d) return n*(t-=1.5/d)*t + .75;
                      if(t < 2.5/d) return n*(t-=2.25/d)*t + .9375;
                      return n*(t-=2.625/d)*t + .984375; }
};
const EASING_LABELS = {
  linear:"Linéaire", easeIn:"Accélération", easeOut:"Décélération", easeInOut:"Doux",
  cubicOut:"Cubique sortie", cubicInOut:"Cubique doux", quintOut:"Quintique sortie",
  expoOut:"Exponentiel", backOut:"Rebond arrière", backInOut:"Rebond doux",
  elasticOut:"Élastique", bounceOut:"Rebond"
};

/* ---------- propriétés animables ---------- */
/* Une propriété est { v: valeurFixe, keys: [{t, v, e}] }.
   Pas de clé → constante. Sinon interpolation entre clés encadrantes. */
const P = (v, keys) => ({ v, keys: keys || [] });

function evalProp(p, t){
  if (!p || typeof p !== "object" || !("v" in p)) return p;
  const k = p.keys;
  if (!k || k.length === 0) return p.v;
  if (k.length === 1) return k[0].v;
  if (t <= k[0].t) return k[0].v;
  if (t >= k[k.length-1].t) return k[k.length-1].v;
  for (let i = 0; i < k.length - 1; i++){
    const a = k[i], b = k[i+1];
    if (t >= a.t && t <= b.t){
      const span = b.t - a.t;
      const raw  = span <= 0 ? 1 : (t - a.t) / span;
      const e    = (EASINGS[a.e] || EASINGS.cubicOut)(clamp(raw,0,1));
      if (typeof a.v === "string"){          // couleur
        const A = hexToRgb(a.v), B = hexToRgb(b.v);
        return rgbToHex(lerp(A[0],B[0],e), lerp(A[1],B[1],e), lerp(A[2],B[2],e));
      }
      return lerp(a.v, b.v, e);
    }
  }
  return k[k.length-1].v;
}
function setKey(p, t, value, ease){
  if (!p.keys) p.keys = [];
  const i = p.keys.findIndex(k => Math.abs(k.t - t) < 1e-4);
  if (i >= 0) p.keys[i].v = value;
  else p.keys.push({ t, v: value, e: ease || "cubicOut" });
  p.keys.sort((a,b) => a.t - b.t);
}
function removeKey(p, t){
  if (!p.keys) return;
  p.keys = p.keys.filter(k => Math.abs(k.t - t) >= 1e-4);
}

/* =========================================================================
   LOOKS — effets en boucle, l'équivalent des @keyframes ... infinite du CSS.
   Distincts des presets : un preset joue une fois à l'entrée, un look tourne
   en permanence. Tout est piloté par t, donc identique en preview et à l'export.

   Chaque look expose des crochets optionnels, appliqués dans un ordre fixe :
     block(L,t)              transformation de l'ensemble du bloc
     stack(L,t)              copies décalées dessinées derrière (relief, ombre)
     mirror                  reflet sous le bloc
     paint(ctx,L,t,w,h,base) style de remplissage des glyphes
     stroke(L,t)             contour (filaire)
     glow(L,t)               halo coloré
     split(L,t)              écart RVB
     dual(L,t)               copies tranchées (haut / bas)
     unit(L,t,i,n)           déplacement par glyphe
     sweep(ctx,L,t,w,h)      passe additive au-dessus (balayage lumineux)
     post(ctx,L,t,box)       surimpression (lignes de balayage, barre, disque)
   ========================================================================= */

function hexToHsl(hex){
  const [r,g,b] = hexToRgb(hex).map(v => v/255);
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx-mn;
  let h = 0;
  if (d){
    if (mx === r) h = ((g-b)/d) % 6;
    else if (mx === g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
  }
  h *= 60; if (h < 0) h += 360;
  const l = (mx+mn)/2;
  const sat = d === 0 ? 0 : d / (1 - Math.abs(2*l - 1));
  return [h, sat, l];
}
function hslToHex(h, sv, l){
  h = ((h % 360) + 360) % 360;
  const c = (1 - Math.abs(2*l - 1)) * sv, x = c * (1 - Math.abs((h/60) % 2 - 1)), m = l - c/2;
  let r,g,b;
  if (h < 60)       [r,g,b] = [c,x,0];
  else if (h < 120) [r,g,b] = [x,c,0];
  else if (h < 180) [r,g,b] = [0,c,x];
  else if (h < 240) [r,g,b] = [0,x,c];
  else if (h < 300) [r,g,b] = [x,0,c];
  else              [r,g,b] = [c,0,x];
  return rgbToHex((r+m)*255, (g+m)*255, (b+m)*255);
}
function hueShift(hex, deg){
  const [h,sv,l] = hexToHsl(hex);
  return hslToHex(h + deg, sv, l);
}
function mixHex(a, b, k){
  const A = hexToRgb(a), B = hexToRgb(b);
  return rgbToHex(lerp(A[0],B[0],k), lerp(A[1],B[1],k), lerp(A[2],B[2],k));
}
/* Phase normalisée 0→1 sur une période donnée, décalage inclus. */
const cyc = (L, t, period) => {
  const per = Math.max(0.05, period / Math.max(0.05, L.speed || 1));
  const v = ((t + (L.phase || 0)) % per) / per;
  return v < 0 ? v + 1 : v;
};
/* Motif de points pour l'afficheur à LED, mis en cache par taille. */
const _dotCache = {};
function dotPattern(ctx, color, cell){
  const key = color + "|" + cell;
  if (_dotCache[key]) return ctx.createPattern(_dotCache[key], "repeat");
  const c = document.createElement("canvas");
  c.width = c.height = cell;
  const g = c.getContext("2d");
  const rad = g.createRadialGradient(cell/2, cell/2, 0, cell/2, cell/2, cell/2);
  rad.addColorStop(0,    "#ffffff");
  rad.addColorStop(0.34, color);
  rad.addColorStop(0.62, color);
  rad.addColorStop(0.68, "rgba(0,0,0,0)");
  g.fillStyle = rad;
  g.fillRect(0, 0, cell, cell);
  _dotCache[key] = c;
  return ctx.createPattern(c, "repeat");
}

const SCRAMBLE = "▓▒░#@%&$*?!/\\|<>=+ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789€£☰";

const LOOKS = {
  none: { label: "Aucun" },

  aurora: { label: "Borealis — dégradé aurore", c2: true, c3: true,
    paint(ctx, L, t, w, h, base, ox){
      ox = ox || 0;
      const k = cyc(L, t, 7);
      const deg = k * 360;
      const a = hueShift(L.c2, deg), b = hueShift(L.c3, deg);
      const g = ctx.createLinearGradient(ox - w/2, -h/2, ox + w/2, h/2);
      const off = k;
      for (let i = 0; i <= 6; i++){
        const pos = clamp((i/6 + off) % 1, 0, 1);
        g.addColorStop(pos, i % 2 ? b : a);
      }
      g.addColorStop(0, a); g.addColorStop(1, a);
      return g;
    } },

  chrome: { label: "Chromia — métal brossé",
    paint(ctx, L, t, w, h, base, ox){
      ox = ox || 0;
      const k = cyc(L, t, 2.8);
      const x = ox + lerp(1.3, -1.3, k < 0.6 ? k/0.6 : 1) * w;
      const g = ctx.createLinearGradient(x - w, -h/2, x + w, h/2);
      const dim = mixHex(base, "#000000", 0.55);
      g.addColorStop(0.00, dim);
      g.addColorStop(0.38, dim);
      g.addColorStop(0.47, base);
      g.addColorStop(0.50, "#ffffff");
      g.addColorStop(0.53, base);
      g.addColorStop(0.62, dim);
      g.addColorStop(1.00, dim);
      return g;
    } },

  foil: { label: "Gold-Foil — feuille d'or",
    paint(ctx, L, t, w, h, base, ox){
      ox = ox || 0;
      const k = Math.sin(cyc(L, t, 3.1) * Math.PI * 2) * 0.5 + 0.5;
      const x = ox + lerp(1.15, -0.35, k) * w;
      const g = ctx.createLinearGradient(x - w, -h, x + w, h);
      const stops = [[0,"#7a4a08"],[0.18,"#f2c15d"],[0.24,"#fff4b8"],[0.36,"#b87014"],
                     [0.51,"#f6d66d"],[0.68,"#8e560b"],[0.76,"#fff0a2"],[1,"#c98218"]];
      for (const [pos,c] of stops) g.addColorStop(pos, c);

    },
    stack(L, t){ return [{ dx: 0, dy: 1, color: "rgba(255,244,184,0.45)" }]; } },

  neon: { label: "Neon-Haus — tube instable", c2: true,
    glow(L, t){
      const k = cyc(L, t, 3.2);
      let on = 1;
      if ((k > 0.18 && k < 0.19) || (k > 0.21 && k < 0.22) || (k > 0.61 && k < 0.63)) on = 0;
      else if (k > 0.63 && k < 0.645) on = 0.6;
      return { color: L.c2, k: on * (L.amount || 1) };
    },
    unit(L, t){
      const k = cyc(L, t, 3.2);
      let a = 1;
      if ((k > 0.18 && k < 0.19) || (k > 0.21 && k < 0.22) || (k > 0.61 && k < 0.63)) a = 0.35;
      else if (k > 0.63 && k < 0.645) a = 0.6;
      return { alpha: a };
    } },

  glitchcore: { label: "Glitchcore — canaux décalés", c2: true, c3: true,
    dual(L, t){
      const k = cyc(L, t, 2.6);
      const step = Math.floor(k * 100);
      const out = [];
      const hot = (k > 0.12 && k < 0.20) || (k > 0.46 && k < 0.56);
      if (!hot) return out;
      const A = (L.amount || 1) * 5;
      out.push({ clip: "top",    dx: (hash11(step*1.7) - 0.5) * 2 * A,
                 dy: (hash11(step*3.1) - 0.5) * A * 0.4, color: L.c2, alpha: 0.9 });
      out.push({ clip: "bottom", dx: (hash11(step*5.3) - 0.5) * 2 * A,

  hologram: { label: "Holograph — projection", c2: true, c3: true,
    block(L, t){

    unit(L, t){ return { color: mixHex(L.c3, "#ffffff", 0.28), alpha: 0.92 }; },

    dual(L, t){

      return [{ clip: "top", dx: (hash11(step*2.3) - 0.5) * 10 * (L.amount || 1),
                dy: 0, color: L.c2, alpha: 0.7 }];

    post(ctx, L, t, b){ scanlines(ctx, b, 4, 0.30, cyc(L, t, 1.2) * 12); } },

  crt: { label: "Phosphor — écran cathodique",
    unit(L, t){
      const k = cyc(L, t, 3.4);
      let a = 1;
      if (k > 0.03 && k < 0.045) a = 0.82;
      else if (k > 0.045 && k < 0.06) a = 0.95;
      else if (k > 0.70 && k < 0.71) a = 0.9;
      return { color: "#4dff88", alpha: a, dy: (k > 0.045 && k < 0.06) ? 1 : 0 };

    glow(L, t){ return { color: "#4dff88", k: 0.6 * (L.amount || 1) }; },
    post(ctx, L, t, b){
      ctx.save();
      ctx.fillStyle = "rgba(20,60,35,0.18)";
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.restore();

  led: { label: "LED-Board — matrice de diodes", c2: true,
    paint(ctx, L, t, w, h, base, ox){
      const cell = Math.max(3, (L.cell || 4.5));
      const pat = dotPattern(ctx, L.c2, cell);
      // Le motif suit le repère courant : on le recale sur le bloc pour que la
      // trame ne se redécoupe pas lettre par lettre.
      if (pat && pat.setTransform && typeof DOMMatrix !== "undefined")
        pat.setTransform(new DOMMatrix().translate((ox || 0) % cell, 0));
      return pat;
    },
    glow(L, t){ return { color: L.c2, k: 0.5 * (L.amount || 1) }; },
    sweep(ctx, L, t, w, h, ox){
      ox = ox || 0;
      const k = cyc(L, t, 2.1);
      const x = ox + lerp(1.2, -1.2, k) * w;
      const g = ctx.createLinearGradient(x - w*0.6, 0, x + w*0.6, 0);
      g.addColorStop(0,    "rgba(255,255,255,0)");
      g.addColorStop(0.5,  "rgba(255,255,255,0.55)");
      g.addColorStop(1,    "rgba(255,255,255,0)");

    } },

  wireframe: { label: "Wireframe — contour pointillé", c3: true,
    stroke(L, t){
      return { color: L.c3, width: Math.max(0.6, 1.2 * (L.amount || 1)),
               dash: [34, 66], offset: -cyc(L, t, 3.2) * 100, fillAlpha: 0.10 };
    } },

  extrude: { label: "Deep-Type — lettres extrudées", c2: true,
    block(L, t){
      const k = Math.sin(cyc(L, t, 3) * Math.PI * 2);
      return { rot: k * 3.5, dy: -k * 3 };
    },
    stack(L, t){
      const out = [], N = 7, A = (L.amount || 1);
      for (let i = N; i >= 1; i--)
        out.push({ dx: i * A, dy: i * A,
                   color: mixHex(L.c2, "#000000", 0.2 + (i/N) * 0.7) });
      return out;
    } },

  sundial: { label: "Sundial — ombre tournante", c2: true,
    stack(L, t){
      const a = cyc(L, t, 5) * Math.PI * 2;
      const A = 4 * (L.amount || 1);
      return [3,2,1].map(i => ({
        dx: Math.cos(a) * A * i, dy: Math.sin(a) * A * i,
        color: mixHex(L.c2, "#000000", (i-1) * 0.32) }));
    } },

  eclipse: { label: "Eclipse — passage d'ombre", c2: true,
    glow(L, t){ return { color: L.c2, k: 0.7 * (L.amount || 1) }; },
    unit(L, t){
      const k = cyc(L, t, 5);
      const dim = 1 - 0.6 * Math.max(0, 1 - Math.abs(k - 0.5) / 0.22);
      return { alpha: dim };
    },
    post(ctx, L, t, b){
      const k = cyc(L, t, 5);
      const r = b.h * 0.42;
      const x = lerp(b.x - r*2, b.x + b.w + r*2, k);
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, b.y + b.h/2, r, 0, Math.PI*2);
      ctx.fillStyle = "#05040c";
      ctx.shadowColor = L.c2;
      ctx.shadowBlur = 14;
      ctx.fill();
      ctx.restore();
    } },

  negative: { label: "Negative — barre d'inversion",
    post(ctx, L, t, b){
      const k = cyc(L, t, 4.8);
      const tri = k < 0.5 ? k*2 : 2 - k*2;      // aller-retour, comme alternate
      const bw = b.w * 0.34;
      const x = lerp(b.x, b.x + b.w - bw, tri);
      ctx.save();
      ctx.globalCompositeOperation = "difference";
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(x, b.y, bw, b.h);
      ctx.restore();
    } },

  mirror: { label: "Still-Water — reflet", mirror: true,
    block(L, t){ return { dy: -Math.sin(cyc(L, t, 3) * Math.PI * 2) * 6 * (L.amount || 1) }; } },

  lensDrift: { label: "Lens-Drift — mise au point",
    unit(L, t, i){
      const k = cyc(L, t, 2.6) - i * 0.07;
      const s = Math.sin(((k % 1) + 1) % 1 * Math.PI * 2) * 0.5 + 0.5;
      return { blur: s * 7 * (L.amount || 1), alpha: lerp(1, 0.35, s) };
    } },

  bisect: { label: "Bisect — tranche décalée", c2: true, c3: true,
    hideBase: true,
    dual(L, t){
      const k = cyc(L, t, 3);
      const on = (k > 0.22 && k < 0.78);
      const e = on ? EASINGS.cubicInOut(clamp((k - 0.22) / 0.16, 0, 1)) *
                     (k > 0.62 ? EASINGS.cubicInOut(clamp((0.78 - k) / 0.16, 0, 1)) : 1) : 0;
      const A = 8 * (L.amount || 1);
      return [{ clip: "top",    dx:  e * A, dy: 0, color: e > 0.02 ? L.c2 : null, alpha: 1 },
              { clip: "bottom", dx: -e * A, dy: 0, color: e > 0.02 ? L.c3 : null, alpha: 1 }];
    } },

  splitFlap: { label: "Split-Flap — palettes d'aéroport", plate: true,
    unit(L, t, i){
      const k = ((cyc(L, t, 3.2) - i * 0.037) % 1 + 1) % 1;
      let sy = 1;
      if (k > 0.55 && k < 0.62) sy = lerp(1, 0.03, (k - 0.55) / 0.07);
      else if (k >= 0.62 && k < 0.69) sy = lerp(0.03, 1, (k - 0.62) / 0.07);
      else if (k >= 0.74 && k < 0.79) sy = lerp(1, 0.55, (k - 0.74) / 0.05);
      else if (k >= 0.79 && k < 0.84) sy = lerp(0.55, 1, (k - 0.79) / 0.05);
      return { sy };
    } },

  cipher: { label: "Cipher — décodage", c3: true,
    unit(L, t, i, n){
      const k = cyc(L, t, 4);
      // Chaque glyphe se fige à son tour, puis tout se re-brouille à la fin.
      const settle = 0.10 + (i / Math.max(1,n)) * 0.30;
      const scrambling = k < settle || k > 0.86;
      if (!scrambling) return {};
      const step = Math.floor(k * 26) + i * 13;
      const idx = Math.floor(hash11(step) * SCRAMBLE.length) % SCRAMBLE.length;
      return { text: SCRAMBLE[idx], color: L.c3 };
    } }
};

/* Lignes de balayage : utilisées par le CRT et l'hologramme. */
function scanlines(ctx, b, period, alpha, offset){
  ctx.save();
  ctx.beginPath();
  ctx.rect(b.x, b.y, b.w, b.h);
  ctx.clip();
  ctx.fillStyle = "rgba(0,0,0," + alpha + ")";
  const start = b.y + ((offset % period) - period);
  for (let y = start; y < b.y + b.h; y += period)
    ctx.fillRect(b.x, y, b.w, period / 2);
  ctx.restore();
}

const LOOK_DEFAULT = { type:"none", speed:1, amount:1, phase:0,
                       c2:"#FF4FD8", c3:"#4FF8FF", cell:4.5 };

/* Applique le preset d'entrée puis, éventuellement, celui de sortie. */
function unitDelta(anim, index, count, tLocal, layerDur){
  const base = { a:1, dx:0, dy:0, s:1, sx:1, sy:1, r:0, b:0, clip:1,
                 rgb:0, sk:0, neon:0, clipY:1 };

  // ENTRÉE
  const inDef = PRESETS[anim.preset] || PRESETS.none;
  const stag  = (anim.stagger || 0) * index;
  const tIn   = tLocal - (anim.delay || 0) - stag;
  const dIn   = Math.max(0.0001, anim.dur || 0.001);
  let pIn = clamp(tIn / dIn, 0, 1);
  pIn = (EASINGS[anim.ease] || EASINGS.cubicOut)(pIn);
  if (anim.preset === "typewriter") pIn = tIn >= 0 ? 1 : 0;
  Object.assign(base, { a:1, dx:0, dy:0, s:1, sx:1, sy:1, r:0, b:0, clip:1,
                        rgb:0, sk:0, neon:0, clipY:1 },
                normalize(inDef.f(pIn, anim.amount || 100, index)));

  // SORTIE
  if (anim.outPreset && anim.outPreset !== "none"){
    const outDef = PRESETS[anim.outPreset] || PRESETS.none;
    const dOut   = Math.max(0.0001, anim.outDur || 0.001);
    const stagO  = (anim.stagger || 0) * (count - 1 - index);
    const tOut   = tLocal - (layerDur - dOut) + stagO;
    if (tOut > 0){
      let pOut = clamp(1 - tOut / dOut, 0, 1);
      pOut = (EASINGS[anim.outEase] || EASINGS.cubicInOut)(pOut);
      const d = normalize(outDef.f(pOut, anim.amount || 100, index));
      base.a  *= (d.a  !== undefined ? d.a  : 1);
      base.dx += (d.dx || 0);
      base.dy += (d.dy || 0);
      base.s  *= (d.s  !== undefined ? d.s  : 1);
      base.sx *= (d.sx !== undefined ? d.sx : 1);
      base.sy *= (d.sy !== undefined ? d.sy : 1);
      base.r  += (d.r  || 0);
      base.b   = Math.max(base.b, d.b || 0);
      base.rgb  = Math.max(base.rgb, d.rgb || 0);
      base.neon = Math.max(base.neon, d.neon || 0);
      base.sk  += (d.sk || 0);
      base.clip  = Math.min(base.clip,  d.clip  !== undefined ? d.clip  : 1);
      base.clipY = Math.min(base.clipY, d.clipY !== undefined ? d.clipY : 1);
    }
  }
  return base;
}
function normalize(d){
  return { a: d.a !== undefined ? d.a : 1, dx: d.dx || 0, dy: d.dy || 0,
           s: d.s !== undefined ? d.s : 1, sx: d.sx !== undefined ? d.sx : 1,
           sy: d.sy !== undefined ? d.sy : 1, r: d.r || 0, b: d.b || 0,
           clip: d.clip !== undefined ? d.clip : 1,
           rgb: d.rgb || 0, sk: d.sk || 0, neon: d.neon || 0,
           clipY: d.clipY !== undefined ? d.clipY : 1 };
}

/* ---------- layout du texte ----------
   Canvas 2D ne découpe pas le texte : on mesure chaque unité nous-mêmes. */
function fontString(l, size){
  const it = l.italic ? "italic " : "";
  return it + (l.weight || 400) + " " + size + "px " + JSON.stringify(l.font) + ", sans-serif";
}
function layoutText(ctx, l, size, letterSpacing, lineHeight){
  ctx.font = fontString(l, size);
  const rawLines = String(l.text == null ? "" : l.text).split("\n");
  const unit = (l.anim && l.anim.unit) || "char";
  const lines = [];
  let gi = 0;

  for (let li = 0; li < rawLines.length; li++){
    const raw = rawLines[li];
    let pieces;
    if (unit === "line")      pieces = [raw];
    else if (unit === "word") pieces = raw.split(/(\s+)/).filter(s => s.length);
    else                      pieces = [...raw];

    const units = [];
    let cursor = 0;
    for (const piece of pieces){
      const w = ctx.measureText(piece).width + letterSpacing * piece.length;
      units.push({ text: piece, x: cursor, w, blank: /^\s+$/.test(piece) });
      cursor += w;
    }
    lines.push({ units, width: cursor, y: li * size * lineHeight });
  }
  // indices globaux, en sautant les blancs pour que le stagger reste régulier
  for (const line of lines)
    for (const u of line.units) u.gi = u.blank ? -1 : gi++;

  const totalH = (lines.length - 1) * size * lineHeight;
  return { lines, count: Math.max(1, gi), totalH };
}

<script>
"use strict";
/* =========================================================================
   RENDU — étage 1 : canvas 2D hors écran (layout, texte, formes)
           étage 2 : WebGL (glow, aberration, vignette, grain)
   ========================================================================= */

const buf = document.createElement("canvas");   // compositing buffer 2D
const ctx = buf.getContext("2d", { alpha: false });
const glc = $("#glcanvas");
let gl = null, GLR = null;

/* ---------- étage 1 : dessin 2D ---------- */

/* --- helpers de style partagés texte / forme --- */

/* Verre dépoli : vrai flou de l'arrière-plan. Les calques sont dessinés du
   fond vers l'avant, donc le buffer contient déjà ce qui est derrière — on le
   redessine sur lui-même, flouté et détouré. Ce n'est pas une imitation. */
function drawGlassPanel(ctx, st, x, y, w, h){
  const r = Math.min(st.glassRadius, w/2, h/2);
  ctx.save();
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  ctx.clip();
  const m = ctx.getTransform();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.filter = "blur(" + st.glassBlur.toFixed(1) + "px)";
  ctx.drawImage(buf, 0, 0);
  ctx.filter = "none";
  ctx.setTransform(m);
  ctx.fillStyle = "rgba(255,255,255," + (st.glassTint * st.glass).toFixed(3) + ")";
  ctx.fillRect(x, y, w, h);
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, "rgba(255,255,255," + (0.16 * st.glass).toFixed(3) + ")");
  g.addColorStop(0.45, "rgba(255,255,255,0)");
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
  if (st.glassBorder > 0){
    ctx.save();
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
    ctx.lineWidth = st.glassBorder;
    ctx.strokeStyle = "rgba(255,255,255," + (0.32 * st.glass).toFixed(3) + ")";
    ctx.stroke();
    ctx.restore();
  }
}

/* Dégradé linéaire orienté, calculé sur la boîte englobante fournie. */
function paintFor(ctx, st, solid, w, h){
  if (st.mode !== "gradient") return solid;
  const a = (st.gradAngle || 0) * Math.PI / 180;
  const dx = Math.cos(a) * w / 2, dy = Math.sin(a) * h / 2;
  const g = ctx.createLinearGradient(-dx, -dy, dx, dy);
  g.addColorStop(0, solid);
  g.addColorStop(1, st.grad2);
  return g;
}

/* Néon : passes de halo décroissantes puis le trait franc au-dessus. */
function neonPasses(ctx, st, intensity, drawOnce){
  const k = st.neon * clamp(intensity, 0, 1);
  if (k <= 0.001) return false;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  const radii = [34, 18, 8];
  const alphas = [0.30, 0.42, 0.55];
  for (let i = 0; i < radii.length; i++){
    ctx.shadowColor = st.neonColor;
    ctx.shadowBlur = radii[i] * k;
    ctx.globalAlpha = alphas[i] * k;
    drawOnce(st.neonColor);
  }
  ctx.restore();
  return true;
}

function drawTextLayer(ctx, l, t){
  const st = l.style || (l.style = {});
  const L  = l.look  || (l.look  = Object.assign({}, LOOK_DEFAULT));
  const K  = LOOKS[L.type] || LOOKS.none;

  const size    = evalProp(l.size, t);
  const ls      = evalProp(l.letterSpacing, t);
  const lh      = evalProp(l.lineHeight, t);
  const opacity = evalProp(l.opacity, t) / 100;
  const scale   = evalProp(l.scale, t) / 100;
  const rot     = evalProp(l.rotation, t) * Math.PI / 180;
  const cx      = evalProp(l.x, t);
  const cy      = evalProp(l.y, t);
  const color   = evalProp(l.color, t);
  const strokeW = evalProp(l.strokeW, t);
  const strokeC = evalProp(l.strokeColor, t);
  const shadow  = evalProp(l.shadow, t);
  const shadowC = evalProp(l.shadowColor, t);
  if (opacity <= 0.001 || size <= 0) return;

  const TL = layoutText(ctx, l, size, ls, lh);
  const tLocal   = t - l.inPoint;
  const layerDur = Math.max(0.001, l.outPoint - l.inPoint);
  const maxW = Math.max(...TL.lines.map(x => x.width), 1);
  const boxH = TL.totalH + size * 1.05;
  const box  = { x: -maxW/2 - size*0.14, y: -boxH/2, w: maxW + size*0.28, h: boxH };

  const blk = (K.block ? K.block(L, t) : null) || {};

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot + (blk.rot || 0) * Math.PI/180);
  ctx.scale(scale, scale);
  ctx.translate(blk.dx || 0, blk.dy || 0);
  if (blk.skew) ctx.transform(1, 0, blk.skew, 1, 0, 0);
  ctx.textBaseline = "alphabetic";
  ctx.textAlign = "left";
  ctx.font = fontString(l, size);
  ctx.lineJoin = "round";

  if (st.glass > 0.001){
    const padX = size * st.glassPad * 1.6, padY = size * st.glassPad;
    drawGlassPanel(ctx, st, -maxW/2 - padX, -boxH/2 - padY, maxW + padX*2, boxH + padY*2);
  }

  const yOffset = -TL.totalH / 2 + size * 0.35;
  const lookStroke = K.stroke ? K.stroke(L, t) : null;

  /* Texte sur chemin. Chaque glyphe est reporté le long d'une courbe et
     orienté sur sa tangente — le principe du texte curviligne d'Illustrator.
     u.x donne déjà l'abscisse curviligne, il ne reste qu'à la projeter. */
  const PATH = l.path && l.path.type !== "none" ? l.path : null;
  function onPath(u, line){
    const half = line.width / 2;
    const sLen = u.x + u.w / 2 - half;          // distance signée au centre
    if (PATH.type === "circle" || PATH.type === "arc"){
      const R = Math.max(1, PATH.radius);
      const dir = PATH.flip ? -1 : 1;
      const ang = (sLen / R) * dir;
      return { x: Math.sin(ang) * R,
               y: (Math.cos(ang) * R - R) * -dir,
               rot: ang * 180 / Math.PI };
    }
    if (PATH.type === "wave"){
      const k = (PATH.freq || 1) * Math.PI * 2 / Math.max(1, line.width);
      const A = PATH.amp || 0;
      return { x: sLen, y: -Math.sin(sLen * k) * A,
               rot: Math.atan(-Math.cos(sLen * k) * A * k) * 180 / Math.PI };
    }
    return { x: sLen, y: 0, rot: 0 };
  }

  /* Une passe = un parcours complet des glyphes. Les copies (relief, tranches,
     halo, écart RVB) réutilisent la même passe avec des surcharges, ce qui
     garantit qu'elles restent alignées sur le texte principal. */
  function pass(o){
    o = o || {};
    for (const line of TL.lines){
      let originX;
      if (l.align === "center")     originX = -line.width / 2;
      else if (l.align === "right") originX = -line.width;
      else                          originX = 0;

      for (const u of line.units){
        if (u.blank) continue;
        const d = unitDelta(l.anim, u.gi, TL.count, tLocal, layerDur);
        if (d.a <= 0.001) continue;
        const lu = (K.unit ? K.unit(L, t, u.gi, TL.count) : null) || {};

        let ux = originX + u.x + u.w / 2;
        let uy = line.y + yOffset;
        let pathRot = 0;
        if (PATH){
          const pp = onPath(u, line);
          ux = pp.x; uy = line.y + yOffset + pp.y; pathRot = pp.rot;
        }
        if (o.sweep) o.color = K.sweep(ctx, L, t, maxW, size, -(originX + u.x + u.w/2));
        const alpha = opacity * clamp(d.a, 0, 1) * (lu.alpha !== undefined ? lu.alpha : 1)
                    * (o.alpha !== undefined ? o.alpha : 1);
        if (alpha <= 0.002) continue;

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(ux + d.dx + (lu.dx || 0) + (o.dx || 0),
                      uy + d.dy + (lu.dy || 0) + (o.dy || 0));
        if (d.r || lu.rot || pathRot)
          ctx.rotate((d.r + (lu.rot || 0) + pathRot) * Math.PI / 180);
        if (d.sk) ctx.transform(1, 0, d.sk, 1, 0, 0);
        // Une échelle nulle rend la matrice non inversible : on plancher à une
        // valeur infime plutôt que de perdre le glyphe sans erreur.
        const EPS = 1e-4;
        ctx.scale(Math.max(EPS, d.s * d.sx * (lu.sx || 1)),
                  Math.max(EPS, d.s * d.sy * (lu.sy !== undefined ? lu.sy : 1)));

        const blur = (d.b || 0) + (lu.blur || 0);
        if (blur > 0.02) ctx.filter = "blur(" + blur.toFixed(2) + "px)";

        if (d.clip < 0.999 || d.clipY < 0.999){
          const c = Math.min(d.clip, d.clipY), ch = size * 1.5;
          ctx.beginPath();
          ctx.rect(-u.w, ch * 0.42 - ch * c, u.w * 2, ch * c);
          ctx.clip();
        }
        // Tranche haute / basse pour Bisect, Glitchcore et l'hologramme.
        if (o.clip === "top" || o.clip === "bottom"){
          const top = -size * 0.78, half = size * 0.55;
          ctx.beginPath();
          if (o.clip === "top") ctx.rect(-u.w*2, top, u.w*4, half + size*0.10);
          else                  ctx.rect(-u.w*2, top + half + size*0.10, u.w*4, size*1.4);
          ctx.clip();
        }

        // Plaque de fond du tableau d'affichage.
        if (K.plate && !o.noPlate){
          const pw = u.w * 1.34, ph = size * 1.45;
          ctx.save();
          const pg = ctx.createLinearGradient(0, -ph/2, 0, ph/2);
          pg.addColorStop(0,    "rgba(255,255,255,0.16)");
          pg.addColorStop(0.49, "rgba(255,255,255,0.16)");
          pg.addColorStop(0.51, "rgba(255,255,255,0.07)");
          pg.addColorStop(1,    "rgba(255,255,255,0.07)");
          ctx.fillStyle = pg;
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(-pw/2, -ph*0.72, pw, ph, 4);
          else ctx.rect(-pw/2, -ph*0.72, pw, ph);
          ctx.fill();
          ctx.restore();
        }

        const chars = lu.text ? [lu.text] : [...u.text];
        // ox : où se trouve le centre du bloc, vu depuis ce glyphe.
        const ox = PATH ? -(originX + u.x + u.w / 2) : -ux;
        const fill = o.color || (K.paint ? K.paint(ctx, L, t, maxW, size, color, ox)
                                         : paintFor(ctx, st, color, u.w, size));
        let px = -u.w / 2;
        for (const ch of chars){
          if (lookStroke && !o.color){
            ctx.globalAlpha = alpha * lookStroke.fillAlpha;
            ctx.fillStyle = color;
            ctx.fillText(ch, px, 0);
            ctx.globalAlpha = alpha;
            ctx.lineWidth = lookStroke.width;
            ctx.strokeStyle = lookStroke.color;
            ctx.setLineDash(lookStroke.dash);
            ctx.lineDashOffset = lookStroke.offset;
            ctx.strokeText(ch, px, 0);
            ctx.setLineDash([]);
          } else {
            if (strokeW > 0 && !o.color){
              ctx.lineWidth = strokeW;
              ctx.strokeStyle = strokeC;
              ctx.strokeText(ch, px, 0);
            }
            if (!(K.hideBase && o.base)){
              ctx.fillStyle = o.color || (lu.color && !o.color ? lu.color : fill);
              ctx.fillText(ch, px, 0);
            }

          px += ctx.measureText(ch).width + ls;
        }
        ctx.restore();

  // 1. reflet — approximation par bandes d'opacité décroissante, le canvas 2D
  //    n'ayant pas d'équivalent direct à -webkit-box-reflect.
  if (K.mirror){
    ctx.save();
    ctx.translate(0, boxH * 0.52);
    ctx.scale(1, -1);
    ctx.translate(0, -boxH * 0.06);
    for (let i = 0; i < 5; i++){
      ctx.save();
      ctx.beginPath();
      ctx.rect(-maxW, -boxH/2 + boxH * (i/5), maxW*2, boxH/5 + 1);
      ctx.clip();
      pass({ alpha: 0.30 * (1 - i/5), noPlate: true });
      ctx.restore();
    }
    ctx.restore();
  }

  // 2. copies décalées derrière (extrusion, ombre portée tournante, feuille d'or)
  if (K.stack) for (const sEntry of K.stack(L, t))
    pass({ dx: sEntry.dx, dy: sEntry.dy, color: sEntry.color, noPlate: true });

  // 3. halo
  const lookGlow = K.glow ? K.glow(L, t) : null;
  const glowColor = lookGlow ? lookGlow.color : st.neonColor;
  const glowK = (lookGlow ? lookGlow.k : 0) + (st.neon || 0);
  if (glowK > 0.001){
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const radii = [34, 18, 8], alphas = [0.30, 0.42, 0.55];
    for (let i = 0; i < 3; i++){
      ctx.shadowColor = glowColor;
      ctx.shadowBlur = radii[i] * clamp(glowK, 0, 2);
      pass({ color: glowColor, alpha: alphas[i] * clamp(glowK, 0, 1.4), noPlate: true });
    }
    ctx.restore();
  }

  // 4. écart RVB
  const split = (st.rgbSplit || 0) + (K.split ? K.split(L, t) : 0);
  if (split > 0.05){
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    pass({ color: "#ff2d2d", dx: -split, alpha: 0.85, noPlate: true });
    pass({ color: "#2dfaff", dx:  split, alpha: 0.85, noPlate: true });
    ctx.restore();
  }

  // 5. tranches colorées
  if (K.dual) for (const dEntry of K.dual(L, t))
    pass({ clip: dEntry.clip, dx: dEntry.dx, dy: dEntry.dy,
           color: dEntry.color || undefined, alpha: dEntry.alpha, noPlate: true });

  // 6. texte principal
  if (shadow > 0){ ctx.shadowColor = shadowC; ctx.shadowBlur = shadow; ctx.shadowOffsetY = shadow * 0.25; }
  pass({ base: true });
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  // 7. balayage additif (LED)
  if (K.sweep){
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    pass({ sweep: true, alpha: 0.9, noPlate: true });
    ctx.restore();
  }

  // 8. surimpression
  if (K.post) K.post(ctx, L, t, box);

  ctx.restore();
}

function shapePath(ctx, l, t, w, h){
  const r = Math.min(evalProp(l.corner, t), w/2, h/2);
  ctx.beginPath();
  switch (l.shape){
    case "ellipse":
      ctx.ellipse(0, 0, w/2, h/2, 0, 0, Math.PI*2);
      break;
    case "triangle":
      ctx.moveTo(0, -h/2); ctx.lineTo(w/2, h/2); ctx.lineTo(-w/2, h/2); ctx.closePath();
      break;
    case "line":
      ctx.moveTo(-w/2, 0); ctx.lineTo(w/2, 0);
      break;
    case "star": {
      const n = Math.max(3, l.points || 5);
      for (let i = 0; i < n*2; i++){
        const rad = i % 2 ? 0.42 : 1;
        const a = (i / (n*2)) * Math.PI*2 - Math.PI/2;
        const px = Math.cos(a) * w/2 * rad, py = Math.sin(a) * h/2 * rad;
        i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
      }
      ctx.closePath();
      break;
    }
    case "polygon": {
      const n = Math.max(3, l.points || 6);
      for (let i = 0; i < n; i++){
        const a = (i/n) * Math.PI*2 - Math.PI/2;
        const px = Math.cos(a) * w/2, py = Math.sin(a) * h/2;
        i ? ctx.lineTo(px,py) : ctx.moveTo(px,py);
      }
      ctx.closePath();
      break;
    }
    default: { // rect
      if (r > 0 && ctx.roundRect) ctx.roundRect(-w/2, -h/2, w, h, r);
      else ctx.rect(-w/2, -h/2, w, h);
    }
  }
}

function drawShapeLayer(ctx, l, t){
  const st = l.style || (l.style = {});
  const opacity = evalProp(l.opacity, t) / 100;
  if (opacity <= 0.001) return;
  const w   = evalProp(l.w, t);
  const h   = evalProp(l.h, t);
  const cx  = evalProp(l.x, t);
  const cy  = evalProp(l.y, t);
  const rot = evalProp(l.rotation, t) * Math.PI / 180;
  const sc  = evalProp(l.scale, t) / 100;
  const tLocal   = t - l.inPoint;
  const layerDur = Math.max(0.001, l.outPoint - l.inPoint);
  const d = unitDelta(l.anim, 0, 1, tLocal, layerDur);
  if (d.a <= 0.001) return;

  const L = l.look || (l.look = Object.assign({}, LOOK_DEFAULT));
  const K = LOOKS[L.type] || LOOKS.none;
  const blk = (K.block ? K.block(L, t) : null) || {};

  ctx.save();
  ctx.globalAlpha = opacity * clamp(d.a, 0, 1);
  ctx.translate(cx + d.dx + (blk.dx || 0), cy + d.dy + (blk.dy || 0));
  ctx.rotate(rot + (d.r + (blk.rot || 0)) * Math.PI/180);
  if (blk.skew) ctx.transform(1, 0, blk.skew, 1, 0, 0);
  if (d.sk) ctx.transform(1, 0, d.sk, 1, 0, 0);
  ctx.scale(Math.max(1e-4, sc * d.s * d.sx), Math.max(1e-4, sc * d.s * d.sy));
  if (d.b > 0.02) ctx.filter = "blur(" + d.b.toFixed(2) + "px)";

  if (st.glass > 0.001) drawGlassPanel(ctx, st, -w/2, -h/2, w, h);

  const c = Math.min(d.clip, d.clipY);
  if (c < 0.999){
    ctx.beginPath();
    ctx.rect(-w, h/2 - h * c, w*2, h * c);
    ctx.clip();
  }

  const sw = evalProp(l.strokeW, t);
  const fillC = evalProp(l.fill, t);
  const strokeC = evalProp(l.strokeColor, t);

  const once = (override, offX, offY) => {
    ctx.save();
    if (offX || offY) ctx.translate(offX || 0, offY || 0);
    shapePath(ctx, l, t, w, h);
    if (l.fillOn && l.shape !== "line" && st.glass <= 0.001){
      ctx.fillStyle = override ||
        (K.paint ? K.paint(ctx, L, t, w, h, fillC) : paintFor(ctx, st, fillC, w, h));
      ctx.fill();
    }
    if (sw > 0 || l.shape === "line"){
      ctx.lineWidth = Math.max(sw, l.shape === "line" ? 2 : 0);
      ctx.lineCap = "round";
      if (st.dash > 0) ctx.setLineDash([st.dash, st.dash * 0.8]);
      ctx.strokeStyle = override ||
        (l.shape === "line" && !sw ? paintFor(ctx, st, fillC, w, h) : strokeC);
      ctx.stroke();
    }
    ctx.restore();
  };

  if (K.stack) for (const e of K.stack(L, t)) once(e.color, e.dx, e.dy);

  const lookGlow = K.glow ? K.glow(L, t) : null;
  if (lookGlow && lookGlow.k > 0.001){
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const radii = [34, 18, 8], alphas = [0.30, 0.42, 0.55];
    for (let i = 0; i < 3; i++){
      ctx.shadowColor = lookGlow.color;
      ctx.shadowBlur = radii[i] * clamp(lookGlow.k, 0, 2);
      ctx.globalAlpha = alphas[i] * clamp(lookGlow.k, 0, 1.4);
      once(lookGlow.color);
    }
    ctx.restore();
  }
  neonPasses(ctx, st, 0.35 + d.neon * 0.65 + (st.neon > 0 ? 0.65 : 0), c2 => once(c2));

  const split = (st.rgbSplit || 0) + d.rgb * 6;
  if (split > 0.05){
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha *= 0.85;
    once("#ff2d2d", -split);
    once("#2dfaff",  split);
    ctx.restore();
  }
  once(null);
  if (K.post) K.post(ctx, L, t, { x: -w/2, y: -h/2, w, h });
  ctx.restore();
}


/* =========================================================================
   BOUTONS — les effets :hover du CSS deviennent une propriété « survol »
   animable de 0 à 100. Au lieu d'un état déclenché par la souris, on obtient
   une valeur pilotable à la clé, donc enregistrable dans la vidéo.
   ========================================================================= */
const BTN_FX = {
  fillUp:        { label: "Remplissage ↑",   fill: (k) => ({ from: "bottom", k }) },
  fillDown:      { label: "Remplissage ↓",   fill: (k) => ({ from: "top", k }) },
  fillLeft:      { label: "Remplissage ←",   fill: (k) => ({ from: "right", k }) },
  fillRight:     { label: "Remplissage →",   fill: (k) => ({ from: "left", k }) },
  gradientSlide: { label: "Dégradé glissant", grad: true, fill: (k) => ({ from: "left", k }) },
  lift:          { label: "Décollage",       lift: (k) => ({ dy: -4*k, softShadow: k }) },
  hardShadow:    { label: "Ombre dure",      lift: (k) => ({ dx: -3*k, dy: -3*k, hard: { dx: 6*k, dy: 6*k } }) },
  shadowSlide:   { label: "Ombre glissée",   lift: (k) => ({ dx: 3*k, dy: -3*k, hard: { dx: -6*k, dy: 6*k, accent: true } }) },
  borderDraw:    { label: "Tracé du contour", border: (k) => k },
  spacedOut:     { label: "Écartement",      space: (k) => ({ ls: 0.22*k, padL: 6*k }) },
  skew:          { label: "Cisaillement",    skew: (k) => ({ sk: -0.176*k, solid: k }) },
  invert:        { label: "Inversion",       fill: (k) => ({ from: "center", k }) }
};

function drawButtonLayer(ctx, l, t){
  const opacity = evalProp(l.opacity, t) / 100;
  if (opacity <= 0.001) return;
  const size  = evalProp(l.size, t);
  const ls    = evalProp(l.letterSpacing, t);
  const padX  = evalProp(l.padX, t);
  const padY  = evalProp(l.padY, t);
  const rad   = evalProp(l.radius, t);
  const bw    = evalProp(l.borderW, t);
  const cx    = evalProp(l.x, t);
  const cy    = evalProp(l.y, t);
  const sc    = evalProp(l.scale, t) / 100;
  const rot   = evalProp(l.rotation, t) * Math.PI / 180;
  const hover = clamp(evalProp(l.hover, t) / 100, 0, 1);
  const ink   = evalProp(l.ink, t);
  const surf  = evalProp(l.surf, t);
  const prim  = evalProp(l.primary, t);

  const F = BTN_FX[l.btnFx] || BTN_FX.fillUp;
  const k = EASINGS.cubicOut(hover);

  const sp   = F.space ? F.space(k) : { ls: 0, padL: 0 };
  const lift = F.lift  ? F.lift(k)  : {};
  const skw  = F.skew  ? F.skew(k)  : {};
  const fill = F.fill  ? F.fill(k)  : null;

  const tLocal   = t - l.inPoint;
  const layerDur = Math.max(0.001, l.outPoint - l.inPoint);
  const d = unitDelta(l.anim, 0, 1, tLocal, layerDur);
  if (d.a <= 0.001) return;

  ctx.save();
  ctx.font = fontString(l, size);
  const totalLs = ls + size * sp.ls;
  const label = String(l.label == null ? "" : l.label);
  const textW = ctx.measureText(label).width + totalLs * label.length;
  const w = textW + padX * 2 + sp.padL;
  const h = size * 1.35 + padY * 2;

  ctx.globalAlpha = opacity * clamp(d.a, 0, 1);
  ctx.translate(cx + d.dx + (lift.dx || 0), cy + d.dy + (lift.dy || 0));
  ctx.rotate(rot + d.r * Math.PI/180);
  ctx.scale(Math.max(1e-4, sc * d.s * d.sx), Math.max(1e-4, sc * d.s * d.sy));
  if (skw.sk) ctx.transform(1, 0, skw.sk, 1, 0, 0);
  if (d.b > 0.02) ctx.filter = "blur(" + d.b.toFixed(2) + "px)";

  const path = () => {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(-w/2, -h/2, w, h, Math.min(rad, h/2));
    else ctx.rect(-w/2, -h/2, w, h);
  };

  // ombre portée dure, dessinée en premier
  if (lift.hard){
    ctx.save();
    ctx.translate(lift.hard.dx, lift.hard.dy);
    path();
    ctx.fillStyle = lift.hard.accent ? prim : ink;
    ctx.fill();
    ctx.restore();
  }
  if (lift.softShadow > 0){
    ctx.save();
    ctx.translate(0, 8 * lift.softShadow);
    path();
    ctx.fillStyle = ink;
    ctx.globalAlpha *= 0.3 * lift.softShadow;
    ctx.fill();
    ctx.restore();
  }

  // fond plein (cisaillement) ou dégradé glissant
  let labelMix = 0;                      // 0 = encre, 1 = surface
  if (skw.solid > 0.001){
    path(); ctx.fillStyle = ink; ctx.globalAlpha *= 1; ctx.fill();
    labelMix = skw.solid;
  }
  if (F.grad){
    path();
    const g = ctx.createLinearGradient(-w/2, 0, w/2 + w, 0);
    const off = lerp(1, 0, k);
    g.addColorStop(0, ink);
    g.addColorStop(clamp(off, 0, 1), ink);
    g.addColorStop(clamp(off + 0.001, 0, 1), surf);
    g.addColorStop(1, surf);
    ctx.fillStyle = g;
    ctx.fill();
    labelMix = k;
  }

  // panneau coulissant
  if (fill && !F.grad && fill.k > 0.001){
    ctx.save();
    path(); ctx.clip();
    ctx.fillStyle = l.btnFx === "invert" ? prim : ink;
    const kk = fill.k;
    if (fill.from === "bottom")      ctx.fillRect(-w/2, h/2 - h*kk, w, h*kk);
    else if (fill.from === "top")    ctx.fillRect(-w/2, -h/2, w, h*kk);
    else if (fill.from === "left")   ctx.fillRect(-w/2, -h/2, w*kk, h);
    else if (fill.from === "right")  ctx.fillRect(w/2 - w*kk, -h/2, w*kk, h);
    else                             ctx.fillRect(-w*kk/2, -h/2, w*kk, h);
    ctx.restore();
    labelMix = kk;
  }

  // contour
  if (bw > 0){
    if (F.border){
      ctx.save();
      path();
      ctx.lineWidth = bw;
      ctx.strokeStyle = "rgba(255,255,255,0.16)";
      ctx.stroke();
      ctx.restore();
      const kb = F.border(k);
      if (kb > 0.001){
        ctx.save();
        ctx.beginPath();
        ctx.rect(-w/2 - bw, -h/2 - bw, (w + bw*2) * kb, h + bw*2);
        ctx.clip();
        path();
        ctx.lineWidth = bw * 2;
        ctx.strokeStyle = ink;
        ctx.stroke();
        ctx.restore();
      }
    } else {
      path();
      ctx.lineWidth = bw;
      ctx.strokeStyle = ink;
      ctx.stroke();
    }
  }

  // libellé
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";
  ctx.fillStyle = mixHex(ink, surf, labelMix);
  let px = -textW/2 + sp.padL/2;
  for (const ch of label){
    ctx.fillText(ch, px, 1);
    px += ctx.measureText(ch).width + totalLs;
  }
  ctx.restore();
}
