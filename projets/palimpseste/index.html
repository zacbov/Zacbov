<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Palimpseste</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600&family=Spectral:wght@300;400&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#0a0908;overflow:hidden;font-family:'Spectral',serif}
  canvas{display:block}
  #ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:22px;z-index:10}
  #top{display:flex;justify-content:space-between}
  #title h1{font-family:'Cormorant SC',serif;font-size:17px;letter-spacing:.16em;text-transform:uppercase;color:#e8dcc4}
  #roomBox{font-family:'Cormorant SC',serif;font-size:13px;letter-spacing:.1em;color:#7a2e1e;text-transform:uppercase;background:rgba(232,221,195,.7);padding:7px 13px;border:1px solid #8a7455}
  #bars{display:none}
  #timer{font-family:'Cormorant SC',serif;font-size:13px;letter-spacing:.12em;color:#7a6b52;background:rgba(20,17,13,.5);padding:6px 14px;border:1px solid #4a3f2e}
  #tip{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-family:'Cormorant SC',serif;font-size:17px;letter-spacing:.1em;color:#c9a8d8;background:rgba(18,12,22,.85);padding:16px 32px;border:1px solid #5a4a6a;pointer-events:none;text-align:center;z-index:20;max-width:600px;opacity:0;transition:opacity .6s}
  #bars b{color:#d4a15a}
  .bw{width:130px;height:5px;background:rgba(90,74,53,.25);margin-top:4px;border:1px solid #4a3f2e}
  .bf{height:100%;background:#7a2e1e;transition:width .1s}
  #doorUI{display:none;position:fixed;inset:0;background:rgba(8,6,5,.92);z-index:50;align-items:center;justify-content:center;flex-direction:column;font-family:'Cormorant SC',serif;color:#e8dcc4;pointer-events:auto}
  #doorUI.open{display:flex}
  #doorTitle{font-size:18px;letter-spacing:.18em;margin-bottom:18px;color:#c9a8d8}
  #doorSlots{display:flex;gap:14px;margin-bottom:16px}
  .ds{width:44px;height:54px;border:1px solid #5a4a6a;display:flex;align-items:center;justify-content:center;font-size:26px}
  .ds.cur{border-color:#c9a8d8;box-shadow:0 0 10px rgba(201,168,216,.4)}
  #doorMsg{font-size:12px;color:#7a6b52}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="top">
    <div id="title"><h1>Palimpseste</h1></div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
      <div id="roomBox">—</div>
      <div id="timer">00:00</div>
    </div>
  </div>
  <div id="bars">
    🜂 <b id="wB">0</b>/3 &nbsp;🜍 <b id="wS">0</b>/3 &nbsp;🜄 <span id="wW">—</span><br>
    <div class="bw"><div class="bf" id="wBar" style="width:100%"></div></div>
    ☀ <span id="wH">—</span>
    <div class="bw"><div class="bf" id="hBar" style="width:0;background:#d4a15a"></div></div>
  </div>
</div>
<div id="tip"></div>
<div id="doorUI">
  <div id="doorTitle">☩ Sceau de la Porte ☩</div>
  <div id="doorSlots"></div>
  <div id="doorMsg">Un mot traverse toutes les strates.</div>
</div>
<script>
// ── canvas ─────────────────────────────────────────────────────────────────
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=devicePixelRatio||1;W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';}
resize();window.addEventListener('resize',()=>{resize();buildPaper();});

// ── utils ──────────────────────────────────────────────────────────────────
const sr=s=>()=>{s=(s*9301+49297)%233280;return s/233280;};
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hexA(h,a){h=h.replace('#','');return`rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;}

// ── tooltips ───────────────────────────────────────────────────────────────
const TIPS=['Le parchemin brûle… mais la cendre garde sa mémoire.','Ce qui s\'efface laisse parfois une lumière.','L\'eau a soif d\'obscurité. La torche a soif d\'eau.','Un caillou bien jeté ne roule jamais deux fois.','Le Grand Œuvre réclame un ordre. Le désordre l\'annule.','L\'ombre dit ce que la lumière tait.','Les étoiles ne parlent qu\'aux patients.','La lumière plie autour des obstacles, si on la guide.','Pair ou impair — la géomancie tranche.','La vérité est dispersée. Il faut la rassembler.','Un mot traverse toutes les strates.','Avant les lettres, il y avait les runes.','Toutes les racines ne guérissent pas de la même main.','Pair ou impair, la terre répond toujours.','Le messager précède toujours les rois.','Rien ne pèse juste par hasard.','Trois cercles, un seul mot vrai.','Le silence a une mélodie, si on sait l\'écouter.','Ce que tu vois à gauche, cherche-le inversé à droite.','Le temps ne s\'arrête pas pour celui qui hésite.','Ni trop, ni trop peu — la juste mesure.','Ce qui dévore fer et pierre ne se voit jamais venir.','Trois voix, trois débuts, un seul mot au bout.'];
let tipT=0;
function showTip(t){const el=document.getElementById('tip');el.textContent=t;el.style.opacity='1';tipT=5;}
function tickTip(dt){if(tipT<=0)return;tipT-=dt;if(tipT<1)document.getElementById('tip').style.opacity=Math.max(0,tipT).toFixed(2);}

// ── glyphs ─────────────────────────────────────────────────────────────────
const GLYPHS=['🜁','🜂','🜃','🜄','🜅','🜆','🜇','🜈','🜉','🜊','🜋','🜌','🜍','🜎','🜏','🜐','🜑','🜒','🜓','🜔','🜕','🜖','🜗','🜘','🜙','🜚','🜛','Α','Β','Γ','Δ','Θ','Ξ','Σ','Φ','Ψ','Ω','ᚠ','ᚢ','ᚦ','ᚨ','ᚱ','ᚲ','ᚷ','ᚹ','ᚺ','ᚾ','ᛁ','ᛃ','ᛈ','ᛊ','ᛏ','ᛒ','ᛖ','ᛗ','ᛚ','ᛜ','ᛞ','ᛟ','☉','☽','☿','♀','♂','♃','♄','☊','☋','△','□','⚹','⛤','⛥','⛧','✡','☤','☥','☧','☨','✠','♁','⚮','⚯','⚲','⚱','⚳','⚴','⚵','⚶','⦿','⟁','◈','⁂','⊕','⌖','¶','❡','⁘','⁜','☩','ſ'];
const ALPHA=['A','B','C','D','E','F','G','H','I','L','M','N','O','P','R','S','T','V'];
const WORDS=['VERITAS','IGNIS','AQUA','CORPVS','LVMEN','ARCANVM','MEMORIA','CINIS'];
// Decorative ambient symbols per room theme (non-interactive, colored)
const DECO_SETS=[
  ['🜂','☉','⁂','ᚠ'],['🜍','☽','⁘','ᚢ'],
  ['🜄','⚲','🜚','ᚁ','ᚂ'],['☿','◈','⟁'],
  ['⛤','✡','☤','♁'],['🜔','⛧','☥'],
  ['✡','☊','⦿','ᛊ'],['☉','◈','△','⁜'],
  ['⚲','⚮','⚯','⚶'],['⛤','☩','⁂','✠'],
  ['☩','✡','♁','☤'],
];

// ── world ──────────────────────────────────────────────────────────────────
const W0=900,NR=23;
const world={w:W0*NR,h:900};let camX=0,camY=0;
function w2s(x,y){return[(x-camX)*DPR,(y-camY)*DPR];}
const BD=34;
const ROOMS=['Salle 🜂','Salle 🜍','Salle 🜄','Salle ☿','Salle du Sceau','Salle des Ombres','Salle des Étoiles','Salle du Prisme','Salle des Leviers','Salle des Pages','Salle de la Porte','Salle Runique','Apothicairerie','Salle Géomantique','Salle des Sphères','La Balance','Le Cryptex','Le Carillon','Le Bassin des Reflets','Le Cadran Solaire','Les Bidons','La Devinette de Gollum','La Bibliothèque'].map((n,i)=>({n,x0:W0*i,x1:W0*(i+1)}));
function roomOf(x){return ROOMS.find(r=>x>=r.x0&&x<r.x1)||ROOMS[0];}
function inR(i,x){return x>=ROOMS[i].x0&&x<ROOMS[i].x1;}
let lastRI=-1;
let visitedRooms=new Set([0]);
const PIL_JUMP=5;
let pilMsg=0;// warning flash when target room isn't unlocked yet

// ── walls ──────────────────────────────────────────────────────────────────
const walls=[];
// full perimeter including LEFT and RIGHT borders
walls.push({x:0,y:0,w:world.w,h:BD,tag:'border'});// top
walls.push({x:0,y:world.h-BD,w:world.w,h:BD,tag:'border'});// bottom
walls.push({x:0,y:0,w:BD,h:world.h,tag:'border'});// LEFT — was missing!
walls.push({x:world.w-BD,y:0,w:BD,h:world.h,tag:'border'});// right
// corridor dividers between rooms (open passage 340-560)
for(let i=1;i<NR;i++){walls.push({x:ROOMS[i].x0,y:0,w:40,h:340});walls.push({x:ROOMS[i].x0,y:560,w:40,h:340});}
// ── Room 3 maze walls ────────────────────────────────────────────────────
const R3x=ROOMS[2].x0;
// 4 baffles, each nearly full-height with a single gap, alternating top/bottom.
// Verified by construction: single mandatory gap per baffle, connected serpentine.
walls.push({x:R3x+220,y:BD,     w:32,h:586});          // baffle1: gap below y=620
walls.push({x:R3x+370,y:280,    w:32,h:world.h-280-BD}); // baffle2: gap above y=280
walls.push({x:R3x+520,y:BD,     w:32,h:586});          // baffle3: gap below y=620
walls.push({x:R3x+670,y:280,    w:32,h:world.h-280-BD}); // baffle4: gap above y=280
// Back wall between R3 and R4
const backWall={x:ROOMS[3].x0-40,y:BD,w:40,h:world.h-2*BD,tag:'back'};
walls.push(backWall);
// ── Lever door (R9 exit) ──────────────────────────────────────────────────
const levDoor={x:ROOMS[9].x1-40,y:BD,w:40,h:world.h-2*BD,tag:'levdoor'};
walls.push(levDoor);
// ── Final door ─────────────────────────────────────────────────────────────
const finalDoor={x:ROOMS[10].x1-40,y:BD,w:40,h:world.h-2*BD,tag:'finaldoor'};
const r22Door={x:ROOMS[21].x1-40,y:BD,w:40,h:world.h-2*BD,tag:'r22door'};
const r23Door={x:ROOMS[22].x1-40,y:BD,w:40,h:world.h-2*BD,tag:'r23door'};
walls.push(r22Door,r23Door);
walls.push(finalDoor);

// ── paper texture ──────────────────────────────────────────────────────────
let paper=null;
function buildPaper(){const o=document.createElement('canvas');o.width=W;o.height=H;const c2=o.getContext('2d'),d=c2.createImageData(W,H);for(let i=0;i<d.data.length;i+=4){const v=200+Math.random()*40;d.data[i]=v*.94;d.data[i+1]=v*.88;d.data[i+2]=v*.74;d.data[i+3]=16;}c2.putImageData(d,0,0);paper=o;}
buildPaper();

// ── draw helpers ──────────────────────────────────────────────────────────
function hL(x1,y1,x2,y2,j,rnd){ctx.beginPath();ctx.moveTo(x1,y1);for(let i=1;i<=5;i++){const t=i/5;ctx.lineTo(x1+(x2-x1)*t+(rnd()-.5)*j,y1+(y2-y1)*t+(rnd()-.5)*j);}ctx.stroke();}
function drawGlyphWall(w,seed,ink){
  const rnd=sr(seed);const[sx,sy]=w2s(w.x,w.y);const ww=w.w*DPR,wh=w.h*DPR;
  const hz=w.w>=w.h;const th=hz?wh:ww,axL=hz?ww:wh,gs=th*.85,step=gs*.58;
  const cnt=Math.ceil(axL/step)+2,word=WORDS[Math.floor(rnd()*WORDS.length)];
  const ws=Math.floor(rnd()*Math.max(1,cnt-word.length-2))+1;
  ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<cnt;i++){
    const t=i*step-step*.5;const inW=i>=ws&&i<ws+word.length;
    let g;if(inW){g=word[i-ws];if(rnd()<.3)g+='\u0336';}else if(rnd()<.25)g=ALPHA[Math.floor(rnd()*ALPHA.length)];else g=GLYPHS[Math.floor(rnd()*GLYPHS.length)];
    const size=gs*(.7+rnd()*.32),rot=inW?(rnd()-.5)*.1:(rnd()-.5)*.55,perp=(rnd()-.5)*th*.3;
    let px,py;if(hz){px=sx+t;py=sy+th/2+perp;}else{px=sx+th/2+perp;py=sy+t;}
    ctx.save();ctx.translate(px,py);ctx.rotate(rot);ctx.font=`${size}px serif`;ctx.fillStyle=ink?hexA(ink,.4+rnd()*.25):`rgba(58,42,24,${.35+rnd()*.25})`;ctx.fillText(g,0,0);ctx.restore();
  }ctx.restore();
}
function G(s,x,y,col,sz,a=.9){const[sx,sy]=w2s(x,y);ctx.save();ctx.font=`${sz*DPR}px serif`;ctx.fillStyle=col;ctx.textAlign='center';ctx.textBaseline='middle';ctx.globalAlpha=a;ctx.fillText(s,sx,sy);ctx.restore();ctx.globalAlpha=1;}
function drawDeco(ri){
  // ambient decorative symbols scattered in each room (non-interactive, low opacity)
  const rm=ROOMS[ri];const rnd=sr(ri*1337+42);const dset=DECO_SETS[ri]||[];
  if(!dset.length)return;
  for(let i=0;i<12;i++){
    const x=rm.x0+BD+60+rnd()*(W0-BD*2-120);const y=BD+60+rnd()*(world.h-BD*2-120);
    const sym=dset[Math.floor(rnd()*dset.length)];const sz=12+rnd()*14;const a=.06+rnd()*.1;
    let col='rgba(58,42,24,1)';
    if(sym.match(/ᚁ|ᚂ|ᚃ|ᚄ|ᚅ/))col='rgba(60,90,55,1)';// ogham = green
    else if(sym.match(/🜄|⚲/))col='rgba(50,80,120,1)';// water = blue
    else if(sym.match(/☉|☽|⁂/))col='rgba(180,140,60,1)';// celestial = gold
    G(sym,x,y,col,sz,a);
  }
}
function drawPatch(spot,mode){
  if(spot.wear<=0)return;
  const rnd=sr(Math.floor(spot.x*7+spot.y*(mode==='burn'?1:3)));
  const[sx,sy]=w2s(spot.x,spot.y);const R=46*DPR;const sp=18;
  const rad=[];for(let i=0;i<sp;i++)rad.push(.6+rnd()*.5-(rnd()<.12?rnd()*.25:0));
  const stage=Math.min(spot.wear,2),pR=R*(.35+stage*.32);
  ctx.save();
  const hG=ctx.createRadialGradient(sx,sy,pR*.4,sx,sy,pR*1.3);
  if(mode==='burn'){hG.addColorStop(0,stage===1?'rgba(150,110,40,.28)':'rgba(110,60,15,.4)');hG.addColorStop(1,'rgba(110,60,15,0)');}
  else{hG.addColorStop(0,stage===1?'rgba(255,250,235,.4)':'rgba(255,252,245,.6)');hG.addColorStop(1,'rgba(255,252,245,0)');}
  ctx.beginPath();ctx.arc(sx,sy,pR*1.3,0,Math.PI*2);ctx.fillStyle=hG;ctx.fill();
  ctx.beginPath();for(let i=0;i<=sp;i++){const a=(i/sp)*Math.PI*2,rr=rad[i%sp]*pR;ctx.lineTo(sx+Math.cos(a)*rr,sy+Math.sin(a)*rr);}ctx.closePath();
  const pG=ctx.createRadialGradient(sx,sy,pR*.1,sx,sy,pR);
  if(mode==='burn'){if(stage===1){pG.addColorStop(0,'rgba(150,120,50,.5)');pG.addColorStop(.7,'rgba(140,110,45,.35)');pG.addColorStop(1,'rgba(140,110,45,.05)');}else{pG.addColorStop(0,'rgba(90,50,15,.65)');pG.addColorStop(.55,'rgba(110,60,20,.55)');pG.addColorStop(.85,'rgba(150,80,25,.4)');pG.addColorStop(1,'rgba(150,80,25,.05)');}}
  else{pG.addColorStop(0,'rgba(255,255,252,.85)');pG.addColorStop(.55,'rgba(255,254,250,.68)');pG.addColorStop(.85,'rgba(250,248,240,.45)');pG.addColorStop(1,'rgba(250,248,240,.05)');}
  ctx.fillStyle=pG;ctx.fill();ctx.restore();
}
function drawOpening(t,mode){
  const[sx,sy]=w2s(t.x,t.y);const rnd=sr(Math.floor(t.x*3+t.y*5));const R=t.r*DPR;const sp=20;
  const rad=[];for(let i=0;i<sp;i++)rad.push(.6+rnd()*.55-(rnd()<.1?rnd()*.2:0));
  ctx.save();
  const hG=ctx.createRadialGradient(sx,sy,R*.5,sx,sy,R*1.5);
  if(mode==='burn'){hG.addColorStop(0,'rgba(90,45,10,.45)');hG.addColorStop(.6,'rgba(70,35,8,.22)');hG.addColorStop(1,'rgba(70,35,8,0)');}
  else{hG.addColorStop(0,'rgba(255,255,250,.5)');hG.addColorStop(.6,'rgba(255,253,245,.25)');hG.addColorStop(1,'rgba(255,253,245,0)');}
  ctx.beginPath();ctx.arc(sx,sy,R*1.5,0,Math.PI*2);ctx.fillStyle=hG;ctx.fill();
  ctx.beginPath();for(let i=0;i<=sp;i++){const a=(i/sp)*Math.PI*2,rr=rad[i%sp]*R*1.13;ctx.lineTo(sx+Math.cos(a)*rr,sy+Math.sin(a)*rr);}ctx.closePath();
  const rG=ctx.createRadialGradient(sx,sy,R*.6,sx,sy,R*1.13);
  if(mode==='burn'){rG.addColorStop(0,'rgba(0,0,0,0)');rG.addColorStop(.55,'rgba(60,25,5,.55)');rG.addColorStop(.85,'rgba(210,90,20,.85)');rG.addColorStop(1,'rgba(255,150,40,.9)');}
  else{rG.addColorStop(0,'rgba(0,0,0,0)');rG.addColorStop(.6,'rgba(255,253,248,.5)');rG.addColorStop(1,'rgba(255,255,255,.85)');}
  ctx.fillStyle=rG;ctx.fill();
  ctx.beginPath();for(let i=0;i<=sp;i++){const a=(i/sp)*Math.PI*2,rr=rad[i%sp]*R;ctx.lineTo(sx+Math.cos(a)*rr,sy+Math.sin(a)*rr);}ctx.closePath();
  const iG=ctx.createRadialGradient(sx,sy,2,sx,sy,R);
  if(mode==='burn'){iG.addColorStop(0,'#241a2a');iG.addColorStop(1,'#120c16');}else{iG.addColorStop(0,'#fffdf8');iG.addColorStop(1,'#f3ecd8');}
  ctx.fillStyle=iG;ctx.fill();ctx.strokeStyle=mode==='burn'?'rgba(40,18,6,.9)':'rgba(180,160,120,.6)';ctx.lineWidth=1.3*DPR;ctx.stroke();ctx.restore();
}
function drawNegative(textLines){
  ctx.save();
  const rm=roomOf(player.x);
  const[rx0]=w2s(rm.x0+BD,0),[rx1]=w2s(rm.x1-BD,0);
  const[,ry0]=w2s(0,BD),[,ry1]=w2s(0,world.h-BD);
  const clipX0=Math.max(0,rx0),clipX1=Math.min(W,rx1),clipY0=Math.max(0,ry0),clipY1=Math.min(H,ry1);
  ctx.beginPath();ctx.rect(clipX0,clipY0,clipX1-clipX0,clipY1-clipY0);ctx.clip();
  const g=ctx.createRadialGradient(W/2,H/2,H*.1,W/2,H/2,H*.75);g.addColorStop(0,'#3a2e3e');g.addColorStop(1,'#231a28');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const ink='#c9a8d8';
  walls.forEach((w,i)=>{if(w.x<rm.x1&&w.x+w.w>rm.x0)drawGlyphWall(w,i*23+5,ink);});
  if(textLines&&textLines.length){ctx.font=`${18*DPR}px 'Cormorant SC',serif`;ctx.fillStyle=ink;ctx.textAlign='center';textLines.forEach((l,i)=>ctx.fillText(l,W/2,H*.28+i*29*DPR));}
  drawPlayer(0);
  const vg=ctx.createRadialGradient(W/2,H/2,H*.32,W/2,H/2,H*.85);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(10,5,15,.55)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);ctx.restore();
}

// ── room state ─────────────────────────────────────────────────────────────
const burn={x:ROOMS[0].x0+440,y:450,wear:0};let tear=null;
const scratch={x:ROOMS[1].x0+450,y:450,wear:0};let erasure=null,halo=0;
// R3 torches placed at maze bottlenecks
const R3T=[
  {x:R3x+220,y:740,r:100},  // baffle1 gap (bottom)
  {x:R3x+370,y:200,r:100},  // baffle2 gap (top)
  {x:R3x+520,y:740,r:100},  // baffle3 gap (bottom)
  {x:R3x+670,y:200,r:100},  // baffle4 gap (top)
];
const jarSrc={x:R3x+80,y:450},altar3={x:R3x+820,y:450};
let carryJar=false,jarLvl=1,jarDone=false;
const r3burn={x:backWall.x+20,y:450,wear:0};let r3tear=null,backDug=false;
// R4 fading path — perpendicular L-shapes, goes backwards
const R4x=ROOMS[3].x0;
// Path with perpendicular L-turns, backwards segment, dead-end branch (marked separately), and extra crossroad
const path4=[
  {x:R4x+70,y:450},   // start
  {x:R4x+70,y:180},   // up
  {x:R4x+360,y:180},  // right
  {x:R4x+360,y:700},  // down (long)
  {x:R4x+160,y:700},  // LEFT — goes back!
  {x:R4x+160,y:480},  // up
  {x:R4x+560,y:480},  // right — crossroad
  {x:R4x+560,y:180},  // up
  {x:R4x+720,y:180},  // right
  {x:R4x+720,y:620},  // down
  {x:R4x+860,y:620},  // right
  {x:R4x+860,y:450},  // up to exit

// Generalized code-door system: openDoorUI(cfg) where cfg = {slots, alphabet, onSolve}
// alphabet: array of characters/symbols to cycle through (default A-Z)
let doorCfg=null;
function openDoorUI(cfg){
  doorCfg=cfg;
  doorIn=new Array(cfg.slots).fill(cfg.alphabet[0]);
  doorCur=0;doorActive=true;
  document.getElementById('doorTitle').textContent=cfg.title||'☩ Sceau ☩';
  document.getElementById('doorMsg').textContent=cfg.prompt||'Trouve le code.';
  document.getElementById('doorUI').classList.add('open');renderDoor();
}
function closeDoor(){doorActive=false;document.getElementById('doorUI').classList.remove('open');}
function renderDoor(){document.getElementById('doorSlots').innerHTML=doorIn.map((c,i)=>`<div class="ds${i===doorCur?' cur':''}">${c}</div>`).join('');}
function dKey(e){
  e.preventDefault();const k=e.key;const cfg=doorCfg;const A=cfg.alphabet;
  if(k==='Escape'){closeDoor();return;}
  if(k==='ArrowLeft')doorCur=clamp(doorCur-1,0,cfg.slots-1);
  else if(k==='ArrowRight')doorCur=clamp(doorCur+1,0,cfg.slots-1);
  else if(k==='ArrowUp'){const idx=(A.indexOf(doorIn[doorCur])+1)%A.length;doorIn[doorCur]=A[idx];}
  else if(k==='ArrowDown'){const idx=(A.indexOf(doorIn[doorCur])-1+A.length)%A.length;doorIn[doorCur]=A[idx];}
  else if(k.toLowerCase()==='e'){
    if(doorIn.join('')===cfg.target){closeDoor();cfg.onSolve();}
    else{document.getElementById('doorMsg').textContent='✗ Faux. Recommence.';doorIn=new Array(cfg.slots).fill(A[0]);doorCur=0;}
  }
  renderDoor();
}

// ── update ─────────────────────────────────────────────────────────────────

function update(dt){
  elapsed+=dt;document.getElementById('timer').textContent=fmtTime(elapsed);

  if(keys['arrowup']||keys['z'])dy-=1;if(keys['arrowdown']||keys['s'])dy+=1;

    if(px<player.r||py<player.r||px>world.w-player.r||py>world.h-player.r)return true;
    for(const w of walls){
      if(w.tag==='back'&&backDug)continue;if(w.tag==='levdoor'&&r9ok)continue;if(w.tag==='finaldoor'&&door11Open)continue;if(w.tag==='r22door'&&r22ok)continue;if(w.tag==='r23door'&&r23ok)continue;
      if(px+player.r>w.x&&px-player.r<w.x+w.w&&py+player.r>w.y&&py-player.r<w.y+w.h)return true;
    }
    if(inR(5,px)&&px+player.r>BLOCK6.x&&px-player.r<BLOCK6.x+BLOCK6.w&&py+player.r>BLOCK6.y&&py-player.r<BLOCK6.y+BLOCK6.h)return true;
    return false;
  }
  if(!col(nx,player.y))player.x=nx;if(!col(player.x,ny))player.y=ny;
  // Sokoban block push in R6
  if(inR(5,player.x)){
    const bc={x:BLOCK6.x+BLOCK6.w/2,y:BLOCK6.y+BLOCK6.h/2};
    const bd=dist(player.x,player.y,bc.x,bc.y);
    if(bd<player.r+40){// generous contact zone — covers diagonal approach too
      const edx=bc.x-player.x,edy=bc.y-player.y;
      const pushX=Math.abs(edx)>Math.abs(edy)?Math.sign(edx):0;
      const pushY=Math.abs(edx)>Math.abs(edy)?0:Math.sign(edy);
      const speed=140*dt;// frame-rate independent, noticeably faster
      const nbx=BLOCK6.x+pushX*speed,nby=BLOCK6.y+pushY*speed;
      if(!blockCol(nbx,nby)){BLOCK6.x=nbx;BLOCK6.y=nby;}
      if(!r6ok){const allOk=PIL6.every(p=>{const tip=sTip(p.x,p.y,bc.x,bc.y,140);const goal=sTip(p.x,p.y,BLOCK6_GOAL.x+BLOCK6.w/2,BLOCK6_GOAL.y+BLOCK6.h/2,140);return dist(tip.x,tip.y,goal.x,goal.y)<38;});if(allOk){r6ok=true;solvedRooms.add(5);}}

      if(p.fixed)return;
      const pd=dist(player.x,player.y,p.x,p.y);
      if(pd<player.r+22){
        const edx=p.x-player.x,edy=p.y-player.y,len=Math.hypot(edx,edy)||1;

  if(r13fl>0)r13fl=Math.max(0,r13fl-dt*2.5);
  if(r15fl>0)r15fl=Math.max(0,r15fl-dt*2.5);
  if(r18fl>0)r18fl=Math.max(0,r18fl-dt*2.5);

  }

  // R14 Salle Géomantique — the three daughters' age riddle
  if(ri===13){
    drawOpening({...R14BURN},'burn');
    const geoCol='#b5766a';// amber-rose — new to the palette
    // three figures suggesting daughters of different height, near the door
    [0,1,2].forEach(i=>{
      const fx=R14_DOOR.x-60+i*60,fy=R14_DOOR.y+70;
      const h=14+i*6;
      ctx.save();
      const[sx,sy]=w2s(fx,fy);
      ctx.strokeStyle=r14ok?'#3a6b3a':geoCol;ctx.lineWidth=2*DPR;
      ctx.beginPath();ctx.arc(sx,sy-h*DPR,5*DPR,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(sx,sy-h*DPR+5*DPR);ctx.lineTo(sx,sy);ctx.stroke();
      ctx.restore();
    });
    G(r14ok?'✓':'☩',R14_DOOR.x,R14_DOOR.y,r14ok?'#3a6b3a':'#8a7455',36);
    if(!r14ok&&dist(player.x,player.y,R14_DOOR.x,R14_DOOR.y)<100)G('[E] leurs âges',R14_DOOR.x,R14_DOOR.y-46,'rgba(201,168,216,.7)',13);
  }

  // R15 Salle des Sphères
  if(ri===14){
    drawOpening({...R15BURN},'burn');
    // orbit ring, only visible once solved
    if(r15ok){const[csx,csy]=w2s(R15c.x,R15c.y);ctx.save();ctx.strokeStyle='rgba(212,161,90,.5)';ctx.lineWidth=1.5*DPR;ctx.beginPath();ctx.arc(csx,csy,R15R*DPR,0,Math.PI*2);ctx.stroke();ctx.restore();}
    PLANETS15.forEach(p=>{
      const done=!r15ok&&R15_ORDER.indexOf(p.k)<r15prog;
      G(p.sym,p.x,p.y,r15ok?'#3a6b3a':(done?'#3a6b3a':p.col),36);
    });
    if(r15fl>.01){ctx.save();ctx.fillStyle=`rgba(122,46,30,${r15fl*.25})`;ctx.fillRect(0,0,W,H);ctx.restore();}
  }

  // ── R16 La Balance
  if(ri===15){
    drawOpening({...R16BURN},'burn');
    const sum=METALS16.filter(x=>x.on).reduce((s,x)=>s+x.val,0);
    const tilt=clamp((sum-R16_TARGET)*3,-40,40);
    const[psx,psy]=w2s(R16_PAN.x,R16_PAN.y);
    ctx.save();
    ctx.strokeStyle='rgba(90,74,53,.7)';ctx.lineWidth=2.5*DPR;
    ctx.beginPath();ctx.moveTo(psx,psy-60*DPR);ctx.lineTo(psx,psy+60*DPR);ctx.stroke();
    ctx.save();ctx.translate(psx,psy);ctx.rotate(tilt*Math.PI/180);
    ctx.beginPath();ctx.moveTo(-90*DPR,0);ctx.lineTo(90*DPR,0);ctx.stroke();
    ctx.strokeStyle='rgba(90,74,53,.5)';ctx.lineWidth=1.5*DPR;
    ctx.beginPath();ctx.moveTo(-90*DPR,0);ctx.lineTo(-90*DPR,26*DPR);ctx.moveTo(90*DPR,0);ctx.lineTo(90*DPR,26*DPR);ctx.stroke();
    ctx.restore();ctx.restore();
    G(r16ok?'✓':String(sum),R16_PAN.x,R16_PAN.y-90,r16ok?'#3a6b3a':'rgba(201,168,216,.7)',20);
    METALS16.forEach(m=>{
      G(m.sym,m.x,m.y,m.on?'#d4a15a':'#5a4a35',36);
      if(dist(player.x,player.y,m.x,m.y)<80)G(`${m.name} (${m.val})`,m.x,m.y+36,'rgba(201,168,216,.6)',12);
    });
  }

  // ── R17 Le Cryptex
  if(ri===16){
    drawOpening({...R17BURN},'burn');
    RINGS17.forEach((ring,i)=>{
      const done=r17ok||ring.idx===RING17_TARGET[i];
      G(ring.list[ring.idx],ring.x,ring.y,done?'#3a6b3a':'#8a7455',44);
      if(dist(player.x,player.y,ring.x,ring.y)<70)G('[E]',ring.x,ring.y-50,'rgba(201,168,216,.65)',12);
      const[sx,sy]=w2s(ring.x,ring.y);ctx.save();ctx.strokeStyle='rgba(90,74,53,.4)';ctx.lineWidth=1.5*DPR;ctx.beginPath();ctx.arc(sx,sy,50*DPR,0,Math.PI*2);ctx.stroke();ctx.restore();
    });
  }

function drawBellIcon(x,y,col,sz){
  const[sx,sy]=w2s(x,y);const s=sz*DPR;
  ctx.save();ctx.translate(sx,sy);ctx.strokeStyle=col;ctx.lineWidth=Math.max(1,1.6*DPR);
  ctx.beginPath();ctx.moveTo(-s*0.06,-s*0.9);ctx.lineTo(-s*0.06,-s*0.7);ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-s*0.5,s*0.35);
  ctx.quadraticCurveTo(-s*0.5,-s*0.65,0,-s*0.68);
  ctx.quadraticCurveTo(s*0.5,-s*0.65,s*0.5,s*0.35);
  ctx.lineTo(s*0.62,s*0.5);ctx.lineTo(-s*0.62,s*0.5);ctx.closePath();ctx.stroke();
  ctx.beginPath();ctx.arc(0,s*0.68,s*0.1,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}
  // ── R18 Le Carillon
  if(ri===17){
    drawOpening({...R18BURN},'burn');
    BELLS18.forEach((b,i)=>{
      const[sx,sy]=w2s(b.x,b.y);
      if(b.pulse>0){const g=ctx.createRadialGradient(sx,sy,0,sx,sy,60*DPR*(1-b.pulse)+10*DPR);g.addColorStop(0,hexA(b.col,b.pulse*.5));g.addColorStop(1,hexA(b.col,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy,60*DPR,0,Math.PI*2);ctx.fill();}
      const done=r18ok||BELL18_ORDER.indexOf(i)<r18prog;
      drawBellIcon(b.x,b.y,done?'#3a6b3a':b.col,38);
      if(dist(player.x,player.y,b.x,b.y)<70)G('[E]',b.x,b.y-40,'rgba(201,168,216,.65)',12);
    });
    if(r18fl>.01){ctx.save();ctx.fillStyle=`rgba(122,46,30,${r18fl*.25})`;ctx.fillRect(0,0,W,H);ctx.restore();}
  }

  // ── R19 Le Bassin des Reflets
  if(ri===18){
    const[midSx]=w2s(R19_MID_X,450);
    // water strip between banks
    const[lsx]=w2s(R19_LEFT_X,450),[rsx]=w2s(R19_RIGHT_X,450);
    ctx.save();ctx.fillStyle='rgba(58,90,122,.14)';ctx.fillRect(lsx+30*DPR,0,rsx-lsx-60*DPR,H);
    ctx.strokeStyle='rgba(58,90,122,.3)';ctx.lineWidth=1*DPR;
    ctx.beginPath();ctx.moveTo(lsx+30*DPR,H*0.5);ctx.lineTo(rsx-30*DPR,H*0.5);ctx.stroke();
    ctx.restore();
    // the fixed word, engraved, on the left bank
    ctx.save();ctx.font=`${46*DPR}px 'Cormorant SC',serif`;ctx.fillStyle='#8a7455';ctx.textAlign='center';ctx.textBaseline='middle';
    const[wlx,wly]=w2s(R19_LEFT_X,300);
    ctx.fillText(R19_LEFT_WORD,wlx,wly);
    ctx.restore();
    // the mirrored reflection of that same word, upside down, across the water line
    ctx.save();
    ctx.translate(wlx,H*0.5);ctx.scale(1,-1);ctx.translate(-wlx,-(H*0.5));
    ctx.font=`${46*DPR}px 'Cormorant SC',serif`;ctx.fillStyle='rgba(138,116,85,.35)';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(R19_LEFT_WORD,wlx,wly);
    ctx.restore();
    // the player's own reflection, flipped horizontally across the pool's mid-axis
    const savedX=player.x,savedFace=player.faceDir;
    player.x=2*R19_MID_X-player.x;player.faceDir=-player.faceDir;
    ctx.save();ctx.globalAlpha=0.4;drawPlayer(0);ctx.restore();
    player.x=savedX;player.faceDir=savedFace;
    G(r19ok?'✓ '+R19_ANSWER:'☩',R19_DOOR.x,R19_DOOR.y,r19ok?'#3a6b3a':'#8a7455',32);
    if(!r19ok&&dist(player.x,player.y,R19_DOOR.x,R19_DOOR.y)<100)G('[E] le mot inversé',R19_DOOR.x,R19_DOOR.y-46,'rgba(201,168,216,.7)',13);
  }

  // ── R20 Le Cadran Solaire
  if(ri===19){
    const[csx,csy]=w2s(R20c.x,R20c.y);const R=140*DPR;
    ctx.save();ctx.strokeStyle='rgba(90,74,53,.5)';ctx.lineWidth=2*DPR;ctx.beginPath();ctx.arc(csx,csy,R,0,Math.PI*2);ctx.stroke();
    // target mark
    const tx=csx+Math.cos(R20_TARGET)*R,ty=csy+Math.sin(R20_TARGET)*R;
    ctx.fillStyle=r20ok?'#3a6b3a':'rgba(212,161,90,.6)';ctx.beginPath();ctx.arc(tx,ty,8*DPR,0,Math.PI*2);ctx.fill();
    // rotating shadow
    ctx.strokeStyle=r20ok?'#3a6b3a':'#5a4a35';ctx.lineWidth=4*DPR;
    ctx.beginPath();ctx.moveTo(csx,csy);ctx.lineTo(csx+Math.cos(r20angle)*R,csy+Math.sin(r20angle)*R);ctx.stroke();
    ctx.strokeStyle=r20ok?'#3a6b3a':'#8a6a5a';ctx.lineWidth=2.5*DPR;
    ctx.beginPath();ctx.moveTo(csx,csy);ctx.lineTo(csx+Math.cos(r20angle2)*R*0.62,csy+Math.sin(r20angle2)*R*0.62);ctx.stroke();
    ctx.restore();
    G('☉',R20c.x,R20c.y,'#d4a15a',30);
    if(dist(player.x,player.y,R20c.x,R20c.y)<160)G('[E] au bon moment',R20c.x,R20c.y-170,'rgba(201,168,216,.65)',13);
    if(r20fl>.01){ctx.save();ctx.fillStyle=`rgba(122,46,30,${r20fl*.25})`;ctx.fillRect(0,0,W,H);ctx.restore();}
    if(r20ok)G('✓',R20c.x,R20c.y+170,'#3a6b3a',30);
  }

  // ── R21 Les Bidons
  if(ri===20){
    // big jug
    const bx=R21x+150,by=450;
    ctx.save();
    const[bsx,bsy]=w2s(bx,by);
    ctx.strokeStyle='rgba(90,74,53,.7)';ctx.lineWidth=2.5*DPR;
    ctx.strokeRect(bsx-40*DPR,bsy-100*DPR,80*DPR,140*DPR);
    const bfillH=140*(jugBig/JUG_BIG_CAP);
    ctx.fillStyle='rgba(58,90,122,.4)';ctx.fillRect(bsx-40*DPR,bsy+40*DPR-bfillH*DPR,80*DPR,bfillH*DPR);
    ctx.restore();
    G(`5L (${jugBig}L)`,bx,by-120,'rgba(201,168,216,.7)',14);
    // small jug
    const sxp=R21x+750,syp=450;
    ctx.save();
    const[ssx,ssy]=w2s(sxp,syp);
    ctx.strokeStyle='rgba(90,74,53,.7)';ctx.lineWidth=2.5*DPR;
    ctx.strokeRect(ssx-30*DPR,ssy-70*DPR,60*DPR,100*DPR);
    const sfillH=100*(jugSmall/JUG_SMALL_CAP);
    ctx.fillStyle='rgba(58,90,122,.4)';ctx.fillRect(ssx-30*DPR,ssy+30*DPR-sfillH*DPR,60*DPR,sfillH*DPR);
    ctx.restore();
    G(`3L (${jugSmall}L)`,sxp,syp-90,'rgba(201,168,216,.7)',14);
    JUGS21_STATIONS.forEach(st=>{
      const near=dist(player.x,player.y,st.x,st.y)<75;
      G(near?`[E] ${st.label}`:st.label,st.x,st.y-30,near?'rgba(201,168,216,.85)':'rgba(201,168,216,.45)',near?13:12);
      G('◆',st.x,st.y,near?'#d4a15a':'rgba(90,74,53,.6)',16);
    });
    G(r21ok?'✓ 4L exactement':`cible : ${JUG_TARGET}L`,R21x+450,180,r21ok?'#3a6b3a':'rgba(201,168,216,.6)',18);
  }

function drawBookIcon(x,y,col,sz){
  const[sx,sy]=w2s(x,y);const s=sz*DPR;
  ctx.save();ctx.translate(sx,sy);ctx.strokeStyle=col;ctx.lineWidth=Math.max(1,1.5*DPR);
  ctx.beginPath();ctx.moveTo(0,-s*0.5);ctx.quadraticCurveTo(-s*0.5,-s*0.62,-s*0.55,-s*0.4);ctx.lineTo(-s*0.55,s*0.5);ctx.quadraticCurveTo(-s*0.5,s*0.38,0,s*0.5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,-s*0.5);ctx.quadraticCurveTo(s*0.5,-s*0.62,s*0.55,-s*0.4);ctx.lineTo(s*0.55,s*0.5);ctx.quadraticCurveTo(s*0.5,s*0.38,0,s*0.5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,-s*0.5);ctx.lineTo(0,s*0.5);ctx.stroke();
  ctx.restore();
}
function drawHourglassIcon(x,y,col,sz){
  const[sx,sy]=w2s(x,y);const s=sz*DPR;
  ctx.save();ctx.translate(sx,sy);ctx.strokeStyle=col;ctx.lineWidth=Math.max(1,1.6*DPR);
  ctx.beginPath();ctx.moveTo(-s*0.4,-s*0.55);ctx.lineTo(s*0.4,-s*0.55);ctx.lineTo(s*0.08,0);ctx.lineTo(s*0.4,s*0.55);ctx.lineTo(-s*0.4,s*0.55);ctx.lineTo(-s*0.08,0);ctx.closePath();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-s*0.4,-s*0.55);ctx.lineTo(s*0.4,-s*0.55);ctx.moveTo(-s*0.4,s*0.55);ctx.lineTo(s*0.4,s*0.55);ctx.stroke();
  ctx.restore();
}
  // ── R22 La Devinette de Gollum
  if(ri===21){
    drawOpening({x:R22_PEDESTAL.x,y:R22_PEDESTAL.y,r:36},'burn');
    drawBookIcon(R22_PEDESTAL.x,R22_PEDESTAL.y-60,'#8a7455',36);
    if(dist(player.x,player.y,R22_PEDESTAL.x,R22_PEDESTAL.y)<160){
      const lines=['"Cette chose toutes choses dévore : oiseaux, bêtes, arbres, fleurs ;','ronge le fer, mord l\'acier ; réduit les pierres d\'une pièce en poussière ;','tue les rois, ruine les villes et abat les hautes montagnes."'];
      lines.forEach((l,i)=>G(l,R22_PEDESTAL.x,R22_PEDESTAL.y+56+i*30,'rgba(201,168,216,.75)',16));
    }
    drawHourglassIcon(R22_DOOR.x,R22_DOOR.y,r22ok?'#3a6b3a':'#8a7455',36);
    if(!r22ok&&dist(player.x,player.y,R22_DOOR.x,R22_DOOR.y)<100)G('[E] répondre',R22_DOOR.x,R22_DOOR.y-40,'rgba(201,168,216,.7)',13);
  }

  // ── R23 La Bibliothèque
  if(ri===22){
    BOOKS23.forEach(b=>{
      drawOpening({x:b.x,y:b.y,r:30},'burn');
      G(b.title,b.x,b.y-46,'#8a7455',22);
      if(dist(player.x,player.y,b.x,b.y)<150){
        const words=b.text.split(' ');const mid=Math.ceil(words.length/2);
        const line1=words.slice(0,mid).join(' '),line2=words.slice(mid).join(' ');
        G(`"${line1}`,b.x,b.y+42,'rgba(201,168,216,.8)',15);
        G(`${line2}"`,b.x,b.y+66,'rgba(201,168,216,.8)',15);
      }
      else if(dist(player.x,player.y,b.x,b.y)<240)G('[E] lire',b.x,b.y-76,'rgba(201,168,216,.5)',13);
    });
    CODES23.forEach(c=>{
      const d=dist(player.x,player.y,c.x,c.y);
      const a=d<90?.85:.15;
      G(c.code,c.x,c.y,`rgba(212,161,90,${a})`,20);
    });
    G(r23ok?'✓':'☩',R23_DOOR.x,R23_DOOR.y,r23ok?'#3a6b3a':'#8a7455',36);
    if(!r23ok&&dist(player.x,player.y,R23_DOOR.x,R23_DOOR.y)<100)G('[E] le mot',R23_DOOR.x,R23_DOOR.y-40,'rgba(201,168,216,.7)',13);
  }

  drawGlow();drawPlayer(dt);
  if(ri===2&&!jarDone)drawDark();
  if(ri===6&&!r7ok)drawDark7();
  // R1 negative inside tear
  if(ri===0&&tear&&dist(player.x,player.y,tear.x,tear.y)<tear.r*.82){
    drawNegative(null);
    const rm1=roomOf(player.x);
    const[cx0]=w2s(rm1.x0+BD,0),[cx1]=w2s(rm1.x1-BD,0),[,cy0]=w2s(0,BD),[,cy1]=w2s(0,world.h-BD);
    ctx.save();ctx.beginPath();ctx.rect(Math.max(0,cx0),Math.max(0,cy0),Math.min(W,cx1)-Math.max(0,cx0),Math.min(H,cy1)-Math.max(0,cy0));ctx.clip();
    const px0=cx0+(cx1-cx0)*.12,py0=cy0+(cy1-cy0)*.56,px1=cx0+(cx1-cx0)*.88,py1=cy0+(cy1-cy0)*.93;
    function mp(x,y){const nx=(x-R3x)/W0,ny=(y-BD)/(world.h-2*BD);return[px0+nx*(px1-px0),py0+ny*(py1-py0)];}
    R3T.forEach(t=>{const[tx,ty]=mp(t.x,t.y);ctx.strokeStyle='rgba(212,161,90,.65)';ctx.lineWidth=1.5*DPR;ctx.beginPath();ctx.arc(tx,ty,9*DPR,0,Math.PI*2);ctx.stroke();ctx.save();ctx.font=`${13*DPR}px serif`;ctx.fillStyle='rgba(230,160,70,.88)';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🜂',tx,ty);ctx.restore();});
    // 3 baffle walls matching the actual maze
    [[220,BD,586],[370,280,world.h-280-BD],[520,BD,586],[670,280,world.h-280-BD]].forEach(([wx,wy,wh])=>{
      const[x1,y1]=mp(R3x+wx,wy),[,y2]=mp(R3x+wx,wy+wh);
      ctx.strokeStyle='rgba(201,168,216,.45)';ctx.lineWidth=2.5*DPR;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x1,y2);ctx.stroke();
    });
    const[jx,jy]=mp(jarSrc.x,jarSrc.y),[ax,ay]=mp(altar3.x,altar3.y);
    ctx.fillStyle='#8fb6d8';ctx.beginPath();ctx.arc(jx,jy,5*DPR,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d4a15a';ctx.beginPath();ctx.arc(ax,ay,5*DPR,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  if(ri===4&&dist(player.x,player.y,R5RIDDLE.x,R5RIDDLE.y)<R5RIDDLE.r*.82)
    drawNegative(['"Je coule plus facilement que la plupart des rimes ;',"j'adore tomber mais je ne peux pas grimper."]);
  if(ri===5&&dist(player.x,player.y,R6RIDDLE.x,R6RIDDLE.y)<R6RIDDLE.r*.82)
    drawNegative(["Je suis le plus lourd des quatre frères, immobile et froid par nature.","Un triangle pointant vers le bas, barré d'un trait horizontal.","Matrice des richesses, réceptacle final du Grand Œuvre.","Je donne une forme solide aux esprits volatils."]);
  if(ri===11&&dist(player.x,player.y,R12BURN.x,R12BURN.y)<R12BURN.r*.85)
    drawNegative(['ᚢ = U    ᛗ = M    ᛒ = B','ᚱ = R    ᚨ = A','Trace en runes le mot latin de l\'ombre.']);
  if(ri===12&&dist(player.x,player.y,R13BURN.x,R13BURN.y)<R13BURN.r*.85)
    drawNegative(["L'if garde son poison dans chaque aiguille.","Le sureau cru trouble le sang qui l'avale.","Le prunellier griffe et corrompt la plaie.","Une seule fleur d'épine blanche apaise le cœur sans jamais le trahir."]);
  if(ri===13&&dist(player.x,player.y,R14BURN.x,R14BURN.y)<R14BURN.r*.85)
    drawNegative(['Le produit de leurs âges fait trente-six.','Leur somme fait treize.','Il y a une aînée — une seule.']);
  if(ri===14&&dist(player.x,player.y,R15BURN.x,R15BURN.y)<R15BURN.r*.85)
    drawNegative(['Le messager précède toujours les rois.','Puis vient celle qui aime, le guerrier rouge,','le roi généreux, et le vieillard aux anneaux.']);
  if(ri===15&&dist(player.x,player.y,R16BURN.x,R16BURN.y)<R16BURN.r*.85)
    drawNegative(['Le plateau exige vingt et une parts justes.','Aucun métal seul n\'y suffit — il faut en marier plusieurs.']);
  if(ri===16&&dist(player.x,player.y,R17BURN.x,R17BURN.y)<R17BURN.r*.85)
    drawNegative(['Le premier cercle : la troisième rune.','Le second : la première lettre grecque.','Le troisième : le quatrième signe.']);
  if(ri===17&&dist(player.x,player.y,R18BURN.x,R18BURN.y)<R18BURN.r*.85)
    drawNegative(['La cloche bleue chante la première.','Puis la rouge, puis la mauve, puis la verte.']);
  if(ri===8&&dist(player.x,player.y,R9BURN.x,R9BURN.y)<R9BURN.r*.85)
    drawNegative(['Chaque geste répond à ses voisins immédiats.','Trouve la combinaison qui rend le silence total.']);

  const vg=ctx.createRadialGradient(W/2,H/2,H*.32,W/2,H/2,H*.85);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(30,20,10,.35)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}
function loop(now){const dt=Math.min(.033,(now-lastT)/1e3);lastT=now;update(dt);render(dt);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
setTimeout(()=>showTip(TIPS[0]),900);
upd();
</script>
