<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script src="precharge.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cas cliniques : le patient arrive</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--nuit:#0d1613;--panneau:#15221d;--trait:#2a3d35;--encre:#16201b;--papier:#e9eee4;--tampon:#3a5bc7;--vert:#37c48f;--texte:#dfe9e3;--doux:#8fa89b;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--nuit);color:var(--texte);font:17px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;padding:.7rem 1rem;border-bottom:1px solid var(--trait);background:var(--panneau)}
h1{font-size:1.05rem;margin:0 auto 0 0;font-weight:700}
select,button,textarea{font:inherit;color:inherit}
select{background:var(--nuit);border:1px solid var(--trait);border-radius:6px;padding:.4rem .5rem;max-width:100%}
#graine{background:var(--nuit);border:1px solid var(--trait);border-radius:6px;padding:.4rem .5rem;color:inherit;max-width:100%}
button{border:1px solid var(--trait);background:transparent;border-radius:6px;padding:.45rem .8rem;cursor:pointer}
button.main{background:var(--vert);border-color:var(--vert);color:#04150e;font-weight:700}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--vert);outline-offset:2px}
#chat{flex:1;overflow-y:auto;padding:1.2rem 1rem;display:flex;flex-direction:column;gap:.8rem;max-width:760px;width:100%;margin:0 auto}
.vide{margin:auto;text-align:center;color:var(--doux);max-width:30ch}
.ticket{align-self:center;text-align:center;border:2px dashed var(--doux);border-radius:10px;padding:.6rem 1.6rem;color:var(--doux)}
.ticket b{display:block;font-size:2rem;letter-spacing:.06em;color:var(--texte);line-height:1.1}
.m{max-width:85%;padding:.6rem .85rem;border-radius:4px 14px 14px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.patient{align-self:flex-start;background:var(--papier);color:var(--encre);box-shadow:2px 3px 0 #0006}
.eleve{align-self:flex-end;background:var(--tampon);color:#fff;border-radius:14px 4px 14px 14px}
.err{align-self:center;color:#ffb4a8;border:1px solid #7a3a30;border-radius:8px;padding:.5rem .8rem}
.debrief{border:1px solid var(--vert);border-radius:10px;padding:1rem;background:var(--panneau);white-space:pre-wrap}
details{border:1px solid var(--trait);border-radius:10px;padding:.6rem .9rem;background:var(--panneau)}
details p{margin:.5rem 0;white-space:pre-wrap}
form{display:flex;gap:.6rem;padding:.7rem 1rem;border-top:1px solid var(--trait);background:var(--panneau);padding-bottom:max(.7rem,env(safe-area-inset-bottom))}
textarea{flex:1;resize:none;background:var(--nuit);border:1px solid var(--trait);border-radius:8px;padding:.5rem .7rem;max-height:30vh}
#hint{display:flex;align-items:center;gap:.3rem;color:#f2c14e;border-color:#5b4a1d}
#hc{font-weight:700;min-width:.6em}
.indice{border-left:4px solid #f2c14e}
.indice::before{content:"Indice";display:block;font-size:.8rem;font-weight:700;color:#8a6a0e;margin-bottom:.1rem}
dialog{border:1px solid var(--trait);border-radius:12px;background:var(--panneau);color:var(--texte);padding:0;width:min(720px,94vw);max-height:90dvh}
dialog::backdrop{background:#000a}
.dh{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.6rem .8rem;border-bottom:1px solid var(--trait)}
.dh button.on{border-color:var(--vert);color:var(--vert)}.dh .x{margin-left:auto}
.feuille{margin:.8rem;background:#f3f5f2;color:#1b2420;border-radius:3px;padding:1rem 1.2rem;box-shadow:0 2px 0 #0007;overflow-x:auto}
.fh{display:flex;justify-content:space-between;gap:1rem;border-bottom:3px solid var(--tampon);padding-bottom:.5rem;margin-bottom:.7rem}
.fh small,.pied{color:#5b6a63}.pied{margin-top:.8rem;font-size:.8rem}
.feuille table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.feuille th{text-align:left;font-size:.85rem;color:#5b6a63;border-bottom:1px solid #c9d2cc}
.feuille td{padding:.25rem .5rem .25rem 0;border-bottom:1px dotted #c9d2cc}.feuille td.r{font-weight:700}
.rx li{margin:.5rem 0}
#gauge{display:flex;align-items:center;gap:.7rem;padding:.35rem 1rem;background:var(--panneau);border-bottom:1px solid var(--trait);font-size:.9rem;color:var(--doux)}
#gauge>div{flex:1;max-width:260px;height:8px;border-radius:4px;background:var(--nuit);overflow:hidden}#gbar{display:block;height:100%;width:0;background:var(--vert);transition:width .4s}
#cf{padding:.8rem 1rem}#cf label{display:block;margin:.5rem 0 .1rem;color:var(--doux);font-size:.9rem}#cf input,#cf select{width:100%;background:var(--nuit);border:1px solid var(--trait);border-radius:6px;padding:.4rem .5rem;color:inherit;font:inherit}
.res{margin-top:.9rem;font-size:1.3rem;font-weight:700;color:var(--vert)}
.ping{border-color:var(--vert)!important;color:var(--vert);font-weight:700}
#micro{display:flex;align-items:center}#micro[hidden]{display:none}#micro.rec{color:#fff;background:#c0392b;border-color:#c0392b;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.6}}button.bdpmb{font-size:.7rem;padding:0 .35rem;border:1px solid #999;border-radius:4px;background:transparent;color:#555;cursor:pointer;vertical-align:middle}#cf iframe{width:100%;height:68vh;border:0;border-radius:6px;background:#fff}
#mdl{color:var(--doux);font-size:.75rem;font-weight:400;margin-left:.5rem}
#dlg{width:min(1000px,96vw)}
#zoom{padding:0;border:0;background:#000;max-width:98vw;max-height:98vh;overflow:auto}
#zoom img{display:block;max-width:96vw;max-height:94vh;margin:auto;cursor:zoom-in}#zoom img.full{max-width:none;max-height:none;cursor:zoom-out}
#zclose{position:sticky;top:.4rem;float:right;margin:.4rem;z-index:2;background:#000c;color:#fff}
.feuille img[data-zoom]{cursor:zoom-in}
#wrap{flex:1;display:flex;min-height:0;position:relative}
#col{flex:1;display:flex;flex-direction:column;min-width:0}
#stage{position:relative;flex:0 0 50%;max-width:none;border-right:1px solid var(--trait);background:#13201b;overflow:hidden}
#stage.off{display:none}
#stage .tools{position:absolute;right:.6rem;top:.6rem;display:flex;flex-direction:column;gap:.4rem;z-index:5}
#stage .tools button{background:#0d1613cc;color:var(--texte);font-size:.85rem;padding:.35rem .6rem;backdrop-filter:blur(4px)}
#stage .note{position:absolute;left:.6rem;top:.7rem;right:7.5rem;color:#dfe9e3;font-size:.8rem;pointer-events:none;text-shadow:0 1px 2px #000;transition:opacity .6s}
#stage .phone{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:.6rem;color:var(--doux);text-align:center;padding:2rem}
#stage.tel .phone{display:flex}#stage.tel canvas,#stage.tel .tools .pat{display:none!important}#stage.tel{background:#1c2622!important}#stage.tel .decor,#stage.tel img.fond{display:none!important}
.geste{align-self:center;font-size:.85rem;color:var(--doux);border:1px dashed var(--trait);border-radius:20px;padding:.2rem .8rem}
#avbtn.on{border-color:var(--vert);color:var(--vert)}
@media (max-width:900px){#wrap{flex-direction:column}#stage{flex:0 0 38vh;max-width:none;border-right:0;border-bottom:1px solid var(--trait)}}
#ff{padding:.8rem 1rem}#ff label{display:block;margin:.5rem 0 .1rem;color:var(--doux);font-size:.9rem}#ff input,#ff select,#ff textarea{width:100%;background:var(--nuit);border:1px solid var(--trait);border-radius:6px;padding:.4rem .5rem;color:inherit;font:inherit;resize:vertical}
#stage .intg{position:absolute;left:8px;bottom:8px;display:flex;flex-wrap:wrap;gap:4px 10px;max-width:calc(100% - 16px);background:rgba(255,255,255,.85);border-radius:8px;padding:6px 10px;font-size:.78rem;z-index:3;color:#16241e}#stage .intg label{white-space:nowrap;cursor:pointer}#stage .intg[hidden]{display:none}
.didasc{color:var(--doux,#667);font-style:italic}
</style>
</head>
<body>
<header>
  <h1>Cas cliniques <small id="mdl" title="Modèle utilisé et délai de la dernière réponse"></small></h1>
  <select id="pop" aria-label="Parcours"><option value="">Tous les parcours</option><option value="officine">Officine</option><option value="hospitalier">Hospitalier</option><option value="industrie_recherche">Industrie et recherche</option><option value="medecine">Médecine</option></select>
  <select id="theme" aria-label="Thème"></select>
  <input id="graine" aria-label="Numéro de cas ou graine" placeholder="Cas (DI004…) ou graine" size="16" autocomplete="off">
  <select id="prof" aria-label="Profil du patient"><option value="">Patient neutre</option><option value="presse">Pressé</option><option value="bavard">Bavard</option><option value="anxieux">Anxieux</option><option value="observance">Suit mal son traitement</option><option value="*">Profil au hasard</option></select>
  <button id="new" class="main" disabled>Patient suivant</button>
  <button id="fichebtn" disabled>Fiche patient</button>
  <button id="calcbtn">Outils</button>
  <button id="docbtn" disabled>Documents <span id="dc"></span></button>
  <button id="end" disabled>Terminer et débriefer</button>
  <button id="avbtn" class="on" title="Afficher ou masquer le patient en 3D">Patient 3D</button>
</header>
<div id="gauge" hidden><div><i id="gbar"></i></div><span id="gtxt"></span></div>
<div id="wrap">
<section id="stage" aria-label="Patient en 3D"><div class="tools"><button id="mute" type="button" title="Voix du patient">🔊 Voix</button><button id="bp" class="pat" type="button" disabled hidden style="display:none">Prendre la tension</button><button id="bpm" class="pat" type="button" hidden>Mesurer</button><button id="bpx" class="pat" type="button" hidden>Fin de la mesure</button><button id="res" class="pat" type="button" disabled>Réserve</button><button id="eqx" class="pat" type="button" hidden>Terminer le geste</button><button id="obs" class="pat" type="button" hidden title="Approcher pour observer la lésion">Regarder de près</button><button id="j3" class="pat" type="button" hidden title="Le patient revient quelques jours plus tard">Revoir dans 3 jours</button><button id="expl" class="pat" type="button" hidden title="Exercice : expliquer la maladie et le traitement avec des mots simples (organes affichés) ; le patient pose des questions puis reformule, et vous recevez une analyse">Expliquer au patient</button><button id="int" class="pat" type="button" hidden title="Peau en transparence : organes de CorpoAtlas recalés sur le patient ou la patiente">Voir l'intérieur</button></div><div class="intg" id="intg" hidden></div><div class="phone"><div style="font-size:2.5rem">☎</div><div>Échange avec un professionnel : pas de patient en face.</div></div><div class="note" id="avnote">Chargement du patient…</div></section>
<div id="col">
<main id="chat" aria-live="polite"><p class="vide">Choisissez un thème, puis appelez le premier patient.</p></main>
<form id="f"><button type="button" id="hint" disabled aria-label="Demander un indice" title="Indice : le patient lâche une information utile"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"/></svg><span id="hc"></span></button><textarea id="in" rows="1" placeholder="Votre réponse au patient" aria-label="Message" disabled></textarea><button type="button" id="micro" hidden title="Dicter (reconnaissance vocale locale)" aria-label="Dicter"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg></button><button id="send" class="main" disabled>Envoyer</button></form>
</div>
</div>
<dialog id="dlg" aria-label="Documents du patient"><div class="dh" id="tabs"></div><div id="doc"></div></dialog>
<dialog id="calc" aria-label="Calculateurs"><div class="dh"><select id="csel"></select><button class="x" id="cclose">Fermer</button></div><div id="cf"></div></dialog>
<dialog id="zoom" aria-label="Agrandissement du document"><button id="zclose" type="button">Fermer</button><img id="zimg" alt="" title="Cliquer pour passer en taille réelle"></dialog>
<dialog id="fiche" aria-label="Fiche patient"><div class="dh"><b>Ma fiche patient</b><button class="x" id="fclose" type="button">Fermer</button></div><div id="ff"></div></dialog>

<script src="cas-xlsx.js"></script>
<script src="bdpm.js"></script>
<script src="voix/voix-locale.js"></script>
<script src="imagerie/visionneuse.js"></script>
<script src="scorm.js"></script>
<script>
const WORKER = 'https://cas-cliniques.alterpaces1.workers.dev/';
const SECRET = 'rxtalkcase';             // = secret APP_SECRET du worker
const DATA = 'cas_cliniques_complet.xlsx'; // classeur des cas, à placer à côté de cette page (source à trier et corriger dans Excel)
const DATA_SECOURS = 'cas_cliniques.json'; // utilisé seulement si le classeur est absent
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const fmt = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]{1,300})\*(?!\*)/g, '$1<i class="didasc">$2</i>');   // *soupire* : didascalie en italique
let pending = [];   // gestes du pharmacien (tension, objets) transmis avec le prochain message
let db, cas, hist = [], busy = false, over = false, profil = '', points = null, got = new Set(), cv = 0, unlocked = new Set(), notes = {}, fiche = {};
var auLit = (c) => !!c && c.pop === 'hospitalier' && /vous échangez avec (?:la patiente|le patient)|visite au lit|au lit du patient/i.test(c.enonce || '');   // cas PARHAF hospitaliers : le pharmacien parle au patient dans sa chambre
var popDe = (c) => (auLit(c) ? 'hospitalier_lit' : (c && c.pop) || 'officine');
const POPS = { officine: { ticket: "Un patient entre à l'officine", open: "(Le patient entre à l'officine et prend la parole : dis ta première phrase.)" }, hospitalier_lit: { ticket: "Visite au lit d'un patient hospitalisé", open: "(Le pharmacien hospitalier entre dans la chambre ; le patient, couché dans son lit, prend la parole : dis ta première phrase.)" }, hospitalier: { ticket: "Appel d'un service à la pharmacie hospitalière", open: "(Le téléphone de la pharmacie hospitalière sonne : le soignant prend la parole et expose sa demande en une ou deux phrases.)" }, medecine: { ticket: "Un patient entre dans le cabinet de consultation", open: "(Le patient entre dans le cabinet et prend la parole : dis ta première phrase.)" }, industrie_recherche: { ticket: 'Sollicitation au laboratoire', open: "(Un collègue vous sollicite : il prend la parole et expose sa demande en une ou deux phrases.)" } };
const PL = { presse: 'pressé', bavard: 'bavard', anxieux: 'anxieux', observance: 'suit mal son traitement' };

function add(cls, html) { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; $('chat').append(d); d.scrollIntoView({ block: 'end' }); return d; }
function lock(on) { busy = on; $('send').disabled = $('in').disabled = on || over || !cas; $('new').disabled = on || !db; $('end').disabled = on || over || hist.length < 3;
  $('hint').disabled = on || over || hist.length < 2; const n = hist.filter((m) => m.content === '(indice demandé)').length; $('hc').textContent = n || '';
  $('fichebtn').disabled = !cas; if (window.AV) AV.lock(on || over || !cas); const nd = unlocked.size; $('docbtn').disabled = !nd; $('dc').textContent = nd || ''; }

let lastModel = '', lastFt = 0;
/* Version hors ligne (index_hors_ligne.html, servie par llama-server) : le worker tourne dans la page, le modèle sur le PC. */
let workerLocal = null;
async function horsLigne(body) {
  const H = window.HORS_LIGNE; workerLocal = workerLocal || (await import('./cas-worker.js')).default;
  const env = { APP_SECRET: 'local', LOCAL_URL: new URL(H.api || '/v1/chat/completions', location.href).href, LOCAL_MODEL: H.modele || 'local', MODELS: 'pc:' + (H.modele || 'local') };
  return workerLocal.fetch(new Request(location.href, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-App-Secret': 'local' }, body: JSON.stringify(body) }), env);
}
const IA = (() => { try { const q = new URLSearchParams(location.search).get('ia'); if (q) localStorage.setItem('ia', q); const k = q || localStorage.getItem('ia'); return ['cloudflare', 'pc'].includes(k) ? k : ''; } catch (e) { return ''; } })();   // essai d'un fournisseur : ?ia=cloudflare | pc ; ?ia=auto pour revenir
async function ask(mode, el) {
  const t0 = performance.now();
  const body = { mode, avatar: !!window.AV, pop: popDe(cas), cas: mode === 'chat' ? { enonce: cas.enonce, docs: (cas.documents || []).map(docTitle), fiche: cas.fiche || null } : { enonce: cas.enonce, questions: cas.questions, points: points || [], interactions: (cas.connaissances || {}).interactions || [], notes: Object.entries(notes).filter(([, v]) => v.trim()).map(([doc, texte]) => ({ doc, texte })), docs_etat: (cas.documents || []).map((d, i) => ({ titre: docTitle(d), ouvert: unlocked.has(i) })), fiche_saisie: fiche, fiche_ref: cas.fiche || null }, profil, messages: hist, ia: IA || undefined };
  const r = window.HORS_LIGNE ? await horsLigne(body) : await fetch(WORKER, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-App-Secret': SECRET }, body: JSON.stringify(body) });
  if (mode === 'chat') { lastModel = r.headers.get('X-Model') || ''; lastFt = 0; const es = r.headers.get('X-Essais'); if (es) { console.info('Worker :', es); $('mdl').title = es; } }   // modèles essayés et temps (survol de la ligne du modèle)
  if (!r.ok) { let m = 'Erreur ' + r.status; try { const j = await r.json(); m = j.error + (j.details ? ' (' + j.details.join(', ') + ')' : ''); } catch {} throw new Error(m); }
  let out = '';
  if (!(r.headers.get('content-type') || '').includes('event-stream')) {
    const j = await r.json(); out = (j.choices && j.choices[0].message.content) || ''; el.innerHTML = fmt(vis(out)); return out;
  }
  const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '';
  for (;;) {
    const { done, value } = await rd.read(); if (done) break;
    buf += dec.decode(value, { stream: true }); const lines = buf.split('\n'); buf = lines.pop();
    for (const l of lines) {
      if (!l.startsWith('data:')) continue; const d = l.slice(5).trim(); if (d === '[DONE]') continue;
      try { const t = JSON.parse(d).choices[0].delta.content; if (t) { if (!lastFt && mode === 'chat') lastFt = performance.now() - t0; out += t; el.innerHTML = fmt(vis(out)); el.scrollIntoView({ block: 'end' }); } } catch {}
    }
  }
  if (!out.trim()) throw new Error('Réponse vide : réessayez.');
  return out;
}

async function turn(mode, cls) {
  lock(true); const el = add(cls, '…');
  try { const t0 = performance.now(); const out = await ask(mode, el); if (mode === 'chat') $('mdl').textContent = (lastModel || '?') + ' : 1er mot ' + (lastFt / 1000).toFixed(1) + ' s, total ' + ((performance.now() - t0) / 1000).toFixed(1) + ' s'; if (mode === 'chat') { hist.push({ role: 'assistant', content: out }); cover(); unlockFrom(out); if (window.AV) AV.reply(out, cls.includes('indice')); } return out; }
  catch (e) { el.remove(); add('err', esc(e.message)); if (mode === 'chat') hist.pop(); }
  finally { lock(false); }
}

function newPatient() {
  const t = $('theme').value;
  const pool = db.cas.filter((c) => t === '*' || (t === '~' ? c.theme !== 'cardiologie_pediatrique' : c.theme === t)).filter((c) => !$('pop').value || c.pop === $('pop').value);
  const g = $('graine').value.trim(), direct = g && db.cas.find((c) => c.id.toLowerCase() === g.toLowerCase());
  let rng = Math.random; /* numéro de cas : ce cas ; autre texte : tirage reproductible (même graine = même cas et même profil) */
  if (g && !direct) { let sd = [...g].reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) >>> 0, 7) % 2147483646 + 1; rng = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647; }; }
  if (!pool.length && !direct) { $('chat').innerHTML = '<p class="vide">Aucun cas pour ce parcours et ce thème.</p>'; return; }
  cas = direct || pool[Math.floor(rng() * pool.length)]; over = false;
  const pv = $('prof').value; profil = pv === '*' ? ['presse', 'bavard', 'anxieux', 'observance', ''][Math.floor(rng() * 5)] : pv;
  points = null; got = new Set(); unlocked = new Set(); notes = {}; fiche = {}; (cas.documents || []).forEach((d, i) => { if (d.libre) unlocked.add(i); }); setTimeout(() => lock(busy), 0); $('docbtn').classList.remove('ping'); const k = ++cv; gauge();
  setTimeout(() => ask('checklist', document.createElement('div')).then((t) => { const a = arr(t); if (a && k === cv) { points = a.map(String).slice(0, 10); gauge(); } }).catch(() => {}), 0);
  const lib = (db.meta.themes.find((x) => x.id === cas.theme) || {}).libelle || '';
  $('chat').innerHTML = ''; add('ticket', POPS[popDe(cas)].ticket + '<b>' + cas.id + '</b>' + esc(lib));
  hist = [{ role: 'user', content: POPS[popDe(cas)].open }];
  if (window.AV) AV.newCase(cas, profil);
  pending = [];
  turn('chat', 'm patient');
}

$('f').onsubmit = async (e) => {
  e.preventDefault(); const t = $('in').value.trim(); if (!t || busy || over || !cas) return;
  $('in').value = ''; hist.push({ role: 'user', content: (pending.length ? pending.join(' ') + '\n' : '') + t }); pending = []; window.nEleve = (window.nEleve || 0) + 1; window.dernierEleve = t; (window.msgsEleve = window.msgsEleve || []).push(t); add('m eleve', fmt(t));
  await turn('chat', 'm patient');
};
$('in').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('f').requestSubmit(); } };
$('hint').onclick = async () => {
  if (busy || over || hist.length < 2) return;
  hist.push({ role: 'user', content: '(indice demandé)' }); await turn('chat', 'm patient indice');

      const opened = await EQ.open(id, { ...v, plaie: plaieDuCas(cas), plaiePeinte: !!(A && A.peindrePlaie && A._skin), pouls: (cas && cas.constantes && cas.constantes.pouls) || v.pouls, mast: mast || 'gauche', ...(id === 'prothese_mammaire' && mast === 'droite' ? { ok: { prothese: ['sein_D'] } } : {}) });
      $('eqx').hidden = !opened;
    });
  };
  RS = createReserve($('wrap'), { base: BASE + 'equip/', draco: window.AVATAR_DRACO }); window.RS = RS;
  $('eqx').onclick = () => { EQ.close(); A.debout(); $('eqx').hidden = true; };
  $('avnote').textContent = cas ? '' : 'Appelez un patient pour commencer.';
  if (cas) await applyCase(); if (queue) { speak(queue); queue = null; }
  window.ficheAtlas = async (k) => { try { await chargerPeau(BASE + 'peau.json'); } catch (e) {} return ficheAtlas(k); };
  window.dispatchEvent(new Event('avatar-ready'));
} catch (e) { $('avnote').textContent = 'Patient 3D indisponible (' + e.message + ').'; console.error(e); }
</script>
</body>
</html>
