<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cas cliniques : le patient arrive</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--nuit:#0d1613;--panneau:#15221d;--trait:#2a3d35;--encre:#16201b;--papier:#e9eee4;--tampon:#3a5bc7;--vert:#37c48f;--texte:#dfe9e3;--doux:#8fa89b;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--nuit);color:var(--texte);font:17px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;padding:.7rem 1rem;border-bottom:1px solid var(--trait);background:var(--panneau)}
h1{font-size:1.05rem;margin:0 auto 0 0;font-weight:700}
select,button,textarea{font:inherit;color:inherit}
select{background:var(--nuit);border:1px solid var(--trait);border-radius:6px;padding:.4rem .5rem;max-width:100%}
button{border:1px solid var(--trait);background:transparent;border-radius:6px;padding:.45rem .8rem;cursor:pointer}
button.main{background:var(--vert);border-color:var(--vert);color:#04150e;font-weight:700}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--vert);outline-offset:2px}
#chat{flex:1;overflow-y:auto;padding:1.2rem 1rem;display:flex;flex-direction:column;gap:.8rem;max-width:760px;width:100%;margin:0 auto}
.vide{margin:auto;text-align:center;color:var(--doux);max-width:30ch}
.ticket{align-self:center;text-align:center;border:2px dashed var(--doux);border-radius:10px;padding:.6rem 1.6rem;color:var(--doux)}
.ticket b{display:block;font-size:2rem;letter-spacing:.06em;color:var(--texte);line-height:1.1}
.m{max-width:85%;padding:.6rem .85rem;border-radius:4px 14px 14px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.patient{align-self:flex-start;background:var(--papier);color:var(--encre);box-shadow:2px 3px 0 #0006}
.eleve{align-self:flex-end;background:var(--tampon);color:#fff;border-radius:14px 4px 14px 14px}
.err{align-self:center;color:#ffb4a8;border:1px solid #7a3a30;border-radius:8px;padding:.5rem .8rem}
.debrief{border:1px solid var(--vert);border-radius:10px;padding:1rem;background:var(--panneau);white-space:pre-wrap}
details{border:1px solid var(--trait);border-radius:10px;padding:.6rem .9rem;background:var(--panneau)}
details p{margin:.5rem 0;white-space:pre-wrap}
form{display:flex;gap:.6rem;padding:.7rem 1rem;border-top:1px solid var(--trait);background:var(--panneau);padding-bottom:max(.7rem,env(safe-area-inset-bottom))}
textarea{flex:1;resize:none;background:var(--nuit);border:1px solid var(--trait);border-radius:8px;padding:.5rem .7rem;max-height:30vh}
#hint{display:flex;align-items:center;gap:.3rem;color:#f2c14e;border-color:#5b4a1d}
#hc{font-weight:700;min-width:.6em}
.indice{border-left:4px solid #f2c14e}
.indice::before{content:"Indice";display:block;font-size:.8rem;font-weight:700;color:#8a6a0e;margin-bottom:.1rem}
dialog{border:1px solid var(--trait);border-radius:12px;background:var(--panneau);color:var(--texte);padding:0;width:min(720px,94vw);max-height:90dvh}
dialog::backdrop{background:#000a}
.dh{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.6rem .8rem;border-bottom:1px solid var(--trait)}
.dh button.on{border-color:var(--vert);color:var(--vert)}.dh .x{margin-left:auto}
.feuille{margin:.8rem;background:#f3f5f2;color:#1b2420;border-radius:3px;padding:1rem 1.2rem;box-shadow:0 2px 0 #0007;overflow-x:auto}
.fh{display:flex;justify-content:space-between;gap:1rem;border-bottom:3px solid var(--tampon);padding-bottom:.5rem;margin-bottom:.7rem}
.fh small,.pied{color:#5b6a63}.pied{margin-top:.8rem;font-size:.8rem}
.feuille table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.feuille th{text-align:left;font-size:.85rem;color:#5b6a63;border-bottom:1px solid #c9d2cc}
.feuille td{padding:.25rem .5rem .25rem 0;border-bottom:1px dotted #c9d2cc}.feuille td.r{font-weight:700}
.rx li{margin:.5rem 0}
#gauge{display:flex;align-items:center;gap:.7rem;padding:.35rem 1rem;background:var(--panneau);border-bottom:1px solid var(--trait);font-size:.9rem;color:var(--doux)}
#gauge>div{flex:1;max-width:260px;height:8px;border-radius:4px;background:var(--nuit);overflow:hidden}#gbar{display:block;height:100%;width:0;background:var(--vert);transition:width .4s}
#cf{padding:.8rem 1rem}#cf label{display:block;margin:.5rem 0 .1rem;color:var(--doux);font-size:.9rem}#cf input,#cf select{width:100%;background:var(--nuit);border:1px solid var(--trait);border-radius:6px;padding:.4rem .5rem;color:inherit;font:inherit}
.res{margin-top:.9rem;font-size:1.3rem;font-weight:700;color:var(--vert)}
.ping{border-color:var(--vert)!important;color:var(--vert);font-weight:700}
#cf iframe{width:100%;height:68vh;border:0;border-radius:6px;background:#fff}
#mdl{color:var(--doux);font-size:.75rem;font-weight:400;margin-left:.5rem}
#dlg{width:min(1000px,96vw)}
#zoom{padding:0;border:0;background:#000;max-width:98vw;max-height:98vh;overflow:auto}
#zoom img{display:block;max-width:96vw;max-height:94vh;margin:auto;cursor:zoom-in}#zoom img.full{max-width:none;max-height:none;cursor:zoom-out}
#zclose{position:sticky;top:.4rem;float:right;margin:.4rem;z-index:2;background:#000c;color:#fff}
.feuille img[data-zoom]{cursor:zoom-in}
#ff{padding:.8rem 1rem}#ff label{display:block;margin:.5rem 0 .1rem;color:var(--doux);font-size:.9rem}#ff input,#ff select,#ff textarea{width:100%;background:var(--nuit);border:1px solid var(--trait);border-radius:6px;padding:.4rem .5rem;color:inherit;font:inherit;resize:vertical}
</style>
</head>
<body>
<header>
  <h1>Cas cliniques <small id="mdl" title="Modèle utilisé et délai de la dernière réponse"></small></h1>
  <select id="pop" aria-label="Parcours"><option value="">Tous les parcours</option><option value="officine">Officine</option><option value="hospitalier">Hospitalier</option><option value="industrie_recherche">Industrie et recherche</option></select>
  <select id="theme" aria-label="Thème"></select>
  <select id="prof" aria-label="Profil du patient"><option value="">Patient neutre</option><option value="presse">Pressé</option><option value="bavard">Bavard</option><option value="anxieux">Anxieux</option><option value="observance">Suit mal son traitement</option><option value="*">Profil au hasard</option></select>
  <button id="new" class="main" disabled>Patient suivant</button>
  <button id="fichebtn" disabled>Fiche patient</button>
  <button id="calcbtn">Outils</button>
  <button id="docbtn" disabled>Documents <span id="dc"></span></button>
  <button id="end" disabled>Terminer et débriefer</button>
</header>
<div id="gauge" hidden><div><i id="gbar"></i></div><span id="gtxt"></span></div>
<main id="chat" aria-live="polite"><p class="vide">Choisissez un thème, puis appelez le premier patient.</p></main>
<dialog id="dlg" aria-label="Documents du patient"><div class="dh" id="tabs"></div><div id="doc"></div></dialog>
<dialog id="calc" aria-label="Calculateurs"><div class="dh"><select id="csel"></select><button class="x" id="cclose">Fermer</button></div><div id="cf"></div></dialog>
<dialog id="zoom" aria-label="Agrandissement du document"><button id="zclose" type="button">Fermer</button><img id="zimg" alt="" title="Cliquer pour passer en taille réelle"></dialog>
<dialog id="fiche" aria-label="Fiche patient"><div class="dh"><b>Ma fiche patient</b><button class="x" id="fclose" type="button">Fermer</button></div><div id="ff"></div></dialog>
<form id="f"><button type="button" id="hint" disabled aria-label="Demander un indice" title="Indice : le patient lâche une information utile"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"/></svg><span id="hc"></span></button><textarea id="in" rows="1" placeholder="Votre réponse au patient" aria-label="Message" disabled></textarea><button id="send" class="main" disabled>Envoyer</button></form>
<script>
const WORKER = 'https://cas-cliniques.alterpaces1.workers.dev/';
const SECRET = 'rxtalkcase';             // = secret APP_SECRET du worker
const DATA = 'cas_cliniques.json';        // à placer à côté de cette page
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const fmt = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
let db, cas, hist = [], busy = false, over = false, profil = '', points = null, got = new Set(), cv = 0, unlocked = new Set(), notes = {}, fiche = {};
const POPS = { officine: { ticket: "Un patient entre à l'officine", open: "(Le patient entre à l'officine et prend la parole : dis ta première phrase.)" }, hospitalier: { ticket: "Appel d'un service à la pharmacie hospitalière", open: "(Le téléphone de la pharmacie hospitalière sonne : le soignant prend la parole et expose sa demande en une ou deux phrases.)" }, industrie_recherche: { ticket: 'Sollicitation au laboratoire', open: "(Un collègue vous sollicite : il prend la parole et expose sa demande en une ou deux phrases.)" } };
const PL = { presse: 'pressé', bavard: 'bavard', anxieux: 'anxieux', observance: 'suit mal son traitement' };

function add(cls, html) { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; $('chat').append(d); d.scrollIntoView({ block: 'end' }); return d; }
function lock(on) { busy = on; $('send').disabled = $('in').disabled = on || over || !cas; $('new').disabled = on || !db; $('end').disabled = on || over || hist.length < 3;
  $('hint').disabled = on || over || hist.length < 2; const n = hist.filter((m) => m.content === '(indice demandé)').length; $('hc').textContent = n || '';
  $('fichebtn').disabled = !cas; const nd = unlocked.size; $('docbtn').disabled = !nd; $('dc').textContent = nd || ''; }

let lastModel = '', lastFt = 0;
async function ask(mode, el) {
  const t0 = performance.now();
  const body = { mode, pop: cas.pop || 'officine', cas: mode === 'chat' ? { enonce: cas.enonce, docs: (cas.documents || []).map(docTitle), fiche: cas.fiche || null } : { enonce: cas.enonce, questions: cas.questions, points: points || [], interactions: (cas.connaissances || {}).interactions || [], notes: Object.entries(notes).filter(([, v]) => v.trim()).map(([doc, texte]) => ({ doc, texte })), docs_etat: (cas.documents || []).map((d, i) => ({ titre: docTitle(d), ouvert: unlocked.has(i) })), fiche_saisie: fiche, fiche_ref: cas.fiche || null }, profil, messages: hist };
  const r = await fetch(WORKER, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-App-Secret': SECRET }, body: JSON.stringify(body) });
  if (mode === 'chat') { lastModel = r.headers.get('X-Model') || ''; lastFt = 0; }
  if (!r.ok) { let m = 'Erreur ' + r.status; try { const j = await r.json(); m = j.error + (j.details ? ' (' + j.details.join(', ') + ')' : ''); } catch {} throw new Error(m); }
  let out = '';
  if (!(r.headers.get('content-type') || '').includes('event-stream')) {
    const j = await r.json(); out = (j.choices && j.choices[0].message.content) || ''; el.innerHTML = fmt(vis(out)); return out;
  }
  const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '';
  for (;;) {
    const { done, value } = await rd.read(); if (done) break;
    buf += dec.decode(value, { stream: true }); const lines = buf.split('\n'); buf = lines.pop();
    for (const l of lines) {
      if (!l.startsWith('data:')) continue; const d = l.slice(5).trim(); if (d === '[DONE]') continue;
      try { const t = JSON.parse(d).choices[0].delta.content; if (t) { if (!lastFt && mode === 'chat') lastFt = performance.now() - t0; out += t; el.innerHTML = fmt(vis(out)); el.scrollIntoView({ block: 'end' }); } } catch {}
    }
  }
  if (!out.trim()) throw new Error('Réponse vide : réessayez.');
  return out;
}

async function turn(mode, cls) {
  lock(true); const el = add(cls, '…');
  try { const t0 = performance.now(); const out = await ask(mode, el); if (mode === 'chat') $('mdl').textContent = (lastModel || '?') + ' : 1er mot ' + (lastFt / 1000).toFixed(1) + ' s, total ' + ((performance.now() - t0) / 1000).toFixed(1) + ' s'; if (mode === 'chat') { hist.push({ role: 'assistant', content: out }); cover(); unlockFrom(out); } return out; }
  catch (e) { el.remove(); add('err', esc(e.message)); if (mode === 'chat') hist.pop(); }
  finally { lock(false); }
}

function newPatient() {
  const t = $('theme').value;
  const pool = db.cas.filter((c) => t === '*' || (t === '~' ? c.theme !== 'cardiologie_pediatrique' : c.theme === t)).filter((c) => !$('pop').value || c.pop === $('pop').value);
  if (!pool.length) { $('chat').innerHTML = '<p class="vide">Aucun cas pour ce parcours et ce thème.</p>'; return; }
  cas = pool[Math.floor(Math.random() * pool.length)]; over = false;
  const pv = $('prof').value; profil = pv === '*' ? ['presse', 'bavard', 'anxieux', 'observance', ''][Math.floor(Math.random() * 5)] : pv;
  points = null; got = new Set(); unlocked = new Set(); notes = {}; fiche = {}; $('docbtn').classList.remove('ping'); const k = ++cv; gauge();
  setTimeout(() => ask('checklist', document.createElement('div')).then((t) => { const a = arr(t); if (a && k === cv) { points = a.map(String).slice(0, 10); gauge(); } }).catch(() => {}), 0);
  const lib = (db.meta.themes.find((x) => x.id === cas.theme) || {}).libelle || '';
  $('chat').innerHTML = ''; add('ticket', POPS[cas.pop || 'officine'].ticket + '<b>' + cas.id + '</b>' + esc(lib));
  hist = [{ role: 'user', content: POPS[cas.pop || 'officine'].open }];
  turn('chat', 'm patient');
}

$('f').onsubmit = async (e) => {
  e.preventDefault(); const t = $('in').value.trim(); if (!t || busy || over || !cas) return;
  $('in').value = ''; hist.push({ role: 'user', content: t }); add('m eleve', fmt(t));
  await turn('chat', 'm patient');
};
$('in').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('f').requestSubmit(); } };
$('hint').onclick = async () => {
  if (busy || over || hist.length < 2) return;
  hist.push({ role: 'user', content: '(indice demandé)' }); await turn('chat', 'm patient indice');
};
const f = (s) => esc(String(s || ''));
function docHTML(d) {
  const pied = '<div class="pied">Document fictif à visée pédagogique' + (d.origine ? ' (' + f(d.origine) + ')' : '') + '.</div>';
  if (d.type === 'ordonnance') return '<div class="feuille"><div class="fh"><div><b>Dr ' + (f(d.medecin) || '…') + '</b></div><small>' + f(d.date) + '</small></div><p>' + f(d.patient) + '</p><ol class="rx">' +
    (d.lignes || []).map((l) => '<li><b>' + f(l.medicament) + '</b><br>' + f(l.posologie) + ' ' + f(l.duree) + '</li>').join('') + '</ol>' + pied + '</div>';
  if (d.type === 'image') return '<div class="feuille"><div class="fh"><div><b>' + f(d.titre) + '</b><br><small>' + f(d.legende) + '</small></div><small>Dossier ' + cas.id + '</small></div><div style="position:relative"><img src="' + f(d.fichier) + '" alt="' + f(d.titre) + '" title="Cliquer pour agrandir" data-zoom="1" style="width:100%;display:block">' + (d.champs || []).map((c) => '<span style="position:absolute;left:' + (+c.x || 0) + '%;top:' + (+c.y || 0) + '%;font:' + (+c.taille || 14) + 'px/1.2 cursive;color:#12308f">' + f(c.texte) + '</span>').join('') + '</div>' + pied + '</div>';
  if (d.type === 'tableau') return '<div class="feuille"><div class="fh"><div><b>' + f(d.titre) + '</b><br><small>' + f(d.sous_titre) + '</small></div><small>Dossier ' + cas.id + '</small></div><table><tr>' + (d.colonnes || []).map((c) => '<th>' + f(c) + '</th>').join('') + '</tr>' + (d.lignes || []).map((r) => '<tr>' + r.map((v) => '<td>' + f(v) + '</td>').join('') + '</tr>').join('') + '</table>' + pied + '</div>';
  if (d.type === 'compte_rendu') return '<div class="feuille"><div class="fh"><div><b>' + f(d.titre) + '</b><br><small>Compte rendu</small></div><small>Dossier ' + cas.id + '</small></div><p style="white-space:pre-wrap">' + f(d.texte) + '</p>' + pied + '</div>';
  if (d.type === 'dp') return '<div class="feuille"><div class="fh"><div><b>Dossier pharmaceutique</b><br><small>Médicaments délivrés récemment</small></div><small>Dossier ' + cas.id + '</small></div><table><tr><th>Médicament</th><th>Substance(s)</th></tr>' + (d.lignes || []).map((l) => '<tr><td>' + f(l.medicament) + '</td><td>' + f(l.substances) + '</td></tr>').join('') + '</table>' + pied + '</div>';
  const ref = (d.lignes || []).some((l) => l.ref);
  return '<div class="feuille"><div class="fh"><div><b>' + f(d.titre) + '</b><br><small>Laboratoire d\'analyses médicales</small></div><small>Dossier ' + cas.id + '</small></div><table><tr><th>Échantillon</th><th>Analyse</th><th>Résultat</th><th>Unité</th>' + (ref ? '<th>Référence</th>' : '') + '</tr>' +
    (d.lignes || []).map((l) => '<tr><td>' + f(l.ech) + '</td><td>' + f(l.analyse) + '</td><td class="r">' + f(l.resultat) + '</td><td>' + f(l.unite) + '</td>' + (ref ? '<td>' + f(l.ref) + '</td>' : '') + '</tr>').join('') + '</table>' + pied + '</div>';
}
function openDoc(i) {
  const ds = [...unlocked].sort((x, y) => x - y).map((k) => cas.documents[k]);
  $('tabs').innerHTML = ds.map((d, k) => '<button data-k="' + k + '"' + (k === i ? ' class="on"' : '') + '>' + f(d.titre || 'Ordonnance') + '</button>').join('') + '<button class="x" id="close">Fermer</button>';
  $('tabs').querySelectorAll('button[data-k]').forEach((b) => { b.onclick = () => openDoc(+b.dataset.k); });
  $('close').onclick = () => $('dlg').close(); $('doc').innerHTML = docHTML(ds[i]) + '<div style="padding:0 .8rem .8rem"><label for="note" style="color:var(--doux);font-size:.9rem">Mon analyse de ce document</label><textarea id="note" rows="3" style="width:100%" placeholder="Anomalies, valeurs à interpréter, questions à poser au patient"></textarea></div>';
  const key = docTitle(ds[i]); $('note').value = notes[key] || ''; $('note').oninput = () => { notes[key] = $('note').value; };
}
$('docbtn').onclick = () => { $('docbtn').classList.remove('ping'); openDoc(0); $('dlg').showModal(); };
$('dlg').onclick = (e) => { if (e.target === $('dlg')) $('dlg').close(); };
const arr = (t) => { try { return JSON.parse(t.match(/\[[\s\S]*\]/)[0]); } catch { return null; } };
function gauge() { $('gauge').hidden = !points; if (!points) return; $('gbar').style.width = (100 * got.size / points.length) + '%'; $('gtxt').textContent = 'Informations clés : ' + got.size + '/' + points.length; }
async function cover() { if (!points) return; const k = cv; try { const a = arr(await ask('cover', document.createElement('div'))); if (a && k === cv) { a.forEach((n) => { if (n >= 1 && n <= points.length) got.add(n); }); gauge(); } } catch {} }
const AGE = ['age', 'Âge (ans)'], KG = ['kg', 'Poids (kg)'], CM = ['cm', 'Taille (cm)'], CR = ['cr', 'Créatinine (µmol/L)'], SX = ['sx', 'Sexe', ['Homme', 'Femme']];
const CALCS = [
 ['Clairance de la créatinine (Cockcroft-Gault)', [AGE, KG, CR, SX], (v) => [(140 - v.age) * v.kg * (v.sx ? 1.04 : 1.23) / v.cr, 'mL/min']],
 ['DFG (CKD-EPI 2021)', [AGE, CR, SX], (v) => { const s = v.cr / 88.4, k = v.sx ? 0.7 : 0.9, a = v.sx ? -0.241 : -0.302; return [142 * Math.pow(Math.min(s / k, 1), a) * Math.pow(Math.max(s / k, 1), -1.2) * Math.pow(0.9938, v.age) * (v.sx ? 1.012 : 1), 'mL/min/1,73 m²']; }],
 ['IMC', [KG, CM], (v) => [v.kg / Math.pow(v.cm / 100, 2), 'kg/m²']],
 ['Surface corporelle (Mosteller)', [KG, CM], (v) => [Math.sqrt(v.kg * v.cm / 3600), 'm²']],
 ['Dose pédiatrique (mg/kg/jour)', [KG, ['mgkg', 'Dose (mg/kg/jour)'], ['n', 'Prises par jour'], ['c', 'Concentration (mg/mL)']], (v) => { const p = v.kg * v.mgkg / v.n; return [p, 'mg par prise, soit ' + (p / v.c).toFixed(1) + ' mL par prise (' + (p * v.n).toFixed(0) + ' mg/jour)']; }],
 ['mmol/L vers g/L', [['mm', 'Valeur (mmol/L)'], ['mw', 'Masse molaire (g/mol)']], (v) => [v.mm * v.mw / 1000, 'g/L']],
 ['Créatinine µmol/L vers mg/dL', [CR], (v) => [v.cr / 88.4, 'mg/dL']],
 ['Substitution générique (outil)', [], 'substitution_generique.html'],
 ['Hémogramme, repères (outil)', [], 'hemogramme_nfs.html'],
];
function calcUI(i) {
  const [, fs, run] = CALCS[i];
  if (typeof run === 'string') { $('cf').innerHTML = '<iframe src="' + run + '" title="Outil"></iframe>'; $('cf').oninput = null; return; }
  $('cf').innerHTML = fs.map(([id, lab, opt]) => '<label for="c_' + id + '">' + lab + '</label>' + (opt ? '<select id="c_' + id + '">' + opt.map((o) => '<option>' + o + '</option>').join('') + '</select>' : '<input id="c_' + id + '" type="number" step="any" inputmode="decimal">')).join('') + '<div class="res" id="cres"></div><p class="pied" style="color:var(--doux)">Résultat indicatif : se référer au RCP du médicament.</p>';
  const MAP = { age: 'age', kg: 'kg', cm: 'cm', cr: 'cr', sx: 'sexe' };
  fs.forEach(([id, , opt]) => { const v = fiche[MAP[id]], e = $('c_' + id); if (e && v) { if (opt) e.selectedIndex = v === 'Femme' ? 1 : 0; else e.value = v; } });
  const go = () => { const v = {}; fs.forEach(([id, , opt]) => { const e = $('c_' + id); v[id] = opt ? e.selectedIndex : parseFloat(e.value.replace(',', '.')); }); const r = run(v); $('cres').textContent = Number.isFinite(r[0]) ? Number(r[0].toPrecision(3)) + ' ' + r[1] : 'Renseignez tous les champs.'; };
  $('cf').oninput = go; go();
}
$('csel').innerHTML = CALCS.map((c, i) => '<option value="' + i + '">' + c[0] + '</option>').join(''); $('csel').onchange = () => calcUI(+$('csel').value);
$('calcbtn').onclick = () => { calcUI(+$('csel').value); $('calc').showModal(); }; $('cclose').onclick = () => $('calc').close();
$('calc').onclick = (e) => { if (e.target === $('calc')) $('calc').close(); };
const nrm = (s) => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
function docTitle(d) { return d.titre || 'Ordonnance'; }
function vis(s) { return s.replace(/\[DOC:[^\]]*\]/g, '').replace(/\[(?:D|DO|DOC|DOC:[^\]]*)?$/, ''); }
function unlockFrom(t) {
  for (const m of t.matchAll(/\[DOC:([^\]]+)\]/g)) (cas.documents || []).forEach((d, i) => { const a = nrm(docTitle(d)), b = nrm(m[1]); if (a.includes(b) || b.includes(a)) { if (!unlocked.has(i)) $('docbtn').classList.add('ping'); unlocked.add(i); } });
}
$('doc').addEventListener('click', (e) => { const i = e.target.closest('img[data-zoom]'); if (i) { $('zimg').src = i.src; $('zimg').className = ''; $('zoom').showModal(); } });
$('zimg').onclick = () => $('zimg').classList.toggle('full'); $('zclose').onclick = () => $('zoom').close();
$('zoom').onclick = (e) => { if (e.target === $('zoom')) $('zoom').close(); };
const FF = [['sexe', 'Sexe', ['', 'Homme', 'Femme']], ['age', 'Âge (ans)'], ['kg', 'Poids (kg)'], ['cm', 'Taille (cm)'], ['cr', 'Créatinine (µmol/L)'], ['gr', 'Grossesse ou allaitement', ['', 'Non', 'Enceinte', 'Allaite']], ['all', 'Allergies'], ['tt', 'Traitements en cours', 'area'], ['nt', 'Remarques', 'area']];
$('fichebtn').onclick = () => {
  $('ff').innerHTML = '<p style="color:var(--doux);margin:0">Notez ici ce que vous apprenez du patient. Les calculateurs se préremplissent avec ces valeurs.</p>' + FF.map(([k, l, o]) => '<label for="f_' + k + '">' + l + '</label>' + (Array.isArray(o) ? '<select id="f_' + k + '">' + o.map((x) => '<option>' + x + '</option>').join('') + '</select>' : o === 'area' ? '<textarea id="f_' + k + '" rows="2"></textarea>' : '<input id="f_' + k + '" inputmode="decimal">')).join('');
  FF.forEach(([k]) => { const e = $('f_' + k); e.value = fiche[k] || ''; e.oninput = () => { fiche[k] = e.value; }; });
  $('fiche').showModal();
};
$('fclose').onclick = () => $('fiche').close(); $('fiche').onclick = (e) => { if (e.target === $('fiche')) $('fiche').close(); };
$('new').onclick = newPatient;
$('end').onclick = async () => {
  over = true; lock(true);
  const out = await turn('eval', 'debrief');
  if (out) {
    const det = document.createElement('details');
    det.innerHTML = '<summary>Réponses attendues du cas</summary>' + (points ? '<p><b>Points clés</b>\n' + points.map((p, i) => (got.has(i + 1) ? '✔ ' : '✘ ') + esc(p)).join('\n') + '</p>' : '') + (profil ? '<p><b>Profil joué :</b> ' + PL[profil] + '</p>' : '') + (cas.questions || []).map((q) => '<p><b>' + esc(q.question) + '</b>\n' + esc(q.reponse_modele) + '</p>').join('');
    $('chat').append(det);
    const kn = cas.connaissances || {}, ms = kn.medicaments || [], it = kn.interactions || [], dc = cas.documents || [];
    const sd = document.createElement('details');
    sd.innerHTML = `<summary>Ce que l'évaluateur a consulté</summary><p><b>Médicaments repérés (fiches)</b>\n${ms.length ? ms.map((m) => esc(m.terme) + ' : ' + esc((m.substances || []).join(', '))).join('\n') : 'aucun'}</p><p><b>Interactions du thésaurus ANSM</b>\n${it.length ? it.map((i) => esc(i.entre.join(' + ')) + ' : ' + esc(i.niveau.join(' / '))).join('\n') : 'aucune détectée'}</p><p><b>Documents du cas</b>\n${dc.length ? dc.map((d, i) => esc(docTitle(d)) + (unlocked.has(i) ? ' (demandé)' : ' (non demandé)')).join('\n') : 'aucun'}</p>`;
    $('chat').append(sd); sd.scrollIntoView({ block: 'end' });
  }
  lock(false);
};

Promise.all([fetch(DATA).then((r) => r.json()), fetch('cas_qcm_pharma.json').then((r) => (r.ok ? r.json() : null)).catch(() => null)]).then(([d, x]) => {
  if (x) { d.cas = d.cas.concat(x.cas); (x.meta.themes || []).forEach((t) => { if (!d.meta.themes.find((u) => u.id === t.id)) d.meta.themes.push({ id: t.id, libelle: t.libelle, nb_cas: 0 }); }); d.meta.themes.forEach((t) => { t.nb_cas = d.cas.filter((c) => c.theme === t.id).length; }); }
  db = d;
  $('theme').innerHTML = '<option value="~">Au hasard, hors cardio pédiatrique</option><option value="*">Au hasard, tous les thèmes</option>' +
    d.meta.themes.filter((t) => t.nb_cas).map((t) => `<option value="${t.id}">${esc(t.libelle)} (${t.nb_cas})</option>`).join('');
  lock(false);
}).catch(() => { $('chat').innerHTML = '<p class="err">Impossible de charger ' + DATA + '. Placez-le à côté de la page et ouvrez la page via un serveur web (pas en file://).</p>'; });
