<!DOCTYPE html>

<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

const $ = (id) => document.getElementById(id);
const statusEl = $('status');
const log = (m) => { statusEl.textContent = m; console.log(m); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// ============================================================================
// CONFIGURATION — tout ce qu'on peut vouloir ajuster est regroupé ici
// ============================================================================
// Dossiers cherchés dans l'ordre (le premier qui contient le fichier gagne).
// Les noms avec espaces sont gérés. Le chemin est relatif à index.html.
const AUDIO_DIRS = ['./audio/', './asset/', './assets/', './assets/audio/'];
const MUSIC_FILES = ['Weightless Drift.mp3', 'Still Waters.mp3'];   // enchaînées en boucle
const AMBIENCE_FILES = { ruisseau: 'ruisseau.mp3', vague: 'vague.mp3' }; // UNE seule boucle à la fois

const VIDEO_DIRS = ['./asset/', './assets/', './assets/video/', './video/'];
const VIDEO_EXTS = ['webm', 'mp4'];   // fichiers nommés 1.webm, 2.webm, 3.webm...
const VIDEO_MAX = 12;
const VIDEO_YAW_DEG = -90;     // place le CENTRE de l'image face à l'utilisateur
const VIDEO_BRIGHTNESS = 0.85; // 1 = tel quel, <1 assombrit (aide la lisibilité du texte)
const VIDEO_LETTERBOX = 0;     // fraction à rogner en haut ET en bas (ex: 0.0556 si la vidéo
                               // 1920x1080 contient en fait du 2:1 avec des bandes noires)

const MUSIC_VOLUME = 0.4, MUSIC_FADE_SEC = 4;
const AMBIENCE_VOLUME = 0.55, AMBIENCE_FADE_SEC = 3;
const DEFAULT_AUDIO = { musicOn: true, ambienceOn: false, ambienceType: 'ruisseau' };

// Relais gratuit du pouls (téléphone → casque) : Firebase Realtime Database, offre
// gratuite sans carte bancaire. Colle ici l'URL de ta base (voir README), ex :
// 'https://mon-projet-default-rtdb.europe-west1.firebasedatabase.app'
const FIREBASE_DB_URL = 'https://pharma-yoga-default-rtdb.europe-west1.firebasedatabase.app/';

// ============================================================================
// TECHNIQUES — présentées par ce qu'elles APPORTENT, pas par leur nom technique
// ============================================================================
const TECHNIQUES = {
  coherence: {
    useCase: 'Pause calme', subtitle: 'Le bon choix par défaut, à tout moment de la journée',
    name: 'Cohérence cardiaque (5-5)',
    phases: [
      { label: 'Inspirez', type: 'grow',  dur: 5 },
      { label: 'Expirez',  type: 'shrink',dur: 5 },
    ]
  },
  extendedExhale: {
    useCase: 'Évacuer le stress', subtitle: 'Fait retomber la pression après un moment tendu',
    name: 'Respiration apaisante (4-8)',
    phases: [
      { label: 'Inspirez', type: 'grow',  dur: 4 },
      { label: 'Expirez',  type: 'shrink',dur: 8 },
    ]
  },
  fourSevenEight: {
    useCase: 'Avant de dormir', subtitle: 'Idéale pour relâcher juste avant une sieste ou le coucher',
    name: '4-7-8',
    phases: [
      { label: 'Inspirez', type: 'grow',  dur: 4 },
      { label: 'Retenez',  type: 'hold',  dur: 7 },
      { label: 'Expirez',  type: 'shrink',dur: 8 },
    ]
  },
  physiologicalSigh: {
    useCase: 'Décharge rapide', subtitle: 'Pour un coup de fatigue ou de tension immédiat, en 30 s',
    name: 'Soupir physiologique',
    phases: [
      { label: 'Inspirez',    type: 'grow',  dur: 2 },
      { label: 'Ré-inspirez', type: 'grow',  dur: 1 },
      { label: 'Expirez',     type: 'shrink',dur: 6 },
    ]
  },
  box: {
    useCase: 'Se concentrer', subtitle: 'Reprendre le contrôle avant une tâche qui demande de l\'attention',
    name: 'Respiration en carré (4-4-4-4)',
    phases: [
      { label: 'Inspirez', type: 'grow',  dur: 4 },
      { label: 'Retenez',  type: 'hold',  dur: 4 },
      { label: 'Expirez',  type: 'shrink',dur: 4 },
      { label: 'Retenez',  type: 'hold',  dur: 4 },
    ]
  },
  triangle: {
    useCase: 'Premier essai', subtitle: 'La plus simple pour découvrir la respiration guidée',
    name: 'Triangle (5-5-5)',
    phases: [
      { label: 'Inspirez', type: 'grow',  dur: 5 },
      { label: 'Retenez',  type: 'hold',  dur: 5 },
      { label: 'Expirez',  type: 'shrink',dur: 5 },
    ]
  },
};
let selectedTechnique = null;

// ============================================================================
// UTILITAIRES : tweens pilotés par la boucle de rendu
// ============================================================================
// IMPORTANT : window.requestAnimationFrame ne tourne pas pendant une session VR
// immersive (seule celle de la session XR tourne) — tout ce qui doit s'animer
// en VR est donc piloté par la boucle de rendu ci-dessous, jamais par un rAF maison.
const tweens = [];
function tween(from, to, sec, onUpdate) {
  return new Promise((resolve) => {
    tweens.push({ from, to, dur: Math.max(0.0001, sec), t: 0, onUpdate, resolve });
    onUpdate(from);
  });
}
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.t += dt;
    const k = Math.min(1, tw.t / tw.dur);
    const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    tw.onUpdate(tw.from + (tw.to - tw.from) * e);
    if (k >= 1) { tweens.splice(i, 1); tw.resolve(); }
  }
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
async function fileExists(url) {
  try { const r = await fetch(url, { method: 'HEAD', cache: 'no-store' }); return r.ok; }
  catch (e) { return false; }
}

// ============================================================================
// SCÈNE
// ============================================================================
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.05, 200);
const rig = new THREE.Group();
rig.add(camera);
scene.add(rig);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor'); // le sol réel est déjà pris en compte
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// Fond de repli (sans vidéo) : dégradé nocturne + étoiles qui scintillent
function makeSkyGradientTexture() {
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#0d2436'); g.addColorStop(0.5, '#0a1826'); g.addColorStop(1, '#050d14');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 2, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
scene.background = makeSkyGradientTexture();
scene.add(new THREE.HemisphereLight(0x6fa8d8, 0x0a1420, 0.5));
const glowLight = new THREE.PointLight(0x8fd8ff, 1.2, 8);
glowLight.position.set(0, 1.6, -1.5);
scene.add(glowLight);

// ----- Étoiles : scintillement individuel (phase/vitesse propres à chaque étoile) -----
// L'ancienne version était quasi invisible : un PointsMaterial avec atténuation par
// distance réduisait des étoiles à 40-70 m à 1-2 pixels. Ici la taille est pilotée
// en pixels par un shader dédié, avec un disque doux au lieu d'un carré.
const STAR_COUNT = 260;
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(STAR_COUNT * 3);
const starPhase = new Float32Array(STAR_COUNT);
const starSpeed = new Float32Array(STAR_COUNT);
const starSize = new Float32Array(STAR_COUNT);
for (let i = 0; i < STAR_COUNT; i++) {
  const r = 40 + Math.random() * 30;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  starPos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  starPos[i*3+1] = Math.abs(r * Math.cos(phi)) * 0.7 + 2;
  starPos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
  starPhase[i] = Math.random() * Math.PI * 2;
  starSpeed[i] = 0.4 + Math.random() * 1.4;
  starSize[i]  = 2.5 + Math.random() * 4.0;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
starGeo.setAttribute('aPhase', new THREE.BufferAttribute(starPhase, 1));
starGeo.setAttribute('aSpeed', new THREE.BufferAttribute(starSpeed, 1));
starGeo.setAttribute('aSize', new THREE.BufferAttribute(starSize, 1));
const starMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    attribute float aPhase; attribute float aSpeed; attribute float aSize;
    uniform float uTime; varying float vAlpha;
    void main() {
      float tw = 0.55 + 0.45 * sin(uTime * aSpeed + aPhase);
      vAlpha = tw;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * (0.65 + 0.35 * tw) * (200.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - vec2(0.5));
      if (d > 0.5) discard;
      float edge = smoothstep(0.5, 0.1, d);
      gl_FragColor = vec4(0.82, 0.92, 1.0, vAlpha * edge * 0.95);
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// ============================================================================
// DÉCOR VIDÉO 360° (équirectangulaire), en boucle — fichiers 1.webm, 2.webm, ...
// ============================================================================
// Une sphère vue de l'intérieur, texturée par la vidéo. (On n'utilise PAS
// scene.background : Three.js ne convertit une texture équirectangulaire qu'une
// seule fois, la vidéo resterait figée sur sa première image.)
// Note format : une vidéo 16:9 (1920x1080) est étirée sur toute la sphère, ce qui
// est correct si elle a été exportée ainsi depuis du 360° (anamorphique). Si elle
// contient du 2:1 avec des bandes noires, règle VIDEO_LETTERBOX.
let decorList = [];
let decorChoice = 'random';   // 'random' ou index (0 = vidéo n°1)
let decorIndex = -1, decorBusy = false, videoActive = false;
let decorReady = false, decorRevealed = false, decorRevealWanted = false;

const decorVideo = document.createElement('video');
decorVideo.loop = true; decorVideo.muted = true; decorVideo.playsInline = true;
decorVideo.preload = 'auto'; decorVideo.crossOrigin = 'anonymous';
decorVideo.setAttribute('playsinline', '');
decorVideo.addEventListener('ended', () => { decorVideo.currentTime = 0; decorVideo.play().catch(() => {}); }); // boucle de secours

const decorTexture = new THREE.VideoTexture(decorVideo);
decorTexture.colorSpace = THREE.SRGBColorSpace;
decorTexture.minFilter = THREE.LinearFilter; decorTexture.magFilter = THREE.LinearFilter;
decorTexture.generateMipmaps = false;
if (VIDEO_LETTERBOX > 0) { decorTexture.repeat.set(1, 1 - 2 * VIDEO_LETTERBOX); decorTexture.offset.set(0, VIDEO_LETTERBOX); }

const decorMat = new THREE.MeshBasicMaterial({
  map: decorTexture, color: new THREE.Color(VIDEO_BRIGHTNESS, VIDEO_BRIGHTNESS, VIDEO_BRIGHTNESS),
  toneMapped: false, transparent: true, opacity: 0, depthWrite: false
});
const decorGeo = new THREE.SphereGeometry(60, 64, 48);
decorGeo.scale(-1, 1, 1); // vue de l'intérieur, sans effet miroir
const decorSphere = new THREE.Mesh(decorGeo, decorMat);
decorSphere.position.set(0, 1.6, 0);
decorSphere.rotation.y = THREE.MathUtils.degToRad(VIDEO_YAW_DEG);
decorSphere.renderOrder = -10;
decorSphere.visible = false;
scene.add(decorSphere);

function setDecorFallback() {
  videoActive = false; decorReady = false; decorRevealed = false;
  decorSphere.visible = false; decorMat.opacity = 0; stars.visible = true;
}
function revealDecor() {
  decorRevealWanted = true;
  if (!decorReady || decorRevealed) return;
  decorRevealed = true;
  tween(decorMat.opacity, 1, 1.8, (v) => { decorMat.opacity = v; });
}
async function loadDecor(index, { revealNow = false } = {}) {
  if (index < 0 || !decorList.length) { setDecorFallback(); return; }
  decorBusy = true; decorReady = false; decorRevealed = false; decorRevealWanted = revealNow;
  if (decorSphere.visible && decorMat.opacity > 0.01) {
    await tween(decorMat.opacity, 0, 0.5, (v) => { decorMat.opacity = v; });
  }
  decorIndex = index;
  const ok = await new Promise((resolve) => {
    const onOk = () => { cleanup(); resolve(true); };
    const onKo = () => { cleanup(); resolve(false); };
    const cleanup = () => { decorVideo.removeEventListener('loadeddata', onOk); decorVideo.removeEventListener('error', onKo); };
    decorVideo.addEventListener('loadeddata', onOk);
    decorVideo.addEventListener('error', onKo);
    decorVideo.src = decorList[index];
    decorVideo.load();
    decorVideo.play().catch(() => {});
  });
  if (!ok) { log('Vidéo illisible : ' + decorList[index]); setDecorFallback(); decorBusy = false; return; }
  videoActive = true; decorSphere.visible = true; stars.visible = false; decorReady = true;
  decorBusy = false;
  if (decorRevealWanted) revealDecor();
}
function pickInitialDecor() {
  if (!decorList.length) return -1;
  if (decorChoice === 'random') return Math.floor(Math.random() * decorList.length);
  return Math.min(decorChoice, decorList.length - 1);
}
function nextDecor() {
  if (decorBusy || decorList.length < 2) return;
  loadDecor((decorIndex + 1) % decorList.length, { revealNow: true });
  drawHud();
}
async function discoverDecors() {
  let dir = null, ext = null;
  outer: for (const d of VIDEO_DIRS) for (const e of VIDEO_EXTS) {
    if (await fileExists(encodeURI(`${d}1.${e}`))) { dir = d; ext = e; break outer; }
  }
  if (!dir) return [];
  const list = [encodeURI(`${dir}1.${ext}`)];
  for (let i = 2; i <= VIDEO_MAX; i++) {
    let found = null;
    for (const e of VIDEO_EXTS) { const u = encodeURI(`${dir}${i}.${e}`); if (await fileExists(u)) { found = u; break; } }
    if (!found) break;
    list.push(found);
  }
  return list;
}

// ============================================================================
// SPHÈRE QUI RESPIRE + halo + particules
// ============================================================================
const MIN_SCALE = 0.55, MAX_SCALE = 1.35;
const sphereMat = new THREE.MeshStandardMaterial({
  color: 0x6fb8f0, emissive: 0x2a5a80, emissiveIntensity: 0.6,
  roughness: 0.35, metalness: 0.1, transparent: true, opacity: 0.88
});
const breathSphere = new THREE.Mesh(new THREE.SphereGeometry(0.28, 48, 32), sphereMat);
breathSphere.position.set(0, 1.5, -1.6);
breathSphere.scale.setScalar(MIN_SCALE);
scene.add(breathSphere);

function makeGlowTexture() {
  const size = 256;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0, 'rgba(140,210,255,0.55)'); g.addColorStop(1, 'rgba(140,210,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const glowTexture = makeGlowTexture();
const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: glowTexture, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
}));
glowSprite.position.copy(breathSphere.position);
glowSprite.scale.setScalar(1.4);
scene.add(glowSprite);

const BREATH_PARTICLE_COUNT = 36;
const particleGeo = new THREE.BufferGeometry();
const particlePos = new Float32Array(BREATH_PARTICLE_COUNT * 3);
const particleAngle = new Float32Array(BREATH_PARTICLE_COUNT);
const particleRadius = new Float32Array(BREATH_PARTICLE_COUNT);
const particleSeed = new Float32Array(BREATH_PARTICLE_COUNT);
for (let i = 0; i < BREATH_PARTICLE_COUNT; i++) {
  particleAngle[i] = Math.random() * Math.PI * 2;
  particleRadius[i] = 0.4 + Math.random() * 0.35;
  particleSeed[i] = Math.random();
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
const particleMat = new THREE.PointsMaterial({
  map: glowTexture, color: 0xbfe0ff, size: 0.03, transparent: true,
  opacity: 0.55, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
});
scene.add(new THREE.Points(particleGeo, particleMat));

let breathProgress01 = 0; // 0 = pleine expiration, 1 = pleine inspiration
function updateBreathParticles(t) {
  const arr = particleGeo.attributes.position.array;
  for (let i = 0; i < BREATH_PARTICLE_COUNT; i++) {
    const baseHeight = -0.15 + breathProgress01 * 0.5;
    const sway = Math.sin(t * 0.4 + particleSeed[i] * 10) * 0.04;
    const a = particleAngle[i] + t * 0.05;
    arr[i*3]   = breathSphere.position.x + Math.cos(a) * particleRadius[i];
    arr[i*3+1] = breathSphere.position.y + baseHeight + particleSeed[i] * 0.3 + sway;
    arr[i*3+2] = breathSphere.position.z + Math.sin(a) * particleRadius[i];
  }
  particleGeo.attributes.position.needsUpdate = true;
  particleMat.opacity = 0.35 + breathProgress01 * 0.35;
}

// ============================================================================
// PANNEAUX 3D (texte de respiration, aide, pouls, tutoriel)
// ============================================================================
function makePanel(w, h, pw, ph, pos) {
  const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const texture = new THREE.CanvasTexture(canvas); texture.colorSpace = THREE.SRGBColorSpace;
  const material = new THREE.MeshBasicMaterial({ map: texture, transparent:true, depthWrite:false });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph), material);
  mesh.position.set(...pos); mesh.renderOrder = 10;
  scene.add(mesh);
  return { canvas, ctx, texture, material, mesh };
}

// --- Texte de phase + décompte (avec fond sombre : lisible même sur une vidéo claire)

}

hudPanel.material.opacity = 0.75;

hrPanel.mesh.visible = false;

tutorialPanel.material.opacity = 0; tutorialPanel.mesh.visible = false;

let tutorialToken = 0;
async function showTutorial() {
  const my = ++tutorialToken;
  tutorialPanel.mesh.visible = true;
  await tween(tutorialPanel.material.opacity, 0.96, 0.8, (v) => { tutorialPanel.material.opacity = v; });
  await sleep(14000);
  if (my !== tutorialToken) return;
  await tween(tutorialPanel.material.opacity, 0, 0.8, (v) => { tutorialPanel.material.opacity = v; });
  if (my === tutorialToken) tutorialPanel.mesh.visible = false;
}
function hideTutorialNow() {
  if (!tutorialPanel.mesh.visible) return false;
  const my = ++tutorialToken;
  tween(tutorialPanel.material.opacity, 0, 0.4, (v) => { tutorialPanel.material.opacity = v; })
    .then(() => { if (my === tutorialToken) tutorialPanel.mesh.visible = false; });
  return true;

// ============================================================================
// AUDIO : musique (2 morceaux enchaînés) + ambiance (1 boucle au choix),
// avec fondus enchaînés. Aucun son au changement de phase.
// ============================================================================
class FadingLoop {
  constructor(getUrls, { volume = 0.4, fadeSec = 4 } = {}) {
    this.getUrls = getUrls; this.volume = volume; this.fadeSec = fadeSec;
    this.slots = [this._newSlot(), this._newSlot()];
    this.current = -1; this.nextIndex = 0; this.running = false;
    this.timer = null; this.lastTick = 0;
  }
  _newSlot() { const el = new Audio(); el.preload = 'auto'; el.volume = 0; return { el, fade: 0, target: 0, active: false, scheduled: false }; }
  start() {
    if (this.running) return;
    this.running = true;
    // bascule rapide off→on : on rallume la piste qui était en train de s'éteindre
    const reviving = this.slots.findIndex((s) => s.active && s.target === 0 && !s.el.ended);
    if (reviving >= 0) { this.slots[reviving].target = 1; this.current = reviving; }
    else this._playNext();
    this._ensureTimer();
  }
  stop() { this.running = false; this.slots.forEach((s) => { s.target = 0; }); this._ensureTimer(); }
  crossfadeToNext() { if (!this.running) return; this._playNext(); this._ensureTimer(); }
  _ensureTimer() { if (!this.timer) { this.lastTick = performance.now(); this.timer = setInterval(() => this._tick(), 100); } }
  _playNext() {
    const urls = this.getUrls();
    if (!urls || !urls.length) return;
    const url = urls[this.nextIndex % urls.length]; this.nextIndex++;
    const idx = this.current === 0 ? 1 : 0;
    const slot = this.slots[idx];
    if (this.current >= 0 && this.current !== idx) this.slots[this.current].target = 0;
    slot.el.src = url; slot.el.currentTime = 0; slot.el.volume = 0;
    slot.fade = 0; slot.target = 1; slot.active = true; slot.scheduled = false;
    slot.el.play().catch(() => {});
    this.current = idx;
  }
  _tick() {
    const now = performance.now(); const dt = Math.min(0.5, (now - this.lastTick) / 1000); this.lastTick = now;
    let any = false;
    for (const slot of this.slots) {
      if (!slot.active) continue;
      const step = dt / this.fadeSec;
      if (slot.fade < slot.target) slot.fade = Math.min(slot.target, slot.fade + step);
      else if (slot.fade > slot.target) slot.fade = Math.max(slot.target, slot.fade - step);
      const eased = slot.fade * slot.fade * (3 - 2 * slot.fade);
      slot.el.volume = Math.max(0, Math.min(1, this.volume * eased));
      if (slot.fade <= 0 && slot.target === 0) { slot.el.pause(); slot.active = false; } else any = true;
    }
    if (this.running && this.current >= 0) {
      const cur = this.slots[this.current];
      if (cur.active && !cur.scheduled) {
        const d = cur.el.duration, t = cur.el.currentTime;
        const nearEnd = isFinite(d) && d > 0 && (d - t) <= this.fadeSec + 0.15;
        if (nearEnd || cur.el.ended) { cur.scheduled = true; this._playNext(); } // fondu enchaîné vers la suite
      }
    }
    if (!any && !this.running) { clearInterval(this.timer); this.timer = null; }
  }
}

const audioState = { ...DEFAULT_AUDIO };
const audioUrls = { music: [], ruisseau: null, vague: null };
let audioRunning = false;
const musicLoop = new FadingLoop(() => audioUrls.music, { volume: MUSIC_VOLUME, fadeSec: MUSIC_FADE_SEC });
const ambienceLoop = new FadingLoop(() => {
  const u = audioUrls[audioState.ambienceType]; return u ? [u] : [];
}, { volume: AMBIENCE_VOLUME, fadeSec: AMBIENCE_FADE_SEC });

async function resolveAudio() {
  const findFile = async (file) => {
    for (const d of AUDIO_DIRS) { const u = encodeURI(d + file); if (await fileExists(u)) return u; }
    return null;
  };
  const found = await Promise.all([...MUSIC_FILES.map(findFile), findFile(AMBIENCE_FILES.ruisseau), findFile(AMBIENCE_FILES.vague)]);
  audioUrls.music = found.slice(0, MUSIC_FILES.length).filter(Boolean);
  audioUrls.ruisseau = found[MUSIC_FILES.length];
  audioUrls.vague = found[MUSIC_FILES.length + 1];
  const missing = [];
  MUSIC_FILES.forEach((f, i) => { if (!found[i]) missing.push(f); });
  if (!audioUrls.ruisseau) missing.push(AMBIENCE_FILES.ruisseau);
  if (!audioUrls.vague) missing.push(AMBIENCE_FILES.vague);
  $('audioWarning').textContent = missing.length
    ? '⚠ Fichier(s) audio introuvable(s) : ' + missing.join(', ') + ' — à placer dans un dossier « audio » à côté de la page.'
    : '';
}

function refreshMusic() {
  if (!audioRunning) return;
  if (audioState.musicOn) musicLoop.start(); else musicLoop.stop();
}
function refreshAmbience({ typeChanged = false } = {}) {
  if (!audioRunning) return;
  if (!audioState.ambienceOn) { ambienceLoop.stop(); return; }
  if (ambienceLoop.running && typeChanged) ambienceLoop.crossfadeToNext(); // bascule ruisseau ⇄ vague en fondu
  else ambienceLoop.start();
}
function setMusic(on) { audioState.musicOn = on; refreshMusic(); updateSettingsUI(); }
function setAmbience(on, type) {
  const typeChanged = type && type !== audioState.ambienceType;
  if (type) audioState.ambienceType = type;
  audioState.ambienceOn = on;
  refreshAmbience({ typeChanged }); updateSettingsUI();
}
// Gâchette en VR : off → ruisseau → vague → off (jamais les deux en même temps)
function cycleAmbience() {
  if (!audioState.ambienceOn) setAmbience(true, 'ruisseau');
  else if (audioState.ambienceType === 'ruisseau') setAmbience(true, 'vague');
  else setAmbience(false);
}

// ============================================================================
// MOTEUR DE RESPIRATION
// ============================================================================
function easeInOutSine(x) { return -(Math.cos(Math.PI * x) - 1) / 2; }
let elapsedTotal = 0; // UNE seule horloge pour tout (évite les décalages entre démarrage et boucle)
const breathState = { phaseIndex: 0, phaseStart: 0, running: false, startScale: MIN_SCALE };

function startBreathingSession() {
  breathState.phaseIndex = 0;
  breathState.phaseStart = elapsedTotal;
  breathState.startScale = MIN_SCALE;
  breathState.running = true;
  const first = TECHNIQUES[selectedTechnique].phases[0];
  drawBreathText(first.label, first.dur);
}
function stopBreathingSession() { breathState.running = false; }

let lastCountdownDraw = 0;
function updateBreathing(t) {
  if (!breathState.running || !selectedTechnique) return;
  const phases = TECHNIQUES[selectedTechnique].phases;
  const phase = phases[breathState.phaseIndex];
  const elapsed = t - breathState.phaseStart;
  const eased = easeInOutSine(Math.min(1, elapsed / phase.dur));

  // Interpolation depuis l'échelle réelle au début de la phase (gère deux
  // inspirations d'affilée, ex. soupir physiologique)
  let scale;
  if (phase.type === 'grow') scale = breathState.startScale + (MAX_SCALE - breathState.startScale) * eased;
  else if (phase.type === 'shrink') scale = breathState.startScale - (breathState.startScale - MIN_SCALE) * eased;
  else scale = breathState.startScale;

  breathSphere.scale.setScalar(scale);
  breathProgress01 = (scale - MIN_SCALE) / (MAX_SCALE - MIN_SCALE);
  glowSprite.scale.setScalar(1.1 + (scale - MIN_SCALE) * 0.6);
  const hue = 0.56 - breathProgress01 * 0.06;
  sphereMat.color.setHSL(hue, 0.55, 0.62);
  sphereMat.emissive.setHSL(hue, 0.6, 0.35);

  if (t - lastCountdownDraw > 0.15) { drawBreathText(phase.label, phase.dur - elapsed); lastCountdownDraw = t; }
  if (elapsed >= phase.dur) {
    breathState.startScale = scale;
    breathState.phaseIndex = (breathState.phaseIndex + 1) % phases.length;
    breathState.phaseStart = t;
    const next = phases[breathState.phaseIndex];
    drawBreathText(next.label, next.dur);
  }
}

// ============================================================================
// POULS (optionnel) : le téléphone écrit, le casque lit — via Firebase Realtime DB
// ============================================================================
function generateSessionCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // sans caractères ambigus
  let code = ''; for (let i = 0; i < 5; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}
let hrCode = generateSessionCode();
let hrEnabled = false, lastHeartRate = null, lastHrT = null, lastHrChangeAt = 0;
const hrBase = () => FIREBASE_DB_URL.replace(/\/$/, 'https://pharma-yoga-default-rtdb.europe-west1.firebasedatabase.app/');

async function pollHeartRate() {
  if (!hrEnabled || !FIREBASE_DB_URL) return;
  try {
    const res = await fetch(`${hrBase()}/hr/${hrCode}.json`, { cache: 'no-store' });
    if (!res.ok) return;
    const data = await res.json();
    if (data && typeof data.bpm === 'number') {
      if (data.t !== lastHrT) { lastHrT = data.t; lastHrChangeAt = performance.now(); }
      lastHeartRate = data.bpm;
    }
  } catch (e) { /* on retente au prochain sondage */ }
}
setInterval(pollHeartRate, 2000);
setInterval(() => { if (hrPanel.mesh.visible) drawHeartRatePanel(); }, 1000);

function endHeartRateSession() {
  // Hygiène : on efface la valeur côté serveur et on change de code pour la
  // personne suivante (la page peut rester ouverte d'un utilisateur à l'autre).
  if (hrEnabled && FIREBASE_DB_URL) fetch(`${hrBase()}/hr/${hrCode}.json`, { method: 'DELETE' }).catch(() => {});
  hrEnabled = false; lastHeartRate = null; lastHrT = null;
  hrPanel.mesh.visible = false;
  hrCode = generateSessionCode();
  $('roomCodeDisplay').textContent = hrCode;
  $('hrPairing').style.display = 'none';
}

// ============================================================================
// MENU (écran plat, avant d'entrer en VR)
// ============================================================================
function buildTechMenu() {
  const grid = $('techGrid');
  Object.entries(TECHNIQUES).forEach(([key, tech]) => {
    const card = document.createElement('div'); card.className = 'techCard';
    const h3 = document.createElement('h3'); h3.textContent = tech.useCase;
    const sub = document.createElement('p'); sub.className = 'techSubtitle'; sub.textContent = tech.subtitle;
    const small = document.createElement('p'); small.className = 'techTechnical'; small.textContent = tech.name;
    card.append(h3, sub, small);
    card.addEventListener('click', () => selectTechnique(key));
    grid.appendChild(card);
  });
}

function updateSettingsUI() {
  $('musicBtn').textContent = '🎵 Musique : ' + (audioState.musicOn ? 'activée' : 'désactivée');
  $('musicBtn').classList.toggle('on', audioState.musicOn);
  $('ambienceBtn').textContent = '🌿 Sons d\'ambiance : ' + (audioState.ambienceOn ? 'activés' : 'désactivés');
  $('ambienceBtn').classList.toggle('on', audioState.ambienceOn);
  document.querySelectorAll('#ambiencePills .pill').forEach((p) => p.classList.toggle('selected', p.dataset.type === audioState.ambienceType));
  document.querySelectorAll('#decorPills .pill').forEach((p) => p.classList.toggle('selected', p.dataset.decor === String(decorChoice)));
  drawHud();
}
function buildDecorPills() {
  const wrap = $('decorPills'); wrap.innerHTML = '';
  const mk = (label, value) => {
    const b = document.createElement('button'); b.className = 'pill'; b.textContent = label; b.dataset.decor = String(value);
    b.addEventListener('click', () => { decorChoice = value; updateSettingsUI(); });
    wrap.appendChild(b);
  };
  mk('Aléatoire', 'random');
  decorList.forEach((_, i) => mk(String(i + 1), i));
  $('decorRow').style.display = decorList.length ? 'flex' : 'none';
  updateSettingsUI();
}

$('musicBtn').addEventListener('click', () => setMusic(!audioState.musicOn));
$('ambienceBtn').addEventListener('click', () => setAmbience(!audioState.ambienceOn));
document.querySelectorAll('#ambiencePills .pill').forEach((p) => {
  p.addEventListener('click', () => setAmbience(true, p.dataset.type)); // choisir une boucle l'active
});
$('hrToggleBtn').addEventListener('click', () => {
  const panel = $('hrPairing');
  const open = panel.style.display !== 'block';
  panel.style.display = open ? 'block' : 'none';
  hrEnabled = open;
  $('roomCodeDisplay').textContent = hrCode;
  $('hrCodeNote').textContent = FIREBASE_DB_URL ? 'https://pharma-yoga-default-rtdb.europe-west1.firebasedatabase.app/' : '⚠ Relais non configuré : FIREBASE_DB_URL est vide (voir README).';
});

// ============================================================================
// ENTRÉE EN VR / RETOUR AU MENU
// ============================================================================
let menuVisible = true;
const vrButtonEl = VRButton.createButton(renderer);
document.body.appendChild(vrButtonEl); // masqué en CSS (#VRButton), déclenché par un clic de carte

// Un clic sur une carte = on entre directement dans la technique, en VR.
function selectTechnique(key) {
  selectedTechnique = key;
  menuVisible = false;
  $('overlay').style.display = 'none';
  $('flatMenuBtn').style.display = 'block'; // visible seulement hors casque (aperçu écran plat)
  audioRunning = true;
  refreshMusic(); refreshAmbience();        // dans le geste utilisateur → lecture autorisée
  loadDecor(pickInitialDecor());
  startBreathingSession();                  // (aperçu écran plat ; relancé à l'entrée en VR)
  setTimeout(revealDecor, 2500);            // si aucune session VR n'a démarré (PC), on révèle quand même
  vrButtonEl.click();
}

function returnToMenu() {
  stopBreathingSession();
  audioRunning = false; musicLoop.stop(); ambienceLoop.stop();
  decorVideo.pause();
  breathSphere.scale.setScalar(MIN_SCALE); breathProgress01 = 0;
  tutorialToken++; tutorialPanel.mesh.visible = false;
  endHeartRateSession();
  menuVisible = true;
  $('flatMenuBtn').style.display = 'none';
  $('overlay').style.display = 'flex';
  updateSettingsUI();
}
$('flatMenuBtn').addEventListener('click', returnToMenu);

renderer.xr.addEventListener('sessionstart', () => {
  menuVisible = false;
  startBreathingSession();
  revealDecor();
  hrPanel.mesh.visible = hrEnabled; if (hrEnabled) drawHeartRatePanel();
  drawHud();
  showTutorial();
});
renderer.xr.addEventListener('sessionend', returnToMenu);

// ----- Commandes des manettes (pas de lancer de rayon : boutons physiques) -----
//   Gâchette        : ambiance off → ruisseau → vague → off  (ferme d'abord le tutoriel)
//   A ou X          : musique on / off
//   Clic joystick   : décor suivant
//   Maintenir B / Y : retour au menu (2 s, volontairement long pour éviter les fausses manips)
// La gâchette latérale (grip) n'est PAS utilisée : on la presse sans le vouloir en tenant la manette.
const btnPrev = {};
let menuHoldStart = 0;
function pollControllers(nowMs) {
  const session = renderer.xr.getSession();
  if (!session) return;
  let holdingBack = false;
  for (const src of session.inputSources) {
    const gp = src.gamepad;
    if (!gp || !gp.buttons) continue;
    const hand = src.handedness || 'x';
    const pressed = (i) => !!(gp.buttons[i] && gp.buttons[i].pressed);
    const rising = (i) => { const k = hand + i; const p = pressed(i); const r = p && !btnPrev[k]; btnPrev[k] = p; return r; };
    if (rising(0)) { if (!hideTutorialNow()) { cycleAmbience(); } }
    if (rising(3)) nextDecor();
    if (rising(4)) setMusic(!audioState.musicOn);
    if (pressed(5)) holdingBack = true;
  }
  if (holdingBack) {
    if (!menuHoldStart) menuHoldStart = nowMs;
    const p = Math.min(1, (nowMs - menuHoldStart) / 2000);
    if (Math.abs(p - menuHoldProgress) >= 0.05 || p === 1) { menuHoldProgress = p; drawHud(); }
    if (p >= 1) { menuHoldStart = 0; menuHoldProgress = 0; session.end(); }
  } else if (menuHoldStart) {
    menuHoldStart = 0; menuHoldProgress = 0; drawHud();
  }
}

// ============================================================================
// BOUCLE DE RENDU
// ============================================================================
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  elapsedTotal += dt;
  updateTweens(dt);
  if (menuVisible && !renderer.xr.isPresenting) return; // rien à dessiner derrière le menu

  if (renderer.xr.isPresenting) pollControllers(performance.now());
  starMat.uniforms.uTime.value = elapsedTotal;
  updateBreathing(elapsedTotal);
  updateBreathParticles(elapsedTotal);

  camera.getWorldPosition(tmpV);
  textPanel.mesh.lookAt(tmpV); hudPanel.mesh.lookAt(tmpV); hrPanel.mesh.lookAt(tmpV);
  if (tutorialPanel.mesh.visible) tutorialPanel.mesh.lookAt(tmpV);

  // Respiration du point de vue : quelques millimètres, synchronisée au souffle.
  // Appliquée au rig (jamais à la caméra) pour rester compatible avec le tracking VR.
  rig.position.y = breathProgress01 * 0.012;

  renderer.render(scene, camera);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================================
// DÉMARRAGE
// ============================================================================
buildTechMenu();
updateSettingsUI();
drawTutorial(); drawHud();
$('roomCodeDisplay').textContent = hrCode;
resolveAudio();
discoverDecors().then((list) => { decorList = list; buildDecorPills(); });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
</script>
