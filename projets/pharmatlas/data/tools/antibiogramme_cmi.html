<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦠 Antibiogramme / CMI</title>
<style>

:root{--bg:#0d1117;--surface:#161b22;--surface2:#1e2530;--border:#30363d;
--accent:#7ee787;--accent2:#58a6ff;--accent3:#f78166;--accent4:#d2a8ff;--accent5:#ffa657;
--text:#e6edf3;--muted:#8b949e;--radius:10px;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px}
h1{text-align:center;padding:18px 16px 6px;font-size:1.5rem;font-weight:700;
background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;color:var(--muted);font-size:.82rem;margin-bottom:16px}
.nav-wrap{overflow-x:auto;padding:0 8px;border-bottom:1px solid var(--border)}
.nav{display:flex;gap:4px;min-width:max-content}
.nav-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:10px 14px;
font-size:.8rem;font-weight:600;border-bottom:2px solid transparent;transition:.2s;white-space:nowrap}
.nav-btn:hover{color:var(--text)}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.panels{padding:18px 8px;max-width:1100px;margin:0 auto}
.panel{display:none}.panel.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card-title{font-size:1rem;font-weight:700;margin-bottom:12px;color:var(--accent2)}
label{display:block;font-size:.78rem;color:var(--muted);margin:8px 0 3px;font-weight:600}
input[type=number],select{width:100%;background:var(--surface2);border:1px solid var(--border);
border-radius:7px;color:var(--text);padding:8px 10px;font-size:.85rem}
input[type=range]{width:100%;accent-color:var(--accent)}
.chk{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);
border-radius:7px;padding:8px 10px;margin:5px 0;cursor:pointer;font-size:.82rem}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.result{background:var(--surface2);border-radius:8px;padding:14px 16px;margin-top:12px;font-size:.85rem;line-height:1.7}
.result .key{color:var(--accent4);font-weight:700}
.bigscore{font-size:2.2rem;font-weight:800;text-align:center;margin:6px 0}
.badge{display:inline-block;border-radius:20px;padding:4px 14px;font-size:.8rem;font-weight:700;margin-top:6px}
.range-val{display:inline-block;background:var(--surface2);border-radius:4px;padding:1px 8px;
font-size:.8rem;color:var(--accent5);font-weight:700;margin-left:8px}
canvas{background:#111;border-radius:8px;width:100%;display:block;margin-top:8px}
.note{font-size:.72rem;color:var(--muted);margin-top:10px;line-height:1.5}
.srz{display:flex;gap:6px;margin-top:10px}
.srz>div{flex:1;text-align:center;padding:8px;border-radius:7px;font-weight:700;font-size:.85rem}

</style>
</head>
<body>
<h1>🦠 Antibiogramme / CMI</h1>
<div class="card">
  <div class="card-title">🦠 Antibiogramme — CMI vs concentrations critiques</div>
  <div class="grid2">
   <div>
    <label>CMI mesurée (mg/L) <span class="range-val" id="a-cmi-v">2.0</span></label>
    <input type="range" id="a-cmi" min="0.03" max="256" step="0.03" value="2" oninput="atb()">
    <label>Seuil S (sensible si CMI ≤ S) <span class="range-val" id="a-s-v">1.0</span></label>
    <input type="range" id="a-s" min="0.03" max="64" step="0.03" value="1" oninput="atb()">
    <label>Seuil R (résistant si CMI > R) <span class="range-val" id="a-r-v">4.0</span></label>
    <input type="range" id="a-r" min="0.06" max="128" step="0.06" value="4" oninput="atb()">
   </div>
   <div>
    <label>Concentration sérique max (Cmax, mg/L) <span class="range-val" id="a-cmax-v">16</span></label>
    <input type="range" id="a-cmax" min="1" max="200" step="1" value="16" oninput="atb()">
    <div class="srz" style="margin-top:18px">
     <div id="a-zs" style="background:#13351b;color:var(--accent)">S</div>
     <div id="a-zi" style="background:#3a3414;color:var(--accent5)">I</div>
     <div id="a-zr" style="background:#3a1414;color:var(--accent3)">R</div>
    </div>
   </div>
  </div>
  <canvas id="a-cv" height="150"></canvas>
  <div class="bigscore" id="a-verdict" style="font-size:1.6rem"></div>
  <div class="result" id="a-res"></div>
  <div class="note">Catégorisation EUCAST/CASFM : S = sensible, I = sensible à forte exposition, R = résistant. Le ratio Cmax/CMI (aminosides) ou T>CMI (bêta-lactamines) guide l'efficacité PK/PD.</div>
 </div>
<script>
function rv(id,dv,dec){var r=document.getElementById(id),e=document.getElementById(dv);if(r&&e)e.textContent=parseFloat(r.value).toFixed(dec);}
function atb(){
 rv('a-cmi','a-cmi-v',2);rv('a-s','a-s-v',2);rv('a-r','a-r-v',2);rv('a-cmax','a-cmax-v',0);
 var cmi=+document.getElementById('a-cmi').value,S=+document.getElementById('a-s').value,
 R=+document.getElementById('a-r').value,cmax=+document.getElementById('a-cmax').value;
 if(R<S)R=S;
 var cat,col;
 if(cmi<=S){cat='SENSIBLE (S)';col='#7ee787';}
 else if(cmi>R){cat='RÉSISTANT (R)';col='#f78166';}
 else{cat='INTERMÉDIAIRE (I)';col='#ffa657';}
 document.getElementById('a-verdict').textContent=cat;
 document.getElementById('a-verdict').style.color=col;
 var ratio=cmax/cmi;
 document.getElementById('a-res').innerHTML='<span class="key">CMI :</span> '+cmi.toFixed(2)+' mg/L · '+
  '<span class="key">Ratio Cmax/CMI :</span> '+ratio.toFixed(1)+
  (ratio>=8?' (≥8 : bonne efficacité PK/PD aminosides)':' (<8 : exposition possiblement insuffisante)');
 // highlight zone
 document.getElementById('a-zs').style.opacity=(cmi<=S)?'1':'.35';
 document.getElementById('a-zi').style.opacity=(cmi>S&&cmi<=R)?'1':'.35';
 document.getElementById('a-zr').style.opacity=(cmi>R)?'1':'.35';
 // log scale bar
 var cv=document.getElementById('a-cv'),ctx=cv.getContext('2d'),W=cv.offsetWidth;cv.width=W;var Hh=150;
 ctx.clearRect(0,0,W,Hh);var pl=8,pr=8,pt=20,w=W-pl-pr;
 var lmin=Math.log2(0.03),lmax=Math.log2(256);
 function px(v){return pl+w*(Math.log2(v)-lmin)/(lmax-lmin);}
 // zones
 ctx.fillStyle='rgba(126,231,135,.18)';ctx.fillRect(px(0.03),pt,px(S)-px(0.03),40);
 ctx.fillStyle='rgba(255,166,87,.18)';ctx.fillRect(px(S),pt,px(R)-px(S),40);
 ctx.fillStyle='rgba(247,129,102,.18)';ctx.fillRect(px(R),pt,px(256)-px(R),40);
 // ticks
 ctx.fillStyle='#8b949e';ctx.font='9px monospace';ctx.textAlign='center';
 [0.03,0.25,1,4,16,64,256].forEach(function(v){ctx.fillText(v,px(v),pt+58);ctx.strokeStyle='rgba(255,255,255,.1)';ctx.beginPath();ctx.moveTo(px(v),pt);ctx.lineTo(px(v),pt+40);ctx.stroke();});
 // CMI marker
 ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(px(cmi),pt-2);ctx.lineTo(px(cmi)-6,pt-12);ctx.lineTo(px(cmi)+6,pt-12);ctx.closePath();ctx.fill();
 ctx.fillStyle=col;ctx.font='bold 10px monospace';ctx.fillText('CMI',px(cmi),pt-16);
 // Cmax marker
 if(cmax<=256){ctx.strokeStyle='#58a6ff';ctx.lineWidth=2;ctx.setLineDash([3,2]);ctx.beginPath();ctx.moveTo(px(cmax),pt);ctx.lineTo(px(cmax),pt+40);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#58a6ff';ctx.fillText('Cmax',px(cmax),pt+72);}
 ctx.fillStyle='#8b949e';ctx.textAlign='center';ctx.fillText('CMI (mg/L, échelle log₂)',W/2,Hh-6);
}
// init
cha();bled();dose();

atb();
</script>
</body>
</html>
