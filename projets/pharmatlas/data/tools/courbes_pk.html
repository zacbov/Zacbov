<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courbes PK</title>
<style>

:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1e2530;--border:#30363d;
  --accent:#7ee787;--accent2:#58a6ff;--accent3:#f78166;--accent4:#d2a8ff;--accent5:#ffa657;
  --text:#e6edf3;--muted:#8b949e;--radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
h1{text-align:center;padding:24px 16px 8px;font-size:1.6rem;font-weight:700;
   background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:20px}

/* NAV TABS */
.nav-wrap{overflow-x:auto;padding:0 16px;border-bottom:1px solid var(--border)}
.nav{display:flex;gap:4px;min-width:max-content;padding-bottom:0}
.nav-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:10px 14px;
  font-size:.8rem;font-weight:600;border-bottom:2px solid transparent;transition:.2s;white-space:nowrap}
.nav-btn:hover{color:var(--text)}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

/* PANELS */
.panels{padding:20px 16px;max-width:1100px;margin:0 auto}
.panel{display:none}
.panel.active{display:block}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.card-title{font-size:1rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.col{flex:1;min-width:260px}

/* CONTROLS */
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px;margin-top:10px}
input[type=range]{width:100%;accent-color:var(--accent2)}
input[type=number],select{background:var(--surface2);border:1px solid var(--border);color:var(--text);
  border-radius:6px;padding:7px 10px;font-size:.85rem;width:100%}
.btn{background:var(--accent2);color:#000;border:none;border-radius:6px;padding:8px 18px;
  font-size:.85rem;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{opacity:.85}
.btn-green{background:var(--accent)}
.btn-red{background:var(--accent3)}
.btn-purple{background:var(--accent4)}
.btn-orange{background:var(--accent5)}
.btn-sm{padding:5px 12px;font-size:.78rem}

/* BADGES / CHIPS */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:700}
.ok{background:#1a3a1a;color:#7ee787;border:1px solid #2d5a2d}
.warn{background:#3a2a00;color:#ffa657;border:1px solid #5a4200}
.err{background:#3a0000;color:#f78166;border:1px solid #5a1a00}

/* CANVAS */
canvas{display:block;border-radius:8px;border:1px solid var(--border)}

/* STAT TABLE */
.stat-table{width:100%;border-collapse:collapse;font-size:.82rem}
.stat-table th{background:var(--surface2);padding:6px 10px;text-align:left;color:var(--muted);font-weight:600}
.stat-table td{padding:5px 10px;border-bottom:1px solid var(--border)}
.stat-table tr.highlight td{background:#1a3a1a;color:var(--accent)}
.stat-table tr.highlight-err td{background:#3a0000;color:var(--accent3)}

/* PEDIGREE */
.pedigree-ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
#ped-canvas{cursor:crosshair}
.legend-item{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted)}
.legend-box{width:14px;height:14px;border-radius:2px}

/* IMMUNO */
.immuno-cell{cursor:pointer;transition:.2s;filter:drop-shadow(0 0 4px transparent)}
.immuno-cell:hover{filter:drop-shadow(0 0 8px var(--accent2));transform-origin:center}
.info-box{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;
  font-size:.82rem;line-height:1.6;min-height:80px}
.info-box strong{color:var(--accent2)}
.cytokine{display:inline-block;background:#1e2f4a;color:var(--accent2);border-radius:4px;
  padding:1px 7px;font-size:.72rem;margin:1px}

/* PGP */
.cell-viz{position:relative;width:100%;height:240px;background:#0d1a0d;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.pgp-pump{position:absolute;display:flex;align-items:center;justify-content:center;
  border-radius:8px;font-size:.7rem;font-weight:700}

/* TITRATION */
#titration-canvas{background:#111}

/* RANGE DISPLAY */
.range-val{display:inline-block;background:var(--surface2);border-radius:4px;padding:1px 8px;
  font-size:.8rem;color:var(--accent5);font-weight:700;margin-left:8px}

/* RESULT BOX */
.result{background:var(--surface2);border-radius:8px;padding:12px 16px;margin-top:10px;font-size:.85rem;line-height:1.7}
.result .key{color:var(--accent4);font-weight:700}

body{padding:12px;min-height:100vh}
.panel{display:none}
.panel.active{display:block}
</style>
</head>
<body>
<div class="panel active" id="p0">
<div class="row">
  <div class="col">
    <div class="card">
      <div class="card-title">⚗️ Paramètres PK</div>
      <label>Modèle</label>
      <select id="pk-model" onchange="pkDraw()">
        <option value="iv1">IV Bolus — Monocompartimental</option>
        <option value="oral1">Oral — Monocompartimental</option>
        <option value="iv2">IV Bolus — Bicompartimental</option>
        <option value="perf">Perfusion IV</option>
      </select>
      <label>Dose (mg) <span class="range-val" id="pk-dose-val">100</span></label>
      <input type="range" id="pk-dose" min="10" max="1000" step="10" value="100" oninput="pkDraw()">
      <label>Vd (L) <span class="range-val" id="pk-vd-val">30</span></label>
      <input type="range" id="pk-vd" min="5" max="200" step="5" value="30" oninput="pkDraw()">
      <label>ke (h⁻¹) <span class="range-val" id="pk-ke-val">0.10</span></label>
      <input type="range" id="pk-ke" min="0.02" max="1.0" step="0.02" value="0.10" oninput="pkDraw()">
      <div id="pk-oral-ctrl">
        <label>ka (h⁻¹) <span class="range-val" id="pk-ka-val">0.50</span></label>
        <input type="range" id="pk-ka" min="0.1" max="3.0" step="0.1" value="0.5" oninput="pkDraw()">
        <label>Biodisponibilité F <span class="range-val" id="pk-f-val">0.80</span></label>
        <input type="range" id="pk-f" min="0.1" max="1.0" step="0.05" value="0.8" oninput="pkDraw()">
      </div>
      <div id="pk-perf-ctrl" style="display:none">
        <label>Durée perfusion (h) <span class="range-val" id="pk-tinf-val">1</span></label>
        <input type="range" id="pk-tinf" min="0.25" max="12" step="0.25" value="1" oninput="pkDraw()">
      </div>
      <div id="pk-result" class="result" style="margin-top:12px"></div>
    </div>
  </div>
  <div class="col">
    <div class="card">
      <div class="card-title">📈 Courbe C(t)</div>
      <canvas id="pk-canvas" width="460" height="280" style="width:100%"></canvas>
    </div>
  </div>
</div>
</div>

<!-- ===== PANEL 3 : MULTI-DOSES ===== -->
<script>

function syncAll(){
  document.querySelectorAll('input[type=range]').forEach(r=>{
    const vid=r.id+'-val';
    const el=document.getElementById(vid);
    if(el) el.textContent=parseFloat(r.value).toFixed(2);
  });
  // specific displays
  [['hw-q','hw-q-val',2],['drift-n','drift-n-val',0],['drift-g','drift-g-val',0],
   ['drift-p','drift-p-val',2],['pk-dose','pk-dose-val',0],['pk-vd','pk-vd-val',0],
   ['pk-ke','pk-ke-val',2],['pk-ka','pk-ka-val',2],['pk-f','pk-f-val',2],['pk-tinf','pk-tinf-val',2],
   ['md-dose','md-dose-val',0],['md-ke','md-ke-val',2],['md-ka','md-ka-val',2],
   ['md-vd','md-vd-val',0],['md-tau','md-tau-val',0],['md-n','md-n-val',0],
   ['cq-cv','cq-cv-val',2],['tit-ca','tit-ca-val',2],['tit-va','tit-va-val',0],
   ['tit-cb','tit-cb-val',2],['pgp-expr','pgp-expr-val',0]
  ].forEach(([id,dv,d=2])=>{
    const r=document.getElementById(id),el=document.getElementById(dv);
    if(r&&el) el.textContent=parseFloat(r.value).toFixed(d);
  });
}
document.querySelectorAll('input[type=range]').forEach(r=>{
  r.addEventListener('input',syncAll);
});
syncAll();

// ============================================================
// UTILS
// ============================================================
function showPanel(i,btn){
  document.querySelectorAll('.panel').forEach((p,j)=>p.classList.toggle('active',j===i));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const inits=[pkDraw];
  setTimeout(()=>inits[i]&&inits[i](),50);
}
function rangeSync(id,display,dec=2){
  const el=document.getElementById(id);
  const dv=document.getElementById(display);
  if(el&&dv){dv.textContent=parseFloat(el.value).toFixed(dec);}
}
function syncAll(){
  [['hw-q','hw-q-val'],['drift-n','drift-n-val',0],['drift-g','drift-g-val',0],
   ['drift-p','drift-p-val'],['pk-dose','pk-dose-val',0],['pk-vd','pk-vd-val',0],
   ['pk-ke','pk-ke-val'],['pk-ka','pk-ka-val'],['pk-f','pk-f-val'],['pk-tinf','pk-tinf-val'],
   ['md-dose','md-dose-val',0],['md-ke','md-ke-val'],['md-ka','md-ka-val'],
   ['md-vd','md-vd-val',0],['md-tau','md-tau-val',0],['md-n','md-n-val',0],
   ['cq-cv','cq-cv-val'],['tit-ca','tit-ca-val'],['tit-va','tit-va-val',0],
   ['tit-cb','tit-cb-val'],['pgp-expr','pgp-expr-val',0]
  ].forEach(([id,dv,d=2])=>rangeSync(id,dv,d));
}
document.querySelectorAll('input[type=range]').forEach(r=>{
  r.addEventListener('input',syncAll);
});
syncAll();

// ============================================================
// PANEL 2 : COURBES PK
// ============================================================
function pkDraw(){
  const model=document.getElementById('pk-model').value;
  const D=parseFloat(document.getElementById('pk-dose').value);
  const Vd=parseFloat(document.getElementById('pk-vd').value);
  const ke=parseFloat(document.getElementById('pk-ke').value);
  const ka=parseFloat(document.getElementById('pk-ka').value);
  const F=parseFloat(document.getElementById('pk-f').value);
  const tinf=parseFloat(document.getElementById('pk-tinf').value);

  document.getElementById('pk-oral-ctrl').style.display=(model==='oral1')?'':'none';
  document.getElementById('pk-perf-ctrl').style.display=(model==='perf')?'':'none';
  document.querySelectorAll('#pk-dose-val,#pk-vd-val,#pk-ke-val,#pk-ka-val,#pk-f-val,#pk-tinf-val')
    .forEach(el=>el&&el.parentElement);
  syncAll();

  const tmax=Math.max(48,Math.ceil(8/ke));
  const dt=tmax/500;
  const times=Array.from({length:501},(_,i)=>i*dt);
  let concs;
  const t12=0.693/ke;
  const C0=D/Vd;
  const kel=ke;

  if(model==='iv1'){
    concs=times.map(t=>C0*Math.exp(-kel*t));
  } else if(model==='oral1'){
    const D2=F*D;
    concs=times.map(t=>{
      if(ka===kel)return D2*kel/Vd*t*Math.exp(-kel*t);
      return D2*ka/(Vd*(ka-kel))*(Math.exp(-kel*t)-Math.exp(-ka*t));
    });
  } else if(model==='iv2'){
    // Bicompartimental approximation: A=0.6*C0, alpha=ke*3, B=0.4*C0, beta=ke*0.3
    const A=0.6*C0,alpha=ke*4,B=0.4*C0,beta=ke*0.4;
    concs=times.map(t=>A*Math.exp(-alpha*t)+B*Math.exp(-beta*t));
  } else { // perf
    const k0=D/tinf;
    const Css_inf=k0/(kel*Vd);
    concs=times.map(t=>{
      if(t<=tinf) return Css_inf*(1-Math.exp(-kel*t));
      else return Css_inf*(1-Math.exp(-kel*tinf))*Math.exp(-kel*(t-tinf));
    });
  }

  const Cmax=Math.max(...concs);
  const Tmax=times[concs.indexOf(Cmax)];
  // AUC trapeze
  let auc=0;
  for(let i=0;i<concs.length-1;i++) auc+=(concs[i]+concs[i+1])/2*dt;

  // Draw
  const canvas=document.getElementById('pk-canvas');
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  drawPKCurve(ctx,W,H,times,concs,Cmax,Tmax,auc,t12,model,tinf);

  const modeNames={iv1:'IV Bolus 1-comp.',oral1:'Oral 1-comp.',iv2:'IV Bolus 2-comp.',perf:`Perfusion ${tinf}h`};
  document.getElementById('pk-result').innerHTML=
    `<span class="key">Modèle</span> : ${modeNames[model]}<br>`+
    `<span class="key">t½</span> = ${t12.toFixed(1)} h &nbsp;|&nbsp; <span class="key">Cmax</span> = ${Cmax.toFixed(2)} mg/L<br>`+
    `<span class="key">Tmax</span> = ${Tmax.toFixed(2)} h &nbsp;|&nbsp; <span class="key">AUC₀→∞</span> = ${auc.toFixed(1)} mg·h/L<br>`+
    `<span class="key">Css atteint</span> ≈ ${(5*t12).toFixed(1)} h après début de traitement`;
}

function drawPKCurve(ctx,W,H,times,concs,Cmax,Tmax,auc,t12,model,tinf){
  const pad={l:50,r:20,t:20,b:40};
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,W,H);
  const gW=W-pad.l-pad.r,gH=H-pad.t-pad.b;
  const xS=gW/times[times.length-1], yS=gH/Cmax*0.9;

  // AUC fill
  ctx.fillStyle='rgba(88,166,255,0.1)';
  ctx.beginPath();
  ctx.moveTo(pad.l,pad.t+gH);
  times.forEach((t,i)=>{
    ctx.lineTo(pad.l+t*xS, pad.t+gH-concs[i]*yS);
  });
  ctx.lineTo(pad.l+times[times.length-1]*xS,pad.t+gH);
  ctx.closePath();ctx.fill();

  // Perfusion marker
  if(model==='perf'){
    ctx.strokeStyle='#ffa657';ctx.lineWidth=1;ctx.setLineDash([4,4]);
    const xInf=pad.l+tinf*xS;
    ctx.beginPath();ctx.moveTo(xInf,pad.t);ctx.lineTo(xInf,pad.t+gH);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#ffa657';ctx.font='10px monospace';
    ctx.fillText('Fin perf.',xInf+3,pad.t+12);
  }

  // Curve
  ctx.strokeStyle='#58a6ff';ctx.lineWidth=2.5;ctx.setLineDash([]);
  ctx.beginPath();
  times.forEach((t,i)=>{
    const x=pad.l+t*xS, y=pad.t+gH-concs[i]*yS;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.stroke();

  // Cmax marker
  const cmaxX=pad.l+Tmax*xS,cmaxY=pad.t+gH-Cmax*yS;
  ctx.strokeStyle='#7ee787';ctx.lineWidth=1;ctx.setLineDash([3,3]);
  ctx.beginPath();ctx.moveTo(cmaxX,cmaxY);ctx.lineTo(cmaxX,pad.t+gH);ctx.stroke();
  ctx.beginPath();ctx.moveTo(pad.l,cmaxY);ctx.lineTo(cmaxX,cmaxY);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#7ee787';ctx.font='bold 10px monospace';
  ctx.fillText(`Cmax=${Cmax.toFixed(1)}`,pad.l+2,cmaxY-4);

  // t½ annotation
  const t12X=pad.l+t12*xS;
  if(t12X<W-pad.r){
    ctx.strokeStyle='#d2a8ff';ctx.lineWidth=1;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(t12X,pad.t+gH-Cmax/2*yS);
    ctx.lineTo(t12X,pad.t+gH);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#d2a8ff';ctx.font='10px monospace';
    ctx.fillText(`t½=${t12.toFixed(1)}h`,t12X+2,pad.t+gH-Cmax/2*yS-4);
  }

  // Axes
  ctx.strokeStyle='#30363d';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,pad.t+gH);
  ctx.lineTo(pad.l+gW,pad.t+gH);ctx.stroke();
  // Y ticks
  for(let i=0;i<=4;i++){
    const v=Cmax*i/4*0.9;
    const y=pad.t+gH-v*yS;
    ctx.strokeStyle='#1e2530';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+gW,y);ctx.stroke();
    ctx.fillStyle='#8b949e';ctx.font='10px monospace';ctx.textAlign='right';
    ctx.fillText(v.toFixed(1),pad.l-4,y+4);
  }
  // X ticks
  const tEnd=times[times.length-1];
  for(let i=0;i<=5;i++){
    const t=tEnd*i/5;
    const x=pad.l+t*xS;
    ctx.fillStyle='#8b949e';ctx.font='10px monospace';ctx.textAlign='center';
    ctx.fillText(t.toFixed(0),x,pad.t+gH+14);
  }
  ctx.fillStyle='#8b949e';ctx.font='11px sans-serif';ctx.textAlign='center';
  ctx.fillText('Temps (h)',pad.l+gW/2,H-2);
  ctx.save();ctx.translate(12,pad.t+gH/2);ctx.rotate(-Math.PI/2);
  ctx.fillText('C (mg/L)',0,0);ctx.restore();
}


setTimeout(pkDraw, 100);
</script>
</body>
</html>
