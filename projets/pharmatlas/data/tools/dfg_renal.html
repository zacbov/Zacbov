<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DFG Rénal</title>
<style>

:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1e2530;--border:#30363d;
  --accent:#7ee787;--accent2:#58a6ff;--accent3:#f78166;--accent4:#d2a8ff;--accent5:#ffa657;
  --text:#e6edf3;--muted:#8b949e;--radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
h1{text-align:center;padding:24px 16px 8px;font-size:1.6rem;font-weight:700;
   background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:20px}

/* NAV TABS */
.nav-wrap{overflow-x:auto;padding:0 16px;border-bottom:1px solid var(--border)}
.nav{display:flex;gap:4px;min-width:max-content;padding-bottom:0}
.nav-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:10px 14px;
  font-size:.8rem;font-weight:600;border-bottom:2px solid transparent;transition:.2s;white-space:nowrap}
.nav-btn:hover{color:var(--text)}
.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

/* PANELS */
.panels{padding:20px 16px;max-width:1100px;margin:0 auto}
.panel{display:none}
.panel.active{display:block}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.card-title{font-size:1rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.col{flex:1;min-width:260px}

/* CONTROLS */
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px;margin-top:10px}
input[type=range]{width:100%;accent-color:var(--accent2)}
input[type=number],select{background:var(--surface2);border:1px solid var(--border);color:var(--text);
  border-radius:6px;padding:7px 10px;font-size:.85rem;width:100%}
.btn{background:var(--accent2);color:#000;border:none;border-radius:6px;padding:8px 18px;
  font-size:.85rem;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{opacity:.85}
.btn-green{background:var(--accent)}
.btn-red{background:var(--accent3)}
.btn-purple{background:var(--accent4)}
.btn-orange{background:var(--accent5)}
.btn-sm{padding:5px 12px;font-size:.78rem}

/* BADGES / CHIPS */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:700}
.ok{background:#1a3a1a;color:#7ee787;border:1px solid #2d5a2d}
.warn{background:#3a2a00;color:#ffa657;border:1px solid #5a4200}
.err{background:#3a0000;color:#f78166;border:1px solid #5a1a00}

/* CANVAS */
canvas{display:block;border-radius:8px;border:1px solid var(--border)}

/* STAT TABLE */
.stat-table{width:100%;border-collapse:collapse;font-size:.82rem}
.stat-table th{background:var(--surface2);padding:6px 10px;text-align:left;color:var(--muted);font-weight:600}
.stat-table td{padding:5px 10px;border-bottom:1px solid var(--border)}
.stat-table tr.highlight td{background:#1a3a1a;color:var(--accent)}
.stat-table tr.highlight-err td{background:#3a0000;color:var(--accent3)}

/* PEDIGREE */
.pedigree-ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
#ped-canvas{cursor:crosshair}
.legend-item{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted)}
.legend-box{width:14px;height:14px;border-radius:2px}

/* IMMUNO */
.immuno-cell{cursor:pointer;transition:.2s;filter:drop-shadow(0 0 4px transparent)}
.immuno-cell:hover{filter:drop-shadow(0 0 8px var(--accent2));transform-origin:center}
.info-box{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;
  font-size:.82rem;line-height:1.6;min-height:80px}
.info-box strong{color:var(--accent2)}
.cytokine{display:inline-block;background:#1e2f4a;color:var(--accent2);border-radius:4px;
  padding:1px 7px;font-size:.72rem;margin:1px}

/* PGP */
.cell-viz{position:relative;width:100%;height:240px;background:#0d1a0d;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.pgp-pump{position:absolute;display:flex;align-items:center;justify-content:center;
  border-radius:8px;font-size:.7rem;font-weight:700}

/* TITRATION */
#titration-canvas{background:#111}

/* RANGE DISPLAY */
.range-val{display:inline-block;background:var(--surface2);border-radius:4px;padding:1px 8px;
  font-size:.8rem;color:var(--accent5);font-weight:700;margin-left:8px}

/* RESULT BOX */
.result{background:var(--surface2);border-radius:8px;padding:12px 16px;margin-top:10px;font-size:.85rem;line-height:1.7}
.result .key{color:var(--accent4);font-weight:700}

body{padding:12px;min-height:100vh}
.panel{display:none}
.panel.active{display:block}
</style>
</head>
<body>
<div class="panel active" id="p0">
<div class="row">
  <div class="col">
    <div class="card">
      <div class="card-title">🩺 Calculateur DFG — CKD-EPI</div>
      <label>Créatinine (µmol/L)</label>
      <input type="number" id="dfg-creat" value="90" min="20" max="2000" oninput="dfgCalc()">
      <label>Âge (ans)</label>
      <input type="number" id="dfg-age" value="55" min="18" max="100" oninput="dfgCalc()">
      <label>Poids (kg)</label>
      <input type="number" id="dfg-poids" value="70" min="30" max="200" oninput="dfgCalc()">
      <label>Sexe</label>
      <select id="dfg-sexe" onchange="dfgCalc()">
        <option value="M">Homme</option>
        <option value="F">Femme</option>
      </select>
      <label>Origine</label>
      <select id="dfg-race" onchange="dfgCalc()">
        <option value="other">Non africaine</option>
        <option value="black">Africaine</option>
      </select>
      <div id="dfg-result" class="result" style="margin-top:12px"></div>
    </div>
  </div>
  <div class="col">
    <div class="card">
      <div class="card-title">💊 Ajustement Posologique</div>
      <canvas id="dfg-canvas" width="380" height="200" style="width:100%;margin-bottom:10px"></canvas>
      <div id="dfg-drugs" class="result"></div>
    </div>
  </div>
</div>
</div>

<!-- ===== PANEL 6 : IMMUNOLOGIE ===== -->
<script>

function syncAll(){
  document.querySelectorAll('input[type=range]').forEach(r=>{
    const vid=r.id+'-val';
    const el=document.getElementById(vid);
    if(el) el.textContent=parseFloat(r.value).toFixed(2);
  });
  // specific displays
  [['hw-q','hw-q-val',2],['drift-n','drift-n-val',0],['drift-g','drift-g-val',0],
   ['drift-p','drift-p-val',2],['pk-dose','pk-dose-val',0],['pk-vd','pk-vd-val',0],
   ['pk-ke','pk-ke-val',2],['pk-ka','pk-ka-val',2],['pk-f','pk-f-val',2],['pk-tinf','pk-tinf-val',2],
   ['md-dose','md-dose-val',0],['md-ke','md-ke-val',2],['md-ka','md-ka-val',2],
   ['md-vd','md-vd-val',0],['md-tau','md-tau-val',0],['md-n','md-n-val',0],
   ['cq-cv','cq-cv-val',2],['tit-ca','tit-ca-val',2],['tit-va','tit-va-val',0],
   ['tit-cb','tit-cb-val',2],['pgp-expr','pgp-expr-val',0]
  ].forEach(([id,dv,d=2])=>{
    const r=document.getElementById(id),el=document.getElementById(dv);
    if(r&&el) el.textContent=parseFloat(r.value).toFixed(d);
  });
}
document.querySelectorAll('input[type=range]').forEach(r=>{
  r.addEventListener('input',syncAll);
});
syncAll();

// ============================================================
// UTILS
// ============================================================
function showPanel(i,btn){
  document.querySelectorAll('.panel').forEach((p,j)=>p.classList.toggle('active',j===i));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const inits=[dfgCalc];
  setTimeout(()=>inits[i]&&inits[i](),50);
}
function rangeSync(id,display,dec=2){
  const el=document.getElementById(id);
  const dv=document.getElementById(display);
  if(el&&dv){dv.textContent=parseFloat(el.value).toFixed(dec);}
}
function syncAll(){
  [['hw-q','hw-q-val'],['drift-n','drift-n-val',0],['drift-g','drift-g-val',0],
   ['drift-p','drift-p-val'],['pk-dose','pk-dose-val',0],['pk-vd','pk-vd-val',0],
   ['pk-ke','pk-ke-val'],['pk-ka','pk-ka-val'],['pk-f','pk-f-val'],['pk-tinf','pk-tinf-val'],
   ['md-dose','md-dose-val',0],['md-ke','md-ke-val'],['md-ka','md-ka-val'],
   ['md-vd','md-vd-val',0],['md-tau','md-tau-val',0],['md-n','md-n-val',0],
   ['cq-cv','cq-cv-val'],['tit-ca','tit-ca-val'],['tit-va','tit-va-val',0],
   ['tit-cb','tit-cb-val'],['pgp-expr','pgp-expr-val',0]
  ].forEach(([id,dv,d=2])=>rangeSync(id,dv,d));
}
document.querySelectorAll('input[type=range]').forEach(r=>{
  r.addEventListener('input',syncAll);
});
syncAll();

// ============================================================
// PANEL 5 : DFG RÉNAL
// ============================================================
const DFG_DRUGS=[
  {name:'Metformine',route:'rénale',seuils:[{dfg:60,text:'dose normale',ok:true},{dfg:45,text:'−50% dose',ok:true},{dfg:30,text:'CI absolue',ok:false}]},
  {name:'Vancomycine',route:'rénale (80%)',seuils:[{dfg:90,text:'dose normale',ok:true},{dfg:50,text:'adapter par dosages',ok:true},{dfg:10,text:'dose unique / dialyse',ok:false}]},
  {name:'Aténolol',route:'rénale',seuils:[{dfg:35,text:'−50% dose',ok:true},{dfg:15,text:'prises tous les 4j',ok:false}]},
  {name:'Ciprofloxacine',route:'mixte',seuils:[{dfg:30,text:'−50% dose',ok:true}]},
  {name:'Gabapentine',route:'rénale ++',seuils:[{dfg:60,text:'−25%',ok:true},{dfg:30,text:'−50%',ok:true},{dfg:15,text:'−75%',ok:false}]},
];
function dfgCalc(){
  const creat=parseFloat(document.getElementById('dfg-creat').value)||90;
  const age=parseInt(document.getElementById('dfg-age').value)||55;
  const sexe=document.getElementById('dfg-sexe').value;
  const race=document.getElementById('dfg-race').value;
  // CKD-EPI (unités µmol/L → on convertit en mg/dL : ÷88.4)
  const cr=creat/88.4;
  let kappa=sexe==='F'?0.7:0.9;
  let alpha=sexe==='F'?-0.241:-0.302;
  let mult=sexe==='F'?1.012:1.0;
  if(race==='black') mult*=1.159;
  const ratio=cr/kappa;
  const dfg=142*Math.pow(Math.min(ratio,1),alpha)*Math.pow(Math.max(ratio,1),-1.200)*
    Math.pow(0.9938,age)*mult;
  const dfgR=Math.round(dfg);

  let stade,stadeCoul,conseil;
  if(dfgR>=90){stade='G1 — Normale ou élevée';stadeCoul='#7ee787';conseil='Aucun ajustement nécessaire';}
  else if(dfgR>=60){stade='G2 — Légèrement diminuée';stadeCoul='#a2d46e';conseil='Surveiller, ajuster si nécessaire';}
  else if(dfgR>=45){stade='G3a — Légèrement à modérément diminuée';stadeCoul='#ffa657';conseil='Adapter doses médicaments à élimination rénale';}
  else if(dfgR>=30){stade='G3b — Modérément à sévèrement diminuée';stadeCoul='#f78166';conseil='Réduire doses. Éviter néphrotoxiques.';}
  else if(dfgR>=15){stade='G4 — Sévèrement diminuée';stadeCoul='#e74c3c';conseil='Réduction importante. Préparer EER.';}
  else{stade='G5 — Insuffisance rénale terminale';stadeCoul='#c0392b';conseil='Dialyse ou transplantation. Posologies très réduites.';}

  document.getElementById('dfg-result').innerHTML=
    `<span class="key">DFG (CKD-EPI)</span> = <strong style="color:${stadeCoul};font-size:1.2rem">${dfgR} mL/min/1,73m²</strong><br>`+
    `<span class="key">Stade</span> : <span style="color:${stadeCoul}">${stade}</span><br>`+
    `<span class="key">Conseil</span> : ${conseil}<br>`+
    `<small style="color:var(--muted)">Cl. Cockcroft = ${((140-age)*parseFloat(document.getElementById('dfg-poids').value)/(7.2*creat)*(sexe==='F'?0.85:1)).toFixed(1)} mL/min</small>`;

  dfgDrawGauge(dfgR);
  dfgDrawDrugs(dfgR);
}
function dfgDrawGauge(dfg){
  const canvas=document.getElementById('dfg-canvas');
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,W,H);
  const stages=[
    {min:90,max:130,color:'#7ee787',label:'G1'},
    {min:60,max:90,color:'#a2d46e',label:'G2'},
    {min:45,max:60,color:'#ffd04a',label:'G3a'},
    {min:30,max:45,color:'#ffa657',label:'G3b'},
    {min:15,max:30,color:'#f78166',label:'G4'},
    {min:0,max:15,color:'#e74c3c',label:'G5'},
  ];
  const maxV=130,bH=28,y0=20;
  const xS=(W-100)/maxV;
  stages.forEach(({min,max,color,label},i)=>{
    const x=40+min*xS,w=(max-min)*xS;
    const y=y0+i*(bH+4);
    ctx.fillStyle=color+'33';
    ctx.fillRect(x,y,w,bH);
    ctx.strokeStyle=color;ctx.lineWidth=1;
    ctx.strokeRect(x,y,w,bH);
    ctx.fillStyle=color;ctx.font='bold 11px monospace';ctx.textAlign='center';
    ctx.fillText(label,x+w/2,y+bH/2+4);
  });
  // DFG marker
  const dfgX=40+Math.min(dfg,130)*xS;
  ctx.fillStyle='#fff';ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(dfgX,y0-4);ctx.lineTo(dfgX,y0+stages.length*(bH+4));ctx.stroke();
  ctx.beginPath();ctx.arc(dfgX,y0-4,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 11px monospace';ctx.textAlign='center';
  ctx.fillText(`${dfg}`,dfgX,y0+stages.length*(bH+4)+14);
  // X axis labels
  ctx.fillStyle='#8b949e';ctx.font='9px monospace';
  [0,15,30,45,60,90,130].forEach(v=>{
    const x=40+v*xS;
    ctx.textAlign='center';ctx.fillText(v,x,H-4);
  });
  ctx.textAlign='left';ctx.fillText('DFG (mL/min)',2,y0+stages.length*(bH+4)/2);
}
function dfgDrawDrugs(dfg){
  let html='';
  DFG_DRUGS.forEach(drug=>{
    let adaptation='dose normale',ok=true;
    drug.seuils.forEach(s=>{
      if(dfg<s.dfg){adaptation=s.text;ok=s.ok;}
    });
    const badge=ok?`<span class="badge ok">✓</span>`:`<span class="badge err">CI</span>`;
    html+=`<div style="margin-bottom:4px;font-size:.82rem">${badge} <strong>${drug.name}</strong> <span style="color:var(--muted)">(${drug.route})</span> → ${adaptation}</div>`;
  });
  document.getElementById('dfg-drugs').innerHTML=html;
}
setTimeout(dfgCalc,100);

</script>
</body>
</html>
