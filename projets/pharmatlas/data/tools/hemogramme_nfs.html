<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hémogramme / NFS</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:rgb(58,176,158);--accent-light:rgba(58,176,158,0.12);--accent-dark:rgb(48,146,138);--bg:#f5f5f3;--white:#fff;--text:#1a1a1a;--muted:#888;--border:#e0e0e0}
body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px 24px}
.nfs-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.nfs-table thead tr{background:var(--bg)}
.nfs-table th{padding:7px 10px;text-align:left;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);border-bottom:2px solid var(--border)}
.nfs-table td{padding:8px 10px;border-bottom:1px solid rgba(0,0,0,.05);vertical-align:middle}
.nfs-table tr:last-child td{border-bottom:none}
.nfs-table tr:hover td{background:rgba(58,176,158,0.04)}
.range-cell{font-family:'Courier New',monospace;font-size:11px}
.range-f{color:#e53935}.range-h{color:#1565c0}.range-both{color:var(--text)}
.anom-chip{display:inline-block;border-radius:4px;padding:1px 7px;font-size:10px;font-weight:700;margin:1px}
.anom-low{background:#e3f2fd;color:#1565c0}.anom-high{background:#ffebee;color:#e53935}
.gauge-wrap{margin-top:4px}
.gauge-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.gauge-label{font-size:10px;font-weight:600;color:var(--muted);width:52px;flex-shrink:0;text-align:right}
.gauge-track{flex:1;height:8px;background:var(--bg);border-radius:4px;border:1px solid var(--border);position:relative;overflow:visible}
.gauge-normal{height:100%;border-radius:4px;background:linear-gradient(90deg,rgba(58,176,158,0.3),rgba(58,176,158,0.7));position:absolute}
.gauge-val{position:absolute;top:-2px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,.2);transform:translateX(-50%);transition:left .4s cubic-bezier(.4,0,.2,1)}
.gauge-val.low{background:#1565c0}.gauge-val.high{background:#e53935}
.gauge-num{font-size:10px;font-weight:700;color:var(--text);width:56px;flex-shrink:0}
.const-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.const-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;position:relative;overflow:hidden}
.const-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;background:var(--accent)}
.const-label{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.const-abbr{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;color:var(--accent);margin-bottom:2px}
.const-range{font-family:'Courier New',monospace;font-size:11px;color:var(--text);margin-bottom:4px}
.const-interp{font-size:10px;color:var(--muted);line-height:1.4}
.leuco-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:4px}
.leuco-table th{background:var(--bg);padding:5px 8px;text-align:left;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--border)}
.leuco-table td{padding:6px 8px;border-bottom:1px solid rgba(0,0,0,.04);vertical-align:middle}
.leuco-table tr:last-child td{border-bottom:none}
.cell-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle;flex-shrink:0}
.leuco-bar{height:6px;border-radius:3px;display:inline-block;margin-left:4px;vertical-align:middle;opacity:.75}
.interp-block{border-radius:0 8px 8px 0;padding:10px 14px;font-size:12px;line-height:1.7;margin-bottom:8px;border-left:3px solid}
.interp-block.low{background:#e3f2fd;border-color:#1565c0;color:#0d2b5e}
.interp-block.high{background:#ffebee;border-color:#e53935;color:#7a0000}
.interp-title{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px}
.gender-toggle{display:flex;gap:6px;align-items:center;margin-bottom:16px}
.gender-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-right:4px}
.gender-btn{border:1px solid var(--border);border-radius:20px;padding:5px 18px;font-size:12px;font-weight:700;cursor:pointer;background:none;color:var(--muted);transition:all .18s;font-family:'Montserrat',sans-serif}
.gender-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.gender-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(58,176,158,.3)}
.nfs-tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.nfs-tab{border:1px solid var(--border);border-radius:6px;padding:4px 14px;font-size:11px;font-weight:600;cursor:pointer;background:none;color:var(--muted);transition:all .15s;font-family:'Montserrat',sans-serif}
.nfs-tab:hover,.nfs-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.nfs-panel{display:none}.nfs-panel.active{display:block}
.mol-chip{background:#f0f9f7;border:1px solid var(--accent);border-radius:20px;padding:2px 9px;font-size:10px;font-weight:600;color:var(--accent);display:inline-block;margin:2px}
.formula-box{font-family:'Courier New',monospace;font-size:12px;background:#f8f9fa;border:1px solid #dee2e6;border-radius:8px;padding:10px 14px;color:#1a1a1a;line-height:1.8;white-space:pre}
.new-badge{display:inline-block;background:rgba(255,165,0,0.15);border:1px solid rgba(255,165,0,0.4);color:#b37a00;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700;margin-left:8px;vertical-align:middle}
.info-section{margin-bottom:18px}
.info-label{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1.5px;color:var(--accent);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.info-label::before{content:'';width:3px;height:14px;background:var(--accent);border-radius:2px}
.param-name{font-size:12px;font-weight:600;color:var(--text)}
.param-unit{font-size:10px;color:var(--muted)}
</style>
</head>
<body>
<div class="nfs-root" id="nfsRoot"></div>

<script>
const NFS_PARAMS_DATA = {
  F: {
    hb:{val:14.0,min:12.0,max:16.0}, gr:{val:4.7,min:4.2,max:5.2},
    ht:{val:41,min:37,max:47}, plaq:{val:300,min:150,max:450},
    gb:{val:7.0,min:4.0,max:10.0}, pnn:{val:4.2,min:1.8,max:7.0},
    lymph:{val:2.1,min:1.0,max:4.0}, mono:{val:0.5,min:0.2,max:1.0},
    eosi:{val:0.2,min:0.0,max:0.5}, baso:{val:0.04,min:0.0,max:0.1},
  },
  H: {
    hb:{val:15.0,min:13.0,max:17.0}, gr:{val:5.1,min:4.5,max:5.7},
    ht:{val:45,min:40,max:52}, plaq:{val:300,min:150,max:450},
    gb:{val:7.0,min:4.0,max:10.0}, pnn:{val:4.2,min:1.8,max:7.0},
    lymph:{val:2.1,min:1.0,max:4.0}, mono:{val:0.5,min:0.2,max:1.0},
    eosi:{val:0.2,min:0.0,max:0.5}, baso:{val:0.04,min:0.0,max:0.1},
  }
};
const NFS_CONSTANTES=[
  {abbr:'VGM',label:'Volume Globulaire Moyen',min:80,max:100,unit:'fL',formula:'VGM = Ht / Nb GR',low:'Microcytose → anémie ferriprive, thalassémie',high:'Macrocytose → carence B12/folates, alcoolisme'},
  {abbr:'TCMH',label:'Teneur Corpusculaire Moy. en Hb',min:27,max:32,unit:'pg',formula:'TCMH = Hb / Nb GR',low:'Hypochromie → anémie ferriprive',high:'Normal/élevé → macrocytose'},
  {abbr:'CCMH',label:'Concentration Corpusculaire Moy. en Hb',min:32,max:35,unit:'g/dL',formula:'CCMH = Hb / Ht × 100',low:'Hypochromie (<32 g/dL)',high:'Sphérocytose héréditaire possible'},
];
const NFS_LEUCO=[
  {name:'PNN',full:'Polynucléaires Neutrophiles',pct:'40–75%',abs:'1.8–7.0 G/L',color:'#5c7fb8',bw:58},
  {name:'Lymphocytes',full:'Lymphocytes T et B',pct:'20–40%',abs:'1.0–4.0 G/L',color:'#4caf50',bw:30},
  {name:'Monocytes',full:'Monocytes',pct:'2–10%',abs:'0.2–1.0 G/L',color:'#ff9800',bw:6},
  {name:'PNE',full:'Polynucléaires Éosinophiles',pct:'1–6%',abs:'0.0–0.5 G/L',color:'#e91e63',bw:3},
  {name:'PNB',full:'Polynucléaires Basophiles',pct:'<1%',abs:'0.0–0.1 G/L',color:'#9c27b0',bw:0.7},
];
const NFS_ANOMALIES=[
  {type:'↓ Hb',label:'Anémie',interp:'Hb < 12 g/dL (F) ou < 13 g/dL (H). Caractériser par VGM + TCMH : microcytaire (ferriprive, thalassémie), normocytaire (hémorragie, IR), macrocytaire (B12/folates).',cls:'low'},
  {type:'↑ Hb',label:'Polyglobulie',interp:'Hb > 16 g/dL (F) ou > 17 g/dL (H). Évoquer polyglobulie de Vaquez (JAK2 V617F) ou polyglobulie secondaire (hypoxie chronique).',cls:'high'},
  {type:'↓ Plaquettes',label:'Thrombopénie',interp:'< 150 G/L. Étiologies : PTI (auto-Ac), TIH (héparine +++), aplasie, CIVD. Risque hémorragique sévère si < 20 G/L.',cls:'low'},
  {type:'↑ GB',label:'Hyperleucocytose',interp:'> 10 G/L. Orientation : neutrophilie (infection bactérienne), lymphocytose (infection virale, LLC), éosinophilie (allergie, parasitose).',cls:'high'},
  {type:'↓ GB',label:'Leucopénie',interp:'< 4 G/L. Neutropénie sévère si PNN < 500/µL → risque infectieux majeur. Causes : chimiothérapie, aplasie, viroses.',cls:'low'},
];

let nfsGender='F';

function nfsGauge(label,val,min,max,display,absMin,absMax){
  const rng=absMax-absMin;
  const ns=((min-absMin)/rng*100).toFixed(1), nw=((max-min)/rng*100).toFixed(1), vp=((val-absMin)/rng*100).toFixed(1);
  const cls=val<min?'low':val>max?'high':'';
  return `<div class="gauge-row"><div class="gauge-label">${label}</div>
    <div class="gauge-track"><div class="gauge-normal" style="left:${ns}%;width:${nw}%"></div>
    <div class="gauge-val ${cls}" style="left:${vp}%"></div></div>
    <div class="gauge-num">${display}</div></div>`;
}

function nfsBuildGRTable(){
  const p=NFS_PARAMS_DATA[nfsGender], rF=NFS_PARAMS_DATA.F, rH=NFS_PARAMS_DATA.H;
  const rows=[{key:'hb',name:'Hémoglobine',unit:'g/dL',fmt:v=>v.toFixed(1)},{key:'gr',name:'Globules rouges',unit:'×10¹²/L',fmt:v=>v.toFixed(1)},{key:'ht',name:'Hématocrite',unit:'%',fmt:v=>v.toFixed(0)}];
  return `<div class="info-section"><div class="info-label">Érythrocytes &amp; Hémoglobine</div>
    <table class="nfs-table"><thead><tr><th>Paramètre</th><th style="color:#e53935">♀ Femme</th><th style="color:#1565c0">♂ Homme</th><th>↓</th><th>↑</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td><div class="param-name">${r.name}</div><div class="param-unit">${r.unit}</div></td>
    <td class="range-cell range-f">${r.fmt(rF[r.key].min)}–${r.fmt(rF[r.key].max)}</td>
    <td class="range-cell range-h">${r.fmt(rH[r.key].min)}–${r.fmt(rH[r.key].max)}</td>
    <td><span class="anom-chip anom-low">↓</span></td><td><span class="anom-chip anom-high">↑</span></td></tr>`).join('')}
    </tbody></table></div>
  <div class="info-section"><div class="info-label">Visualisation — valeurs types (${nfsGender==='F'?'Femme':'Homme'})</div><div class="gauge-wrap">
    ${nfsGauge('Hb',p.hb.val,p.hb.min,p.hb.max,p.hb.val+' g/dL',0,20)}
    ${nfsGauge('GR',p.gr.val,p.gr.min,p.gr.max,p.gr.val+' T/L',2,8)}
    ${nfsGauge('Ht',p.ht.val,p.ht.min,p.ht.max,p.ht.val+'%',20,65)}
  </div></div>`;
}

function nfsSwitchTab(id,btn){
  const root=btn.closest('.nfs-root');
  root.querySelectorAll('.nfs-tab').forEach(t=>t.classList.remove('active'));
  root.querySelectorAll('.nfs-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  root.querySelector('#'+id).classList.add('active');
}

function nfsSetGender(g,btn){
  nfsGender=g;
  const root=btn.closest('.nfs-root');
  root.querySelectorAll('.gender-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const grPanel=root.querySelector('#nfs-tab-gr');
  if(grPanel) grPanel.innerHTML=`<div class="gender-toggle">
    <span class="gender-label">Sexe</span>
    <button class="gender-btn ${nfsGender==='F'?'active':''}" onclick="nfsSetGender('F',this)">♀ Femme</button>
    <button class="gender-btn ${nfsGender==='H'?'active':''}" onclick="nfsSetGender('H',this)">♂ Homme</button>
  </div>`+nfsBuildGRTable();
}

function renderHemogramme(){
  const p=NFS_PARAMS_DATA[nfsGender];
  document.getElementById('nfsRoot').innerHTML=`
  <div style="display:inline-flex;align-items:center;gap:6px;background:#e8f4f8;color:#1a6896;padding:5px 12px;border-radius:20px;font-weight:700;font-size:12px;margin-bottom:14px">
    📋 Outil diagnostique de première intention
    <span class="new-badge">EMBARQUÉ</span>
  </div>
  <div class="nfs-tabs">
    <button class="nfs-tab active" onclick="nfsSwitchTab('nfs-tab-gr',this)">🔴 Globules rouges</button>
    <button class="nfs-tab" onclick="nfsSwitchTab('nfs-tab-gb',this)">⚪ Leucocytes</button>
    <button class="nfs-tab" onclick="nfsSwitchTab('nfs-tab-plaq',this)">🟣 Plaquettes</button>
    <button class="nfs-tab" onclick="nfsSwitchTab('nfs-tab-const',this)">📐 Constantes GR</button>
    <button class="nfs-tab" onclick="nfsSwitchTab('nfs-tab-anom',this)">⚠️ Anomalies</button>
  </div>
  <div class="nfs-panel active" id="nfs-tab-gr">
    <div class="gender-toggle">
      <span class="gender-label">Sexe</span>
      <button class="gender-btn ${nfsGender==='F'?'active':''}" onclick="nfsSetGender('F',this)">♀ Femme</button>
      <button class="gender-btn ${nfsGender==='H'?'active':''}" onclick="nfsSetGender('H',this)">♂ Homme</button>
    </div>
    ${nfsBuildGRTable()}
  </div>
  <div class="nfs-panel" id="nfs-tab-gb">
    <div class="info-section"><div class="info-label">Formule Leucocytaire</div>
      <table class="leuco-table"><thead><tr><th>Cellule</th><th>%</th><th>Valeur abs.</th><th>Proportion</th></tr></thead><tbody>
        ${NFS_LEUCO.map(l=>`<tr>
          <td><span class="cell-dot" style="background:${l.color}"></span><strong>${l.name}</strong><br><span style="font-size:10px;color:var(--muted)">${l.full}</span></td>
          <td>${l.pct}</td><td>${l.abs}</td>
          <td><div class="leuco-bar" style="width:${Math.min(l.bw/60*120,120)}px;background:${l.color}"></div></td>
        </tr>`).join('')}
      </tbody></table>
    </div>
    <div class="info-section"><div class="info-label">Valeurs normales totales</div>
      <div class="formula-box">Leucocytes : 4 – 10 G/L
Neutrophiles : 1,8 – 7,0 G/L (40–75%)
Lymphocytes : 1,0 – 4,0 G/L (20–40%)
Monocytes   : 0,2 – 1,0 G/L (2–10%)
Éosinophiles : 0 – 0,5 G/L (1–6%)
Basophiles  : 0 – 0,1 G/L (&lt;1%)</div>
    </div>
  </div>
  <div class="nfs-panel" id="nfs-tab-plaq">
    <div class="info-section"><div class="info-label">Numération plaquettaire</div>
      <div class="gauge-wrap" style="margin-top:8px">${nfsGauge('Plaq.',300,150,450,'300 G/L',0,600)}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px;font-style:italic">Exemple : valeur normale de 300 G/L</div>
    </div>
    <div class="info-section"><div class="info-label">Seuils cliniques</div>
      <table class="nfs-table"><thead><tr><th>Plaquettes</th><th>Seuil</th><th>Risque / Conduite</th></tr></thead><tbody>
        <tr><td class="param-name">Thrombocytémie</td><td class="range-cell range-h">&gt; 450 G/L</td><td>JAK2, CALR, MPL → thromboembolicité</td></tr>
        <tr><td class="param-name">Normal</td><td class="range-cell range-both">150 – 450 G/L</td><td>—</td></tr>
        <tr><td class="param-name">Thrombopénie modérée</td><td class="range-cell range-f">50 – 150 G/L</td><td>Surveiller, étiologie (PTI, TIH…)</td></tr>
        <tr><td class="param-name">Thrombopénie sévère</td><td class="range-cell range-f">20 – 50 G/L</td><td>Contre-indication gestes invasifs</td></tr>
        <tr><td class="param-name">Thrombopénie critique</td><td class="range-cell range-f">&lt; 20 G/L</td><td>Risque hémorragique spontané +++</td></tr>
      </tbody></table>
    </div>
  </div>
  <div class="nfs-panel" id="nfs-tab-const">
    <div class="info-section"><div class="info-label">Constantes érythrocytaires</div>
      <div class="const-grid">${NFS_CONSTANTES.map(c=>`
        <div class="const-item"><div class="const-abbr">${c.abbr}</div>
          <div class="const-label">${c.label}</div>
          <div class="const-range">${c.min} – ${c.max} ${c.unit}</div>
          <div class="const-interp"><span style="color:#1565c0">↓ ${c.low.split('→')[0]}</span><br><span style="color:#e53935">↑ ${c.high.split('→')[0]}</span></div>
        </div>`).join('')}
      </div>
    </div>
    <div class="info-section" style="margin-top:14px"><div class="info-label">Arbre décisionnel rapide</div>
      <div style="background:#f8f9fa;border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:12px;line-height:1.9;font-family:'Courier New',monospace">
Anémie détectée (↓ Hb)
  ├── VGM &lt; 80 fL → Microcytaire
  │     ├── TCMH &lt; 27 → Ferriprive / Thalassémie
  │     └── TCMH normale → Inflammation chronique
  ├── VGM 80-100 fL → Normocytaire
  │     └── Réticulocytes? → Hémorragie / Hémolyse
  └── VGM &gt; 100 fL → Macrocytaire
        └── B12/Folates? Alcoolisme?</div>
    </div>
  </div>
  <div class="nfs-panel" id="nfs-tab-anom">
    <div class="info-section"><div class="info-label">Guide d'interprétation</div>
      ${NFS_ANOMALIES.map(a=>`<div class="interp-block ${a.cls}"><div class="interp-title">${a.type} — ${a.label}</div>${a.interp}</div>`).join('')}
    </div>
  </div>`;
}

renderHemogramme();
</script>
</body>
</html>
