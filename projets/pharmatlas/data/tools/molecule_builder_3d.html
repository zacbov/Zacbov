<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Molecule Builder — Pharmatlas</title>
<style>
  :root {
    --bg: #07090f; --bg2: #0d1018; --bg3: #111520;
    --border: rgba(58,176,158,.18); --border2: rgba(100,140,200,.12);
    --accent: #3ab09e; --accent2: #7ec8e3; --accent3: #f472b6;
    --warn: #fbbf24; --danger: #ef4444;
    --text: #dde6f5; --text2: rgba(200,215,240,.55); --text3: rgba(160,180,220,.3);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', 'Fira Code', monospace; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  button { cursor: pointer; font-family: inherit; }
  ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(58,176,158,.25); border-radius: 2px; }

  /* ── Layout ── */
  #app { display: flex; flex: 1; overflow: hidden; }
  #left  { width: 240px; background: var(--bg2); border-right: 1px solid var(--border2); display: flex; flex-direction: column; padding: 14px; gap: 10px; flex-shrink: 0; overflow-y: auto; }
  #center { flex: 1; position: relative; display: flex; flex-direction: column; min-width: 0; }
  #right { width: 340px; background: var(--bg2); border-left: 1px solid var(--border2); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }

  /* ── Header ── */
  #topbar { height: 52px; background: rgba(13,16,24,.97); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 14px; gap: 14px; flex-shrink: 0; }
  #formula-display { font-size: 20px; font-weight: 900; color: var(--accent2); font-family: monospace; min-width: 80px; }
  #atom-count { font-size: 12px; color: var(--text2); }
  #hint-text { font-size: 12px; color: var(--warn); margin-left: auto; }

  /* ── SVG Canvas ── */
  #canvas-wrap { flex: 1; position: relative; }
  #mol-svg { width: 100%; height: 100%; display: block; }

  /* ── Left Panel ── */
  .section-label { font-size: 11px; color: var(--text3); font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; margin-top: 4px; }

  /* Mode tabs */
  #mode-tabs { display: flex; gap: 4px; }
  .mode-btn { flex: 1; padding: 7px 0; border-radius: 8px; border: 1px solid; font-size: 12px; font-weight: 700; transition: all .15s; }

  /* Atom palette */
  #palette { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .atom-btn { padding: 10px 4px; border-radius: 9px; border: 2px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); font-size: 13px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 1px; transition: all .15s; }
  .atom-btn span.sym { font-size: 18px; }
  .atom-btn span.nm  { font-size: 10px; opacity: .65; font-weight: 400; }

  /* Tool buttons */
  #tools { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .tool-btn { padding: 10px 4px; border-radius: 9px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); font-size: 10px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 2px; transition: all .15s; }
  .tool-btn .ico { font-size: 20px; }

  /* Bond order */
  #bond-order { display: flex; gap: 4px; }
  .bo-btn { flex: 1; padding: 8px 0; border-radius: 8px; border: 1px solid rgba(255,255,255,.15); background: transparent; font-size: 13px; font-weight: 700; transition: all .15s; }

  /* Challenge card */
  #challenge-card { border-radius: 8px; padding: 9px; }

  /* Clear btn */
  #clear-btn { padding: 10px; border-radius: 7px; border: 1px solid rgba(239,68,68,.35); background: rgba(239,68,68,.1); color: var(--danger); font-size: 13px; font-weight: 700; margin-top: auto; }
  #clear-btn:hover { background: rgba(239,68,68,.2); }

  /* Search */
  #search-wrap { padding: 10px 12px; border-bottom: 1px solid var(--border2); flex-shrink: 0; }
  #mol-search { width: 100%; padding: 8px 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; outline: none; font-family: inherit; }
  #mol-search:focus { border-color: var(--accent); }

  /* Molecule list */
  #mol-list { flex: 0 0 180px; overflow-y: auto; border-bottom: 1px solid var(--border2); }
  .mol-item { padding: 8px 12px; font-size: 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,.03); transition: background .1s; display: flex; gap: 6px; align-items: center; }
  .mol-item:hover { background: rgba(58,176,158,.08); }
  .mol-item.active { background: rgba(58,176,158,.15); border-left: 2px solid var(--accent); }
  .mol-item .mol-name { color: var(--text); font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mol-item .mol-formula { color: var(--accent2); font-size: 11px; font-family: monospace; flex-shrink: 0; }
  .mol-item .mol-cat { font-size: 8px; padding: 1px 5px; border-radius: 3px; background: rgba(58,176,158,.12); color: var(--accent); flex-shrink: 0; }

  /* 3D viewer */
  #viewer-3d { position: relative; flex-shrink: 0; background: #080b13; border-bottom: 1px solid var(--border2); height: 260px; cursor: grab; }
  #viewer-3d canvas { display: block; }
  #viewer-3d .badge { position: absolute; top: 6px; right: 8px; font-size: 8px; color: var(--text3); }
  #viewer-3d .drag-hint { position: absolute; bottom: 6px; left: 8px; font-size: 8px; color: var(--text3); }
  #viewer-3d .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--accent); }
  #viewer-empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--text3); font-size: 11px; pointer-events: none; }

  /* Info panel */
  #info-panel { flex: 1; overflow-y: auto; padding: 12px; }
  .prop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 10px; }
  .prop-cell { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 7px; padding: 6px 8px; }
  .prop-cell .prop-label { font-size: 11px; color: var(--text3); }
  .prop-cell .prop-val { font-size: 18px; font-weight: 900; font-family: monospace; }
  .lipinski { padding: 8px 11px; border-radius: 8px; margin-bottom: 10px; font-size: 11px; font-weight: 700; }
  .pubchem-link { display: block; text-align: center; padding: 10px; border-radius: 6px; border: 1px solid rgba(126,200,227,.3); color: var(--accent2); font-size: 13px; text-decoration: none; font-weight: 600; margin-bottom: 8px; }
  .pubchem-link:hover { background: rgba(126,200,227,.1); }
  .smiles-box { font-size: 11px; color: var(--text2); background: var(--bg3); border: 1px solid var(--border); padding: 5px 8px; border-radius: 5px; font-family: monospace; word-break: break-all; margin-bottom: 6px; }
  .desc-box { font-size: 13px; color: rgba(220,230,245,.65); line-height: 1.65; padding: 8px 10px; background: rgba(255,255,255,.04); border-radius: 6px; border-left: 2px solid rgba(58,176,158,.4); margin-bottom: 8px; }
  .val-warn  { margin-top: 8px; padding: 6px 10px; border-radius: 5px; background: rgba(239,68,68,.15);   border: 1px solid rgba(239,68,68,.3);   font-size: 12px; color: var(--danger); }
  .val-under { margin-top: 8px; padding: 6px 10px; border-radius: 5px; background: rgba(251,191,36,.12);  border: 1px solid rgba(251,191,36,.35);  font-size: 12px; color: #fbbf24; }
  .no-mol { text-align: center; padding: 20px 10px; }
  .no-mol .icon { font-size: 28px; opacity: .35; margin-bottom: 8px; }
  .no-mol p { font-size: 12px; color: var(--text3); line-height: 1.7; }
  .guide-item { padding: 6px 8px; border-radius: 6px; margin-bottom: 4px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.07); }
  .guide-item .gm { font-size: 13px; color: var(--accent); font-weight: 700; } .guide-item .ga { font-size: 11px; color: var(--text3); margin-top: 1px; }

  /* Iso tabs */
  #iso-tabs { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
  .iso-btn { text-align: left; padding: 8px 10px; border-radius: 8px; font-size: 13px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); color: rgba(255,255,255,.7); transition: all .12s; }
  .iso-btn.active { border-color: var(--accent); background: rgba(58,176,158,.15); color: var(--accent); }

  @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }
  .pulse { animation: pulse 1.2s infinite; }
  @keyframes pop { 0%{transform:scale(.8);opacity:0} 100%{transform:scale(1);opacity:1} }
  .pop { animation: pop .2s ease; }
</style>
</head>
<body>

<!-- Topbar -->
<div id="topbar">
  <span style="font-size:12px;font-weight:700;color:rgba(100,140,180,.5);letter-spacing:2px">PHARMATLAS</span>
  <span style="font-size:16px;font-weight:900;color:var(--accent)">Mol. Builder 3D</span>
  <span style="color:var(--border2);font-size:14px;">│</span>
  <span id="formula-display">—</span>
  <span id="atom-count"></span>
  <span id="hint-text"></span>
</div>

<div id="app">
  <!-- ── LEFT PANEL ── -->
  <div id="left">
    <div class="section-label" style="margin-top:0">Mode</div>
    <div id="mode-tabs">
      <button class="mode-btn" id="btn-build" onclick="setMode('build')" style="border-color:var(--accent);background:rgba(58,176,158,.18);color:var(--accent)">🔧 Libre</button>
      <button class="mode-btn" id="btn-challenge" onclick="setMode('challenge')" style="border-color:rgba(255,255,255,.15);color:var(--text2)">🎯 Défi</button>
    </div>

    <div id="challenge-card" style="display:none;background:rgba(255,193,7,.08);border:1px solid #fbbf24"></div>

    <div class="section-label">Atomes</div>
    <div id="palette"></div>

    <div class="section-label">Outils</div>
    <div id="tools"></div>

    <div id="bond-order-wrap" style="display:none">
      <div class="section-label">Liaison</div>
      <div id="bond-order"></div>
    </div>

    <button id="clear-btn" onclick="clearAll()">⌫ Tout effacer</button>
  </div>

  <!-- ── CENTER ── -->
  <div id="center">
    <div id="canvas-wrap">
      <svg id="mol-svg" onclick="handleSVGClick(event)" onmousemove="handleSVGMove(event)" onmouseup="handleSVGUp()">
        <defs>
          <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
            <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(100,130,200,.055)" stroke-width=".5"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)"/>
        <g id="bonds-layer"></g>
        <g id="atoms-layer"></g>
        <g id="empty-state">
          <text x="50%" y="44%" text-anchor="middle" fill="rgba(100,130,200,.15)" font-size="38">⬡</text>
          <text x="50%" y="52%" text-anchor="middle" fill="rgba(100,130,200,.2)" font-size="13" font-family="monospace">Sélectionnez un atome et cliquez pour construire</text>
          <text x="50%" y="57%" text-anchor="middle" fill="rgba(100,130,200,.12)" font-size="10" font-family="monospace">Ex : C + 4×H → CH₄ (Méthane)</text>
        </g>
      </svg>
    </div>
  </div>

  <!-- ── RIGHT PANEL ── -->
  <div id="right">
    <!-- Search -->
    <div id="search-wrap">
      <input id="mol-search" placeholder="🔍 Rechercher une molécule…" oninput="filterMols(this.value)" autocomplete="off"/>
    </div>
    <!-- Molecule list -->
    <div id="mol-list"></div>
    <!-- 3D Viewer -->
    <div id="viewer-3d"
      onmousedown="v3dDown(event)" onmousemove="v3dMove(event)" onmouseup="v3dUp()" onmouseleave="v3dUp()"
      onwheel="v3dWheel(event)">
      <div id="viewer-empty"><span style="font-size:32px">⬡</span><span>Assemblez une molécule reconnue</span></div>
      <div class="badge">3D · PubChem</div>
    </div>
    <!-- Info -->
    <div id="info-panel"><div class="no-mol" id="guide-panel"></div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

log [H3O⁺]","desc":"Potentiel hydrogène — mesure de l'acidité ou basicité d'une solution aqueuse","cat":"Chimie analytique"},{"name":"Théorie de Brønsted — Acides et Bases","formula":"AH + B ⇌ A⁻ + BH⁺  (transfert de proton)","desc":"Définition moderne acido-basique — couples acide/base conjuguée et transfert de proton","cat":"Chimie analytique"},{"name":"pKa & Équation de Henderson-Hasselbalch","formula":"pH = pKa + log([A⁻]/[AH])  |  pKa = −log Ka","desc":"Constante d'acidité et ratio formes acide/base selon le pH — clé de l'absorption des médicaments","cat":"Chimie analytique"},{"name":"Calcul du pH des Solutions","formula":"Acide fort : pH = −log Ca  |  Acide faible : pH = ½pKa − ½log Ca  |  Base forte : pH = 14 + log Cb  |  Base faible : pH = 7 + ½pKa + ½log Cb","desc":"Formules de calcul du pH selon la nature de la solution : acides et bases forts ou faibles","cat":"Chimie analytique"},{"name":"Solutions Tampon","formula":"pH = pKa + log([A⁻]/[AH])  |  Pouvoir tampon β = dCb/dpH = 2,303·C·Ka·[H⁺]/(Ka+[H⁺])²","desc":"Solutions résistant aux variations de pH — indispensables en biologie et en galénique","cat":"Chimie analytique"},{"name":"Titrages Acido-basiques","formula":"Équivalence : na = nb  |  Quantitativité : K = Ka1/Ka2 > 10⁴ (1%) ou > 10⁶ (0,1%)","desc":"Dosages quantitatifs acide-base — courbes de titrage, équivalence et point de demi-neutralisation","cat":"Chimie analytique"},{"name":"Indicateurs Colorés","formula":"Zone de virage : pKaHI − 1 < pH < pKaHI + 1  |  Choix : pH1%avant < pKaHI ± 1 < pH1%après","desc":"Couples acide-base colorés pour repérer visuellement l'équivalence d'un titrage","cat":"Chimie analytique"},{"name":"Potentiométrie — Électrode de Verre","formula":"E = E0 + (RT/F)·ln[H⁺] = E0 − 0,059·pH  (à 25°C)","desc":"Méthode électrochimique de mesure du pH et de suivi des titrages","cat":"Chimie analytique"},{"name":"Point Isoélectrique (pHi) des Protéines","formula":"pHi = ½(pKa1 + pKa2)  [pour un ampholyte simple]","desc":"pH auquel la charge nette d'une protéine est nulle — clé de la solubilité et des séparations","cat":"Chimie analytique"},{"name":"pH et Absorption des Médicaments","formula":"F_non ionisée = 1/(1 + 10^(pH−pKa))  [acide]  |  F_non ionisée = 1/(1 + 10^(pKa−pH))  [base]","desc":"Rôle du pKa et du pH dans l'absorption, la distribution et la formulation des médicaments","cat":"Chimie analytique"},{"name":"Spectrophotométrie UV-Visible","formula":"A = ε·l·C  (loi de Beer-Lambert)  |  A = log(I0/I) = −log(T)","desc":"Dosage par absorbance de la lumière — loi de Beer-Lambert, applications analytiques et pharmaceutiques","cat":"Chimie analytique"},{"name":"Chromatographie — Principes Généraux","formula":"Facteur de rétention : k = (tR − t0)/t0  |  Résolution : Rs = 2(tR2−tR1)/(wb1+wb2)","desc":"Séparation des composés d'un mélange par distribution entre phase stationnaire et phase mobile","cat":"Chimie analytique"},{"name":"RMN — Résonance Magnétique Nucléaire","formula":"ν = γ·B0/(2π)  (fréquence de résonance)  |  δ (ppm) = (νéchantillon − νréf) / νspectromètre × 10⁶","desc":"Spectroscopie d'identification structurale des molécules organiques — principe et applications pharmaceutiques","cat":"Chimie analytique"},{"name":"Complexométrie — Titrage à l'EDTA","formula":"Dureté totale (°f) = [Ca²⁺+Mg²⁺] × 100/18 | K'f = Kf × αY(H) | Courbe titrage : E = f(V EDTA) → saut au point d'équivalence","desc":"Titrage par formation de complexes stables entre un métal (cation) et un agent complexant (EDTA). Applications : dureté de l'eau, dosage Ca²⁺, Mg²⁺, médicaments contenant des métaux.","cat":"Chimie analytique"},{"name":"Titrage par Oxydoréduction","formula":"KMnO4 + 5Fe²⁺ + 8H⁺ → Mn²⁺ + 5Fe³⁺ + 4H2O | I2 + 2Na2S2O3 → 2NaI + Na2S4O6 | E (Nernst) = E° + (0,059/n)×log([ox]/[red])","desc":"Titrages redox utilisant des oxydants forts (permanganate, dicromate, iode/thiosulfate, brome). Applications en contrôle qualité pharmaceutique.","cat":"Chimie analytique"},{"name":"Argentimétrie — Titrage par Précipitation","formula":"Ks(AgCl) = [Ag⁺][Cl⁻] = 1,8×10⁻¹⁰ | pAg = -log[Ag⁺] | Saut de pAg à l'équivalence ~ 3 unités pAg","desc":"Dosage des halogénures (Cl⁻, Br⁻, I⁻, SCN⁻) par précipitation avec AgNO3. Méthodes de Mohr, Fajans, Volhard.","cat":"Chimie analytique"},{"name":"HPLC — Chromatographie Liquide Haute Performance","formula":"Rs = 2(tR2-tR1)/(w1+w2) ≥ 1,5 (critère Ph. Eur.) | N = (tR/σ)² | Rapport signal/bruit ≥ 10 (quantification), ≥ 3 (détection) | ICH Q2 : LOQ = 10×σb/pente","desc":"Technique reine de l'analyse pharmaceutique. Séparation, identification et quantification des principes actifs et impuretés dans les médicaments.","cat":"Chimie analytique"},{"name":"Chromatographie en Phase Gazeuse (CPG/GC)","formula":"Indice de Kovat (IK) = 100 × [n + (logtr'x - logtr'n)/(logtr'n+1 - logtr'n)] | tr' = tR - tM (temps réduit) | % surface = (surface pic i / Σ surfaces) × 100","desc":"Séparation de composés volatils ou volatilisables. Technique de référence pour l'analyse des huiles essentielles, solvants résiduels, alcool éthylique.","cat":"Chimie analytique"},{"name":"Électrophorèse Capillaire (CE)","formula":"μep = q/(6πηr) | μtotal = μep + μeof | Résolution Rs = (μep2-μep1)/(4√(DU/2μeof)) | pHi : méthode CE par focalisation (cIEF)","desc":"Séparation électrophorétique dans un capillaire de silice fondue sous champ électrique élevé. Haute efficacité, faibles volumes, applications en biopharmaceutique.","cat":"Chimie analytique"},{"name":"Spectrométrie de Masse (SM)","formula":"m/z = masse/charge | M + H⁺ → [M+H]⁺ (ESI+) | Résolution R = M/ΔM | MRM : transition Q1→Q3 (précurseur → fragment) | HRMS : Δmasse < 5 ppm","desc":"Identification et quantification de molécules par rapport masse/charge (m/z). Gold standard pour identification et quantification analytique, couplé en HPLC-MS/MS.","cat":"Chimie analytique"},{"name":"Validation Analytique — ICH Q2","formula":"Recouvrement (%) = [(C mesuré - C0) / C ajouté] × 100 | RSD = (σ/x̄) × 100 | LOD = 3,3σ/S | LOQ sc":"Séparation de protéines par taille sous champ électrique en gel de polyacrylamide avec SDS. Identification par Western Blot (anticorps spécifiques).","cat":"Chimie analytique"},{"name":"ICP-MS / ICP-OES — Dosage des Métaux et Impuretés Élémentaires (ICH Q3D)","formula":"ICH Q3D : Permis Daily Exposure (PDE) [µg/j] = catégorie 1 (Cd, Pb, As, Hg) + 2A (Co, V, Ni) + 2B + 3\nOES : I = ε × n × A × hν | LOD = 3σb/pente\nMS : ratio m/z → identification isotopique → quantification par standard interne (Bi, Rh, Ir, In)\nPh. Eur. 2.4.20 (métaux lourds colorimétrique — déprécié) → Ph. Eur. 5.20 ICP-MS recommandé\nDilution isotopique (IDMS) : technique absolue — incertitude ≤ 1%","desc":"Techniques de spectrométrie d'émission (OES) et de masse (MS) couplées à un plasma inductif (ICP). Référence pour la quantification des éléments traces dans les médicaments — conformité ICH Q3D/Ph. Eu","cat":"Chimie analytique"},{"name":"Dosage de l'Eau — Karl Fischer (Coulométrique & Volumétrique)","formula":"KFV : w%(H2O) = (V × f) / m × 100  [V = vol réactif mL, f = titre mg H2O/mL, m = prise d'essai mg]\nKFC : m(H2O) µg = Q (µC) / 10,71  [Q = charge électrique Faraday]\nFacteur KFV : f = 15,66 × m(tartrate) / V(réactif)\nIncertitude : étalonnage avec eau standard certifiée (Fluka 95°, eau en méthanol 1,0 mg/g)\nPh. Eur. 2.5.12 (volumétrique) / 2.5.32 (coulométrique)","desc":"Méthode de référence pour la quantification de l'eau dans les matières premières et produits pharmaceutiques. Deux modes : volumétrique (> 1% H₂O) et coulométrique (< 1%, traces). Obligatoire dans de","cat":"Chimie analytique"},{"name":"DSC — Calorimétrie Différentielle à Balayage (Polymorphisme, Tf, Enthalpie)","formula":"ΔH (enthalpie fusion) = Aire pic / m [J/g] | Tg = température transition vitreuse (Cp mid)\nPureté par DSC (loi de van't Hoff) : Tf = T°f − R(T°f)²x2/(ΔHf) | x2 = fraction molaire impureté\nRésolution : ΔT = T(peak1) − T(peak2) > 10°C pour distinguer deux polymorph\nTg prédiction Gordon-Taylor : // ═══════════════════════════════════════════════════════════
// FORMULA + RECOGNITION
// ═══════════════════════════════════════════════════════════
function computeFormula(atoms) {
  if (!atoms.length) return '';
  const counts = {};
  atoms.forEach(a => counts[a.sym] = (counts[a.sym]||0)+1);
  const order = ['C','H','N','O','F','Cl','Br','S','P','I','Na','K','Ca','Mg','Fe'];
  let f = '';
  order.forEach(el => { if(counts[el]){ f+=el+(counts[el]>1?counts[el]:''); delete counts[el]; }});
  Object.keys(counts).sort().forEach(el => { f+=el+(counts[el]>1?counts[el]:''); });
  return f;
}
function computeValences(atoms, bonds) {
  const v = {};
  atoms.forEach(a => v[a.id]=0);
  bonds.forEach(b => { v[b.from]=(v[b.from]||0)+b.order; v[b.to]=(v[b.to]||0)+b.order; });
  return v;
}
function recognizeMolecule(formula) {
  return MOLECULE_DB.filter(m => m.formula && m.formula.replace(/\s/g,'') === formula);
}

async function load3D(mol) {
  const vw = document.getElementById('viewer-3d');
  document.getElementById('viewer-empty').style.display='none';
  vw.innerHTML = '<div class="loading pulse">Chargement 3D…</div>'
    +'<div class="badge">3D · PubChem</div><div class="drag-hint">Glisser pour tourner · Molette: zoom</div>';
  if (!mol.cid) { vw.innerHTML = '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text3)">Pas de CID PubChem</div><div class="badge">3D · PubChem</div>'; return; }
  try {
    const r = await fetch(`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${mol.cid}/JSON?record_type=3d`);
    const data = await r.json();
    const cpd = data.PC_Compounds[0];
    const elems = cpd.atoms.element, coords = cpd.coords[0].conformers[0], bdata = cpd.bonds||{};
    const molData = {
      atoms: elems.map((z,i) => ({z, x:coords.x[i], y:coords.y[i], z3:coords.z[i]})),
      bonds: (bdata.aid1||[]).map((a1,i) => ({a1:a1-1, a2:bdata.aid2[i]-1, order:(bdata.order||[])[i]||1}))
    };
    build3DScene(vw, molData);
  } catch(e) {
    vw.innerHTML = '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:10px;color:var(--text3)">Pas de données 3D<br><small style="opacity:.6">'+mol.name+'</small></div><div class="badge">3D · PubChem</div>';
  }
}

function build3DScene(container, molData) {
  if (anim3D) cancelAnimationFrame(anim3D);
  if (renderer3D) { renderer3D.dispose(); }
  container.innerHTML = '<div class="badge">3D · PubChem</div><div class="drag-hint">Glisser · Molette: zoom</div>';
  const W = container.clientWidth||320, H = container.clientHeight||280;
  renderer3D = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer3D.setSize(W, H); renderer3D.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer3D.setClearColor(0x080b13,1);
  container.appendChild(renderer3D.domElement);
  scene3D = new THREE.Scene();
  camera3D = new THREE.PerspectiveCamera(45,W/H,.1,1000);
  camera3D.position.z = zoom3D;
  scene3D.add(new THREE.AmbientLight(0xffffff,.55));
  const dl = new THREE.DirectionalLight(0xffffff,1.0); dl.position.set(5,8,5); scene3D.add(dl);
  const dl2 = new THREE.DirectionalLight(0x4080ff,.35); dl2.position.set(-5,-3,-5); scene3D.add(dl2);
  group3D = new THREE.Group(); scene3D.add(group3D);
  // Center
  const xs=molData.atoms.map(a=>a.x), ys=molData.atoms.map(a=>a.y), zs=molData.atoms.map(a=>a.z3);
  const cx=(Math.max(...xs)+Math.min(...xs))/2, cy=(Math.max(...ys)+Math.min(...ys))/2, cz=(Math.max(...zs)+Math.min(...zs))/2;
  const maxR=Math.max(...xs.map(x=>Math.abs(x-cx)),...ys.map(y=>Math.abs(y-cy)))||1;
  const sc = 2.5/maxR;
  // Bonds
  molData.bonds.forEach(b => {
    const a1=molData.atoms[b.a1], a2=molData.atoms[b.a2]; if(!a1||!a2)return;
    const p1=new THREE.Vector3((a1.x-cx)*sc,(a1.y-cy)*sc,(a1.z3-cz)*sc);
    const p2=new THREE.Vector3((a2.x-cx)*sc,(a2.y-cy)*sc,(a2.z3-cz)*sc);
    const dir=new THREE.Vector3().subVectors(p2,p1), len=dir.length();
    const mid=new THREE.Vector3().addVectors(p1,p2).multiplyScalar(.5);
    const offsets=b.order===1?[[0]]:b.order===2?[[-0.065],[0.065]]:[[-0.11],[0],[0.11]];
    offsets.forEach(([ox])=>{
      const geo=new THREE.CylinderGeometry(.042,.042,len,8);
      const mat=new THREE.MeshPhongMaterial({color:0x6678aa,shininess:60});
      const mesh=new THREE.Mesh(geo,mat);
      mesh.position.copy(mid);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
      if(ox!==0){const perp=new THREE.Vector3(-dir.z,0,dir.x).normalize().multiplyScalar(ox); mesh.position.add(perp);}
      group3D.add(mesh);
    });
  });
  // Atoms
  molData.atoms.forEach(a=>{
    const r=(ATOMIC_RADII[a.z]||.7)*.42, col=ATOMIC_COLORS[a.z]||0xaaaaaa;
    const geo=new THREE.SphereGeometry(r,20,20);
    const mat=new THREE.MeshPhongMaterial({color:col,shininess:90,specular:0x333333});
    const mesh=new THREE.Mesh(geo,mat);
    mesh.position.set((a.x-cx)*sc,(a.y-cy)*sc,(a.z3-cz)*sc);
    group3D.add(mesh);
  });
  (function tick(){
    anim3D=requestAnimationFrame(tick);
    if(group3D){ group3D.rotation.x=rot.x; group3D.rotation.y=rot.y; }
    camera3D.position.z=zoom3D;
    renderer3D.render(scene3D,camera3D);
  })();
}

function v3dDown(e){ isDrag3D=true; lastMouse3D={x:e.clientX,y:e.clientY}; e.preventDefault(); }
function v3dMove(e){ if(!isDrag3D)return; const dx=e.clientX-lastMouse3D.x,dy=e.clientY-lastMouse3D.y; rot.x+=dy*.012; rot.y+=dx*.012; lastMouse3D={x:e.clientX,y:e.clientY}; }
function v3dUp(){ isDrag3D=false; }
function v3dWheel(e){ e.preventDefault(); zoom3D=Math.max(2,Math.min(20,zoom3D+e.deltaY*.015)); }

let molListOffset = 0;
function filterMols(q) { molFilter = q.trim().toLowerCase(); renderMolList(); }

function renderMolList() {
  const list = document.getElementById('mol-list');
  const q = molFilter;
  let items = q
    ? MOLECULE_DB.filter(m => m.name.toLowerCase().includes(q) || (m.formula||'').toLowerCase().includes(q) || (m.cat||'').toLowerCase().includes(q) || (m.cas||'').includes(q))
    : MOLECULE_DB.slice(0, 120);
  list.innerHTML = '';
  if (!items.length) { list.innerHTML = '<div style="padding:12px;font-size:10px;color:var(--text3);text-align:center">Aucun résultat</div>'; return; }
  const shown = items.slice(0, 200);
  shown.forEach(mol => {
    const div = document.createElement('div');
    div.className = 'mol-item' + (selected3D && selected3D.name === mol.name ? ' active' : '');
    div.innerHTML = `<span class="mol-name">${mol.name}</span><span class="mol-formula">${mol.formula||''}</span>`;
    div.onclick = () => selectMolDirect(mol);
    list.appendChild(div);
  });
  if (items.length > 200) {
    const more = document.createElement('div');
    more.style = 'padding:6px 10px;font-size:9px;color:var(--text3);text-align:center';
    more.textContent = `+${items.length-200} résultats — affinez la recherche`;
    list.appendChild(more);
  }
}

function selectMolDirect(mol) {
  browsingMode = true;
  selected3D = mol;
  switchTab('info');
  renderMolList();
  renderInfo();
  load3D(mol);
}

// ═══════════════════════════════════════════════════════════
// SVG CANVAS
// ═══════════════════════════════════════════════════════════
function getAtomR(sym) { return Math.max(17, (ELEMENTS[sym]?.radius||.7)*17+9); }

function render() {
  const formula = computeFormula(atoms);
  const valences = computeValences(atoms, bonds);
  document.getElementById('formula-display').textContent = formula || '—';
  document.getElementById('atom-count').textContent = atoms.length ? `${atoms.length} atome${atoms.length>1?'s':''} · ${bonds.length} liaison${bonds.length>1?'s':''}` : '';
  document.getElementById('hint-text').textContent = bondStart ? 'Cliquez un 2e atome pour la liaison' : (tool==='add'?`Ajout : ${selectedEl}`:'');

  // Empty state
  document.getElementById('empty-state').style.display = atoms.length ? 'none' : '';

  // Bonds
  const bl = document.getElementById('bonds-layer');
  bl.innerHTML = '';
  bonds.forEach(b => {
    const a1=atoms.find(a=>a.id===b.from), a2=atoms.find(a=>a.id===b.to);
    if(!a1||!a2)return;
    const dx=a2.x-a1.x, dy=a2.y-a1.y, len=Math.sqrt(dx*dx+dy*dy)||1;
    const px=-dy/len*3, py=dx/len*3;
    const offsets=b.order===1?[0]:b.order===2?[-1,1]:[-2,0,2];
    offsets.forEach((o,i)=>{
      const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
      ln.setAttribute('x1',a1.x+px*o); ln.setAttribute('y1',a1.y+py*o);
      ln.setAttribute('x2',a2.x+px*o); ln.setAttribute('y2',a2.y+py*o);
      ln.setAttribute('stroke',b.order>1?'#7ec8e3':'rgba(160,190,240,.55)');
      ln.setAttribute('stroke-width','2'); ln.setAttribute('stroke-linecap','round');
      bl.appendChild(ln);
    });
  });

  // Atoms
  const al = document.getElementById('atoms-layer');
  al.innerHTML = '';
  atoms.forEach(atom => {
    const el = ELEMENTS[atom.sym]||{color:'#aaa',valence:4};
    const r = getAtomR(atom.sym);
    const used = valences[atom.id]||0, maxV=el.valence||4, over=used>maxV, under=(!over&&used>0&&used<maxV), isBs=bondStart===atom.id;
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.style.cursor = tool==='move'?'grab':'pointer';

    // Outline
    const outline = document.createElementNS('http://www.w3.org/2000/svg','circle');
    outline.setAttribute('cx',atom.x); outline.setAttribute('cy',atom.y); outline.setAttribute('r',r+3);
    outline.setAttribute('fill','none');
    outline.setAttribute('stroke',isBs?'#fbbf24':over?'#ef4444':under?'rgba(251,191,36,.55)':'transparent');
    outline.setAttribute('stroke-width','2');
    if(isBs) outline.setAttribute('stroke-dasharray','5 3');
    g.appendChild(outline);

    // Fill
    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx',atom.x); circle.setAttribute('cy',atom.y); circle.setAttribute('r',r);
    circle.setAttribute('fill',el.color+'22'); circle.setAttribute('stroke',over?'#ef4444':under?'#fbbf24':isBs?'#fbbf24':el.color); circle.setAttribute('stroke-width','2.5');
    g.appendChild(circle);

    // Symbol
    const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.setAttribute('x',atom.x); txt.setAttribute('y',atom.y);
    txt.setAttribute('text-anchor','middle'); txt.setAttribute('dominant-baseline','central');
    txt.setAttribute('fill',el.color||'white'); txt.setAttribute('font-size',r<17?10:13); txt.setAttribute('font-weight','700'); txt.setAttribute('font-family','monospace');
    txt.textContent=atom.sym; g.appendChild(txt);

    // Valence badge
    if(used>0){ const vt=document.createElementNS('http://www.w3.org/2000/svg','text'); vt.setAttribute('x',atom.x+r-2); vt.setAttribute('y',atom.y-r+2); vt.setAttribute('font-size','9'); vt.setAttribute('fill',over?'#ef4444':under?'#fbbf24':'rgba(255,255,255,.45)'); vt.setAttribute('font-weight','700'); vt.textContent=over||under?used+'/'+maxV:used; g.appendChild(vt); }

    g.addEventListener('click', e => { e.stopPropagation(); handleAtomClick(atom); });
    g.addEventListener('mousedown', e => { e.stopPropagation(); handleAtomDown(e,atom); });
    al.appendChild(g);
  });

  // Recognition
  const newRec = recognizeMolecule(formula);
  const changed = JSON.stringify(newRec.map(m=>m.name)) !== JSON.stringify(recognized.map(m=>m.name));
  recognized = newRec;
  if(changed){
    if(!userPickedFromList){
      if(recognized.length===1&&!browsingMode){selected3D=recognized[0];load3D(selected3D);renderInfo();}
      else if(recognized.length===0&&!browsingMode){selected3D=null;resetViewer();renderInfo();}
      else if(browsingMode){renderInfo();}
      else { renderInfo(); }
    } else { renderInfo(); }
    if(mode==='challenge'&&challenge&&recognized.find(function(m){return m.name===challenge.name;})){
      challengeWon=true; renderChallenge(); }
  }
}

function resetViewer(){ if(anim3D){cancelAnimationFrame(anim3D);anim3D=null;} if(renderer3D){renderer3D.dispose();renderer3D=null;} const vw=document.getElementById('viewer-3d'); vw.innerHTML='<div id="viewer-empty" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--text3);font-size:11px"><span style="font-size:32px">⬡</span><span>Assemblez une molécule reconnue</span></div><div class="badge">3D · PubChem</div>'; }

function renderInfo() {
  var panel = document.getElementById('info-panel');
  var valences = computeValences(atoms, bonds);
  var formula  = computeFormula(atoms);

  if (recognized.length > 0) {
    var mol = selected3D || recognized[0];
    var mw  = mol.mw  != null ? parseFloat(mol.mw)  : null;
    var lp  = mol.logp != null ? parseFloat(mol.logp) : null;
    var lip = (mw != null && lp != null) ? (mw<=500 && lp<=5 && (mol.hbd||0)<=5 && (mol.hba||0)<=10) : null;
    var h = '';

    // Under-valence check – even if formula matches, bonds may be incomplete
    var underAtoms = atoms.filter(function(a){ var u=valences[a.id]||0,mv=ELEMENTS[a.sym]?ELEMENTS[a.sym].valence:4; return u>0&&u<mv; });
    if(underAtoms.length>0){
      h += '<div style="margin-bottom:8px;padding:7px 10px;border-radius:6px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);font-size:11px;color:#fbbf24">';
      h += '<b>⚡ Structure incomplète — liaisons doubles/triples manquantes ?</b><br>';
      h += underAtoms.map(function(a){ var u=valences[a.id]||0,mv=ELEMENTS[a.sym]?ELEMENTS[a.sym].valence:4; return a.sym+' : '+u+'/'+mv+' liaisons'; }).join(' · ');
      h += '</div>';
    }

    if (recognized.length > 1) {
      h += '<div style="margin-bottom:8px"><div style="font-size:11px;color:var(--text3);margin-bottom:4px">ISOMERES (' + recognized.length + ')</div><div id="iso-tabs">';
      recognized.forEach(function(m) {
        var safe = m.name.replace(/'/g, "\'");
        var active = m.name === mol.name ? ' active' : '';
        h += '<button class="iso-btn' + active + '" onclick="selectIso(\'' + safe + '\'"><b>' + esc(m.formula||'') + '</b> - ' + esc(m.name) + '</button>';
      });
      h += '</div></div>';
    }

    h += '<div style="display:inline-flex;align-items:center;padding:3px 12px;border-radius:20px;margin-bottom:10px;background:rgba(58,176,158,.14);border:1px solid rgba(58,176,158,.3);font-size:11px;color:var(--accent);font-weight:700">' + esc(mol.cat||'Molecule') + '</div>';
    h += '<div style="font-size:16px;font-weight:900;color:white;line-height:1.3;margin-bottom:4px">' + esc(mol.name) + '</div>';
    h += '<div style="font-size:13px;color:var(--accent2);font-family:monospace;margin-bottom:10px">' + esc(mol.formula||'') + (mol.cas ? ' <span style="font-size:10px;color:var(--text3)">CAS ' + esc(mol.cas) + '</span>' : '') + '</div>';
    if (mol.desc)  h += '<div class="desc-box">'  + esc(mol.desc)  + '</div>';
    if (mol.uses)  h += '<div style="font-size:11px;color:var(--text2);margin-bottom:10px;padding:7px 10px;background:rgba(126,200,227,.07);border-radius:5px;border-left:2px solid rgba(126,200,227,.3)"><b style="color:var(--accent2);font-size:10px">Usages : </b>' + esc(mol.uses) + '</div>';

    h += '<div style="font-size:11px;color:var(--text3);font-weight:700;letter-spacing:1px;margin-bottom:8px">PROPRIETES</div><div class="prop-grid">';
    if (mw != null) h += '<div class="prop-cell"><div class="prop-label">PM (g/mol)</div><div class="prop-val" style="color:var(--accent2)">' + mw.toFixed(2) + '</div></div>';
    if (lp != null) { var lc=lp>5?'#ef4444':lp<0?'#3ab09e':'#fbbf24'; h += '<div class="prop-cell"><div class="prop-label">logP</div><div class="prop-val" style="color:' + lc + '">' + lp.toFixed(2) + '</div></div>'; }
    if (mol.hbd != null) h += '<div class="prop-cell"><div class="prop-label">HBD</div><div class="prop-val" style="color:#f472b6">' + mol.hbd + '</div></div>';
    if (mol.hba != null) h += '<div class="prop-cell"><div class="prop-label">HBA</div><div class="prop-val" style="color:#e88c5a">' + mol.hba + '</div></div>';
    h += '</div>';

    if (lip !== null) {
      var bg=lip?'rgba(58,176,158,.12)':'rgba(239,68,68,.12)', bd=lip?'rgba(58,176,158,.4)':'rgba(239,68,68,.4)', tc=lip?'#3ab09e':'#ef4444';
      h += '<div class="lipinski" style="background:' + bg + ';border:1px solid ' + bd + '"><span style="color:' + tc + '">' + (lip ? 'OK Lipinski Ro5' : 'Hors Lipinski') + '</span><div style="font-size:9px;color:var(--text3);margin-top:2px">PM&lt;=500 logP&lt;=5 HBD&lt;=5 HBA&lt;=10</div></div>';
    }
    if (mol.smiles) h += '<div class="smiles-box"><b style="color:var(--text3)">SMILES : </b>' + esc(mol.smiles) + '</div>';
    if (mol.cid)    h += '<a class="pubchem-link" href="https://pubchem.ncbi.nlm.nih.gov/compound/' + mol.cid + '" target="_blank" rel="noopener">Voir sur PubChem</a>';
    panel.innerHTML = h;

  } else if (atoms.length > 0) {
    var warns = atoms.filter(function(a){ return (valences[a.id]||0) > (ELEMENTS[a.sym] ? ELEMENTS[a.sym].valence : 4); });
    var underW = atoms.filter(function(a){ var u=valences[a.id]||0,mv=ELEMENTS[a.sym]?ELEMENTS[a.sym].valence:4; return u>0 && u<mv; });
    var wh = warns.map(function(a){ return '<div class="val-warn">⚠ Valence dépassée : ' + a.sym + ' (' + (valences[a.id]||0) + '/' + (ELEMENTS[a.sym]?ELEMENTS[a.sym].valence:4) + ' liaisons)</div>'; }).join('');
    wh += underW.map(function(a){ var u=valences[a.id]||0,mv=ELEMENTS[a.sym]?ELEMENTS[a.sym].valence:4; return '<div class="val-under">⚡ Liaisons manquantes : ' + a.sym + ' (' + u + '/' + mv + ' — ' + (mv-u) + ' liaison(s) en moins)</div>'; }).join('');
    panel.innerHTML = '<div class="no-mol"><div class="icon">&#x1f52c;</div><p><b style="color:rgba(255,255,255,.5)">' + esc(formula) + '</b><br>Molécule non reconnue.<br>' + (warns.length||underW.length ? '' : 'Vérifiez la connectivité.') + '</p>' + wh + '</div>';
  } else {
    var guide = [['H2O','2xH + 1xO'],['CH4','1xC + 4xH'],['CO2','1xC + 2xO'],['C2H5OH','2xC + 6xH + 1xO'],['NH3','1xN + 3xH']];
    var gh = guide.map(function(x){ return '<div class="guide-item"><div class="gm">' + x[0] + '</div><div class="ga">' + x[1] + '</div></div>'; }).join('');
    panel.innerHTML = '<div class="no-mol"><div class="icon">&#x2b21;</div><div style="font-size:11px;color:var(--text3);font-weight:700;letter-spacing:1px;margin-bottom:10px">GUIDE RAPIDE</div>' + gh + '</div>';
  }
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

var userPickedFromList = false;

function selectIso(name){ const mol=recognized.find(m=>m.name===name); if(mol){selected3D=mol;load3D(mol);renderInfo();}}

// ═══════════════════════════════════════════════════════════
// CANVAS EVENTS
// ═══════════════════════════════════════════════════════════
function handleSVGClick(e) {
  if(tool!=='add') return;
  const svg=document.getElementById('mol-svg');
  const rect=svg.getBoundingClientRect();
  atoms.push({id:++atomCnt, sym:selectedEl, x:e.clientX-rect.left, y:e.clientY-rect.top});
  render();
}
function handleAtomClick(atom) {
  if(tool==='delete'){ atoms=atoms.filter(a=>a.id!==atom.id); bonds=bonds.filter(b=>b.from!==atom.id&&b.to!==atom.id); if(bondStart===atom.id)bondStart=null; render(); return; }
  if(tool==='bond'){
    if(!bondStart){ bondStart=atom.id; render(); return; }
    if(bondStart===atom.id){ bondStart=null; render(); return; }
    const ex=bonds.find(b=>(b.from===bondStart&&b.to===atom.id)||(b.from===atom.id&&b.to===bondStart));
    if(ex) bonds=bonds.map(b=>b.id===ex.id?{...b,order:(b.order%3)+1}:b);
    else bonds.push({id:++bondCnt,from:bondStart,to:atom.id,order:bondOrder});
    bondStart=null; render();
  }
}
function handleAtomDown(e,atom){ if(tool!=='move')return; const svg=document.getElementById('mol-svg'); const rect=svg.getBoundingClientRect(); dragging=atom.id; dragOffset={x:e.clientX-rect.left-atom.x,y:e.clientY-rect.top-atom.y}; }
function handleSVGMove(e){ if(tool==='move'&&dragging){ const svg=document.getElementById('mol-svg'); const rect=svg.getBoundingClientRect(); atoms=atoms.map(a=>a.id===dragging?{...a,x:e.clientX-rect.left-dragOffset.x,y:e.clientY-rect.top-dragOffset.y}:a); render(); }}
function handleSVGUp(){ dragging=null; }

// ═══════════════════════════════════════════════════════════
// UI BUILDERS
// ═══════════════════════════════════════════════════════════
function buildPalette(){
  const p=document.getElementById('palette');
  p.innerHTML=Object.entries(ELEMENTS).map(([sym,el])=>`
    <button class="atom-btn" id="el-${sym}" onclick="selectEl('${sym}')" style="border-color:${sym===selectedEl?el.color:el.color+'60'};background:${sym===selectedEl?el.color+'38':el.color+'12'};color:${el.color}">
      <span class="sym" style="text-shadow:0 0 8px ${el.color}80">${sym}</span>
      <span class="nm" style="color:${el.color}90">${el.name.substring(0,7)}</span>
    </button>`).join('');
}
function selectEl(sym){ selectedEl=sym; tool='add'; buildPalette(); buildTools(); }

function buildTools(){
  const TOOLS=[{id:'add',ico:'⊕',label:'Ajouter'},{id:'bond',ico:'∿',label:'Liaison'},{id:'move',ico:'✥',label:'Déplacer'},{id:'delete',ico:'⌫',label:'Effacer'}];
  document.getElementById('tools').innerHTML=TOOLS.map(t=>`
    <button class="tool-btn" onclick="selectTool('${t.id}')" style="border-color:${tool===t.id?'rgba(58,176,158,.6)':'rgba(255,255,255,.1)'};background:${tool===t.id?'rgba(58,176,158,.18)':'rgba(255,255,255,.04)'};color:${tool===t.id?'var(--accent)':'rgba(255,255,255,.55)'}">
      <span class="ico">${t.ico}</span><span style="font-size:8px">${t.label}</span>
    </button>`).join('');
  const bow=document.getElementById('bond-order-wrap');
  bow.style.display=tool==='bond'?'':'none';
  if(tool==='bond'){
    document.getElementById('bond-order').innerHTML=[1,2,3].map(o=>`
      <button class="bo-btn" onclick="setBondOrd(${o})" style="border-color:${bondOrder===o?'#f472b6':'rgba(255,255,255,.15)'};background:${bondOrder===o?'rgba(244,114,182,.18)':'transparent'};color:${bondOrder===o?'#f472b6':'rgba(255,255,255,.5)'}">
        ${'─══'[o-1]||o}
      </button>`).join('');
  }
}
function selectTool(t){ tool=t; buildTools(); if(t!=='bond')bondStart=null; render(); }
function setBondOrd(o){ bondOrder=o; buildTools(); }

function setMode(m){
  mode=m;
  ['build','challenge'].forEach(id=>{
    const btn=document.getElementById('btn-'+id);
    const on=id===m; btn.style.borderColor=on?'var(--accent)':'rgba(255,255,255,.15)'; btn.style.background=on?'rgba(58,176,158,.18)':'transparent'; btn.style.color=on?'var(--accent)':'var(--text2)';
  });
  if(m==='challenge') startChallenge();
  else { challenge=null; challengeWon=false; document.getElementById('challenge-card').style.display='none'; }
}

function startChallenge(){
  // Pick a molecule with a formula that can be built
  const buildable = MOLECULE_DB.filter(m => m.formula && m.formula.length<10 && m.cid);
  challenge = buildable[Math.floor(Math.random()*buildable.length)];
  challengeWon=false; clearAll(false); renderChallenge();
}
function renderChallenge(){
  const card=document.getElementById('challenge-card');
  if(!challenge){card.style.display='none';return;}
  card.style.display='';
  card.style.background=challengeWon?'rgba(58,176,158,.2)':'rgba(255,193,7,.08)';
  card.style.border=`1px solid ${challengeWon?'#3ab09e':'#fbbf24'}`;
  card.innerHTML=`<div style="font-size:9px;color:var(--text2);margin-bottom:3px">Construire :</div>
    <div style="font-size:13px;font-weight:700;color:${challengeWon?'#3ab09e':'#fbbf24'}">${challenge.name}</div>
    <div style="font-size:10px;color:var(--text2);margin-top:2px;font-family:monospace">${challenge.formula}</div>
    ${challengeWon?'<div style="font-size:12px;color:var(--accent);font-weight:700;margin-top:4px">✓ Bravo !</div>':''}
    <button onclick="startChallenge()" style="margin-top:6px;width:100%;padding:4px;border-radius:5px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:rgba(255,255,255,.7);font-size:10px;font-family:inherit">Nouveau défi ↺</button>`;
}

function clearAll(doRender=true){ browsingMode=false; atoms=[]; bonds=[]; bondStart=null; if(!challenge)selected3D=null; challengeWon=false; resetViewer(); renderMolList(); if(doRender){render(); renderInfo();} }

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
buildPalette();
buildTools();
renderMolList();
render();
renderInfo();
</script>
</body>
</html>
