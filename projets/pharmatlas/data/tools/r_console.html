<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R Console — WebR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0d0f14;
    --panel:    #141720;
    --border:   #1e2333;
    --accent:   #4fc3f7;
    --accent2:  #81c784;
    --accent3:  #ffb74d;
    --err:      #ef5350;
    --text:     #cdd6f4;
    --muted:    #6c7086;
    --r-blue:   #276DC2;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace}

  /* ── HEADER ── */
  header{
    display:flex;align-items:center;gap:14px;
    padding:10px 18px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    user-select:none;
    position:relative;z-index:10;
  }
  .logo{
    display:flex;align-items:center;gap:10px;
  }
  .logo-r{
    width:34px;height:34px;border-radius:8px;
    background:var(--r-blue);
    display:flex;align-items:center;justify-content:center;
    font-family:'Syne',sans-serif;font-weight:800;font-size:18px;color:#fff;
    letter-spacing:-1px;box-shadow:0 0 18px rgba(39,109,194,.45);
  }
  .logo-title{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;letter-spacing:.04em;color:#fff}
  .logo-sub{font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:1px}

  .status-pill{
    display:flex;align-items:center;gap:6px;
    padding:4px 10px;border-radius:20px;
    background:rgba(255,255,255,.04);border:1px solid var(--border);
    font-size:11px;color:var(--muted);margin-left:auto;
  }
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:background .4s,box-shadow .4s}
  .status-dot.loading{background:var(--accent3);box-shadow:0 0 8px var(--accent3);animation:pulse 1s infinite}
  .status-dot.ready  {background:var(--accent2);box-shadow:0 0 8px var(--accent2)}
  .status-dot.error  {background:var(--err);box-shadow:0 0 8px var(--err)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* ── LAYOUT ── */
  .layout{display:flex;height:calc(100vh - 57px)}

  /* ── SIDEBAR ── */
  aside{
    width:200px;min-width:200px;
    background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;overflow:hidden;
  }
  .sidebar-section{padding:10px 0;}
  .sidebar-label{
    font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);padding:0 14px 6px;
  }
  .snippet-btn{
    display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;
    padding:7px 14px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text);
    border-left:2px solid transparent;transition:all .15s;
  }
  .snippet-btn:hover{background:rgba(79,195,247,.06);border-left-color:var(--accent);color:var(--accent)}
  .snippet-btn .snip-tag{font-size:9px;color:var(--muted);display:block;margin-top:1px}

  .sidebar-sep{height:1px;background:var(--border);margin:4px 0;}

  /* ── MAIN AREA ── */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}

  /* ── EDITOR ── */
  .editor-wrap{
    flex:0 0 auto;
    border-bottom:1px solid var(--border);
    display:flex;flex-direction:column;
  }
  .editor-header{
    display:flex;align-items:center;gap:8px;
    padding:6px 14px;background:rgba(0,0,0,.2);
    border-bottom:1px solid var(--border);
  }
  .editor-tab{
    font-size:11px;color:var(--accent);border-bottom:2px solid var(--accent);
    padding-bottom:2px;letter-spacing:.04em;
  }
  .editor-actions{margin-left:auto;display:flex;gap:6px}
  .btn{
    display:inline-flex;align-items:center;gap:5px;
    padding:5px 12px;border-radius:6px;border:1px solid var(--border);
    background:rgba(255,255,255,.04);color:var(--text);
    font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;
    transition:all .15s;white-space:nowrap;
  }
  .btn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15)}
  .btn.primary{background:rgba(79,195,247,.12);border-color:rgba(79,195,247,.35);color:var(--accent)}
  .btn.primary:hover{background:rgba(79,195,247,.22)}
  .btn.danger{background:rgba(239,83,80,.08);border-color:rgba(239,83,80,.3);color:var(--err)}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn .icon{font-size:13px}

  #editor{
    resize:none;outline:none;border:none;
    background:transparent;color:var(--text);
    font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.7;
    padding:14px 18px;
    width:100%;height:180px;
    tab-size:2;
    caret-color:var(--accent);
  }
  #editor::selection{background:rgba(79,195,247,.2)}

  /* ── RESIZE HANDLE ── */
  .resizer{
    height:5px;background:var(--border);cursor:row-resize;
    transition:background .15s;flex-shrink:0;
  }
  .resizer:hover,.resizer.dragging{background:var(--accent)}

  /* ── OUTPUT / CONSOLE ── */
  .output-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .output-header{
    display:flex;align-items:center;gap:8px;
    padding:6px 14px;background:rgba(0,0,0,.2);
    border-bottom:1px solid var(--border);
  }
  .output-tab{font-size:11px;color:var(--accent2);border-bottom:2px solid var(--accent2);padding-bottom:2px}
  #output{
    flex:1;overflow-y:auto;padding:12px 18px;
    font-size:12px;line-height:1.8;
    scroll-behavior:smooth;
  }
  #output::-webkit-scrollbar{width:5px}
  #output::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

  .out-line{display:block;white-space:pre-wrap;word-break:break-all}
  .out-line.info   {color:var(--muted)}
  .out-line.stdout {color:var(--text)}
  .out-line.stderr {color:var(--err)}
  .out-line.prompt {color:var(--accent);opacity:.6}
  .out-line.success{color:var(--accent2)}
  .out-line.warning{color:var(--accent3)}

  /* ── PLOT PANEL ── */
  .plot-wrap{
    width:320px;min-width:260px;max-width:50%;
    border-left:1px solid var(--border);
    display:flex;flex-direction:column;
    background:var(--panel);
  }
  .plot-header{
    padding:6px 14px;background:rgba(0,0,0,.2);
    border-bottom:1px solid var(--border);
    font-size:11px;color:var(--accent3);
    border-bottom-color:var(--border);
    display:flex;align-items:center;gap:8px;
  }
  .plot-tab-label{border-bottom:2px solid var(--accent3);padding-bottom:2px}
  #plot-container{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;padding:12px}
  #plot-container::-webkit-scrollbar{width:5px}
  #plot-container::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
  .plot-empty{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--muted);font-size:11px;text-align:center;gap:8px;width:100%;
  }
  .plot-empty .big{font-size:36px}
  .plot-img-wrap{
    position:relative;background:#fff;border-radius:6px;overflow:hidden;
    box-shadow:0 4px 20px rgba(0,0,0,.5);width:100%;
  }
  .plot-img-wrap img{display:block;width:100%}
  .plot-num{
    position:absolute;top:6px;right:6px;
    background:rgba(0,0,0,.55);color:#fff;
    font-size:9px;padding:2px 6px;border-radius:10px;
  }

  /* ── GUTTER (line numbers) ── */
  .editor-outer{display:flex;overflow:hidden;flex:1}
  .line-nums{
    padding:14px 8px 14px 14px;background:rgba(0,0,0,.15);
    font-size:13px;line-height:1.7;color:var(--muted);
    text-align:right;user-select:none;min-width:40px;
    font-family:'JetBrains Mono',monospace;
  }

  /* ── VAR ENV PANE ── */
  #env-list{padding:6px 0;overflow-y:auto;flex:1}
  #env-list::-webkit-scrollbar{width:3px}
  #env-list::-webkit-scrollbar-thumb{background:var(--border)}
  .env-item{padding:5px 14px;font-size:10px;border-bottom:1px solid rgba(255,255,255,.03)}
  .env-item .env-name{color:var(--accent);font-weight:500}
  .env-item .env-type{color:var(--muted);font-size:9px}
  .env-item .env-val {color:var(--text);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}

  /* ── FOOTER ── */
  footer{
    height:22px;background:var(--r-blue);
    display:flex;align-items:center;padding:0 14px;gap:14px;
    font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.75);
  }
  footer span{margin-right:auto}

  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .fade-in{animation:fadeIn .2s ease forwards}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-r">R</div>
    <div>
      <div class="logo-title">R Console</div>
      <div class="logo-sub">powered by WebR · WebAssembly</div>
    </div>
  </div>
  <div class="status-pill">
    <div class="status-dot loading" id="statusDot"></div>
    <span id="statusText">Chargement de R…</span>
  </div>
</header>

<div class="layout">

  <!-- SIDEBAR -->
  <aside>
    <div class="sidebar-section">
      <div class="sidebar-label">TP Étalonnage — UE2</div>
      <button class="snippet-btn" onclick="loadSnippet('etalo_donnees')">1 · Données<span class="snip-tag">C · YET · YI · k · YImoy</span></button>
      <button class="snippet-btn" onclick="loadSnippet('etalo_graphe')">2 · Nuage de points<span class="snip-tag">plot · pch · axes</span></button>
      <button class="snippet-btn" onclick="loadSnippet('etalo_regression')">3 · Régression &amp; droite<span class="snip-tag">lm · b1 b2 · abline</span></button>
      <button class="snippet-btn" onclick="loadSnippet('etalo_validation')">4 · Validation · TR<span class="snip-tag">taux recouvrement · S²</span></button>
      <button class="snippet-btn" onclick="loadSnippet('etalo_prediction')">5 · Intervalles prédiction<span class="snip-tag">predict · YP · CP · IE</span></button>
      <button class="snippet-btn" onclick="loadSnippet('etalo_complet')">Script complet TP<span class="snip-tag">toutes les étapes</span></button>
    </div>
    <div class="sidebar-sep"></div>
    <div class="sidebar-section">
      <div class="sidebar-label">Cours R — Pharmacie</div>
      <button class="snippet-btn" onclick="loadSnippet('cours_bases')">Bases R<span class="snip-tag">vecteurs · types · str()</span></button>
      <button class="snippet-btn" onclick="loadSnippet('cours_anova')">ANOVA 1 voie<span class="snip-tag">lm · anova · TukeyHSD</span></button>
      <button class="snippet-btn" onclick="loadSnippet('cours_regression_multi')">Régression multiple<span class="snip-tag">step · AIC · vif()</span></button>
      <button class="snippet-btn" onclick="loadSnippet('cours_lois')">Lois &amp; Tests ajustement<span class="snip-tag">qqnorm · shapiro · χ²</span></button>
    </div>
    <div class="sidebar-sep"></div>
    <div class="sidebar-section">
      <div class="sidebar-label">Exemples généraux</div>
      <button class="snippet-btn" onclick="loadSnippet('basics')">Statistiques de base<span class="snip-tag">mean · sd · summary</span></button>
      <button class="snippet-btn" onclick="loadSnippet('plot')">Graphique<span class="snip-tag">plot · courbe</span></button>
      <button class="snippet-btn" onclick="loadSnippet('regression')">Régression linéaire<span class="snip-tag">lm · predict</span></button>
      <button class="snippet-btn" onclick="loadSnippet('histogram')">Histogramme<span class="snip-tag">hist · density</span></button>
      <button class="snippet-btn" onclick="loadSnippet('dataframe')">Data frame<span class="snip-tag">df · filter · apply</span></button>
      <button class="snippet-btn" onclick="loadSnippet('ttest')">Test de Student<span class="snip-tag">t.test · p-value</span></button>
      <button class="snippet-btn" onclick="loadSnippet('pharmacocinétique')">Pharmacocinétique<span class="snip-tag">PK · AUC · C(t)</span></button>
    </div>
    <div class="sidebar-sep"></div>
    <div class="sidebar-section" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
      <div class="sidebar-label">Environnement</div>
      <div id="env-list"><div class="env-item"><span class="env-type">vide</span></div></div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <!-- EDITOR -->
    <div class="editor-wrap" id="editorWrap">
      <div class="editor-header">
        <span class="editor-tab">script.R</span>
        <div class="editor-actions">
          <button class="btn" onclick="clearEditor()" title="Effacer l'éditeur">🗑 Vider</button>
          <button class="btn primary" id="runBtn" onclick="runCode()" disabled>
            <span class="icon">▶</span> Exécuter
          </button>
        </div>
      </div>
      <div class="editor-outer">
        <div class="line-nums" id="lineNums">1</div>
        <textarea id="editor" spellcheck="false"
          placeholder="# Écrire du code R ici…
# Ctrl+Enter ou ▶ pour exécuter"
          oninput="updateLineNums()"
          onscroll="syncScroll()"
          onkeydown="handleKey(event)"></textarea>
      </div>
    </div>

    <!-- RESIZE -->
    <div class="resizer" id="resizer"></div>

    <!-- OUTPUT -->
    <div class="output-wrap">
      <div class="output-header">
        <span class="output-tab">Console</span>
        <div style="margin-left:auto;display:flex;gap:6px">
          <button class="btn danger" onclick="clearConsole()">✕ Effacer</button>
        </div>
      </div>
      <div id="output"></div>
    </div>
  </div>

  <!-- PLOTS -->
  <div class="plot-wrap">
    <div class="plot-header">
      <span class="plot-tab-label">Graphiques</span>
      <span style="margin-left:auto;cursor:pointer;font-size:10px;color:var(--muted)" onclick="clearPlots()">✕ Tout effacer</span>
    </div>
    <div id="plot-container">
      <div class="plot-empty" id="plotEmpty">
        <div class="big">📊</div>
        <div>Les graphiques<br>apparaîtront ici</div>
      </div>
    </div>
  </div>

</div>

<footer>
  <span>WebR · R via WebAssembly</span>
  <span id="footerVer">—</span>
  <span id="footerTime">—</span>
</footer>

<script>
// Chargement dynamique du module WebR puis initialisation
let _webRModule;
async function _loadWebR() {
  _webRModule = await import('https://webr.r-wasm.org/latest/webr.mjs');
}
const _webRReady = _loadWebR();

// Proxy pour obtenir WebR après chargement
async function getWebR() {
  await _webRReady;
  return new _webRModule.WebR();
}

let webR;
let plotCount = 0;
let isReady = false;

// ── INIT ────────────────────────────────────────────────────────────────
async function init() {
  printLine('▸ Démarrage de WebR…', 'info');
  try {
    webR = await getWebR();
    await webR.init();
    // Capturer les graphiques via canvas virtuel
    await webR.evalRVoid(`options(device = webr::canvas)`);

    const ver = await webR.evalR(`R.version.string`);
    const verStr = await ver.toString();
    document.getElementById('footerVer').textContent = verStr;
    document.getElementById('statusDot').className = 'status-dot ready';
    document.getElementById('statusText').textContent = 'R prêt';
    document.getElementById('runBtn').disabled = false;
    printLine(`✓ ${verStr}`, 'success');
    printLine('✓ Prêt. Écrivez votre code et cliquez sur ▶ Exécuter.', 'success');
    printLine('', 'info');
    isReady = true;
  } catch(e) {
    document.getElementById('statusDot').className = 'status-dot error';
    document.getElementById('statusText').textContent = 'Erreur';
    printLine(`✗ Erreur: ${e.message}`, 'stderr');
  }
}

// ── EXÉCUTION ────────────────────────────────────────────────────────────
window.runCode = async function() {
  if (!isReady) return;
  const code = document.getElementById('editor').value.trim();
  if (!code) return;

  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="icon">⏳</span> Exécution…';

  const t0 = performance.now();
  printLine(`\n> ${code.split('\n').join('\n> ')}`, 'prompt');

  try {
    // Écouter les messages WebR (stdout, stderr, graphiques)
    const shelter = await new webR.Shelter();
    try {
      await webR.evalRVoid(`webr::canvas(width=600, height=400)`);
    } catch(e){}

    const result = await shelter.captureR(code, {
      withAutoprint: true,
      captureStreams: true,
      captureGraphics: { width: 600, height: 400 },
    });

    // Sorties texte
    for (const msg of result.output) {
      if (msg.type === 'stdout') printLine(msg.data, 'stdout');
      else if (msg.type === 'stderr') printLine(msg.data, 'warning');
      else if (msg.type === 'message') printLine(msg.data, 'warning');
    }

    // Graphiques
    for (const img of result.images) {
      addPlot(img);
    }

    const elapsed = ((performance.now() - t0) / 1000).toFixed(3);
    document.getElementById('footerTime').textContent = `${elapsed}s`;
    await shelter.purge();
    await updateEnv();

  } catch(e) {
    printLine(e.message || String(e), 'stderr');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span class="icon">▶</span> Exécuter';
  }
};

// ── ENV ──────────────────────────────────────────────────────────────────
async function updateEnv() {
  try {
    const res = await webR.evalR(`
      nms <- ls(envir=.GlobalEnv)
      if (length(nms) == 0) {
        list()
      } else {
        lapply(setNames(nms, nms), function(n) {
          x <- get(n, envir=.GlobalEnv)
          list(type=class(x)[1], val=paste(capture.output(str(x, max.level=0)), collapse=" "))
        })
      }
    `);
    const obj = await res.toJs();
    const el = document.getElementById('env-list');
    if (!obj || !obj.values || obj.values.length === 0) {
      el.innerHTML = '<div class="env-item"><span class="env-type">vide</span></div>';
      return;
    }
    let html = '';
    const names = obj.names || [];
    for (let i = 0; i < names.length; i++) {
      const name = names[i];
      const entry = obj.values[i];
      let type = '', val = '';
      if (entry && entry.values) {
        const typeIdx = (entry.names || []).indexOf('type');
        const valIdx  = (entry.names || []).indexOf('val');
        if (typeIdx >= 0) type = entry.values[typeIdx]?.values?.[0] || '';
        if (valIdx  >= 0) val  = entry.values[valIdx ]?.values?.[0] || '';
      }
      html += `<div class="env-item">
        <div class="env-name">${escHtml(name)}</div>
        <div class="env-type">${escHtml(type)}</div>
        <div class="env-val">${escHtml(val)}</div>
      </div>`;
    }
    el.innerHTML = html;
  } catch(e) { /* silencieux */ }
}

// ── GRAPHIQUES ────────────────────────────────────────────────────────────
function addPlot(img) {
  const container = document.getElementById('plot-container');
  document.getElementById('plotEmpty')?.remove();
  plotCount++;
  const wrap = document.createElement('div');
  wrap.className = 'plot-img-wrap fade-in';
  const canvas = document.createElement('canvas');
  canvas.width  = img.width;
  canvas.height = img.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const dataUrl = canvas.toDataURL('image/png');
  const imgEl = document.createElement('img');
  imgEl.src = dataUrl;
  imgEl.title = `Graphique ${plotCount}`;
  imgEl.style.cursor = 'pointer';
  imgEl.onclick = () => {
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = `plot_${plotCount}.png`;
    a.click();
  };
  const num = document.createElement('div');
  num.className = 'plot-num';
  num.textContent = `#${plotCount}`;
  wrap.appendChild(imgEl);
  wrap.appendChild(num);
  container.appendChild(wrap);
  container.scrollTop = container.scrollHeight;
}

window.clearPlots = function() {
  plotCount = 0;
  document.getElementById('plot-container').innerHTML =
    `<div class="plot-empty" id="plotEmpty"><div class="big">📊</div><div>Les graphiques<br>apparaîtront ici</div></div>`;
};

// ── CONSOLE ───────────────────────────────────────────────────────────────
function printLine(text, cls = 'stdout') {
  const el = document.getElementById('output');
  const line = document.createElement('span');
  line.className = `out-line ${cls}`;
  line.textContent = text;
  el.appendChild(line);
  el.appendChild(document.createElement('br'));
  el.scrollTop = el.scrollHeight;
}
window.clearConsole = function() {
  document.getElementById('output').innerHTML = '';
};

// ── ÉDITEUR ───────────────────────────────────────────────────────────────
window.clearEditor = function() {
  document.getElementById('editor').value = '';
  updateLineNums();
};

window.updateLineNums = function() {
  const lines = document.getElementById('editor').value.split('\n').length;
  document.getElementById('lineNums').textContent =
    Array.from({length: lines}, (_, i) => i + 1).join('\n');
};

window.syncScroll = function() {
  document.getElementById('lineNums').scrollTop =
    document.getElementById('editor').scrollTop;
};

window.handleKey = function(e) {
  if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); window.runCode(); }
  if (e.key === 'Tab') {
    e.preventDefault();
    const ta = e.target;
    const s = ta.selectionStart;
    ta.value = ta.value.substring(0, s) + '  ' + ta.value.substring(ta.selectionEnd);
    ta.selectionStart = ta.selectionEnd = s + 2;
    updateLineNums();
  }
};

// ── SNIPPETS ─────────────────────────────────────────────────────────────
const SNIPPETS = {

  // ── TP ÉTALONNAGE UE2 ─────────────────────────────────────────────────────

# Comparaison de la réponse entre 3 formulations galéniques
# ─────────────────────────────────────────────────────────
set.seed(42)

# Données : temps de dissolution (min) pour 3 formulations
dissolution <- data.frame(
  temps       = c(rnorm(15, 12, 2), rnorm(15, 15, 2.5), rnorm(15, 10, 1.8)),
  formulation = factor(rep(c("F1","F2","F3"), each=15))
)

cat("Statistiques par formulation :\\n")
print(tapply(dissolution$temps, dissolution$formulation, function(x)
  round(c(n=length(x), moy=mean(x), sd=sd(x)), 2)))

# Boxplot
boxplot(temps ~ formulation, data=dissolution,
  col=c("#4fc3f7","#81c784","#ffb74d"),
  main="Temps de dissolution par formulation",
  xlab="Formulation", ylab="Temps (min)", bty="n")

# Vérification des hypothèses
cat("\\n--- Test de normalité (Shapiro-Wilk par groupe) ---\\n")
by(dissolution$temps, dissolution$formulation, function(x) {
  res <- shapiro.test(x)
  cat("  p =", round(res$p.value,4), ifelse(res$p.value>0.05,"✓ normal","✗ non normal"),"\\n")
})

cat("\\n--- Test de Bartlett (homogénéité des variances) ---\\n")

    ifelse(bart$p.value>0.05,"✓ variances homogènes","✗ variances hétérogènes"),"\\n")

# ANOVA

# Prédiction du DFG (clairance rénale) selon CKD-EPI simplifié
# ─────────────────────────────────────────────────────────────
set.seed(10)
n <- 60

patients <- data.frame(
  age    = round(runif(n, 25, 80)),
  poids  = round(rnorm(n, 72, 12)),
  creat  = round(rnorm(n, 85, 20)),
  sexe   = factor(sample(c("H","F"), n, replace=TRUE))
)
# Variable réponse : DFG simulé
patients$DFG <- with(patients,
  120 - 0.8*age + 0.3*poids - 0.5*creat +
  ifelse(sexe=="F", -8, 0) + rnorm(n, 0, 8))
patients$DFG <- round(pmax(patients$DFG, 10))

cat("Structure des données :\\n"); str(patients)

# Modèle complet
modele_complet <- lm(DFG ~ age + poids + creat + sexe, data=patients)
cat("\\n--- Modèle complet ---\\n")
print(summary(modele_complet))

# Sélection automatique par AIC (step)
cat("\\n--- Sélection stepwise (AIC) ---\\n")
modele_step <- step(modele_complet, direction="both", trace=0)
cat("Variables retenues :", names(coef(modele_step))[-1], "\\n")
cat("AIC final :", round(AIC(modele_step),2), "\\n")

# Intervalles de confiance
cat("\\n--- Intervalles de confiance 95% ---\\n")

# Diagnostiques graphiques
par(mfrow=c(2,2))
plot(modele_step, which=c(1,2,3,5))
par(mfrow=c(1,1))`,

# C(t) = (Dose/Vd) * exp(-ke * t)

Vd   <- 30    # L
ke   <- 0.15  # h⁻¹
t    <- seq(0, 24, by=0.1)

t_half <- log(2) / ke

window.loadSnippet = function(key) {
  document.getElementById('editor').value = SNIPPETS[key] || '';
  updateLineNums();
  document.getElementById('editor').focus();
};

// ── RESIZE ────────────────────────────────────────────────────────────────
const resizer  = document.getElementById('resizer');
const edWrap   = document.getElementById('editorWrap');
let dragging = false, startY = 0, startH = 0;

resizer.addEventListener('mousedown', e => {
  dragging = true; startY = e.clientY;
  startH = edWrap.offsetHeight;
  resizer.classList.add('dragging');
  document.body.style.userSelect = 'none';
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const delta = e.clientY - startY;
  const newH = Math.max(80, Math.min(startH + delta, window.innerHeight * 0.75));
  edWrap.style.height = newH + 'px';
  document.getElementById('editor').style.height = (newH - 80) + 'px';
});
document.addEventListener('mouseup', () => {
  dragging = false;
  resizer.classList.remove('dragging');
  document.body.style.userSelect = '';
});

// ── UTILS ─────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── DÉMARRAGE ─────────────────────────────────────────────────────────────
updateLineNums();
loadSnippet('etalo_donnees');
init();
</script>
