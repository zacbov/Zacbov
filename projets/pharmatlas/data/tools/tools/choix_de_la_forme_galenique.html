<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choix de la forme galénique</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --teal:#3ab09e;--teal-d:#2a8a7a;--teal-l:rgba(58,176,158,.12);
  --bg:#f4f5f2;--white:#fff;--text:#1a1a18;--muted:#888;--border:#e0e0dc;
  --red:#e53935;--orange:#f57c00;--green:#2e7d32;--blue:#1565c0;--purple:#6a1b9a;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

/* ── Header ── */
header{background:var(--white);border-bottom:2px solid var(--teal);padding:14px 24px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--teal)}
.logo-sub{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.5px}
.restart-btn{margin-left:auto;background:var(--teal-l);color:var(--teal);border:1px solid rgba(58,176,158,.3);border-radius:8px;padding:7px 16px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
.restart-btn:hover{background:rgba(58,176,158,.22)}

/* ── Progress ── */
.progress-bar{height:3px;background:var(--border);flex-shrink:0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),#27ae60);transition:width .4s cubic-bezier(.4,0,.2,1)}

/* ── Main layout ── */
main{flex:1;display:flex;gap:0;overflow:hidden}

/* ── Breadcrumb / chemin gauche ── */
.path-panel{width:220px;background:var(--white);border-right:1px solid var(--border);padding:16px 12px;overflow-y:auto;flex-shrink:0}
.path-title{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}
.path-step{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;opacity:.45;transition:opacity .2s}
.path-step.done{opacity:1}
.path-step.done .step-dot{background:var(--teal)}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0;margin-top:4px}
.step-text{font-size:11px;line-height:1.4;color:var(--text)}
.step-answer{font-size:10px;color:var(--teal);font-weight:600;margin-top:1px}

/* ── Question zone ── */
.question-zone{flex:1;padding:32px 40px;overflow-y:auto;display:flex;flex-direction:column;gap:20px}

.q-context{font-size:11px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:1.5px;display:flex;align-items:center;gap:8px}
.q-context::before{content:'';width:18px;height:2px;background:var(--teal)}

.q-text{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;line-height:1.2;color:var(--text);max-width:560px}

.q-hint{font-size:12px;color:var(--muted);line-height:1.6;max-width:500px;background:var(--bg);border-radius:8px;padding:10px 14px;border-left:3px solid var(--border)}

/* Options grid */
.options-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;max-width:700px}

.option-btn{background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:16px 18px;cursor:pointer;text-align:left;transition:all .18s;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.option-btn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:0;background:var(--teal);transition:width .2s;border-radius:12px 0 0 12px}
.option-btn:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:0 6px 20px rgba(58,176,158,.15)}
.option-btn:hover::before{width:4px}
.option-btn.selected{border-color:var(--teal);background:var(--teal-l)}
.option-btn.selected::before{width:4px;background:var(--teal)}
.opt-icon{font-size:22px;line-height:1}
.opt-label{font-size:13px;font-weight:700;color:var(--text)}
.opt-desc{font-size:10.5px;color:var(--muted);line-height:1.4}

/* ── Résultat ── */
.result-zone{flex:1;padding:32px 40px;overflow-y:auto}
.result-header{margin-bottom:24px}
.result-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.5px;margin-bottom:12px}
.result-title{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:1.5px;color:var(--text);margin-bottom:6px}
.result-subtitle{font-size:13px;color:var(--muted);line-height:1.6;max-width:560px}

.forms-list{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.form-card{background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:16px 20px;display:flex;align-items:flex-start;gap:14px;transition:border-color .2s}
.form-card.primary{border-color:var(--teal);background:linear-gradient(135deg,rgba(58,176,158,.06) 0%,var(--white) 100%)}
.form-card.secondary{opacity:.85}
.form-card.avoid{border-color:var(--red);background:rgba(229,57,53,.04)}
.form-rank{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;margin-top:2px}
.rank-1{background:var(--teal);color:#fff}
.rank-2{background:#e0f2ef;color:var(--teal-d)}
.rank-3{background:var(--bg);color:var(--muted)}
.rank-avoid{background:rgba(229,57,53,.1);color:var(--red)}
.form-body{flex:1}
.form-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px}
.form-voie{font-size:10px;font-weight:600;color:var(--teal);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.form-why{font-size:12px;color:var(--muted);line-height:1.5}
.form-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.form-tag{font-size:9.5px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.form-tag.warn{background:rgba(245,124,0,.1);color:var(--orange);border-color:rgba(245,124,0,.3)}
.form-tag.ok{background:rgba(46,125,50,.1);color:var(--green);border-color:rgba(46,125,50,.3)}
.form-tag.info{background:rgba(21,101,192,.1);color:var(--blue);border-color:rgba(21,101,192,.3)}

/* Alertes cliniques */
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.alert{border-radius:8px;padding:10px 14px;font-size:12px;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.alert.danger{background:#fff5f5;border:1px solid rgba(229,57,53,.3);color:#b71c1c}
.alert.warning{background:#fffbf0;border:1px solid rgba(245,124,0,.3);color:#bf360c}
.alert.info{background:#f0f8ff;border:1px solid rgba(21,101,192,.25);color:#0d47a1}
.alert-icon{font-size:14px;flex-shrink:0;margin-top:1px}

/* Nouvelle question */
.new-q-btn{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:12px 24px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:background .2s;display:inline-flex;align-items:center;gap:8px}
.new-q-btn:hover{background:var(--teal-d)}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.q-anim{animation:fadeUp .3s ease forwards}
.option-btn{animation:fadeUp .25s ease forwards}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:rgba(58,176,158,.3);border-radius:4px}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">💊 PharmAtlas — Galénique</div>
    <div class="logo-sub">Aide au choix de la forme galénique</div>
  </div>
  <button class="restart-btn" onclick="restart()">↺ Recommencer</button>
</header>
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

<main id="mainArea">
  <div class="path-panel" id="pathPanel">
    <div class="path-title">Chemin de décision</div>
    <div id="pathSteps"></div>
  </div>
  <div class="question-zone" id="questionZone"></div>
</main>

<script>

//  ARBRE DE DÉCISION — DONNÉES

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let history = []; // [{qId, question, optionLabel, next}]
let current = 'q1';
let _currentOptions = []; // référence aux options du nœud courant

// ═══════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════
function render(){
  const node = TREE[current];
  if(!node) return;

  // Progress
  const maxDepth = 5;
  const pct = Math.min(100, Math.round((history.length / maxDepth) * 100));
  document.getElementById('progressFill').style.width = pct + '%';

  // Path panel
  renderPath();

  const main = document.getElementById('mainArea');

  if(node.type === 'result'){
    main.innerHTML = '<div class="path-panel" id="pathPanel"><div class="path-title">Chemin de décision</div><div id="pathSteps"></div></div>'
                   + '<div class="result-zone q-anim" id="resultZone"></div>';
    renderPath();
    renderResult(node);
  } else {
    main.innerHTML = '<div class="path-panel" id="pathPanel"><div class="path-title">Chemin de décision</div><div id="pathSteps"></div></div>'
                   + '<div class="question-zone q-anim" id="questionZone"></div>';
    renderPath();
    renderQuestion(node);
  }
}

function renderPath(){
  const panel = document.getElementById('pathSteps');
  if(!panel) return;
  panel.innerHTML = history.map(h => `
    <div class="path-step done">
      <div class="step-dot"></div>
      <div>
        <div class="step-text">${esc(h.question)}</div>
        <div class="step-answer">→ ${esc(h.optionLabel)}</div>
      </div>
    </div>
  `).join('') + (history.length ? '' : '<div style="font-size:11px;color:var(--muted);font-style:italic">Répondez aux questions<br>pour voir votre parcours.</div>');
}

function renderQuestion(node){
  const zone = document.getElementById('questionZone');
  if(!zone) return;
  _currentOptions = node.options || [];
  zone.innerHTML = `
    <div class="q-context">${esc(node.context||'')}</div>
    <div class="q-text">${esc(node.question)}</div>
    ${node.hint ? `<div class="q-hint">💡 ${esc(node.hint)}</div>` : ''}
    <div class="options-grid">
      ${_currentOptions.map((o,i) => `
        <button class="option-btn" style="animation-delay:${i*0.05}s" onclick="choose(${i})">
          <div class="opt-icon">${o.icon||''}</div>
          <div class="opt-label">${esc(o.label)}</div>
          ${o.desc ? `<div class="opt-desc">${esc(o.desc)}</div>` : ''}
        </button>
      `).join('')}
    </div>
  `;
}

function renderResult(node){
  const zone = document.getElementById('resultZone');
  if(!zone) return;

  const b = node.badge||{};
  const badgeHtml = `<div class="result-badge" style="background:${b.bg||'#f5f5f3'};color:${b.color||'#555'}">
    ${b.icon||'💊'} ${esc(b.label||'')}
  </div>`;

  const formsHtml = (node.forms||[]).map(f => {
    const rankClass = f.rank === 1 ? 'primary' : f.rank === 'avoid' ? 'avoid' : 'secondary';
    const rankEl = f.rank === 1
      ? `<div class="form-rank rank-1">1</div>`
      : f.rank === 'avoid'
        ? `<div class="form-rank rank-avoid">✗</div>`
        : `<div class="form-rank rank-${f.rank}">${f.rank}</div>`;
    const tags = (f.tags||[]).map(t => {
      const cls = t==='CONTRE-INDIQUÉ'||t==='ÉVITER' ? 'warn' : t.includes('100%')||t.includes('Gold')||t.includes('Référence') ? 'ok' : 'info';
      return `<span class="form-tag ${cls}">${esc(t)}</span>`;
    }).join('');
    return `<div class="form-card ${rankClass}">
      ${rankEl}
      <div class="form-body">
        <div class="form-name">${esc(f.name)}</div>
        <div class="form-voie">${esc(f.voie)}</div>
        <div class="form-why">${esc(f.why)}</div>
        ${tags ? `<div class="form-tags">${tags}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  const alertsHtml = (node.alerts||[]).map(a => `
    <div class="alert ${a.type}">
      <span class="alert-icon">${a.type==='danger'?'🚨':a.type==='warning'?'⚠️':'ℹ️'}</span>
      <span>${esc(a.text)}</span>
    </div>
  `).join('');

  zone.innerHTML = `
    <div class="result-header">
      ${badgeHtml}
      <div class="result-title">${esc(node.title||'')}</div>
      <div class="result-subtitle">${esc(node.subtitle||'')}</div>
    </div>
    ${alertsHtml ? `<div class="alerts">${alertsHtml}</div>` : ''}
    <div class="forms-list">${formsHtml}</div>
    <button class="new-q-btn" onclick="restart()">↺ Nouvelle décision</button>
  `;
}

// ═══════════════════════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════════════════════
function choose(idx){
  const o = _currentOptions[idx];
  if(!o) return;
  const node = TREE[current];
  history.push({qId: current, question: node?.question||'', optionLabel: o.label, next: o.next});
  current = o.next;
  render();
}

function restart(){
  history = [];
  current = 'q1';
  render();
}

function esc(s){
  const d = document.createElement('div');
  d.textContent = s||'';
  return d.innerHTML;
}

// ── Init ──
render();
</script>
