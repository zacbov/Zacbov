<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Récit — éditeur d'histoires défilantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="uifonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Archivo:wght@300;400;500;600&display=swap">
<link id="catfonts" rel="stylesheet" href="">
<link id="fsfonts" rel="stylesheet" href="">
<style>
  :root{
    --shell:#14161a; --panel:#1b1e23; --panel-2:#22262c; --line:#2e333b;
    --ink:#e6e4de; --ink-dim:#9aa0a8; --ink-faint:#6b727b;
    --accent:#a8b87f; --accent-dim:#6f7d52; --warn:#d3a05a; --bad:#c46a5b;
    --r:6px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--shell);color:var(--ink);
    font-family:Archivo,system-ui,sans-serif;font-size:13px;
    display:grid;grid-template-rows:auto 1fr;overflow:hidden}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  header{display:flex;align-items:center;gap:12px;padding:0 14px;height:46px;
    background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{font-family:Fraunces,serif;font-size:17px;font-weight:600}
  .brand span{color:var(--accent-dim)}
  .storyname{background:transparent;border:1px solid transparent;border-radius:var(--r);
    padding:5px 8px;width:190px;color:var(--ink-dim)}
  .storyname:hover,.storyname:focus{border-color:var(--line);background:var(--panel-2);color:var(--ink)}
  .spacer{flex:1}
  .btn{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
    padding:6px 11px;color:var(--ink)}
  .btn:hover{border-color:var(--ink-faint)}
  .btn.primary{background:var(--accent-dim);border-color:var(--accent-dim);color:#0f120c;font-weight:500}
  .btn.primary:hover{background:var(--accent)}
  .btn.ghost{background:transparent}
  .btn.on{border-color:var(--accent);color:var(--accent)}
  .grp{display:flex}
  .grp .btn{border-radius:0;margin-left:-1px}
  .grp .btn:first-child{border-radius:var(--r) 0 0 var(--r);margin-left:0}
  .grp .btn:last-child{border-radius:0 var(--r) var(--r) 0}
  .grp .btn:hover,.grp .btn.on{position:relative;z-index:1}

  main{display:grid;grid-template-columns:250px minmax(0,1fr) 384px;min-height:0}
  @media (max-width:1500px){main{grid-template-columns:222px minmax(0,1fr) 352px}}
  .col{min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .col.rail{background:var(--panel);border-right:1px solid var(--line)}
  .col.insp{background:var(--panel);border-left:1px solid var(--line)}
  .colhead{padding:10px 12px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:8px;color:var(--ink-dim)}
  .colhead b{font-weight:500;color:var(--ink);font-size:12px}
  .scroller{overflow-y:auto;flex:1;padding:8px}
  .scroller::-webkit-scrollbar{width:9px}
  .scroller::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}

  .chap{border:1px solid var(--line);border-radius:var(--r);background:var(--panel-2);
    padding:9px 10px;margin-bottom:6px;cursor:grab;position:relative}
  .chap.sel{border-color:var(--accent-dim);box-shadow:inset 2px 0 0 var(--accent)}
  .chap.dragover{border-color:var(--accent);border-style:dashed}
  .chap-t{display:flex;align-items:center;gap:7px}
  .chap-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .kind{font-size:10px;padding:2px 6px;border-radius:3px;color:#0f120c;font-weight:600;flex:none}
  .kind.model{background:#8fa9c4}.kind.video{background:var(--warn)}
  .kind.text{background:var(--accent)}.kind.image{background:#c9a3c4}
  .chap-meta{color:var(--ink-faint);font-size:11px;margin-top:4px}
  .pips{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
  .pip{font-size:9px;line-height:14px;padding:0 4px;border-radius:3px;
    background:var(--shell);color:var(--ink-faint);cursor:help;
    font-variant-numeric:tabular-nums}
  .chap-x{position:absolute;top:6px;right:6px;background:none;border:none;color:var(--ink-faint);
    padding:2px 5px;border-radius:3px;line-height:1;display:none}
  .chap:hover .chap-x{display:block}
  .chap-x:hover{color:var(--bad);background:#00000040}
  .tpl{padding:8px 8px 0;border-top:1px solid var(--line)}
  .addrow{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px}
  .addrow .btn{padding:7px 4px;text-align:center}

  .stage{flex:1;display:flex;flex-direction:column;background:#0a0b0c;min-height:0}
  .stagebar{display:flex;align-items:center;gap:8px;padding:8px 12px;
    border-bottom:1px solid var(--line);background:var(--panel);color:var(--ink-dim)}
  .frame{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:14px;min-height:0}
  iframe{width:100%;height:100%;border:1px solid var(--line);border-radius:8px;background:#000;display:block}
  .frame.phone iframe{width:390px;max-width:100%;flex:none}
  .frame.placing::after{content:'Cliquez sur le modèle dans l\2019 aperçu';
    position:absolute;top:22px;left:50%;transform:translateX(-50%);
    background:var(--accent);color:#0f120c;padding:6px 13px;border-radius:999px;font-size:12px}
  .empty{color:var(--ink-faint);text-align:center;max-width:330px;line-height:1.65}
  .empty b{display:block;color:var(--ink-dim);font-family:Fraunces,serif;font-size:18px;margin-bottom:8px;font-weight:400}
  .live{font-size:11px;display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);transition:.2s}
  .dot.busy{background:var(--warn)}

  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:8px;
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;
    background:var(--panel)}
  .tab{background:var(--shell);border:1px solid var(--line);border-radius:var(--r);
    padding:7px 3px;font-size:11px;color:var(--ink-dim);
    display:flex;align-items:center;justify-content:center;gap:4px}
  .tab:hover{color:var(--ink);border-color:var(--ink-faint)}
  .tab.on{background:var(--panel-2);border-color:var(--accent-dim);color:var(--accent)}
  .tc{background:var(--line);color:var(--ink-dim);border-radius:8px;
    padding:0 5px;font-size:9px;line-height:14px;font-variant-numeric:tabular-nums}
  .tab.on .tc{background:var(--accent-dim);color:#0f120c}
  .field{padding:10px 12px;border-bottom:1px solid var(--line)}
  .field>label{display:block;color:var(--ink-dim);margin-bottom:6px;font-size:11px}
  .in{width:100%;background:var(--shell);border:1px solid var(--line);border-radius:var(--r);padding:7px 8px}
  textarea.in{resize:vertical;min-height:58px;line-height:1.5}
  .in:focus{border-color:var(--accent-dim);outline:none}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .rangerow{display:flex;align-items:center;gap:8px;min-width:0}
  input[type=range]{
    flex:1 1 auto;min-width:0;width:100%;height:18px;
    -webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{
    height:3px;border-radius:3px;
    background:linear-gradient(90deg,var(--accent-dim) 0%,var(--accent-dim) var(--fill,50%),
      var(--line) var(--fill,50%),var(--line) 100%)}
  input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:var(--line)}
  input[type=range]::-moz-range-progress{height:3px;border-radius:3px;background:var(--accent-dim)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:13px;height:13px;margin-top:-5px;
    border-radius:50%;background:var(--ink);border:1px solid var(--shell);
    box-shadow:0 1px 3px #0007;transition:transform .12s ease,background .12s ease}
  input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border-radius:50%;background:var(--ink);
    border:1px solid var(--shell);box-shadow:0 1px 3px #0007}
  input[type=range]:hover::-webkit-slider-thumb{background:var(--accent);transform:scale(1.15)}
  input[type=range]:active::-webkit-slider-thumb{background:var(--accent);transform:scale(1.3)}
  input[type=range]:hover::-moz-range-thumb{background:var(--accent)}
  input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--accent);outline-offset:2px}
  input[type=color]{cursor:pointer}
  select.in{cursor:pointer}
  .num{min-width:58px;text-align:right;color:var(--ink-dim);
    font-variant-numeric:tabular-nums;flex:0 0 auto;font-size:11px;white-space:nowrap}
  /* dans une grille à deux ou trois colonnes, la valeur passe au-dessus
     du curseur plutôt que de le rogner */
  .two .rangerow,.three .rangerow{flex-wrap:wrap}
  .two .rangerow .num,.three .rangerow .num{width:100%;text-align:left;order:-1;min-width:0}
  .two,.three{min-width:0}
  .two>*,.three>*{min-width:0}
  .field,.beat-body,.group{min-width:0}
  input[type=color]{width:100%;height:28px;padding:2px;background:var(--shell);border:1px solid var(--line);border-radius:var(--r)}
  .check{display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:7px}
  .check input{accent-color:var(--accent);width:15px;height:15px}
  .hint{color:var(--ink-faint);font-size:11px;line-height:1.55;margin-top:6px}
  .filebox{border:1px dashed var(--line);border-radius:var(--r);padding:12px;text-align:center;
    color:var(--ink-faint);cursor:pointer;line-height:1.5}
  .filebox:hover{border-color:var(--accent-dim);color:var(--ink-dim)}
  .filebox.has{border-style:solid;color:var(--ink-dim);text-align:left;overflow-wrap:anywhere}

  .beat{border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;background:var(--panel-2);overflow:hidden}
  .beat-h{display:flex;align-items:center;gap:6px;padding:8px 9px;cursor:pointer}
  .beat-h b{flex:1;font-weight:500;font-size:11px;color:var(--ink-dim);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .beat-body{padding:0 9px 9px;display:none;min-width:0}
  .beat.open .beat-body{display:block}
  .beat.open .beat-h{border-bottom:1px solid var(--line);margin-bottom:9px}
  .icobtn{background:none;border:1px solid var(--line);border-radius:4px;color:var(--ink-faint);
    padding:1px 6px;line-height:1.35;font-size:11px}
  .icobtn:hover{color:var(--ink);border-color:var(--ink-faint)}
  .icobtn.del:hover{color:var(--bad)}
  .sub{color:var(--ink-faint);font-size:10px;margin:12px 0 6px;padding-bottom:3px;
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;cursor:pointer}
  .sub .caret{transition:.15s}
  .sub.closed .caret{transform:rotate(-90deg)}
  .group{display:block}
  .group.closed{display:none}
  .mini{display:block;color:var(--ink-faint);font-size:10px;margin-bottom:3px;
    cursor:help;text-decoration:underline dotted transparent;text-underline-offset:2px}
  .mini:hover{color:var(--ink-dim);text-decoration-color:var(--ink-faint)}
  .field>label{cursor:help}

  .chip{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
    padding:7px 9px;margin-bottom:5px}
  .chip[aria-current=true]{border-color:var(--accent-dim);color:var(--accent)}
  .chip .n{font-variant-numeric:tabular-nums;color:var(--ink-faint);font-size:11px}
  .chip .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .sample{margin-top:6px;padding:9px 11px;border:1px solid var(--line);
    border-radius:var(--r);line-height:1.35;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .fontrow{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;
    width:100%;text-align:left;background:transparent;border:1px solid transparent;
    border-bottom-color:var(--line);padding:9px 8px;color:var(--ink)}
  .fontrow:hover{background:var(--panel-2);border-color:var(--line)}
  .fontrow.sel{border-color:var(--accent-dim);background:#a8b87f0f}
  .fontrow .fn{font-size:11px;color:var(--ink-faint)}
  .fontrow.sel .fn{color:var(--accent)}
  .fontrow .fs{line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fontmodal .sheet{display:flex;flex-direction:column}
  .shapes{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;
    max-height:150px;overflow:auto;padding:3px;border:1px solid var(--line);border-radius:var(--r)}
  .shp{background:var(--shell);border:1px solid var(--line);border-radius:4px;
    padding:3px;display:grid;place-items:center;color:var(--ink-dim)}
  .shp:hover{border-color:var(--ink-faint);color:var(--ink)}
  .shp.sel{border-color:var(--accent);color:var(--accent)}
  .pairs{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:340px;overflow:auto}
  .pair{border:1px solid var(--line);border-radius:var(--r);background:var(--panel-2);
    padding:9px 10px;text-align:left;display:block}
  .pair:hover{border-color:var(--ink-faint)}
  .pair .pt{font-size:15px;line-height:1.15;display:block;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
  .pair .pb{font-size:10.5px;line-height:1.35;display:block;margin-top:4px;
    color:var(--ink-dim);max-height:28px;overflow:hidden}
  .pair .ps{font-size:11px;color:var(--ink-faint);display:block;margin-top:3px}

  .strip{position:relative;border:1px solid var(--line);border-radius:var(--r);
    background:var(--shell);padding:16px 0 6px;overflow:hidden}
  .ruler{position:absolute;top:0;left:0;right:0;height:15px;
    border-bottom:1px solid var(--line)}
  .ruler span{position:absolute;top:2px;font-size:9px;color:var(--ink-faint);
    transform:translateX(-50%);font-variant-numeric:tabular-nums}
  .ruler span:first-child{transform:none}
  .rows{position:relative;padding:4px 0}
  .row{position:relative;height:19px;margin-bottom:3px}
  .bar{position:absolute;top:0;height:19px;min-width:14px;
    background:var(--accent-dim);border-radius:3px;cursor:grab;
    display:flex;align-items:center;overflow:hidden;color:#0f120c}
  .bar.sel{background:var(--accent);box-shadow:0 0 0 1px var(--ink)}
  .bar.spot{background:#8fa9c4;cursor:default;opacity:.75}
  .bar .lab{flex:1;font-size:10px;padding:0 4px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
  .bar .g{width:6px;align-self:stretch;cursor:ew-resize;flex:none;
    background:#0f120c33}
  .playhead{position:absolute;top:15px;bottom:0;width:1px;background:var(--warn);
    pointer-events:none}
  .playhead::before{content:'';position:absolute;top:-4px;left:-3px;
    border:4px solid transparent;border-top-color:var(--warn)}
  .modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:50;padding:20px}
  .modal.on{display:grid}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    width:min(560px,100%);max-height:86vh;overflow:auto}
  .sheet h2{margin:0;padding:16px 18px;border-bottom:1px solid var(--line);
    font-family:Fraunces,serif;font-weight:400;font-size:20px}
  .sheet .body{padding:16px 18px}
  .sheet .foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
  .opt{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:9px;cursor:pointer;
    display:flex;gap:11px;align-items:flex-start}
  .opt:hover{border-color:var(--ink-faint)}
  .opt.sel{border-color:var(--accent-dim);background:#a8b87f0f}
  .opt input{margin-top:3px;accent-color:var(--accent)}
  .opt div b{display:block;margin-bottom:3px;font-weight:500}
  .opt div span{color:var(--ink-faint);line-height:1.55}
  .weight{font-variant-numeric:tabular-nums}
  .weight.ok{color:var(--accent)}.weight.warn{color:var(--warn)}.weight.bad{color:var(--bad)}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
    padding:9px 15px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:70vw}
  .toast.on{opacity:1;transform:translateX(-50%)}
  /* diagnostic d'une vidéo défilée */
  .vdiag{margin-top:8px;padding:8px 10px;border-radius:var(--r);border:1px solid var(--line);
    border-left-width:3px;font-size:11px;line-height:1.55;color:var(--ink-dim)}
  .vdiag b{display:block;font-weight:500;color:var(--ink);margin-bottom:2px}
  .vdiag.ok{border-left-color:var(--accent)}
  .vdiag.warn{border-left-color:var(--warn)}
  .vdiag.bad{border-left-color:var(--bad)}
  /* panneau de conversion : la vidéo doit rester visible pour que le
     navigateur présente chacune de ses images */
  .convbox{position:fixed;right:18px;bottom:18px;z-index:70;width:300px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
    padding:10px;display:flex;flex-direction:column;gap:8px;
    box-shadow:0 12px 40px #0008}
  .convbox[hidden]{display:none}
  .convbox video{width:100%;aspect-ratio:16/9;background:#000;border-radius:4px;object-fit:contain}
  .convbox .cb-body{display:flex;flex-direction:column;gap:5px}
  .convbox .cb-body b{font-weight:500}
  .convbox .cb-stat{color:var(--ink-dim);font-size:11px;font-variant-numeric:tabular-nums}
  .convbox .cb-note{color:var(--ink-faint);font-size:11px}
  .convbox .cb-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
  .convbox .cb-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
</style>
</head>
<body>

<header>
  <div class="brand">Récit<span>.</span></div>
  <input class="storyname" id="storyTitle" value="Herbier d'un jardin" aria-label="Titre du récit">
  <div class="spacer"></div>
  <button class="btn ghost" id="btnTheme">Ambiance</button>
  <div class="grp">
    <button class="btn ghost" id="btnOpen" title="Ouvrir un projet .recit.json">Ouvrir</button>
    <button class="btn ghost" id="btnSave" title="Enregistrer le projet et ses médias">Enregistrer</button>
  </div>
  <button class="btn" id="btnFull" title="Ouvrir la page entière dans un onglet">Prévisualiser</button>
  <button class="btn primary" id="btnExport">Exporter</button>
</header>

<main>
  <div class="col rail">
    <div class="colhead"><b>Chapitres</b><div class="spacer"></div><span id="chapCount">0</span></div>
    <div class="scroller" id="chapList"></div>
    <div class="tpl" id="tplRow"></div>
    <div class="addrow">
      <button class="btn" data-add="model">Modèle 3D</button>
      <button class="btn" data-add="video">Vidéo</button>
      <button class="btn" data-add="image">Image</button>
      <button class="btn" data-add="text">Texte</button>
    </div>
  </div>

  <div class="col stage">
    <div class="stagebar">
      <div class="grp">
        <button class="btn ghost" id="btnEdit" title="Déplacer les textes à la souris, tourner le modèle, voir les zones cliquables">Ajuster</button>
        <button class="btn ghost" id="btnGoto" title="Amène l'aperçu au texte sélectionné">Aller au texte</button>
      </div>
      <div class="grp">
        <button class="btn ghost" id="btnPhone" title="Basculer en largeur de téléphone">Mobile</button>
        <button class="btn ghost" id="btnLight" title="Remplace les médias par un fond neutre pour un aperçu instantané">Léger</button>
        <button class="btn ghost" id="btnReload" title="Reconstruire l'aperçu de zéro">Recharger</button>
      </div>
      <div class="spacer"></div>
      <div class="live"><span class="dot" id="liveDot"></span><span id="stageInfo">en direct</span></div>
    </div>
    <div class="frame" id="frame">
      <div class="empty" id="emptyState">
        <b>Commencez par un chapitre</b>
        Chaque chapitre occupe l'écran entier pendant que la page défile.
        Ajoutez un modèle, une vidéo ou un panneau de texte, puis placez les
        apparitions de texte le long du défilement.
      </div>
    </div>
  </div>

  <div class="col insp">
    <div class="colhead"><b id="inspTitle">Réglages</b></div>
    <div class="scroller" id="inspBody"></div>
  </div>
</main>

<div class="modal" id="expModal">
  <div class="sheet">
    <h2>Exporter la page</h2>
    <div class="body">
      <label class="opt sel"><input type="radio" name="expmode" value="single" checked>

/* n'appelle chez Google que les familles réellement utilisées */
function fontsUsed(){
  const set=new Set([story.theme.display,story.theme.body]);
  story.chapters.forEach(c=>(c.beats||[]).forEach(b=>{ if(b.font) set.add(b.font); }));
  story.chapters.forEach(c=>(c.spots||[]).forEach(s=>{ if(s.font) set.add(s.font); }));
  return [...set].filter(f=>f && SYSTEM_FONTS.indexOf(f)<0 && FONT_INDEX[f]);
}
function fontQuery(list){
  const fams=(list||fontsUsed())
    .filter(f=>!FONTSHARE_SLUG[f])
    .map(f=>FONT_SPEC[f] || (f.replace(/ /g,'+')+':wght@'+(FONT_INDEX[f]||[400]).join(';')));
  return fams.length ? fams.map(x=>'family='+x).join('&')+'&display=swap' : '';
}
/* Fontshare distribue huit des familles du catalogue : Clash Display, Satoshi,
   Switzer, General Sans, Supreme, Zodiak, Sentient et Cabinet Grotesk. */
function fontshareQuery(list){
  const used=(list||fontsUsed()).filter(f=>FONTSHARE_SLUG[f]);
  if(!used.length) return '';
  return 'https://api.fontshare.com/v2/css?'+
    used.map(f=>'f[]='+FONTSHARE_SLUG[f]+'@'+(FONT_INDEX[f]||[400]).join(','))
        .join('&')+'&display=swap';
}
function refreshEditorFonts(){
  const all=Object.keys(FONT_INDEX);
  const href='https://fonts.googleapis.com/css2?'+fontQuery(all);

  const fs=fontshareQuery(all);
  const el2=document.getElementById('fsfonts');
  if(el2.getAttribute('href')!==fs) el2.setAttribute('href',fs);
}

/* ---------------- médias ---------------- */
function assetKindOf(name){
  const e = name.toLowerCase().split('.').pop();
  if(e==='glb'||e==='gltf') return 'gltf';
  if(e==='obj') return 'obj';
  if(e==='splat') return 'splat';
  if(e==='ksplat') return 'ksplat';
  if(e==='spz') return 'spz';
  if(e==='ply') return 'ply';
  if(['mp4','webm','mov','m4v','ogv','avi','mkv'].indexOf(e)>=0) return 'video';
  if(['png','jpg','jpeg','webp','avif','gif','bmp','svg'].indexOf(e)>=0) return 'image';
  if(['mp3','m4a','ogg','oga','wav','aac','flac'].indexOf(e)>=0) return 'audio';
  return 'bin';
}
const KIND_OK = {
  video:['video'], image:['image'],
  model:['gltf','obj','splat','ksplat','ply','spz']
};
function mimeOf(name,fallback){
  const e=name.toLowerCase().split('.').pop();
  const m={mp4:'video/mp4',webm:'video/webm',mov:'video/quicktime',m4v:'video/mp4',
    ogv:'video/ogg',avi:'video/x-msvideo',mkv:'video/x-matroska',
    png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',
    avif:'image/avif',gif:'image/gif',bmp:'image/bmp',svg:'image/svg+xml',
    mp3:'audio/mpeg',m4a:'audio/mp4',ogg:'audio/ogg',oga:'audio/ogg',
    wav:'audio/wav',aac:'audio/aac',flac:'audio/flac',
    glb:'model/gltf-binary',gltf:'model/gltf+json',obj:'text/plain'};
  return m[e] || fallback || 'application/octet-stream';
}
const safeName = n => n.replace(/[^\w.\-]+/g,'_');

function readFile(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=()=>rej(new Error('Lecture impossible : '+file.name));
    r.onload=()=>res(new Uint8Array(r.result));
    r.readAsArrayBuffer(file);
  });
}

async function attachAsset(ch,file){
  try{
    toast('Lecture de '+file.name+'\u2026');
    const bytes = await readFile(file);
    const kind  = assetKindOf(file.name);
    const ok = KIND_OK[ch.type]||[];
    if(ok.indexOf(kind)<0)
      throw new Error('Format non pris en charge ici. Ce chapitre accepte : '+
        (ch.type==='video'?'MP4, MOV, WebM, OGV'
        :ch.type==='image'?'PNG, JPEG, WebP, AVIF, GIF, SVG'
        :'GLB, glTF, OBJ, PLY, splat, ksplat')+'.');
    if(kind==='spz')
      toast('Le format spz n\u2019est pas lu par la bibliothèque de splats : convertissez-le en ply ou ksplat.','bad');
    const key=uid();
    ASSETS.set(key,{ name:safeName(file.name), mime:mimeOf(file.name,file.type), kind, bytes, b64:null });
    if(ch.asset) dropAsset(ch.asset);
    ch.asset=key;
    if(!ch.name || /^(Modèle 3D|Vidéo)$/.test(ch.name))
      ch.name=file.name.replace(/\.[^.]+$/,'').slice(0,32);
    renderAll(true);
    toast(file.name+' — '+fmtBytes(bytes.length));
  }catch(e){ console.error(e); toast(e.message,'bad'); }
}

function totalBytes(){ let t=0; for(const a of ASSETS.values()) t+=a.bytes.length; return t; }
function fmtBytes(b){
  if(b<1024) return b+' o';
  if(b<1048576) return (b/1024).toFixed(0)+' Ko';
  return (b/1048576).toFixed(1)+' Mo';
}
function bytesToB64(bytes){
  let s='', CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(s);
}
function b64ToBytes(b64){
  const s=atob(b64), a=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) a[i]=s.charCodeAt(i);
  return a;
}
function assetDataURL(key){
  const a=ASSETS.get(key); if(!a) return null;
  if(a.b64===null) a.b64=bytesToB64(a.bytes);
  return 'data:'+a.mime+';base64,'+a.b64;
}
/* L'aperçu reçoit des adresses blob: au lieu de data: — quelques dizaines
   d'octets au lieu de centaines de mégaoctets recopiés dans la page à chaque
   retouche. C'était la cause des « message handler took 329 ms » et des
   vidéos qui peinaient à démarrer dans l'aperçu. L'adresse est créée une
   fois par média et libérée quand il quitte le projet. */
function assetURL(key){
  const a=ASSETS.get(key); if(!a) return null;
  if(!a.url) a.url=URL.createObjectURL(new Blob([a.bytes],{type:a.mime}));
  return a.url;
}
/* libérée avec un délai : l'aperçu en cours peut encore lire le fichier
   pendant qu'il se reconstruit */
function revokeLater(url){
  if(url) setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} },60000);
}
function dropAsset(key){
  const a=key&&ASSETS.get(key); if(!a) return;
  ASSETS.delete(key);
  revokeLater(a.url);
}

/* ---------------------------------------------------------------
