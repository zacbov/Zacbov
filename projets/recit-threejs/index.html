<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Récit — éditeur d'histoires défilantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="uifonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Archivo:wght@300;400;500;600&display=swap">
<link id="catfonts" rel="stylesheet" href="">
<link id="fsfonts" rel="stylesheet" href="">
<style>
  :root{
    --shell:#14161a; --panel:#1b1e23; --panel-2:#22262c; --line:#2e333b;
    --ink:#e6e4de; --ink-dim:#9aa0a8; --ink-faint:#6b727b;
    --accent:#a8b87f; --accent-dim:#6f7d52; --warn:#d3a05a; --bad:#c46a5b;
    --r:6px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--shell);color:var(--ink);
    font-family:Archivo,system-ui,sans-serif;font-size:13px;
    display:grid;grid-template-rows:auto 1fr;overflow:hidden}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  header{display:flex;align-items:center;gap:12px;padding:0 14px;height:46px;
    background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{font-family:Fraunces,serif;font-size:17px;font-weight:600}
  .brand span{color:var(--accent-dim)}
  .storyname{background:transparent;border:1px solid transparent;border-radius:var(--r);
    padding:5px 8px;width:190px;color:var(--ink-dim)}
  .storyname:hover,.storyname:focus{border-color:var(--line);background:var(--panel-2);color:var(--ink)}
  .spacer{flex:1}
  .btn{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
    padding:6px 11px;color:var(--ink)}
  .btn:hover{border-color:var(--ink-faint)}
  .btn.primary{background:var(--accent-dim);border-color:var(--accent-dim);color:#0f120c;font-weight:500}
  .btn.primary:hover{background:var(--accent)}
  .btn.ghost{background:transparent}
  .btn.on{border-color:var(--accent);color:var(--accent)}

  main{display:grid;grid-template-columns:232px 1fr 340px;min-height:0}
  .col{min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .col.rail{background:var(--panel);border-right:1px solid var(--line)}
  .col.insp{background:var(--panel);border-left:1px solid var(--line)}
  .colhead{padding:10px 12px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:8px;color:var(--ink-dim)}
  .colhead b{font-weight:500;color:var(--ink);font-size:12px}
  .scroller{overflow-y:auto;flex:1;padding:8px}
  .scroller::-webkit-scrollbar{width:9px}
  .scroller::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}

  .chap{border:1px solid var(--line);border-radius:var(--r);background:var(--panel-2);
    padding:9px 10px;margin-bottom:6px;cursor:grab;position:relative}
  .chap.sel{border-color:var(--accent-dim);box-shadow:inset 2px 0 0 var(--accent)}
  .chap.dragover{border-color:var(--accent);border-style:dashed}
  .chap-t{display:flex;align-items:center;gap:7px}
  .chap-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .kind{font-size:10px;padding:2px 6px;border-radius:3px;color:#0f120c;font-weight:600;flex:none}
  .kind.model{background:#8fa9c4}.kind.video{background:var(--warn)}.kind.text{background:var(--accent)}
  .chap-meta{color:var(--ink-faint);font-size:11px;margin-top:4px}
  .chap-x{position:absolute;top:6px;right:6px;background:none;border:none;color:var(--ink-faint);
    padding:2px 5px;border-radius:3px;line-height:1;display:none}
  .chap:hover .chap-x{display:block}
  .chap-x:hover{color:var(--bad);background:#00000040}
  .addrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:8px;border-top:1px solid var(--line)}
  .addrow .btn{padding:7px 4px;text-align:center}

  .stage{flex:1;display:flex;flex-direction:column;background:#0a0b0c;min-height:0}
  .stagebar{display:flex;align-items:center;gap:8px;padding:8px 12px;
    border-bottom:1px solid var(--line);background:var(--panel);color:var(--ink-dim)}
  .frame{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:14px;min-height:0}
  iframe{width:100%;height:100%;border:1px solid var(--line);border-radius:8px;background:#000;display:block}
  .frame.phone iframe{width:390px;max-width:100%;flex:none}
  .frame.placing::after{content:'Cliquez sur le modèle dans l\2019 aperçu';
    position:absolute;top:22px;left:50%;transform:translateX(-50%);
    background:var(--accent);color:#0f120c;padding:6px 13px;border-radius:999px;font-size:12px}
  .empty{color:var(--ink-faint);text-align:center;max-width:330px;line-height:1.65}
  .empty b{display:block;color:var(--ink-dim);font-family:Fraunces,serif;font-size:18px;margin-bottom:8px;font-weight:400}
  .live{font-size:11px;display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);transition:.2s}
  .dot.busy{background:var(--warn)}

  .field{padding:10px 12px;border-bottom:1px solid var(--line)}
  .field>label{display:block;color:var(--ink-dim);margin-bottom:6px;font-size:11px}
  .in{width:100%;background:var(--shell);border:1px solid var(--line);border-radius:var(--r);padding:7px 8px}
  textarea.in{resize:vertical;min-height:58px;line-height:1.5}
  .in:focus{border-color:var(--accent-dim);outline:none}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .rangerow{display:flex;align-items:center;gap:9px}
  input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
  .num{width:54px;text-align:right;color:var(--ink-dim);font-variant-numeric:tabular-nums;flex:none;font-size:11px}
  input[type=color]{width:100%;height:28px;padding:2px;background:var(--shell);border:1px solid var(--line);border-radius:var(--r)}
  .check{display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:7px}
  .check input{accent-color:var(--accent);width:15px;height:15px}
  .hint{color:var(--ink-faint);font-size:11px;line-height:1.55;margin-top:6px}
  .filebox{border:1px dashed var(--line);border-radius:var(--r);padding:12px;text-align:center;
    color:var(--ink-faint);cursor:pointer;line-height:1.5}
  .filebox:hover{border-color:var(--accent-dim);color:var(--ink-dim)}
  .filebox.has{border-style:solid;color:var(--ink-dim);text-align:left}

  .beat{border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;background:var(--panel-2);overflow:hidden}
  .beat-h{display:flex;align-items:center;gap:6px;padding:8px 9px;cursor:pointer}
  .beat-h b{flex:1;font-weight:500;font-size:11px;color:var(--ink-dim);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .beat-body{padding:0 9px 9px;display:none}
  .beat.open .beat-body{display:block}
  .beat.open .beat-h{border-bottom:1px solid var(--line);margin-bottom:9px}
  .icobtn{background:none;border:1px solid var(--line);border-radius:4px;color:var(--ink-faint);
    padding:1px 6px;line-height:1.35;font-size:11px}
  .icobtn:hover{color:var(--ink);border-color:var(--ink-faint)}
  .icobtn.del:hover{color:var(--bad)}
  .sub{color:var(--ink-faint);font-size:10px;margin:12px 0 6px;padding-bottom:3px;
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;cursor:pointer}
  .sub .caret{transition:.15s}
  .sub.closed .caret{transform:rotate(-90deg)}
  .group{display:block}
  .group.closed{display:none}
  .mini{display:block;color:var(--ink-faint);font-size:10px;margin-bottom:3px}

  .chip{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
    padding:7px 9px;margin-bottom:5px}
  .chip[aria-current=true]{border-color:var(--accent-dim);color:var(--accent)}
  .chip .n{font-variant-numeric:tabular-nums;color:var(--ink-faint);font-size:11px}
  .chip .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .pairs{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:290px;overflow:auto}
  .pair{border:1px solid var(--line);border-radius:var(--r);background:var(--panel-2);
    padding:9px 10px;text-align:left;display:block}
  .pair:hover{border-color:var(--ink-faint)}
  .pair .pt{font-size:15px;line-height:1.15;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pair .ps{font-size:11px;color:var(--ink-faint);display:block;margin-top:3px}

  .strip{position:relative;border:1px solid var(--line);border-radius:var(--r);
    background:var(--shell);padding:16px 0 6px;overflow:hidden}
  .ruler{position:absolute;top:0;left:0;right:0;height:15px;
    border-bottom:1px solid var(--line)}
  .ruler span{position:absolute;top:2px;font-size:9px;color:var(--ink-faint);
    transform:translateX(-50%);font-variant-numeric:tabular-nums}
  .ruler span:first-child{transform:none}
  .rows{position:relative;padding:4px 0}
  .row{position:relative;height:19px;margin-bottom:3px}
  .bar{position:absolute;top:0;height:19px;min-width:14px;
    background:var(--accent-dim);border-radius:3px;cursor:grab;
    display:flex;align-items:center;overflow:hidden;color:#0f120c}
  .bar.sel{background:var(--accent);box-shadow:0 0 0 1px var(--ink)}
  .bar.spot{background:#8fa9c4;cursor:default;opacity:.75}
  .bar .lab{flex:1;font-size:10px;padding:0 4px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
  .bar .g{width:6px;align-self:stretch;cursor:ew-resize;flex:none;
    background:#0f120c33}
  .playhead{position:absolute;top:15px;bottom:0;width:1px;background:var(--warn);
    pointer-events:none}
  .playhead::before{content:'';position:absolute;top:-4px;left:-3px;
    border:4px solid transparent;border-top-color:var(--warn)}
  .modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:50;padding:20px}
  .modal.on{display:grid}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    width:min(560px,100%);max-height:86vh;overflow:auto}
  .sheet h2{margin:0;padding:16px 18px;border-bottom:1px solid var(--line);
    font-family:Fraunces,serif;font-weight:400;font-size:20px}
  .sheet .body{padding:16px 18px}
  .sheet .foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
  .opt{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:9px;cursor:pointer;
    display:flex;gap:11px;align-items:flex-start}
  .opt:hover{border-color:var(--ink-faint)}
  .opt.sel{border-color:var(--accent-dim);background:#a8b87f0f}
  .opt input{margin-top:3px;accent-color:var(--accent)}
  .opt div b{display:block;margin-bottom:3px;font-weight:500}
  .opt div span{color:var(--ink-faint);line-height:1.55}
  .weight{font-variant-numeric:tabular-nums}
  .weight.ok{color:var(--accent)}.weight.warn{color:var(--warn)}.weight.bad{color:var(--bad)}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
    padding:9px 15px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:70vw}
  .toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<header>
  <div class="brand">Récit<span>.</span></div>
  <input class="storyname" id="storyTitle" value="Herbier d'un jardin" aria-label="Titre du récit">
  <div class="spacer"></div>
  <button class="btn ghost" id="btnTheme">Ambiance</button>
  <button class="btn ghost" id="btnOpen">Ouvrir</button>
  <button class="btn ghost" id="btnSave">Enregistrer</button>
  <button class="btn" id="btnFull">Prévisualiser</button>
  <button class="btn primary" id="btnExport">Exporter la page</button>
</header>

<main>
  <div class="col rail">
    <div class="colhead"><b>Chapitres</b><div class="spacer"></div><span id="chapCount">0</span></div>
    <div class="scroller" id="chapList"></div>
    <div class="addrow">
      <button class="btn" data-add="model">Modèle 3D</button>
      <button class="btn" data-add="video">Vidéo</button>
      <button class="btn" data-add="text">Texte</button>
    </div>
  </div>

  <div class="col stage">
    <div class="stagebar">
      <button class="btn ghost" id="btnReload">Recharger</button>
      <button class="btn ghost" id="btnPhone">Vue mobile</button>
      <button class="btn ghost" id="btnLight" title="Remplace les médias par un fond neutre">Aperçu léger</button>
      <button class="btn ghost" id="btnGoto" title="Amène l'aperçu au texte sélectionné">Aller au texte</button>
      <button class="btn ghost" id="btnEdit" title="Déplacer les textes et tourner le modèle directement dans l'aperçu">Ajuster dans l'aperçu</button>
      <div class="spacer"></div>
      <div class="live"><span class="dot" id="liveDot"></span><span id="stageInfo">en direct</span></div>
    </div>
    <div class="frame" id="frame">
      <div class="empty" id="emptyState">
        <b>Commencez par un chapitre</b>
        Chaque chapitre occupe l'écran entier pendant que la page défile.
        Ajoutez un modèle, une vidéo ou un panneau de texte, puis placez les
        apparitions de texte le long du défilement.
      </div>
    </div>
  </div>

  <div class="col insp">
    <div class="colhead"><b id="inspTitle">Réglages</b></div>
    <div class="scroller" id="inspBody"></div>
  </div>
</main>

<div class="modal" id="expModal">
  <div class="sheet">
    <h2>Exporter la page</h2>
    <div class="body">
      <label class="opt sel"><input type="radio" name="expmode" value="single" checked>
        <div><b>Fichier HTML unique</b><span>Médias encodés dans le fichier. Un seul fichier à déposer n'importe où. Le poids augmente d'environ un tiers et la page charge tout avant de démarrer.</span></div></label>
      <label class="opt"><input type="radio" name="expmode" value="folder">
        <div><b>Page + dossier de médias</b><span>index.html accompagné des fichiers d'origine, à placer dans un sous-dossier « assets ». Les vidéos se chargent progressivement.</span></div></label>
      <div class="hint" id="expWeight"></div>
    </div>
    <div class="foot">
      <button class="btn ghost" id="expCancel">Annuler</button>
      <button class="btn primary" id="expGo">Exporter</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

function fontsUsed(){
  const set=new Set([story.theme.display,story.theme.body]);
  story.chapters.forEach(c=>(c.beats||[]).forEach(b=>{ if(b.font) set.add(b.font); }));
  story.chapters.forEach(c=>(c.spots||[]).forEach(s=>{ if(s.font) set.add(s.font); }));
  return [...set].filter(f=>f && SYSTEM_FONTS.indexOf(f)<0 && FONT_INDEX[f]);
}
function fontQuery(list){
  const fams=(list||fontsUsed())
    .filter(f=>!FONTSHARE_SLUG[f])
    .map(f=>FONT_SPEC[f] || (f.replace(/ /g,'+')+':wght@'+(FONT_INDEX[f]||[400]).join(';')));
  return fams.length ? fams.map(x=>'family='+x).join('&')+'&display=swap' : '';
}
/* Fontshare distribue huit des familles du catalogue : Clash Display, Satoshi,
   Switzer, General Sans, Supreme, Zodiak, Sentient et Cabinet Grotesk. */
function fontshareQuery(list){
  const used=(list||fontsUsed()).filter(f=>FONTSHARE_SLUG[f]);
  if(!used.length) return '';
  return 'https://api.fontshare.com/v2/css?'+
    used.map(f=>'f[]='+FONTSHARE_SLUG[f]+'@'+(FONT_INDEX[f]||[400]).join(','))
        .join('&')+'&display=swap';
}
function refreshEditorFonts(){
  const all=Object.keys(FONT_INDEX);

  if(el.getAttribute('href')!==href) el.setAttribute('href',href);
  const fs=fontshareQuery(all);
  const el2=document.getElementById('fsfonts');
  if(el2.getAttribute('href')!==fs) el2.setAttribute('href',fs);
}

/* ---------------- médias ---------------- */
function assetKindOf(name){
  const e = name.toLowerCase().split('.').pop();
  if(e==='glb'||e==='gltf') return 'gltf';
  if(e==='splat') return 'splat';
  if(e==='ksplat') return 'ksplat';
  if(e==='ply') return 'ply';
  if(['mp4','webm','mov','m4v'].indexOf(e)>=0) return 'video';
  if(['mp3','m4a','ogg','wav','aac'].indexOf(e)>=0) return 'audio';
  return 'bin';
}
function mimeOf(name,fallback){
  const e=name.toLowerCase().split('.').pop();
  const m={mp4:'video/mp4',webm:'video/webm',mov:'video/quicktime',m4v:'video/mp4',
    mp3:'audio/mpeg',m4a:'audio/mp4',ogg:'audio/ogg',wav:'audio/wav',aac:'audio/aac',
    glb:'model/gltf-binary',gltf:'model/gltf+json'};
  return m[e] || fallback || 'application/octet-stream';
}
const safeName = n => n.replace(/[^\w.\-]+/g,'_');

function readFile(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=()=>rej(new Error('Lecture impossible : '+file.name));
    r.onload=()=>res(new Uint8Array(r.result));
    r.readAsArrayBuffer(file);
  });
}

async function attachAsset(ch,file){
  try{
    toast('Lecture de '+file.name+'\u2026');
    const bytes = await readFile(file);
    const kind  = assetKindOf(file.name);
    if(ch.type==='video' && kind!=='video')
      throw new Error('Ce chapitre attend une vidéo (WebM ou MP4).');
    if(ch.type==='model' && (kind==='video'||kind==='bin'))
      throw new Error('Formats acceptés : GLB, glTF, splat, ksplat, ply.');
    const key=uid();
    ASSETS.set(key,{ name:safeName(file.name), mime:mimeOf(file.name,file.type), kind, bytes, b64:null });
    if(ch.asset) ASSETS.delete(ch.asset);
    ch.asset=key;
    if(!ch.name || /^(Modèle 3D|Vidéo)$/.test(ch.name))
      ch.name=file.name.replace(/\.[^.]+$/,'').slice(0,32);
    renderAll(true);
    toast(file.name+' — '+fmtBytes(bytes.length));
  }catch(e){ console.error(e); toast(e.message,'bad'); }
}

function totalBytes(){ let t=0; for(const a of ASSETS.values()) t+=a.bytes.length; return t; }
function fmtBytes(b){
  if(b<1024) return b+' o';
  if(b<1048576) return (b/1024).toFixed(0)+' Ko';
  return (b/1048576).toFixed(1)+' Mo';
}
function bytesToB64(bytes){
  let s='', CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(s);
}
function b64ToBytes(b64){
  const s=atob(b64), a=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) a[i]=s.charCodeAt(i);
  return a;
}
function assetDataURL(key){
  const a=ASSETS.get(key); if(!a) return null;
  if(a.b64===null) a.b64=bytesToB64(a.bytes);
  return 'data:'+a.mime+';base64,'+a.b64;
}

  st.setProperty('--dist', b.distance + 'px');
  st.setProperty('--trk', (b.tracking / 100) + 'em');

  if (b.fill === 'gradient') {
    st.backgroundImage = 'linear-gradient(' + b.gradAngle + 'deg,' + b.grad1 + ',' + b.grad2 + ')';
    st.webkitBackgroundClip = 'text';
    st.backgroundClip = 'text';
    st.color = 'transparent';
  } else {
    st.backgroundImage = 'none';
    st.webkitBackgroundClip = 'border-box';
    st.backgroundClip = 'border-box';
    st.color = b.color || '';
  }

  st.webkitTextStrokeWidth = b.strokeW ? (b.strokeW / 100) + 'em' : '0';
  st.webkitTextStrokeColor = b.strokeC;

  const sh = [];
  if (b.shadowBlur || b.shadowX || b.shadowY)
    sh.push(b.shadowX + 'px ' + b.shadowY + 'px ' + b.shadowBlur + 'px ' + b.shadowC);
  if (b.glow > 0) {
    sh.push('0 0 ' + b.glow + 'px ' + b.glowC);
    sh.push('0 0 ' + (b.glow * 2.2) + 'px ' + b.glowC);
  }
  /* néon : quatre halos empilés, comme le mode néon de Motionsmith */
  if (b.neon > 0) {
    const n = b.neon;
    sh.push('0 0 ' + (n * 0.35) + 'px ' + b.neonColor);
    sh.push('0 0 ' + n + 'px ' + b.neonColor);
    sh.push('0 0 ' + (n * 2) + 'px ' + b.neonColor);
    sh.push('0 0 ' + (n * 3.6) + 'px ' + b.neonColor);
  }
  /* décalage RVB : une copie rouge et une cyan de part et d'autre */
  if (b.rgbSplit > 0) {
    sh.push((-b.rgbSplit) + 'px 0 0 rgba(255,0,64,.65)');
    sh.push(b.rgbSplit + 'px 0 0 rgba(0,225,255,.65)');
  }
  st.textShadow = sh.length ? sh.join(',') : 'none';

  if (b.fill === 'glass') {
    /* verre : le texte reste lisible sur une plaque floutée */
    st.background = hexA(b.boxC, b.boxAlpha);
    st.padding = (b.boxPad || .6) + 'em ' + ((b.boxPad || .6) * 1.4) + 'em';
    st.borderRadius = (b.boxRadius || 18) + 'px';
    st.backdropFilter = 'blur(' + (b.boxBlur || 14) + 'px)';
    st.border = '1px solid ' + hexA(b.ink || '#ffffff', .18);
    st.boxShadow = 'none';
  } else if (b.boxOn) {
    st.border = 'none';
    if (b.fill === 'gradient') {
      st.background = 'none';
      st.boxShadow = '0 0 0 ' + b.boxPad + 'em ' + hexA(b.boxC, b.boxAlpha);
      st.padding = '0';
    } else {
      st.background = hexA(b.boxC, b.boxAlpha);
      st.padding = b.boxPad + 'em ' + (b.boxPad * 1.4) + 'em';
      st.boxShadow = 'none';
    }
    st.borderRadius = b.boxRadius + 'px';
    st.backdropFilter = b.boxBlur ? 'blur(' + b.boxBlur + 'px)' : 'none';
  } else {
    st.background = 'none'; st.padding = '0'; st.boxShadow = 'none';
    st.backdropFilter = 'none'; st.borderRadius = '0'; st.border = 'none';
  }

  st.setProperty('--rot', (b.rotate || 0) + 'deg');
  st.setProperty('--skw', (b.skew || 0) + 'deg');
  d.className = 'beat anim-' + b.anim + ' al-' + b.align + (d.dataset.on === '1' ? ' on' : '');
}

function quoteFam(f) { return f ? "'" + f + "', system-ui, sans-serif" : 'var(--f-body)'; }

function hexA(hex, a) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.replace(/(.)/g, '$1$1') : h, 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

function buildUnits(el, b) {
  el.textContent = '';
  const mk = (txt, cls) => {
    const s = document.createElement('span');
    s.className = 'u ' + cls;
    const inner = document.createElement('span');
    inner.className = 'ui';
    inner.textContent = txt;
    s.appendChild(inner);
    return s;
  };
  const parts = [];
  if (b.unit === 'block') parts.push(mk(b.text, 'u-block'));
  else if (b.unit === 'line') b.text.split('\n').forEach(l => parts.push(mk(l || ' ', 'u-line')));
  else if (b.unit === 'word') {
    b.text.split(/(\s+)/).forEach(w => {
      if (!w.trim()) parts.push(document.createTextNode(w));
      else parts.push(mk(w, 'u-word'));
    });
  } else {
    for (const c of b.text) {
      if (c === ' ') parts.push(document.createTextNode(' '));
      else if (c === '\n') parts.push(document.createElement('br'));
      else parts.push(mk(c, 'u-char'));
    }
  }
  const units = [];
  let i = 0;
  parts.forEach(p => {
    el.appendChild(p);
    if (p.nodeType === 1 && p.className && p.className.indexOf('u ') === 0) {
      const d = (b.delay + i * b.stagger) + 'ms';
      p.style.transitionDuration = b.dur + 'ms';
      p.style.transitionTimingFunction = b.ease;
      p.style.transitionDelay = d;
      p.firstChild.style.transitionDuration = b.dur + 'ms';
      p.firstChild.style.transitionTimingFunction = b.ease;
      p.firstChild.style.transitionDelay = d;
      units.push(p);
      i++;
    }
  });
  return units;
}

function buildBeats(el, ch) {
  const wrap = el.querySelector('.beats');
  wrap.textContent = '';
  el._beats = (ch.beats || []).map(b => {
    const d = document.createElement('div');
    d.dataset.on = '0'; d.dataset.id = b.id;
    styleBeat(d, b);
    d._units = buildUnits(d, b);
    wrap.appendChild(d);
    return d;
  });
}

/* ---------- points chauds : pastille, diagonale, trait, texte ---------- */
function buildSpots(el, ch) {
  const svg = el.querySelector('.spots');
  if (!svg) return;
  svg.textContent = '';
  el._spots = (ch.spots || []).map(sp => {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'spot');
    const dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('r', 3.5);
    dot.setAttribute('fill', sp.color);
    const ring = document.createElementNS(NS, 'circle');
    ring.setAttribute('r', 8);
    ring.setAttribute('fill', 'none');
    ring.setAttribute('stroke', sp.color);
    ring.setAttribute('stroke-width', 1);
    ring.setAttribute('opacity', .45);
    const line = document.createElementNS(NS, 'polyline');
    line.setAttribute('fill', 'none');
    line.setAttribute('stroke', sp.color);
    line.setAttribute('stroke-width', 1);
    const txt = document.createElementNS(NS, 'text');
    txt.textContent = sp.label;
    txt.setAttribute('fill', sp.color);
    txt.style.fontFamily = quoteFam(sp.font);
    txt.style.fontSize = 'calc(' + sp.size + 'rem * var(--fs))';
    txt.style.fontWeight = sp.weight;
    txt.style.letterSpacing = (sp.tracking / 100) + 'em';
    txt.style.textTransform = sp.caps === 'none' ? 'none' : sp.caps;
    g.appendChild(ring); g.appendChild(dot); g.appendChild(line); g.appendChild(txt);
    svg.appendChild(g);
    return { g: g, dot: dot, ring: ring, line: line, txt: txt };
  });
}

function drawSpot(node, sp, x, y) {
  const d = sp.side >= 0 ? 1 : -1;
  const dx = 22 * d, dy = -22;               // la diagonale part toujours vers le haut
  const ex = dx + sp.len * d;
  node.dot.setAttribute('cx', x); node.dot.setAttribute('cy', y);
  node.ring.setAttribute('cx', x); node.ring.setAttribute('cy', y);
  node.line.setAttribute('points',
    x + ',' + y + ' ' + (x + dx) + ',' + (y + dy) + ' ' + (x + ex) + ',' + (y + dy));
  node.txt.setAttribute('x', x + ex + 7 * d);
  node.txt.setAttribute('y', y + dy - 6);
  node.txt.setAttribute('text-anchor', d > 0 ? 'start' : 'end');
}

/* ---------- son ---------- */
/* Les navigateurs refusent tout son avant un geste de l'utilisateur.
   On n'essaie donc rien tant que le portillon n'a pas été franchi. */
let audioOn = false;
let music = null;
let speaking = null;

function hasAudio() {
  if (S.music && S.music.src) return true;
  return S.chapters.some(c =>
    (c.type === 'video' && c.src && c.mute === false) ||
    (c.beats || []).some(b => b.voiceSrc));
}

function buildGate() {
  if (!hasAudio()) return;
  const g = document.createElement('button');
  g.className = 'gate';
  g.innerHTML = '<span class="gi"></span><span>Activer le son</span>';
  g.addEventListener('click', () => {
    audioOn = true;
    g.classList.add('off');
    setTimeout(() => g.remove(), 700);
    if (S.music && S.music.src) {
      music = new Audio(S.music.src);
      music.loop = true;
      music.volume = 0;
      music.play().then(() => fadeTo(music, S.music.volume, S.music.fade)).catch(() => {});
    }
    layers.forEach(el => {
      const ch = el._ch;
      if (el._media && el._media.tagName === 'VIDEO' && ch.mute === false) {
        el._media.muted = false;
        el._media.volume = el.dataset.on === '1' ? (ch.volume == null ? .9 : ch.volume) : 0;
      }
    });
    request();
  });
  document.body.appendChild(g);
  return g;
}

function fadeTo(el, target, secs) {
  if (!el) return;
  const from = el.volume, t0 = performance.now(), d = Math.max(0.05, secs || 1) * 1000;
  (function step(now) {
    const k = Math.min(1, (now - t0) / d);
    try { el.volume = Math.max(0, Math.min(1, from + (target - from) * k)); } catch (e) {}
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

/* La narration baisse la musique pendant qu'elle parle, puis la relève.
   Une seule voix à la fois : entrer dans un nouveau texte coupe la précédente
   en fondu court plutôt que de superposer deux paroles. */
function speak(b) {
  if (!audioOn || !b.voiceSrc) return;
  if (speaking && speaking.b === b) return;
  hush(0.25);
  const a = new Audio(b.voiceSrc);
  a.volume = 0;
  speaking = { a: a, b: b };
  a.play().then(() => fadeTo(a, 1, 0.35)).catch(() => {});
  if (music) fadeTo(music, S.music.volume * (S.music.duck == null ? .35 : S.music.duck), 0.6);
  a.addEventListener('ended', () => {
    if (speaking && speaking.a === a) { speaking = null; if (music) fadeTo(music, S.music.volume, 1.2); }
  });
}
function hush(secs) {
  if (!speaking) return;
  const a = speaking.a;
  speaking = null;
  fadeTo(a, 0, secs || 0.4);
  setTimeout(() => { try { a.pause(); } catch (e) {} }, (secs || 0.4) * 1000 + 60);
  if (music) fadeTo(music, S.music.volume, 1.2);
}

/* ---------- construction complète ---------- */
function mount() {
  root.textContent = '';
  spacer.textContent = '';
  layers = S.chapters.map((ch, i) => {
    const el = document.createElement('section');
    el.className = 'layer layer-' + ch.type;
    el.setAttribute('aria-label', ch.name || 'Chapitre ' + (i + 1));
    if (ch.bg) el.style.background = ch.bg;
    let media = null;

    if (ch.type === 'video' && ch.src) {
      media = document.createElement('video');
      media.dataset.src = ch.src;
      media.playsInline = true;
      media.muted = true;
      media.loop = !!ch.loop;
      /* rien n'est téléchargé tant que le chapitre n'approche pas */
      media.preload = 'none';
      media.volume = 0;
      media.tabIndex = -1;
      media.style.objectFit = ch.fit || 'cover';
      el.appendChild(media);
      const v = document.createElement('div');
      v.className = 'veil';
      v.style.opacity = ch.dim || 0;
      el.appendChild(v);
      el._veil = v;
    }
    if (ch.type === 'model' && ch.src) {
      media = document.createElement('canvas');
      media.className = 'gl';
      el.appendChild(media);
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'spots');
      el.appendChild(svg);
    }

    const wrap = document.createElement('div');
    wrap.className = 'beats';
    el.appendChild(wrap);

    const btn = document.createElement('button');
    btn.className = 'nextbtn';
    btn.addEventListener('click', () => {
      const n = document.getElementById('anchor-' + (i + 1));
      if (n) n.scrollIntoView({ behavior: still ? 'auto' : 'smooth' });
    });
    el.appendChild(btn);
    el._btn = btn;
    el._media = media;
    el._ch = ch;
    root.appendChild(el);
    buildBeats(el, ch);
    buildSpots(el, ch);
    return el;
  });

  S.chapters.forEach((ch, i) => {
    const a = document.createElement('div');
    a.id = 'anchor-' + i;
    a.style.height = ch.len + 'dvh';
    spacer.appendChild(a);
  });
  applyChapterSettings();
  buildGate();
  if (semantic) semantic.hidden = true;   /* le texte brut ne sert qu'aux robots et lecteurs d'écran */
}

/* charge la vidéo du chapitre demandé, et seulement celle-là */
function warm(i) {
  const el = layers[i];
  if (!el) return;
  const m = el._media;
  if (m && m.tagName === 'VIDEO' && !m.src && m.dataset.src) {
    m.preload = 'auto';
    m.src = m.dataset.src;
    m.load();
  }
}

function applyChapterSettings() {
  layers.forEach((el, i) => {
    const ch = S.chapters[i];
    el._ch = ch;
    if (ch.bg) el.style.background = ch.bg;
    if (el._veil) el._veil.style.opacity = ch.dim || 0;
    if (el._media && el._media.tagName === 'VIDEO') {
      el._media.style.objectFit = ch.fit || 'cover';
      el._media.loop = !!ch.loop;
      el._media.muted = ch.mute !== false;
    }
    el._btn.textContent = ch.nextLabel || 'Suite';
    el._btn.style.display = ch.nextBtn ? '' : 'none';
    const a = document.getElementById('anchor-' + i);
    if (a) a.style.height = ch.len + 'dvh';
  });
}

function patch(next) {
  S = next;
  window.__STORY__ = next;
  layers.forEach((el, i) => {
    const ch = S.chapters[i];
    if (!ch) return;
    const olds = el._beats;
    const same = olds.length === ch.beats.length &&
      ch.beats.every((b, k) => olds[k].dataset.id === b.id);
    if (!same) buildBeats(el, ch);
    else ch.beats.forEach((b, k) => {
      const d = olds[k];
      styleBeat(d, b);
      const sig = b.text + '|' + b.unit + '|' + b.dur + '|' + b.stagger + '|' + b.ease + '|' + b.delay;
      if (d._sig !== sig) { d._units = buildUnits(d, b); d._sig = sig; }
    });
    if (ch.type === 'model') buildSpots(el, ch);
  });
  applyChapterSettings();
  request();
}

/* ---------- dialogue avec l'éditeur ---------- */
addEventListener('message', e => {
  const m = e.data;
  if (!m || typeof m !== 'object') return;
  if (m.type === 'recit:patch') { try { patch(m.story); } catch (err) { console.error('[Récit]', err); } }
  if (m.type === 'recit:place') { placing = m.chapter; document.body.style.cursor = 'crosshair'; }
  if (m.type === 'recit:edit') { editMode = !!m.on; document.body.classList.toggle('editing', editMode); }
  if (m.type === 'recit:cancelPlace') { placing = null; document.body.style.cursor = ''; }
  if (m.type === 'recit:goto') {
    let acc = 0;
    for (let i = 0; i < S.chapters.length; i++) {
      const len = (S.chapters[i].len / 100) * innerHeight;
      if (S.chapters[i].id === m.chapter) { scrollTo({ top: acc + len * (m.at + 0.03), behavior: 'auto' }); break; }
      acc += len;
    }
  }
});

/* ---------- édition directe : déplacer un texte, tourner un modèle ---------- */
let editMode = false, drag = null;

addEventListener('pointerdown', ev => {
  if (!editMode || placing) return;
  const el = layers.find(l => l.dataset.on === '1');
  if (!el) return;
  const rect = el.getBoundingClientRect();

  /* un texte visible sous le pointeur : on le déplace */
  const beats = el._beats || [];
  for (let k = beats.length - 1; k >= 0; k--) {
    const node = beats[k];
    if (node.dataset.on !== '1') continue;
    const r = node.getBoundingClientRect();
    if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) {
      drag = { kind: 'beat', el: el, rect: rect, id: el._ch.beats[k].id, chapter: el._ch.id };
      ev.preventDefault();
      return;
    }
  }
  /* sinon, sur un chapitre 3D : on fait tourner le modèle */
  if (el._ch.type === 'model') {
    drag = { kind: 'rot', el: el, chapter: el._ch.id,
             x: ev.clientX, y: ev.clientY,
             rx: el._ch.rotX || 0, ry: el._ch.rotY || 0 };
    ev.preventDefault();
  }
}, true);

addEventListener('pointermove', ev => {
  if (!drag) return;
  if (drag.kind === 'beat') {
    const r = drag.rect;
    parent.postMessage({ type: 'recit:moved', chapter: drag.chapter, id: drag.id,
      posX: +(((ev.clientX - r.left) / r.width) * 100).toFixed(1),
      posY: +(((ev.clientY - r.top) / r.height) * 100).toFixed(1) }, '*');
  } else {
    parent.postMessage({ type: 'recit:rotated', chapter: drag.chapter,
      rotY: Math.round(drag.ry + (ev.clientX - drag.x) * 0.45),
      rotX: Math.round(drag.rx + (ev.clientY - drag.y) * 0.45) }, '*');
  }
}, true);

addEventListener('pointerup', () => { drag = null; }, true);

/* clic sur le modèle : on renvoie le point dans le repère du pivot */
addEventListener('click', ev => {
  if (!placing) return;
  const el = layers.find(l => l._ch.id === placing);
  const st = el && gl.get(el);
  if (!st || typeof st === 'string') return;
  const THREE = st.THREE;
  const r = el.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    (ev.clientX - r.left) / r.width * 2 - 1,
    -((ev.clientY - r.top) / r.height * 2 - 1));
  const ray = new THREE.Raycaster();
  ray.setFromCamera(ndc, st.cam);
  const hit = ray.intersectObject(st.pivot, true)[0];
  let point;
  if (hit) {
    point = st.pivot.worldToLocal(hit.point.clone());
  } else {
    // pas de maillage (nuage de splats) : on projette sur le plan qui
    // passe par le centre et fait face à la caméra
    const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0)
      .applyMatrix4(st.pivot.matrixWorld);
    const p = new THREE.Vector3();
    if (!ray.ray.intersectPlane(plane, p)) return;
    point = st.pivot.worldToLocal(p);
  }
  placing = null;
  document.body.style.cursor = '';
  parent.postMessage({
    type: 'recit:placed', chapter: el._ch.id,
    p: [+point.x.toFixed(4), +point.y.toFixed(4), +point.z.toFixed(4)]
  }, '*');
}, true);

/* ---------- 3D ---------- */
async function ensure3D(el) {
  if (gl.has(el)) return gl.get(el);
  /* aperçu léger, média absent : il n'y a pas de canvas à peindre */
  if (!el._media || !el._ch.src) return null;
  const box = el.getBoundingClientRect();
  if (!box.width || !box.height) return null;
  gl.set(el, 'pending');
  const ch = el._ch;
  try {
    const THREE = await import('three');
    const canvas = el._media;
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(box.width, box.height, false);
    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(38, box.width / box.height, 0.05, 500);
    cam.position.set(0, 0.15, ch.camDist || 3.4);
    cam.lookAt(0, 0, 0);
    /* pivot = ce que le défilement anime ; orient = l'orientation figée
       réglée dans l'éditeur, pour redresser un modèle mal exporté */
    const pivot = new THREE.Group();
    const orient = new THREE.Group();
    pivot.add(orient);
    scene.add(pivot);

    if (ch.assetKind === 'gltf') {
      const env = ch.env == null ? 0.9 : ch.env;
      scene.add(new THREE.HemisphereLight(0xffffff, 0x404038, 1.6 * env));
      const key = new THREE.DirectionalLight(0xffffff, 1.5 * env);
      key.position.set(3, 5, 4); scene.add(key);
      const rim = new THREE.DirectionalLight(0xcfe0b8, 0.7 * env);
      rim.position.set(-4, 2, -3); scene.add(rim);
      const mod = await import('three/addons/loaders/GLTFLoader.js');
      const gltf = await new mod.GLTFLoader().loadAsync(ch.src);
      const obj = gltf.scene;
      const bb = new THREE.Box3().setFromObject(obj);
      const size = bb.getSize(new THREE.Vector3());
      const ctr = bb.getCenter(new THREE.Vector3());
      obj.position.sub(ctr);
      obj.scale.setScalar(1.6 / (Math.max(size.x, size.y, size.z) || 1));
      orient.add(obj);
    } else {
      const GS = await import('gaussian-splats-3d');
      const fmt = { splat: GS.SceneFormat.Splat, ksplat: GS.SceneFormat.KSplat, ply: GS.SceneFormat.Ply }[ch.assetKind];
      const viewer = new GS.DropInViewer({
        gpuAcceleratedSort: false, sharedMemoryForWorkers: false,
        renderMode: GS.RenderMode.Always
      });
      await viewer.addSplatScene(ch.src, {
        format: fmt, showLoadingUI: false, progressiveLoad: false,
        splatAlphaRemovalThreshold: ch.splatAlpha == null ? 5 : ch.splatAlpha
      });
      orient.add(viewer);
    }
    const st = { THREE, renderer, scene, cam, pivot, orient, v: new THREE.Vector3() };
    gl.set(el, st);
    return st;
  } catch (e) {
    console.error('[Récit] 3D non chargée', e);
    gl.set(el, 'failed');
    const p = document.createElement('p');
    p.className = 'loadfail';
    p.textContent = 'Le modèle n\'a pas pu être chargé. Détail dans la console.';
    el.appendChild(p);
    return null;
  }
}

function resize3D() {
  for (const [el, st] of gl) {
    if (!st || typeof st === 'string') continue;
    const b = el.getBoundingClientRect();
    if (!b.width || !b.height) continue;
    st.renderer.setSize(b.width, b.height, false);
    st.cam.aspect = b.width / b.height;
    st.cam.updateProjectionMatrix();
  }
}
addEventListener('resize', resize3D);

/* ---------- boucle ---------- */
let ticking = false, clock = 0, last = performance.now();

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now; clock += dt;
  const vh = innerHeight, y = scrollY;
  let acc = 0;

  for (let i = 0; i < layers.length; i++) {
    const el = layers[i], ch = el._ch;
    const start = acc, len = (ch.len / 100) * vh;
    acc += len;
    const p = (y - start) / len;

    if (!(p > -0.35 && p < 1.35)) {
      if (el.dataset.on === '1') {
        el.dataset.on = '0';
        el.style.opacity = '0';
        el.style.visibility = 'hidden';
        if (el._media && el._media.pause) el._media.pause();
        (el._ch.beats || []).forEach(b => { if (speaking && speaking.b === b) hush(0.4); });
      }
      continue;
    }

    const h = (ch.hold == null ? 12 : ch.hold) / 100;
    let a = 1;
    if (h > 0) { if (p < h) a = p / h; else if (p > 1 - h) a = (1 - p) / h; }
    a = Math.min(1, Math.max(0, a));

    if (el.dataset.on !== '1') {
      el.dataset.on = '1';
      el.style.visibility = 'visible';
      if (el._media && el._media.tagName === 'VIDEO') {
        warm(i);
        try { el._media.currentTime = 0; } catch (err) {}
        if (audioOn && ch.mute === false) el._media.muted = false;
        el._media.play().catch(() => {});
      }
      warm(i + 1);            /* le chapitre suivant se prépare, pas les autres */
      if (ch.type === 'model') ensure3D(el);
    }
    el.style.opacity = a.toFixed(3);
    /* le son de la vidéo suit le fondu de l'image */
    if (el._media && el._media.tagName === 'VIDEO' && audioOn && ch.mute === false)
      try { el._media.volume = a * (ch.volume == null ? .9 : ch.volume); } catch (err) {}
    el.style.zIndex = String(10 + i);

    const q = Math.min(1, Math.max(0, p));
    if (a > 0.5 && parent !== window && Math.abs(q - (el._lastQ || -1)) > 0.004) {
      el._lastQ = q;
      parent.postMessage({ type: 'recit:at', chapter: ch.id, at: q }, '*');
    }
    const st = ch.type === 'model' ? gl.get(el) : null;
    const ready = st && typeof st !== 'string';

    if (ready) {
      const spin = still ? 0 : (ch.spin || 0) * clock * 0.0175;
      st.pivot.rotation.y = spin + q * (ch.spinScroll || 0) * 0.0175;
      st.pivot.scale.setScalar(Math.max(0.05, (ch.mScale || 1) * (1 - q * (ch.zoomScroll || 0))));
      st.pivot.position.y = (ch.lift || 0) * 0.01 - q * 0.15;
      /* orientation réglée à la main, en degrés */
      st.orient.rotation.set(
        (ch.rotX || 0) * 0.0175, (ch.rotY || 0) * 0.0175, (ch.rotZ || 0) * 0.0175);
      st.orient.position.y = (ch.mOffY || 0) * 0.01;

      if (ch.camPath && ch.camFrom && ch.camTo) {
        /* trajet interpolé : la caméra traverse la scène pendant le défilement */
        const e = ch.camEase === 'linear' ? q
                : ch.camEase === 'inOut' ? (q < .5 ? 2 * q * q : 1 - Math.pow(-2 * q + 2, 2) / 2)
                : 1 - Math.pow(1 - q, 3);
        st.cam.position.set(
          ch.camFrom[0] + (ch.camTo[0] - ch.camFrom[0]) * e,
          ch.camFrom[1] + (ch.camTo[1] - ch.camFrom[1]) * e,
          ch.camFrom[2] + (ch.camTo[2] - ch.camFrom[2]) * e);
      } else {
        st.cam.position.set(0, 0.15, ch.camDist || 3.4);
      }
      st.cam.lookAt(0, 0, 0);
      st.renderer.render(st.scene, st.cam);

      /* les traits suivent le modèle pendant sa rotation */
      const rect = el.getBoundingClientRect();
      const spots = ch.spots || [];
      for (let k = 0; k < (el._spots || []).length; k++) {
        const sp = spots[k], node = el._spots[k];
        if (!sp) continue;
        st.v.set(sp.p[0], sp.p[1], sp.p[2]).applyMatrix4(st.pivot.matrixWorld).project(st.cam);
        const behind = st.v.z >= 1;
        const on = !behind && q >= sp.at && q <= sp.at + sp.span;
        node.g.setAttribute('class', 'spot' + (on ? ' on' : ''));
        if (on) drawSpot(node, sp,
          (st.v.x * 0.5 + 0.5) * rect.width,
          (-st.v.y * 0.5 + 0.5) * rect.height);
      }
    }

    for (let k = 0; k < el._beats.length; k++) {
      const b = ch.beats[k], node = el._beats[k];
      if (!b) continue;

      /* parallaxe : le bloc dérive à sa propre vitesse pendant le défilement */
      if (b.parallax) node.style.setProperty('--par', (-(q - 0.5) * b.parallax * vh * 0.35) + 'px');
      else node.style.setProperty('--par', '0px');

      const on = b.exit === false ? (q >= b.at) : (q >= b.at && q <= b.at + b.span);
      if (on !== (node.dataset.on === '1')) {
        node.dataset.on = on ? '1' : '0';
        node.classList.toggle('on', on);
        if (on && b.voiceSrc) speak(b);
        else if (!on && speaking && speaking.b === b) hush(0.5);
        const n = node._units.length;
        node._units.forEach((u, k2) => {
          const d = (b.delay + (on ? k2 : n - 1 - k2) * b.stagger) + 'ms';
          u.style.transitionDelay = d;
          u.firstChild.style.transitionDelay = d;
        });
      }
    }

    if (ch.nextBtn) {
      const show = q > 0.3 && q < 0.92;
      el._btn.classList.toggle('on', show);
      el._btn.tabIndex = show ? 0 : -1;
    }
  }
  ticking = false;
}
function request() { if (!ticking) { ticking = true; requestAnimationFrame(frame); } }
addEventListener('scroll', request, { passive: true });
addEventListener('resize', request);

mount();
requestAnimationFrame(() => requestAnimationFrame(() => { last = performance.now(); frame(performance.now()); }));
setInterval(request, 100);
addEventListener('unhandledrejection', e => console.error('[Récit]', e.reason));

const IMPORTMAP = {imports:{

function storyPayload(mode){
  const chapters = story.chapters.map(ch=>{
    const o=JSON.parse(JSON.stringify(ch));
    const a = ch.asset && ASSETS.get(ch.asset);
    o.assetKind = a ? a.kind : null;
    delete o.asset;
    o.src = (!a || mode==='light') ? null
          : mode==='folder' ? 'assets/'+ch.asset+'_'+a.name
          : assetDataURL(ch.asset);
    (o.beats||[]).forEach((b,bi)=>{
      const key = ch.beats[bi] && ch.beats[bi].voice;
      const va = key && ASSETS.get(key);
      b.voiceSrc = (!va||mode==='light') ? null
        : mode==='folder' ? 'assets/'+key+'_'+va.name
        : assetDataURL(key);
      delete b.voice;
    });
    return o;
  });
  const music = Object.assign({},story.theme && {}, story.music||{});
  const ma = music.asset && ASSETS.get(music.asset);
  music.src = (!ma||mode==='light') ? null
    : mode==='folder' ? 'assets/'+music.asset+'_'+ma.name
    : assetDataURL(music.asset);
  delete music.asset;
  return {title:story.title, theme:story.theme, music:music, chapters:chapters};
}

'<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n'+

(q?'<link rel="preconnect" href="https://fonts.googleapis.com">\n'+
   '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+
   '<link href="https://fonts.googleapis.com/css2?'+q+'" rel="stylesheet">\n':'')+
(fs?'<link href="'+fs+'" rel="stylesheet">\n':'')+
'<style>'+pageCSS(story.theme)+'</style>\n</head>\n<body>\n'+
semanticHTML()+
'<div id="stack"></div>\n<div id="spacer"></div>\n'+
S1+' type="importmap">'+JSON.stringify(IMPORTMAP)+S2+'\n'+

/* Le récit en texte brut : lisible par les moteurs de recherche et les
   lecteurs d'écran, affiché tel quel si le script ne démarre pas, masqué
   dès que le moteur prend la main. */
function semanticHTML(){
  let h='<main id="texte">\n<h1>'+esc(story.title)+'</h1>\n';
  story.chapters.forEach((ch,i)=>{
    h+='<section>\n<h2>'+esc(ch.name||('Chapitre '+(i+1)))+'</h2>\n';
    (ch.beats||[]).forEach(b=>{
      const tag = b.kind==='title' ? 'h3' : 'p';
      h+='<'+tag+'>'+esc(b.text)+'</'+tag+'>\n';
    });
    (ch.spots||[]).forEach(sp=>{ h+='<p>'+esc(sp.label)+'</p>\n'; });
    h+='</section>\n';
  });
  return h+'</main>\n';
}

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------------------------------------------------------
   APERÇU
   --------------------------------------------------------------- */
const frame=document.getElementById('frame');
const emptyState=document.getElementById('emptyState');
const stageInfo=document.getElementById('stageInfo');
const liveDot=document.getElementById('liveDot');

function signature(){
  return lightMode+'|'+JSON.stringify(story.theme)+'|'+fontQuery()+fontshareQuery()+'|'+
    story.chapters.map(c=>c.id+':'+c.type+':'+(c.asset||'-')).join(',');
}

function pushPatch(){
  const f=frame.querySelector('iframe');
  if(!f||!f.contentWindow) return;
  clearTimeout(patchTimer);
  liveDot.classList.add('busy');
  patchTimer=setTimeout(()=>{
    try{
      f.contentWindow.postMessage({type:'recit:patch',story:storyPayload(lightMode?'light':'preview')},'*');
      liveDot.classList.remove('busy');
    }catch(e){ console.error(e); }
  },60);
}

function reloadPreview(){
  clearTimeout(reloadTimer);
  reloadTimer=setTimeout(()=>{
    const old=frame.querySelector('iframe');
    if(old) old.remove();
    if(!story.chapters.length){ emptyState.style.display='block'; stageInfo.textContent=''; return; }
    emptyState.style.display='none';
    let html;
    try{ html=buildHTML(lightMode?'light':'preview'); }
    catch(e){ console.error(e); toast('Aperçu impossible : '+e.message,'bad'); return; }
    const f=document.createElement('iframe');
    f.title='Aperçu du récit';
    f.setAttribute('allow','autoplay');
    f.srcdoc=html;
    f.addEventListener('load',()=>{ if(editMode) post({type:'recit:edit',on:true}); });
    frame.appendChild(f);
    lastSig=signature();
    stageInfo.textContent = lightMode ? 'aperçu léger' : 'en direct';
  },200);
}

function syncPreview(force){
  refreshEditorFonts();
  if(!story.chapters.length){ reloadPreview(); return; }
  const sig=signature();
  if(force||sig!==lastSig){ lastSig=sig; reloadPreview(); }
  else pushPatch();
}

function post(msg){
  const f=frame.querySelector('iframe');
  if(f&&f.contentWindow) f.contentWindow.postMessage(msg,'*');
}
function gotoSelection(){
  const ch=story.chapters.find(c=>c.id===selId);
  if(!ch) return;
  const b=ch.beats.find(x=>x.id===selBeatId);
  post({type:'recit:goto',chapter:ch.id,at:b?b.at:0.2});
}

/* retours de l'aperçu : point posé, texte déplacé, modèle tourné */
let inspTimer=null;
function lazyInspector(){
  clearTimeout(inspTimer);
  inspTimer=setTimeout(()=>renderInspector(),400);   /* on ne redessine pas à chaque pixel */
}
addEventListener('message',e=>{
  const m=e.data; if(!m||!m.type) return;
  if(m.type==='recit:placed'){
    const ch=story.chapters.find(c=>c.id===m.chapter); if(!ch) return;
    ch.spots=ch.spots||[]; ch.spots.push(newSpot(m.p));
    spotSel=ch.spots.length-1;
    placingSpot=false; frame.classList.remove('placing');
    renderAll(); toast('Point posé');
  }
  if(m.type==='recit:moved'){
    const ch=story.chapters.find(c=>c.id===m.chapter); if(!ch) return;
    const b=ch.beats.find(x=>x.id===m.id); if(!b) return;
    b.posX=m.posX; b.posY=m.posY; selBeatId=b.id;
    pushPatch(); lazyInspector();
  }
  if(m.type==='recit:at'){
    const ch=story.chapters.find(c=>c.id===selId);
    if(timelineHead&&ch&&ch.id===m.chapter)
      timelineHead.style.left=(Math.max(0,Math.min(1,m.at))*100)+'%';
  }
  if(m.type==='recit:rotated'){
    const ch=story.chapters.find(c=>c.id===m.chapter); if(!ch) return;
    ch.rotX=Math.max(-180,Math.min(180,m.rotX));
    ch.rotY=Math.max(-180,Math.min(180,m.rotY));
    pushPatch(); lazyInspector();
  }
});

/* ---------------------------------------------------------------
   RAIL
   --------------------------------------------------------------- */
const chapList=document.getElementById('chapList');
let dragId=null;

function renderRail(){
  chapList.innerHTML='';
  document.getElementById('chapCount').textContent=story.chapters.length;
  story.chapters.forEach((ch,i)=>{
    const d=document.createElement('div');
    d.className='chap'+(ch.id===selId?' sel':'');
    d.draggable=true;
    const a=ch.asset&&ASSETS.get(ch.asset);
    const label={model:'3D',video:'VIDÉO',text:'TEXTE'}[ch.type];
    const miss=(ch.type!=='text'&&!a)?' · média manquant':'';
    const sp=(ch.spots&&ch.spots.length)?' · '+ch.spots.length+' point'+(ch.spots.length>1?'s':''):'';
    d.innerHTML='<div class="chap-t"><span class="kind '+ch.type+'">'+label+
      '</span><span class="chap-name"></span></div>'+
      '<div class="chap-meta">'+ch.len+' vh · '+ch.beats.length+' texte'+
      (ch.beats.length>1?'s':'')+sp+miss+'</div><button class="chap-x" title="Supprimer">✕</button>';
    d.querySelector('.chap-name').textContent=ch.name||('Chapitre '+(i+1));
    if(miss) d.querySelector('.chap-meta').style.color='var(--warn)';
    d.addEventListener('click',e=>{
      if(e.target.classList.contains('chap-x')) return;
      selId=ch.id; selBeatId=null; spotSel=-1; renderRail(); renderInspector();
    });
    d.querySelector('.chap-x').addEventListener('click',()=>removeChapter(ch.id));
    d.addEventListener('dragstart',()=>{dragId=ch.id;});
    d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('dragover');});
    d.addEventListener('dragleave',()=>d.classList.remove('dragover'));
    d.addEventListener('drop',e=>{
      e.preventDefault(); d.classList.remove('dragover');
      if(!dragId||dragId===ch.id) return;
      const from=story.chapters.findIndex(c=>c.id===dragId);
      const to=story.chapters.findIndex(c=>c.id===ch.id);
      story.chapters.splice(to,0,story.chapters.splice(from,1)[0]);
      renderAll(true);
    });
    chapList.appendChild(d);
  });
}
function removeChapter(id){
  const ch=story.chapters.find(c=>c.id===id);
  if(ch&&ch.asset) ASSETS.delete(ch.asset);
  story.chapters=story.chapters.filter(c=>c.id!==id);
  if(selId===id) selId=story.chapters.length?story.chapters[0].id:null;
  renderAll(true);
}
document.querySelectorAll('[data-add]').forEach(b=>{
  b.addEventListener('click',()=>{
    const ch=newChapter(b.dataset.add);
    story.chapters.push(ch); selId=ch.id; renderAll(true);
  });
});

function buildAsset(parent,ch){
  const wrap=document.createElement('div');
  const a=ch.asset&&ASSETS.get(ch.asset);
  const box=document.createElement('div');
  box.className='filebox'+(a?' has':''); box.tabIndex=0;
  box.textContent=a ? a.name+' — '+fmtBytes(a.bytes.length)
    : (ch.type==='video'?'Choisir une vidéo (WebM ou MP4)':'Choisir un fichier 3D (GLB, glTF, splat, ksplat, ply)');
  const inp=document.createElement('input'); inp.type='file'; inp.hidden=true;
  inp.accept = ch.type==='video' ? 'video/*,.webm,.mp4' : '.glb,.gltf,.splat,.ksplat,.ply';
  const pick=()=>inp.click();
  box.addEventListener('click',pick);
  box.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();} });
  box.addEventListener('dragover',e=>{e.preventDefault();box.style.borderColor='var(--accent)';});
  box.addEventListener('dragleave',()=>{box.style.borderColor='';});
  box.addEventListener('drop',e=>{
    e.preventDefault(); box.style.borderColor='';
    if(e.dataTransfer.files[0]) attachAsset(ch,e.dataTransfer.files[0]);
  });
  inp.addEventListener('change',()=>{ if(inp.files[0]) attachAsset(ch,inp.files[0]); });
  wrap.appendChild(box); wrap.appendChild(inp);
  field(parent, ch.type==='video'?'Fichier vidéo':'Fichier 3D', wrap,
    ch.type==='video' ? 'Le WebM et le MP4 conviennent tous les deux.'
                      : 'Les splats s\u2019affichent sans tri GPU ni mémoire partagée, pour rester compatibles partout.');
}

/* ---- frise : chaque texte est un bandeau déplaçable et redimensionnable ---- */
function buildTimeline(parent,ch){
  const host=document.createElement('div'); host.className='field';
  host.innerHTML='<label>Frise du chapitre</label>';
  const strip=document.createElement('div'); strip.className='strip';

  const ruler=document.createElement('div'); ruler.className='ruler';
  for(let k=0;k<=4;k++){
    const t=document.createElement('span'); t.style.left=(k*25)+'%';
    t.textContent=(k*25)+'%'; ruler.appendChild(t);
  }
  strip.appendChild(ruler);

  const rows=document.createElement('div'); rows.className='rows';
  ch.beats.forEach((b,i)=>{
    const row=document.createElement('div'); row.className='row';
    const bar=document.createElement('div');
    bar.className='bar'+(b.id===selBeatId?' sel':'');
    bar.style.left=(b.at*100)+'%';
    bar.style.width=(Math.min(1-b.at,b.span)*100)+'%';
    bar.title=b.text.slice(0,40);
    const lab=document.createElement('span'); lab.className='lab';
    lab.textContent=(b.text||'(vide)').slice(0,22);
    const gL=document.createElement('i'); gL.className='g l';
    const gR=document.createElement('i'); gR.className='g r';
    bar.appendChild(gL); bar.appendChild(lab); bar.appendChild(gR);

    const startDrag=(mode)=>ev=>{
      ev.preventDefault(); ev.stopPropagation();
      selBeatId=b.id;
      const box=rows.getBoundingClientRect();
      const at0=b.at, sp0=b.span, x0=ev.clientX;
      const move=e=>{
        const d=(e.clientX-x0)/box.width;
        if(mode==='move'){
          b.at=Math.max(0,Math.min(0.98,at0+d));
        }else if(mode==='left'){
          const na=Math.max(0,Math.min(at0+sp0-0.03,at0+d));
          b.span=+(sp0+(at0-na)).toFixed(3); b.at=+na.toFixed(3);
        }else{
          b.span=Math.max(0.03,Math.min(1-b.at,sp0+d));
        }
        bar.style.left=(b.at*100)+'%';
        bar.style.width=(Math.min(1-b.at,b.span)*100)+'%';
        syncPreview();
      };
      const up=()=>{
        removeEventListener('pointermove',move);
        removeEventListener('pointerup',up);
        renderAll();
      };
      addEventListener('pointermove',move);
      addEventListener('pointerup',up);
    };
    bar.addEventListener('pointerdown',startDrag('move'));
    gL.addEventListener('pointerdown',startDrag('left'));
    gR.addEventListener('pointerdown',startDrag('right'));
    bar.addEventListener('dblclick',()=>{
      openBeats.add(b.id); selBeatId=b.id; renderInspector();
    });
    row.appendChild(bar); rows.appendChild(row);
  });

  /* les points chauds partagent la même échelle */
  (ch.spots||[]).forEach(sp=>{
    const row=document.createElement('div'); row.className='row';
    const bar=document.createElement('div'); bar.className='bar spot';
    bar.style.left=(sp.at*100)+'%';
    bar.style.width=(Math.min(1-sp.at,sp.span)*100)+'%';
    const lab=document.createElement('span'); lab.className='lab';
    lab.textContent='◆ '+(sp.label||'').slice(0,18);
    bar.appendChild(lab); row.appendChild(bar); rows.appendChild(row);
  });

  strip.appendChild(rows);
  const head=document.createElement('div'); head.className='playhead'; head.style.left='0%';
  strip.appendChild(head);
  strip._head=head;
  timelineHead=head;

  strip.addEventListener('click',ev=>{
    if(ev.target.closest('.bar')) return;
    const r=rows.getBoundingClientRect();
    const at=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width));
    head.style.left=(at*100)+'%';
    post({type:'recit:goto',chapter:ch.id,at:at-0.03});
  });

  host.appendChild(strip);
  const h=document.createElement('div'); h.className='hint';
  h.textContent='Glissez un bandeau pour déplacer le texte, ses bords pour régler sa durée. Cliquez dans la frise pour y amener l\u2019aperçu.';
  host.appendChild(h);
  parent.appendChild(host);
}
let timelineHead=null;

function fontSelect(obj,key){
  const s=document.createElement('select'); s.className='in';
  Object.keys(FONT_GROUPS).forEach(gname=>{
    const og=document.createElement('optgroup'); og.label=gname;
    FONT_GROUPS[gname].forEach(f=>{
      const op=document.createElement('option');
      op.value=f; op.textContent=f;
      op.style.fontFamily="'"+f+"',sans-serif";
      if(obj[key]===f) op.selected=true;
      og.appendChild(op);
    });
    s.appendChild(og);
  });
  s.style.fontFamily="'"+obj[key]+"',sans-serif";
  s.addEventListener('change',()=>{
    obj[key]=s.value;
    const w=FONT_INDEX[s.value]||[400];
    /* la graisse courante peut ne pas exister dans la nouvelle police */
    const wk = key==='display'?'dispWeight':key==='body'?'bodyWeight':'weight';
    if(obj[wk]!=null && w.indexOf(obj[wk])<0)
      obj[wk]=w.reduce((a,b)=>Math.abs(b-obj[wk])<Math.abs(a-obj[wk])?b:a,w[0]);
    renderAll(true);
  });
  return s;
}

/* ---------------------------------------------------------------
   VOIX — Hume, via le relais Cloudflare
   La clé n'entre jamais dans la page exportée : on fabrique le MP3 ici,
   il devient un média du projet, et la page finale ne fait que le lire.
   --------------------------------------------------------------- */
const WORKER = 'https://routeur-ia-proxy.zacharybov.workers.dev/';
/* Le relais peut exposer la route sous plusieurs formes selon sa configuration.
   On les essaie l'une après l'autre et on retient celle qui répond. */
const VOICE_ROUTES = ['hume/tts','hume','tts/hume','v0/tts','tts','api/hume/tts'];

/* Le relais renvoie 401 « Non autorisé » tant qu'il ne reçoit pas le secret.
   On ne sait pas sous quel en-tête il l'attend : on les envoie tous à la fois,
   plus une copie dans le corps, ce qui couvre les conventions courantes. */
function authHeaders(){
  const k=(story.voice.secret||'').trim();
  if(!k) return {};
  return {
    'X-App-Secret':k,,
    'Authorization':'Bearer '+k, 'X-Api-Key':k, 'x-api-key':k, 'X-Auth-Token':k
  };
}

function humeBody(text){
  const v=story.voice;
  return {
    utterances:[{
      text:text,
      voice:{ id:v.voiceId, provider:'CUSTOM_VOICE' },
      speed:v.speed,
      trailing_silence:v.trailingSilence
    }],
    format:{ type:'mp3' },
    num_generations:1,
    app_secret:(v.secret||'').trim() || undefined,
    provider:'hume'
  };
}

function pickAudio(j){
  if(!j) return null;
  const g = (j.generations&&j.generations[0]) || j;
  return g.audio || g.audio_base64 || g.data || null;
}

async function humeSynth(text){
  const v=story.voice;
  const routes = v.endpoint ? [v.endpoint] : VOICE_ROUTES;
  const errs=[]; let unauth=0;
  if(!(v.secret||'').trim())
    throw new Error('Le relais demande un mot de passe : renseignez-le dans Ambiance, section Voix.');
  for(const r of routes){
    const url = /^https?:/.test(r) ? r : WORKER.replace(/\/$/,'')+'/'+r.replace(/^\//,'');
    try{
      const res=await fetch(url,{
        method:'POST',
        headers:Object.assign({'Content-Type':'application/json','Accept':'application/json'},
                              authHeaders()),
        body:JSON.stringify(humeBody(text))
      });
      const txt=await res.text();
      if(res.status===401||res.status===403){ unauth++; errs.push(r+' → '+res.status); continue; }
      if(!res.ok){ errs.push(r+' → '+res.status+' '+txt.slice(0,90)); continue; }
      let j; try{ j=JSON.parse(txt); }catch(e){ errs.push(r+' → réponse non JSON'); continue; }
      const b64=pickAudio(j);
      if(!b64){ errs.push(r+' → pas d\u2019audio dans la réponse'); continue; }
      story.voice.endpoint=r;          /* on mémorise la route qui marche */
      return b64ToBytes(b64.replace(/^data:[^,]+,/,''));
    }catch(e){ errs.push(r+' → '+e.message); }
  }
  if(unauth===routes.length)
    throw new Error('Le relais refuse le mot de passe (401). Vérifiez-le, ou dites-moi sous quel en-tête votre worker l\u2019attend.');
  throw new Error('Aucune route du relais n\u2019a répondu. '+errs.join(' · '));
}

async function generateVoice(beat){
  const text=(beat.voiceText||beat.text||'').trim();
  if(!text){ toast('Ce texte est vide','bad'); return; }
  try{
    toast('Synthèse de la voix\u2026');
    const bytes=await humeSynth(text);
    const key=uid();
    ASSETS.set(key,{name:'voix_'+key+'.mp3',mime:'audio/mpeg',kind:'audio',bytes:bytes,b64:null});
    if(beat.voice) ASSETS.delete(beat.voice);
    beat.voice=key;
    renderAll(true);
    toast('Voix enregistrée — '+fmtBytes(bytes.length));
  }catch(e){
    console.error(e);
    toast(e.message,'bad');
  }
}

document.getElementById('btnSave').addEventListener('click',()=>{
  try{
    const assets={};
    for(const [k,a] of ASSETS){
      if(a.b64===null) a.b64=bytesToB64(a.bytes);
      assets[k]={name:a.name,mime:a.mime,kind:a.kind,b64:a.b64};

    const clean=JSON.parse(JSON.stringify(story));
    if(clean.voice) delete clean.voice.secret;   /* le mot de passe ne quitte pas la session */
    download(new Blob([JSON.stringify({v:4,story:clean,assets:assets})],{type:'application/json'}),
      slug(story.title)+'.recit.json');
    toast('Projet enregistré');

});

document.getElementById('btnOpen').addEventListener('click',()=>{
  const i=document.createElement('input'); i.type='file'; i.accept='.json';
  i.addEventListener('change',async()=>{
    const f=i.files[0]; if(!f) return;
    try{
      const j=JSON.parse(await f.text());
      if(!j.story) throw new Error('Ce fichier n\u2019est pas un projet Récit.');
      ASSETS.clear();
      const src=j.assets||{};
      Object.keys(src).forEach(k=>{
        const a=src[k];
        ASSETS.set(k,{name:a.name,mime:a.mime,kind:a.kind||assetKindOf(a.name),
          bytes:b64ToBytes(a.b64),b64:a.b64});
      });
      const blank=blankStory();
      story=Object.assign(blank,j.story);
      story.theme=Object.assign(blank.theme,j.story.theme||{});
      story.music=Object.assign({asset:null,volume:.35,duck:.35,fade:1.5},j.story.music||{});
      story.voice=Object.assign({endpoint:'',secret:'',
        voiceId:'5b612d83-696a-4089-88a7-da3e8e8126e7',
        speed:1,trailingSilence:.35},j.story.voice||{});
      story.chapters.forEach(c=>{
        c.beats=(c.beats||[]).map(b=>newBeat(b));
        c.spots=(c.spots||[]).map(s=>Object.assign(newSpot(s.p),s));
      });
      document.getElementById('storyTitle').value=story.title;
      selId=story.chapters.length?story.chapters[0].id:null;
      renderAll(true); toast('Projet ouvert');
    }catch(e){ console.error(e); toast(e.message,'bad'); }
  });
  i.click();
});

const slug=s=>(s||'recit').toLowerCase().replace(/[^\w]+/g,'-').replace(/^-|-$/g,'');
function download(blob,name){
  const u=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}

/* ---------------------------------------------------------------
   PRÉVISUALISATION ET EXPORT
   --------------------------------------------------------------- */
document.getElementById('btnFull').addEventListener('click',()=>{
  if(!story.chapters.length){ toast('Ajoutez au moins un chapitre','bad'); return; }
  try{
    const w=window.open('','_blank');
    if(!w){ toast('Le navigateur a bloqué la fenêtre. Autorisez les pop-ups.','bad'); return; }
    w.document.open(); w.document.write(buildHTML('preview')); w.document.close();
  }catch(e){ console.error(e); toast('Prévisualisation impossible : '+e.message,'bad'); }
});

const expModal=document.getElementById('expModal');
document.getElementById('btnExport').addEventListener('click',()=>{
  if(!story.chapters.length){ toast('Ajoutez au moins un chapitre','bad'); return; }
  const raw=totalBytes(), inflated=Math.round(raw*1.37);
  const cls=inflated>25e6?'bad':inflated>12e6?'warn':'ok';
  document.getElementById('expWeight').innerHTML=
    'Médias : <b class="weight">'+fmtBytes(raw)+'</b> — en fichier unique la page pèserait environ '+
    '<b class="weight '+cls+'">'+fmtBytes(inflated)+'</b>.'+
    (inflated>12e6?' Au-delà d\u2019une douzaine de méga-octets, préférez la page avec dossier.':'');
  expModal.classList.add('on');
});
document.getElementById('expCancel').addEventListener('click',()=>expModal.classList.remove('on'));
expModal.addEventListener('click',e=>{ if(e.target===expModal) expModal.classList.remove('on'); });
document.querySelectorAll('input[name=expmode]').forEach(r=>{
  r.addEventListener('change',()=>{
    document.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.querySelector('input').checked));
  });
});
document.getElementById('expGo').addEventListener('click',()=>{
  const mode=document.querySelector('input[name=expmode]:checked').value;
  expModal.classList.remove('on');
  try{
    if(mode==='single'){
      download(new Blob([buildHTML('single')],{type:'text/html'}),slug(story.title)+'.html');
      toast('Page exportée en un seul fichier');
    }else{
      download(new Blob([buildHTML('folder')],{type:'text/html'}),'index.html');
      let n=0;
      for(const [k,a] of ASSETS){
        n++;
        (function(key,asset,idx){
          setTimeout(()=>download(new Blob([asset.bytes],{type:asset.mime}),key+'_'+asset.name),350*idx);
        })(k,a,n);
      }
      setTimeout(()=>toast('Placez index.html à côté d\u2019un dossier « assets »'),350*(n+1));
    }
  }catch(e){ console.error(e); toast('Export impossible : '+e.message,'bad'); }
});

/* ---------------------------------------------------------------
   DIVERS
   --------------------------------------------------------------- */
document.getElementById('storyTitle').addEventListener('input',e=>{ story.title=e.target.value; });
document.getElementById('btnTheme').addEventListener('click',e=>{
  themeMode=!themeMode; e.target.classList.toggle('on',themeMode);
  if(themeMode) selId=selId; renderInspector();
});
document.getElementById('btnReload').addEventListener('click',()=>reloadPreview());
document.getElementById('btnGoto').addEventListener('click',gotoSelection);
let editMode=false;
document.getElementById('btnEdit').addEventListener('click',e=>{
  editMode=!editMode;
  e.target.classList.toggle('on',editMode);
  post({type:'recit:edit',on:editMode});
  toast(editMode?'Glissez un texte pour le placer, le fond 3D pour tourner le modèle':'Édition directe désactivée');
});
document.getElementById('btnPhone').addEventListener('click',e=>{
  phoneView=!phoneView; frame.classList.toggle('phone',phoneView);
  e.target.textContent=phoneView?'Vue bureau':'Vue mobile';
  e.target.classList.toggle('on',phoneView);
});
document.getElementById('btnLight').addEventListener('click',e=>{
  lightMode=!lightMode; e.target.classList.toggle('on',lightMode); reloadPreview();
});

const toastEl=document.getElementById('toast');
let toastT=null;
function toast(msg,kind){
  toastEl.textContent=msg;
  toastEl.style.borderColor=kind==='bad'?'var(--bad)':'var(--line)';
  toastEl.classList.add('on');
  clearTimeout(toastT);
  toastT=setTimeout(()=>toastEl.classList.remove('on'),3000);
}
function renderAll(force){ renderRail(); renderInspector(); syncPreview(force); }

addEventListener('error',e=>console.error('[Récit]',e.error||e.message));
addEventListener('unhandledrejection',e=>{
  console.error('[Récit]',e.reason);
  toast('Erreur : '+((e.reason&&e.reason.message)||e.reason),'bad');
});
