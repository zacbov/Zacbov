const ENGINE = String.raw`
let S = window.__STORY__;
const SHAPES = S.shapes || {};
const root = document.getElementById('stack');
const semantic = document.getElementById('texte');
const spacer = document.getElementById('spacer');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS = 'http://www.w3.org/2000/svg';
const gl = new Map();
let layers = [];
let placing = null;

/* ---------- style d'un bloc de texte ---------- */
function styleBeat(d, b) {
  const st = d.style;
  st.left = b.posX + '%';
  st.top = b.posY + '%';
  st.maxWidth = b.width + 'ch';
  st.fontFamily = quoteFam(b.font);
  st.fontSize = 'calc(' + b.size + 'rem * var(--fs))';
  st.fontWeight = b.weight;
  st.letterSpacing = (b.tracking / 100) + 'em';
  st.wordSpacing = (b.wordSpace / 100) + 'em';
  st.lineHeight = b.leading;
  st.textAlign = b.align;
  st.textIndent = (b.indent || 0) + 'em';
  st.fontStyle = b.italic ? 'italic' : 'normal';
  st.textTransform = b.caps === 'none' ? 'none' : b.caps;
  st.opacity = b.opacity;
  st.mixBlendMode = b.blend || 'normal';
  st.setProperty('--dist', b.distance + 'px');
  st.setProperty('--trk', (b.tracking / 100) + 'em');

  /* Un effet en boucle peint lui-même le texte : on lui laisse la main sur
     le remplissage, l'ombre et le contour, sinon le style en ligne écraserait
     les règles de la classe et l'effet resterait invisible. */
  const hasLook = b.look && b.look !== 'none';

  if (b.fill === 'gradient' && !hasLook) {
    st.backgroundImage = 'linear-gradient(' + b.gradAngle + 'deg,' + b.grad1 + ',' + b.grad2 + ')';
    st.webkitBackgroundClip = 'text';
    st.backgroundClip = 'text';
    st.color = 'transparent';
  } else if (!hasLook) {
    st.backgroundImage = 'none';
    st.webkitBackgroundClip = 'border-box';
    st.backgroundClip = 'border-box';
    st.color = b.color || '';
  } else {
    /* la couleur sert encore de teinte de base aux effets qui s'en servent */
    st.backgroundImage = '';
    st.webkitBackgroundClip = '';
    st.backgroundClip = '';
    st.color = b.color || '';
  }

  if (!hasLook) {
    st.webkitTextStrokeWidth = b.strokeW ? (b.strokeW / 100) + 'em' : '0';
    st.webkitTextStrokeColor = b.strokeC;
  } else {
    st.webkitTextStrokeWidth = '';
    st.webkitTextStrokeColor = '';
  }

  const sh = [];
  if (b.shadowBlur || b.shadowX || b.shadowY)
    sh.push(b.shadowX + 'px ' + b.shadowY + 'px ' + b.shadowBlur + 'px ' + b.shadowC);
  if (b.glow > 0) {
    sh.push('0 0 ' + b.glow + 'px ' + b.glowC);
    sh.push('0 0 ' + (b.glow * 2.2) + 'px ' + b.glowC);
  }
  /* néon : quatre halos empilés, comme le mode néon de Motionsmith */
  if (b.neon > 0) {
    const n = b.neon;
    sh.push('0 0 ' + (n * 0.35) + 'px ' + b.neonColor);
    sh.push('0 0 ' + n + 'px ' + b.neonColor);
    sh.push('0 0 ' + (n * 2) + 'px ' + b.neonColor);
    sh.push('0 0 ' + (n * 3.6) + 'px ' + b.neonColor);
  }
  /* décalage RVB : une copie rouge et une cyan de part et d'autre */
  if (b.rgbSplit > 0) {
    sh.push((-b.rgbSplit) + 'px 0 0 rgba(255,0,64,.65)');
    sh.push(b.rgbSplit + 'px 0 0 rgba(0,225,255,.65)');
  }
  st.textShadow = hasLook ? '' : (sh.length ? sh.join(',') : 'none');

  if (b.fill === 'glass') {
    /* verre : le texte reste lisible sur une plaque floutée */
    st.background = hexA(b.boxC, b.boxAlpha);
    st.padding = (b.boxPad || .6) + 'em ' + ((b.boxPad || .6) * 1.4) + 'em';
    st.borderRadius = (b.boxRadius || 18) + 'px';
    st.backdropFilter = 'blur(' + (b.boxBlur || 14) + 'px)';
    st.border = '1px solid ' + hexA(b.ink || '#ffffff', .18);
    st.boxShadow = 'none';
  } else if (b.boxOn) {
    st.border = 'none';
    if (b.fill === 'gradient') {
      st.background = 'none';
      st.boxShadow = '0 0 0 ' + b.boxPad + 'em ' + hexA(b.boxC, b.boxAlpha);
      st.padding = '0';
    } else {
      st.background = hexA(b.boxC, b.boxAlpha);
      st.padding = b.boxPad + 'em ' + (b.boxPad * 1.4) + 'em';
      st.boxShadow = 'none';
    }
    st.borderRadius = b.boxRadius + 'px';
    st.backdropFilter = b.boxBlur ? 'blur(' + b.boxBlur + 'px)' : 'none';
  } else {
    st.background = 'none'; st.padding = '0'; st.boxShadow = 'none';
    st.backdropFilter = 'none'; st.borderRadius = '0'; st.border = 'none';
  }

  st.setProperty('--rot', (b.rotate || 0) + 'deg');
  st.setProperty('--skw', (b.skew || 0) + 'deg');
  d.className = 'beat anim-' + b.anim + ' al-' + b.align +
    (b.look && b.look !== 'none' ? ' look-' + b.look : '') +
    (b.arc ? ' arced' : '') + (d.dataset.on === '1' ? ' on' : '');
  st.setProperty('--ls', (2.2 / (b.lookSpeed || 1)).toFixed(2) + 's');
}

function quoteFam(f) { return f ? "'" + f + "', system-ui, sans-serif" : 'var(--f-body)'; }

function hexA(hex, a) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.replace(/(.)/g, '$1$1') : h, 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

/* Texte courbé : on le pose sur un arc de cercle via un textPath SVG.
   Le rayon se déduit de l'angle demandé et de la largeur du bloc. */
function buildArc(el, b) {
  el.textContent = '';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'arcsvg');
  const W = 1000;
  const ang = Math.abs(b.arc) * Math.PI / 180;
  const R = W / (2 * Math.tan(Math.min(ang, 3.0) / 2) || 1) * 0.5 + W / 6;
  const up = b.arc > 0 ? !b.arcFlip : !!b.arcFlip;
  const sweep = up ? 1 : 0;
  const H = R * 2;
  const y = up ? H * 0.9 : H * 0.1;
  const d = 'M' + (W / 2 - W / 2) + ' ' + y +
            ' A' + R + ' ' + R + ' 0 0 ' + sweep + ' ' + (W / 2 + W / 2) + ' ' + y;
  const id = 'arc-' + b.id;
  const path = document.createElementNS(NS, 'path');
  path.setAttribute('id', id);
  path.setAttribute('d', d);
  path.setAttribute('fill', 'none');
  const defs = document.createElementNS(NS, 'defs');
  defs.appendChild(path);
  svg.appendChild(defs);
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + (H * 0.62));
  const txt = document.createElementNS(NS, 'text');
  const tp = document.createElementNS(NS, 'textPath');
  tp.setAttribute('href', '#' + id);
  tp.setAttribute('startOffset', '50%');
  tp.setAttribute('text-anchor', 'middle');
  tp.textContent = b.text;
  txt.appendChild(tp);
  txt.setAttribute('fill', 'currentColor');
  svg.appendChild(txt);
  const holder = document.createElement('span');
  holder.className = 'u u-block';
  holder.appendChild(document.createElement('span'));
  holder.firstChild.className = 'ui';
  holder.firstChild.appendChild(svg);
  el.appendChild(holder);
  holder.style.transitionDuration = b.dur + 'ms';
  holder.style.transitionTimingFunction = b.ease;
  holder.style.transitionDelay = b.delay + 'ms';
  holder.firstChild.style.transitionDuration = b.dur + 'ms';
  holder.firstChild.style.transitionTimingFunction = b.ease;
  holder.firstChild.style.transitionDelay = b.delay + 'ms';
  return [holder];
}

function buildUnits(el, b) {
  if (b.arc) return buildArc(el, b);
  el.textContent = '';
  const mk = (txt, cls) => {
    const s = document.createElement('span');
    s.className = 'u ' + cls;
    const inner = document.createElement('span');
    inner.className = 'ui';
    inner.textContent = txt;
    s.appendChild(inner);
    return s;
  };
  const parts = [];
  if (b.unit === 'block') parts.push(mk(b.text, 'u-block'));
  else if (b.unit === 'line') b.text.split('\n').forEach(l => parts.push(mk(l || ' ', 'u-line')));
  else if (b.unit === 'word') {
    b.text.split(/(\s+)/).forEach(w => {
      if (!w.trim()) parts.push(document.createTextNode(w));
      else parts.push(mk(w, 'u-word'));
    });
  } else {
    for (const c of b.text) {
      if (c === ' ') parts.push(document.createTextNode(' '));
      else if (c === '\n') parts.push(document.createElement('br'));
      else parts.push(mk(c, 'u-char'));
    }
  }
  const units = [];
  let i = 0;
  parts.forEach(p => {
    el.appendChild(p);
    if (p.nodeType === 1 && p.className && p.className.indexOf('u ') === 0) {
      const d = (b.delay + i * b.stagger) + 'ms';
      p.style.transitionDuration = b.dur + 'ms';
      p.style.transitionTimingFunction = b.ease;
      p.style.transitionDelay = d;
      p.firstChild.style.transitionDuration = b.dur + 'ms';
      p.firstChild.style.transitionTimingFunction = b.ease;
      p.firstChild.style.transitionDelay = d;
      units.push(p);
      i++;
    }
  });
  return units;
}

function buildBeats(el, ch) {
  const wrap = el.querySelector('.beats');
  wrap.textContent = '';
  el._beats = (ch.beats || []).map(b => {
    const d = document.createElement('div');
    d.dataset.on = '0'; d.dataset.id = b.id;
    styleBeat(d, b);
    d._units = buildUnits(d, b);
    wrap.appendChild(d);
    return d;
  });
}

function sig(o) { return JSON.stringify(o || null); }

/* ---------- ornements ---------- */
/* Toute la géométrie est calculée en pixels à partir de la taille de la couche.
   Chaque tracé porte pathLength="1" : l'animation devient un simple passage
   de stroke-dashoffset de 1 à 0, indépendant de la longueur réelle. */
function ornGeom(o, W, H) {
  const cx = o.x / 100 * W, cy = o.y / 100 * H;
  const w = o.w / 100 * W, h = o.h / 100 * H;
  const L = cx - w / 2, R = cx + w / 2, T = cy - h / 2, B = cy + h / 2;
  const P = [], F = [], X = [];
  const K = o.kind;
  const shp = (SHAPES || {})[o.shape] || '';

  if (K === 'rule') P.push('M' + L + ' ' + cy + ' L' + R + ' ' + cy);

  if (K === 'doubleRule') {
    P.push('M' + L + ' ' + (cy - o.gap / 2) + ' L' + R + ' ' + (cy - o.gap / 2));
    P.push('M' + L + ' ' + (cy + o.gap / 2) + ' L' + R + ' ' + (cy + o.gap / 2));
  }

  if (K === 'dotRule') {
    P.push('M' + L + ' ' + cy + ' L' + (R - 6) + ' ' + cy);
    F.push({ d: 'M' + R + ' ' + cy + ' m-4 0 a4 4 0 1 0 8 0 a4 4 0 1 0 -8 0', fill: o.color });
  }

  if (K === 'frame' || K === 'mourning') {
    /* un seul tracé continu : le cadre se dessine d'un trait, coin par coin */
    const pts = [[L, T], [R, T], [R, B], [L, B]];
    const st = { tl: 0, tr: 1, br: 2, bl: 3 }[o.corner] || 0;
    let d = '';
    for (let i = 0; i <= 4; i++) {
      const k = (st + (o.sense >= 0 ? i : -i) + 8) % 4;
      d += (i ? ' L' : 'M') + pts[k][0] + ' ' + pts[k][1];
    }
    P.push(d);
  }

  if (K === 'cornerFrame') {
    const c = Math.min(o.inset / 100 * W, w / 2, h / 2);
    P.push('M' + L + ' ' + (T + c) + ' L' + L + ' ' + T + ' L' + (L + c) + ' ' + T);
    P.push('M' + (R - c) + ' ' + T + ' L' + R + ' ' + T + ' L' + R + ' ' + (T + c));
    P.push('M' + R + ' ' + (B - c) + ' L' + R + ' ' + B + ' L' + (R - c) + ' ' + B);
    P.push('M' + (L + c) + ' ' + B + ' L' + L + ' ' + B + ' L' + L + ' ' + (B - c));
  }

  if (K === 'mat') {
    const i2 = o.inset / 100 * Math.min(W, H);
    P.push('M' + L + ' ' + T + ' L' + R + ' ' + T + ' L' + R + ' ' + B + ' L' + L + ' ' + B + ' Z');
    P.push('M' + (L + i2) + ' ' + (T + i2) + ' L' + (R - i2) + ' ' + (T + i2) +
           ' L' + (R - i2) + ' ' + (B - i2) + ' L' + (L + i2) + ' ' + (B - i2) + ' Z');
  }

  if (K === 'cartouche') {
    /* le filet supérieur s'interrompt pour laisser passer un titre */
    const g = Math.max(20, (o.text || '').length * o.size * 9);
    P.push('M' + (cx - g / 2) + ' ' + T + ' L' + L + ' ' + T + ' L' + L + ' ' + B +
           ' L' + R + ' ' + B + ' L' + R + ' ' + T + ' L' + (cx + g / 2) + ' ' + T);
    if (o.text) X.push({ x: cx, y: T + 4, t: o.text, anchor: 'middle' });
  }

  if (K === 'cornerOrn' && shp) {
    const sz = 26 * (o.size || 1);
    [[L, T, 1, 1], [R, T, -1, 1], [R, B, -1, -1], [L, B, 1, -1]].forEach(c => {
      F.push({ d: shp, tx: c[0], ty: c[1], sx: c[2] * sz / 100, sy: c[3] * sz / 100,
               stroke: o.color, fill: 'none' });
    });
    P.push('M' + L + ' ' + T + ' L' + R + ' ' + T + ' L' + R + ' ' + B + ' L' + L + ' ' + B + ' Z');
  }

  if (K === 'stem') {
    /* une tige souple, et des feuilles qui montent le long du tracé */
    const a = w / 2 || 30;
    P.push('M' + cx + ' ' + B + ' C' + (cx + a) + ' ' + (B - h * .3) +
           ' ' + (cx - a) + ' ' + (T + h * .3) + ' ' + cx + ' ' + T);
    const n = Math.max(1, o.count | 0);
    for (let i = 0; i < n; i++) {
      const t = (i + 1) / (n + 1);
      const y = B - h * t;
      const side = i % 2 ? 1 : -1;
      const lw = 14 + 10 * Math.sin(t * Math.PI);
      P.push('M' + cx + ' ' + y +
             ' q' + (side * lw) + ' ' + (-lw * .55) + ' ' + (side * lw * 1.7) + ' ' + (-lw * .1) +
             ' q' + (-side * lw * .8) + ' ' + (lw * .7) + ' ' + (-side * lw * 1.7) + ' ' + (lw * .1));
    }
  }

  if (K === 'tendril') {
    /* spirale logarithmique qui se déroule */
    let d = '', r = Math.min(w, h) / 2;
    for (let i = 0; i <= 90; i++) {
      const t = i / 90, ang = t * Math.PI * 4.2, rad = r * Math.pow(1 - t, 1.4);
      const px = cx + Math.cos(ang) * rad, py = cy + Math.sin(ang) * rad;
      d += (i ? ' L' : 'M') + px.toFixed(1) + ' ' + py.toFixed(1);
    }
    P.push(d);
  }

  if (K === 'branch') {
    const sx = o.corner === 'tr' || o.corner === 'br' ? -1 : 1;
    const sy = o.corner === 'bl' || o.corner === 'br' ? -1 : 1;
    const ox = sx > 0 ? 0 : W, oy = sy > 0 ? 0 : H;
    P.push('M' + ox + ' ' + oy + ' C' + (ox + sx * w * .5) + ' ' + (oy + sy * h * .1) +
           ' ' + (ox + sx * w * .7) + ' ' + (oy + sy * h * .5) + ' ' + (ox + sx * w) + ' ' + (oy + sy * h));
    const n = Math.max(1, o.count | 0);
    for (let i = 1; i <= n; i++) {
      const t = i / (n + 1);
      const px = ox + sx * w * t * 1.05, py = oy + sy * h * t * t;
      const lw = 16 * (1 - t * .5);
      P.push('M' + px + ' ' + py + ' q' + (sx * lw) + ' ' + (-sy * lw) + ' ' + (sx * lw * 1.8) + ' 0');
    }
  }

  if (K === 'shape' && shp) {
    const sz = Math.min(w, h);
    F.push({ d: shp, tx: cx - sz / 2, ty: cy - sz / 2, sx: sz / 100, sy: sz / 100,
             stroke: o.color, fill: 'none' });
  }

  if (K === 'cropMarks') {
    const m = 14;
    [[L, T, 1, 1], [R, T, -1, 1], [R, B, -1, -1], [L, B, 1, -1]].forEach(c => {
      P.push('M' + (c[0] - c[2] * m) + ' ' + c[1] + ' L' + (c[0] + c[2] * m * .35) + ' ' + c[1]);
      P.push('M' + c[0] + ' ' + (c[1] - c[3] * m) + ' L' + c[0] + ' ' + (c[1] + c[3] * m * .35));
    });
  }

  if (K === 'ruler') {
    P.push('M' + cx + ' ' + T + ' L' + cx + ' ' + B);
    const n = Math.max(2, o.count | 0);
    for (let i = 0; i <= n; i++) {
      const y = T + h * i / n;
      const len = i % 5 === 0 ? 11 : 6;
      P.push('M' + cx + ' ' + y + ' L' + (cx + len) + ' ' + y);
    }
  }

  if (K === 'folio' && o.text) X.push({ x: cx, y: cy, t: o.text, anchor: 'middle' });

  if (K === 'dropcap' && o.text) {
    /* la lettrine : une capitale tracée au contour, puis son filet d'appui */
    X.push({ x: cx, y: cy, t: o.text.charAt(0), anchor: 'middle', cap: true });
    if (o.count > 0)
      P.push('M' + (cx - w / 2) + ' ' + (cy + h / 2) + ' L' + (cx + w / 2) + ' ' + (cy + h / 2));
  }

  if (K === 'margin' && o.text)
    X.push({ x: cx, y: cy, t: o.text, anchor: 'middle', rot: o.x > 50 ? 90 : -90 });

  return { P: P, F: F, X: X };
}

function buildOrns(el, ch) {
  let svg = el._owrap;
  if (!svg) {
    svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('class', 'orns');
    el.insertBefore(svg, el.querySelector('.beats'));
    el._owrap = svg;
  }
  svg.textContent = '';
  const r = el.getBoundingClientRect();
  const W = r.width || innerWidth, H = r.height || innerHeight;
  el._ornW = W; el._ornH = H;

  el._orns = (ch.orns || []).map(o => {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'orn orn-' + o.kind);
    g.style.setProperty('--od', o.dur + 'ms');
    g.style.setProperty('--oe', o.ease);
    g.style.setProperty('--oy', o.delay + 'ms');
    g.style.opacity = o.opacity;
    if (o.rot) g.setAttribute('transform',
      'rotate(' + o.rot + ' ' + (o.x / 100 * W) + ' ' + (o.y / 100 * H) + ')');

    /* les surfaces ne se tracent pas : elles se fondent */
    if (o.kind === 'veil' || o.kind === 'band' || o.kind === 'grain' ||
        o.kind === 'vign' || o.kind === 'progress') {
      const rect = document.createElementNS(NS, 'rect');
      if (o.kind === 'veil') {
        rect.setAttribute('x', 0); rect.setAttribute('width', W);
        rect.setAttribute('y', H - o.h / 100 * H); rect.setAttribute('height', o.h / 100 * H);
        rect.setAttribute('fill', 'url(#veil-' + o.id + ')');
        const defs = document.createElementNS(NS, 'defs');
        defs.innerHTML = '<linearGradient id="veil-' + o.id + '" x1="0" y1="1" x2="0" y2="0">' +
          '<stop offset="0" stop-color="' + o.color + '" stop-opacity="1"/>' +
          '<stop offset="1" stop-color="' + o.color + '" stop-opacity="0"/></linearGradient>';
        g.appendChild(defs);
      } else if (o.kind === 'band') {
        rect.setAttribute('x', o.x > 50 ? W - o.w / 100 * W : 0);
        rect.setAttribute('y', 0);
        rect.setAttribute('width', o.w / 100 * W);
        rect.setAttribute('height', H);
        rect.setAttribute('fill', o.color);
        g.classList.add('slide');
      } else if (o.kind === 'grain') {
        rect.setAttribute('x', 0); rect.setAttribute('y', 0);
        rect.setAttribute('width', W); rect.setAttribute('height', H);
        rect.setAttribute('filter', 'url(#grain-' + o.id + ')');
        const defs = document.createElementNS(NS, 'defs');
        defs.innerHTML = '<filter id="grain-' + o.id + '">' +
          '<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/>' +
          '<feColorMatrix type="saturate" values="0"/></filter>';
        g.appendChild(defs);
      } else if (o.kind === 'vign') {
        rect.setAttribute('x', 0); rect.setAttribute('y', 0);
        rect.setAttribute('width', W); rect.setAttribute('height', H);
        rect.setAttribute('fill', 'url(#vig-' + o.id + ')');
        const defs = document.createElementNS(NS, 'defs');
        defs.innerHTML = '<radialGradient id="vig-' + o.id + '">' +
          '<stop offset="0.45" stop-color="' + o.color + '" stop-opacity="0"/>' +
          '<stop offset="1" stop-color="' + o.color + '" stop-opacity="1"/></radialGradient>';
        g.appendChild(defs);
      } else {
        rect.setAttribute('x', (100 - o.w) / 200 * W);
        rect.setAttribute('y', o.y / 100 * H);
        rect.setAttribute('height', Math.max(1, o.width));
        rect.setAttribute('fill', o.color);
        rect.setAttribute('width', 0);
        g._bar = rect; g._barMax = o.w / 100 * W;
      }
      g.appendChild(rect);
      svg.appendChild(g);
      return g;
    }

    const geo = ornGeom(o, W, H);
    geo.P.forEach(d => {
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', d);
      path.setAttribute('pathLength', '1');
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', o.color);
      path.setAttribute('stroke-width', o.kind === 'mourning' ? o.width * 3 : o.width);
      path.setAttribute('stroke-linecap', o.cap || 'round');
      path.setAttribute('stroke-linejoin', 'round');
      /* un pointillé occupe déjà stroke-dasharray, qui sert au tracé :
         ces ornements se révèlent donc en fondu plutôt qu'au trait */
      if (o.dash) {
        path.setAttribute('stroke-dasharray', o.dash + ' ' + (o.dash * 1.6).toFixed(1));
        g.classList.add('dashed');
      }
      g.appendChild(path);
    });
    geo.F.forEach(f => {
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', f.d);
      path.setAttribute('pathLength', '1');
      path.setAttribute('fill', f.fill || 'none');
      if (f.stroke) {
        path.setAttribute('stroke', f.stroke);
        path.setAttribute('stroke-width', (o.width / (f.sx || 1)).toFixed(2));
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('stroke-linejoin', 'round');
      }
      if (f.tx != null)
        path.setAttribute('transform',
          'translate(' + f.tx + ' ' + f.ty + ') scale(' + f.sx + ' ' + f.sy + ')');
      g.appendChild(path);
    });
    geo.X.forEach(x => {
      const t = document.createElementNS(NS, 'text');
      t.textContent = x.t;
      t.setAttribute('x', x.x); t.setAttribute('y', x.y);
      t.setAttribute('fill', o.color);
      t.setAttribute('text-anchor', x.anchor || 'start');
      t.setAttribute('dominant-baseline', 'middle');
      t.style.fontFamily = quoteFam(o.font);
      t.style.fontSize = 'calc(' + (x.cap ? o.size * 4 : o.size) + 'rem * var(--fs))';
      t.style.letterSpacing = (o.tracking / 100) + 'em';
      t.style.textTransform = 'uppercase';
      if (x.cap && o.width > 0) {
        /* tracée au contour, elle se dessine comme le reste */
        t.setAttribute('fill', 'none');
        t.setAttribute('stroke', o.color);
        t.setAttribute('stroke-width', o.width);
        t.style.fontFamily = quoteFam(o.font);
      }
      if (x.rot) t.setAttribute('transform', 'rotate(' + x.rot + ' ' + x.x + ' ' + x.y + ')');
      g.appendChild(t);
    });
    svg.appendChild(g);
    return g;
  });
}

/* ---------- boutons de choix ---------- */
const ANCHORS = {
  'top-left':[8,12],'top-center':[50,12],'top-right':[92,12],
  'mid-left':[8,50],'mid-center':[50,50],'mid-right':[92,50],
  'bottom-left':[8,88],'bottom-center':[50,88],'bottom-right':[92,88]
};
function currentIndex() {
  for (let i = 0; i < layers.length; i++) if (layers[i].dataset.on === '1') return i;
  return 0;
}
/* Une destination est soit un chapitre, soit une adresse web. */
function goTo(target, newTab) {
  if (/^(https?:|mailto:|tel:|#|\/)/i.test(target || '')) {
    if (newTab) window.open(target, '_blank', 'noopener');
    else location.href = target;
    return;
  }
  let i = target === 'next' ? currentIndex() + 1 : S.chapters.findIndex(c => c.id === target);
  if (i < 0) i = currentIndex() + 1;
  const n = document.getElementById('anchor-' + i);
  if (n) n.scrollIntoView({ behavior: still ? 'auto' : 'smooth' });
}
function goToChapter(id) { goTo(id); }

function styleButton(el, b) {
  const st = el.style;
  const pos = b.posMode === 'anchor' ? (ANCHORS[b.anchor] || [50, 88]) : [b.posX, b.posY];
  st.left = pos[0] + '%';
  st.top = pos[1] + '%';
  st.fontFamily = quoteFam(b.font);
  st.fontSize = 'calc(' + b.size + 'rem * var(--fs))';
  st.fontWeight = b.weight;
  st.letterSpacing = (b.tracking / 100) + 'em';
  st.textTransform = b.caps === 'none' ? 'none' : b.caps;
  st.color = b.color;
  st.background = hexA(b.bg, b.bgAlpha);
  st.border = b.borderW ? b.borderW + 'px solid ' + b.borderC : 'none';
  st.borderRadius = b.radius + 'px';
  st.padding = b.padY + 'em ' + b.padX + 'em';
  st.backdropFilter = b.blur ? 'blur(' + b.blur + 'px)' : 'none';
  st.boxShadow = b.shadow ? '0 ' + (b.shadow / 3) + 'px ' + b.shadow + 'px ' + hexA(b.shadowC, .5) : 'none';
  st.setProperty('--hbg', b.hoverBg);
  st.setProperty('--hcol', b.hoverColor);
  el.className = 'choice beat anim-' + (b.anim || 'fade') +
    (el.dataset.on === '1' ? ' on' : '');
  st.setProperty('--dist', '26px');
  const u = el.firstChild;
  if (u && u.className && u.className.indexOf('u ') === 0) {
    u.style.transitionDuration = (b.dur || 700) + 'ms';
    u.style.transitionTimingFunction = b.ease || 'cubic-bezier(.33,1,.68,1)';
    u.firstChild.style.transitionDuration = (b.dur || 700) + 'ms';
    u.firstChild.style.transitionTimingFunction = b.ease || 'cubic-bezier(.33,1,.68,1)';
  }
  /* habillage libre : la règle saisie l'emporte sur tout ce qui précède */
  if (b.css) { try { st.cssText += ';' + b.css; } catch (e) {} }
}

function buildZones(el, ch) {
  let wrap = el._zwrap;
  if (!wrap) {
    wrap = document.createElement('div');
    wrap.className = 'zones';
    el.insertBefore(wrap, el._bwrap || null);
    el._zwrap = wrap;
  }
  wrap.textContent = '';
  el._zones = (ch.zones || []).map(z => {
    const n = document.createElement('button');
    n.type = 'button';
    n.className = 'zone' + (z.hoverGlow ? ' glow' : '') + (z.hoverFrost ? ' frost' : '');
    if (z.hoverFrost) n.style.setProperty('--zb', (z.frostAmount || 8) + 'px');
    n.dataset.on = '0';
    n.setAttribute('aria-label', z.label || 'Zone interactive');
    n.title = z.label || '';
    const st = n.style;
    st.left = z.x + '%'; st.top = z.y + '%';
    st.width = z.w + '%'; st.height = z.h + '%';
    st.borderRadius = z.shape === 'ellipse' ? '50%' : '4px';
    st.borderWidth = (z.outline || 0) + 'px';
    st.borderColor = z.color;
    st.cursor = z.cursor || 'pointer';
    st.setProperty('--zc', z.color);
    n.addEventListener('click', e => {
      if (editMode) { e.preventDefault(); return; }
      goTo(z.link ? z.url : z.target, z.newTab);
    });
    /* huit poignées pour redimensionner la zone en mode édition */
    ['nw','n','ne','e','se','s','sw','w'].forEach(pos => {
      const hd = document.createElement('i');
      hd.className = 'hd hd-' + pos;
      hd.addEventListener('pointerdown', e => {
        if (!editMode) return;
        e.stopPropagation(); e.preventDefault();
        const r = el.getBoundingClientRect();
        drag = { kind: 'zone', chapter: el._ch.id, id: z.id, pos: pos, rect: r,
                 x0: z.x, y0: z.y, w0: z.w, h0: z.h,
                 mx: e.clientX, my: e.clientY };
      });
      n.appendChild(hd);
    });
    wrap.appendChild(n);
    return n;
  });
}

function buildButtons(el, ch) {
  const wrap = el._bwrap;
  if (!wrap) return;
  wrap.textContent = '';
  el._btns = (ch.buttons || []).map(b => {
    const n = document.createElement('button');
    n.type = 'button';
    /* le libellé est enveloppé comme une unité de texte : les 37 effets
       d'apparition s'appliquent alors au bouton sans code particulier */
    const u = document.createElement('span');
    u.className = 'u u-block';
    const ui = document.createElement('span');
    ui.className = 'ui';
    ui.textContent = b.label;
    u.appendChild(ui);
    n.appendChild(u);
    n.dataset.on = '0';
    styleButton(n, b);
    n.addEventListener('click', () => goTo(b.link ? b.url : b.target, b.newTab));
    wrap.appendChild(n);
    return n;
  });
}

/* Liseré de progression : discret au repos, il déplie le chapitrage au survol.
   Il remplace la barre de défilement du navigateur, masquée dès qu'il
   existe : on peut cliquer n'importe où sur la ligne pour s'y rendre, ou
   la faire glisser comme un curseur. Chaque pastille est placée au début
   réel de son chapitre, proportionnellement à sa longueur. */
let railFill = null, railDots = [], railTrack = null;
function buildRail() {
  if (S.chapters.length < 2) return;
  document.documentElement.classList.add('has-rail');
  const nav = document.createElement('nav');
  nav.className = 'rail';
  nav.setAttribute('aria-label', 'Chapitres');
  const track = document.createElement('div');
  track.className = 'rtrack';
  const line = document.createElement('div');
  line.className = 'rline';
  const fill = document.createElement('div');
  fill.className = 'rfill';
  line.appendChild(fill);
  track.appendChild(line);
  nav.appendChild(track);
  railFill = fill;
  railTrack = track;
  railDots = S.chapters.map((ch, i) => {
    const a = document.createElement('button');
    a.type = 'button';
    a.className = 'rdot';
    const lab = document.createElement('span');
    lab.className = 'rlab';
    a.appendChild(lab);
    /* au clavier seulement : la souris et le doigt passent par le liseré */
    a.addEventListener('click', e => { if (e.detail === 0) goChapter(i); });
    track.appendChild(a);
    return a;
  });
  layoutRail();

  /* Glisser n'importe où sur le liseré fait défiler la page, comme une
     barre native — pastilles comprises, qui couvrent vite toute la ligne
     quand les chapitres sont nombreux. Un simple clic sur une pastille
     mène au début de son chapitre ; ailleurs, à la position visée. */
  let drag = null;
  const seek = (y, smooth) => {
    const r = track.getBoundingClientRect();
    if (!r.height) return;
    const f = Math.max(0, Math.min(1, (y - r.top) / r.height));
    const total = spacer.scrollHeight - innerHeight;
    if (total <= 0) return;
    if (smooth && !still) { scrollTo({ top: f * total, behavior: 'smooth' }); return; }
    /* la page défile en douceur par défaut : pendant un glissé, la position
       doit suivre le geste sans retard */
    const html = document.documentElement, was = html.style.scrollBehavior;
    html.style.scrollBehavior = 'auto';
    scrollTo(0, f * total);
    html.style.scrollBehavior = was;
  };
  nav.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    const d = e.target.closest('.rdot');
    drag = { id: e.pointerId, y0: e.clientY, dot: d ? railDots.indexOf(d) : -1, moved: false };
    try { nav.setPointerCapture(e.pointerId); } catch (err) {}
  });
  nav.addEventListener('pointermove', e => {
    if (!drag || drag.id !== e.pointerId) return;
    if (!drag.moved && Math.abs(e.clientY - drag.y0) < 4) return;
    if (!drag.moved) { drag.moved = true; nav.classList.add('drag'); }
    seek(e.clientY);
  });
  const end = e => {
    if (!drag || drag.id !== e.pointerId) return;
    const d = drag;
    drag = null;
    nav.classList.remove('drag');
    try { nav.releasePointerCapture(e.pointerId); } catch (err) {}
    if (e.type === 'pointercancel' || d.moved) return;
    if (d.dot >= 0) goChapter(d.dot);
    else seek(e.clientY, true);
  };
  nav.addEventListener('pointerup', end);
  nav.addEventListener('pointercancel', end);
  document.body.appendChild(nav);
}
function goChapter(i) {
  const n = document.getElementById('anchor-' + i);
  if (n) n.scrollIntoView({ behavior: still ? 'auto' : 'smooth' });
}
/* position et nom des pastilles : recalculés à chaque retouche du récit */
function layoutRail() {
  if (!railDots.length) return;
  const lens = S.chapters.map(c => Math.max(1, +c.len || 100));
  const sum = lens.reduce((a, b) => a + b, 0);
  let acc = 0;
  railDots.forEach((a, i) => {
    const ch = S.chapters[i];
    if (!ch) return;
    a.style.top = (acc / sum * 100) + '%';
    acc += lens[i];
    const name = ch.name || 'Chapitre ' + (i + 1);
    const lab = a.firstChild;
    if (lab.textContent !== name) { lab.textContent = name; a.setAttribute('aria-label', name); }
  });
}

/* ---------- points chauds : pastille, diagonale, trait, texte ---------- */
function buildSpots(el, ch) {
  const svg = el.querySelector('.spots');
  if (!svg) return;
  svg.textContent = '';
  el._spots = (ch.spots || []).map(sp => {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'spot');
    const dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('r', 3.5);
    dot.setAttribute('fill', sp.color);
    const ring = document.createElementNS(NS, 'circle');
    ring.setAttribute('r', 8);
    ring.setAttribute('fill', 'none');
    ring.setAttribute('stroke', sp.color);
    ring.setAttribute('stroke-width', 1);
    ring.setAttribute('opacity', .45);
    const line = document.createElementNS(NS, 'polyline');
    line.setAttribute('fill', 'none');
    line.setAttribute('stroke', sp.color);
    line.setAttribute('stroke-width', 1);
    const txt = document.createElementNS(NS, 'text');
    txt.textContent = sp.label;
    txt.setAttribute('fill', sp.color);
    txt.style.fontFamily = quoteFam(sp.font);
    txt.style.fontSize = 'calc(' + sp.size + 'rem * var(--fs))';
    txt.style.fontWeight = sp.weight;
    txt.style.letterSpacing = (sp.tracking / 100) + 'em';
    txt.style.textTransform = sp.caps === 'none' ? 'none' : sp.caps;
    g.appendChild(ring); g.appendChild(dot); g.appendChild(line); g.appendChild(txt);
    svg.appendChild(g);
    return { g: g, dot: dot, ring: ring, line: line, txt: txt };
  });
}

function drawSpot(node, sp, x, y) {
  const d = sp.side >= 0 ? 1 : -1;
  const dx = 22 * d, dy = -22;               // la diagonale part toujours vers le haut
  const ex = dx + sp.len * d;
  node.dot.setAttribute('cx', x); node.dot.setAttribute('cy', y);
  node.ring.setAttribute('cx', x); node.ring.setAttribute('cy', y);
  node.line.setAttribute('points',
    x + ',' + y + ' ' + (x + dx) + ',' + (y + dy) + ' ' + (x + ex) + ',' + (y + dy));
  node.txt.setAttribute('x', x + ex + 7 * d);
  node.txt.setAttribute('y', y + dy - 6);
  node.txt.setAttribute('text-anchor', d > 0 ? 'start' : 'end');
}

/* ---------- son ---------- */
/* Les navigateurs refusent tout son avant un geste de l'utilisateur.
   On n'essaie donc rien tant que le portillon n'a pas été franchi. */
let audioOn = false;
let music = null;
let speaking = null;

function hasAudio() {
  if (S.music && S.music.src) return true;
  return S.chapters.some(c =>
    (c.music && c.music.src) ||
    (c.sfx || []).some(f => f.src) ||
    (c.type === 'video' && c.src && c.mute === false) ||
    (c.beats || []).some(b => b.voiceSrc));
}

function buildGate() {
  if (!hasAudio()) return;
  const g = document.createElement('button');
  g.className = 'gate';
  g.innerHTML = '<span class="gi"></span><span>Activer le son</span>';
  g.addEventListener('click', () => {
    audioOn = true;
    g.classList.add('off');
    setTimeout(() => g.remove(), 700);
    setMusic(wantedMusic(), true);
    layers.forEach(el => {
      const ch = el._ch;
      if (el._media && el._media.tagName === 'VIDEO' && ch.mute === false) {
        el._media.muted = false;
        el._media.volume = el.dataset.on === '1' ? (ch.volume == null ? .9 : ch.volume) : 0;
      }
    });
    request();
  });
  document.body.appendChild(g);
  return g;
}

/* ---- musique : une piste par chapitre, enchaînées en fondu ---- */
let musicKey = null, musicVol = 0.35;

function wantedMusic() {
  const el = layers[currentIndex()];
  const ch = el && el._ch;
  const m = ch && ch.music;
  if (m && m.mode === 'silence') return null;
  if (m && m.mode === 'own' && m.src) return { src: m.src, vol: m.volume, fade: m.fade };
  if (S.music && S.music.src) return { src: S.music.src, vol: S.music.volume, fade: S.music.fade };
  return null;
}

function setMusic(next, immediate) {
  const key = next ? next.src : null;
  if (key === musicKey) {
    if (next && music) { musicVol = next.vol; fadeTo(music, next.vol, 0.6); }
    return;
  }
  musicKey = key;
  const old = music;
  if (old) {
    const f = (next && next.fade) || 1.5;
    fadeTo(old, 0, f);
    setTimeout(() => { try { old.pause(); } catch (e) {} }, f * 1000 + 80);
  }
  music = null;
  if (!next) return;
  const a = new Audio(next.src);
  a.loop = true;
  a.volume = immediate ? 0 : 0;
  musicVol = next.vol;
  music = a;
  a.play().then(() => fadeTo(a, next.vol, next.fade || 1.5)).catch(() => {});
}

/* ---- bruitages : en parallèle de la voix, sans atténuer la musique ---- */
function playSfx(f) {
  if (!audioOn || !f.src) return;
  const a = new Audio(f.src);
  a.volume = f.volume == null ? 0.8 : f.volume;
  a.play().catch(() => {});
}

function fadeTo(el, target, secs) {
  if (!el) return;
  const from = el.volume, t0 = performance.now(), d = Math.max(0.05, secs || 1) * 1000;
  (function step(now) {
    const k = Math.min(1, (now - t0) / d);
    try { el.volume = Math.max(0, Math.min(1, from + (target - from) * k)); } catch (e) {}
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

/* La narration baisse la musique pendant qu'elle parle, puis la relève.
   Une seule voix à la fois : entrer dans un nouveau texte coupe la précédente
   en fondu court plutôt que de superposer deux paroles. */
function speak(b) {
  if (!audioOn || !b.voiceSrc) return;
  if (speaking && speaking.b === b) return;
  hush(0.25);
  const a = new Audio(b.voiceSrc);
  /* pleine puissance dès la première syllabe : un fondu d'entrée mangeait
     le début des phrases. Seule la sortie est fondue. */
  a.volume = 1;
  speaking = { a: a, b: b };
  a.play().catch(() => {});
  if (music) fadeTo(music, musicVol * (S.music.duck == null ? .35 : S.music.duck), 0.6);
  a.addEventListener('ended', () => {
    if (speaking && speaking.a === a) { speaking = null; if (music) fadeTo(music, musicVol, 1.2); }
  });
}
function hush(secs) {
  if (!speaking) return;
  const a = speaking.a;
  speaking = null;
  fadeTo(a, 0, secs || 0.4);
  setTimeout(() => { try { a.pause(); } catch (e) {} }, (secs || 0.4) * 1000 + 60);
  if (music) fadeTo(music, musicVol, 1.2);
}

/* ---------- construction complète ---------- */
function mount() {
  root.textContent = '';
  spacer.textContent = '';
  layers = S.chapters.map((ch, i) => {
    const el = document.createElement('section');
    el.className = 'layer layer-' + ch.type;
    el.setAttribute('aria-label', ch.name || 'Chapitre ' + (i + 1));
    if (ch.bg) el.style.background = ch.bg;
    let media = null;

    if (ch.type === 'video' && ch.src) {
      media = document.createElement('video');
      /* propriété et non attribut : dans un fichier unique, l'adresse data:
         pèse des dizaines de mégaoctets et n'a rien à faire dans le DOM */
      media._src = ch.src;
      media.playsInline = true;
      media.muted = true;
      media.loop = loops(ch);
      /* rien n'est téléchargé tant que le chapitre n'approche pas */
      media.preload = 'none';
      media.volume = 0;
      media.tabIndex = -1;
      media.style.objectFit = ch.fit || 'cover';
      el.appendChild(media);
      const v = document.createElement('div');
      v.className = 'veil';
      v.style.opacity = ch.dim || 0;
      el.appendChild(v);
      el._veil = v;
    }
    if (ch.type === 'image' && ch.src) {
      const holder = document.createElement('div');
      holder.className = 'imgwrap';
      /* .kb porte le mouvement lent ; la trame et le grain sont dedans,
         donc ils zooment et dérivent avec l'image au lieu de flotter par-dessus */
      const kb = document.createElement('div');
      kb.className = 'kb';
      media = document.createElement('img');
      media.src = ch.src;
      media.alt = ch.name || '';
      media.decoding = 'async';
      kb.appendChild(media);
      holder.appendChild(kb);
      el.appendChild(holder);
      el._holder = holder;
      el._kb = kb;
      const vig = document.createElement('div');
      vig.className = 'vignette';
      el.appendChild(vig);
      el._vig = vig;
      const v = document.createElement('div');
      v.className = 'veil';
      v.style.opacity = ch.dim || 0;
      el.appendChild(v);
      el._veil = v;
    }
    if (ch.type === 'model' && ch.src) {
      media = document.createElement('canvas');
      media.className = 'gl';
      el.appendChild(media);
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'spots');
      el.appendChild(svg);
    }

    const wrap = document.createElement('div');
    wrap.className = 'beats';
    el.appendChild(wrap);

    const bwrap = document.createElement('div');
    bwrap.className = 'btns';
    el.appendChild(bwrap);
    el._bwrap = bwrap;
    el._media = media;
    el._ch = ch;
    root.appendChild(el);
    buildBeats(el, ch);
    buildSpots(el, ch);
    buildOrns(el, ch);
    buildZones(el, ch);
    buildButtons(el, ch);
    /* signatures de départ : sans elles, le tout premier correctif
       reconstruirait tout et couperait les animations en cours */
    el._ornSig = sig(ch.orns);
    el._zoneSig = sig(ch.zones);
    el._btnSig = sig(ch.buttons);
    el._spotSig = sig(ch.spots);
    return el;
  });

  S.chapters.forEach((ch, i) => {
    const a = document.createElement('div');
    a.id = 'anchor-' + i;
    a.style.height = ch.len + 'dvh';
    spacer.appendChild(a);
  });
  /* Le défilement s'arrête une hauteur d'écran avant le bas du document.
     Sans cette réserve, le dernier chapitre n'était parcouru que sur
     (longueur − 100 vh) : un texte placé au-delà n'apparaissait jamais. */
  const tail = document.createElement('div');
  tail.className = 'tail';
  tail.style.height = '100dvh';
  spacer.appendChild(tail);
  applyChapterSettings();
  buildRail();
  buildGate();
  if (semantic) semantic.hidden = true;   /* le texte brut ne sert qu'aux robots et lecteurs d'écran */
}

/* « En boucle » est le seul mode qui boucle. Le menu Lecture a remplacé
   l'ancienne case loop, que le moteur continuait de lire : « Une seule
   fois » n'avait donc aucun effet. Repli sur loop pour les vieux projets. */
function loops(ch) { return ch.playMode ? ch.playMode === 'loop' : ch.loop !== false; }

/* charge la vidéo du chapitre demandé, et seulement celle-là */
function warm(i) {
  const el = layers[i];
  if (!el) return;
  const m = el._media;
  if (m && m.tagName === 'VIDEO' && !m.src && m._src) {
    m.preload = 'auto';
    m.src = m._src;
    m.load();
  }
}

/* Les WebM de l'ancien convertisseur (enregistrés en direct) n'ont ni durée
   ni index : Chrome annonce une durée infinie, et le défilement image par
   image, qui a besoin de la durée pour placer la tête de lecture, ne
   démarrait jamais. On oblige le navigateur à la mesurer en l'envoyant
   chercher au-delà de la fin, puis on revient au début. */
function fixDuration(v) {
  if (v._durFix) return;
  v._durFix = true;
  const done = () => {
    if (!isFinite(v.duration) || !(v.duration > 0)) return;
    v.removeEventListener('durationchange', done);
    v.removeEventListener('seeked', done);
    try { v.currentTime = 0; } catch (e) {}
    request();
  };
  v.addEventListener('durationchange', done);
  v.addEventListener('seeked', done);
  try { v.currentTime = 1e101; } catch (e) {}
}

/* Raccord : pour enchaîner sans noir entre deux plans, la vidéo suivante doit
   déjà avoir décodé sa première image. On la charge et on l'y positionne. */
function prime(i) {
  const el = layers[i];
  if (!el || el._primed) return;
  const ch = el._ch;
  if (!ch || ch.type !== 'video' || !ch.stitch) return;
  warm(i);
  const m = el._media;
  if (!m || m.tagName !== 'VIDEO') return;
  el._primed = true;
  const seek = () => { try { m.currentTime = 0.001; } catch (e) {} };
  if (m.readyState >= 1) seek();
  else m.addEventListener('loadedmetadata', seek, { once: true });
}

/* le raccord ne vaut que si les deux chapitres sont bien des vidéos */
function stitched(i) {
  const el = layers[i], prev = layers[i - 1];
  if (!el || !prev) return false;
  return !!el._ch.stitch && el._ch.type === 'video' && prev._ch.type === 'video';
}

/* Un filtre SVG par chapitre : postérisation par paliers, virage bichrome
   par matrice de couleur, grain par bruit fractal. */
function imgFilter(ch) {
  const id = 'fx-' + ch.id;
  const parts = [];
  if (ch.duotone > 0) {
    const A = hexRGB(ch.duoA), B = hexRGB(ch.duoB);
    parts.push('<feColorMatrix type="matrix" values="' +
      '.33 .33 .33 0 0  .33 .33 .33 0 0  .33 .33 .33 0 0  0 0 0 1 0" result="g"/>');
    parts.push('<feComponentTransfer in="g" result="duo">' +
      '<feFuncR type="table" tableValues="' + A[0] + ' ' + B[0] + '"/>' +
      '<feFuncG type="table" tableValues="' + A[1] + ' ' + B[1] + '"/>' +
      '<feFuncB type="table" tableValues="' + A[2] + ' ' + B[2] + '"/></feComponentTransfer>');
    if (ch.duotone < 1)
      parts.push('<feComposite in="duo" in2="SourceGraphic" operator="arithmetic" k2="' +
        ch.duotone + '" k3="' + (1 - ch.duotone) + '" result="duo"/>');
  }
  if (ch.posterize > 1) {
    const n = Math.max(2, ch.posterize | 0), v = [];
    for (let i = 0; i < n; i++) v.push((i / (n - 1)).toFixed(3));
    const t = v.join(' ');
    parts.push('<feComponentTransfer>' +
      '<feFuncR type="discrete" tableValues="' + t + '"/>' +
      '<feFuncG type="discrete" tableValues="' + t + '"/>' +
      '<feFuncB type="discrete" tableValues="' + t + '"/></feComponentTransfer>');
  }
  if (!parts.length) return '';
  let defs = document.getElementById('recit-defs');
  if (!defs) {
    defs = document.createElementNS(NS, 'svg');
    defs.id = 'recit-defs';
    defs.setAttribute('aria-hidden', 'true');
    defs.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden';
    document.body.appendChild(defs);
  }
  let f = document.getElementById(id);
  if (!f) {
    f = document.createElementNS(NS, 'filter');
    f.id = id;
    f.setAttribute('color-interpolation-filters', 'sRGB');
    defs.appendChild(f);
  }
  f.innerHTML = parts.join('');
  return 'url(#' + id + ')';
}
function hexRGB(hex) {
  const h = (hex || '#000').replace('#', '');
  const n = parseInt(h.length === 3 ? h.replace(/(.)/g, '$1$1') : h, 16);
  return [(((n >> 16) & 255) / 255).toFixed(3),
          (((n >> 8) & 255) / 255).toFixed(3),
          ((n & 255) / 255).toFixed(3)];
}

/* Le traitement — filtres, trame, grain, vignettage — s'applique au média
   de n'importe quel chapitre : image, vidéo ou rendu 3D. */
function styleTreatment(el, ch) {
  const im = el._media;
  const host = el._kb || el;              /* pour une image, dans l'enveloppe animée */

  if (im) {
    const f = [];
    if (ch.blur) f.push('blur(' + ch.blur + 'px)');
    if (ch.brightness != 1) f.push('brightness(' + ch.brightness + ')');
    if (ch.contrast != 1) f.push('contrast(' + ch.contrast + ')');
    if (ch.saturate != 1) f.push('saturate(' + ch.saturate + ')');
    if (ch.sepia) f.push('sepia(' + ch.sepia + ')');
    if (ch.grayscale) f.push('grayscale(' + ch.grayscale + ')');
    const svgf = imgFilter(ch);
    if (svgf) f.push(svgf);
    im.style.filter = f.length ? f.join(' ') : 'none';
    if (ch.type !== 'image') im.style.mixBlendMode = ch.blend || 'normal';
  }

  if (!el._half) {
    const d1 = document.createElement('div'); d1.className = 'halftone';
    const d2 = document.createElement('div'); d2.className = 'paperGrain';
    host.appendChild(d1); host.appendChild(d2);
    el._half = d1; el._grain = d2;
  }
  const sc = Math.max(2, ch.halftoneScale || 6);
  el._half.style.opacity = ch.halftone || 0;
  el._half.style.backgroundSize = sc + 'px ' + sc + 'px';
  el._half.style.transform = 'rotate(' + (ch.halftoneAngle || 0) + 'deg) scale(1.6)';
  el._grain.style.opacity = ch.grain || 0;

  if (!el._vig) {
    const v = document.createElement('div');
    v.className = 'vignette';
    el.insertBefore(v, el.querySelector('.orns') || el.querySelector('.beats'));
    el._vig = v;
  }
  el._vig.style.opacity = ch.vignette || 0;
}

function styleImage(el, ch) {
  const h = el._holder, im = el._media;
  if (!h || !im) return;
  im.style.objectFit = ch.fit || 'cover';
  h.style.borderRadius = ch.radius + 'px';
  h.style.border = ch.borderW ? ch.borderW + 'px solid ' + ch.borderC : 'none';
  h.style.boxShadow = ch.shadow
    ? '0 ' + (ch.shadow / 3) + 'px ' + ch.shadow + 'px ' + hexA(ch.shadowC, .55) : 'none';
  h.style.inset = ch.frame === 'plein' ? '0' : ch.inset + '%';
  h.style.mixBlendMode = ch.blend || 'normal';
  h.style.background = ch.paper || 'transparent';
}

function applyChapterSettings() {
  layers.forEach((el, i) => {
    const ch = S.chapters[i];
    el._ch = ch;
    if (ch.type === 'image') styleImage(el, ch);
    styleTreatment(el, ch);
    if (ch.bg) el.style.background = ch.bg;
    if (el._veil) el._veil.style.opacity = ch.dim || 0;
    if (el._media && el._media.tagName === 'VIDEO') {
      const v = el._media;
      v.style.objectFit = ch.fit || 'cover';
      const driven = ch.playMode === 'scrub' || ch.playMode === 'pointer';
      v.loop = loops(ch);
      /* en défilement image par image le son n'a pas de sens : il serait
         haché à chaque saut de position */
      v.muted = driven ? true : ch.mute !== false;
      /* changement de mode de lecture pendant que le chapitre est à l'écran :
         une vidéo passée en défilement continuait de jouer toute seule et
         se battait avec le scroll ; l'inverse restait figée */
      const mode = ch.playMode || (ch.loop === false ? 'once' : 'loop');
      if (el._mode && el._mode !== mode && el.dataset.on === '1') {
        if (driven) {
          try { v.pause(); } catch (e) {}
          el._scrub = null;
          if (el._ptr) el._ptr.cur = null;
        } else {
          v.play().catch(() => {});
        }
      }
      el._mode = mode;
      if (ch.playMode !== 'pointer' && el._ptr) el.style.cursor = '';
      if (ch.playMode === 'pointer' && el._ptr) el.style.cursor = 'ew-resize';
    }
    const a = document.getElementById('anchor-' + i);
    if (a) a.style.height = ch.len + 'dvh';
  });
  layoutRail();
}

/* Reconstruire un ornement ou un bouton coupe net l'animation en cours.
   On compare donc une signature et on ne refait que ce qui a réellement
   changé de forme ; le reste est simplement restylé. */
function patch(next) {
  S = next;
  window.__STORY__ = next;
  layers.forEach((el, i) => {
    const ch = S.chapters[i];
    if (!ch) return;

    const olds = el._beats;
    const same = olds.length === ch.beats.length &&
      ch.beats.every((b, k) => olds[k].dataset.id === b.id);
    if (!same) buildBeats(el, ch);
    else ch.beats.forEach((b, k) => {
      const d = olds[k];
      styleBeat(d, b);
      const s2 = b.text + '|' + b.unit + '|' + b.dur + '|' + b.stagger + '|' +
                 b.ease + '|' + b.delay + '|' + b.arc + '|' + b.arcFlip;
      if (d._sig !== s2) { d._units = buildUnits(d, b); d._sig = s2; }
    });

    if (ch.type === 'model') {
      const s3 = sig(ch.spots);
      if (el._spotSig !== s3) { buildSpots(el, ch); el._spotSig = s3; }
    }
    const s4 = sig(ch.orns);
    if (el._ornSig !== s4) { buildOrns(el, ch); el._ornSig = s4; }
    const s5 = sig(ch.zones);
    if (el._zoneSig !== s5) { buildZones(el, ch); el._zoneSig = s5; }
    const s6 = sig(ch.buttons);
    if (el._btnSig !== s6) { buildButtons(el, ch); el._btnSig = s6; }
  });
  applyChapterSettings();
  request();
}

/* ---------- dialogue avec l'éditeur ---------- */
addEventListener('message', e => {
  const m = e.data;
  if (!m || typeof m !== 'object') return;
  if (m.type === 'recit:patch') { try { patch(m.story); } catch (err) { console.error('[Récit]', err); } }
  if (m.type === 'recit:place') { placing = m.chapter; document.body.style.cursor = 'crosshair'; }
  if (m.type === 'recit:edit') { editMode = !!m.on; document.body.classList.toggle('editing', editMode); }
  if (m.type === 'recit:cancelPlace') { placing = null; document.body.style.cursor = ''; }
  if (m.type === 'recit:goto') {
    let acc = 0;
    for (let i = 0; i < S.chapters.length; i++) {
      const len = (S.chapters[i].len / 100) * innerHeight;
      if (S.chapters[i].id === m.chapter) { scrollTo({ top: acc + len * (m.at + 0.03), behavior: 'auto' }); break; }
      acc += len;
    }
  }
});

/* ---------- édition directe : déplacer un texte, tourner un modèle ---------- */
let editMode = false, drag = null, guideEl = null;

/* Le magnétisme : centres, tiers et marges. Un guide apparaît quand on accroche. */
const SNAPS = [0, 8, 25, 33.33, 50, 66.67, 75, 92, 100];
function snap(v, tol) {
  for (let i = 0; i < SNAPS.length; i++)
    if (Math.abs(v - SNAPS[i]) < (tol || 1.6)) return { v: SNAPS[i], hit: true };
  return { v: v, hit: false };
}
function showGuides(x, y) {
  if (!guideEl) {
    guideEl = document.createElement('div');
    guideEl.className = 'guides';
    guideEl.innerHTML = '<i class="gv"></i><i class="gh"></i>';
    document.body.appendChild(guideEl);
  }
  const gv = guideEl.firstChild, gh = guideEl.lastChild;
  gv.style.display = x == null ? 'none' : 'block';
  gh.style.display = y == null ? 'none' : 'block';
  if (x != null) gv.style.left = x + '%';
  if (y != null) gh.style.top = y + '%';
}
function hideGuides() { if (guideEl) guideEl.style.display = 'none'; }

addEventListener('pointerdown', ev => {
  if (!editMode || placing) return;
  const el = layers.find(l => l.dataset.on === '1');
  if (!el) return;
  const rect = el.getBoundingClientRect();

  /* une zone sous le pointeur : on la déplace */
  const zs = el._zones || [];
  for (let k = zs.length - 1; k >= 0; k--) {
    const node = zs[k];
    if (node.dataset.on !== '1') continue;
    const box = node.getBoundingClientRect();
    if (ev.clientX >= box.left && ev.clientX <= box.right &&
        ev.clientY >= box.top && ev.clientY <= box.bottom) {
      const z = el._ch.zones[k];
      drag = { kind: 'zone', chapter: el._ch.id, id: z.id, pos: 'move', rect: rect,
               x0: z.x, y0: z.y, w0: z.w, h0: z.h, mx: ev.clientX, my: ev.clientY };
      ev.preventDefault();
      return;
    }
  }

  /* un ornement sous le pointeur : on le déplace en premier */
  const orns = el._orns || [];
  for (let k = orns.length - 1; k >= 0; k--) {
    const node = orns[k];
    if (node.dataset.on !== '1') continue;
    let box;
    try { box = node.getBoundingClientRect(); } catch (err) { continue; }
    if (!box.width && !box.height) continue;
    if (ev.clientX >= box.left && ev.clientX <= box.right &&
        ev.clientY >= box.top && ev.clientY <= box.bottom) {
      drag = { kind: 'orn', el: el, rect: rect, id: el._ch.orns[k].id, chapter: el._ch.id };
      ev.preventDefault();
      return;
    }
  }

  /* un texte visible sous le pointeur : on le déplace */
  const beats = el._beats || [];
  for (let k = beats.length - 1; k >= 0; k--) {
    const node = beats[k];
    if (node.dataset.on !== '1') continue;
    const r = node.getBoundingClientRect();
    if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) {
      drag = { kind: 'beat', el: el, rect: rect, id: el._ch.beats[k].id, chapter: el._ch.id };
      ev.preventDefault();
      return;
    }
  }
  /* sinon, sur un chapitre 3D : on fait tourner le modèle */
  if (el._ch.type === 'model') {
    drag = { kind: 'rot', el: el, chapter: el._ch.id,
             x: ev.clientX, y: ev.clientY,
             rx: el._ch.rotX || 0, ry: el._ch.rotY || 0 };
    ev.preventDefault();
  }
}, true);

addEventListener('pointermove', ev => {
  if (!drag) return;
  if (drag.kind === 'beat' || drag.kind === 'orn') {
    const r = drag.rect;
    let px = ((ev.clientX - r.left) / r.width) * 100;
    let py = ((ev.clientY - r.top) / r.height) * 100;
    if (!ev.altKey) {                      /* Alt enfoncé : placement libre */
      const sx = snap(px), sy = snap(py);
      px = sx.v; py = sy.v;
      if (guideEl) guideEl.style.display = 'block';
      showGuides(sx.hit ? px : null, sy.hit ? py : null);
    } else hideGuides();
    parent.postMessage({
      type: drag.kind === 'orn' ? 'recit:ornmoved' : 'recit:moved',
      chapter: drag.chapter, id: drag.id,
      posX: +px.toFixed(1), posY: +py.toFixed(1) }, '*');
  } else if (drag.kind === 'zone') {
    const r = drag.rect;
    const dx = (ev.clientX - drag.mx) / r.width * 100;
    const dy = (ev.clientY - drag.my) / r.height * 100;
    const p = drag.pos;
    let x = drag.x0, y = drag.y0, w = drag.w0, h = drag.h0;
    if (p === 'move') {
      x = drag.x0 + dx; y = drag.y0 + dy;
      if (!ev.altKey) { x = snap(x).v; y = snap(y).v; }
    }
    if (p.indexOf('e') >= 0) { w = Math.max(2, drag.w0 + dx); x = drag.x0 + dx / 2; }
    if (p.indexOf('w') >= 0) { w = Math.max(2, drag.w0 - dx); x = drag.x0 + dx / 2; }
    if (p.indexOf('s') >= 0) { h = Math.max(2, drag.h0 + dy); y = drag.y0 + dy / 2; }
    if (p.indexOf('n') >= 0) { h = Math.max(2, drag.h0 - dy); y = drag.y0 + dy / 2; }
    parent.postMessage({ type: 'recit:zoned', chapter: drag.chapter, id: drag.id,
      x: +x.toFixed(1), y: +y.toFixed(1), w: +w.toFixed(1), h: +h.toFixed(1) }, '*');
  } else {
    parent.postMessage({ type: 'recit:rotated', chapter: drag.chapter,
      rotY: Math.round(drag.ry + (ev.clientX - drag.x) * 0.45),
      rotX: Math.round(drag.rx + (ev.clientY - drag.y) * 0.45) }, '*');
  }
}, true);

addEventListener('pointerup', () => { drag = null; hideGuides(); }, true);

/* clic sur le modèle : on renvoie le point dans le repère du pivot */
addEventListener('click', ev => {
  if (!placing) return;
  const el = layers.find(l => l._ch.id === placing);
  const st = el && gl.get(el);
  if (!st || typeof st === 'string') return;
  const THREE = st.THREE;
  const r = el.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    (ev.clientX - r.left) / r.width * 2 - 1,
    -((ev.clientY - r.top) / r.height * 2 - 1));
  const ray = new THREE.Raycaster();
  ray.setFromCamera(ndc, st.cam);
  const hit = ray.intersectObject(st.pivot, true)[0];
  let point;
  if (hit) {
    point = st.pivot.worldToLocal(hit.point.clone());
  } else {
    // pas de maillage (nuage de splats) : on projette sur le plan qui
    // passe par le centre et fait face à la caméra
    const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0)
      .applyMatrix4(st.pivot.matrixWorld);
    const p = new THREE.Vector3();
    if (!ray.ray.intersectPlane(plane, p)) return;
    point = st.pivot.worldToLocal(p);
  }
  placing = null;
  document.body.style.cursor = '';
  parent.postMessage({
    type: 'recit:placed', chapter: el._ch.id,
    p: [+point.x.toFixed(4), +point.y.toFixed(4), +point.z.toFixed(4)]
  }, '*');
}, true);

/* ---------- 3D ---------- */
async function ensure3D(el) {
  if (gl.has(el)) return gl.get(el);
  /* aperçu léger, média absent : il n'y a pas de canvas à peindre */
  if (!el._media || !el._ch.src) return null;
  const box = el.getBoundingClientRect();
  if (!box.width || !box.height) return null;
  gl.set(el, 'pending');
  const ch = el._ch;
  try {
    const THREE = await import('three');
    const canvas = el._media;
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(box.width, box.height, false);
    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(38, box.width / box.height, 0.05, 500);
    cam.position.set(0, 0.15, ch.camDist || 3.4);
    cam.lookAt(0, 0, 0);
    /* pivot = ce que le défilement anime ; orient = l'orientation figée
       réglée dans l'éditeur, pour redresser un modèle mal exporté */
    const pivot = new THREE.Group();
    const orient = new THREE.Group();
    pivot.add(orient);
    scene.add(pivot);

    if (ch.assetKind === 'gltf' || ch.assetKind === 'obj') {
      const env = ch.env == null ? 0.9 : ch.env;
      scene.add(new THREE.HemisphereLight(0xffffff, 0x404038, 1.6 * env));
      const key = new THREE.DirectionalLight(0xffffff, 1.5 * env);
      key.position.set(3, 5, 4); scene.add(key);
      const rim = new THREE.DirectionalLight(0xcfe0b8, 0.7 * env);
      rim.position.set(-4, 2, -3); scene.add(rim);
      let obj;
      if (ch.assetKind === 'obj') {
        const om = await import('three/addons/loaders/OBJLoader.js');
        obj = await new om.OBJLoader().loadAsync(ch.src);
        /* un OBJ sans matériau arrive noir : on lui en donne un neutre */
        obj.traverse(o => {
          if (o.isMesh && (!o.material || !o.material.color))
            o.material = new THREE.MeshStandardMaterial({ color: 0xd9d6cc, roughness: .75 });
        });
      } else {
        const mod = await import('three/addons/loaders/GLTFLoader.js');
        obj = (await new mod.GLTFLoader().loadAsync(ch.src)).scene;
      }
      const bb = new THREE.Box3().setFromObject(obj);
      const size = bb.getSize(new THREE.Vector3());
      const ctr = bb.getCenter(new THREE.Vector3());
      obj.position.sub(ctr);
      obj.scale.setScalar(1.6 / (Math.max(size.x, size.y, size.z) || 1));
      orient.add(obj);
    } else {
      const GS = await import('gaussian-splats-3d');
      const fmt = { splat: GS.SceneFormat.Splat, ksplat: GS.SceneFormat.KSplat, ply: GS.SceneFormat.Ply }[ch.assetKind];
      /* dynamicScene indique au trieur que la scène bouge : sans lui, l'ordre
         des gaussiennes reste figé sur la pose initiale et la transparence
         se dérègle dès que le modèle tourne. */
      const viewer = new GS.DropInViewer({
        gpuAcceleratedSort: false,
        sharedMemoryForWorkers: false,
        dynamicScene: true,
        renderMode: GS.RenderMode.Always,
        antialiased: true,
        sphericalHarmonicsDegree: 0
      });
      await viewer.addSplatScene(ch.src, {
        format: fmt, showLoadingUI: false, progressiveLoad: false,
        splatAlphaRemovalThreshold: ch.splatAlpha == null ? 5 : ch.splatAlpha
      });
      orient.add(viewer);
    }
    const st = { THREE, renderer, scene, cam, pivot, orient, v: new THREE.Vector3(),
                 ux:0, uy:0, tx:0, ty:0, dz:0, tdz:0 };
    if (ch.orbit !== false) attachOrbit(el, st);
    gl.set(el, st);
    return st;
  } catch (e) {
    console.error('[Récit] 3D non chargée', e);
    gl.set(el, 'failed');
    const p = document.createElement('p');
    p.className = 'loadfail';
    p.textContent = 'Le modèle n\'a pas pu être chargé. Détail dans la console.';
    el.appendChild(p);
    return null;
  }
}

function resize3D() {
  for (const [el, st] of gl) {
    if (!st || typeof st === 'string') continue;
    const b = el.getBoundingClientRect();
    if (!b.width || !b.height) continue;
    st.renderer.setSize(b.width, b.height, false);
    st.cam.aspect = b.width / b.height;
    st.cam.updateProjectionMatrix();
  }
}
addEventListener('resize', resize3D);

/* la géométrie des ornements est en pixels : elle se recalcule au redimensionnement */
let ornT = null;
addEventListener('resize', () => {
  clearTimeout(ornT);
  ornT = setTimeout(() => {
    layers.forEach(el => {
      const r = el.getBoundingClientRect();
      if (!r.width || !r.height) return;
      if (Math.abs(r.width - el._ornW) > 2 || Math.abs(r.height - el._ornH) > 2) {
        buildOrns(el, el._ch);
        request();
      }
    });
  }, 180);
});

/* Le plan répond au curseur : la position dans la séquence suit la souris.
   Filmé en rotation, l'objet se laisse tourner du regard. */
function attachPointerScrub(el, ch) {
  if (el._ptr) return;
  el._ptr = { t: 0, cur: null };
  el.style.touchAction = 'pan-y';
  el.style.cursor = 'ew-resize';
  const read = e => {
    const r = el.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const p = ch.pointerAxis === 'y'
      ? (e.clientY - r.top) / r.height
      : (e.clientX - r.left) / r.width;
    el._ptr.t = Math.max(0, Math.min(1, p));
    request();
  };
  el.addEventListener('pointermove', read);
  el.addEventListener('pointerdown', read);
}

/* Prise en main à la souris, indépendante du défilement : on additionne une
   rotation propre à celle que pilote le scroll, avec une inertie douce.
   Le geste vertical de la page reste possible, seul le glissé est capté. */
function attachOrbit(el, st) {
  let down = false, lx = 0, ly = 0, moved = 0;
  const lim = (el._ch.orbitLimitX || 55) * Math.PI / 180;

  el.style.touchAction = 'pan-y';
  el.style.cursor = 'grab';

  el.addEventListener('pointerdown', e => {
    if (typeof editMode !== 'undefined' && editMode) return;
    down = true; moved = 0; lx = e.clientX; ly = e.clientY;
    el.style.cursor = 'grabbing';
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
  });
  el.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - lx, dy = e.clientY - ly;
    lx = e.clientX; ly = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    st.ty += dx * 0.006;
    st.tx = Math.max(-lim, Math.min(lim, st.tx + dy * 0.005));
    if (moved > 8) e.preventDefault();
    request();
  });
  const end = e => {
    down = false; el.style.cursor = 'grab';
    try { el.releasePointerCapture(e.pointerId); } catch (err) {}
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);

  if (el._ch.orbitZoom !== false) {
    el.addEventListener('wheel', e => {
      /* la molette rapproche le modèle sans bloquer le défilement de la page :
         seul un geste avec Alt, ou un pincement, agit sur la caméra */
      if (!e.altKey && e.deltaMode === 0 && !e.ctrlKey) return;
      e.preventDefault();
      st.tdz = Math.max(-2, Math.min(4, st.tdz + e.deltaY * 0.002));
      request();
    }, { passive: false });
  }
}

/* Une recherche vidéo est asynchrone : en relancer une avant la fin de la
   précédente fait vibrer l'image. On attend donc que la première aboutisse. */
function seekTo(v, t, d) {
  /* la fin d'une recherche relance l'image suivante : sans cela, une cible
     posée pendant qu'une recherche était en cours n'était jamais atteinte
     et la vidéo s'arrêtait à côté de la position voulue */
  if (!v._seekHook) { v._seekHook = true; v.addEventListener('seeked', request); }
  if (v.seeking) return;
  const clamped = Math.max(0, Math.min(d - 0.05, t));
  if (Math.abs(clamped - v.currentTime) < 0.033) return;   /* déjà sur la bonne image */
  try { v.currentTime = clamped; } catch (e) {}
}

/* ---------- boucle ---------- */
let ticking = false, clock = 0, last = performance.now();

function frame(now) {
  /* Le verrou est levé au début de l'image, pas à la fin : sinon toute
     demande faite pendant l'image — lissage de la vidéo défilée ou pilotée
     au curseur, inertie de l'orbite — était ignorée, et le mouvement
     s'arrêtait avant sa cible dès que le geste cessait. */
  ticking = false;
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now; clock += dt;
  const vh = innerHeight, y = scrollY;
  let acc = 0;

  if (railFill) {
    const total = spacer.scrollHeight - vh;
    railFill.style.height = Math.max(0, Math.min(1, total > 0 ? y / total : 0)) * 100 + '%';
  }

  for (let i = 0; i < layers.length; i++) {
    const el = layers[i], ch = el._ch;
    const start = acc, len = (ch.len / 100) * vh;
    acc += len;
    const p = (y - start) / len;

    if (!(p > -0.35 && p < 1.35)) {
      if (el.dataset.on === '1') {
        el.dataset.on = '0';
        el.style.opacity = '0';
        el.style.visibility = 'hidden';
        if (el._media && el._media.pause) el._media.pause();
        el._holdSince = 0;
        (el._ch.beats || []).forEach(b => { if (speaking && speaking.b === b) hush(0.4); });
      }
      continue;
    }

    const cut = stitched(i);
    const h = cut ? 0 : (ch.hold == null ? 12 : ch.hold) / 100;
    let a = 1;
    /* rien ne précède le premier chapitre ni ne suit le dernier : ils ne
       se fondent pas dans le vide, sinon la page s'ouvrirait sur un écran
       noir et se refermerait sur un autre */
    if (h > 0) {
      if (p < h) a = i === 0 ? 1 : p / h;

const IMPORTMAP = {imports:{
  'three':'https://unpkg.com/three@0.160.0/build/three.module.js',
  'three/addons/':'https://unpkg.com/three@0.160.0/examples/jsm/',
  'gaussian-splats-3d':'https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.4.6/build/gaussian-splats-3d.module.js'
}};

/* Les médias en data: coûtent cher à recopier. On garde la dernière charge
   utile et on la réutilise tant que le récit n'a pas changé. */
let payloadCache={key:null,mode:null,value:null};
function storyPayload(mode){
  const key=JSON.stringify(story);
  if(payloadCache.key===key && payloadCache.mode===mode) return payloadCache.value;
  const value=buildPayload(mode);
  payloadCache={key:key,mode:mode,value:value};
  return value;
}
function buildPayload(mode){
  /* aperçu : adresse blob: ; dossier : chemin relatif ; fichier unique :
     data: (seul moyen d'emporter les médias dans un seul fichier) */
  const srcOf = key=>{
    const a=key&&ASSETS.get(key);
    if(!a||mode==='light') return null;
    if(mode==='folder') return 'assets/'+key+'_'+a.name;
    if(mode==='preview') return assetURL(key);
    return assetDataURL(key);
  };
  const chapters = story.chapters.map(ch=>{
    const o=JSON.parse(JSON.stringify(ch));
    const a = ch.asset && ASSETS.get(ch.asset);
    o.assetKind = a ? a.kind : null;
    delete o.asset;
    o.src = srcOf(ch.asset);
    if(o.music){
      o.music.src=srcOf(ch.music&&ch.music.asset);
      delete o.music.asset;
    }
    (o.sfx||[]).forEach((f,fi)=>{
      f.src=srcOf(ch.sfx[fi]&&ch.sfx[fi].asset);
      delete f.asset;
      delete f.prompt;   /* la consigne de génération ne sert qu'à l'éditeur */
    });
    (o.beats||[]).forEach((b,bi)=>{
      b.voiceSrc = srcOf(ch.beats[bi] && ch.beats[bi].voice);
      delete b.voice;
    });
    return o;
  });
  const music = Object.assign({},story.theme && {}, story.music||{});
  music.src = srcOf(music.asset);
  delete music.asset;
  return {title:story.title, theme:story.theme, music:music,
          shapes:allShapes(), chapters:chapters};
}

function buildHTML(mode){
  const S1='<'+'script', S2='<'+'/script>';
  const q=fontQuery(), fs=fontshareQuery();
  return '<!DOCTYPE html>\n<html lang="fr">\n<head>\n'+
'<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n'+
'<title>'+esc(story.title)+'</title>\n'+
(q?'<link rel="preconnect" href="https://fonts.googleapis.com">\n'+
   '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+
   '<link href="https://fonts.googleapis.com/css2?'+q+'" rel="stylesheet">\n':'')+
(fs?'<link href="'+fs+'" rel="stylesheet">\n':'')+
'<style>'+pageCSS(story.theme)+'</style>\n</head>\n<body>\n'+
semanticHTML()+
'<div id="stack"></div>\n<div id="spacer"></div>\n'+
S1+' type="importmap">'+JSON.stringify(IMPORTMAP)+S2+'\n'+
S1+'>window.__STORY__='+JSON.stringify(storyPayload(mode))+';'+S2+'\n'+
S1+' type="module">'+ENGINE+S2+'\n</body>\n</html>';

/* Le récit en texte brut : lisible par les moteurs de recherche et les
   lecteurs d'écran, affiché tel quel si le script ne démarre pas, masqué
   dès que le moteur prend la main. */
function semanticHTML(){
  let h='<main id="texte">\n<h1>'+esc(story.title)+'</h1>\n';
  story.chapters.forEach((ch,i)=>{
    h+='<section>\n<h2>'+esc(ch.name||('Chapitre '+(i+1)))+'</h2>\n';
    (ch.beats||[]).forEach(b=>{
      const tag = b.kind==='title' ? 'h3' : 'p';
      h+='<'+tag+'>'+esc(b.text)+'</'+tag+'>\n';
    });
    (ch.spots||[]).forEach(sp=>{ h+='<p>'+esc(sp.label)+'</p>\n'; });
    h+='</section>\n';
  });
  return h+'</main>\n';
}

/* ---------------------------------------------------------------
   APERÇU
   --------------------------------------------------------------- */
const frame=document.getElementById('frame');
const emptyState=document.getElementById('emptyState');
const stageInfo=document.getElementById('stageInfo');
const liveDot=document.getElementById('liveDot');

function signature(){
  return lightMode+'|'+JSON.stringify(story.theme)+'|'+fontQuery()+fontshareQuery()+'|'+
    story.chapters.map(c=>c.id+':'+c.type+':'+(c.asset||'-')).join(',');
}

/* Le correctif part à la prochaine image plutôt qu'après un délai fixe :
   pendant un glissé de curseur, l'aperçu suit le geste sans décalage. */
let patchRAF=0, lastPatch=0;
function pushPatch(){
  const f=frame.querySelector('iframe');
  if(!f||!f.contentWindow) return;
  if(patchRAF) return;
  liveDot.classList.add('busy');
  patchRAF=requestAnimationFrame(()=>{
    patchRAF=0;
    const now=performance.now();
    /* on n'envoie pas plus d'un correctif toutes les 40 ms : au-delà,
       encoder la charge utile coûterait plus cher que le gain visuel */
    if(now-lastPatch<40){ pushPatch(); return; }
    lastPatch=now;
    try{
      f.contentWindow.postMessage(
        {type:'recit:patch',story:storyPayload(lightMode?'light':'preview')},'*');
      liveDot.classList.remove('busy');
    }catch(e){ console.error(e); }
  });
}

function reloadPreview(){
  clearTimeout(reloadTimer);
  reloadTimer=setTimeout(()=>{
    const old=frame.querySelector('iframe');
    if(old) old.remove();
    if(!story.chapters.length){ emptyState.style.display='block'; stageInfo.textContent=''; return; }
    emptyState.style.display='none';
    let html;
    try{ html=buildHTML(lightMode?'light':'preview'); }
    catch(e){ console.error(e); toast('Aperçu impossible : '+e.message,'bad'); return; }
    const f=document.createElement('iframe');
    f.title='Aperçu du récit';
    f.setAttribute('allow','autoplay');
    f.srcdoc=html;
    f.addEventListener('load',()=>{ if(editMode) post({type:'recit:edit',on:true}); });
    frame.appendChild(f);
    lastSig=signature();
    stageInfo.textContent = lightMode ? 'aperçu léger' : 'en direct';
  },200);
}

function syncPreview(force){
  refreshEditorFonts();
  if(!story.chapters.length){ reloadPreview(); return; }
  const sig=signature();
  if(force||sig!==lastSig){ lastSig=sig; reloadPreview(); }
  else pushPatch();
}

function post(msg){
  const f=frame.querySelector('iframe');
  if(f&&f.contentWindow) f.contentWindow.postMessage(msg,'*');
}
function gotoSelection(){
  const ch=story.chapters.find(c=>c.id===selId);
  if(!ch) return;
  const b=ch.beats.find(x=>x.id===selBeatId);
  post({type:'recit:goto',chapter:ch.id,at:b?b.at:0.2});
}

/* retours de l'aperçu : point posé, texte déplacé, modèle tourné */
let inspTimer=null;
function lazyInspector(){
  clearTimeout(inspTimer);
  inspTimer=setTimeout(()=>renderInspector(),400);   /* on ne redessine pas à chaque pixel */
}
addEventListener('message',e=>{
  const m=e.data; if(!m||!m.type) return;
  if(m.type==='recit:placed'){
    const ch=story.chapters.find(c=>c.id===m.chapter); if(!ch) return;
    ch.spots=ch.spots||[]; ch.spots.push(newSpot(m.p));
    spotSel=ch.spots.length-1;
    placingSpot=false; frame.classList.remove('placing');
    renderAll(); toast('Point posé');
  }
  if(m.type==='recit:zoned'){
    const ch=story.chapters.find(c=>c.id===m.chapter); if(!ch) return;
    const z=(ch.zones||[]).find(x=>x.id===m.id); if(!z) return;
    z.x=m.x; z.y=m.y; z.w=m.w; z.h=m.h; openBeat=z.id;
    pushPatch(); lazyInspector();
  }
  if(m.type==='recit:ornmoved'){
    const ch=story.chapters.find(c=>c.id===m.chapter); if(!ch) return;
    const o=(ch.orns||[]).find(x=>x.id===m.id); if(!o) return;
    o.x=m.posX; o.y=m.posY; openBeat=o.id;
    pushPatch(); lazyInspector();
  }
  if(m.type==='recit:moved'){
    const ch=story.chapters.find(c=>c.id===m.chapter); if(!ch) return;
    const b=ch.beats.find(x=>x.id===m.id); if(!b) return;
    b.posX=m.posX; b.posY=m.posY; selBeatId=b.id;
    pushPatch(); lazyInspector();
  }
  if(m.type==='recit:at'){
    const ch=story.chapters.find(c=>c.id===selId);
    if(timelineHead&&ch&&ch.id===m.chapter)
      timelineHead.style.left=(Math.max(0,Math.min(1,m.at))*100)+'%';
  }
  if(m.type==='recit:rotated'){
    const ch=story.chapters.find(c=>c.id===m.chapter); if(!ch) return;
    ch.rotX=Math.max(-180,Math.min(180,m.rotX));
    ch.rotY=Math.max(-180,Math.min(180,m.rotY));
    pushPatch(); lazyInspector();
  }
});

function renderTemplates(){

  row.innerHTML='';

  head.textContent='Modèles';

  const grid=document.createElement('div');
  grid.style.cssText='display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px';
  TEMPLATES.forEach(t=>{
    const b=document.createElement('button');
    b.className='btn'; b.style.cssText='padding:6px 3px;font-size:11px';
    b.textContent=t.name; b.title=t.tip;
    b.addEventListener('click',()=>{
      const c=newChapter(t.type);

      renderAll(true);
      toast('Modèle « '+t.name+' » ajouté'+(t.type!=='text'?' — il attend son média':''));

  });
  row.appendChild(grid);
}
