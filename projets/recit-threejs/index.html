<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Récit — éditeur d'histoires défilantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="uifonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Archivo:wght@300;400;500;600&display=swap">
<link id="catfonts" rel="stylesheet" href="">
<link id="fsfonts" rel="stylesheet" href="">
<style>
  :root{
    --shell:#14161a; --panel:#1b1e23; --panel-2:#22262c; --line:#2e333b;
    --ink:#e6e4de; --ink-dim:#9aa0a8; --ink-faint:#6b727b;
    --accent:#a8b87f; --accent-dim:#6f7d52; --warn:#d3a05a; --bad:#c46a5b;
    --r:6px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--shell);color:var(--ink);
    font-family:Archivo,system-ui,sans-serif;font-size:13px;
    display:grid;grid-template-rows:auto 1fr;overflow:hidden}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  header{display:flex;align-items:center;gap:12px;padding:0 14px;height:46px;
    background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{font-family:Fraunces,serif;font-size:17px;font-weight:600}
  .brand span{color:var(--accent-dim)}
  .storyname{background:transparent;border:1px solid transparent;border-radius:var(--r);
    padding:5px 8px;width:190px;color:var(--ink-dim)}
  .storyname:hover,.storyname:focus{border-color:var(--line);background:var(--panel-2);color:var(--ink)}
  .spacer{flex:1}
  .btn{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
    padding:6px 11px;color:var(--ink)}
  .btn:hover{border-color:var(--ink-faint)}
  .btn.primary{background:var(--accent-dim);border-color:var(--accent-dim);color:#0f120c;font-weight:500}
  .btn.primary:hover{background:var(--accent)}
  .btn.ghost{background:transparent}
  .btn.on{border-color:var(--accent);color:var(--accent)}
  .grp{display:flex}
  .grp .btn{border-radius:0;margin-left:-1px}
  .grp .btn:first-child{border-radius:var(--r) 0 0 var(--r);margin-left:0}
  .grp .btn:last-child{border-radius:0 var(--r) var(--r) 0}
  .grp .btn:hover,.grp .btn.on{position:relative;z-index:1}

  main{display:grid;grid-template-columns:250px minmax(0,1fr) 384px;min-height:0}
  @media (max-width:1500px){main{grid-template-columns:222px minmax(0,1fr) 352px}}
  .col{min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .col.rail{background:var(--panel);border-right:1px solid var(--line)}
  .col.insp{background:var(--panel);border-left:1px solid var(--line)}
  .colhead{padding:10px 12px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:8px;color:var(--ink-dim)}
  .colhead b{font-weight:500;color:var(--ink);font-size:12px}
  .scroller{overflow-y:auto;flex:1;padding:8px}
  .scroller::-webkit-scrollbar{width:9px}
  .scroller::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}

  .chap{border:1px solid var(--line);border-radius:var(--r);background:var(--panel-2);
    padding:9px 10px;margin-bottom:6px;cursor:grab;position:relative}
  .chap.sel{border-color:var(--accent-dim);box-shadow:inset 2px 0 0 var(--accent)}
  .chap.dragover{border-color:var(--accent);border-style:dashed}
  .chap-t{display:flex;align-items:center;gap:7px}
  .chap-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .kind{font-size:10px;padding:2px 6px;border-radius:3px;color:#0f120c;font-weight:600;flex:none}
  .kind.model{background:#8fa9c4}.kind.video{background:var(--warn)}
  .kind.text{background:var(--accent)}.kind.image{background:#c9a3c4}
  .chap-meta{color:var(--ink-faint);font-size:11px;margin-top:4px}
  .pips{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
  .pip{font-size:9px;line-height:14px;padding:0 4px;border-radius:3px;
    background:var(--shell);color:var(--ink-faint);cursor:help;
    font-variant-numeric:tabular-nums}
  .chap-x{position:absolute;top:6px;right:6px;background:none;border:none;color:var(--ink-faint);
    padding:2px 5px;border-radius:3px;line-height:1;display:none}
  .chap:hover .chap-x{display:block}
  .chap-x:hover{color:var(--bad);background:#00000040}
  .addrow{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px;border-top:1px solid var(--line)}
  .addrow .btn{padding:7px 4px;text-align:center}

  .stage{flex:1;display:flex;flex-direction:column;background:#0a0b0c;min-height:0}
  .stagebar{display:flex;align-items:center;gap:8px;padding:8px 12px;
    border-bottom:1px solid var(--line);background:var(--panel);color:var(--ink-dim)}
  .frame{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:14px;min-height:0}
  iframe{width:100%;height:100%;border:1px solid var(--line);border-radius:8px;background:#000;display:block}
  .frame.phone iframe{width:390px;max-width:100%;flex:none}
  .frame.placing::after{content:'Cliquez sur le modèle dans l\2019 aperçu';
    position:absolute;top:22px;left:50%;transform:translateX(-50%);
    background:var(--accent);color:#0f120c;padding:6px 13px;border-radius:999px;font-size:12px}
  .empty{color:var(--ink-faint);text-align:center;max-width:330px;line-height:1.65}
  .empty b{display:block;color:var(--ink-dim);font-family:Fraunces,serif;font-size:18px;margin-bottom:8px;font-weight:400}
  .live{font-size:11px;display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);transition:.2s}
  .dot.busy{background:var(--warn)}

  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:8px;
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;
    background:var(--panel)}
  .tab{background:var(--shell);border:1px solid var(--line);border-radius:var(--r);
    padding:7px 3px;font-size:11px;color:var(--ink-dim);
    display:flex;align-items:center;justify-content:center;gap:4px}
  .tab:hover{color:var(--ink);border-color:var(--ink-faint)}
  .tab.on{background:var(--panel-2);border-color:var(--accent-dim);color:var(--accent)}
  .tc{background:var(--line);color:var(--ink-dim);border-radius:8px;
    padding:0 5px;font-size:9px;line-height:14px;font-variant-numeric:tabular-nums}
  .tab.on .tc{background:var(--accent-dim);color:#0f120c}
  .field{padding:10px 12px;border-bottom:1px solid var(--line)}
  .field>label{display:block;color:var(--ink-dim);margin-bottom:6px;font-size:11px}
  .in{width:100%;background:var(--shell);border:1px solid var(--line);border-radius:var(--r);padding:7px 8px}
  textarea.in{resize:vertical;min-height:58px;line-height:1.5}
  .in:focus{border-color:var(--accent-dim);outline:none}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .rangerow{display:flex;align-items:center;gap:8px;min-width:0}
  input[type=range]{flex:1 1 auto;accent-color:var(--accent);min-width:0;width:100%}
  .num{min-width:58px;text-align:right;color:var(--ink-dim);
    font-variant-numeric:tabular-nums;flex:0 0 auto;font-size:11px;white-space:nowrap}
  /* dans une grille à deux ou trois colonnes, la valeur passe au-dessus
     du curseur plutôt que de le rogner */
  .two .rangerow,.three .rangerow{flex-wrap:wrap}
  .two .rangerow .num,.three .rangerow .num{width:100%;text-align:left;order:-1;min-width:0}
  .two,.three{min-width:0}
  .two>*,.three>*{min-width:0}
  .field,.beat-body,.group{min-width:0}
  input[type=color]{width:100%;height:28px;padding:2px;background:var(--shell);border:1px solid var(--line);border-radius:var(--r)}
  .check{display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:7px}
  .check input{accent-color:var(--accent);width:15px;height:15px}
  .hint{color:var(--ink-faint);font-size:11px;line-height:1.55;margin-top:6px}
  .filebox{border:1px dashed var(--line);border-radius:var(--r);padding:12px;text-align:center;
    color:var(--ink-faint);cursor:pointer;line-height:1.5}
  .filebox:hover{border-color:var(--accent-dim);color:var(--ink-dim)}
  .filebox.has{border-style:solid;color:var(--ink-dim);text-align:left}

  .beat{border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;background:var(--panel-2);overflow:hidden}
  .beat-h{display:flex;align-items:center;gap:6px;padding:8px 9px;cursor:pointer}
  .beat-h b{flex:1;font-weight:500;font-size:11px;color:var(--ink-dim);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .beat-body{padding:0 9px 9px;display:none;min-width:0}
  .beat.open .beat-body{display:block}
  .beat.open .beat-h{border-bottom:1px solid var(--line);margin-bottom:9px}
  .icobtn{background:none;border:1px solid var(--line);border-radius:4px;color:var(--ink-faint);
    padding:1px 6px;line-height:1.35;font-size:11px}
  .icobtn:hover{color:var(--ink);border-color:var(--ink-faint)}
  .icobtn.del:hover{color:var(--bad)}
  .sub{color:var(--ink-faint);font-size:10px;margin:12px 0 6px;padding-bottom:3px;
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;cursor:pointer}
  .sub .caret{transition:.15s}
  .sub.closed .caret{transform:rotate(-90deg)}
  .group{display:block}
  .group.closed{display:none}
  .mini{display:block;color:var(--ink-faint);font-size:10px;margin-bottom:3px;
    cursor:help;text-decoration:underline dotted transparent;text-underline-offset:2px}
  .mini:hover{color:var(--ink-dim);text-decoration-color:var(--ink-faint)}
  .field>label{cursor:help}

  .chip{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
    padding:7px 9px;margin-bottom:5px}
  .chip[aria-current=true]{border-color:var(--accent-dim);color:var(--accent)}
  .chip .n{font-variant-numeric:tabular-nums;color:var(--ink-faint);font-size:11px}
  .chip .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .shapes{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;
    max-height:150px;overflow:auto;padding:3px;border:1px solid var(--line);border-radius:var(--r)}
  .shp{background:var(--shell);border:1px solid var(--line);border-radius:4px;
    padding:3px;display:grid;place-items:center;color:var(--ink-dim)}
  .shp:hover{border-color:var(--ink-faint);color:var(--ink)}
  .shp.sel{border-color:var(--accent);color:var(--accent)}
  .pairs{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:290px;overflow:auto}
  .pair{border:1px solid var(--line);border-radius:var(--r);background:var(--panel-2);
    padding:9px 10px;text-align:left;display:block}
  .pair:hover{border-color:var(--ink-faint)}
  .pair .pt{font-size:15px;line-height:1.15;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pair .ps{font-size:11px;color:var(--ink-faint);display:block;margin-top:3px}

  .strip{position:relative;border:1px solid var(--line);border-radius:var(--r);
    background:var(--shell);padding:16px 0 6px;overflow:hidden}
  .ruler{position:absolute;top:0;left:0;right:0;height:15px;
    border-bottom:1px solid var(--line)}
  .ruler span{position:absolute;top:2px;font-size:9px;color:var(--ink-faint);
    transform:translateX(-50%);font-variant-numeric:tabular-nums}
  .ruler span:first-child{transform:none}
  .rows{position:relative;padding:4px 0}
  .row{position:relative;height:19px;margin-bottom:3px}
  .bar{position:absolute;top:0;height:19px;min-width:14px;
    background:var(--accent-dim);border-radius:3px;cursor:grab;
    display:flex;align-items:center;overflow:hidden;color:#0f120c}
  .bar.sel{background:var(--accent);box-shadow:0 0 0 1px var(--ink)}
  .bar.spot{background:#8fa9c4;cursor:default;opacity:.75}
  .bar .lab{flex:1;font-size:10px;padding:0 4px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
  .bar .g{width:6px;align-self:stretch;cursor:ew-resize;flex:none;
    background:#0f120c33}
  .playhead{position:absolute;top:15px;bottom:0;width:1px;background:var(--warn);
    pointer-events:none}
  .playhead::before{content:'';position:absolute;top:-4px;left:-3px;
    border:4px solid transparent;border-top-color:var(--warn)}
  .modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:50;padding:20px}
  .modal.on{display:grid}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    width:min(560px,100%);max-height:86vh;overflow:auto}
  .sheet h2{margin:0;padding:16px 18px;border-bottom:1px solid var(--line);
    font-family:Fraunces,serif;font-weight:400;font-size:20px}
  .sheet .body{padding:16px 18px}
  .sheet .foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
  .opt{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:9px;cursor:pointer;
    display:flex;gap:11px;align-items:flex-start}
  .opt:hover{border-color:var(--ink-faint)}
  .opt.sel{border-color:var(--accent-dim);background:#a8b87f0f}
  .opt input{margin-top:3px;accent-color:var(--accent)}
  .opt div b{display:block;margin-bottom:3px;font-weight:500}
  .opt div span{color:var(--ink-faint);line-height:1.55}
  .weight{font-variant-numeric:tabular-nums}
  .weight.ok{color:var(--accent)}.weight.warn{color:var(--warn)}.weight.bad{color:var(--bad)}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
    padding:9px 15px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:70vw}
  .toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<header>
  <div class="brand">Récit<span>.</span></div>
  <input class="storyname" id="storyTitle" value="Herbier d'un jardin" aria-label="Titre du récit">
  <div class="spacer"></div>
  <button class="btn ghost" id="btnTheme">Ambiance</button>
  <div class="grp">
    <button class="btn ghost" id="btnOpen" title="Ouvrir un projet .recit.json">Ouvrir</button>
    <button class="btn ghost" id="btnSave" title="Enregistrer le projet et ses médias">Enregistrer</button>
  </div>
  <button class="btn" id="btnFull" title="Ouvrir la page entière dans un onglet">Prévisualiser</button>
  <button class="btn primary" id="btnExport">Exporter</button>
</header>

<main>
  <div class="col rail">
    <div class="colhead"><b>Chapitres</b><div class="spacer"></div><span id="chapCount">0</span></div>
    <div class="scroller" id="chapList"></div>
    <div class="addrow">
      <button class="btn" data-add="model">Modèle 3D</button>
      <button class="btn" data-add="video">Vidéo</button>
      <button class="btn" data-add="image">Image</button>
      <button class="btn" data-add="text">Texte</button>
    </div>
  </div>

  <div class="col stage">
    <div class="stagebar">
      <div class="grp">
        <button class="btn ghost" id="btnEdit" title="Déplacer les textes à la souris, tourner le modèle, voir les zones cliquables">Ajuster</button>
        <button class="btn ghost" id="btnGoto" title="Amène l'aperçu au texte sélectionné">Aller au texte</button>
      </div>
      <div class="grp">
        <button class="btn ghost" id="btnPhone" title="Basculer en largeur de téléphone">Mobile</button>
        <button class="btn ghost" id="btnLight" title="Remplace les médias par un fond neutre pour un aperçu instantané">Léger</button>
        <button class="btn ghost" id="btnReload" title="Reconstruire l'aperçu de zéro">Recharger</button>
      </div>
      <div class="spacer"></div>
      <div class="live"><span class="dot" id="liveDot"></span><span id="stageInfo">en direct</span></div>
    </div>
    <div class="frame" id="frame">
      <div class="empty" id="emptyState">
        <b>Commencez par un chapitre</b>
        Chaque chapitre occupe l'écran entier pendant que la page défile.
        Ajoutez un modèle, une vidéo ou un panneau de texte, puis placez les
        apparitions de texte le long du défilement.
      </div>
    </div>
  </div>

  <div class="col insp">
    <div class="colhead"><b id="inspTitle">Réglages</b></div>
    <div class="scroller" id="inspBody"></div>
  </div>
</main>

<div class="modal" id="expModal">
  <div class="sheet">
    <h2>Exporter la page</h2>
    <div class="body">
      <label class="opt sel"><input type="radio" name="expmode" value="single" checked>
        <div><b>Fichier HTML unique</b><span>Médias encodés dans le fichier. Un seul fichier à déposer n'importe où. Le poids augmente d'environ un tiers et la page charge tout avant de démarrer.</span></div></label>
      <label class="opt"><input type="radio" name="expmode" value="folder">
        <div><b>Archive ZIP</b><span>index.html et son dossier assets, arborescence conservée, dans une seule archive à déposer telle quelle sur Netlify Drop. Les vidéos se chargent progressivement au lieu d'être toutes téléchargées d'un coup.</span></div></label>
      <div class="hint" id="expWeight"></div>
    </div>
    <div class="foot">
      <button class="btn ghost" id="expCancel">Annuler</button>
      <button class="btn primary" id="expGo">Exporter</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   RÉCIT v4
   - catalogue de polices et accords repris de Motionsmith
   - points chauds repris d'Atelier : clic sur le modèle, tracé SVG
   - aperçu mis à jour en direct par correctif
   ===================================================================== */

const ASSETS = new Map();
let story = blankStory();
let selId = null, selBeatId = null, spotSel = -1;
let phoneView = false, lightMode = false, placingSpot = false;
let lastSig = '', patchTimer = null, reloadTimer = null;

const uid = () => Math.random().toString(36).slice(2,9);

/* ---------------------------------------------------------------
   CATALOGUE DE POLICES — groupes et graisses de Motionsmith

/* n'appelle chez Google que les familles réellement utilisées */
function fontsUsed(){
  const set=new Set([story.theme.display,story.theme.body]);
  story.chapters.forEach(c=>(c.beats||[]).forEach(b=>{ if(b.font) set.add(b.font); }));
  story.chapters.forEach(c=>(c.spots||[]).forEach(s=>{ if(s.font) set.add(s.font); }));
  return [...set].filter(f=>f && SYSTEM_FONTS.indexOf(f)<0 && FONT_INDEX[f]);
}
function fontQuery(list){
  const fams=(list||fontsUsed())
    .filter(f=>!FONTSHARE_SLUG[f])
    .map(f=>FONT_SPEC[f] || (f.replace(/ /g,'+')+':wght@'+(FONT_INDEX[f]||[400]).join(';')));
  return fams.length ? fams.map(x=>'family='+x).join('&')+'&display=swap' : '';
}
/* Fontshare distribue huit des familles du catalogue : Clash Display, Satoshi,
   Switzer, General Sans, Supreme, Zodiak, Sentient et Cabinet Grotesk. */
function fontshareQuery(list){
  const used=(list||fontsUsed()).filter(f=>FONTSHARE_SLUG[f]);
  if(!used.length) return '';
  return 'https://api.fontshare.com/v2/css?'+
    used.map(f=>'f[]='+FONTSHARE_SLUG[f]+'@'+(FONT_INDEX[f]||[400]).join(','))
        .join('&')+'&display=swap';
}
function refreshEditorFonts(){
  const all=Object.keys(FONT_INDEX);
  const href='https://fonts.googleapis.com/css2?'+fontQuery(all);
  const el=document.getElementById('catfonts');
  if(el.getAttribute('href')!==href) el.setAttribute('href',href);
  const fs=fontshareQuery(all);
  const el2=document.getElementById('fsfonts');
  if(el2.getAttribute('href')!==fs) el2.setAttribute('href',fs);
}

/* ---------------- médias ---------------- */
function assetKindOf(name){
  const e = name.toLowerCase().split('.').pop();
  if(e==='glb'||e==='gltf') return 'gltf';
  if(e==='obj') return 'obj';
  if(e==='splat') return 'splat';
  if(e==='ksplat') return 'ksplat';
  if(e==='spz') return 'spz';
  if(e==='ply') return 'ply';
  if(['mp4','webm','mov','m4v','ogv','avi','mkv'].indexOf(e)>=0) return 'video';
  if(['png','jpg','jpeg','webp','avif','gif','bmp','svg'].indexOf(e)>=0) return 'image';
  if(['mp3','m4a','ogg','oga','wav','aac','flac'].indexOf(e)>=0) return 'audio';
  return 'bin';
}
const KIND_OK = {
  video:['video'], image:['image'],
  model:['gltf','obj','splat','ksplat','ply','spz']
};
function mimeOf(name,fallback){
  const e=name.toLowerCase().split('.').pop();
  const m={mp4:'video/mp4',webm:'video/webm',mov:'video/quicktime',m4v:'video/mp4',
    ogv:'video/ogg',avi:'video/x-msvideo',mkv:'video/x-matroska',
    png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp',
    avif:'image/avif',gif:'image/gif',bmp:'image/bmp',svg:'image/svg+xml',
    mp3:'audio/mpeg',m4a:'audio/mp4',ogg:'audio/ogg',oga:'audio/ogg',
    wav:'audio/wav',aac:'audio/aac',flac:'audio/flac',
    glb:'model/gltf-binary',gltf:'model/gltf+json',obj:'text/plain'};
  return m[e] || fallback || 'application/octet-stream';
}
const safeName = n => n.replace(/[^\w.\-]+/g,'_');

function readFile(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=()=>rej(new Error('Lecture impossible : '+file.name));
    r.onload=()=>res(new Uint8Array(r.result));
    r.readAsArrayBuffer(file);
  });
}

async function attachAsset(ch,file){
  try{
    toast('Lecture de '+file.name+'\u2026');
    const bytes = await readFile(file);
    const kind  = assetKindOf(file.name);
    const ok = KIND_OK[ch.type]||[];
    if(ok.indexOf(kind)<0)
      throw new Error('Format non pris en charge ici. Ce chapitre accepte : '+
        (ch.type==='video'?'MP4, MOV, WebM, OGV'
        :ch.type==='image'?'PNG, JPEG, WebP, AVIF, GIF, SVG'
        :'GLB, glTF, OBJ, PLY, splat, ksplat')+'.');
    if(kind==='spz')
      toast('Le format spz n\u2019est pas lu par la bibliothèque de splats : convertissez-le en ply ou ksplat.','bad');
    const key=uid();
    ASSETS.set(key,{ name:safeName(file.name), mime:mimeOf(file.name,file.type), kind, bytes, b64:null });
    if(ch.asset) ASSETS.delete(ch.asset);
    ch.asset=key;
    if(!ch.name || /^(Modèle 3D|Vidéo)$/.test(ch.name))
      ch.name=file.name.replace(/\.[^.]+$/,'').slice(0,32);
    renderAll(true);
    toast(file.name+' — '+fmtBytes(bytes.length));
  }catch(e){ console.error(e); toast(e.message,'bad'); }
}

function totalBytes(){ let t=0; for(const a of ASSETS.values()) t+=a.bytes.length; return t; }
function fmtBytes(b){
  if(b<1024) return b+' o';
  if(b<1048576) return (b/1024).toFixed(0)+' Ko';
  return (b/1048576).toFixed(1)+' Mo';
}
function bytesToB64(bytes){
  let s='', CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(s);
}
function b64ToBytes(b64){
  const s=atob(b64), a=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) a[i]=s.charCodeAt(i);
  return a;
}
function assetDataURL(key){
  const a=ASSETS.get(key); if(!a) return null;
  if(a.b64===null) a.b64=bytesToB64(a.bytes);
  return 'data:'+a.mime+';base64,'+a.b64;
}

function styleBeat(d, b) {
  const st = d.style;
  st.left = b.posX + '%';
  st.top = b.posY + '%';
  st.maxWidth = b.width + 'ch';
  st.fontFamily = quoteFam(b.font);

  st.wordSpacing = (b.wordSpace / 100) + 'em';
  st.lineHeight = b.leading;
  st.textAlign = b.align;
  st.textIndent = (b.indent || 0) + 'em';
  st.fontStyle = b.italic ? 'italic' : 'normal';
  st.textTransform = b.caps === 'none' ? 'none' : b.caps;
  st.opacity = b.opacity;
  st.mixBlendMode = b.blend || 'normal';
  st.setProperty('--dist', b.distance + 'px');
  st.setProperty('--trk', (b.tracking / 100) + 'em');

  if (b.fill === 'gradient') {
    st.backgroundImage = 'linear-gradient(' + b.gradAngle + 'deg,' + b.grad1 + ',' + b.grad2 + ')';
    st.webkitBackgroundClip = 'text';
    st.backgroundClip = 'text';
    st.color = 'transparent';
  } else {
    st.backgroundImage = 'none';
    st.webkitBackgroundClip = 'border-box';
    st.backgroundClip = 'border-box';
    st.color = b.color || '';
  }

  st.webkitTextStrokeWidth = b.strokeW ? (b.strokeW / 100) + 'em' : '0';
  st.webkitTextStrokeColor = b.strokeC;

  const sh = [];
  if (b.shadowBlur || b.shadowX || b.shadowY)
    sh.push(b.shadowX + 'px ' + b.shadowY + 'px ' + b.shadowBlur + 'px ' + b.shadowC);
  if (b.glow > 0) {
    sh.push('0 0 ' + b.glow + 'px ' + b.glowC);
    sh.push('0 0 ' + (b.glow * 2.2) + 'px ' + b.glowC);
  }
  /* néon : quatre halos empilés, comme le mode néon de Motionsmith */
  if (b.neon > 0) {
    const n = b.neon;
    sh.push('0 0 ' + (n * 0.35) + 'px ' + b.neonColor);
    sh.push('0 0 ' + n + 'px ' + b.neonColor);
    sh.push('0 0 ' + (n * 2) + 'px ' + b.neonColor);
    sh.push('0 0 ' + (n * 3.6) + 'px ' + b.neonColor);
  }
  /* décalage RVB : une copie rouge et une cyan de part et d'autre */
  if (b.rgbSplit > 0) {
    sh.push((-b.rgbSplit) + 'px 0 0 rgba(255,0,64,.65)');
    sh.push(b.rgbSplit + 'px 0 0 rgba(0,225,255,.65)');
  }
  st.textShadow = sh.length ? sh.join(',') : 'none';

  if (b.fill === 'glass') {
    /* verre : le texte reste lisible sur une plaque floutée */
    st.background = hexA(b.boxC, b.boxAlpha);
    st.padding = (b.boxPad || .6) + 'em ' + ((b.boxPad || .6) * 1.4) + 'em';
    st.borderRadius = (b.boxRadius || 18) + 'px';
    st.backdropFilter = 'blur(' + (b.boxBlur || 14) + 'px)';
    st.border = '1px solid ' + hexA(b.ink || '#ffffff', .18);
    st.boxShadow = 'none';
  } else if (b.boxOn) {
    st.border = 'none';
    if (b.fill === 'gradient') {
      st.background = 'none';
      st.boxShadow = '0 0 0 ' + b.boxPad + 'em ' + hexA(b.boxC, b.boxAlpha);
      st.padding = '0';
    } else {
      st.background = hexA(b.boxC, b.boxAlpha);
      st.padding = b.boxPad + 'em ' + (b.boxPad * 1.4) + 'em';
      st.boxShadow = 'none';
    }
    st.borderRadius = b.boxRadius + 'px';
    st.backdropFilter = b.boxBlur ? 'blur(' + b.boxBlur + 'px)' : 'none';
  } else {
    st.background = 'none'; st.padding = '0'; st.boxShadow = 'none';
    st.backdropFilter = 'none'; st.borderRadius = '0'; st.border = 'none';
  }

  st.setProperty('--rot', (b.rotate || 0) + 'deg');
  st.setProperty('--skw', (b.skew || 0) + 'deg');
  d.className = 'beat anim-' + b.anim + ' al-' + b.align + (d.dataset.on === '1' ? ' on' : '');
}

function quoteFam(f) { return f ? "'" + f + "', system-ui, sans-serif" : 'var(--f-body)'; }

function hexA(hex, a) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.replace(/(.)/g, '$1$1') : h, 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

function buildUnits(el, b) {
  el.textContent = '';
  const mk = (txt, cls) => {
    const s = document.createElement('span');
    s.className = 'u ' + cls;
    const inner = document.createElement('span');
    inner.className = 'ui';
    inner.textContent = txt;
    s.appendChild(inner);
    return s;
  };
  const parts = [];
  if (b.unit === 'block') parts.push(mk(b.text, 'u-block'));
  else if (b.unit === 'line') b.text.split('\n').forEach(l => parts.push(mk(l || ' ', 'u-line')));
  else if (b.unit === 'word') {
    b.text.split(/(\s+)/).forEach(w => {
      if (!w.trim()) parts.push(document.createTextNode(w));
      else parts.push(mk(w, 'u-word'));
    });
  } else {
    for (const c of b.text) {
      if (c === ' ') parts.push(document.createTextNode(' '));
      else if (c === '\n') parts.push(document.createElement('br'));
      else parts.push(mk(c, 'u-char'));
    }
  }
  const units = [];
  let i = 0;
  parts.forEach(p => {
    el.appendChild(p);
    if (p.nodeType === 1 && p.className && p.className.indexOf('u ') === 0) {
      const d = (b.delay + i * b.stagger) + 'ms';
      p.style.transitionDuration = b.dur + 'ms';
      p.style.transitionTimingFunction = b.ease;
      p.style.transitionDelay = d;
      p.firstChild.style.transitionDuration = b.dur + 'ms';
      p.firstChild.style.transitionTimingFunction = b.ease;
      p.firstChild.style.transitionDelay = d;
      units.push(p);
      i++;
    }
  });
  return units;
}

function buildBeats(el, ch) {
  const wrap = el.querySelector('.beats');
  wrap.textContent = '';
  el._beats = (ch.beats || []).map(b => {
    const d = document.createElement('div');
    d.dataset.on = '0'; d.dataset.id = b.id;
    styleBeat(d, b);
    d._units = buildUnits(d, b);
    wrap.appendChild(d);
    return d;
  });
}

/* ---------- ornements ---------- */
/* Toute la géométrie est calculée en pixels à partir de la taille de la couche.
   Chaque tracé porte pathLength="1" : l'animation devient un simple passage
   de stroke-dashoffset de 1 à 0, indépendant de la longueur réelle. */
function ornGeom(o, W, H) {
  const cx = o.x / 100 * W, cy = o.y / 100 * H;
  const w = o.w / 100 * W, h = o.h / 100 * H;
  const L = cx - w / 2, R = cx + w / 2, T = cy - h / 2, B = cy + h / 2;
  const P = [], F = [], X = [];
  const K = o.kind;
  const shp = (SHAPES || {})[o.shape] || '';

  if (K === 'rule') P.push('M' + L + ' ' + cy + ' L' + R + ' ' + cy);

  if (K === 'doubleRule') {
    P.push('M' + L + ' ' + (cy - o.gap / 2) + ' L' + R + ' ' + (cy - o.gap / 2));
    P.push('M' + L + ' ' + (cy + o.gap / 2) + ' L' + R + ' ' + (cy + o.gap / 2));
  }

  if (K === 'dotRule') {
    P.push('M' + L + ' ' + cy + ' L' + (R - 6) + ' ' + cy);
    F.push({ d: 'M' + R + ' ' + cy + ' m-4 0 a4 4 0 1 0 8 0 a4 4 0 1 0 -8 0', fill: o.color });
  }

  if (K === 'frame' || K === 'mourning') {
    /* un seul tracé continu : le cadre se dessine d'un trait, coin par coin */
    const pts = [[L, T], [R, T], [R, B], [L, B]];
    const st = { tl: 0, tr: 1, br: 2, bl: 3 }[o.corner] || 0;
    let d = '';
    for (let i = 0; i <= 4; i++) {
      const k = (st + (o.sense >= 0 ? i : -i) + 8) % 4;
      d += (i ? ' L' : 'M') + pts[k][0] + ' ' + pts[k][1];
    }
    P.push(d);
  }

  if (K === 'cornerFrame') {
    const c = Math.min(o.inset / 100 * W, w / 2, h / 2);
    P.push('M' + L + ' ' + (T + c) + ' L' + L + ' ' + T + ' L' + (L + c) + ' ' + T);
    P.push('M' + (R - c) + ' ' + T + ' L' + R + ' ' + T + ' L' + R + ' ' + (T + c));
    P.push('M' + R + ' ' + (B - c) + ' L' + R + ' ' + B + ' L' + (R - c) + ' ' + B);
    P.push('M' + (L + c) + ' ' + B + ' L' + L + ' ' + B + ' L' + L + ' ' + (B - c));
  }

  if (K === 'mat') {
    const i2 = o.inset / 100 * Math.min(W, H);
    P.push('M' + L + ' ' + T + ' L' + R + ' ' + T + ' L' + R + ' ' + B + ' L' + L + ' ' + B + ' Z');
    P.push('M' + (L + i2) + ' ' + (T + i2) + ' L' + (R - i2) + ' ' + (T + i2) +
           ' L' + (R - i2) + ' ' + (B - i2) + ' L' + (L + i2) + ' ' + (B - i2) + ' Z');
  }

  if (K === 'cartouche') {
    /* le filet supérieur s'interrompt pour laisser passer un titre */
    const g = Math.max(20, (o.text || '').length * o.size * 9);
    P.push('M' + (cx - g / 2) + ' ' + T + ' L' + L + ' ' + T + ' L' + L + ' ' + B +
           ' L' + R + ' ' + B + ' L' + R + ' ' + T + ' L' + (cx + g / 2) + ' ' + T);
    if (o.text) X.push({ x: cx, y: T + 4, t: o.text, anchor: 'middle' });
  }

  if (K === 'cornerOrn' && shp) {
    const sz = 26 * (o.size || 1);
    [[L, T, 1, 1], [R, T, -1, 1], [R, B, -1, -1], [L, B, 1, -1]].forEach(c => {
      F.push({ d: shp, tx: c[0], ty: c[1], sx: c[2] * sz / 100, sy: c[3] * sz / 100,
               stroke: o.color, fill: 'none' });
    });
    P.push('M' + L + ' ' + T + ' L' + R + ' ' + T + ' L' + R + ' ' + B + ' L' + L + ' ' + B + ' Z');
  }

  if (K === 'stem') {
    /* une tige souple, et des feuilles qui montent le long du tracé */
    const a = w / 2 || 30;
    P.push('M' + cx + ' ' + B + ' C' + (cx + a) + ' ' + (B - h * .3) +
           ' ' + (cx - a) + ' ' + (T + h * .3) + ' ' + cx + ' ' + T);
    const n = Math.max(1, o.count | 0);
    for (let i = 0; i < n; i++) {
      const t = (i + 1) / (n + 1);
      const y = B - h * t;
      const side = i % 2 ? 1 : -1;
      const lw = 14 + 10 * Math.sin(t * Math.PI);
      P.push('M' + cx + ' ' + y +
             ' q' + (side * lw) + ' ' + (-lw * .55) + ' ' + (side * lw * 1.7) + ' ' + (-lw * .1) +
             ' q' + (-side * lw * .8) + ' ' + (lw * .7) + ' ' + (-side * lw * 1.7) + ' ' + (lw * .1));
    }
  }

  if (K === 'tendril') {
    /* spirale logarithmique qui se déroule */
    let d = '', r = Math.min(w, h) / 2;
    for (let i = 0; i <= 90; i++) {
      const t = i / 90, ang = t * Math.PI * 4.2, rad = r * Math.pow(1 - t, 1.4);
      const px = cx + Math.cos(ang) * rad, py = cy + Math.sin(ang) * rad;
      d += (i ? ' L' : 'M') + px.toFixed(1) + ' ' + py.toFixed(1);
    }
    P.push(d);
  }

  if (K === 'branch') {
    const sx = o.corner === 'tr' || o.corner === 'br' ? -1 : 1;
    const sy = o.corner === 'bl' || o.corner === 'br' ? -1 : 1;
    const ox = sx > 0 ? 0 : W, oy = sy > 0 ? 0 : H;
    P.push('M' + ox + ' ' + oy + ' C' + (ox + sx * w * .5) + ' ' + (oy + sy * h * .1) +
           ' ' + (ox + sx * w * .7) + ' ' + (oy + sy * h * .5) + ' ' + (ox + sx * w) + ' ' + (oy + sy * h));
    const n = Math.max(1, o.count | 0);
    for (let i = 1; i <= n; i++) {
      const t = i / (n + 1);
      const px = ox + sx * w * t * 1.05, py = oy + sy * h * t * t;
      const lw = 16 * (1 - t * .5);
      P.push('M' + px + ' ' + py + ' q' + (sx * lw) + ' ' + (-sy * lw) + ' ' + (sx * lw * 1.8) + ' 0');
    }
  }

  if (K === 'shape' && shp) {
    const sz = Math.min(w, h);
    F.push({ d: shp, tx: cx - sz / 2, ty: cy - sz / 2, sx: sz / 100, sy: sz / 100,
             stroke: o.color, fill: 'none' });
  }

  if (K === 'cropMarks') {
    const m = 14;
    [[L, T, 1, 1], [R, T, -1, 1], [R, B, -1, -1], [L, B, 1, -1]].forEach(c => {
      P.push('M' + (c[0] - c[2] * m) + ' ' + c[1] + ' L' + (c[0] + c[2] * m * .35) + ' ' + c[1]);
      P.push('M' + c[0] + ' ' + (c[1] - c[3] * m) + ' L' + c[0] + ' ' + (c[1] + c[3] * m * .35));
    });
  }

  if (K === 'ruler') {
    P.push('M' + cx + ' ' + T + ' L' + cx + ' ' + B);
    const n = Math.max(2, o.count | 0);
    for (let i = 0; i <= n; i++) {
      const y = T + h * i / n;
      const len = i % 5 === 0 ? 11 : 6;
      P.push('M' + cx + ' ' + y + ' L' + (cx + len) + ' ' + y);
    }
  }

  if (K === 'folio' && o.text) X.push({ x: cx, y: cy, t: o.text, anchor: 'middle' });

  if (K === 'dropcap' && o.text) {
    /* la lettrine : une capitale tracée au contour, puis son filet d'appui */
    X.push({ x: cx, y: cy, t: o.text.charAt(0), anchor: 'middle', cap: true });
    if (o.count > 0)
      P.push('M' + (cx - w / 2) + ' ' + (cy + h / 2) + ' L' + (cx + w / 2) + ' ' + (cy + h / 2));
  }

  if (K === 'margin' && o.text)
    X.push({ x: cx, y: cy, t: o.text, anchor: 'middle', rot: o.x > 50 ? 90 : -90 });

  return { P: P, F: F, X: X };
}

function buildOrns(el, ch) {
  let svg = el._owrap;
  if (!svg) {
    svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('class', 'orns');
    el.insertBefore(svg, el.querySelector('.beats'));
    el._owrap = svg;
  }
  svg.textContent = '';
  const r = el.getBoundingClientRect();
  const W = r.width || innerWidth, H = r.height || innerHeight;
  el._ornW = W; el._ornH = H;

  el._orns = (ch.orns || []).map(o => {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'orn orn-' + o.kind);
    g.style.setProperty('--od', o.dur + 'ms');
    g.style.setProperty('--oe', o.ease);
    g.style.setProperty('--oy', o.delay + 'ms');
    g.style.opacity = o.opacity;
    if (o.rot) g.setAttribute('transform',
      'rotate(' + o.rot + ' ' + (o.x / 100 * W) + ' ' + (o.y / 100 * H) + ')');

    /* les surfaces ne se tracent pas : elles se fondent */
    if (o.kind === 'veil' || o.kind === 'band' || o.kind === 'grain' ||
        o.kind === 'vign' || o.kind === 'progress') {
      const rect = document.createElementNS(NS, 'rect');
      if (o.kind === 'veil') {
        rect.setAttribute('x', 0); rect.setAttribute('width', W);
        rect.setAttribute('y', H - o.h / 100 * H); rect.setAttribute('height', o.h / 100 * H);
        rect.setAttribute('fill', 'url(#veil-' + o.id + ')');
        const defs = document.createElementNS(NS, 'defs');
        defs.innerHTML = '<linearGradient id="veil-' + o.id + '" x1="0" y1="1" x2="0" y2="0">' +
          '<stop offset="0" stop-color="' + o.color + '" stop-opacity="1"/>' +
          '<stop offset="1" stop-color="' + o.color + '" stop-opacity="0"/></linearGradient>';
        g.appendChild(defs);
      } else if (o.kind === 'band') {
        rect.setAttribute('x', o.x > 50 ? W - o.w / 100 * W : 0);
        rect.setAttribute('y', 0);
        rect.setAttribute('width', o.w / 100 * W);
        rect.setAttribute('height', H);
        rect.setAttribute('fill', o.color);
        g.classList.add('slide');
      } else if (o.kind === 'grain') {
        rect.setAttribute('x', 0); rect.setAttribute('y', 0);
        rect.setAttribute('width', W); rect.setAttribute('height', H);
        rect.setAttribute('filter', 'url(#grain-' + o.id + ')');
        const defs = document.createElementNS(NS, 'defs');
        defs.innerHTML = '<filter id="grain-' + o.id + '">' +
          '<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/>' +
          '<feColorMatrix type="saturate" values="0"/></filter>';
        g.appendChild(defs);
      } else if (o.kind === 'vign') {
        rect.setAttribute('x', 0); rect.setAttribute('y', 0);
        rect.setAttribute('width', W); rect.setAttribute('height', H);
        rect.setAttribute('fill', 'url(#vig-' + o.id + ')');
        const defs = document.createElementNS(NS, 'defs');
        defs.innerHTML = '<radialGradient id="vig-' + o.id + '">' +
          '<stop offset="0.45" stop-color="' + o.color + '" stop-opacity="0"/>' +
          '<stop offset="1" stop-color="' + o.color + '" stop-opacity="1"/></radialGradient>';
        g.appendChild(defs);
      } else {
        rect.setAttribute('x', (100 - o.w) / 200 * W);
        rect.setAttribute('y', o.y / 100 * H);
        rect.setAttribute('height', Math.max(1, o.width));
        rect.setAttribute('fill', o.color);
        rect.setAttribute('width', 0);
        g._bar = rect; g._barMax = o.w / 100 * W;
      }
      g.appendChild(rect);
      svg.appendChild(g);
      return g;
    }

    const geo = ornGeom(o, W, H);
    geo.P.forEach(d => {
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', d);
      path.setAttribute('pathLength', '1');
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', o.color);
      path.setAttribute('stroke-width', o.kind === 'mourning' ? o.width * 3 : o.width);
      path.setAttribute('stroke-linecap', o.cap || 'round');
      path.setAttribute('stroke-linejoin', 'round');
      /* un pointillé occupe déjà stroke-dasharray, qui sert au tracé :
         ces ornements se révèlent donc en fondu plutôt qu'au trait */
      if (o.dash) {
        path.setAttribute('stroke-dasharray', o.dash + ' ' + (o.dash * 1.6).toFixed(1));
        g.classList.add('dashed');
      }
      g.appendChild(path);
    });
    geo.F.forEach(f => {
      const path = document.createElementNS(NS, 'path');
      path.setAttribute('d', f.d);
      path.setAttribute('pathLength', '1');
      path.setAttribute('fill', f.fill || 'none');
      if (f.stroke) {
        path.setAttribute('stroke', f.stroke);
        path.setAttribute('stroke-width', (o.width / (f.sx || 1)).toFixed(2));
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('stroke-linejoin', 'round');
      }
      if (f.tx != null)
        path.setAttribute('transform',
          'translate(' + f.tx + ' ' + f.ty + ') scale(' + f.sx + ' ' + f.sy + ')');
      g.appendChild(path);
    });
    geo.X.forEach(x => {
      const t = document.createElementNS(NS, 'text');
      t.textContent = x.t;
      t.setAttribute('x', x.x); t.setAttribute('y', x.y);
      t.setAttribute('fill', o.color);
      t.setAttribute('text-anchor', x.anchor || 'start');
      t.setAttribute('dominant-baseline', 'middle');
      t.style.fontFamily = quoteFam(o.font);
      t.style.fontSize = 'calc(' + (x.cap ? o.size * 4 : o.size) + 'rem * var(--fs))';
      t.style.letterSpacing = (o.tracking / 100) + 'em';
      t.style.textTransform = 'uppercase';
      if (x.cap && o.width > 0) {
        /* tracée au contour, elle se dessine comme le reste */
        t.setAttribute('fill', 'none');
        t.setAttribute('stroke', o.color);
        t.setAttribute('stroke-width', o.width);
        t.style.fontFamily = quoteFam(o.font);
      }
      if (x.rot) t.setAttribute('transform', 'rotate(' + x.rot + ' ' + x.x + ' ' + x.y + ')');
      g.appendChild(t);
    });
    svg.appendChild(g);
    return g;
  });
}

/* ---------- boutons de choix ---------- */
const ANCHORS = {
  'top-left':[8,12],'top-center':[50,12],'top-right':[92,12],
  'mid-left':[8,50],'mid-center':[50,50],'mid-right':[92,50],
  'bottom-left':[8,88],'bottom-center':[50,88],'bottom-right':[92,88]
};
function currentIndex() {
  for (let i = 0; i < layers.length; i++) if (layers[i].dataset.on === '1') return i;
  return 0;
}
/* Une destination est soit un chapitre, soit une adresse web. */
function goTo(target, newTab) {
  if (/^(https?:|mailto:|tel:|#|\/)/i.test(target || '')) {
    if (newTab) window.open(target, '_blank', 'noopener');
    else location.href = target;
    return;
  }
  let i = target === 'next' ? currentIndex() + 1 : S.chapters.findIndex(c => c.id === target);
  if (i < 0) i = currentIndex() + 1;
  const n = document.getElementById('anchor-' + i);
  if (n) n.scrollIntoView({ behavior: still ? 'auto' : 'smooth' });
}
function goToChapter(id) { goTo(id); }

function styleButton(el, b) {
  const st = el.style;
  const pos = b.posMode === 'anchor' ? (ANCHORS[b.anchor] || [50, 88]) : [b.posX, b.posY];
  st.left = pos[0] + '%';
  st.top = pos[1] + '%';
  st.fontFamily = quoteFam(b.font);
  st.fontSize = 'calc(' + b.size + 'rem * var(--fs))';
  st.fontWeight = b.weight;
  st.letterSpacing = (b.tracking / 100) + 'em';
  st.textTransform = b.caps === 'none' ? 'none' : b.caps;
  st.color = b.color;
  st.background = hexA(b.bg, b.bgAlpha);
  st.border = b.borderW ? b.borderW + 'px solid ' + b.borderC : 'none';
  st.borderRadius = b.radius + 'px';
  st.padding = b.padY + 'em ' + b.padX + 'em';
  st.backdropFilter = b.blur ? 'blur(' + b.blur + 'px)' : 'none';
  st.boxShadow = b.shadow ? '0 ' + (b.shadow / 3) + 'px ' + b.shadow + 'px ' + hexA(b.shadowC, .5) : 'none';
  st.setProperty('--hbg', b.hoverBg);
  st.setProperty('--hcol', b.hoverColor);
  el.className = 'choice anim-' + (b.anim || 'fade') + (el.dataset.on === '1' ? ' on' : '');
  /* habillage libre : la règle saisie l'emporte sur tout ce qui précède */
  if (b.css) { try { st.cssText += ';' + b.css; } catch (e) {} }
}

function drawSpot(node, sp, x, y) {
  const d = sp.side >= 0 ? 1 : -1;
  const dx = 22 * d, dy = -22;               // la diagonale part toujours vers le haut
  const ex = dx + sp.len * d;
  node.dot.setAttribute('cx', x); node.dot.setAttribute('cy', y);
  node.ring.setAttribute('cx', x); node.ring.setAttribute('cy', y);
  node.line.setAttribute('points',
    x + ',' + y + ' ' + (x + dx) + ',' + (y + dy) + ' ' + (x + ex) + ',' + (y + dy));
  node.txt.setAttribute('x', x + ex + 7 * d);
  node.txt.setAttribute('y', y + dy - 6);
  node.txt.setAttribute('text-anchor', d > 0 ? 'start' : 'end');
}

/* ---------- son ---------- */
/* Les navigateurs refusent tout son avant un geste de l'utilisateur.
   On n'essaie donc rien tant que le portillon n'a pas été franchi. */
let audioOn = false;
let music = null;
let speaking = null;

function hasAudio() {
  if (S.music && S.music.src) return true;
  return S.chapters.some(c =>
    (c.music && c.music.src) ||
    (c.sfx || []).some(f => f.src) ||
    (c.type === 'video' && c.src && c.mute === false) ||
    (c.beats || []).some(b => b.voiceSrc));
}

function buildGate() {
  if (!hasAudio()) return;
  const g = document.createElement('button');
  g.className = 'gate';
  g.innerHTML = '<span class="gi"></span><span>Activer le son</span>';
  g.addEventListener('click', () => {
    audioOn = true;
    g.classList.add('off');
    setTimeout(() => g.remove(), 700);
    setMusic(wantedMusic(), true);
    layers.forEach(el => {
      const ch = el._ch;
      if (el._media && el._media.tagName === 'VIDEO' && ch.mute === false) {
        el._media.muted = false;
        el._media.volume = el.dataset.on === '1' ? (ch.volume == null ? .9 : ch.volume) : 0;
      }
    });
    request();
  });
  document.body.appendChild(g);
  return g;
}

/* ---- musique : une piste par chapitre, enchaînées en fondu ---- */
let musicKey = null, musicVol = 0.35;

function wantedMusic() {
  const el = layers[currentIndex()];
  const ch = el && el._ch;
  const m = ch && ch.music;
  if (m && m.mode === 'silence') return null;
  if (m && m.mode === 'own' && m.src) return { src: m.src, vol: m.volume, fade: m.fade };
  if (S.music && S.music.src) return { src: S.music.src, vol: S.music.volume, fade: S.music.fade };
  return null;
}

function setMusic(next, immediate) {
  const key = next ? next.src : null;
  if (key === musicKey) {
    if (next && music) { musicVol = next.vol; fadeTo(music, next.vol, 0.6); }
    return;
  }
  musicKey = key;
  const old = music;
  if (old) {
    const f = (next && next.fade) || 1.5;
    fadeTo(old, 0, f);
    setTimeout(() => { try { old.pause(); } catch (e) {} }, f * 1000 + 80);
  }
  music = null;
  if (!next) return;
  const a = new Audio(next.src);
  a.loop = true;
  a.volume = immediate ? 0 : 0;
  musicVol = next.vol;
  music = a;
  a.play().then(() => fadeTo(a, next.vol, next.fade || 1.5)).catch(() => {});
}

/* ---- bruitages : en parallèle de la voix, sans atténuer la musique ---- */
function playSfx(f) {
  if (!audioOn || !f.src) return;
  const a = new Audio(f.src);
  a.volume = f.volume == null ? 0.8 : f.volume;
  a.play().catch(() => {});
}

function fadeTo(el, target, secs) {
  if (!el) return;
  const from = el.volume, t0 = performance.now(), d = Math.max(0.05, secs || 1) * 1000;
  (function step(now) {
    const k = Math.min(1, (now - t0) / d);
    try { el.volume = Math.max(0, Math.min(1, from + (target - from) * k)); } catch (e) {}
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

/* La narration baisse la musique pendant qu'elle parle, puis la relève.
   Une seule voix à la fois : entrer dans un nouveau texte coupe la précédente
   en fondu court plutôt que de superposer deux paroles. */
function speak(b) {
  if (!audioOn || !b.voiceSrc) return;
  if (speaking && speaking.b === b) return;
  hush(0.25);
  const a = new Audio(b.voiceSrc);
  /* pleine puissance dès la première syllabe : un fondu d'entrée mangeait
     le début des phrases. Seule la sortie est fondue. */
  a.volume = 1;
  speaking = { a: a, b: b };
  a.play().catch(() => {});
  if (music) fadeTo(music, musicVol * (S.music.duck == null ? .35 : S.music.duck), 0.6);
  a.addEventListener('ended', () => {
    if (speaking && speaking.a === a) { speaking = null; if (music) fadeTo(music, musicVol, 1.2); }
  });
}
function hush(secs) {
  if (!speaking) return;
  const a = speaking.a;
  speaking = null;
  fadeTo(a, 0, secs || 0.4);
  setTimeout(() => { try { a.pause(); } catch (e) {} }, (secs || 0.4) * 1000 + 60);
  if (music) fadeTo(music, musicVol, 1.2);
}

/* ---------- construction complète ---------- */
function mount() {
  root.textContent = '';
  spacer.textContent = '';
  layers = S.chapters.map((ch, i) => {
    const el = document.createElement('section');
    el.className = 'layer layer-' + ch.type;
    el.setAttribute('aria-label', ch.name || 'Chapitre ' + (i + 1));
    if (ch.bg) el.style.background = ch.bg;
    let media = null;

    if (ch.type === 'video' && ch.src) {
      media = document.createElement('video');
      media.dataset.src = ch.src;
      media.playsInline = true;
      media.muted = true;
      media.loop = (ch.playMode === 'scrub' || ch.playMode === 'pointer') ? false : !!ch.loop;
      /* rien n'est téléchargé tant que le chapitre n'approche pas */
      media.preload = 'none';
      media.volume = 0;
      media.tabIndex = -1;
      media.style.objectFit = ch.fit || 'cover';
      el.appendChild(media);
      const v = document.createElement('div');
      v.className = 'veil';
      v.style.opacity = ch.dim || 0;
      el.appendChild(v);
      el._veil = v;
    }
    if (ch.type === 'image' && ch.src) {
      const holder = document.createElement('div');
      holder.className = 'imgwrap';
      media = document.createElement('img');
      media.src = ch.src;
      media.alt = ch.name || '';
      media.decoding = 'async';
      holder.appendChild(media);
      el.appendChild(holder);
      el._holder = holder;
      const vig = document.createElement('div');
      vig.className = 'vignette';
      el.appendChild(vig);
      el._vig = vig;
      const v = document.createElement('div');
      v.className = 'veil';
      v.style.opacity = ch.dim || 0;
      el.appendChild(v);
      el._veil = v;
    }
    if (ch.type === 'model' && ch.src) {
      media = document.createElement('canvas');
      media.className = 'gl';
      el.appendChild(media);
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'spots');
      el.appendChild(svg);
    }

    const wrap = document.createElement('div');
    wrap.className = 'beats';
    el.appendChild(wrap);

    const bwrap = document.createElement('div');
    bwrap.className = 'btns';
    el.appendChild(bwrap);
    el._bwrap = bwrap;
    el._media = media;
    el._ch = ch;
    root.appendChild(el);
    buildBeats(el, ch);
    buildSpots(el, ch);
    buildOrns(el, ch);
    buildZones(el, ch);
    buildButtons(el, ch);
    return el;
  });

  S.chapters.forEach((ch, i) => {
    const a = document.createElement('div');
    a.id = 'anchor-' + i;
    a.style.height = ch.len + 'dvh';
    spacer.appendChild(a);
  });
  applyChapterSettings();
  buildRail();
  buildGate();
  if (semantic) semantic.hidden = true;   /* le texte brut ne sert qu'aux robots et lecteurs d'écran */
}

/* charge la vidéo du chapitre demandé, et seulement celle-là */
function warm(i) {
  const el = layers[i];
  if (!el) return;
  const m = el._media;
  if (m && m.tagName === 'VIDEO' && !m.src && m.dataset.src) {
    m.preload = 'auto';
    m.src = m.dataset.src;
    m.load();
  }
}

/* Raccord : pour enchaîner sans noir entre deux plans, la vidéo suivante doit
   déjà avoir décodé sa première image. On la charge et on l'y positionne. */
function prime(i) {
  const el = layers[i];
  if (!el || el._primed) return;
  const ch = el._ch;
  if (!ch || ch.type !== 'video' || !ch.stitch) return;
  warm(i);
  const m = el._media;
  if (!m || m.tagName !== 'VIDEO') return;
  el._primed = true;
  const seek = () => { try { m.currentTime = 0.001; } catch (e) {} };
  if (m.readyState >= 1) seek();
  else m.addEventListener('loadedmetadata', seek, { once: true });
}

/* le raccord ne vaut que si les deux chapitres sont bien des vidéos */
function stitched(i) {
  const el = layers[i], prev = layers[i - 1];
  if (!el || !prev) return false;
  return !!el._ch.stitch && el._ch.type === 'video' && prev._ch.type === 'video';
}

function styleImage(el, ch) {
  const h = el._holder, im = el._media;
  if (!h || !im) return;
  im.style.objectFit = ch.fit || 'cover';
  h.style.borderRadius = ch.radius + 'px';
  h.style.border = ch.borderW ? ch.borderW + 'px solid ' + ch.borderC : 'none';
  h.style.boxShadow = ch.shadow
    ? '0 ' + (ch.shadow / 3) + 'px ' + ch.shadow + 'px ' + hexA(ch.shadowC, .55) : 'none';
  h.style.inset = ch.frame === 'plein' ? '0' : ch.inset + '%';
  h.style.mixBlendMode = ch.blend || 'normal';
  const f = [];
  if (ch.blur) f.push('blur(' + ch.blur + 'px)');
  if (ch.brightness != 1) f.push('brightness(' + ch.brightness + ')');
  if (ch.contrast != 1) f.push('contrast(' + ch.contrast + ')');
  if (ch.saturate != 1) f.push('saturate(' + ch.saturate + ')');
  if (ch.sepia) f.push('sepia(' + ch.sepia + ')');
  if (ch.grayscale) f.push('grayscale(' + ch.grayscale + ')');
  im.style.filter = f.length ? f.join(' ') : 'none';
  if (el._vig) el._vig.style.opacity = ch.vignette || 0;
}

function applyChapterSettings() {
  layers.forEach((el, i) => {
    const ch = S.chapters[i];
    el._ch = ch;
    if (ch.type === 'image') styleImage(el, ch);
    if (ch.bg) el.style.background = ch.bg;
    if (el._veil) el._veil.style.opacity = ch.dim || 0;
    if (el._media && el._media.tagName === 'VIDEO') {
      el._media.style.objectFit = ch.fit || 'cover';
      const driven = ch.playMode === 'scrub' || ch.playMode === 'pointer';
      el._media.loop = driven ? false : !!ch.loop;
      /* en défilement image par image le son n'a pas de sens : il serait
         haché à chaque saut de position */
      el._media.muted = driven ? true : ch.mute !== false;
    }
    const a = document.getElementById('anchor-' + i);
    if (a) a.style.height = ch.len + 'dvh';
  });
}

function patch(next) {
  S = next;
  window.__STORY__ = next;
  layers.forEach((el, i) => {
    const ch = S.chapters[i];
    if (!ch) return;
    const olds = el._beats;
    const same = olds.length === ch.beats.length &&
      ch.beats.every((b, k) => olds[k].dataset.id === b.id);
    if (!same) buildBeats(el, ch);
    else ch.beats.forEach((b, k) => {
      const d = olds[k];
      styleBeat(d, b);
      const sig = b.text + '|' + b.unit + '|' + b.dur + '|' + b.stagger + '|' + b.ease + '|' + b.delay;
      if (d._sig !== sig) { d._units = buildUnits(d, b); d._sig = sig; }
    });
    if (ch.type === 'model') buildSpots(el, ch);
    buildOrns(el, ch);
    buildZones(el, ch);
    buildButtons(el, ch);
  });
  applyChapterSettings();
  request();
}

/* ---------- dialogue avec l'éditeur ---------- */
addEventListener('message', e => {
  const m = e.data;
  if (!m || typeof m !== 'object') return;
  if (m.type === 'recit:patch') { try { patch(m.story); } catch (err) { console.error('[Récit]', err); } }
  if (m.type === 'recit:place') { placing = m.chapter; document.body.style.cursor = 'crosshair'; }
  if (m.type === 'recit:edit') { editMode = !!m.on; document.body.classList.toggle('editing', editMode); }
  if (m.type === 'recit:cancelPlace') { placing = null; document.body.style.cursor = ''; }
  if (m.type === 'recit:goto') {
    let acc = 0;
    for (let i = 0; i < S.chapters.length; i++) {
      const len = (S.chapters[i].len / 100) * innerHeight;
      if (S.chapters[i].id === m.chapter) { scrollTo({ top: acc + len * (m.at + 0.03), behavior: 'auto' }); break; }
      acc += len;
    }
  }
});

/* ---------- édition directe : déplacer un texte, tourner un modèle ---------- */
let editMode = false, drag = null;

addEventListener('pointerdown', ev => {
  if (!editMode || placing) return;
  const el = layers.find(l => l.dataset.on === '1');
  if (!el) return;
  const rect = el.getBoundingClientRect();

  /* un ornement sous le pointeur : on le déplace en premier */
  const orns = el._orns || [];
  for (let k = orns.length - 1; k >= 0; k--) {
    const node = orns[k];
    if (node.dataset.on !== '1') continue;
    let box;
    try { box = node.getBoundingClientRect(); } catch (err) { continue; }
    if (!box.width && !box.height) continue;
    if (ev.clientX >= box.left && ev.clientX <= box.right &&
        ev.clientY >= box.top && ev.clientY <= box.bottom) {
      drag = { kind: 'orn', el: el, rect: rect, id: el._ch.orns[k].id, chapter: el._ch.id };
      ev.preventDefault();
      return;
    }
  }

  /* un texte visible sous le pointeur : on le déplace */
  const beats = el._beats || [];
  for (let k = beats.length - 1; k >= 0; k--) {
    const node = beats[k];
    if (node.dataset.on !== '1') continue;
    const r = node.getBoundingClientRect();
    if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) {
      drag = { kind: 'beat', el: el, rect: rect, id: el._ch.beats[k].id, chapter: el._ch.id };
      ev.preventDefault();
      return;
    }
  }
  /* sinon, sur un chapitre 3D : on fait tourner le modèle */
  if (el._ch.type === 'model') {
    drag = { kind: 'rot', el: el, chapter: el._ch.id,
             x: ev.clientX, y: ev.clientY,
             rx: el._ch.rotX || 0, ry: el._ch.rotY || 0 };
    ev.preventDefault();
  }
}, true);

addEventListener('pointermove', ev => {
  if (!drag) return;
  if (drag.kind === 'beat' || drag.kind === 'orn') {
    const r = drag.rect;
    parent.postMessage({
      type: drag.kind === 'orn' ? 'recit:ornmoved' : 'recit:moved',
      chapter: drag.chapter, id: drag.id,
      posX: +(((ev.clientX - r.left) / r.width) * 100).toFixed(1),
      posY: +(((ev.clientY - r.top) / r.height) * 100).toFixed(1) }, '*');
  } else {
    parent.postMessage({ type: 'recit:rotated', chapter: drag.chapter,
      rotY: Math.round(drag.ry + (ev.clientX - drag.x) * 0.45),
      rotX: Math.round(drag.rx + (ev.clientY - drag.y) * 0.45) }, '*');
  }
}, true);

addEventListener('pointerup', () => { drag = null; }, true);

/* clic sur le modèle : on renvoie le point dans le repère du pivot */
addEventListener('click', ev => {
  if (!placing) return;
  const el = layers.find(l => l._ch.id === placing);
  const st = el && gl.get(el);
  if (!st || typeof st === 'string') return;
  const THREE = st.THREE;
  const r = el.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    (ev.clientX - r.left) / r.width * 2 - 1,
    -((ev.clientY - r.top) / r.height * 2 - 1));
  const ray = new THREE.Raycaster();
  ray.setFromCamera(ndc, st.cam);
  const hit = ray.intersectObject(st.pivot, true)[0];
  let point;
  if (hit) {
    point = st.pivot.worldToLocal(hit.point.clone());
  } else {
    // pas de maillage (nuage de splats) : on projette sur le plan qui
    // passe par le centre et fait face à la caméra
    const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0)
      .applyMatrix4(st.pivot.matrixWorld);
    const p = new THREE.Vector3();
    if (!ray.ray.intersectPlane(plane, p)) return;
    point = st.pivot.worldToLocal(p);
  }
  placing = null;
  document.body.style.cursor = '';
  parent.postMessage({
    type: 'recit:placed', chapter: el._ch.id,
    p: [+point.x.toFixed(4), +point.y.toFixed(4), +point.z.toFixed(4)]
  }, '*');
}, true);

/* ---------- 3D ---------- */
async function ensure3D(el) {
  if (gl.has(el)) return gl.get(el);
  /* aperçu léger, média absent : il n'y a pas de canvas à peindre */
  if (!el._media || !el._ch.src) return null;
  const box = el.getBoundingClientRect();
  if (!box.width || !box.height) return null;
  gl.set(el, 'pending');
  const ch = el._ch;
  try {
    const THREE = await import('three');
    const canvas = el._media;
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(box.width, box.height, false);
    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(38, box.width / box.height, 0.05, 500);
    cam.position.set(0, 0.15, ch.camDist || 3.4);
    cam.lookAt(0, 0, 0);
    /* pivot = ce que le défilement anime ; orient = l'orientation figée
       réglée dans l'éditeur, pour redresser un modèle mal exporté */
    const pivot = new THREE.Group();
    const orient = new THREE.Group();
    pivot.add(orient);
    scene.add(pivot);

    if (ch.assetKind === 'gltf' || ch.assetKind === 'obj') {
      const env = ch.env == null ? 0.9 : ch.env;
      scene.add(new THREE.HemisphereLight(0xffffff, 0x404038, 1.6 * env));
      const key = new THREE.DirectionalLight(0xffffff, 1.5 * env);
      key.position.set(3, 5, 4); scene.add(key);
      const rim = new THREE.DirectionalLight(0xcfe0b8, 0.7 * env);
      rim.position.set(-4, 2, -3); scene.add(rim);
      let obj;
      if (ch.assetKind === 'obj') {
        const om = await import('three/addons/loaders/OBJLoader.js');
        obj = await new om.OBJLoader().loadAsync(ch.src);
        /* un OBJ sans matériau arrive noir : on lui en donne un neutre */
        obj.traverse(o => {
          if (o.isMesh && (!o.material || !o.material.color))
            o.material = new THREE.MeshStandardMaterial({ color: 0xd9d6cc, roughness: .75 });
        });
      } else {
        const mod = await import('three/addons/loaders/GLTFLoader.js');
        obj = (await new mod.GLTFLoader().loadAsync(ch.src)).scene;
      }
      const bb = new THREE.Box3().setFromObject(obj);
      const size = bb.getSize(new THREE.Vector3());
      const ctr = bb.getCenter(new THREE.Vector3());
      obj.position.sub(ctr);
      obj.scale.setScalar(1.6 / (Math.max(size.x, size.y, size.z) || 1));
      orient.add(obj);
    } else {
      const GS = await import('gaussian-splats-3d');
      const fmt = { splat: GS.SceneFormat.Splat, ksplat: GS.SceneFormat.KSplat, ply: GS.SceneFormat.Ply }[ch.assetKind];
      /* dynamicScene indique au trieur que la scène bouge : sans lui, l'ordre
         des gaussiennes reste figé sur la pose initiale et la transparence
         se dérègle dès que le modèle tourne. */
      const viewer = new GS.DropInViewer({
        gpuAcceleratedSort: false,
        sharedMemoryForWorkers: false,
        dynamicScene: true,
        renderMode: GS.RenderMode.Always,
        antialiased: true,
        sphericalHarmonicsDegree: 0
      });
      await viewer.addSplatScene(ch.src, {
        format: fmt, showLoadingUI: false, progressiveLoad: false,
        splatAlphaRemovalThreshold: ch.splatAlpha == null ? 5 : ch.splatAlpha
      });
      orient.add(viewer);
    }
    const st = { THREE, renderer, scene, cam, pivot, orient, v: new THREE.Vector3(),
                 ux:0, uy:0, tx:0, ty:0, dz:0, tdz:0 };
    if (ch.orbit !== false) attachOrbit(el, st);
    gl.set(el, st);
    return st;
  } catch (e) {
    console.error('[Récit] 3D non chargée', e);
    gl.set(el, 'failed');
    const p = document.createElement('p');
    p.className = 'loadfail';
    p.textContent = 'Le modèle n\'a pas pu être chargé. Détail dans la console.';
    el.appendChild(p);
    return null;
  }
}

function resize3D() {
  for (const [el, st] of gl) {
    if (!st || typeof st === 'string') continue;
    const b = el.getBoundingClientRect();
    if (!b.width || !b.height) continue;
    st.renderer.setSize(b.width, b.height, false);
    st.cam.aspect = b.width / b.height;
    st.cam.updateProjectionMatrix();
  }
}
addEventListener('resize', resize3D);

/* la géométrie des ornements est en pixels : elle se recalcule au redimensionnement */
let ornT = null;
addEventListener('resize', () => {
  clearTimeout(ornT);
  ornT = setTimeout(() => {
    layers.forEach(el => {
      const r = el.getBoundingClientRect();
      if (!r.width || !r.height) return;
      if (Math.abs(r.width - el._ornW) > 2 || Math.abs(r.height - el._ornH) > 2) {
        buildOrns(el, el._ch);
        request();
      }
    });
  }, 180);
});

/* Le plan répond au curseur : la position dans la séquence suit la souris.
   Filmé en rotation, l'objet se laisse tourner du regard. */
function attachPointerScrub(el, ch) {
  if (el._ptr) return;
  el._ptr = { t: 0, cur: null };
  el.style.touchAction = 'pan-y';
  el.style.cursor = 'ew-resize';
  const read = e => {
    const r = el.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const p = ch.pointerAxis === 'y'
      ? (e.clientY - r.top) / r.height
      : (e.clientX - r.left) / r.width;
    el._ptr.t = Math.max(0, Math.min(1, p));
    request();
  };
  el.addEventListener('pointermove', read);
  el.addEventListener('pointerdown', read);
}

/* Prise en main à la souris, indépendante du défilement : on additionne une
   rotation propre à celle que pilote le scroll, avec une inertie douce.
   Le geste vertical de la page reste possible, seul le glissé est capté. */
function attachOrbit(el, st) {
  let down = false, lx = 0, ly = 0, moved = 0;
  const lim = (el._ch.orbitLimitX || 55) * Math.PI / 180;

  el.style.touchAction = 'pan-y';
  el.style.cursor = 'grab';

  el.addEventListener('pointerdown', e => {
    if (typeof editMode !== 'undefined' && editMode) return;
    down = true; moved = 0; lx = e.clientX; ly = e.clientY;
    el.style.cursor = 'grabbing';
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
  });
  el.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - lx, dy = e.clientY - ly;
    lx = e.clientX; ly = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    st.ty += dx * 0.006;
    st.tx = Math.max(-lim, Math.min(lim, st.tx + dy * 0.005));
    if (moved > 8) e.preventDefault();
    request();
  });
  const end = e => {
    down = false; el.style.cursor = 'grab';
    try { el.releasePointerCapture(e.pointerId); } catch (err) {}
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);

  if (el._ch.orbitZoom !== false) {
    el.addEventListener('wheel', e => {
      /* la molette rapproche le modèle sans bloquer le défilement de la page :
         seul un geste avec Alt, ou un pincement, agit sur la caméra */
      if (!e.altKey && e.deltaMode === 0 && !e.ctrlKey) return;
      e.preventDefault();
      st.tdz = Math.max(-2, Math.min(4, st.tdz + e.deltaY * 0.002));
      request();
    }, { passive: false });
  }
}

/* Une recherche vidéo est asynchrone : en relancer une avant la fin de la
   précédente fait vibrer l'image. On attend donc que la première aboutisse. */
function seekTo(v, t, d) {
  if (v.seeking) return;
  const clamped = Math.max(0, Math.min(d - 0.05, t));
  if (Math.abs(clamped - v.currentTime) < 0.033) return;   /* déjà sur la bonne image */
  try { v.currentTime = clamped; } catch (e) {}
}

/* ---------- boucle ---------- */
let ticking = false, clock = 0, last = performance.now();

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now; clock += dt;
  const vh = innerHeight, y = scrollY;
  let acc = 0;

  if (railFill) {
    const total = spacer.scrollHeight - vh;
    railFill.style.height = Math.max(0, Math.min(1, total > 0 ? y / total : 0)) * 100 + '%';
  }

  for (let i = 0; i < layers.length; i++) {
    const el = layers[i], ch = el._ch;
    const start = acc, len = (ch.len / 100) * vh;
    acc += len;
    const p = (y - start) / len;

    if (!(p > -0.35 && p < 1.35)) {
      if (el.dataset.on === '1') {
        el.dataset.on = '0';
        el.style.opacity = '0';
        el.style.visibility = 'hidden';
        if (el._media && el._media.pause) el._media.pause();
        (el._ch.beats || []).forEach(b => { if (speaking && speaking.b === b) hush(0.4); });
      }
      continue;
    }

    const cut = stitched(i);
    const h = cut ? 0 : (ch.hold == null ? 12 : ch.hold) / 100;
    let a = 1;
    if (h > 0) { if (p < h) a = p / h; else if (p > 1 - h) a = (1 - p) / h; }
    a = Math.min(1, Math.max(0, a));

    /* raccord franc : tant que la nouvelle image n'est pas décodée, on garde
       le dernier photogramme du plan précédent plutôt qu'un écran noir */
    if (cut) {
      const ready = el._media && el._media.readyState >= 2;
      if (!ready) {
        a = 0;
        const prev = layers[i - 1];
        prev.style.opacity = '1';
        prev.style.visibility = 'visible';
        prev.dataset.on = '1';
      }
    }

    if (el.dataset.on !== '1') {
      el.dataset.on = '1';
      el.style.visibility = 'visible';
      if (audioOn) setMusic(wantedMusic());
      (ch.sfx || []).forEach(f => { f._done = false; });
      if (el._media && el._media.tagName === 'VIDEO') {
        warm(i);
        if (ch.playMode === 'scrub' || ch.playMode === 'pointer') {
          /* la position est pilotée par le défilement : on ne lit pas */
          try { el._media.pause(); } catch (err) {}
          el._scrub = null;
        } else {
          try { el._media.currentTime = 0; } catch (err) {}
          if (audioOn && ch.mute === false) el._media.muted = false;
          el._media.play().catch(() => {});
        }
      }
      warm(i + 1);            /* le chapitre suivant se prépare, pas les autres */
      prime(i + 1);           /* et sa première image est décodée s'il y a raccord */
      if (ch.type === 'model') ensure3D(el);
    }
    el.style.opacity = a.toFixed(3);
    /* le son de la vidéo suit le fondu de l'image */
    if (el._media && el._media.tagName === 'VIDEO' && audioOn && ch.mute === false)
      try { el._media.volume = a * (ch.volume == null ? .9 : ch.volume); } catch (err) {}
    el.style.zIndex = String(10 + i);
    if (railDots[i]) railDots[i].classList.toggle('here', a > 0.5);

    const q = Math.min(1, Math.max(0, p));

    /* défilement image par image : la position dans la séquence suit le scroll.
       On lisse la cible, sinon chaque à-coup de la molette provoque un saut. */
    if (ch.playMode === 'pointer' && el._media && el._media.readyState >= 1) {
      attachPointerScrub(el, ch);
      const v = el._media, d = v.duration;
      if (d && isFinite(d)) {
        const target = el._ptr.t * d;
        const k = ch.pointerSmooth == null ? 0.22 : ch.pointerSmooth;
        if (el._ptr.cur == null) el._ptr.cur = target;
        else if (ch.pointerLoop !== false) {
          let diff = target - el._ptr.cur;
          if (diff > d / 2) diff -= d; else if (diff < -d / 2) diff += d;
          if (Math.abs(diff) < 0.02) el._ptr.cur = target;
          else el._ptr.cur = (el._ptr.cur + diff * k + d) % d;
        } else {
          const diff = target - el._ptr.cur;
          el._ptr.cur = Math.abs(diff) < 0.02 ? target : el._ptr.cur + diff * k;

        seekTo(v, el._ptr.cur, d);

    if (ch.playMode === 'scrub' && el._media && el._media.readyState >= 1) {

        const k = ch.scrubSmooth == null ? 0.18 : ch.scrubSmooth;
        if (el._scrub == null) el._scrub = target;
        else {
          const diff = target - el._scrub;

             l'approche asymptotique relançait une recherche à chaque image
             et la vidéo oscillait entre deux images-clés */
          el._scrub = Math.abs(diff) < 0.02 ? target : el._scrub + diff * k;

    const sfx = ch.sfx || [];

    const ready = st && typeof st !== 'string';

    if (ready) {
      const spin = still ? 0 : (ch.spin || 0) * clock * 0.0175;
      /* inertie : la vue rejoint doucement la cible fixée par la souris */
      const d = ch.orbitDamp || 0.09;
      st.ux += (st.tx - st.ux) * d;
      st.uy += (st.ty - st.uy) * d;
      st.dz += (st.tdz - st.dz) * d;
      if (Math.abs(st.tx - st.ux) > 0.0005 || Math.abs(st.ty - st.uy) > 0.0005) request();
      st.pivot.rotation.x = st.ux;
      st.pivot.rotation.y = spin + q * (ch.spinScroll || 0) * 0.0175 + st.uy;
      st.pivot.scale.setScalar(Math.max(0.05, (ch.mScale || 1) * (1 - q * (ch.zoomScroll || 0))));
      st.pivot.position.y = (ch.lift || 0) * 0.01 - q * 0.15;
      /* orientation réglée à la main, en degrés */
      st.orient.rotation.set(
        (ch.rotX || 0) * 0.0175, (ch.rotY || 0) * 0.0175, (ch.rotZ || 0) * 0.0175);
      st.orient.position.y = (ch.mOffY || 0) * 0.01;

      if (ch.camPath && ch.camFrom && ch.camTo) {
        /* trajet interpolé : la caméra traverse la scène pendant le défilement */
        const e = ch.camEase === 'linear' ? q
                : ch.camEase === 'inOut' ? (q < .5 ? 2 * q * q : 1 - Math.pow(-2 * q + 2, 2) / 2)
                : 1 - Math.pow(1 - q, 3);
        st.cam.position.set(
          ch.camFrom[0] + (ch.camTo[0] - ch.camFrom[0]) * e,
          ch.camFrom[1] + (ch.camTo[1] - ch.camFrom[1]) * e,
          ch.camFrom[2] + (ch.camTo[2] - ch.camFrom[2]) * e);
      } else {
        st.cam.position.set(0, 0.15, ch.camDist || 3.4);
      }
      st.cam.position.z = Math.max(0.4, st.cam.position.z + st.dz);
      st.cam.lookAt(0, 0, 0);
      st.renderer.render(st.scene, st.cam);

      /* les traits suivent le modèle pendant sa rotation */
      const rect = el.getBoundingClientRect();
      const spots = ch.spots || [];
      for (let k = 0; k < (el._spots || []).length; k++) {
        const sp = spots[k], node = el._spots[k];
        if (!sp) continue;
        st.v.set(sp.p[0], sp.p[1], sp.p[2]).applyMatrix4(st.pivot.matrixWorld).project(st.cam);
        const behind = st.v.z >= 1;
        const on = !behind && q >= sp.at && q <= sp.at + sp.span;
        node.g.setAttribute('class', 'spot' + (on ? ' on' : ''));
        if (on) drawSpot(node, sp,
          (st.v.x * 0.5 + 0.5) * rect.width,
          (-st.v.y * 0.5 + 0.5) * rect.height);
      }
    }

    for (let k = 0; k < el._beats.length; k++) {
      const b = ch.beats[k], node = el._beats[k];
      if (!b) continue;

      /* parallaxe : le bloc dérive à sa propre vitesse pendant le défilement */
      if (b.parallax) node.style.setProperty('--par', (-(q - 0.5) * b.parallax * vh * 0.35) + 'px');
      else node.style.setProperty('--par', '0px');

      const on = b.exit === false ? (q >= b.at) : (q >= b.at && q <= b.at + b.span);
      if (on !== (node.dataset.on === '1')) {
        node.dataset.on = on ? '1' : '0';
        node.classList.toggle('on', on);
        if (on && b.voiceSrc) speak(b);
        else if (!on && speaking && speaking.b === b) hush(0.5);
        const n = node._units.length;
        node._units.forEach((u, k2) => {
          const d = (b.delay + (on ? k2 : n - 1 - k2) * b.stagger) + 'ms';
          u.style.transitionDelay = d;
          u.firstChild.style.transitionDelay = d;

    for (let k = 0; k < (el._orns || []).length; k++) {
      const o = ch.orns[k], node = el._orns[k];
      if (!o) continue;
      const show = q >= o.at && q <= o.at + o.span;
      if (show !== (node.dataset.on === '1')) {
        node.dataset.on = show ? '1' : '0';
        node.classList.toggle('on', show);
      }
      /* la barre de progression suit la position exacte, elle ne se trace pas */
      if (node._bar) {
        const t = Math.max(0, Math.min(1, (q - o.at) / (o.span || 1)));
        node._bar.setAttribute('width', (node._barMax * t).toFixed(1));
      }
    }

    for (let k = 0; k < (el._zones || []).length; k++) {
      const z = ch.zones[k], node = el._zones[k];
      if (!z) continue;
      const show = q >= z.at && q <= z.at + z.span;
      if (show !== (node.dataset.on === '1')) {
        node.dataset.on = show ? '1' : '0';
        node.classList.toggle('on', show);
      }
      node.tabIndex = show ? 0 : -1;
    }

    for (let k = 0; k < (el._btns || []).length; k++) {
      const b = ch.buttons[k], node = el._btns[k];
      if (!b) continue;
      const show = q >= b.at && q <= b.at + b.span;
      if (show !== (node.dataset.on === '1')) {
        node.dataset.on = show ? '1' : '0';
        node.classList.toggle('on', show);

const IMPORTMAP = {imports:{
  'three':'https://unpkg.com/three@0.160.0/build/three.module.js',
  'three/addons/':'https://unpkg.com/three@0.160.0/examples/jsm/',
  'gaussian-splats-3d':'https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.4.6/build/gaussian-splats-3d.module.js'
}};

function storyPayload(mode){
  const chapters = story.chapters.map(ch=>{
    const o=JSON.parse(JSON.stringify(ch));
    const a = ch.asset && ASSETS.get(ch.asset);
    o.assetKind = a ? a.kind : null;
    delete o.asset;
    o.src = (!a || mode==='light') ? null
          : mode==='folder' ? 'assets/'+ch.asset+'_'+a.name
          : assetDataURL(ch.asset);
    if(o.music){
      const mk=ch.music&&ch.music.asset, mv=mk&&ASSETS.get(mk);
      o.music.src=(!mv||mode==='light')?null
        : mode==='folder' ? 'assets/'+mk+'_'+mv.name : assetDataURL(mk);
      delete o.music.asset;
    }
    (o.sfx||[]).forEach((f,fi)=>{
      const kk=ch.sfx[fi]&&ch.sfx[fi].asset, fv=kk&&ASSETS.get(kk);
      f.src=(!fv||mode==='light')?null
        : mode==='folder' ? 'assets/'+kk+'_'+fv.name : assetDataURL(kk);
      delete f.asset;
      delete f.prompt;   /* la consigne de génération ne sert qu'à l'éditeur */
    });
    (o.beats||[]).forEach((b,bi)=>{
      const key = ch.beats[bi] && ch.beats[bi].voice;
      const va = key && ASSETS.get(key);
      b.voiceSrc = (!va||mode==='light') ? null
        : mode==='folder' ? 'assets/'+key+'_'+va.name
        : assetDataURL(key);
      delete b.voice;
    });
    return o;
  });
  const music = Object.assign({},story.theme && {}, story.music||{});
  const ma = music.asset && ASSETS.get(music.asset);
  music.src = (!ma||mode==='light') ? null
    : mode==='folder' ? 'assets/'+music.asset+'_'+ma.name
    : assetDataURL(music.asset);
  delete music.asset;
  return {title:story.title, theme:story.theme, music:music,
          shapes:allShapes(), chapters:chapters};
}

function buildHTML(mode){
  const S1='<'+'script', S2='<'+'/script>';
  const q=fontQuery(), fs=fontshareQuery();
  return '<!DOCTYPE html>\n<html lang="fr">\n<head>\n'+
'<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n'+
'<title>'+esc(story.title)+'</title>\n'+
(q?'<link rel="preconnect" href="https://fonts.googleapis.com">\n'+
   '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'+
   '<link href="https://fonts.googleapis.com/css2?'+q+'" rel="stylesheet">\n':'')+
(fs?'<link href="'+fs+'" rel="stylesheet">\n':'')+
'<style>'+pageCSS(story.theme)+'</style>\n</head>\n<body>\n'+
semanticHTML()+
'<div id="stack"></div>\n<div id="spacer"></div>\n'+
S1+' type="importmap">'+JSON.stringify(IMPORTMAP)+S2+'\n'+
S1+'>window.__STORY__='+JSON.stringify(storyPayload(mode))+';'+S2+'\n'+
S1+' type="module">'+ENGINE+S2+'\n</body>\n</html>';
}

/* Le récit en texte brut : lisible par les moteurs de recherche et les
   lecteurs d'écran, affiché tel quel si le script ne démarre pas, masqué
   dès que le moteur prend la main. */
function semanticHTML(){
  let h='<main id="texte">\n<h1>'+esc(story.title)+'</h1>\n';
  story.chapters.forEach((ch,i)=>{
    h+='<section>\n<h2>'+esc(ch.name||('Chapitre '+(i+1)))+'</h2>\n';
    (ch.beats||[]).forEach(b=>{
      const tag = b.kind==='title' ? 'h3' : 'p';
      h+='<'+tag+'>'+esc(b.text)+'</'+tag+'>\n';
    });
    (ch.spots||[]).forEach(sp=>{ h+='<p>'+esc(sp.label)+'</p>\n'; });
    h+='</section>\n';
  });
  return h+'</main>\n';
}
