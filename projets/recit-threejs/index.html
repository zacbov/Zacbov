    const a=ch.asset&&ASSETS.get(ch.asset);
    const label={model:'3D',video:'VIDÉO',text:'TEXTE',image:'IMAGE'}[ch.type];
    const miss=(ch.type!=='text'&&!a)?' · média manquant':'';
    /* pastilles : ce que le chapitre contient, sans avoir à l'ouvrir */
    const pips=[];
    if(ch.beats.length) pips.push(['T',ch.beats.length,'textes']);
    if((ch.orns||[]).length) pips.push(['O',ch.orns.length,'ornements']);
    if((ch.spots||[]).length) pips.push(['P',ch.spots.length,'points chauds']);
    if((ch.buttons||[]).length) pips.push(['B',ch.buttons.length,'boutons']);
    if((ch.zones||[]).length) pips.push(['Z',ch.zones.length,'zones']);
    if((ch.sfx||[]).length) pips.push(['S',ch.sfx.length,'bruitages']);
    if((ch.beats||[]).some(b=>b.voice)) pips.push(['V','','voix']);
    if(ch.music&&ch.music.mode!=='inherit') pips.push(['M','','musique propre']);
    d.innerHTML='<div class="chap-t"><span class="kind '+ch.type+'">'+label+
      '</span><span class="chap-name"></span></div>'+
      '<div class="chap-meta">'+ch.len+' vh'+miss+'</div>'+
      '<div class="pips"></div><button class="chap-x" title="Supprimer">✕</button>';
    const pw=d.querySelector('.pips');
    pips.forEach(x=>{
      const e2=document.createElement('span'); e2.className='pip';
      e2.textContent=x[0]+(x[1]||'');
      e2.title=(x[1]?x[1]+' ':'')+x[2];
      pw.appendChild(e2);
    });
    d.querySelector('.chap-name').textContent=ch.name||('Chapitre '+(i+1));
    if(miss) d.querySelector('.chap-meta').style.color='var(--warn)';
    d.addEventListener('click',e=>{
      if(e.target.classList.contains('chap-x')) return;
      selId=ch.id; selBeatId=null; spotSel=-1; renderRail(); renderInspector();
    });
    d.querySelector('.chap-x').addEventListener('click',()=>removeChapter(ch.id));
    d.addEventListener('dragstart',()=>{dragId=ch.id;});
    d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('dragover');});
    d.addEventListener('dragleave',()=>d.classList.remove('dragover'));
    d.addEventListener('drop',e=>{
      e.preventDefault(); d.classList.remove('dragover');
      if(!dragId||dragId===ch.id) return;
      const from=story.chapters.findIndex(c=>c.id===dragId);
      const to=story.chapters.findIndex(c=>c.id===ch.id);
      story.chapters.splice(to,0,story.chapters.splice(from,1)[0]);
      renderAll(true);
    });
    chapList.appendChild(d);
  });
}
function removeChapter(id){
  const ch=story.chapters.find(c=>c.id===id);
  if(ch&&ch.asset) dropAsset(ch.asset);
  story.chapters=story.chapters.filter(c=>c.id!==id);
  if(selId===id) selId=story.chapters.length?story.chapters[0].id:null;
  renderAll(true);
}
document.querySelectorAll('[data-add]').forEach(b=>{
  b.addEventListener('click',()=>{
    const ch=newChapter(b.dataset.add);
    story.chapters.push(ch); selId=ch.id; renderAll(true);
  });
});

/* ---------------------------------------------------------------
   INSPECTEUR
   --------------------------------------------------------------- */
const inspBody=document.getElementById('inspBody');
const inspTitle=document.getElementById('inspTitle');
let openBeat=null;      /* un seul bloc déplié à la fois */
let openGroup=null;     /* une seule section dépliée à la fois */
let themeMode=false;

/* L'inspecteur est réparti en quatre onglets : le chapitre et son média,
   ce qu'on y lit, ce qui l'habille, ce sur quoi on peut agir. Rien n'a
   disparu, tout a simplement trouvé sa place. */
const TABS=[
  ['media','Chapitre','Le média, la durée, le son'],
  ['content','Contenu','Les textes et leur frise'],
  ['decor','Décor','Ornements et annotations'],
  ['action','Actions','Boutons et zones cliquables']
];
let insTab='media';

function tabCount(ch,id){
  if(id==='content') return (ch.beats||[]).length;
  if(id==='decor') return (ch.orns||[]).length+(ch.spots||[]).length;
  if(id==='action') return (ch.buttons||[]).length+(ch.zones||[]).length;
  return 0;
}

function renderInspector(){
  /* on retrouve l'endroit où l'on était plutôt que de remonter en haut */
  const keep=inspBody.scrollTop;
  inspBody.innerHTML='';
  requestAnimationFrame(()=>{ inspBody.scrollTop=keep; });
  if(themeMode){ inspTitle.textContent='Ambiance'; guard('Ambiance',()=>buildTheme(inspBody)); return; }
  const ch=story.chapters.find(c=>c.id===selId);
  if(!ch){ inspTitle.textContent='Ambiance'; guard('Ambiance',()=>buildTheme(inspBody)); return; }
  inspTitle.textContent={model:'Modèle 3D',video:'Vidéo',text:'Texte',image:'Image'}[ch.type];

  const bar=document.createElement('div'); bar.className='tabs';
  TABS.forEach(t=>{
    const b=document.createElement('button');
    b.className='tab'+(insTab===t[0]?' on':'');
    b.title=t[2];
    b.appendChild(document.createTextNode(t[1]));
    const n=tabCount(ch,t[0]);
    if(n){ const c=document.createElement('span'); c.className='tc'; c.textContent=n; b.appendChild(c); }
    b.addEventListener('click',()=>{ insTab=t[0]; openBeat=null; openGroup=null; renderInspector(); });
    bar.appendChild(b);
  });
  inspBody.appendChild(bar);

  if(insTab==='media')   guard('Chapitre',()=>buildMediaTab(ch));
  if(insTab==='content'){
    guard('Frise',()=>buildTimeline(inspBody,ch));
    guard('Textes',()=>buildBeatPanel(inspBody,ch));
  }
  if(insTab==='decor'){
    guard('Ornements',()=>buildOrnPanel(inspBody,ch));
    if(ch.type==='model') guard('Points chauds',()=>buildSpotPanel(inspBody,ch));
  }
  if(insTab==='action'){
    guard('Boutons',()=>buildButtonPanel(inspBody,ch));
    if(ch.type!=='text') guard('Zones cliquables',()=>buildZonePanel(inspBody,ch));
  }
}

/* Si un panneau échoue, on le dit à sa place et le reste reste utilisable,
   au lieu d'un inspecteur vide et d'une erreur sans contexte. */
function guard(name,fn){
  try{ fn(); }
  catch(e){
    console.error('[Récit] panneau « '+name+' »',e);
    const d=document.createElement('div'); d.className='hint';
    d.style.cssText='color:var(--bad);padding:10px 12px';
    d.textContent='Le panneau « '+name+' » n\u2019a pas pu s\u2019afficher : '+e.message+
      '. Le reste du projet est intact.';
    inspBody.appendChild(d);
  }
}

function buildAsset(parent,ch){
  const wrap=document.createElement('div');
  const a=ch.asset&&ASSETS.get(ch.asset);
  const box=document.createElement('div');
  box.className='filebox'+(a?' has':''); box.tabIndex=0;
  box.textContent=a ? a.name+' — '+fmtBytes(a.bytes.length)
    : (ch.type==='video'?'Choisir une vidéo (MP4, MOV, WebM, OGV)'
      :ch.type==='image'?'Choisir une image (PNG, JPEG, WebP, AVIF, GIF, SVG)'
      :'Choisir un fichier 3D (GLB, glTF, OBJ, PLY, splat, ksplat)');
  const inp=document.createElement('input'); inp.type='file'; inp.hidden=true;
  inp.accept = ch.type==='video' ? 'video/*,.webm,.mp4,.mov,.m4v,.ogv'
             : ch.type==='image' ? 'image/*,.png,.jpg,.jpeg,.webp,.avif,.gif,.svg'
             : '.glb,.gltf,.obj,.splat,.ksplat,.ply,.spz';
  const pick=()=>inp.click();
  box.addEventListener('click',pick);
  box.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();} });
  box.addEventListener('dragover',e=>{e.preventDefault();box.style.borderColor='var(--accent)';});
  box.addEventListener('dragleave',()=>{box.style.borderColor='';});
  box.addEventListener('drop',e=>{
    e.preventDefault(); box.style.borderColor='';
    if(e.dataTransfer.files[0]) attachAsset(ch,e.dataTransfer.files[0]);
  });
  inp.addEventListener('change',()=>{ if(inp.files[0]) attachAsset(ch,inp.files[0]); });
  wrap.appendChild(box); wrap.appendChild(inp);
  if(ch.type==='video' && a){
    const conv=document.createElement('div');
    const driven = ch.playMode==='scrub'||ch.playMode==='pointer';
    const forScrub = convOpts.usage==='scrub' || (convOpts.usage==='auto' && driven);
    const dg=videoDiag(ch.asset,driven);
    if(dg) conv.appendChild(dg);
    const btn=document.createElement('button');
    btn.className='btn'; btn.style.width='100%'; btn.style.marginTop='7px';
    btn.textContent = forScrub ? 'Préparer pour le défilement (WebM)'
      : a.mime==='video/webm' ? 'Réencoder en WebM' : 'Convertir en WebM';
    btn.disabled=!webcodecsSupport()||convBusy;
    btn.addEventListener('click',()=>convertChapterVideo(ch));
    conv.appendChild(btn);
    const us=labelled('Usage',select(convOpts,'usage',
      [['auto','Selon le mode de lecture choisi'],
       ['scrub','Défilement ou curseur — images-clés serrées'],
       ['play','Lecture normale — fichier le plus léger']]));
    us.style.marginTop='7px';
    conv.appendChild(us);
    const o=document.createElement('div'); o.className='two';
    o.appendChild(labelled('Largeur maximale',select(convOpts,'maxW',
      [[3840,'3840 px'],[1920,'1920 px'],[1280,'1280 px'],[854,'854 px']])));
    o.appendChild(labelled('Débit vidéo',select(convOpts,'mbps',
      [[6,'6 Mb/s (fin)'],[3.5,'3,5 Mb/s'],[2.2,'2,2 Mb/s (moyen)'],[1.2,'1,2 Mb/s (léger)'],[0.6,'0,6 Mb/s (mini)']])));
    conv.appendChild(o);
    if(!forScrub) conv.appendChild(check(convOpts,'keepAudio','Conserver le son'));
    const hh=document.createElement('div'); hh.className='hint';
    hh.textContent = !webcodecsSupport()
      ? 'Ce navigateur ne sait pas encoder la vidéo image par image. Utilisez Chrome ou Edge.'
      : forScrub
      ? 'Chaque image est conservée et une image-clé est placée toutes les 6 : la vidéo suit le geste sans à-coup. Le fichier est plus lourd, c’est le prix de la fluidité. La vidéo est lue une fois pendant l’encodage : gardez l’onglet au premier plan.'
      : 'La vidéo est lue une fois pendant l’encodage : gardez l’onglet au premier plan.';
    conv.appendChild(hh);
    wrap.appendChild(conv);
  }
  field(parent, ch.type==='video'?'Fichier':ch.type==='image'?'Fichier':'Fichier', wrap,
    ch.type==='video' ? 'MP4, MOV, WebM et OGV sont acceptés. Le bouton ci-dessous allège les fichiers lourds.'
    : ch.type==='image' ? 'Le WebP et l\u2019AVIF pèsent bien moins qu\u2019un JPEG à qualité égale.'
    : 'Les splats sont triés à chaque image pour que la transparence reste juste pendant la rotation.');
}

/* ---- points chauds ---- */
function buildSpotPanel(parent,ch){
  const host=document.createElement('div'); host.className='field';
  host.innerHTML='<label>Points chauds</label>';
  const btn=document.createElement('button');
  btn.className='btn'+(placingSpot?' on':''); btn.style.width='100%';
  btn.textContent=placingSpot?'Annuler le placement':'Placer un point — cliquer sur le modèle';
  btn.addEventListener('click',()=>{
    placingSpot=!placingSpot;
    frame.classList.toggle('placing',placingSpot);
    post({type:placingSpot?'recit:place':'recit:cancelPlace',chapter:ch.id});
    renderInspector();
  });
  host.appendChild(btn);

  const list=document.createElement('div'); list.style.marginTop='8px';
  (ch.spots||[]).forEach((sp,i)=>{
    const b=document.createElement('button');
    b.className='chip'; b.setAttribute('aria-current',String(i===spotSel));
    b.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span><span class="t"></span>';
    b.querySelector('.t').textContent=sp.label||'Sans texte';
    b.addEventListener('click',()=>{ spotSel=i; renderInspector(); });
    list.appendChild(b);
  });
  host.appendChild(list);

  const sp=(ch.spots||[])[spotSel];
  if(sp){
    const ed=document.createElement('div');
    ed.style.cssText='border:1px solid var(--line);border-radius:var(--r);padding:9px;margin-top:6px';
    ed.appendChild(labelled('Texte',txt(sp,'label')));
    const g1=document.createElement('div'); g1.className='two';
    g1.appendChild(labelled('Côté',select(sp,'side',[[1,'Vers la droite'],[-1,'Vers la gauche']])));
    g1.appendChild(labelled('Couleur',color(sp,'color')));
    ed.appendChild(g1);
    ed.appendChild(labelled('Longueur du trait',range(sp,'len',20,300,2,v=>v+' px')));
    ed.appendChild(labelled('Police',fontSelect(sp,'font')));
    const g2=document.createElement('div'); g2.className='two';
    g2.appendChild(labelled('Taille',range(sp,'size',0.5,3,0.05,v=>v.toFixed(2)+' rem')));
    g2.appendChild(labelled('Graisse',weightSelect(sp,'weight','font')));
    ed.appendChild(g2);
    const g3=document.createElement('div'); g3.className='two';
    g3.appendChild(labelled('Interlettrage',range(sp,'tracking',-8,40,1,v=>v+' /100 em')));
    g3.appendChild(labelled('Casse',select(sp,'caps',[['none','Telle quelle'],['uppercase','Capitales'],['lowercase','Bas de casse']])));
    ed.appendChild(g3);
    ed.appendChild(labelled('Apparaît à',range(sp,'at',0,0.95,0.01,v=>Math.round(v*100)+' %')));
    ed.appendChild(labelled('Reste visible',range(sp,'span',0.05,1,0.01,v=>Math.round(v*100)+' %')));
    const del=document.createElement('button');
    del.className='btn'; del.style.width='100%'; del.style.marginTop='8px';
    del.textContent='Supprimer ce point';
    del.addEventListener('click',()=>{
      ch.spots.splice(spotSel,1);
      spotSel=Math.min(spotSel,ch.spots.length-1);
      renderAll();
    });
    ed.appendChild(del);
    host.appendChild(ed);
  }
  const h=document.createElement('div'); h.className='hint';
  h.textContent='Le trait suit le modèle quand il tourne, et disparaît quand le point passe derrière.';
  host.appendChild(h);
  parent.appendChild(host);
}

/* ---- frise : chaque texte est un bandeau déplaçable et redimensionnable ---- */
function buildTimeline(parent,ch){
  const host=document.createElement('div'); host.className='field';
  host.innerHTML='<label>Frise du chapitre</label>';
  const strip=document.createElement('div'); strip.className='strip';

  const ruler=document.createElement('div'); ruler.className='ruler';
  for(let k=0;k<=4;k++){
    const t=document.createElement('span'); t.style.left=(k*25)+'%';
    t.textContent=(k*25)+'%'; ruler.appendChild(t);
  }
  strip.appendChild(ruler);

  const rows=document.createElement('div'); rows.className='rows';
  ch.beats.forEach((b,i)=>{
    const row=document.createElement('div'); row.className='row';
    const bar=document.createElement('div');
    bar.className='bar'+(b.id===selBeatId?' sel':'');
    bar.style.left=(b.at*100)+'%';
    bar.style.width=(Math.min(1-b.at,b.span)*100)+'%';
    bar.title=b.text.slice(0,40);
    const lab=document.createElement('span'); lab.className='lab';
    lab.textContent=(b.text||'(vide)').slice(0,22);
    const gL=document.createElement('i'); gL.className='g l';
    const gR=document.createElement('i'); gR.className='g r';
    bar.appendChild(gL); bar.appendChild(lab); bar.appendChild(gR);

    const startDrag=(mode)=>ev=>{
      ev.preventDefault(); ev.stopPropagation();
      selBeatId=b.id;
      const box=rows.getBoundingClientRect();
      const at0=b.at, sp0=b.span, x0=ev.clientX;
      const move=e=>{
        const d=(e.clientX-x0)/box.width;
        if(mode==='move'){
          b.at=Math.max(0,Math.min(0.98,at0+d));
        }else if(mode==='left'){
          const na=Math.max(0,Math.min(at0+sp0-0.03,at0+d));
          b.span=+(sp0+(at0-na)).toFixed(3); b.at=+na.toFixed(3);
        }else{
          b.span=Math.max(0.03,Math.min(1-b.at,sp0+d));
        }
        bar.style.left=(b.at*100)+'%';
        bar.style.width=(Math.min(1-b.at,b.span)*100)+'%';
        syncPreview();
      };
      const up=()=>{
        removeEventListener('pointermove',move);
        removeEventListener('pointerup',up);
        renderAll();
      };
      addEventListener('pointermove',move);
      addEventListener('pointerup',up);
    };
    bar.addEventListener('pointerdown',startDrag('move'));
    gL.addEventListener('pointerdown',startDrag('left'));
    gR.addEventListener('pointerdown',startDrag('right'));
    bar.addEventListener('dblclick',()=>{
      openBeat=b.id; selBeatId=b.id; renderInspector();
    });
    row.appendChild(bar); rows.appendChild(row);
  });

  /* les points chauds partagent la même échelle */
  (ch.spots||[]).forEach(sp=>{
    const row=document.createElement('div'); row.className='row';
    const bar=document.createElement('div'); bar.className='bar spot';
    bar.style.left=(sp.at*100)+'%';
    bar.style.width=(Math.min(1-sp.at,sp.span)*100)+'%';
    const lab=document.createElement('span'); lab.className='lab';
    lab.textContent='◆ '+(sp.label||'').slice(0,18);
    bar.appendChild(lab); row.appendChild(bar); rows.appendChild(row);
  });

  strip.appendChild(rows);
  const head=document.createElement('div'); head.className='playhead'; head.style.left='0%';
  strip.appendChild(head);
  strip._head=head;
  timelineHead=head;

  strip.addEventListener('click',ev=>{
    if(ev.target.closest('.bar')) return;
    const r=rows.getBoundingClientRect();
    const at=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width));
    head.style.left=(at*100)+'%';
    post({type:'recit:goto',chapter:ch.id,at:at-0.03});
  });

  host.appendChild(strip);
  const h=document.createElement('div'); h.className='hint';
  h.textContent='Glissez un bandeau pour déplacer le texte, ses bords pour régler sa durée. Cliquez dans la frise pour y amener l\u2019aperçu.';
  host.appendChild(h);
  parent.appendChild(host);
}

    hg.appendChild(labelled('Angle de trame',range(ch,'halftoneAngle',0,90,1,v=>v+' °')));

  }
  g.appendChild(labelled('Grain',range(ch,'grain',0,0.6,0.02,v=>Math.round(v*100)+' %')));

/* ---- ornements ---- */
function shapePreview(d,color,size){
  const NSU='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NSU,'svg');
  svg.setAttribute('viewBox','0 0 100 100');
  svg.setAttribute('width',size||30); svg.setAttribute('height',size||30);
  const path=document.createElementNS(NSU,'path');
  path.setAttribute('d',d); path.setAttribute('fill','none');
  path.setAttribute('stroke',color||'currentColor');
  path.setAttribute('stroke-width','4');
  path.setAttribute('stroke-linecap','round');
  path.setAttribute('stroke-linejoin','round');
  svg.appendChild(path); return svg;
}

function shapePicker(obj,key){
  const wrap=document.createElement('div'); wrap.className='shapes';
  const lib=allShapes();
  Object.keys(lib).forEach(name=>{
    const b=document.createElement('button');
    b.className='shp'+(obj[key]===name?' sel':'');
    b.title=name;
    b.appendChild(shapePreview(lib[name],'currentColor',26));
    b.addEventListener('click',()=>{ obj[key]=name; renderInspector(); syncPreview(); });
    wrap.appendChild(b);
  });
  return wrap;
}

/* ---- son du chapitre : musique propre et bruitages ---- */
function buildChapterSound(parent,ch){
  ch.music=ch.music||{mode:'inherit',asset:null,volume:0.35,fade:2};
  ch.sfx=ch.sfx||[];
  const host=document.createElement('div'); host.className='field';
  host.innerHTML='<label>Son du chapitre</label>';

  const M=ch.music;
  host.appendChild(labelled('Musique',select(M,'mode',
    [['inherit','Garder celle du récit'],['own','Une musique propre'],['silence','Silence']])));

  if(M.mode==='own'){
    const ma=M.asset&&ASSETS.get(M.asset);
    const box=document.createElement('div');
    box.className='filebox'+(ma?' has':''); box.tabIndex=0;
    box.textContent=ma?ma.name+' — '+fmtBytes(ma.bytes.length):'Choisir un fichier audio';
    const inp=document.createElement('input'); inp.type='file'; inp.hidden=true;
    inp.accept='audio/*,.mp3,.m4a,.ogg,.wav';
    const take=async f=>{
      try{
        const bytes=await readFile(f); const key=uid();
        ASSETS.set(key,{name:safeName(f.name),mime:mimeOf(f.name,f.type),kind:'audio',bytes:bytes,b64:null});
        if(M.asset) dropAsset(M.asset);
        M.asset=key; renderAll(true); toast(f.name+' — '+fmtBytes(bytes.length));
      }catch(e){ toast(e.message,'bad'); }
    };
    box.addEventListener('click',()=>inp.click());
    box.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();inp.click();} });
    box.addEventListener('dragover',e=>{e.preventDefault();box.style.borderColor='var(--accent)';});
    box.addEventListener('dragleave',()=>{box.style.borderColor='';});
    box.addEventListener('drop',e=>{e.preventDefault();box.style.borderColor='';
      if(e.dataTransfer.files[0]) take(e.dataTransfer.files[0]);});
    inp.addEventListener('change',()=>{ if(inp.files[0]) take(inp.files[0]); });
    host.appendChild(box); host.appendChild(inp);
    if(ma){
      host.appendChild(labelled('Volume',range(M,'volume',0,1,0.05,v=>Math.round(v*100)+' %')));
      host.appendChild(labelled('Fondu enchaîné',range(M,'fade',0.3,8,0.1,v=>v.toFixed(1)+' s')));
      const rm=document.createElement('button'); rm.className='btn'; rm.style.width='100%';
      rm.textContent='Retirer cette musique';
      rm.addEventListener('click',()=>{ dropAsset(M.asset); M.asset=null; renderAll(true); });
      host.appendChild(rm);
    }
  }else if(M.mode==='silence'){
    const h=document.createElement('div'); h.className='hint';
    h.textContent='La musique s\u2019efface en fondu à l\u2019entrée du chapitre et revient au suivant.';
    host.appendChild(h);
  }

  /* bruitages */
  const sub2=document.createElement('div'); sub2.className='sub'; sub2.style.cursor='default';
  sub2.textContent='Bruitages';
  host.appendChild(sub2);

  ch.sfx.forEach((f,i)=>{
    const card=document.createElement('div'); card.className='beat open';
    const h=document.createElement('div'); h.className='beat-h';
    const lbl=document.createElement('b');
    lbl.textContent=(f.label||f.prompt||'Bruitage '+(i+1)).slice(0,24);
    h.appendChild(lbl);
    const del=icon('✕','Supprimer',()=>{
      if(f.asset) dropAsset(f.asset);
      ch.sfx.splice(i,1); renderAll(true);
    });
    del.classList.add('del'); h.appendChild(del);
    card.appendChild(h);

    const body=document.createElement('div'); body.className='beat-body';
    const ta=document.createElement('textarea');
    ta.className='in'; ta.rows=2; ta.value=f.prompt||'';
    ta.placeholder='froissement de feuilles sèches, très proche';
    ta.addEventListener('input',()=>{ f.prompt=ta.value; lbl.textContent=(ta.value||'Bruitage').slice(0,24); });
    body.appendChild(labelled('Description du son',ta));

    const r=document.createElement('div'); r.className='two';
    r.appendChild(labelled('Durée',range(f,'duration',0.5,22,0.5,v=>v.toFixed(1)+' s')));
    r.appendChild(labelled('Fidélité à la description',range(f,'influence',0,1,0.05,v=>Math.round(v*100)+' %')));
    body.appendChild(r);

    const fa=f.asset&&ASSETS.get(f.asset);
    const row=document.createElement('div'); row.className='two';
    const gen=document.createElement('button'); gen.className='btn';
    gen.textContent=fa?'Refaire':'Générer';
    gen.addEventListener('click',()=>generateSfx(ch,f));
    const play=document.createElement('button'); play.className='btn';
    play.textContent='Écouter'; play.disabled=!fa;
    play.addEventListener('click',()=>{ new Audio(assetURL(f.asset)).play().catch(()=>{}); });
    row.appendChild(gen); row.appendChild(play);
    body.appendChild(row);

    const imp=document.createElement('input'); imp.type='file'; imp.hidden=true;
    imp.accept='audio/*';
    imp.addEventListener('change',async()=>{
      const file=imp.files[0]; if(!file) return;
      try{
        const bytes=await readFile(file); const key=uid();
        ASSETS.set(key,{name:safeName(file.name),mime:mimeOf(file.name,file.type),kind:'audio',bytes:bytes,b64:null});
        if(f.asset) dropAsset(f.asset);
        f.asset=key; if(!f.label) f.label=file.name;
        renderAll(true);
      }catch(e){ toast(e.message,'bad'); }
    });
    const impb=document.createElement('button'); impb.className='btn';
    impb.style.width='100%'; impb.style.marginTop='6px';
    impb.textContent='Ou importer un fichier';
    impb.addEventListener('click',()=>imp.click());
    body.appendChild(impb); body.appendChild(imp);

    body.appendChild(labelled('Déclenché à',range(f,'at',0,0.98,0.01,v=>Math.round(v*100)+' %')));
    body.appendChild(labelled('Volume',range(f,'volume',0,1,0.05,v=>Math.round(v*100)+' %')));
    if(fa){
      const hh=document.createElement('div'); hh.className='hint';
      hh.textContent=fmtBytes(fa.bytes.length)+' · joué en parallèle de la voix, sans faire baisser la musique.';
      body.appendChild(hh);
    }
    card.appendChild(body);
    host.appendChild(card);
  });

  const add=document.createElement('button');
  add.className='btn'; add.style.width='100%';
  add.textContent='Ajouter un bruitage';
  add.addEventListener('click',()=>{ ch.sfx.push(newSfx()); renderInspector(); });
  host.appendChild(add);
  parent.appendChild(host);
}

/* ---- boutons de choix ---- */
function buildButtonPanel(parent,ch){
  ch.buttons=ch.buttons||[];
  const host=document.createElement('div'); host.className='field';
  host.innerHTML='<label>Boutons</label>';
  const list=document.createElement('div');

  ch.buttons.forEach((b,i)=>{
    const box=document.createElement('div');
    box.className='beat'+(openBeat===b.id?' open':'');
    const h=document.createElement('div'); h.className='beat-h';
    const lbl=document.createElement('b'); lbl.textContent=b.label||'(sans texte)';
    h.appendChild(lbl);
    h.appendChild(icon('⧉','Dupliquer',e=>{
      e.stopPropagation();
      const c=JSON.parse(JSON.stringify(b)); c.id=uid();
      if(c.posMode==='anchor') c.anchor='bottom-left';
      ch.buttons.splice(i+1,0,c); openBeat=c.id; renderAll();
    }));
    const del=icon('✕','Supprimer',e=>{e.stopPropagation(); ch.buttons.splice(i,1); renderAll();});
    del.classList.add('del'); h.appendChild(del);
    h.addEventListener('click',()=>{
      openBeat = (openBeat===b.id) ? null : b.id;
      openGroup=null;
      renderInspector();
    });

    const body=document.createElement('div'); body.className='beat-body';
    const t=document.createElement('input'); t.className='in'; t.value=b.label;
    t.addEventListener('input',()=>{ b.label=t.value; lbl.textContent=t.value||'(sans texte)'; syncPreview(); });

    /* la destination : un chapitre, ou une adresse web */

    r1.appendChild(labelled('Casse',select(b,'caps',
      [['none','Telle quelle'],['uppercase','Capitales'],['lowercase','Bas de casse']])));

    const r2=document.createElement('div'); r2.className='two';
    r2.appendChild(labelled('Taille',range(b,'size',0.5,3,0.05,v=>v.toFixed(2)+' rem')));
    r2.appendChild(labelled('Interlettrage',range(b,'tracking',-6,40,0.5,v=>v+'')));

    g=group(body,'Habillage');

    c1.appendChild(labelled('Texte',color(b,'color')));
    c1.appendChild(labelled('Fond',color(b,'bg')));
    g.appendChild(c1);
    g.appendChild(labelled('Opacité du fond',range(b,'bgAlpha',0,1,0.05,v=>Math.round(v*100)+' %')));
    const c2=document.createElement('div'); c2.className='two';
    c2.appendChild(labelled('Bordure',color(b,'borderC')));
    c2.appendChild(labelled('Épaisseur',range(b,'borderW',0,6,0.5,v=>v+' px')));
    g.appendChild(c2);
    const c3=document.createElement('div'); c3.className='two';
    c3.appendChild(labelled('Arrondi',range(b,'radius',0,999,1,v=>v>=999?'pilule':v+' px')));
    c3.appendChild(labelled('Flou du fond',range(b,'blur',0,26,1,v=>v?v+' px':'aucun')));
    g.appendChild(c3);
    const c4=document.createElement('div'); c4.className='two';
    c4.appendChild(labelled('Marge horizontale',range(b,'padX',0.2,4,0.1,v=>v.toFixed(1)+' em')));
    c4.appendChild(labelled('Marge verticale',range(b,'padY',0.1,2.5,0.05,v=>v.toFixed(2)+' em')));
    g.appendChild(c4);
    g.appendChild(labelled('Ombre',range(b,'shadow',0,50,1,v=>v?v+' px':'aucune')));
    if(b.shadow>0) g.appendChild(labelled('Couleur de l\u2019ombre',color(b,'shadowC')));
    const c5=document.createElement('div'); c5.className='two';
    c5.appendChild(labelled('Fond au survol',color(b,'hoverBg')));
    c5.appendChild(labelled('Texte au survol',color(b,'hoverColor')));
    g.appendChild(c5);

    const css=document.createElement('textarea');
    css.className='in'; css.rows=3;
    css.placeholder='text-decoration:underline; box-shadow:4px 4px 0 #000;';
    css.value=b.css||'';
    css.addEventListener('input',()=>{ b.css=css.value; syncPreview(); });
    g.appendChild(labelled('CSS libre',css));
    const hh=document.createElement('div'); hh.className='hint';
    hh.textContent='Écrit après tous les réglages ci-dessus, donc prioritaire. Déclarations séparées par un point-virgule.';
    g.appendChild(hh);

    g=group(body,'Apparition');
    g.appendChild(labelled('Effet',selectGrouped(b,'anim',PRESET_GROUPS)));
    g.appendChild(labelled('Apparaît à',range(b,'at',0,0.95,0.01,v=>Math.round(v*100)+' %')));
    g.appendChild(labelled('Reste visible',range(b,'span',0.05,1,0.01,v=>Math.round(v*100)+' %')));

    box.appendChild(body); list.appendChild(box);
  });

  const add=document.createElement('button');
  add.className='btn'; add.style.width='100%';
  add.textContent='Ajouter un bouton';
  add.addEventListener('click',()=>{
    const n=ch.buttons.length;
    const b=newButton({label:n?'Autre choix':'Continuer',
      anchor:n===0?'bottom-center':(n===1?'bottom-left':'bottom-right')});
    ch.buttons.push(b); openBeat=b.id; renderAll();
  });
  list.appendChild(add);
  host.appendChild(list);
  const h2=document.createElement('div'); h2.className='hint';
  h2.textContent='Plusieurs boutons visant des chapitres différents transforment la page en récit à embranchements.';
  host.appendChild(h2);
  parent.appendChild(host);
}

/* ---- textes ---- */
function buildBeatPanel(parent,ch){
  const host=document.createElement('div'); host.className='field';
  host.innerHTML='<label>Textes du chapitre</label>';
  const list=document.createElement('div');

  ch.beats.forEach((b,i)=>{
    const box=document.createElement('div');
    box.className='beat'+(openBeat===b.id?' open':'');
    const h=document.createElement('div'); h.className='beat-h';
    const lbl=document.createElement('b');
    lbl.textContent=(b.text||'(vide)').slice(0,24);
    h.appendChild(lbl);
    h.appendChild(icon('↑','Monter',e=>{e.stopPropagation(); if(i>0){ch.beats.splice(i-1,0,ch.beats.splice(i,1)[0]);renderAll();}}));
    h.appendChild(icon('↓','Descendre',e=>{e.stopPropagation(); if(i<ch.beats.length-1){ch.beats.splice(i+1,0,ch.beats.splice(i,1)[0]);renderAll();}}));
    h.appendChild(icon('⧉','Dupliquer',e=>{
      e.stopPropagation();
      const c=JSON.parse(JSON.stringify(b)); c.id=uid(); c.at=Math.min(0.95,b.at+0.15);
      ch.beats.splice(i+1,0,c); openBeat=c.id; renderAll();
    }));
    const del=icon('✕','Supprimer',e=>{e.stopPropagation(); ch.beats.splice(i,1); if(openBeat===b.id) openBeat=null; renderAll();});
    del.classList.add('del'); h.appendChild(del);
    h.addEventListener('click',()=>{
      openBeat = (openBeat===b.id) ? null : b.id;
      if(openBeat) selBeatId=b.id;
      openGroup=null;
      renderInspector();
    });
    box.appendChild(h);

    const body=document.createElement('div'); body.className='beat-body';
    const ta=document.createElement('textarea');
    ta.className='in'; ta.value=b.text; ta.rows=3;
    ta.addEventListener('focus',()=>{ selBeatId=b.id; });
    ta.addEventListener('input',()=>{
      b.text=ta.value; lbl.textContent=(ta.value||'(vide)').slice(0,24); syncPreview();
    });
    body.appendChild(ta);

    let g=group(body,'Typographie');
    g.appendChild(labelled('Police',fontSelect(b,'font')));
    const f1=document.createElement('div'); f1.className='two';
    f1.appendChild(labelled('Graisse',weightSelect(b,'weight','font')));
    f1.appendChild(labelled('Casse',select(b,'caps',[['none','Telle quelle'],['uppercase','Capitales'],['lowercase','Bas de casse']])));
    g.appendChild(f1);
    g.appendChild(labelled('Taille',range(b,'size',0.6,12,0.05,v=>v.toFixed(2)+' rem')));
    g.appendChild(labelled('Interlettrage',range(b,'tracking',-10,40,0.5,v=>v+' /100 em')));
    g.appendChild(labelled('Espace entre les mots',range(b,'wordSpace',-20,80,1,v=>v+' /100 em')));
    g.appendChild(labelled('Interligne',range(b,'leading',0.75,2.6,0.02,v=>v.toFixed(2))));
    g.appendChild(labelled('Couleur',colorOpt(b,'color')));
    g.appendChild(check(b,'italic','Italique'));

    g=group(body,'Effets');
    g.appendChild(labelled('Remplissage',select(b,'fill',
      [['solid','Couleur pleine'],['gradient','Dégradé'],['glass','Verre']])));

      const fg=document.createElement('div'); fg.className='two';
      fg.appendChild(labelled('Départ',color(b,'grad1')));
      fg.appendChild(labelled('Arrivée',color(b,'grad2')));
      g.appendChild(fg);

    g.appendChild(labelled('Flou de l\u2019ombre',range(b,'shadowBlur',0,60,1,v=>v+' px')));
    g.appendChild(labelled('Couleur de l\u2019ombre',color(b,'shadowC')));
    g.appendChild(labelled('Halo lumineux',range(b,'glow',0,60,1,v=>v?v+' px':'aucun')));
    if(b.glow>0) g.appendChild(labelled('Couleur du halo',color(b,'glowC')));
    g.appendChild(labelled('Néon',range(b,'neon',0,40,1,v=>v?v+' px':'aucun')));
    if(b.neon>0) g.appendChild(labelled('Couleur du néon',color(b,'neonColor')));
    g.appendChild(labelled('Décalage RVB',range(b,'rgbSplit',0,14,0.5,v=>v?v+' px':'aucun')));

    f8.appendChild(labelled('Inclinaison',range(b,'skew',-30,30,1,v=>v+' °')));
    g.appendChild(f8);

      g.appendChild(labelled('Vitesse de la boucle',range(b,'lookSpeed',0.2,4,0.1,v=>v.toFixed(1)+' ×')));

    g=group(body,'Apparition');
    const f4=document.createElement('div'); f4.className='two';
    f4.appendChild(labelled('Effet',selectGrouped(b,'anim',PRESET_GROUPS)));
    f4.appendChild(labelled('Découpe',select(b,'unit',UNITS)));
    g.appendChild(f4);
    g.appendChild(labelled('Courbe',select(b,'ease',EASES)));
    const f5=document.createElement('div'); f5.className='two';
    f5.appendChild(labelled('Durée',range(b,'dur',80,3000,20,v=>v+' ms')));
    f5.appendChild(labelled('Décalage',range(b,'stagger',0,400,5,v=>v+' ms')));
    g.appendChild(f5);

    vt.value=b.voiceText||'';
    vt.addEventListener('input',()=>{ b.voiceText=vt.value; });
    g.appendChild(labelled('Texte à dire',vt));
    const va=b.voice&&ASSETS.get(b.voice);
    const vrow=document.createElement('div'); vrow.className='two';
    const gen=document.createElement('button'); gen.className='btn';
    gen.textContent=va?'Refaire la voix':'Générer la voix';
    gen.addEventListener('click',()=>generateVoice(b));
    const play=document.createElement('button'); play.className='btn';
    play.textContent=va?'Écouter':'—'; play.disabled=!va;
    play.addEventListener('click',()=>{
      const a=new Audio(assetURL(b.voice)); a.play().catch(()=>{});
    });
    vrow.appendChild(gen); vrow.appendChild(play);
    g.appendChild(vrow);
    if(va){
      const info=document.createElement('div'); info.className='hint';
      info.textContent=va.name+' — '+fmtBytes(va.bytes.length)+
        ' · la voix démarre quand le texte apparaît et baisse la musique.';
      g.appendChild(info);
      const del=document.createElement('button'); del.className='btn';
      del.style.width='100%'; del.style.marginTop='6px';
      del.textContent='Retirer la voix';
      del.addEventListener('click',()=>{ dropAsset(b.voice); b.voice=null; renderAll(true); });

    g.appendChild(labelled('Reste visible',range(b,'span',0.05,1,0.01,v=>Math.round(v*100)+' %')));
    g.appendChild(check(b,'exit','Repart en sortant du champ'));

    box.appendChild(body);
    list.appendChild(box);
  });

  const row=document.createElement('div'); row.className='two';
  const addT=document.createElement('button'); addT.className='btn'; addT.textContent='Ajouter un titre';
  const addB=document.createElement('button'); addB.className='btn'; addB.textContent='Ajouter un paragraphe';
  const push=kind=>{
    const last=ch.beats[ch.beats.length-1];
    const b=newBeat({kind:kind, text:kind==='title'?'Un titre':'Un paragraphe.',
      at:Math.min(0.9,last?last.at+0.2:0.15)});
    if(kind==='title'){ b.unit='word'; b.anim='blurIn'; }
    ch.beats.push(b); openBeat=b.id; selBeatId=b.id; renderAll();
  };
  addT.addEventListener('click',()=>push('title'));
  addB.addEventListener('click',()=>push('body'));
  row.appendChild(addT); row.appendChild(addB); list.appendChild(row);

  host.appendChild(list); parent.appendChild(host);
}

/* ---- ambiance ---- */
function buildTheme(parent){
  const t=story.theme;
  const nav=document.createElement('div'); nav.className='tabs';
  [['couleurs','Couleurs'],['typo','Typographie'],
   ['formes','Formes'],['son','Son et voix']].forEach(x=>{
    const b=document.createElement('button');
    b.className='tab'+(themeTab===x[0]?' on':'');
    b.textContent=x[1];
    b.addEventListener('click',()=>{ themeTab=x[0]; renderInspector(); });
    nav.appendChild(b);
  });
  parent.appendChild(nav);

  if(themeTab==='couleurs'){
  const g=document.createElement('div'); g.className='three';
  g.appendChild(labelled('Fond',color(t,'bg')));
  g.appendChild(labelled('Texte',color(t,'ink')));
  g.appendChild(labelled('Accent',color(t,'accent')));
  field(parent,'Couleurs',g);

  /* le rendu, tout de suite, sur le texte du récit */
  const demo=document.createElement('div');
  demo.style.cssText='background:'+t.bg+';border-radius:var(--r);padding:16px 14px;'+
    'border:1px solid var(--line)';
  const d1=document.createElement('div');
  d1.style.cssText='color:'+t.ink+';font-family:\''+t.display+'\',serif;'+
    'font-weight:'+t.dispWeight+';letter-spacing:'+(t.dispTrack/100)+'em;'+
    'font-size:22px;line-height:1.15';
  d1.textContent=sampleText('title');
  const d2=document.createElement('div');
  d2.style.cssText='color:'+t.ink+';opacity:.82;margin-top:9px;font-size:12.5px;'+
    'line-height:1.6;font-family:\''+t.body+'\',sans-serif;'+
    'font-weight:'+t.bodyWeight+';letter-spacing:'+(t.bodyTrack/100)+'em';
  d2.textContent=sampleText('body');
  const d3=document.createElement('div');
  d3.style.cssText='margin-top:12px;display:inline-block;border:1px solid '+t.accent+';'+

/* Une ambiance ne vaut que si les chapitres déjà créés la reprennent.
   On remplace les couleurs restées identiques à l'ancien thème ; celles que
   vous avez personnalisées ne bougent pas. */
function applyPalette(P){
  const t=story.theme, old={bg:t.bg,ink:t.ink,accent:t.accent};
  t.bg=P.bg; t.ink=P.ink; t.accent=P.accent;
  const swap=(v,from,to)=>(!v||v.toLowerCase()===from.toLowerCase())?to:v;
  story.chapters.forEach(c=>{
    if(c.bg) c.bg=swap(c.bg,old.bg,P.bg);
    (c.spots||[]).forEach(sp=>{ sp.color=swap(sp.color,old.accent,P.accent); });
    (c.buttons||[]).forEach(b=>{
      b.color=swap(b.color,old.ink,P.ink);
      b.borderC=swap(b.borderC,old.accent,P.accent);
      b.hoverBg=swap(b.hoverBg,old.accent,P.accent);
      b.hoverColor=swap(b.hoverColor,old.bg,P.bg);
    });
    (c.beats||[]).forEach(b=>{
      if(b.color) b.color=swap(b.color,old.ink,P.ink);
      b.glowC=swap(b.glowC,old.accent,P.accent);
      b.grad1=swap(b.grad1,old.ink,P.ink);
      b.grad2=swap(b.grad2,old.accent,P.accent);
    });
  });
  renderAll(true);
  toast('Palette « '+P.name+' » appliquée à tout le récit');
}

function applyPair(p){
  const t=story.theme;
  t.display=p.t[0]; t.dispWeight=p.t[1]; t.dispTrack=p.t[2];
  t.body=p.s[0];   t.bodyWeight=p.s[1]; t.bodyTrack=p.s[2];
  /* les textes qui n'avaient pas été personnalisés suivent l'accord */
  story.chapters.forEach(c=>{
    c.beats.forEach(b=>{
      if(b.kind==='title'){ b.font=t.display; b.weight=t.dispWeight; b.tracking=t.dispTrack; }
      else { b.font=t.body; b.weight=t.bodyWeight; b.tracking=t.bodyTrack; }
    });
    /* boutons et annotations suivent la police de lecture */
    (c.buttons||[]).forEach(b=>{ b.font=t.body; });
    (c.spots||[]).forEach(sp=>{ sp.font=t.body; });
  });
  renderAll(true);
  toast('Accord « '+p.name+' » appliqué à tout le récit');
}

/* Un échantillon pris dans le récit lui-même : on essaie une police ou une
   couleur sur son propre texte, pas sur une phrase générique. */
function sampleText(kind){
  for(const c of story.chapters)
    for(const b of (c.beats||[]))
      if(b.kind===kind && (b.text||'').trim())
        return b.text.split('\n')[0].slice(0,kind==='title'?38:90);
  return kind==='title' ? (story.title||'Un titre') : 'Le paragraphe qui accompagne la scène.';
}

/* Navigateur de polices : les 71 familles rendues avec votre texte. */
function openFontBrowser(obj,key,kind){
  const modal=document.createElement('div'); modal.className='modal on fontmodal';
  const sheet=document.createElement('div'); sheet.className='sheet';
  sheet.style.width='min(760px,100%)';
  const h2=document.createElement('h2'); h2.textContent='Choisir une police';
  sheet.appendChild(h2);

  const bar=document.createElement('div');
  bar.style.cssText='padding:12px 18px 0;display:grid;grid-template-columns:1fr auto;gap:8px';
  const ta=document.createElement('input'); ta.className='in';
  ta.value=sampleText(kind); ta.placeholder='Texte d\u2019essai';
  const szw=document.createElement('div'); szw.style.width='150px';
  bar.appendChild(ta); bar.appendChild(szw);
  sheet.appendChild(bar);

  const body=document.createElement('div'); body.className='body';
  body.style.cssText='padding:12px 18px;max-height:56vh;overflow:auto';
  sheet.appendChild(body);

  let size = kind==='title' ? 30 : 17;
  const szBox={v:size};
  szw.appendChild(range(szBox,'v',11,60,1,v=>v+' px'));

  const draw=()=>{
    body.innerHTML='';
    Object.keys(FONT_GROUPS).forEach(gname=>{
      const t=document.createElement('div'); t.className='sub'; t.style.cursor='default';
      t.textContent=gname; body.appendChild(t);
      FONT_GROUPS[gname].forEach(f=>{
        const row=document.createElement('button');
        row.className='fontrow'+(obj[key]===f?' sel':'');
        const nm=document.createElement('span'); nm.className='fn'; nm.textContent=f;
        const sm=document.createElement('span'); sm.className='fs';
        sm.textContent=ta.value||sampleText(kind);
        sm.style.fontFamily="'"+f+"',serif";
        sm.style.fontSize=szBox.v+'px';
        sm.style.fontWeight=(FONT_INDEX[f]||[400]).indexOf(300)>=0?300:400;
        row.appendChild(nm); row.appendChild(sm);
        row.addEventListener('click',()=>{
          obj[key]=f;
          const w=FONT_INDEX[f]||[400];
          const wk = key==='display'?'dispWeight':key==='body'?'bodyWeight':'weight';
          if(obj[wk]!=null && w.indexOf(obj[wk])<0)
            obj[wk]=w.reduce((x,y)=>Math.abs(y-obj[wk])<Math.abs(x-obj[wk])?y:x,w[0]);
          modal.remove(); renderAll(true);
        });
        body.appendChild(row);
      });
    });
  };
  ta.addEventListener('input',draw);
  szw.addEventListener('input',draw);
  draw();

  const foot=document.createElement('div'); foot.className='foot';
  const cancel=document.createElement('button'); cancel.className='btn ghost';
  cancel.textContent='Fermer';
  cancel.addEventListener('click',()=>modal.remove());
  foot.appendChild(cancel); sheet.appendChild(foot);
  modal.appendChild(sheet);
  modal.addEventListener('click',e=>{ if(e.target===modal) modal.remove(); });
  document.body.appendChild(modal);
}

function tip(el,label){

/* ---- constructeurs ---- */
function fontSelect(obj,key){
  const s=document.createElement('select'); s.className='in';
  Object.keys(FONT_GROUPS).forEach(gname=>{
    const og=document.createElement('optgroup'); og.label=gname;
    FONT_GROUPS[gname].forEach(f=>{
      const op=document.createElement('option');
      op.value=f; op.textContent=f;
      op.style.fontFamily="'"+f+"',sans-serif";
      if(obj[key]===f) op.selected=true;
      og.appendChild(op);
    });
    s.appendChild(og);
  });
  s.style.fontFamily="'"+obj[key]+"',sans-serif";
  s.addEventListener('change',()=>{
    obj[key]=s.value;
    const w=FONT_INDEX[s.value]||[400];
    /* la graisse courante peut ne pas exister dans la nouvelle police */
    const wk = key==='display'?'dispWeight':key==='body'?'bodyWeight':'weight';
    if(obj[wk]!=null && w.indexOf(obj[wk])<0)
      obj[wk]=w.reduce((a,b)=>Math.abs(b-obj[wk])<Math.abs(a-obj[wk])?b:a,w[0]);
    renderAll(true);
  });

  const kind = (key==='display') ? 'title'
             : (key==='body') ? 'body'
             : (obj.kind==='title' ? 'title' : 'body');
  const wrap=document.createElement('div');
  const row=document.createElement('div');
  row.style.cssText='display:grid;grid-template-columns:1fr auto;gap:5px';
  const br=document.createElement('button'); br.className='btn';
  br.textContent='Parcourir'; br.title='Voir les 71 polices avec votre propre texte';
  br.addEventListener('click',()=>openFontBrowser(obj,key,kind));
  row.appendChild(s); row.appendChild(br);
  wrap.appendChild(row);

  /* l'échantillon : votre texte, dans la police et la couleur retenues */
  const smp=document.createElement('div'); smp.className='sample';
  smp.textContent = (obj.text && obj.text.trim()) ? obj.text.split('\n')[0].slice(0,60)
                    : sampleText(kind);
  smp.style.fontFamily="'"+obj[key]+"',serif";
  smp.style.fontWeight=obj.weight||obj[key==='display'?'dispWeight':'bodyWeight']||400;
  smp.style.letterSpacing=((obj.tracking!=null?obj.tracking
    :(key==='display'?story.theme.dispTrack:story.theme.bodyTrack))/100)+'em';
  smp.style.fontSize=(kind==='title'?23:15)+'px';
  smp.style.color=obj.color||story.theme.ink;
  smp.style.background=story.theme.bg;
  if(obj.italic) smp.style.fontStyle='italic';
  if(obj.caps&&obj.caps!=='none') smp.style.textTransform=obj.caps;
  wrap.appendChild(smp);
  return wrap;
}

  head.appendChild(document.createTextNode(name));

function range(obj,key,min,max,step,fmt){
  const w=document.createElement('div'); w.className='rangerow';
  const r=document.createElement('input');
  r.type='range'; r.min=min; r.max=max; r.step=step;
  const n=document.createElement('span'); n.className='num';
  /* valeur absente : on affiche un tiret au lieu de lever une erreur */
  const show=v=>{
    const x=typeof v==='number'?v:parseFloat(v);
    if(!isFinite(x)) return '\u2014';
    try{ return fmt(x); }catch(e){ return String(x); }
  };
  if(isFinite(parseFloat(obj[key]))) r.value=obj[key];
  n.textContent=show(obj[key]);
  /* la portion parcourue colore la piste jusqu'au curseur */
  const paint=()=>r.style.setProperty('--fill',
    (((r.value-min)/(max-min))*100).toFixed(1)+'%');
  paint();
  r.addEventListener('input',()=>{
    obj[key]=parseFloat(r.value); n.textContent=show(obj[key]); paint();
    /* le rail ne dépend que de la longueur du chapitre : inutile de le
       reconstruire à chaque pixel du curseur */
    if(key==='len') lazyRail();
    syncPreview();
  });
  /* double-clic : retour à la valeur d'origine du même réglage neuf */
  r.addEventListener('dblclick',()=>{
    const ref=(obj.kind!==undefined&&obj.text!==undefined)?newBeat({kind:obj.kind})
      :(obj.p!==undefined)?newSpot(obj.p):null;
    if(ref&&ref[key]!==undefined){
      obj[key]=ref[key]; r.value=ref[key]; n.textContent=show(ref[key]); paint();
      syncPreview(); toast('Réglage réinitialisé');
    }
  });
  w.appendChild(r); w.appendChild(n); return w;
}
function vecPaint(r,min,max){
  r.style.setProperty('--fill',(((r.value-min)/(max-min))*100).toFixed(1)+'%');
}

/* ---------------------------------------------------------------
   CONVERSION EN WEBM — WebCodecs
   L'ancienne conversion filmait la lecture avec MediaRecorder. En 1080p
   l'encodeur ne suivait pas : environ 7 images gardées sur 24, aucune
   durée inscrite, aucun index, une seule image-clé pour tout le plan. Au
   défilement, chaque recherche devait tout redécoder depuis le début.
   On procède maintenant comme Motionsmith : la vidéo est lue, chaque
   image affichée est capturée puis encodée en VP9 avec WebCodecs, en
   plaçant soi-même les images-clés, et webm-muxer écrit la durée et
   l'index. Si l'encodeur prend du retard, la lecture attend.
   --------------------------------------------------------------- */
const MUXER_URL='https://cdn.jsdelivr.net/npm/webm-muxer@5.0.3/+esm';
let muxerMod=null;
async function loadMuxer(){
  if(muxerMod) return muxerMod;
  try{ muxerMod=await import(MUXER_URL); }
  catch(e){ throw new Error('Le multiplexeur WebM n’a pas pu être chargé (connexion requise) : '+e.message); }
  if(!muxerMod.Muxer||!muxerMod.ArrayBufferTarget) throw new Error('Multiplexeur WebM incomplet.');
  return muxerMod;
}
function webcodecsSupport(){
  return typeof VideoEncoder!=='undefined' && typeof VideoFrame!=='undefined' &&
    typeof HTMLVideoElement!=='undefined' && 'requestVideoFrameCallback' in HTMLVideoElement.prototype;
}
async function pickVideoConfig(W,H,bitrate){
  for(const codec of ['vp09.00.10.08','vp8']){
    const cfg={codec,width:W,height:H,bitrate,framerate:30,latencyMode:'quality'};
    try{ const r=await VideoEncoder.isConfigSupported(cfg); if(r&&r.supported) return r.config||cfg; }
    catch(e){}
  }
  return null;
}

/* Le son est décodé d'un seul bloc, rééchantillonné à 48 kHz, puis
   réencodé en Opus. Une vidéo sans piste son renvoie null. */
async function encodeAudio(bytes){
  if(typeof AudioEncoder==='undefined'||typeof AudioData==='undefined') return null;
  let buf;
  try{
    const ctx=new OfflineAudioContext(2,1,48000);
    buf=await ctx.decodeAudioData(bytes.slice().buffer);
  }catch(e){ return null; }
  const chn=Math.min(2,buf.numberOfChannels), sr=buf.sampleRate;
  const cfg={codec:'opus',sampleRate:sr,numberOfChannels:chn,bitrate:128000};
  let ok=null; try{ ok=await AudioEncoder.isConfigSupported(cfg); }catch(e){}
  if(!ok||!ok.supported) return null;
  const chunks=[]; let err=null;
  const enc=new AudioEncoder({output:(c,m)=>chunks.push([c,m]), error:e=>{ err=e; }});
  enc.configure(cfg);
  const step=Math.round(sr/10);
  for(let i=0;i<buf.length;i+=step){
    const n=Math.min(step,buf.length-i);
    const data=new Float32Array(n*chn);
    for(let c=0;c<chn;c++) data.set(buf.getChannelData(c).subarray(i,i+n),c*n);
    const ad=new AudioData({format:'f32-planar',sampleRate:sr,numberOfFrames:n,
      numberOfChannels:chn,timestamp:Math.round(i/sr*1e6),data:data});
    enc.encode(ad); ad.close();
    if(err) throw err;
  }
  await enc.flush(); enc.close();
  if(err) throw err;
  return {chunks:chunks,sampleRate:sr,channels:chn};
}

/* Un WebM sans durée inscrite annonce une durée infinie. En demandant une
   position au-delà de la fin, le navigateur lit jusqu'au bout et la découvre. */
function knownDuration(v){
  return new Promise(res=>{
    if(isFinite(v.duration)) return res();
    const t0=setTimeout(back,8000);
    function back(){
      clearTimeout(t0);
      v.removeEventListener('durationchange',check); v.removeEventListener('timeupdate',check);
      v.addEventListener('seeked',()=>res(),{once:true});
      try{ v.currentTime=0; }catch(e){ res(); }
    }
    function check(){ if(isFinite(v.duration)) back(); }
    v.addEventListener('durationchange',check); v.addEventListener('timeupdate',check);
    try{ v.currentTime=1e101; }catch(e){ back(); }
  });
}

/* Un passage : lecture à la vitesse donnée, chaque image présentée est
   capturée avec son horodatage exact. Une image est retenue jusqu'à
   l'arrivée de la suivante pour connaître sa durée réelle. */
function encodePass(v,rate,o){
  return new Promise((resolve,reject)=>{
    const {M,cfg,W,H,audio,keyEvery,D,ui}=o;
    const target=new M.ArrayBufferTarget();
    const muxer=new M.Muxer({target:target,
      video:{codec:cfg.codec.startsWith('vp09')?'V_VP9':'V_VP8',width:W,height:H},
      audio:audio?{codec:'A_OPUS',sampleRate:audio.sampleRate,numberOfChannels:audio.channels}:undefined,
      firstTimestampBehavior:'offset'});
    const pendingAudio=audio?audio.chunks.slice():[];
    /* les deux pistes doivent arriver dans l'ordre chronologique */
    const audioUpTo=t=>{ while(pendingAudio.length&&pendingAudio[0][0].timestamp<=t){
      const x=pendingAudio.shift(); muxer.addAudioChunk(x[0],x[1]); } };
    let failed=null;
    const enc=new VideoEncoder({
      output:(chunk,meta)=>{ audioUpTo(chunk.timestamp); muxer.addVideoChunk(chunk,meta); },
      error:e=>{ failed=e; }});
    enc.configure(cfg);
    const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    const cx=cv.getContext('2d',{alpha:false});
    const QMAX=W*H>3e6?3:6, QMIN=Math.max(1,QMAX-2);
    let frames=0, lastT=-1, held=null, lost=0, lastPF=-1, started=false,
        draining=false, done=false, seen=performance.now();
    const deltas=[];
    const emit=(f,t,d)=>{
      const g=new VideoFrame(f,{timestamp:Math.round(t*1e6),duration:Math.max(1,Math.round(d*1e6))});
      f.close();
      enc.encode(g,{keyFrame:frames%keyEvery===0}); g.close();
      frames++; deltas.push(d);
    };
    const grab=t=>{
      if(t<=lastT+1e-6) return;
      lastT=t;
      cx.drawImage(v,0,0,W,H);
      const f=new VideoFrame(cv,{timestamp:Math.round(t*1e6)});
      if(held) emit(held.f,held.t,t-held.t);
      held={f:f,t:t};
    };
    const stop=()=>{ v.removeEventListener('ended',onEnded);
      document.removeEventListener('visibilitychange',onVis); clearInterval(dog); };
    const fail=e=>{ if(done) return; done=true; stop();
      try{ v.pause(); }catch(x){} if(held) held.f.close();
      try{ enc.close(); }catch(x){} reject(e); };
    const finish=async()=>{
      if(done) return; done=true; stop();
      try{
        if(held){ const s=deltas.slice().sort((a,b)=>a-b);
          emit(held.f,held.t,s.length?s[s.length>>1]:1/30); held=null; }
        await enc.flush(); enc.close();
        if(failed) throw failed;
        audioUpTo(Infinity);
        muxer.finalize();
        resolve({bytes:new Uint8Array(target.buffer),frames:frames,lost:lost});
      }catch(e){ reject(e); }
    };
    const onFrame=async(now,meta)=>{
      if(done) return;
      if(o.cancelled()) return fail(new Error('Conversion annulée.'));
      if(failed) return fail(failed);
      seen=performance.now();
      if(started&&lastPF>=0&&meta.presentedFrames>lastPF+1) lost+=meta.presentedFrames-lastPF-1;
      lastPF=meta.presentedFrames;
      grab(meta.mediaTime);
      ui.progress(Math.min(1,meta.mediaTime/D),frames);
      v.requestVideoFrameCallback(onFrame);
      if(!started){ started=true; v.playbackRate=rate; v.play().catch(fail); return; }
      /* contre-pression : l'encodeur prend du retard, la lecture attend */
      if(enc.encodeQueueSize>QMAX&&!draining){
        draining=true; v.pause();
        while(!done&&enc.encodeQueueSize>QMIN) await new Promise(r=>setTimeout(r,4));
        draining=false;
        if(!done&&!v.ended&&!document.hidden) v.play().catch(fail);
      }
    };
    /* onglet masqué : le navigateur cesse de présenter les images, on attend */
    const onVis=()=>{ if(done||!started) return;
      if(document.hidden) v.pause(); else if(!draining&&!v.ended) v.play().catch(fail); };
    const onEnded=()=>setTimeout(finish,80);
    const dog=setInterval(()=>{
      if(!done&&!draining&&!document.hidden&&performance.now()-seen>8000)
        fail(new Error('La lecture de la vidéo s’est bloquée.'));
      if(!done&&!started&&performance.now()-seen>1500){ started=true; v.playbackRate=rate; v.play().catch(fail); }
    },500);
    v.addEventListener('ended',onEnded);
    document.addEventListener('visibilitychange',onVis);
    v.pause();
    v.requestVideoFrameCallback(onFrame);
    try{ v.currentTime=0; }catch(e){}
  });
}

async function convertToWebm(bytes,mime,opts,ui){
  if(!webcodecsSupport()) throw new Error('Ce navigateur ne propose pas WebCodecs : utilisez Chrome ou Edge.');
  const M=await loadMuxer();
  const url=URL.createObjectURL(new Blob([bytes],{type:mime}));
  const v=ui.video;
  v.muted=true; v.playsInline=true; v.preload='auto'; v.src=url;
  try{
    await new Promise((res,rej)=>{ v.onloadedmetadata=res;
      v.onerror=()=>rej(new Error('Vidéo illisible par ce navigateur.')); });
    ui.status('Lecture de la durée…');
    await knownDuration(v);
    const D=isFinite(v.duration)&&v.duration>0?v.duration:1;
    const scale=Math.min(1,(opts.maxW||1920)/v.videoWidth);
    const W=Math.max(2,Math.round(v.videoWidth*scale/2)*2), H=Math.max(2,Math.round(v.videoHeight*scale/2)*2);
    /* au défilement, les images-clés rapprochées coûtent du débit : on compense */
    const bitrate=Math.round((opts.mbps||2.2)*1e6*(opts.scrub?1.8:1));
    const cfg=await pickVideoConfig(W,H,bitrate);
    if(!cfg) throw new Error('Aucun encodeur VP9 ni VP8 dans ce navigateur.');
    let audio=null;
    if(opts.keepAudio&&!opts.scrub){ ui.status('Encodage du son…'); audio=await encodeAudio(bytes); }
    const keyEvery=opts.scrub?6:48;
    const rates=[1,0.5,0.25];
    for(let p=0;p<rates.length;p++){
      /* l'ordinateur n'a pas suivi : on relit plus lentement plutôt que de
         livrer un fichier troué (une perte infime est tolérée) */
      ui.label = p ? 'Passe '+(p+1)+', lecture ralentie ×'+String(rates[p]).replace('.',',')+' — ' : '';
      ui.status(p?ui.label+'aucune image ne doit manquer':'Encodage des images…');
      const r=await encodePass(v,rates[p],{M,cfg,W,H,audio,keyEvery,D,ui,cancelled:ui.cancelled});
      if(r.lost<=Math.floor(r.frames/100)||p===rates.length-1)
        return {bytes:r.bytes,frames:r.frames,lost:r.lost,keyEvery:keyEvery,W:W,H:H,
                codec:cfg.codec.startsWith('vp09')?'VP9':'VP8',audio:!!audio};
    }
  }finally{
    try{ v.pause(); }catch(e){}
    v.removeAttribute('src'); try{ v.load(); }catch(e){}
    URL.revokeObjectURL(url);
  }
}

/* Petit panneau de progression : la vidéo en cours y est visible, ce qui
   garantit au passage que le navigateur présente bien chacune de ses images. */
function convPanel(){
  let box=document.getElementById('convBox');
  if(!box){
    box=document.createElement('div'); box.id='convBox'; box.className='convbox';
    box.innerHTML='<video muted playsinline></video><div class="cb-body">'+
      '<b>Conversion en WebM</b><span class="cb-stat"></span>'+
      '<div class="cb-bar"><i></i></div>'+
      '<span class="cb-note">Gardez cet onglet au premier plan.</span></div>'+
      '<button class="btn ghost cb-x">Annuler</button>';
    document.body.appendChild(box);
  }
  let cancel=false;
  box.querySelector('.cb-x').onclick=()=>{ cancel=true; };
  box.hidden=false;
  const stat=box.querySelector('.cb-stat'), bar=box.querySelector('.cb-bar i');
  return {
    video:box.querySelector('video'),
    status:t=>{ stat.textContent=t; },
    label:'',
    progress(k,n){ bar.style.width=(k*100).toFixed(1)+'%';
      stat.textContent=this.label+Math.round(k*100)+' % — '+n+' images'; },
    cancelled:()=>cancel,
    close:()=>{ box.hidden=true; }
  };
}

async function convertChapterVideo(ch){
  const a=ch.asset&&ASSETS.get(ch.asset);
  if(!a) return;
  if(convBusy){ toast('Une conversion est déjà en cours','bad'); return; }
  convBusy=true;
  const scrub = convOpts.usage==='scrub' ||
    (convOpts.usage==='auto' && (ch.playMode==='scrub'||ch.playMode==='pointer'));
  const before=a.bytes.length;
  const ui=convPanel();
  try{
    const r=await convertToWebm(a.bytes,a.mime,
      {maxW:convOpts.maxW,mbps:convOpts.mbps,keepAudio:convOpts.keepAudio,scrub:scrub},ui);
    ui.close();
    /* pour la lecture normale, un fichier plus lourd ne sert à rien ; pour le
       défilement, c'est le prix d'une navigation fluide et on le garde */
    if(!scrub&&r.bytes.length>=before){
      toast('Le fichier obtenu n’est pas plus léger ('+fmtBytes(r.bytes.length)+
        ') : l’original est conservé. Essayez un débit plus bas.','bad');
      return;
    }
    const key=uid();
    ASSETS.set(key,{ name:a.name.replace(/\.[^.]+$/,'')+'.webm', mime:'video/webm',
                     kind:'video', bytes:r.bytes, b64:null });
    dropAsset(ch.asset);
    ch.asset=key;
    renderAll(true);
    toast('Converti en '+r.codec+' : '+r.frames+' images, une image-clé toutes les '+r.keyEvery+
      (r.audio?', son conservé':'')+' — '+fmtBytes(before)+' → '+fmtBytes(r.bytes.length)+
      (r.lost?' ('+r.lost+' images perdues malgré la lecture ralentie)':''));
  }catch(e){
    console.error('[Récit] conversion',e); ui.close();
    toast(e.message,'bad');
  }finally{ convBusy=false; }
}
let convBusy=false;
const convOpts={ maxW:1920, mbps:2.2, keepAudio:true, usage:'auto' };

/* ---------------------------------------------------------------
   DIAGNOSTIC D'UNE VIDÉO POUR LE DÉFILEMENT
   Compte images et images-clés, et vérifie la présence de la durée et
   de l'index, en lisant directement la structure du fichier.
   --------------------------------------------------------------- */
function videoReport(bytes){
  const b=bytes, n=b.length;
  const vint=(i,keepMark)=>{ const x=b[i]; let l=1,m=0x80;
    while(l<=8&&!(x&m)){ l++; m>>=1; }
    if(l>8) return null;
    let v=keepMark?x:(x&(m-1)); let all=(x&(m-1))===(m-1);
    for(let k=1;k<l;k++){ v=v*256+b[i+k]; if(b[i+k]!==255) all=false; }
    return {v:v,l:l,unknown:!keepMark&&all}; };
  if(b[0]===0x1A&&b[1]===0x45&&b[2]===0xDF&&b[3]===0xA3){
    /* WebM : parcours à plat, on entre dans les éléments conteneurs */
    const ENTER={0x18538067:1,0x1549A966:1,0x1654AE6B:1,0xAE:1,0x1F43B675:1,0xA0:1};
    let i=0, dur=false, secs=null, tcs=1e6, cues=false, vtrack=null, curNum=null, curType=null, frames=0, keys=0,
        clusterTC=0, lastTC=-1;
    while(i<n-2){
      const id=vint(i,true); if(!id) break; i+=id.l;
      const sz=vint(i,false); if(!sz) break; i+=sz.l;
      const ID=id.v;
      if(ENTER[ID]){ if(ID===0xAE){ curNum=null; curType=null; } continue; }
      if(ID===0x4489){ dur=true;
        const dv=new DataView(b.buffer,b.byteOffset+i,sz.v);
        secs = sz.v===8 ? dv.getFloat64(0) : sz.v===4 ? dv.getFloat32(0) : null; }
      else if(ID===0x2AD7B1){ tcs=0; for(let k=0;k<sz.v;k++) tcs=tcs*256+b[i+k]; }
      else if(ID===0x1C53BB6B) cues=true;
      else if(ID===0xE7){ clusterTC=0; for(let k=0;k<sz.v;k++) clusterTC=clusterTC*256+b[i+k]; }
      else if(ID===0xD7) { curNum=0; for(let k=0;k<sz.v;k++) curNum=curNum*256+b[i+k]; }
      else if(ID===0x83) { curType=b[i]; if(curType===1&&curNum!=null&&vtrack==null) vtrack=curNum; }
      else if(ID===0xA3||ID===0xA1){
        const t=vint(i,false);
        if(t&&(vtrack==null||t.v===vtrack)){ frames++; if(ID===0xA3&&(b[i+t.l+2]&0x80)) keys++;
          /* horodatage relatif au bloc, sur 16 bits signés */
          let rel=(b[i+t.l]<<8)|b[i+t.l+1]; if(rel>=0x8000) rel-=0x10000;
          if(clusterTC+rel>lastTC) lastTC=clusterTC+rel; }
      }
      if(sz.unknown) continue;
      i+=sz.v;
    }
    if(vtrack==null&&curType===1&&curNum!=null) vtrack=curNum;
    /* sans durée inscrite, on l'estime d'après la dernière image */
    let seconds = secs!=null&&isFinite(secs) ? secs*tcs/1e9 : null;
    if(seconds==null && lastTC>0 && frames>1) seconds = lastTC*tcs/1e9*frames/(frames-1);
    return {container:'WebM',frames:frames,keys:keys,duration:dur,index:cues,seconds:seconds};
  }
  /* MP4 : table des échantillons de la piste vidéo */
  const u32=i=>((b[i]<<24)>>>0)+(b[i+1]<<16)+(b[i+2]<<8)+b[i+3];
  const typ=i=>String.fromCharCode(b[i],b[i+1],b[i+2],b[i+3]);
  let res=null;
  (function walk(s,e,inVideo){
    let i=s;
    while(i+8<=e){
      let size=u32(i); const t=typ(i+4); let h=8;
      if(size===1){ size=u32(i+8)*4294967296+u32(i+12); h=16; } else if(size===0) size=e-i;
      if(size<h) break;
      if(t==='trak'){
        const body=[i+h,i+size];
        /* on repère la piste vidéo par son gestionnaire « vide » */
        let isV=false; for(let k=body[0];k<body[1]-12;k++){ if(typ(k)==='hdlr'&&typ(k+12)==='vide'){ isV=true; break; } }
        if(isV) walk(body[0],body[1],true);
      }else if(['moov','mdia','minf','stbl'].indexOf(t)>=0) walk(i+h,i+size,inVideo);
      else if(inVideo&&t==='stsz'){ res=res||{}; res.frames=u32(i+h+8); }
      else if(inVideo&&t==='mdhd'){ res=res||{}; const v1=b[i+h]===1;
        const ts=u32(i+h+(v1?20:12)), du=v1?u32(i+h+24)*4294967296+u32(i+h+28):u32(i+h+16);
        if(ts) res.seconds=du/ts; }
      else if(inVideo&&t==='stss'){ res=res||{}; res.keys=u32(i+h+4); }
      i+=size;
    }
  })(0,n,false);
  if(!res||!res.frames) return null;
  return {container:'MP4',frames:res.frames,keys:res.keys==null?res.frames:res.keys,duration:true,index:true,
          seconds:res.seconds||null};
}
function reportFor(key){
  const a=ASSETS.get(key); if(!a) return null;
  if(a.report===undefined){ try{ a.report=videoReport(a.bytes); }catch(e){ a.report=null; } }
  return a.report;
}
/* Verdict affiché sous une vidéo : on dit pourquoi elle saccadera avant que
   l'utilisateur ne le découvre. En lecture normale, seuls les défauts qui
   se voient à la lecture sont signalés ; en défilement, tous. */
function videoDiag(key,driven){
  const r=reportFor(key);
  const d=document.createElement('div'); d.className='vdiag';
  const say=(cls,title,body)=>{
    d.classList.add(cls);
    const b=document.createElement('b'); b.textContent=title; d.appendChild(b);
    if(body){ const s=document.createElement('span'); s.textContent=body; d.appendChild(s); }
    return d;
  };
  if(!r) return driven ? say('warn','Structure du fichier non lue',
    'Impossible de compter ses images-clés. S\u2019il saccade, préparez-le pour le défilement.') : null;
  const fps = r.seconds>0 ? r.frames/r.seconds : null;
  const rate = fps ? r.frames+' images pour '+r.seconds.toFixed(1).replace('.',',')+' s, soit '+
    Math.round(fps)+' par seconde' : r.frames+' images';
  const gop = r.keys ? r.frames/r.keys : r.frames;
  const keysTxt = r.keys<=1 ? 'une seule image-clé' : 'une image-clé toutes les '+Math.round(gop)+' images';
  const redo = driven ? '« Préparer pour le défilement »' : '« Convertir en WebM »';
  if(r.container==='WebM' && !r.duration && !r.index && r.keys<=2)
    return say('bad','WebM de l\u2019ancienne conversion',
      rate+'. L\u2019enregistrement en direct a perdu des images en route : '+
      (driven?'la vidéo démarre désormais, mais son mouvement restera haché. ':'la lecture est saccadée. ')+
      'Rechargez la vidéo d\u2019origine, celle d\u2019avant la conversion, puis cliquez sur '+redo+'.');
  if(fps && fps<15)
    return say('warn','Seulement '+Math.round(fps)+' images par seconde',
      rate+' : le mouvement restera haché, même bien encodé. Si vous avez la vidéo '+
      'd\u2019origine, rechargez-la puis cliquez sur '+redo+'.');
  if(!driven) return null;
  if(gop>12)
    return say('warn','Trop peu d\u2019images-clés pour le défilement',
      rate+', '+keysTxt+'. Pour afficher une position, le navigateur doit décoder '+
      'toutes les images depuis la dernière image-clé : le mouvement saccade. Préparez le fichier.');
  if(r.container==='WebM' && (!r.duration || !r.index))
    return say('warn','Fichier incomplet',
      (r.duration?'':'Durée absente. ')+(r.index?'':'Index absent. ')+'Une conversion le corrige.');
  return say('ok','Prêt pour le défilement', rate+', '+keysTxt+'.');
}

/* ---------------------------------------------------------------
   BRUITAGES — ElevenLabs, via le même relais
   Le worker doit exposer une route « eleven-sfx » qui relaie
   https://api.elevenlabs.io/v1/sound-generation avec l'en-tête xi-api-key.
   Comme pour la voix, le MP3 est fabriqué ici et devient un média du projet.
   --------------------------------------------------------------- */
const SFX_ROUTES = ['proxy/eleven-sfx','eleven-sfx'];

async function elevenSfx(prompt, seconds, influence){
  const v=story.voice;
  if(!(v.secret||'').trim())
    throw new Error('Mot de passe du relais manquant : renseignez-le dans Ambiance.');
  const routes = story.sfxRoute ? [story.sfxRoute] : SFX_ROUTES;
  const body = JSON.stringify({
    text: prompt,
    duration_seconds: Math.max(0.5, Math.min(22, seconds||4)),
    prompt_influence: influence==null?0.35:influence
  });
  const errs=[];
  for(const r of routes){
    const url = /^https?:/.test(r) ? r : WORKER+'/'+r.replace(/^\//,'');
    let res;
    try{
      res = await fetch(url,{ method:'POST',
        headers:{ 'Content-Type':'application/json', 'X-App-Secret':v.secret.trim() },
        body:body });
    }catch(e){ errs.push(r+' → réseau : '+e.message); continue; }
    const type=res.headers.get('content-type')||'';
    if(res.ok && type.indexOf('json')<0){
      const buf=await res.arrayBuffer();
      if(buf.byteLength<512){ errs.push(r+' → audio vide'); continue; }
      story.sfxRoute=r;
      return new Uint8Array(buf);
    }
    let detail;
    try{ detail=(await res.text()).slice(0,200); }catch(e){ detail='(corps illisible)'; }
    errs.push(r+' → '+res.status+' '+detail);
    if(res.status===401) throw new Error('Mot de passe refusé par le relais.');
  }
  const all=errs.join('  |  ');
  if(all.indexOf('404')>=0)
    throw new Error('Route absente du worker. Ajoutez-y une branche « eleven-sfx » qui relaie ElevenLabs. '+all);
  throw new Error('Bruitage non généré. '+all);
}

async function generateSfx(ch,f){
  const prompt=(f.prompt||'').trim();
  if(!prompt){ toast('Décrivez le son à produire','bad'); return; }
  try{
    toast('Génération du bruitage\u2026');
    const bytes=await elevenSfx(prompt,f.duration,f.influence);
    const key=uid();
    ASSETS.set(key,{name:'sfx_'+key+'.mp3',mime:'audio/mpeg',kind:'audio',bytes:bytes,b64:null});
    if(f.asset) dropAsset(f.asset);
    f.asset=key;
    if(!f.label) f.label=prompt.slice(0,28);
    renderAll(true);
    toast('Bruitage obtenu — '+fmtBytes(bytes.length));
  }catch(e){ console.error(e); toast(e.message,'bad'); }
}

/* ---------------------------------------------------------------
   VOIX — Hume, via le relais Cloudflare
   La clé n'entre jamais dans la page exportée : on fabrique le MP3 ici,
   il devient un média du projet, et la page finale ne fait que le lire.
   --------------------------------------------------------------- */
const WORKER = 'https://routeur-ia-proxy.zacharybov.workers.dev';
/* Le worker retire le préfixe /proxy/ ; selon la façon dont la route est
   déclarée côté Cloudflare, l'une ou l'autre forme aboutit. */
const VOICE_ROUTES = ['proxy/hume-tts','hume-tts'];

/* Le worker n'autorise qu'un seul en-tête d'authentification, X-App-Secret :
   son CORS ne déclare que « Content-Type, X-App-Secret ». En envoyer d'autres
   ferait échouer le pré-vol avant même d'atteindre la route. */
/* Une voix de la bibliothèque Hume se demande avec HUME_AI ; CUSTOM_VOICE ne
   cherche que parmi les voix enregistrées sur votre compte. Une voix peut aussi
   être désignée par son nom plutôt que par son identifiant. */
function humeBody(text, provider){
  const v=story.voice;
  const voice = v.idMode==='name' ? { name:v.voiceId.trim() } : { id:v.voiceId.trim() };
  voice.provider = provider || v.provider || 'HUME_AI';
  const u = { text:text, voice:voice, speed:v.speed, trailing_silence:v.trailingSilence };
  if((v.description||'').trim()) u.description = v.description.trim();
  return { utterances:[u], format:{ type:'mp3' } };
}

/* La route relaie /v0/tts/file, qui renvoie directement les octets du MP3.
   En cas d'échec le worker répond du JSON : on distingue les deux au type. */
async function humeSynth(text){
  const v=story.voice;
  if(!(v.secret||'').trim())
    throw new Error('Mot de passe du relais manquant : renseignez-le dans Ambiance, section Voix.');
  if(!(v.voiceId||'').trim())
    throw new Error('Aucune voix indiquée.');

  const routes = v.endpoint ? [v.endpoint] : VOICE_ROUTES;
  /* si la voix n'est pas trouvée, on retente avec l'autre fournisseur */
  const provs = [v.provider||'HUME_AI'];
  provs.push(provs[0]==='HUME_AI' ? 'CUSTOM_VOICE' : 'HUME_AI');
  const errs = [];

  for(const r of routes){
    const url = /^https?:/.test(r) ? r : WORKER+'/'+r.replace(/^\//,'');
    for(const prov of provs){
      let res;
      try{
        res = await fetch(url,{
          method:'POST',
          headers:{ 'Content-Type':'application/json', 'X-App-Secret':v.secret.trim() },
          body:JSON.stringify(humeBody(text, prov))
        });
      }catch(e){ errs.push(r+' → réseau : '+e.message); break; }

      const type = res.headers.get('content-type')||'';
      if(res.ok && type.indexOf('json')<0){
        const buf = await res.arrayBuffer();
        if(buf.byteLength<512){ errs.push(r+'/'+prov+' → audio vide'); continue; }
        story.voice.endpoint = r;
        story.voice.provider = prov;      /* on retient ce qui a fonctionné */
        return new Uint8Array(buf);
      }
      let detail;
      try{ detail=(await res.text()).slice(0,200); }catch(e){ detail='(corps illisible)'; }
      errs.push(prov+' → '+res.status+' '+detail);
      if(res.status===401) return Promise.reject(new Error('Mot de passe refusé par le relais.'));
      if(res.status!==404) break;         /* seul un 404 justifie de changer de fournisseur */
    }
  }

  const all=errs.join('  |  ');
  if(all.indexOf('does not exist')>=0 || all.indexOf('not found')>=0)
    throw new Error('Voix introuvable. Vérifiez l\u2019identifiant, ou passez en « désignée par son nom ». '+all);
  throw new Error('Hume n\u2019a pas répondu. '+all);
}

async function generateVoice(beat){
  const text=(beat.voiceText||beat.text||'').trim();
  if(!text){ toast('Ce texte est vide','bad'); return; }
  try{
    toast('Synthèse de la voix\u2026');
    const bytes=await humeSynth(text);
    const key=uid();
    ASSETS.set(key,{name:'voix_'+key+'.mp3',mime:'audio/mpeg',kind:'audio',bytes:bytes,b64:null});
    if(beat.voice) dropAsset(beat.voice);
    beat.voice=key;
    renderAll(true);
    toast('Voix enregistrée — '+fmtBytes(bytes.length));
  }catch(e){
    console.error(e);
    toast(e.message,'bad');
  }
}

/* ---------------------------------------------------------------
   PROJET
   --------------------------------------------------------------- */
document.getElementById('btnSave').addEventListener('click',()=>{
  try{
    const assets={};
    for(const [k,a] of ASSETS){
      if(a.b64===null) a.b64=bytesToB64(a.bytes);
      assets[k]={name:a.name,mime:a.mime,kind:a.kind,b64:a.b64};
    }
    const clean=JSON.parse(JSON.stringify(story));
    if(clean.voice) delete clean.voice.secret;   /* le mot de passe ne quitte pas la session */
    download(new Blob([JSON.stringify({v:5,story:clean,assets:assets})],{type:'application/json'}),
      slug(story.title)+'.recit.json');
    toast('Projet enregistré');
  }catch(e){ console.error(e); toast('Enregistrement impossible : '+e.message,'bad'); }
});

/* ---------------------------------------------------------------
   MISE À NIVEAU D'UN PROJET ENREGISTRÉ
   Un projet construit au fil de plusieurs versions de l'outil n'a pas
   les réglages apparus depuis. Avant, seuls les textes étaient complétés
   à l'ouverture : un chapitre ancien arrivait sans ses réglages récents
   et l'inspecteur s'arrêtait sur le premier curseur sans valeur. On
   complète désormais chaque objet avec les valeurs par défaut de la
   version courante — sans jamais toucher à ce qui a été réglé.
   --------------------------------------------------------------- */
const COLLECTIONS=['beats','spots','buttons','zones','orns','sfx'];
/* noms des effets d'apparition dans les premières versions */
const ANIM_ALIAS={rise:'slideUp',drop:'slideDown',left:'slideLeft',right:'slideRight',
  blur:'blurIn',scale:'scaleUp',shrink:'scaleDown',wipe:'wipeUp',wipeX:'maskSlide',
  flip:'flipX',spin:'rotateIn'};
const isObj=x=>!!x&&typeof x==='object'&&!Array.isArray(x);
const cloneVal=v=>(v&&typeof v==='object')?JSON.parse(JSON.stringify(v)):v;

function fillDefaults(obj,def,count){
  Object.keys(def).forEach(k=>{
    const d=def[k], v=obj[k];
    if(v===undefined||(v===null&&d!==null)){ obj[k]=cloneVal(d); if(count) count.n++; return; }
    if(typeof d==='number'){
      /* une valeur devenue NaN est enregistrée null par JSON : on la répare */
      if(typeof v!=='number'||!isFinite(v)){
        const x=parseFloat(v); obj[k]=isFinite(x)?x:d; if(count) count.n++;
      }
      return;
    }
    if(Array.isArray(d)){
      if(!Array.isArray(v)){ obj[k]=cloneVal(d); if(count) count.n++; return; }
      /* vecteurs de nombres : positions de caméra, point d'ancrage */
      if(d.length&&d.every(x=>typeof x==='number')){
        const fixed=d.map((x,i)=>(typeof v[i]==='number'&&isFinite(v[i]))?v[i]:x);
        if(v.length!==d.length||fixed.some((x,i)=>x!==v[i])){ obj[k]=fixed; if(count) count.n++; }
      }
      return;
    }
    if(isObj(d)&&isObj(v)) fillDefaults(v,d,count);
  });
  return obj;
}

function fixAnim(o,stats){
  const known=new Set(ANIMS.map(a=>a[0]));
  if(ANIM_ALIAS[o.anim]){ o.anim=ANIM_ALIAS[o.anim]; stats.anims++; }
  else if(!known.has(o.anim)){ o.anim='fade'; stats.anims++; }
}

function upgradeChapter(c,stats){
  const type=['model','video','image','text'].indexOf(c.type)>=0?c.type:'text';
  c.type=type;
  const count={n:0};
  /* avant le menu Lecture, seule la case « en boucle » existait */
  if(type==='video'&&!c.playMode){ c.playMode=c.loop===false?'once':'loop'; count.n++; }
  /* l'ancien bouton unique « chapitre suivant » rejoint la liste des boutons */
  if(c.nextBtn&&!(Array.isArray(c.buttons)&&c.buttons.length)){
    c.buttons=[newButton({label:c.nextLabel||'Continuer',target:'next'})]; count.n++;
  }
  delete c.nextBtn; delete c.nextLabel;

  const def=newChapter(type);
  COLLECTIONS.forEach(k=>{ def[k]=[]; c[k]=Array.isArray(c[k])?c[k].filter(isObj):[]; });
  fillDefaults(c,def,count);
  c.beats.forEach(b=>{ fillDefaults(b,newBeat({kind:b.kind==='title'?'title':'body'}),count); fixAnim(b,stats); });
  c.buttons.forEach(b=>{ fillDefaults(b,newButton(),count); fixAnim(b,stats); });
  c.spots.forEach(x=>fillDefaults(x,newSpot(),count));
  c.zones.forEach(x=>fillDefaults(x,newZone(),count));
  c.orns.forEach(x=>fillDefaults(x,newOrn(),count));
  c.sfx.forEach(x=>fillDefaults(x,newSfx(),count));
  if(count.n){ stats.chapters++; stats.fields+=count.n; }
  return c;
}

function upgradeStory(raw){
  if(!isObj(raw)) throw new Error('Ce fichier n\u2019est pas un projet Récit.');
  const stats={chapters:0,fields:0,anims:0};
  const base=blankStory(); base.chapters=[];
  fillDefaults(raw,base);
  if(!Array.isArray(raw.chapters)) raw.chapters=[];
  /* les valeurs par défaut doivent prendre le thème du projet ouvert */
  const prev=story;
  story=raw;
  try{ raw.chapters=raw.chapters.filter(isObj).map(c=>upgradeChapter(c,stats)); }
  finally{ story=prev; }
  const seen=new Set();
  raw.chapters.forEach(c=>{ if(!c.id||seen.has(c.id)) c.id=uid(); seen.add(c.id); });
  return {story:raw,stats:stats};
}

/* Tout est préparé avant de toucher à l'état courant : un fichier illisible
   laisse l'éditeur tel qu'il était au lieu de le laisser à moitié chargé. */
function loadProject(j){
  if(!j||!isObj(j.story)) throw new Error('Ce fichier n\u2019est pas un projet Récit.');
  const up=upgradeStory(j.story);
  const assets=new Map(), src=j.assets||{};
  Object.keys(src).forEach(k=>{
    const a=src[k]; if(!a||typeof a.b64!=='string') return;
    assets.set(k,{name:a.name,mime:a.mime,kind:a.kind||assetKindOf(a.name||''),
      bytes:b64ToBytes(a.b64),b64:a.b64});
  });
  for(const old of ASSETS.values()) revokeLater(old.url);
  ASSETS.clear(); assets.forEach((v,k)=>ASSETS.set(k,v));
  story=up.story;
  document.getElementById('storyTitle').value=story.title;
  selId=story.chapters.length?story.chapters[0].id:null;
  selBeatId=null; spotSel=-1; openBeat=null; openGroup=null; insTab='media';
  return up.stats;
}

document.getElementById('btnOpen').addEventListener('click',()=>{

  i.addEventListener('change',async()=>{
